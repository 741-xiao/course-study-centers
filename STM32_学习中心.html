<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="STM32 分步备考学习中心：知识讲解、引导式教学、客观题与大题专练、模拟考试、错题重练与学习报告。离线可用。">
<title>STM32 · 完整学习中心</title>
<style>:root{
  --bg:#f4f6fb; --card:#fff; --line:#e2e8f2; --line2:#eef2f9;
  --ink:#16202f; --muted:#5d6b80; --dim:#8a95a6;
  --navy:#0f2440; --navy2:#17365e; --brand:#2f6fdb; --brand-d:#1d4ed8;
  --teal:#0f766e; --purple:#6846bd; --amber:#b45309;
  --blue-bg:#eef4ff; --green-bg:#ecfdf5; --purple-bg:#f5f3ff; --amber-bg:#fff7ed;
  --ok:#15803d; --bad:#b91c1c;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(22,32,47,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);background:#eef1f5;border:1px solid #e0e5ec;border-radius:4px;padding:1px 5px;font-size:.9em;color:#243b6b}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:52px;display:flex;align-items:center;gap:14px;padding:0 18px}
.top .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--navy),#2f6fdb);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.top b{font-size:13.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{color:#c8d2e2}
.top .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim)}
.top .right a{color:var(--muted)}
.top .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px}

/* ---------- 三栏 ---------- */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 296px;max-width:1380px;margin:0 auto;align-items:start}
aside.side{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:20px 14px 36px}
.side .brand{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.35}
.side .brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:4px;letter-spacing:.4px}
.prog{background:linear-gradient(135deg,#eef4ff,#f7faff);border:1px solid #dbe7ff;border-radius:10px;padding:10px 12px;margin:14px 0 12px;font-size:12px;color:#274a8c}
.prog .pt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog .pt span{font-size:11.5px;line-height:1.4}
.prog .pt b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;flex:none}
.progbar{height:5px;background:#d5e2fb;border-radius:5px;margin-top:7px;overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fdb,#5b9bff);border-radius:5px;transition:width .3s}
.side .grp{margin:16px 0 5px;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.9px;padding-left:6px;text-transform:uppercase}
.side a.toc{display:flex;gap:7px;align-items:baseline;font-size:12.8px;line-height:1.45;color:#3b4657;padding:5px 8px;border-radius:6px;border-left:2px solid transparent}
.side a.toc:hover{background:var(--blue-bg);color:var(--brand-d)}
.side a.toc.on{background:var(--blue-bg);color:var(--brand-d);border-left-color:var(--brand);font-weight:700}
.side a.toc .num{font-family:var(--mono);color:#9aa4b2;font-size:10.5px;min-width:15px}
.side .tip{margin-top:20px;font-size:11.4px;color:var(--dim);line-height:1.7;border-top:1px dashed var(--line);padding-top:12px}

main{padding:0 28px 80px;min-width:0}
main:focus{outline:none}
aside.rail{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;padding:20px 18px 40px;border-left:1px solid var(--line);background:#fbfcff}
.rail .k{font-size:9.5px;letter-spacing:1.6px;color:var(--dim);font-weight:800;text-transform:uppercase}
.rail h3{margin:4px 0 12px;font-size:17px}
.rail .big{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.rail .big small{font-size:13px;color:var(--dim);font-weight:400}
.rail .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px;color:var(--muted)}
.rail .row b{color:var(--ink);font-variant-numeric:tabular-nums}
#saveWarn{background:#fff8ec;border-bottom:1px solid #f6dfb6;color:#8a5a12;padding:7px 14px;font-size:12.5px;text-align:center;position:sticky;top:52px;z-index:35}
.rail .blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rail .q{font-size:12px;color:var(--muted);line-height:1.65}
.rail .next{display:block;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--navy);color:#fff;text-align:center;font-size:12.5px;font-weight:700}
.rail .mini{display:flex;gap:6px;flex-wrap:nowrap;margin-top:8px}
.rail .mini a{flex:1 1 0;min-width:0;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:11px;color:var(--muted);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 首页 ---------- */
.hero{position:relative;margin:22px 0 18px;border-radius:16px;overflow:hidden;background:linear-gradient(120deg,#0d2140 0%,#123059 62%,#1b4476 100%);color:#fff;padding:28px 30px 26px;box-shadow:0 6px 24px rgba(15,36,64,.16)}
.hero .kick{font-size:10.5px;letter-spacing:2.2px;color:#9fc0ea;font-weight:700;text-transform:uppercase}
.hero h1{margin:7px 0 8px;font-size:30px;letter-spacing:.5px;line-height:1.25}
.hero p{margin:0;color:#c9d8ec;font-size:13.6px;max-width:560px}
.hero .met{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.hero .met span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:3px 11px;font-size:11.5px;color:#dce8f8}
.hero .acts{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.hero .acts a,.hero .acts button{border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.hero .acts .pri{background:#fff;color:var(--navy);border-color:#fff}
.hero .deco{position:absolute;right:0;top:0;bottom:0;width:42%;opacity:.55;pointer-events:none}

.groups{margin-top:8px}
.chead{display:flex;align-items:baseline;gap:10px;margin:22px 0 9px;border-bottom:1px solid var(--line);padding-bottom:7px}
.chead h2{margin:0;font-size:14.5px;letter-spacing:.4px}
.chead h2 .n{color:var(--dim);font-family:var(--mono);font-size:12px;margin-right:7px}
.chead small{margin-left:auto;color:var(--dim);font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:12px;padding:14px 14px 12px;color:#fff;min-height:118px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,32,47,.14)}
.tile .ic{width:22px;height:22px;margin-bottom:8px;opacity:.92}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14.5px;font-weight:800;letter-spacing:.2px}
.tile span{font-size:11.5px;opacity:.82;line-height:1.5;margin-top:2px}
.tile small{margin-top:auto;font-size:11px;opacity:.9;padding-top:8px}
.tile.navy{background:linear-gradient(150deg,#16345c,#0f2440)}
.tile.blue{background:linear-gradient(150deg,#2f6fdb,#1d4ed8)}
.tile.green{background:linear-gradient(150deg,#12876f,#0f766e)}
.tile.purple{background:linear-gradient(150deg,#7b57cf,#5b3aa8)}
.tile.orange{background:linear-gradient(150deg,#c4700f,#9a4f08)}
.tile .dot{position:absolute;right:-18px;bottom:-18px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.07)}

.entrylinks{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.entrylinks a{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.entrylinks a b{color:var(--ink)}
.entrylinks a:hover{border-color:#c9d8f2;color:var(--brand-d)}

.sec{margin:30px 0 10px;font-size:15px;display:flex;align-items:center;gap:9px}
.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand)}
.chaplist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow);display:block;color:inherit}
.chcard:hover{border-color:#c9d8f2}
.chcard .r{display:flex;align-items:center;gap:8px}
.chcard .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chcard b{font-size:13.5px}
.chcard .bar{height:4px;background:var(--line2);border-radius:4px;margin-top:9px;overflow:hidden}
.chcard .bar i{display:block;height:100%;background:var(--teal)}
.chcard small{color:var(--dim);font-size:11px;display:block;margin-top:6px}

/* ---------- 通用 ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:18px 0 8px}
.crumb a{color:var(--muted)}
.ph{margin:6px 0 4px;font-size:24px;letter-spacing:.3px}
.psub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);margin:12px 0}
.panel h3{margin:0 0 10px;font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=search],input[type=number],input[type=text],textarea{border:1px solid #cfd9e8;border-radius:8px;padding:7px 10px;background:#fff;font-size:13.5px;min-height:37px}
textarea{width:100%;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(47,111,219,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfd9e8;background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ink);font-weight:600}
.btn:hover{border-color:#9fb6da;background:#f8faff}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#17365e}
.btn.green{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--blue-bg);border-color:#bfd4f7;color:var(--brand-d);font-weight:700}
.badge{display:inline-block;border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:700;line-height:1.7;vertical-align:1px}
.badge.g{background:var(--green-bg);color:var(--ok)}
.badge.b{background:var(--blue-bg);color:var(--brand-d)}
.badge.o{background:var(--amber-bg);color:var(--amber)}
.badge.p{background:var(--purple-bg);color:var(--purple)}
.badge.r{background:#fef2f2;color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11.5px}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* ---------- 文档 ---------- */
.doc{font-size:15px;line-height:1.85;color:#263449;min-width:0}
.doc p{margin:9px 0}
.doc ul,.doc ol{padding-left:22px;margin:8px 0}
.doc li{margin:4px 0}
.doc b{color:#0f2a5c}
.doc h4{margin:18px 0 6px;font-size:15.5px}
.doc .eq{font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;font-size:17px;line-height:2.05}
.doc .formula{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 16px 12px;margin:12px 0;text-align:center;overflow-x:auto;overflow-y:hidden}
.doc .formula .eq{font-size:17.5px;line-height:2.3}
.doc .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .22em;font-size:.96em;line-height:1.15}
.doc .fr>.fn{border-bottom:1.2px solid currentColor;padding:0 .28em .06em}
.doc .fr>.fd{padding:.04em .28em 0}
.doc .intg,.doc .sum{white-space:nowrap}
.doc .intg>.lim,.doc .sum>.lim{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.56em;line-height:1.15;margin:0 .1em 0 -.05em;text-align:left}
.doc .intg>.lim>.u,.doc .sum>.lim>.u{order:1}
.doc .intg>.lim>.l,.doc .sum>.lim>.l{order:2}
.doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.8px;background:#fff}
.doc th,.doc td{border:1px solid #e3e9f3;padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:#f5f8fd;color:#0f2a5c;font-weight:800;font-size:13px}
.doc .tablewrap{overflow-x:auto;max-width:100%;margin:12px 0;border-radius:8px}
.doc .tablewrap table{margin:0;min-width:560px}
.doc td:first-child,.doc th:first-child{min-width:74px}
.doc td:last-child,.doc th:last-child{min-width:112px}
.doc .kp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:0 12px 12px 0;padding:13px 17px;margin:14px 0}
.doc .kp .t{font-weight:800;color:var(--brand-d);font-size:15.5px;display:block;margin-bottom:3px}
.doc .tip{background:#fff8ec;border:1px solid #f6dfb6;border-radius:11px;padding:11px 15px;margin:12px 0;font-size:14.4px}
.doc .tip b{color:var(--amber)}
.doc .warn{background:#fef2f2;border:1px solid #f6cdcd;border-radius:11px;padding:11px 15px;margin:12px 0;font-size:14.4px}
.doc .warn b{color:var(--bad)}
.doc .note{background:#f0f9ff;border:1px solid #cfe8fb;border-radius:11px;padding:11px 15px;margin:12px 0}
.doc .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin:10px 0;font-size:14px}
.doc .ch-intro{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 17px;margin:10px 0 16px;font-size:14.3px;color:#41506a}
.doc .ch-intro b{color:#0f2a5c}
.doc .lead{color:var(--muted);font-size:13.7px}
.doc .eg{background:#fff;border:1px solid var(--line);border-radius:13px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
.doc .eg-h{background:linear-gradient(90deg,#edf3ff,#f9fbff);padding:9px 15px;font-weight:800;color:var(--brand-d);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14.5px}
.doc .eg-h .tag{font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:1px 8px;flex:none}
.doc .eg-h .tag.g{background:var(--teal)}
.doc .eg-b{padding:11px 16px 13px}
.doc details.sol{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.doc details.sol summary{cursor:pointer;color:var(--brand);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:13.8px;user-select:none}
.doc details.sol summary::-webkit-details-marker{display:none}
.doc details.sol summary::before{content:"▸";display:inline-block;transition:transform .2s}
.doc details.sol[open] summary::before{transform:rotate(90deg)}
.doc details.sol .body{margin-top:8px;font-size:14.5px}
.doc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc .qs .q{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin:8px 0;font-size:14.3px}
.doc .qs .q::before{content:"›";color:var(--brand);font-weight:800;margin-right:7px}
.doc img{max-width:100%;height:auto}

/* ---------- 阅读器 ---------- */
.reader{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.rnav{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.rnav a{display:block;font-size:12.3px;line-height:1.45;color:#42506a;padding:6px 9px;border-radius:6px}
.rnav a:hover{background:var(--blue-bg)}
.rnav a.on{background:var(--blue-bg);color:var(--brand-d);font-weight:700}
.rnav .h{font-size:10.5px;color:var(--dim);letter-spacing:.7px;font-weight:800;padding:6px 9px 3px}
.rbody{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px 30px;box-shadow:var(--shadow)}
.rbody h2{margin:0 0 6px;font-size:21px}
.rbody .meta{font-size:12px;color:var(--dim);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.rbody .secbody{border-top:1px solid var(--line2);padding-top:16px;margin-top:18px}
.rbody .secbody:first-of-type{border-top:0;margin-top:8px;padding-top:0}
.rbody h3{font-size:17px;margin:4px 0 10px}
.rtools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}

/* ---------- 题库 ---------- */
body.bank .rail,body.bank .side{display:none}
body.bank .menu{display:none}
body.bank .layout{grid-template-columns:minmax(0,1fr)}
body.bank main{max-width:900px;margin:0 auto;padding:0 22px 80px}
.bhead{margin:22px 0 6px}
.bhead .bk{font-size:10.5px;letter-spacing:2px;color:var(--dim);font-weight:800;text-transform:uppercase}
.bhead h1{font-size:28px;margin:5px 0 4px}
.bhead p{margin:0;color:var(--muted);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.filters select,.filters input{width:100%;min-width:0}
.qjump{display:flex;gap:8px;align-items:center;margin:8px 0 14px}
.qjump select{flex:1;min-width:0}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 20px 15px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);margin-bottom:9px}
.qmeta .no{font-weight:800;color:var(--brand-d);font-size:13px}
.qmeta .src{margin-left:auto}
.qmeta .sp{color:#c8d2e2}
.qstem{font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.qstem .ln{display:inline}
.opts{display:grid;gap:7px;margin:13px 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid #d7e0ee;background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;line-height:1.7;color:#243247;width:100%}
.opt:hover{border-color:#9fb6da;background:#f9fbff}
.opt .k{font-weight:800;color:var(--brand-d);flex:none;width:16px}
.opt .oh{min-width:0;overflow-wrap:anywhere}
.opt.pick{border-color:var(--brand);background:var(--blue-bg)}
.opt.right{border-color:#86c9a4;background:#f0fbf4}
.opt.wrong{border-color:#e6a3a3;background:#fef2f2}
.opt:disabled{cursor:default}
.opt .eq{font-family:"Cambria Math",Cambria,Georgia,serif}
.judge{display:flex;gap:9px;margin:13px 0 4px}
.judge button{min-width:88px;border:1px solid #d7e0ee;background:#fff;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700}
.judge button:hover{border-color:#9fb6da}
.judge button.right{border-color:#86c9a4;background:#f0fbf4;color:var(--ok)}
.judge button.wrong{border-color:#e6a3a3;background:#fef2f2;color:var(--bad)}
.fills{margin:12px 0 4px;display:grid;gap:8px}
.fillrow{display:flex;gap:9px;align-items:center}
.fillrow span{font-size:11.5px;color:var(--dim);min-width:34px}
.fillrow input{flex:1}
.fillrow .mark{font-weight:800;min-width:18px}
.fillrow .mark.ok{color:var(--ok)}
.fillrow .mark.no{color:var(--bad)}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:13px}
.qfoot .state{font-size:11.5px;color:var(--dim);margin-left:2px}
.feed{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
.feed .ans{background:#f0fbf4;border:1px solid #cfe9d8;border-radius:9px;padding:9px 13px;font-size:14px;margin:8px 0}
.feed .ans b{color:var(--ok)}
.feed .why{font-size:14px;color:#3b4a61}
.feed .cause{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.navq{display:flex;justify-content:space-between;gap:8px;margin:14px 0 0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- 训练/考试 ---------- */
.drillbar{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.drillbar .bar{flex:1}
.drillbar small{font-size:11.5px;color:var(--dim);white-space:nowrap}
.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.result .big{font-size:44px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.result .big small{font-size:15px;color:var(--dim);font-weight:400}
.timer{font-family:var(--mono);font-size:14px;background:#0f2440;color:#fff;border-radius:8px;padding:5px 11px}
.examq{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:11px 0}
.examq .qn{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.review{border-left:3px solid var(--line);padding-left:12px;margin:12px 0}
.review.ok{border-color:#86c9a4}
.review.no{border-color:#e6a3a3}

/* ---------- 工具 ---------- */
.tool{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.tool .out{background:#0f2440;color:#e7f0fb;border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.8}
.tool .out b{color:#fff;font-size:22px;font-variant-numeric:tabular-nums}
.tool .out code{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.field{display:block;margin:10px 0;font-size:12px;color:var(--muted)}
.field input,.field select{display:block;width:100%;margin-top:4px}
.field input[type=range]{margin-top:8px}
.field input[type=range]{width:100%;min-height:26px}
.field .v{font-weight:800;color:var(--ink);font-size:13.5px}
.labtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.labtab{text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.labtab:hover{transform:translateY(-1px);border-color:#b9cdea}
.labtab b{display:block;font-size:13px;color:var(--ink);line-height:1.4}
.labtab span{display:block;font-size:10.8px;color:var(--muted);margin-top:2px;line-height:1.45}
.labtab.on{border-color:#9fb6da;background:var(--blue-bg);box-shadow:0 0 0 2px rgba(47,111,219,.08)}
.labtab.on b{color:var(--brand-d)}
.labnote{font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:8px}
.vbar{height:8px;background:#e6edf8;border-radius:6px;overflow:hidden;margin:9px 0 4px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fdb,#69a6f5);border-radius:6px;transition:width .2s}
.vscale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);gap:4px}
.dfm{display:grid;gap:6px;margin-top:8px}
.dfm .r{display:flex;align-items:center;gap:8px;font-size:12.2px;border-bottom:1px dashed rgba(255,255,255,.14);padding-bottom:5px;color:#dbe7f6}
.dfm .r b{margin-left:auto;flex:none}
.powergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin:6px 0 2px}
.powergrid .field{margin:0}
.checkline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:9px 0 2px;line-height:1.5}
.checkline input{width:14px;height:14px;min-height:0;margin:0}
.pwsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.pwsum div{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
.pwsum small{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}
.pwsum b{display:block;font-size:16.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.verdict{padding:11px 14px;border-radius:10px;font-size:13.4px;line-height:1.75;margin:10px 0;border:1px solid}
.verdict.bad{background:#fef2f2;border-color:#f2c9c9;color:#7f1d1d}
.verdict.warn{background:#fff8ec;border-color:#f1dab3;color:#7a4a0c}
.verdict.ok{background:#f0fbf4;border-color:#c9e7d4;color:#14532d}
table.tb tr.cur td{background:#eef4ff}
.pwtb th,.pwtb td{white-space:nowrap}
@media(max-width:700px){
  .pwtb thead{display:none}
  .pwtb,.pwtb tbody,.pwtb tr,.pwtb td{display:block;width:100%}
  .pwtb{margin:0;border:0;background:transparent}
  .pwtb tr{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:7px 11px;background:#fff}
  .pwtb tr.cur{background:#eef4ff;border-color:#bcd4f6}
  .pwtb td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:3px 0;font-size:12.5px;text-align:right;white-space:normal}
  .pwtb td::before{content:attr(data-l);color:var(--muted);font-weight:600;text-align:left;flex:none}
  .pwtb td:first-child{font-weight:800;color:var(--brand-d);font-size:13.5px;border-bottom:1px dashed var(--line);margin-bottom:5px;padding-bottom:6px}
  .pwtb td:first-child{justify-content:space-between}
}



canvas{display:block;width:100%;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.tool>*{min-width:0}
.deriv{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin:10px 0;background:#fff}
.deriv h4{margin:0 0 6px;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 10px 8px 34px;border-bottom:1px dashed var(--line2);font-size:13.5px}
.steps li::before{content:counter(s);position:absolute;left:4px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--blue-bg);color:var(--brand-d);font-size:11px;font-weight:800;display:grid;place-items:center}

/* ---------- 表格/列表 ---------- */
.list{display:grid;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.li .no{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:52px}
.li .body{flex:1;min-width:0}
.li .act{display:flex;gap:5px;flex:none}
.tablewrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.tb th{background:#f5f8fd;font-weight:800;color:#0f2a5c}

/* ---------- 闪卡 ---------- */
.flash{max-width:640px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:16px;min-height:260px;padding:26px 28px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(22,32,47,.06)}
.flash .fl{font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:800}
.flash .fb{flex:1;display:flex;align-items:center;font-size:16px;line-height:1.9;padding:14px 0}
.flash .fa{border-top:1px dashed var(--line);padding-top:14px;font-size:14px}
.flash .acts{display:flex;gap:8px;margin-top:14px}

/* ---------- 响应式 ---------- */
@media(max-width:1180px){
  .layout{grid-template-columns:236px minmax(0,1fr)}
  .labtabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  aside.rail{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;z-index:60;left:0;top:0;bottom:0;width:280px;height:100vh;transform:translateX(-102%);transition:transform .22s;box-shadow:0 10px 40px rgba(0,0,0,.2);padding-top:18px}
  body.nav-open aside.side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(12,22,38,.38);z-index:55}
  .top .menu{display:inline-flex}
  .top .sub,.top .sep{display:none}
  main{padding:0 14px 70px}
  .hero{padding:22px 20px 20px;border-radius:14px}
  .hero h1{font-size:23px}
  .hero .deco{opacity:.28;width:60%}
  .reader{grid-template-columns:minmax(0,1fr)}
  .rnav{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}
  .rnav .h{display:none}
  .rnav a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px}
  .rbody{padding:16px 15px 22px}
  .filters{grid-template-columns:1fr 1fr}
  .filters label:nth-child(3),.filters label:nth-child(4){grid-column:1/-1}
  .qjump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qjump select{grid-column:1/-1;grid-row:1;width:100%}
  .qjump #prev{grid-column:1;grid-row:2}
  .qjump #next{grid-column:2;grid-row:2}
  .top .right span{display:none}
  body.bank.nav-open::after{display:none}
  .grid2,.grid3,.tool{grid-template-columns:1fr}
  .labtabs{grid-template-columns:1fr 1fr}
  .powergrid{grid-template-columns:1fr 1fr}
  .pwsum{grid-template-columns:1fr 1fr}
  .labtabs .labtab:last-child:nth-child(odd){grid-column:1/-1}
  .chaplist{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{min-height:104px;padding:12px}
  .tile b{font-size:13.5px}
  .tile span{font-size:11px}
  .qcard{padding:14px 14px 13px}
  .bhead h1{font-size:23px}
  .doc{font-size:14.5px}
  .doc .eq{font-size:16px}
  body.bank main{padding:0 12px 70px}
}
@media(max-width:560px){
  .powergrid{grid-template-columns:1fr}
}
@media(max-width:420px){
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile b{font-size:12.8px}
  .hero h1{font-size:21px}
}
@media print{
  .top,aside.side,aside.rail,.filters,.qfoot,.navq,.hero .acts{display:none!important}
  .layout{display:block}
  body{background:#fff}
  .doc details.sol .body{display:block!important}
}
</style>

<script>window.COURSE={"id":"stm32","name":"STM32","chapters":[{"n":0,"title":"知识点速查","intro":"\u003cp>把零散题目归到几条主线：先记住它们，再去做题会快很多。\u003c/p>","sections":[{"id":"kb0","title":"① STM32F407ZGT6 关键参数（选择题高频）","html":"\u003ctable style=\"margin:6px 0\">\u003ctbody> \u003ctr>\u003ctd>内核\u003c/td>\u003ctd>\u003cb>ARM Cortex-M4\u003c/b>（带单精度 FPU、DSP/SIMD、单周期 MAC；\u003cb>没有\u003c/b> MVE/Helium）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>主频\u003c/td>\u003ctd>最高 \u003cb>168 MHz\u003c/b>（SYSCLK）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>存储\u003c/td>\u003ctd>1 MB Flash、192 KB SRAM（含 64 KB CCM）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>封装\u003c/td>\u003ctd>LQFP144，多数 I/O 支持 5V 容忍\u003c/td>\u003c/tr> \u003ctr>\u003ctd>ADC\u003c/td>\u003ctd>3 个 12 位 ADC，最多 24 个外部通道\u003c/td>\u003c/tr> \u003ctr>\u003ctd>NVIC\u003c/td>\u003ctd>82 个可屏蔽中断、16 级可编程优先级\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table> \u003cp style=\"margin-bottom:0\">FPU 编译选项：\u003cspan class=\"eq\">-mfloat-abi=hard -mfpu=fpv4-sp-d16\u003c/span>。开启 FPU 后仍需关注编译器选项与数据对齐，不是\"全自动加速\"。\u003c/p>"},{"id":"kb1","title":"② 时钟树与总线挂载（记这张表就够）","html":"\u003ctable style=\"margin:6px 0\">\u003cthead>\u003ctr>\u003cth style=\"width:34%\">外设\u003c/th>\u003cth>总线 / 时钟\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>USART1、USART6\u003c/td>\u003ctd>APB2\u003c/td>\u003c/tr> \u003ctr>\u003ctd>UART4、UART5、USART2/3\u003c/td>\u003ctd>APB1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>TIM2~TIM5\u003c/td>\u003ctd>APB1；定时器时钟为 APB1 的 1 倍或 2 倍频\u003c/td>\u003c/tr> \u003ctr>\u003ctd>GPIO\u003c/td>\u003ctd>AHB1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>SysTick\u003c/td>\u003ctd>\u003cb>Cortex-M4 内核内部\u003c/b>系统定时器，不挂 APB\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table> \u003cp style=\"margin-bottom:0\">25 MHz 外部晶振时，主 PLL 分频因子 \u003cb>M=25\u003c/b>，使 VCO 输入为 1 MHz。定时中断周期 \u003cspan class=\"eq\">T\u003csub>out\u003c/sub>=((arr+1)×(psc+1))/T\u003csub>clk\u003c/sub>\u003c/span>，\u003cspan class=\"eq\">psc\u003c/span> 是预分频器、\u003cspan class=\"eq\">arr\u003c/span> 是自动重装载值。SysTick 的 VAL 减到 0 会\u003cb>自动重装 LOAD\u003c/b> 继续计数。\u003c/p>"},{"id":"kb2","title":"③ NVIC 中断优先级与 FreeRTOS","html":"\u003cp style=\"margin:4px 0\">\u003cb>优先级数值越小，逻辑优先级越高。\u003c/b>抢占优先级（Preemption）决定能否\u003cb>打断\u003c/b>别人；响应优先级（Subpriority）只在\u003cb>同时到达\u003c/b>时决定执行顺序，\u003cb>不能嵌套打断\u003c/b>。\u003c/p> \u003cp style=\"margin-bottom:0\">FreeRTOS：ISR 里发队列用 \u003cspan class=\"eq\">xQueueSendFromISR()\u003c/span>（不是 xQueueSend）；耗时处理推迟到任务叫\u003cb>延迟中断处理 / deferred interrupt processing\u003c/b>；\u003cb>不是所有优先级\u003c/b>的中断都能安全调用 FreeRTOS API；ISR 中\u003cb>不能\u003c/b>用 \u003cspan class=\"eq\">vTaskDelay()\u003c/span>（会阻塞）。\u003c/p>"},{"id":"kb3","title":"④ GPIO 与通信接口","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>GPIO 输出方式 4 种（推挽、开漏、复用推挽、复用开漏），输入方式 4 种（浮空、上拉、下拉、模拟）；\u003c/li> \u003cli>I2C 的 SCL/SDA 必须\u003cb>复用开漏输出 + 外接上拉电阻\u003c/b>，不能直接推挽；7 位从机地址 0x50 传给 HAL 时要\u003cb>左移一位\u003c/b>写成 \u003cb>0xA0\u003c/b>；\u003c/li> \u003cli>HAL 阻塞发送：\u003cspan class=\"eq\">HAL_UART_Transmit()\u003c/span>；\u003cb>UART 只支持异步，USART 同步+异步\u003c/b>；波特率 = 每秒传输的\u003cb>码元（bit）\u003c/b>数；\u003c/li> \u003cli>CAN 控制器与总线之间必须经 \u003cb>CAN 收发器\u003c/b>；用 CAN2 前要先使能 \u003cb>CAN1\u003c/b> 时钟（CAN1 是主控制器）；\u003c/li> \u003cli>RS485 用\u003cb>差分信号\u003c/b>，RS232 用单端；RS485 收发器靠 \u003cb>DE/RE\u003c/b> 引脚切换收发方向，典型 1200 m / 32 个节点。\u003c/li> \u003c/ul>"},{"id":"kb4","title":"⑤ CubeMX + X-CUBE-AI 部署要点","html":"\u003cp style=\"margin:4px 0\">安装路径：\u003cb>Help → Manage embedded software packages → STMicroelectronics → X-CUBE-AI → Install\u003c/b>（CubeMX ≥ 6.9，需 ST 账号登录）。它\u003cb>不做训练\u003c/b>，只把 PC 端训练好的模型转换成优化 C 代码；支持 TFLite(.tflite)、Keras(.h5)、ONNX，\u003cb>不支持\u003c/b> PyTorch 原生 .pt、更不支持 Verilog HDL。\u003c/p> \u003cp style=\"margin:4px 0\">导入后点 \u003cb>Analyze\u003c/b> 查看 \u003cb>Flash / RAM / MACC\u003c/b> 占用；验证数值行为选 \u003cb>Validation\u003c/b> 模板；Optimization 选 \u003cb>Smallest\u003c/b> = 最小化内存占用、牺牲速度；量化用 \u003cb>8 位 INT8\u003c/b>，但\u003cb>可能损失精度\u003c/b>；还需额外开启 \u003cb>CRC\u003c/b> 外设。\u003c/p> \u003cp style=\"margin-bottom:0\">\u003cb>SYS → Debug 默认是 No Debug\u003c/b>，生成代码前必须改成 \u003cb>Serial Wire\u003c/b>，否则第一次烧录后 SWD 被禁用、第二次连不上。CubeMX 6.15 生成工程若报 \u003cspan class=\"eq\">undefined reference to ai_xxx_run\u003c/span>，通常是 AI Runtime 静态库 .a 没自动加入链接器，需手动补库名与搜索路径。\u003c/p>"},{"id":"kb5","title":"⑥ 嵌入式系统基础（概念题）","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>嵌入式系统最大特点是\u003cb>嵌入专用\u003c/b>；相对 PC 不具有\"可执行多任务\"这一通用特征的说法要按题意判断；处理器选型在\u003cb>体系结构设计\u003c/b>阶段完成；\u003c/li> \u003cli>工业控制最适合\u003cb>微控制器 MCU\u003c/b>；很少用于手机的嵌入式 OS 是 \u003cb>VxWorks\u003c/b>；采用同步时序协议的总线是 \u003cb>PCI\u003c/b>；\u003c/li> \u003cli>RTOS 分实时/非实时，实时又分\u003cb>硬实时\u003c/b>与软实时；任务间\"等待伙伴消息\"的制约合作叫\u003cb>同步\u003c/b>；\u003c/li> \u003cli>嵌入式处理器按用途分 MCU / MPU / SOC（\u003cb>FPGA 不属此类\u003c/b>）。\u003c/li> \u003c/ul>"},{"id":"kb6","title":"⑦ ARM-A53 / Linux / QT（同批课件题）","html":"\u003cp style=\"margin:4px 0\">S5P6818 是 64 位 \u003cb>Cortex-A53\u003c/b>（8 核），GPU 为 \u003cb>Mali-400\u003c/b>；交叉编译用 \u003cspan class=\"eq\">arm-linux-gcc\u003c/span>；串口终端常用波特率 \u003cb>115200\u003c/b>；内核镜像为 \u003cb>zImage\u003c/b>；驱动模块 .ko 用 \u003cspan class=\"eq\">insmod\u003c/span> 加载；设备树下注册 I2C 设备用 \u003cspan class=\"eq\">of_i2c_register_devices()\u003c/span>；fastboot 刷机需进入 UBOOT 的 fastboot 模式；\"Permission denied\" 用 \u003cspan class=\"eq\">chmod +x\u003c/span> 加执行权限。\u003c/p> \u003cp style=\"margin-bottom:0\">QT Creator 默认构建工具 \u003cb>qmake\u003c/b>，快速打开项目 \u003cb>Ctrl+Shift+O\u003c/b>，Linux 下默认编译器 \u003cb>GCC\u003c/b>；QT Creator 不只支持 C++，QT Designer 不能直接写 C++ 代码（在编辑器/槽函数里写）。\u003c/p>"},{"id":"kb7","title":"⑧ 综合实验通用套路（实验题都能套）","html":"\u003cp style=\"margin-bottom:0\">\u003cb>采集层\u003c/b>（SHT30 温湿度 / 光敏 / 超声波 / CO₂ 甲醛，I2C 或 GPIO）→ \u003cb>控制层\u003c/b>（按键 1 开始、按键 2 停止、其它按键报\"按键错误\"，阈值报警：温度 &gt; 26 ℃ 蜂鸣器响、低于取消）→ \u003cb>显示层\u003c/b>（LCD/OLED 显示姓名学号 + 实时数据）→ \u003cb>传输层\u003c/b>（WIFI/CAN/RS485 传到 PC 或其它板）→ \u003cb>存储与展示层\u003c/b>（mysql 保存，Python/Java/SpringBoot 分页列表 + 时序图 + 频谱图，区分板号与采集时间）→ \u003cb>分析层\u003c/b>（MATLAB 显著性分析或 SVM/K-Means/iForest/1D-CNN 判别来源与异常）。\u003cbr>温度换算：\u003cspan class=\"eq\">T = 175×raw/65535 − 45\u003c/span>；湿度：\u003cspan class=\"eq\">H = 100×raw/65535\u003c/span>。\u003c/p>"},{"id":"kb8","title":"模块 · Cortex-M4 体系与嵌入式基础","html":"\u003cp style=\"margin:4px 0\">M3 与 M4 架构对比：M4 增加单精度 FPU、DSP/SIMD 指令；ARM 公司只授权 IP，芯片由合作伙伴生产；STM32F407ZGT6 资源：Cortex-M4 / 168 MHz / 1 MB Flash / 192 KB SRAM / LQFP144。嵌入式系统由硬件（处理器、存储器、外设）与软件（驱动、RTOS、应用）组成，设计流程从需求分析到软硬件划分。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>STM32F4_高性能_DSC.pdf、01 嵌入式系统与ARM处理器.ppt、02 CortexM4体系结构.ppt、03 粤嵌Cortex-M4平台介绍.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（25 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>STM32F4: 高性能的数字信号控制器 / STM32 – 领先的Cortex-M 产品家族 / STM32家族的新成员：F4系列 / STM32F4： / Cortex-M4内核 / 增加单精度浮点运算单元 / 增强的指令集 / 指令示例：单周期的乘加运算 / 嵌入式系统概念 / 嵌入式系统的硬件组成 / 嵌入式系统的软件结构 / 嵌入式系统的特性 / 嵌入式系统设计流程 / 嵌入式微处理器的特点 / 什么是ARM / ARM公司 / Cortex-M内核对比 / Cortex-M3 与M4 架构对比 / Cortex-M3与M4对比 / Cortex-M4功耗 / Cortex-M4 / STM32 / 那什么是STM32？ / 基于STM32F407ZGT6芯片 / 芯片资源描述\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb9","title":"模块 · GPIO 与引脚","html":"\u003cp style=\"margin:4px 0\">F407ZGT6 有 7 组 IO（GPIOA~GPIOG）×16 引脚 = 112，另加 PH0/PH1 共 114 个。每组含 4 个 32 位配置寄存器（MODER、OTYPER、OSPEEDR、PUPDR）、2 个数据寄存器（IDR、ODR）、置位/复位寄存器 BSRR、锁定寄存器 LCKR、复用选择 AFRL/AFRH。输入：浮空 / 上拉 / 下拉 / 模拟；输出：推挽 / 开漏 / 复用推挽 / 复用开漏。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>05 GPIO配置及使用.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（8 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>GPIO / STM32引脚说明 / GPIO的介绍 / GPIO主要特性 / GPIO工作方式 / GPIO基本结构 / GPIO的输入浮空模式 / GPIO的输入上拉模式\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb10","title":"模块 · NVIC 与外部中断 EXTI","html":"\u003cp style=\"margin:4px 0\">NVIC 与内核紧耦合，负责中断使能、挂起与优先级分组；优先级数值越小越高，分抢占（可嵌套）与响应（只排序）。中断向量表见 startup_stm32f40_41xxx.s。EXTI 管理外部中断/事件，16 条中断线：所有端口的 Pin0 共用 EXTI0、Pin1 共用 EXTI1…；配置流程为 GPIO 时钟 → SYSCFG 映射 → EXTI 触发沿 → NVIC 优先级 → 中断服务函数（写 EXTI_PR 清标志）。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>06 中断之NVIC配置.ppt、07 中断之外部中断.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（15 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>什么是“中断”？ / 嵌套向量中断控制器 (NVIC) / 外部中断/(事件控制器)框图 / 中断向量表 / startup_stm32f40_41xxx.s / NVIC中断优先级分组 / 中断优先级设置 / 中断使能设置 / 外部中断 / 外部中断~中断线的映射 / 外部中断控制框图 / 外部中断寄存器 / 外部中断EXTI / 例：外部中断初始化--初始化GPIO / 例：外部中断初始化--中断初始化\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb11","title":"模块 · 时钟、复位与 SysTick","html":"\u003cp style=\"margin:4px 0\">复位分系统复位、电源复位、备份域复位。时钟源 HSI(16 MHz 内部 RC)、HSE(外部晶振)、PLL；PLL 参数 M（输入分频）、N（倍频）、P（系统时钟分频）、Q（USB/SDIO 等）。SYSCLK 最高 168 MHz，APB1 ≤42 MHz、APB2 ≤84 MHz。SysTick 是内核 24 位递减计数器，VAL 归零自动重装 LOAD。定时器 Tout=((arr+1)(psc+1))/Tclk；PWM 占空比 = CCR/(ARR+1)。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>08 Cortex-M4 时钟与Sytick定时器.ppt、定时器的使用.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（16 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>复位的类型 / 系统复位-触发 / 电源复位-触发 / 备份域复位-触发 / 复位电路的结构图 / STM32F4的时钟源 / 系统时钟树 / 系统时钟-PLL / 通用定时器概述 / 定时器中断的配置 / 定时器中断的使用步骤解析 / 定时器中断的初始化 / 定时器中断的中断函数 / 定时器之PWM / 通用定时器之PWM / 通用定时器之PWM输出步骤\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb12","title":"模块 · UART / RS-232 / RS-485 / Modbus","html":"\u003cp style=\"margin:4px 0\">异步串口帧：起始位 + 8/9 数据位 + 可选校验 + 停止位；波特率单位 bps。三种收发模式：查询（阻塞）、中断、DMA。RS-232 用单端电平（±3~15 V）、点对点、距离短；RS-485 用差分 A/B、半双工两线、两端需 120 Ω 终端电阻、抗共模干扰强、可多点组网；DE/RE 控制收发方向。Modbus 是主从式协议，有 RTU / ASCII / TCP 三种类型，常用功能码 03 读寄存器、06 写单寄存器、16 写多寄存器，RTU 帧尾为 CRC16。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>09 UART原理及串口中断配置.ppt、12 RS485总线原理及组网编程技术.ppt、16 ModBUS总线原理及应用.ppt、16 RS-232和RS-485总线.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（20 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>通信方式背景知识 / 串口的发送接收函数： / 串口相关的中断函数: / 串口发送的三种通信模式： / STM32串口通信 / STM32串口通信--帧格式 / STM32串口通信之RS-232 / RS-232 / 接口原理 / RS485 / RS485的接口原理 / RS485串口编程初始化1 / RS485串口编程初始化2 / RS485串口编程初始化3 / RS485串口编程初始化4 / RS485串口编程中断接收 / MODBUS协议 / Modbus 协议类型介绍 / RS-232和RS-485总线 / RS-485总线\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb13","title":"模块 · I2C / SPI / CAN","html":"\u003cp style=\"margin:4px 0\">I2C：两线 SCL/SDA、开漏+上拉、7 位地址、起始/停止/ACK 信号，典型器件 24C02 EEPROM；HAL 里 7 位地址要左移一位。SPI：四线 SCK/MOSI/MISO/NSS、全双工同步、CPOL/CPHA 组合出 4 种模式、用片选选器件，速度高于 I2C。CAN：bxCAN 支持数据帧、远程帧、错误帧、过载帧、帧间隔；标识符越小优先级越高（线与仲裁）；位时序含同步段/传播段/相位缓冲段；有初始化、正常、睡眠等工作模式与过滤器组。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>10 I2C总线原理及应用编程.ppt、11 SPI总线原理及控制编程.ppt、17 CAN总线原理及组网编程技术.ppt、17 控制器局域网CAN总线技术规范.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（17 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>I2C通信原理 / I2C通信原理-I2C协议 / I2C协议--24c02 EEPROM / 初始化 IIC / 产生 IIC 起始信号 / 产生 IIC 停止信号 / 等待应答信号到来 / ACK 应答 / SPI接口原理 / CAN总线原理 / CAN总线特点 / CAN总线物理层 / CAN总线数据帧 / CAN总线数据帧的组成 / CAN总线数据帧的构成 / CAN总线-数据解析 / CAN总线-总线总裁\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb14","title":"模块 · ADC / DAC / DMA","html":"\u003cp style=\"margin:4px 0\">ADC：12 位逐次逼近型，F4 有 3 个 ADC、最多 24 个外部通道，分规则组与注入组，转换结果对齐由 ALIGN 位决定，触发可选软件/定时器/外部。DAC：2 通道 12 位，可输出波形，配合定时器 + DMA 做任意波形发生器。DMA：无需 CPU 干预在外设↔存储器、存储器↔存储器间搬数据，配置数据流/通道、方向、数据宽度、优先级、循环模式；CubeMX 里在 DMA Settings 添加请求。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>13 ADC原理、控制编程.ppt、14 DAC原理、控制编程.ppt、DMA开发.pptx\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（24 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>STM32F4 ADC 简介 / STM32F4 ADC / ADC1~ADC3 引脚对应关系表 / ADC通用初始化函数 / ADC初始化函数ADC_Init / ADC使能函数 ADC_Cmd(); / ADC使能软件转换函数 / ADC1的通道5（PA5)进行单次转化 / stm32 - DAC简述 / STM32的DAC模块主要特点有： / DAC模块框图 / DAC模块引脚 / DAC的数据转换 / DAC初始化1 / DAC初始化2 / DAC初始化3 / DMA开发 / DMA的基本定义 / DMA传输方式 / DMA传输参数 / DMA的主要特征 / DMA资源 / DMA工作系统框图 / CubeMx 如何创建DMA\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb15","title":"模块 · RTC / 定时器 / 看门狗","html":"\u003cp style=\"margin:4px 0\">RTC：独立的 BCD 日历/时钟，时钟源可选 LSE(32.768 kHz)、LSI 或 HSE 分频，含闹钟与备份寄存器，掉电靠 VBAT 维持。通用定时器 TIM2~TIM5 挂 APB1，TIM1/TIM8 为高级定时器（互补 PWM、死区），TIM6/TIM7 为基本定时器。看门狗：IWDG 用 LSI 独立时钟、自由运行递减，超时复位；WWDG 带上限窗口，必须\"不早不晚\"喂狗，过早也会复位。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>15 RTC原理及应用.ppt、独立看门狗.ppt、窗口看门狗.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（16 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>STM32F4的RTC实时时钟介绍 / RTC实时时钟主要特性 / RTC实时时钟工作框图 / RTC时钟源 / RTC时钟与分频 / RTC时钟介绍 / RTC时钟的使用 / RTC相关的库函数 / 为什么需要看门狗？ / 独立式看门狗 / 独立看门狗 / 独立看门狗的使用 / 独立看门狗的使用步骤 / 窗口看门狗 / 窗口看门狗的一般配置 / 窗口看门狗的一般配置步骤\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb16","title":"模块 · FreeRTOS / uCOS-III","html":"\u003cp style=\"margin:4px 0\">FreeRTOS 代码可分成任务、通讯、硬件接口三块；任务有就绪/运行/阻塞/挂起等状态，调度基于优先级抢占；ISR 里用 FromISR 版 API、耗时处理推迟到任务（延迟中断处理）。uC/OS-III 提供任务创建/删除、时间轮转调度、信号量、互斥信号量、内嵌信号量、消息队列、软件定时器、临界段保护与任务延时。两者共同考点：同步 vs 互斥、优先级反转、中断中不能阻塞。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>18 嵌入式实时系统FreeRTOS--ppt课件.ppt、uCOS-III 中断处理与时间.ppt、uCOS-III 多任务管理.ppt、uCOS-III 多任务编程.ppt、uCOS-III 多任务间通信.ppt、uCOS-III 软件定时器.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（34 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>嵌入式实时系统 --FreeRTOS / 1、FreeRTOS简介 / 2、任务简介 / 2.1任务函数 / 任务一：周期性输出: \"Task 1 is running\\r\\n / 任务二：周期性输出: \"Task 2 is running\\r\\n\" / main()函数：简单地创建这两个任务，然后启动调度器 / 运行结果： 图一 / uC/OS-III 中断 / uC/OS-III 中断处理函数 / uC/OS-III 临界代码段的保护 / uC/OS-III 时间管理--任务延时 / uC/OS-III 任务基本概念 / uC/OS-III 任务状态 / uC/OS-III 任务状态的转化 / uC/OS-III 任务的堆栈 / uC/OS-III 任务堆栈 / uC/OS-III 任务堆栈的增长方式 / uC/OS-III 任务控制块结构 / uC/OS-III 任务就绪表 / uC/OS-III 任务创建 / uC/OS-III 任务删除 / uC/OS-III 时间轮转调度 / uC/OS-III 系统任务 / uC/OS-III 多任务间通信--信号量 / uC/OS-III 多任务间通信-互斥信号量 / uC/OS-III 多任务间通信--内嵌信号量 / uC/OS-II 多任务通信之消息队列 / uC/OS-II 多任务通信之消息传递 / uC/OS-III 软件定时器 / uC/OS-III 软件定时器API函数 / uC/OS-III 软件定时器API函数1 / uC/OS-III 软件定时器API函数2 / uC/OS-III 软件定时器API函数3\u003c/p>\u003c/div>\u003c/details>"},{"id":"kb17","title":"关键寄存器速查","html":"\u003ctable class=\"tb-tbl\">\u003cthead>\u003ctr>\u003cth style=\"width:28%\">寄存器\u003c/th>\u003cth style=\"width:26%\">名称\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_MODER\u003c/span>\u003c/td>\u003ctd>端口模式寄存器\u003c/td>\u003ctd>每 2 位配一个引脚：00 输入 / 01 输出 / 10 复用 / 11 模拟\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_OTYPER\u003c/span>\u003c/td>\u003ctd>输出类型寄存器\u003c/td>\u003ctd>0 推挽、1 开漏\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_OSPEEDR\u003c/span>\u003c/td>\u003ctd>输出速度寄存器\u003c/td>\u003ctd>00 2 MHz / 01 25 MHz / 10 50 MHz / 11 100 MHz（按课件常见表述）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_PUPDR\u003c/span>\u003c/td>\u003ctd>上拉下拉寄存器\u003c/td>\u003ctd>00 无 / 01 上拉 / 10 下拉 / 11 保留\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_IDR / ODR\u003c/span>\u003c/td>\u003ctd>输入 / 输出数据寄存器\u003c/td>\u003ctd>IDR 只读，ODR 可读写；均为低 16 位有效\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_BSRR\u003c/span>\u003c/td>\u003ctd>置位 / 复位寄存器\u003c/td>\u003ctd>低 16 位置位、高 16 位复位，写 1 有效，写 0 无影响（原子操作）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_LCKR\u003c/span>\u003c/td>\u003ctd>端口配置锁定寄存器\u003c/td>\u003ctd>锁定后下次复位前不能改配置\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_AFRL / AFRH\u003c/span>\u003c/td>\u003ctd>复用功能选择寄存器\u003c/td>\u003ctd>每个引脚 4 位选择 AF0~AF15\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">EXTI_IMR / EMR / RTSR / FTSR / PR\u003c/span>\u003c/td>\u003ctd>外部中断寄存器组\u003c/td>\u003ctd>中断屏蔽 / 事件屏蔽 / 上升沿 / 下降沿 / 挂起（写 1 清除）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">NVIC_IPR / ISER / ICER\u003c/span>\u003c/td>\u003ctd>NVIC 寄存器组\u003c/td>\u003ctd>中断优先级 / 使能 / 除能；优先级分组由 SCB-&gt;AIRCR 的 PRIGROUP 决定\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">RCC_CR / RCC_CFGR / RCC_PLLCFGR\u003c/span>\u003c/td>\u003ctd>时钟控制寄存器组\u003c/td>\u003ctd>时钟源使能就绪 / 分频与切换 / PLL 的 M、N、P、Q 参数\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">SysTick_CTRL / LOAD / VAL\u003c/span>\u003c/td>\u003ctd>SysTick 寄存器\u003c/td>\u003ctd>控制与状态 / 重装载值 / 当前计数值（递减）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">USART_SR / DR / BRR / CR1\u003c/span>\u003c/td>\u003ctd>串口寄存器\u003c/td>\u003ctd>状态 / 数据 / 波特率 / 控制（TXE、RXNE、TC 等标志位）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">TIMx_ARR / PSC / CCR / CNT\u003c/span>\u003c/td>\u003ctd>定时器寄存器\u003c/td>\u003ctd>自动重装载 / 预分频 / 捕获比较 / 计数器\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">ADC_SR / CR1 / CR2 / DR\u003c/span>\u003c/td>\u003ctd>ADC 寄存器\u003c/td>\u003ctd>状态 / 控制（对齐 ALIGN、通道组） / 转换数据\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">IWDG_KR / PR / RLR\u003c/span>\u003c/td>\u003ctd>独立看门狗\u003c/td>\u003ctd>喂狗键寄存器 0xAAAA / 预分频 / 重装载值\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>"}]},{"n":1,"title":"嵌入式系统基础","intro":"\u003cp>本章 11 题：选择 8 题、判断 2 题、填空 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt1","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q1\u003c/b>　课件把&quot;内核小、专用性强、系统精简&quot;列为嵌入式特点；通用 PC 才强调多任务通用计算。\u003c/li>\u003cli>\u003cb>Q2\u003c/b>　任务间为协作而等待彼此信号叫同步；互斥是竞争独占资源。\u003c/li>\u003cli>\u003cb>Q3\u003c/b>　面向特定应用&quot;嵌入&quot;到宿主对象中专用，是最本质特征。\u003c/li>\u003cli>\u003cb>Q4\u003c/b>　需求分析定功能，体系结构设计阶段选处理器、划分软硬件。\u003c/li>\u003cli>\u003cb>Q5\u003c/b>　PCI 用同步时钟；RS232、USB 属异步/串行自同步编码，SATA 也是串行自同步。按课件记 PCI。\u003c/li>\u003cli>\u003cb>Q6\u003c/b>　工业控制强调实时、可靠、成本低、外设丰富，MCU 最合适。\u003c/li>\u003c/ul>"}]},{"n":2,"title":"STM32F407与Cortex-M4","intro":"\u003cp>本章 29 题：简答/实验 2 题、选择 18 题、填空 5 题、判断 4 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt2","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q12\u003c/b>　CubeMX 配 GPIO（按键输入上拉、LED 输出推挽）+ 定时器 → Keil5 写状态机：key1 每 2 s 翻转 LED1、key2 每 4 s 翻转 LED2、key3 归零；LCD 显示姓名学号与按键/LED 状态。\u003c/li>\u003cli>\u003cb>Q13\u003c/b>　F407 是 M4 内核（带 FPU 与 DSP 指令）；M3 是 F1 系列，M7 是 F7/H7，A8 属应用处理器。\u003c/li>\u003cli>\u003cb>Q14\u003c/b>　STM32F407ZG：1 MB Flash + 192 KB SRAM（其中 64 KB 为 CCM RAM）。\u003c/li>\u003cli>\u003cb>Q15\u003c/b>　F407 在 168 MHz 下跑满；72 MHz 是 F1 系列常见值。\u003c/li>\u003cli>\u003cb>Q16\u003c/b>　LQFP144 封装，只有标注 FT（5V tolerant）的引脚可容忍 5V，不是全部。\u003c/li>\u003cli>\u003cb>Q17\u003c/b>　F407 有 3 个 12 位逐次逼近 ADC，共用通道，最多 24 路外部输入。\u003c/li>\u003c/ul>"}]},{"n":3,"title":"NVIC与中断","intro":"\u003cp>本章 6 题：简答/实验 1 题、选择 2 题、填空 1 题、判断 2 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt3","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q41\u003c/b>　简答按&quot;中断管理 + 优先级分组 + 向量表 + 嵌套&quot;四点写即可。\u003c/li>\u003cli>\u003cb>Q42\u003c/b>　ISR 中必须用 FromISR 版本，普通 xQueueSend 可能引发阻塞或断言。\u003c/li>\u003cli>\u003cb>Q43\u003c/b>　ISR 只做最短的现场保护与通知，实际处理交给任务/守护任务。\u003c/li>\u003cli>\u003cb>Q44\u003c/b>　高于 configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY 的中断不能调用 API，否则会破坏临界区。\u003c/li>\u003cli>\u003cb>Q45\u003c/b>　vTaskDelay 会阻塞，ISR 中禁止调用任何可能阻塞的 API。\u003c/li>\u003cli>\u003cb>Q46\u003c/b>　响应优先级只在多个中断同时挂起时决定先执行谁，不能产生嵌套打断。\u003c/li>\u003c/ul>"}]},{"n":4,"title":"GPIO与基础外设","intro":"\u003cp>本章 3 题：简答/实验 1 题、选择 2 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt4","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q47\u003c/b>　要点：按键消抖 + 状态机记录按下次数，三次循环切换 LED 流水/分组闪烁/关闭，key2 切换蜂鸣器，LCD 显示计数。\u003c/li>\u003cli>\u003cb>Q48\u003c/b>　自动重新装载 LOAD 寄存器的值并继续递减计数，不会停下等软件清零。\u003c/li>\u003cli>\u003cb>Q49\u003c/b>　I2C 是开漏总线，必须外接上拉才能输出高电平；推挽会造成总线冲突。\u003c/li>\u003c/ul>"}]},{"n":5,"title":"通信接口","intro":"\u003cp>本章 7 题：填空 1 题、简答/实验 1 题、选择 4 题、判断 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt5","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q50\u003c/b>　单位 bps（bit per second）；异步串口一帧还含起始位、校验位、停止位，有效数据率低于波特率。\u003c/li>\u003cli>\u003cb>Q51\u003c/b>　每板 ≥100/200/300 条，按板号与传感器打标签；选 SVM / K-Means / iForest / 1D-CNN / MLP 之一训练，报告来源判定准确率与异常判定理由。\u003c/li>\u003cli>\u003cb>Q52\u003c/b>　阻塞发送用 HAL_UART_Transmit；_IT 是中断方式、_DMA 是 DMA 方式；HAL_GPIO_WritePin 是写引脚。\u003c/li>\u003cli>\u003cb>Q53\u003c/b>　HAL 的 DevAddress 要求 8 位地址：0x50 左移一位 = 0xA0（最低位是读写位，由 HAL 内部处理）。\u003c/li>\u003cli>\u003cb>Q54\u003c/b>　开漏 + 上拉是 I2C 的电气要求，推挽会破坏&quot;线与&quot;特性。\u003c/li>\u003cli>\u003cb>Q55\u003c/b>　RS485 差分、RS232 单端；因此 RS485 距离远、可多点，RS232 通常点对点且距离短。\u003c/li>\u003c/ul>"}]},{"n":6,"title":"HAL库与CubeMX","intro":"\u003cp>本章 7 题：简答/实验 1 题、判断 3 题、选择 2 题、填空 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt6","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q57\u003c/b>　CubeMX ≥ 6.9 → 用 ST 账号登录 → Help → Manage embedded software packages → STMicroelectronics 标签 → 勾选 X-CUBE-AI 的 Artificial Intelligence 版本 → Install。\u003c/li>\u003cli>\u003cb>Q58\u003c/b>　只做转换与部署，不做训练。\u003c/li>\u003cli>\u003cb>Q59\u003c/b>　Spring Boot 的核心就是&quot;约定优于配置 / 零配置&quot;，大幅减少 XML 配置，靠自动配置与 starter 依赖起步。\u003c/li>\u003cli>\u003cb>Q60\u003c/b>　Help → Manage embedded software packages → STMicroelectronics → X-CUBE-AI → Install。\u003c/li>\u003cli>\u003cb>Q61\u003c/b>　X-CUBE-AI 生成库依赖 CRC 外设做校验，模板会要求使能。\u003c/li>\u003cli>\u003cb>Q62\u003c/b>　X-CUBE-AI 把预训练模型转成优化 C 代码并集成进工程。\u003c/li>\u003c/ul>"}]},{"n":7,"title":"AI部署与量化","intro":"\u003cp>本章 13 题：选择 8 题、判断 2 题、填空 2 题、简答/实验 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt7","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q64\u003c/b>　Verilog 是硬件描述语言，根本不是神经网络模型格式。\u003c/li>\u003cli>\u003cb>Q65\u003c/b>　量化几乎总会带来一定精度损失，需要校准集与验证；&quot;一定不会&quot;是绝对化表述。\u003c/li>\u003cli>\u003cb>Q66\u003c/b>　Analyze 生成资源占用报告；Validation 是数值验证、System Performance 是性能跑分。\u003c/li>\u003cli>\u003cb>Q67\u003c/b>　分析模型的 Flash、RAM、MAC/MACC 等资源占用。\u003c/li>\u003cli>\u003cb>Q68\u003c/b>　X-CUBE-AI 支持 TFLite、Keras、ONNX 等多种格式，不是&quot;仅支持 TFLite&quot;。\u003c/li>\u003cli>\u003cb>Q69\u003c/b>　权重放外部 QSPI NOR Flash（只读、容量大），激活缓冲区必须留在片上 SRAM 保证速度；FP32 反而更大，堆栈调大解决不了 Flash 溢出。\u003c/li>\u003c/ul>"}]},{"n":8,"title":"ARM-A53与Linux","intro":"\u003cp>本章 17 题：判断 4 题、选择 11 题、简答/实验 1 题、填空 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt8","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q77\u003c/b>　S5P6818 是三星 8 核 Cortex-A53（ARMv8-A，64 位）。\u003c/li>\u003cli>\u003cb>Q78\u003c/b>　A53 是 64 位 ARMv8-A 低功耗核心。\u003c/li>\u003cli>\u003cb>Q79\u003c/b>　S5P6818 集成 Mali-400 MP GPU。\u003c/li>\u003cli>\u003cb>Q80\u003c/b>　按刷机教程进入 UBOOT/fastboot 模式，用 fastboot 烧写 Linux 镜像；注意电源电压、串口线序与刷写过程不要断电。\u003c/li>\u003cli>\u003cb>Q81\u003c/b>　宿主机 x86、目标机 ARM，必须用交叉编译器 arm-linux-gcc。\u003c/li>\u003cli>\u003cb>Q82\u003c/b>　开发板串口终端（Putty/Minicom）几乎都用 115200 8N1。\u003c/li>\u003c/ul>"}]},{"n":9,"title":"安卓与Web后台","intro":"\u003cp>本章 24 题：简答/实验 3 题、简答/实验 2 题、判断 4 题、选择 11 题、填空 4 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt9","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q94\u003c/b>　按教材 12.14 的方法（方差分析 / 显著性检验）分组比较，数据从 txt 或数据库读取；结论要写&quot;是否有显著差异 + 依据 + 图注&quot;。\u003c/li>\u003cli>\u003cb>Q95\u003c/b>　选 KNN / 决策树 / 集成学习之一用 Python 训练，任取 10 条连续记录做来源匹配，报告判定结果与准确率。\u003c/li>\u003cli>\u003cb>Q96\u003c/b>　MySQL 触发器分 BEFORE 与 AFTER 两类，不是一律&quot;之前&quot;执行。\u003c/li>\u003cli>\u003cb>Q97\u003c/b>　视图是虚拟表，主要用于查看/检索数据并简化复杂查询；一般不用于插入更新（可更新视图有条件限制）。\u003c/li>\u003cli>\u003cb>Q98\u003c/b>　DCOM 是组件对象模型，不是数据库连接标准。\u003c/li>\u003cli>\u003cb>Q99\u003c/b>　Spring Boot 默认打成可执行 jar，内嵌 Tomcat，支持多环境 profile 配置。\u003c/li>\u003c/ul>"}]},{"n":10,"title":"传感器与综合实验","intro":"\u003cp>本章 17 题：简答/实验 13 题、简答/实验 4 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt10","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q118\u003c/b>　I2C 读 SHT30 原始值 → 按 T=175×raw/65535−45、H=100×raw/65535 换算 → 每 5 s 采集一次 → LCD 显示姓名学号与中文单位。\u003c/li>\u003cli>\u003cb>Q119\u003c/b>　按采集→控制→显示→传输→存储→展示→分析分层实现；SHT30 换算 T=175×raw/65535−45；注意姓名学号与采集时间。 实验题按「需求分解 → 硬件/模块配置 → 代码框架 → 数据采集与显示 → 结果验证 → 截图与说明」六步完成，提交时附运行结果与姓名学号。\u003c/li>\u003cli>\u003cb>Q120\u003c/b>　按采集→控制→显示→传输→存储→展示→分析分层实现；SHT30 换算 T=175×raw/65535−45；注意姓名学号与采集时间。\u003c/li>\u003cli>\u003cb>Q121\u003c/b>　按采集→控制→显示→传输→存储→展示→分析分层实现；SHT30 换算 T=175×raw/65535−45；注意姓名学号与采集时间。 实验题按「需求分解 → 硬件/模块配置 → 代码框架 → 数据采集与显示 → 结果验证 → 截图与说明」六步完成，提交时附运行结果与姓名学号。\u003c/li>\u003cli>\u003cb>Q122\u003c/b>　按采集→控制→显示→传输→存储→展示→分析分层实现；SHT30 换算 T=175×raw/65535−45；注意姓名学号与采集时间。 实验题按「需求分解 → 硬件/模块配置 → 代码框架 → 数据采集与显示 → 结果验证 → 截图与说明」六步完成，提交时附运行结果与姓名学号。\u003c/li>\u003cli>\u003cb>Q123\u003c/b>　按&quot;采集 → 按键控制 → 阈值报警 → LCD/串口显示 → WIFI 上送 → mysql 存储 → Web 分页展示 → MATLAB/AI 分析&quot;分层实现，务必带姓名学号与采集时间。\u003c/li>\u003c/ul>"}]},{"n":11,"title":"综合与其他","intro":"\u003cp>本章 1 题：填空 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt11","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q135\u003c/b>　交叉编译后的程序拷到板子常丢失可执行位，用 chmod +x 加权限再运行。\u003c/li>\u003c/ul>"}]},{"n":12,"title":"PPT 补充练习","intro":"\u003cp>本章 39 题：简答/实验 8 题、判断 28 题、选择 1 题、填空 2 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt12","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>补 1\u003c/b>　STM32F407 有 3 个 12 位 ADC（最多 24 个外部通道）和 1 个双通道 12 位 DAC 模块，习惯上说&quot;2 个 DAC 转换器&quot;。\u003c/li>\u003cli>\u003cb>补 2\u003c/b>　题干缺选项。嵌入式 OS 的常见特点：可裁剪、实时性、专用性强、资源占用小；说&quot;必须运行在任何通用 PC 上&quot;&quot;一定需要 MMU&quot;之类是错的。\u003c/li>\u003cli>\u003cb>补 3\u003c/b>　CPSR 的 N/Z/C/V 分别为负、零、进位/借位、溢出标志；I/F 为 IRQ/FIQ 禁止位，M[4:0] 为处理器模式位。按选项把作用写反的那项挑出来。\u003c/li>\u003cli>\u003cb>补 4\u003c/b>　I/O 接口常见单元：数据缓冲/锁存、地址译码、状态与控制寄存器、中断控制、电平转换；ALU、Cache、MMU 属 CPU 内部，不算 I/O 接口。\u003c/li>\u003cli>\u003cb>补 5\u003c/b>　DMA 不需要 CPU 干预即可搬数据，但会与 CPU 争用总线；并非&quot;任何情况都更快&quot;。请回原 PPT 页核对选项。\u003c/li>\u003cli>\u003cb>补 6\u003c/b>　PCB 布线原则：地线 &gt; 电源线 &gt; 信号线，尽量加宽电源/地以降低阻抗与干扰。\u003c/li>\u003c/ul>"}]}],"blocks":[{"title":"① STM32F407ZGT6 关键参数（选择题高频）","html":"\u003ctable style=\"margin:6px 0\">\u003ctbody> \u003ctr>\u003ctd>内核\u003c/td>\u003ctd>\u003cb>ARM Cortex-M4\u003c/b>（带单精度 FPU、DSP/SIMD、单周期 MAC；\u003cb>没有\u003c/b> MVE/Helium）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>主频\u003c/td>\u003ctd>最高 \u003cb>168 MHz\u003c/b>（SYSCLK）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>存储\u003c/td>\u003ctd>1 MB Flash、192 KB SRAM（含 64 KB CCM）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>封装\u003c/td>\u003ctd>LQFP144，多数 I/O 支持 5V 容忍\u003c/td>\u003c/tr> \u003ctr>\u003ctd>ADC\u003c/td>\u003ctd>3 个 12 位 ADC，最多 24 个外部通道\u003c/td>\u003c/tr> \u003ctr>\u003ctd>NVIC\u003c/td>\u003ctd>82 个可屏蔽中断、16 级可编程优先级\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table> \u003cp style=\"margin-bottom:0\">FPU 编译选项：\u003cspan class=\"eq\">-mfloat-abi=hard -mfpu=fpv4-sp-d16\u003c/span>。开启 FPU 后仍需关注编译器选项与数据对齐，不是\"全自动加速\"。\u003c/p>"},{"title":"② 时钟树与总线挂载（记这张表就够）","html":"\u003ctable style=\"margin:6px 0\">\u003cthead>\u003ctr>\u003cth style=\"width:34%\">外设\u003c/th>\u003cth>总线 / 时钟\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>USART1、USART6\u003c/td>\u003ctd>APB2\u003c/td>\u003c/tr> \u003ctr>\u003ctd>UART4、UART5、USART2/3\u003c/td>\u003ctd>APB1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>TIM2~TIM5\u003c/td>\u003ctd>APB1；定时器时钟为 APB1 的 1 倍或 2 倍频\u003c/td>\u003c/tr> \u003ctr>\u003ctd>GPIO\u003c/td>\u003ctd>AHB1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>SysTick\u003c/td>\u003ctd>\u003cb>Cortex-M4 内核内部\u003c/b>系统定时器，不挂 APB\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table> \u003cp style=\"margin-bottom:0\">25 MHz 外部晶振时，主 PLL 分频因子 \u003cb>M=25\u003c/b>，使 VCO 输入为 1 MHz。定时中断周期 \u003cspan class=\"eq\">T\u003csub>out\u003c/sub>=((arr+1)×(psc+1))/T\u003csub>clk\u003c/sub>\u003c/span>，\u003cspan class=\"eq\">psc\u003c/span> 是预分频器、\u003cspan class=\"eq\">arr\u003c/span> 是自动重装载值。SysTick 的 VAL 减到 0 会\u003cb>自动重装 LOAD\u003c/b> 继续计数。\u003c/p>"},{"title":"③ NVIC 中断优先级与 FreeRTOS","html":"\u003cp style=\"margin:4px 0\">\u003cb>优先级数值越小，逻辑优先级越高。\u003c/b>抢占优先级（Preemption）决定能否\u003cb>打断\u003c/b>别人；响应优先级（Subpriority）只在\u003cb>同时到达\u003c/b>时决定执行顺序，\u003cb>不能嵌套打断\u003c/b>。\u003c/p> \u003cp style=\"margin-bottom:0\">FreeRTOS：ISR 里发队列用 \u003cspan class=\"eq\">xQueueSendFromISR()\u003c/span>（不是 xQueueSend）；耗时处理推迟到任务叫\u003cb>延迟中断处理 / deferred interrupt processing\u003c/b>；\u003cb>不是所有优先级\u003c/b>的中断都能安全调用 FreeRTOS API；ISR 中\u003cb>不能\u003c/b>用 \u003cspan class=\"eq\">vTaskDelay()\u003c/span>（会阻塞）。\u003c/p>"},{"title":"④ GPIO 与通信接口","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>GPIO 输出方式 4 种（推挽、开漏、复用推挽、复用开漏），输入方式 4 种（浮空、上拉、下拉、模拟）；\u003c/li> \u003cli>I2C 的 SCL/SDA 必须\u003cb>复用开漏输出 + 外接上拉电阻\u003c/b>，不能直接推挽；7 位从机地址 0x50 传给 HAL 时要\u003cb>左移一位\u003c/b>写成 \u003cb>0xA0\u003c/b>；\u003c/li> \u003cli>HAL 阻塞发送：\u003cspan class=\"eq\">HAL_UART_Transmit()\u003c/span>；\u003cb>UART 只支持异步，USART 同步+异步\u003c/b>；波特率 = 每秒传输的\u003cb>码元（bit）\u003c/b>数；\u003c/li> \u003cli>CAN 控制器与总线之间必须经 \u003cb>CAN 收发器\u003c/b>；用 CAN2 前要先使能 \u003cb>CAN1\u003c/b> 时钟（CAN1 是主控制器）；\u003c/li> \u003cli>RS485 用\u003cb>差分信号\u003c/b>，RS232 用单端；RS485 收发器靠 \u003cb>DE/RE\u003c/b> 引脚切换收发方向，典型 1200 m / 32 个节点。\u003c/li> \u003c/ul>"},{"title":"⑤ CubeMX + X-CUBE-AI 部署要点","html":"\u003cp style=\"margin:4px 0\">安装路径：\u003cb>Help → Manage embedded software packages → STMicroelectronics → X-CUBE-AI → Install\u003c/b>（CubeMX ≥ 6.9，需 ST 账号登录）。它\u003cb>不做训练\u003c/b>，只把 PC 端训练好的模型转换成优化 C 代码；支持 TFLite(.tflite)、Keras(.h5)、ONNX，\u003cb>不支持\u003c/b> PyTorch 原生 .pt、更不支持 Verilog HDL。\u003c/p> \u003cp style=\"margin:4px 0\">导入后点 \u003cb>Analyze\u003c/b> 查看 \u003cb>Flash / RAM / MACC\u003c/b> 占用；验证数值行为选 \u003cb>Validation\u003c/b> 模板；Optimization 选 \u003cb>Smallest\u003c/b> = 最小化内存占用、牺牲速度；量化用 \u003cb>8 位 INT8\u003c/b>，但\u003cb>可能损失精度\u003c/b>；还需额外开启 \u003cb>CRC\u003c/b> 外设。\u003c/p> \u003cp style=\"margin-bottom:0\">\u003cb>SYS → Debug 默认是 No Debug\u003c/b>，生成代码前必须改成 \u003cb>Serial Wire\u003c/b>，否则第一次烧录后 SWD 被禁用、第二次连不上。CubeMX 6.15 生成工程若报 \u003cspan class=\"eq\">undefined reference to ai_xxx_run\u003c/span>，通常是 AI Runtime 静态库 .a 没自动加入链接器，需手动补库名与搜索路径。\u003c/p>"},{"title":"⑥ 嵌入式系统基础（概念题）","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>嵌入式系统最大特点是\u003cb>嵌入专用\u003c/b>；相对 PC 不具有\"可执行多任务\"这一通用特征的说法要按题意判断；处理器选型在\u003cb>体系结构设计\u003c/b>阶段完成；\u003c/li> \u003cli>工业控制最适合\u003cb>微控制器 MCU\u003c/b>；很少用于手机的嵌入式 OS 是 \u003cb>VxWorks\u003c/b>；采用同步时序协议的总线是 \u003cb>PCI\u003c/b>；\u003c/li> \u003cli>RTOS 分实时/非实时，实时又分\u003cb>硬实时\u003c/b>与软实时；任务间\"等待伙伴消息\"的制约合作叫\u003cb>同步\u003c/b>；\u003c/li> \u003cli>嵌入式处理器按用途分 MCU / MPU / SOC（\u003cb>FPGA 不属此类\u003c/b>）。\u003c/li> \u003c/ul>"},{"title":"⑦ ARM-A53 / Linux / QT（同批课件题）","html":"\u003cp style=\"margin:4px 0\">S5P6818 是 64 位 \u003cb>Cortex-A53\u003c/b>（8 核），GPU 为 \u003cb>Mali-400\u003c/b>；交叉编译用 \u003cspan class=\"eq\">arm-linux-gcc\u003c/span>；串口终端常用波特率 \u003cb>115200\u003c/b>；内核镜像为 \u003cb>zImage\u003c/b>；驱动模块 .ko 用 \u003cspan class=\"eq\">insmod\u003c/span> 加载；设备树下注册 I2C 设备用 \u003cspan class=\"eq\">of_i2c_register_devices()\u003c/span>；fastboot 刷机需进入 UBOOT 的 fastboot 模式；\"Permission denied\" 用 \u003cspan class=\"eq\">chmod +x\u003c/span> 加执行权限。\u003c/p> \u003cp style=\"margin-bottom:0\">QT Creator 默认构建工具 \u003cb>qmake\u003c/b>，快速打开项目 \u003cb>Ctrl+Shift+O\u003c/b>，Linux 下默认编译器 \u003cb>GCC\u003c/b>；QT Creator 不只支持 C++，QT Designer 不能直接写 C++ 代码（在编辑器/槽函数里写）。\u003c/p>"},{"title":"⑧ 综合实验通用套路（实验题都能套）","html":"\u003cp style=\"margin-bottom:0\">\u003cb>采集层\u003c/b>（SHT30 温湿度 / 光敏 / 超声波 / CO₂ 甲醛，I2C 或 GPIO）→ \u003cb>控制层\u003c/b>（按键 1 开始、按键 2 停止、其它按键报\"按键错误\"，阈值报警：温度 &gt; 26 ℃ 蜂鸣器响、低于取消）→ \u003cb>显示层\u003c/b>（LCD/OLED 显示姓名学号 + 实时数据）→ \u003cb>传输层\u003c/b>（WIFI/CAN/RS485 传到 PC 或其它板）→ \u003cb>存储与展示层\u003c/b>（mysql 保存，Python/Java/SpringBoot 分页列表 + 时序图 + 频谱图，区分板号与采集时间）→ \u003cb>分析层\u003c/b>（MATLAB 显著性分析或 SVM/K-Means/iForest/1D-CNN 判别来源与异常）。\u003cbr>温度换算：\u003cspan class=\"eq\">T = 175×raw/65535 − 45\u003c/span>；湿度：\u003cspan class=\"eq\">H = 100×raw/65535\u003c/span>。\u003c/p>"},{"title":"模块 · Cortex-M4 体系与嵌入式基础","html":"\u003cp style=\"margin:4px 0\">M3 与 M4 架构对比：M4 增加单精度 FPU、DSP/SIMD 指令；ARM 公司只授权 IP，芯片由合作伙伴生产；STM32F407ZGT6 资源：Cortex-M4 / 168 MHz / 1 MB Flash / 192 KB SRAM / LQFP144。嵌入式系统由硬件（处理器、存储器、外设）与软件（驱动、RTOS、应用）组成，设计流程从需求分析到软硬件划分。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>STM32F4_高性能_DSC.pdf、01 嵌入式系统与ARM处理器.ppt、02 CortexM4体系结构.ppt、03 粤嵌Cortex-M4平台介绍.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（25 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>STM32F4: 高性能的数字信号控制器 / STM32 – 领先的Cortex-M 产品家族 / STM32家族的新成员：F4系列 / STM32F4： / Cortex-M4内核 / 增加单精度浮点运算单元 / 增强的指令集 / 指令示例：单周期的乘加运算 / 嵌入式系统概念 / 嵌入式系统的硬件组成 / 嵌入式系统的软件结构 / 嵌入式系统的特性 / 嵌入式系统设计流程 / 嵌入式微处理器的特点 / 什么是ARM / ARM公司 / Cortex-M内核对比 / Cortex-M3 与M4 架构对比 / Cortex-M3与M4对比 / Cortex-M4功耗 / Cortex-M4 / STM32 / 那什么是STM32？ / 基于STM32F407ZGT6芯片 / 芯片资源描述\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · GPIO 与引脚","html":"\u003cp style=\"margin:4px 0\">F407ZGT6 有 7 组 IO（GPIOA~GPIOG）×16 引脚 = 112，另加 PH0/PH1 共 114 个。每组含 4 个 32 位配置寄存器（MODER、OTYPER、OSPEEDR、PUPDR）、2 个数据寄存器（IDR、ODR）、置位/复位寄存器 BSRR、锁定寄存器 LCKR、复用选择 AFRL/AFRH。输入：浮空 / 上拉 / 下拉 / 模拟；输出：推挽 / 开漏 / 复用推挽 / 复用开漏。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>05 GPIO配置及使用.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（8 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>GPIO / STM32引脚说明 / GPIO的介绍 / GPIO主要特性 / GPIO工作方式 / GPIO基本结构 / GPIO的输入浮空模式 / GPIO的输入上拉模式\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · NVIC 与外部中断 EXTI","html":"\u003cp style=\"margin:4px 0\">NVIC 与内核紧耦合，负责中断使能、挂起与优先级分组；优先级数值越小越高，分抢占（可嵌套）与响应（只排序）。中断向量表见 startup_stm32f40_41xxx.s。EXTI 管理外部中断/事件，16 条中断线：所有端口的 Pin0 共用 EXTI0、Pin1 共用 EXTI1…；配置流程为 GPIO 时钟 → SYSCFG 映射 → EXTI 触发沿 → NVIC 优先级 → 中断服务函数（写 EXTI_PR 清标志）。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>06 中断之NVIC配置.ppt、07 中断之外部中断.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（15 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>什么是“中断”？ / 嵌套向量中断控制器 (NVIC) / 外部中断/(事件控制器)框图 / 中断向量表 / startup_stm32f40_41xxx.s / NVIC中断优先级分组 / 中断优先级设置 / 中断使能设置 / 外部中断 / 外部中断~中断线的映射 / 外部中断控制框图 / 外部中断寄存器 / 外部中断EXTI / 例：外部中断初始化--初始化GPIO / 例：外部中断初始化--中断初始化\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · 时钟、复位与 SysTick","html":"\u003cp style=\"margin:4px 0\">复位分系统复位、电源复位、备份域复位。时钟源 HSI(16 MHz 内部 RC)、HSE(外部晶振)、PLL；PLL 参数 M（输入分频）、N（倍频）、P（系统时钟分频）、Q（USB/SDIO 等）。SYSCLK 最高 168 MHz，APB1 ≤42 MHz、APB2 ≤84 MHz。SysTick 是内核 24 位递减计数器，VAL 归零自动重装 LOAD。定时器 Tout=((arr+1)(psc+1))/Tclk；PWM 占空比 = CCR/(ARR+1)。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>08 Cortex-M4 时钟与Sytick定时器.ppt、定时器的使用.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（16 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>复位的类型 / 系统复位-触发 / 电源复位-触发 / 备份域复位-触发 / 复位电路的结构图 / STM32F4的时钟源 / 系统时钟树 / 系统时钟-PLL / 通用定时器概述 / 定时器中断的配置 / 定时器中断的使用步骤解析 / 定时器中断的初始化 / 定时器中断的中断函数 / 定时器之PWM / 通用定时器之PWM / 通用定时器之PWM输出步骤\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · UART / RS-232 / RS-485 / Modbus","html":"\u003cp style=\"margin:4px 0\">异步串口帧：起始位 + 8/9 数据位 + 可选校验 + 停止位；波特率单位 bps。三种收发模式：查询（阻塞）、中断、DMA。RS-232 用单端电平（±3~15 V）、点对点、距离短；RS-485 用差分 A/B、半双工两线、两端需 120 Ω 终端电阻、抗共模干扰强、可多点组网；DE/RE 控制收发方向。Modbus 是主从式协议，有 RTU / ASCII / TCP 三种类型，常用功能码 03 读寄存器、06 写单寄存器、16 写多寄存器，RTU 帧尾为 CRC16。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>09 UART原理及串口中断配置.ppt、12 RS485总线原理及组网编程技术.ppt、16 ModBUS总线原理及应用.ppt、16 RS-232和RS-485总线.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（20 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>通信方式背景知识 / 串口的发送接收函数： / 串口相关的中断函数: / 串口发送的三种通信模式： / STM32串口通信 / STM32串口通信--帧格式 / STM32串口通信之RS-232 / RS-232 / 接口原理 / RS485 / RS485的接口原理 / RS485串口编程初始化1 / RS485串口编程初始化2 / RS485串口编程初始化3 / RS485串口编程初始化4 / RS485串口编程中断接收 / MODBUS协议 / Modbus 协议类型介绍 / RS-232和RS-485总线 / RS-485总线\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · I2C / SPI / CAN","html":"\u003cp style=\"margin:4px 0\">I2C：两线 SCL/SDA、开漏+上拉、7 位地址、起始/停止/ACK 信号，典型器件 24C02 EEPROM；HAL 里 7 位地址要左移一位。SPI：四线 SCK/MOSI/MISO/NSS、全双工同步、CPOL/CPHA 组合出 4 种模式、用片选选器件，速度高于 I2C。CAN：bxCAN 支持数据帧、远程帧、错误帧、过载帧、帧间隔；标识符越小优先级越高（线与仲裁）；位时序含同步段/传播段/相位缓冲段；有初始化、正常、睡眠等工作模式与过滤器组。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>10 I2C总线原理及应用编程.ppt、11 SPI总线原理及控制编程.ppt、17 CAN总线原理及组网编程技术.ppt、17 控制器局域网CAN总线技术规范.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（17 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>I2C通信原理 / I2C通信原理-I2C协议 / I2C协议--24c02 EEPROM / 初始化 IIC / 产生 IIC 起始信号 / 产生 IIC 停止信号 / 等待应答信号到来 / ACK 应答 / SPI接口原理 / CAN总线原理 / CAN总线特点 / CAN总线物理层 / CAN总线数据帧 / CAN总线数据帧的组成 / CAN总线数据帧的构成 / CAN总线-数据解析 / CAN总线-总线总裁\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · ADC / DAC / DMA","html":"\u003cp style=\"margin:4px 0\">ADC：12 位逐次逼近型，F4 有 3 个 ADC、最多 24 个外部通道，分规则组与注入组，转换结果对齐由 ALIGN 位决定，触发可选软件/定时器/外部。DAC：2 通道 12 位，可输出波形，配合定时器 + DMA 做任意波形发生器。DMA：无需 CPU 干预在外设↔存储器、存储器↔存储器间搬数据，配置数据流/通道、方向、数据宽度、优先级、循环模式；CubeMX 里在 DMA Settings 添加请求。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>13 ADC原理、控制编程.ppt、14 DAC原理、控制编程.ppt、DMA开发.pptx\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（24 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>STM32F4 ADC 简介 / STM32F4 ADC / ADC1~ADC3 引脚对应关系表 / ADC通用初始化函数 / ADC初始化函数ADC_Init / ADC使能函数 ADC_Cmd(); / ADC使能软件转换函数 / ADC1的通道5（PA5)进行单次转化 / stm32 - DAC简述 / STM32的DAC模块主要特点有： / DAC模块框图 / DAC模块引脚 / DAC的数据转换 / DAC初始化1 / DAC初始化2 / DAC初始化3 / DMA开发 / DMA的基本定义 / DMA传输方式 / DMA传输参数 / DMA的主要特征 / DMA资源 / DMA工作系统框图 / CubeMx 如何创建DMA\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · RTC / 定时器 / 看门狗","html":"\u003cp style=\"margin:4px 0\">RTC：独立的 BCD 日历/时钟，时钟源可选 LSE(32.768 kHz)、LSI 或 HSE 分频，含闹钟与备份寄存器，掉电靠 VBAT 维持。通用定时器 TIM2~TIM5 挂 APB1，TIM1/TIM8 为高级定时器（互补 PWM、死区），TIM6/TIM7 为基本定时器。看门狗：IWDG 用 LSI 独立时钟、自由运行递减，超时复位；WWDG 带上限窗口，必须\"不早不晚\"喂狗，过早也会复位。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>15 RTC原理及应用.ppt、独立看门狗.ppt、窗口看门狗.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（16 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>STM32F4的RTC实时时钟介绍 / RTC实时时钟主要特性 / RTC实时时钟工作框图 / RTC时钟源 / RTC时钟与分频 / RTC时钟介绍 / RTC时钟的使用 / RTC相关的库函数 / 为什么需要看门狗？ / 独立式看门狗 / 独立看门狗 / 独立看门狗的使用 / 独立看门狗的使用步骤 / 窗口看门狗 / 窗口看门狗的一般配置 / 窗口看门狗的一般配置步骤\u003c/p>\u003c/div>\u003c/details>"},{"title":"模块 · FreeRTOS / uCOS-III","html":"\u003cp style=\"margin:4px 0\">FreeRTOS 代码可分成任务、通讯、硬件接口三块；任务有就绪/运行/阻塞/挂起等状态，调度基于优先级抢占；ISR 里用 FromISR 版 API、耗时处理推迟到任务（延迟中断处理）。uC/OS-III 提供任务创建/删除、时间轮转调度、信号量、互斥信号量、内嵌信号量、消息队列、软件定时器、临界段保护与任务延时。两者共同考点：同步 vs 互斥、优先级反转、中断中不能阻塞。\u003c/p> \u003cp style=\"margin:4px 0\">\u003cb>对应课件：\u003c/b>18 嵌入式实时系统FreeRTOS--ppt课件.ppt、uCOS-III 中断处理与时间.ppt、uCOS-III 多任务管理.ppt、uCOS-III 多任务编程.ppt、uCOS-III 多任务间通信.ppt、uCOS-III 软件定时器.ppt\u003c/p> \u003cdetails class=\"sol\">\u003csummary>展开本模块的 PPT 小节索引（34 条）\u003c/summary>\u003cdiv class=\"body\">\u003cp>嵌入式实时系统 --FreeRTOS / 1、FreeRTOS简介 / 2、任务简介 / 2.1任务函数 / 任务一：周期性输出: \"Task 1 is running\\r\\n / 任务二：周期性输出: \"Task 2 is running\\r\\n\" / main()函数：简单地创建这两个任务，然后启动调度器 / 运行结果： 图一 / uC/OS-III 中断 / uC/OS-III 中断处理函数 / uC/OS-III 临界代码段的保护 / uC/OS-III 时间管理--任务延时 / uC/OS-III 任务基本概念 / uC/OS-III 任务状态 / uC/OS-III 任务状态的转化 / uC/OS-III 任务的堆栈 / uC/OS-III 任务堆栈 / uC/OS-III 任务堆栈的增长方式 / uC/OS-III 任务控制块结构 / uC/OS-III 任务就绪表 / uC/OS-III 任务创建 / uC/OS-III 任务删除 / uC/OS-III 时间轮转调度 / uC/OS-III 系统任务 / uC/OS-III 多任务间通信--信号量 / uC/OS-III 多任务间通信-互斥信号量 / uC/OS-III 多任务间通信--内嵌信号量 / uC/OS-II 多任务通信之消息队列 / uC/OS-II 多任务通信之消息传递 / uC/OS-III 软件定时器 / uC/OS-III 软件定时器API函数 / uC/OS-III 软件定时器API函数1 / uC/OS-III 软件定时器API函数2 / uC/OS-III 软件定时器API函数3\u003c/p>\u003c/div>\u003c/details>"},{"title":"关键寄存器速查","html":"\u003ctable class=\"tb-tbl\">\u003cthead>\u003ctr>\u003cth style=\"width:28%\">寄存器\u003c/th>\u003cth style=\"width:26%\">名称\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_MODER\u003c/span>\u003c/td>\u003ctd>端口模式寄存器\u003c/td>\u003ctd>每 2 位配一个引脚：00 输入 / 01 输出 / 10 复用 / 11 模拟\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_OTYPER\u003c/span>\u003c/td>\u003ctd>输出类型寄存器\u003c/td>\u003ctd>0 推挽、1 开漏\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_OSPEEDR\u003c/span>\u003c/td>\u003ctd>输出速度寄存器\u003c/td>\u003ctd>00 2 MHz / 01 25 MHz / 10 50 MHz / 11 100 MHz（按课件常见表述）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_PUPDR\u003c/span>\u003c/td>\u003ctd>上拉下拉寄存器\u003c/td>\u003ctd>00 无 / 01 上拉 / 10 下拉 / 11 保留\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_IDR / ODR\u003c/span>\u003c/td>\u003ctd>输入 / 输出数据寄存器\u003c/td>\u003ctd>IDR 只读，ODR 可读写；均为低 16 位有效\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_BSRR\u003c/span>\u003c/td>\u003ctd>置位 / 复位寄存器\u003c/td>\u003ctd>低 16 位置位、高 16 位复位，写 1 有效，写 0 无影响（原子操作）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_LCKR\u003c/span>\u003c/td>\u003ctd>端口配置锁定寄存器\u003c/td>\u003ctd>锁定后下次复位前不能改配置\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">GPIOx_AFRL / AFRH\u003c/span>\u003c/td>\u003ctd>复用功能选择寄存器\u003c/td>\u003ctd>每个引脚 4 位选择 AF0~AF15\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">EXTI_IMR / EMR / RTSR / FTSR / PR\u003c/span>\u003c/td>\u003ctd>外部中断寄存器组\u003c/td>\u003ctd>中断屏蔽 / 事件屏蔽 / 上升沿 / 下降沿 / 挂起（写 1 清除）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">NVIC_IPR / ISER / ICER\u003c/span>\u003c/td>\u003ctd>NVIC 寄存器组\u003c/td>\u003ctd>中断优先级 / 使能 / 除能；优先级分组由 SCB-&gt;AIRCR 的 PRIGROUP 决定\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">RCC_CR / RCC_CFGR / RCC_PLLCFGR\u003c/span>\u003c/td>\u003ctd>时钟控制寄存器组\u003c/td>\u003ctd>时钟源使能就绪 / 分频与切换 / PLL 的 M、N、P、Q 参数\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">SysTick_CTRL / LOAD / VAL\u003c/span>\u003c/td>\u003ctd>SysTick 寄存器\u003c/td>\u003ctd>控制与状态 / 重装载值 / 当前计数值（递减）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">USART_SR / DR / BRR / CR1\u003c/span>\u003c/td>\u003ctd>串口寄存器\u003c/td>\u003ctd>状态 / 数据 / 波特率 / 控制（TXE、RXNE、TC 等标志位）\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">TIMx_ARR / PSC / CCR / CNT\u003c/span>\u003c/td>\u003ctd>定时器寄存器\u003c/td>\u003ctd>自动重装载 / 预分频 / 捕获比较 / 计数器\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">ADC_SR / CR1 / CR2 / DR\u003c/span>\u003c/td>\u003ctd>ADC 寄存器\u003c/td>\u003ctd>状态 / 控制（对齐 ALIGN、通道组） / 转换数据\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cspan class=\"eq\">IWDG_KR / PR / RLR\u003c/span>\u003c/td>\u003ctd>独立看门狗\u003c/td>\u003ctd>喂狗键寄存器 0xAAAA / 预分频 / 重装载值\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>"}],"pitfalls":["优先级数值越小越高；抢占可嵌套、响应只决定同时到达时的顺序。","SysTick 是内核外设，不挂 APB；VAL 归零自动重装 LOAD。","USART 与 UART 混淆：USART 支持同步+异步，名字带 UART 的只支持异步。","I2C  forgetting 开漏+上拉；7 位地址传给 HAL 要左移一位（0x50→0xA0）。","CAN2 依赖 CAN1 时钟；CAN 控制器必须经收发器才能接总线。","CubeMX 的 SYS→Debug 默认 No Debug，不改 Serial Wire 会锁死 SWD。","X-CUBE-AI 不做训练，只转换与部署；.pt 与 Verilog HDL 不是支持的格式。","INT8 量化不是零损失；Optimization=Smallest 是省内存而非提速。","Analyze 的 RAM 只是静态估算，实际还要叠加栈、HAL 缓冲与用户变量。","FreeRTOS 的 ISR 必须用 FromISR 版本 API，且不能调用 vTaskDelay。","F407 的 M4 没有 MVE/Helium；启用 FPU 还要正确编译选项与对齐。","QSPI Flash 放权重、片上 SRAM 放激活缓冲，两者不必在同一存储器。"],"bank":[{"id":"stm32-Q1","ch":1,"no":"Q1","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">和PC系统机相比嵌入式系统不具备以下哪个特点（ ）。","options":[{"key":"A","html":"系统内核小"},{"key":"B","html":"专用性强"},{"key":"C","html":"可执行多任务"},{"key":"D","html":"系统精简"}],"answer":"C（可执行多任务，按课件答案）","answerKey":"C","why":"\u003cp class=\"q-why\">课件把\"内核小、专用性强、系统精简\"列为嵌入式特点；通用 PC 才强调多任务通用计算。\u003c/p>","source":"L01 p8 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q2","ch":1,"no":"Q2","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">实时操作系统中，两个任务并发执行，一个任务要等待其合作伙伴发来信息，或建立某个条件后再向前执行，这种制约性合作关系被成为（）。","options":[{"key":"A","html":"同步"},{"key":"B","html":"互斥"},{"key":"C","html":"调度"},{"key":"D","html":"执行"}],"answer":"同步","answerKey":"A","why":"\u003cp class=\"q-why\">任务间为协作而等待彼此信号叫同步；互斥是竞争独占资源。\u003c/p>","source":"L01 p8 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q3","ch":1,"no":"Q3","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">嵌入式系统有别于其他系统的最大特点是（ ）。","options":[{"key":"A","html":"嵌入专用"},{"key":"B","html":"高可靠"},{"key":"C","html":"低功耗"},{"key":"D","html":"低成本"}],"answer":"A（嵌入专用）","answerKey":"A","why":"\u003cp class=\"q-why\">面向特定应用\"嵌入\"到宿主对象中专用，是最本质特征。\u003c/p>","source":"L01 p8 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q4","ch":1,"no":"Q4","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嵌入式系统设计中，嵌入式处理器选型是在进行( )完成的。","options":[{"key":"A","html":"需求分析"},{"key":"B","html":"系统集成"},{"key":"C","html":"体系结构设计"},{"key":"D","html":"软硬件设计"}],"answer":"C（体系结构设计）","answerKey":"C","why":"\u003cp class=\"q-why\">需求分析定功能，体系结构设计阶段选处理器、划分软硬件。\u003c/p>","source":"L01 p8 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q5","ch":1,"no":"Q5","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">下面总线采用同步时序协议的是( )","options":[{"key":"A","html":"PCI"},{"key":"B","html":"RS232"},{"key":"C","html":"USB"},{"key":"D","html":"SATA"}],"answer":"A（PCI）","answerKey":"A","why":"\u003cp class=\"q-why\">PCI 用同步时钟；RS232、USB 属异步/串行自同步编码，SATA 也是串行自同步。按课件记 PCI。\u003c/p>","source":"L01 p8 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q6","ch":1,"no":"Q6","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">下面哪一类嵌入式处理器最适合于用于工业控制( )","options":[{"key":"A","html":"嵌入式微处理器"},{"key":"B","html":"微控制器"},{"key":"C","html":"DSP"},{"key":"D","html":"以上都不合适"}],"answer":"B（微控制器 MCU）","answerKey":"B","why":"\u003cp class=\"q-why\">工业控制强调实时、可靠、成本低、外设丰富，MCU 最合适。\u003c/p>","source":"L03 p10 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q7","ch":1,"no":"Q7","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">下面哪种嵌入式操作系统很少用在手机上。 ( )","options":[{"key":"A","html":"Symbian"},{"key":"B","html":"linux"},{"key":"C","html":"Win CE"},{"key":"D","html":"VxWorks"}],"answer":"D（VxWorks）","answerKey":"D","why":"\u003cp class=\"q-why\">VxWorks 是硬实时工业/航天 OS；Symbian、Linux、WinCE 都做过手机系统。\u003c/p>","source":"L03 p10 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q8","ch":1,"no":"Q8","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">从嵌入式操作系统特点可以将嵌入式操作系统分为实时操作系统和（ ），其中实时系统亦可分为（ ）和软实时系统。\u003c/span>","options":[],"answer":"非实时（分时）操作系统；硬实时","answerKey":"","why":"\u003cp class=\"q-why\">RTOS 分硬实时（超时即失败）与软实时（偶尔超时可接受）。\u003c/p>","source":"L03 p10 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q9","ch":1,"no":"Q9","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">嵌入式处理器根据用途分类可以分为以下几种，除了 ( )","options":[{"key":"A","html":"MCU"},{"key":"B","html":"MPU"},{"key":"C","html":"SOC"},{"key":"D","html":"FPGA"}],"answer":"D（FPGA）","answerKey":"D","why":"\u003cp class=\"q-why\">MCU / MPU / SOC 是按用途/集成度分类；FPGA 是可编程逻辑器件。\u003c/p>","source":"L03 p10 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q10","ch":1,"no":"Q10","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">由于温湿度传感器是低速设备，A53开发板驱动中访问I2C总线时不需要考虑互斥问题，因为内核I2C核心已经保证了并发安全。 ( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">低速不代表无并发；多个进程/线程访问同一适配器仍需内核互斥保护。\u003c/p>","source":"L03 p2 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q11","ch":1,"no":"Q11","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">RS485 通讯网络的最大传输距离可达 ______ 米，总线上最多可挂载 ______ 个通讯节点。\u003c/span>","options":[],"answer":"约 1200 米；32 个节点","answerKey":"","why":"\u003cp class=\"q-why\">经典指标；用 1/8 单位负载收发器可扩展到 256 个节点。\u003c/p>","source":"L08 p4 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q12","ch":2,"no":"Q12","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">利用STM32F407开发板及对应电路图，请利用stm32cubemx+keil5实现按key1键，实现LED1每2秒闪烁1次，按key2键，实现LED2每4秒间隔亮与灭，按ley3键，则归零，并在LCD屏上显示自己的姓名(中文)与学号，以及按键与LED灯开与关情况。\u003c/span>","options":[],"answer":"实验/编程题","answerKey":"","why":"\u003cp class=\"q-why\">CubeMX 配 GPIO（按键输入上拉、LED 输出推挽）+ 定时器 → Keil5 写状态机：key1 每 2 s 翻转 LED1、key2 每 4 s 翻转 LED2、key3 归零；LCD 显示姓名学号与按键/LED 状态。\u003c/p>","source":"L01 p13 题2","tags":[],"needsCheck":false,"points":["CubeMX 配 GPIO（按键输入上拉、LED 输出推挽）+ 定时器 → Keil5 写状态机：key1 每 2 s 翻转 LED1、key2 每 4 s 翻转 LED2、key3 归零","LCD 显示姓名学号与按键/LED 状态"]},{"id":"stm32-Q13","ch":2,"no":"Q13","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZG微控制器采用的CPU内核是？( )","options":[{"key":"A","html":"ARM Cortex-M3"},{"key":"B","html":"AR
