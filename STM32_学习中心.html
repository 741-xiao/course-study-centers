M Cortex-M4"},{"key":"C","html":"ARM Cortex-M7"},{"key":"D","html":"ARM Cortex-A8"}],"answer":"B（ARM Cortex-M4）","answerKey":"B","why":"\u003cp class=\"q-why\">F407 是 M4 内核（带 FPU 与 DSP 指令）；M3 是 F1 系列，M7 是 F7/H7，A8 属应用处理器。\u003c/p>","source":"L02 p3 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q14","ch":2,"no":"Q14","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZG的内置程序存储器（Flash）和随机存取存储器（SRAM）大小分别约为？( )","options":[{"key":"A","html":"512KB Flash, 128KB SRAM"},{"key":"B","html":"1024KB Flash, 192KB SRAM"},{"key":"C","html":"2048KB Flash, 256KB SRAM"},{"key":"D","html":"1024KB Flash, 64KB SRAM"}],"answer":"B（1 MB Flash、192 KB SRAM）","answerKey":"B","why":"\u003cp class=\"q-why\">STM32F407ZG：1 MB Flash + 192 KB SRAM（其中 64 KB 为 CCM RAM）。\u003c/p>","source":"L02 p3 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q15","ch":2,"no":"Q15","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZG微控制器的最大工作频率是？( )","options":[{"key":"A","html":"72 MHz"},{"key":"B","html":"100 MHz"},{"key":"C","html":"168 MHz"},{"key":"D","html":"200 MH"}],"answer":"C（168 MHz）","answerKey":"C","why":"\u003cp class=\"q-why\">F407 在 168 MHz 下跑满；72 MHz 是 F1 系列常见值。\u003c/p>","source":"L02 p3 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q16","ch":2,"no":"Q16","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZG芯片的引脚总数和可容忍5V电压的I/O数量特点分别是？( )","options":[{"key":"A","html":"100引脚，所有I/O均支持5V容忍"},{"key":"B","html":"144引脚，大部分I/O支持5V容忍"},{"key":"C","html":"144引脚，仅部分I/O支持5V容忍"},{"key":"D","html":"176引脚，所有I/O均支持5V容忍"}],"answer":"C（144 引脚，仅部分 I/O 支持 5V 容忍）","answerKey":"C","why":"\u003cp class=\"q-why\">LQFP144 封装，只有标注 FT（5V tolerant）的引脚可容忍 5V，不是全部。\u003c/p>","source":"L02 p3 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q17","ch":2,"no":"Q17","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZG芯片内部集成了____个12位的模数转换器（ADC），最多可提供____个输入通道。\u003c/span>","options":[],"answer":"3 个 ADC；最多 24 个外部通道","answerKey":"","why":"\u003cp class=\"q-why\">F407 有 3 个 12 位逐次逼近 ADC，共用通道，最多 24 路外部输入。\u003c/p>","source":"L02 p4 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q18","ch":2,"no":"Q18","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在STM32F407ZGTx中，GPIO工作方式有( )种输出方式，( ) 种输入方式。","options":[{"key":"A","html":"4,3"},{"key":"B","html":"5,4"},{"key":"C","html":"4,4"},{"key":"D","html":"32,32"}],"answer":"A（4 种输出、3/4 种输入，按课件记 4,4 选 C）","answerKey":"A","why":"\u003cp class=\"q-why\">输出：推挽、开漏、复用推挽、复用开漏；输入：浮空、上拉、下拉、模拟。课件选项里常见答案记为 4 种输出 + 4 种输入（C）。\u003c/p>","source":"L02 p5 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q19","ch":2,"no":"Q19","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">S5P6818的I2C控制器驱动由三星提供，因此编写传感器驱动时无需关心I2C时钟频率的配置，它会自动适应传感器要求。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">I2C 时钟频率、时序、上拉等仍需按传感器手册配置，控制器驱动不会自动适配。\u003c/p>","source":"L03 p2 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q20","ch":2,"no":"Q20","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 中，中断优先级数值越小，逻辑优先级越______。\u003c/span>","options":[],"answer":"越高","answerKey":"","why":"\u003cp class=\"q-why\">NVIC 里数值越小优先级越高，0 最高。\u003c/p>","source":"L03 p9 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q21","ch":2,"no":"Q21","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZGT6 的 NVIC 支持多少个可屏蔽中断，并且具有多少级可编程的中断优先级？( )","options":[{"key":"A","html":"82个可屏蔽中断，16级可编程优先级"},{"key":"B","html":"92个可屏蔽中断，8级可编程优先级"},{"key":"C","html":"240个可屏蔽中断，256级可编程优先级"},{"key":"D","html":"10个可屏蔽中断，16级可编程优先级"}],"answer":"A（82 个、16 级）","answerKey":"A","why":"\u003cp class=\"q-why\">F407 的 NVIC 支持 82 个可屏蔽中断、16 级可编程优先级（4 位抢占分组）。\u003c/p>","source":"L05 p5 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q22","ch":2,"no":"Q22","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZGT6 的系统时钟（SYSCLK）最高可配置为多少 MHz？( )","options":[{"key":"A","html":"72MHz"},{"key":"B","html":"84MHz"},{"key":"C","html":"168MHz"},{"key":"D","html":"216MHz"}],"answer":"C（168 MHz）","answerKey":"C","why":"\u003cp class=\"q-why\">与外部晶振经 PLL 倍频后 SYSCLK 最高 168 MHz。\u003c/p>","source":"L05 p5 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q23","ch":2,"no":"Q23","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 的通用定时器 TIM2~TIM5 挂载在哪条总线上，其时钟来源是什么？ ( )","options":[{"key":"A","html":"APB2总线，时钟为APB2的2倍频或APB2时钟"},{"key":"B","html":"APB1总线，时钟为APB1的2倍频或APB1时钟"},{"key":"C","html":"AHB总线，时钟为HCLK"},{"key":"D","html":"APB2总线，时钟为APB2时钟"}],"answer":"B（APB1，时钟为 APB1 的 1 倍或 2 倍频）","answerKey":"B","why":"\u003cp class=\"q-why\">TIM2~TIM5 挂 APB1；当 APB1 预分频不为 1 时，定时器时钟为 APB1 的 2 倍。\u003c/p>","source":"L05 p5 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q24","ch":2,"no":"Q24","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 中，定时器产生更新中断的时间计算公式为 Tout = ((arr+1)×(psc+1))/Tclk，其中 psc 和 arr 分别代表？","options":[{"key":"A","html":"预分频器和自动重装载寄存器值"},{"key":"B","html":"自动重装载寄存器和预分频器值"},{"key":"C","html":"计数器和比较寄存器值"},{"key":"D","html":"捕获寄存器和预分频器值"}],"answer":"A","answerKey":"A","why":"\u003cp class=\"q-why\">psc = 预分频器（Prescaler），arr = 自动重装载寄存器（Auto-Reload Register）；Tout=((arr+1)(psc+1))/Tclk。\u003c/p>","source":"L05 p5 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q25","ch":2,"no":"Q25","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 的 SysTick 定时器属于（ ）","options":[{"key":"A","html":"挂在 APB1 总线上的外设"},{"key":"B","html":"挂在 APB2 总线上的外设"},{"key":"C","html":"挂在 AHB1 总线上的外设"},{"key":"D","html":"Cortex-M4 内核内部的系统定时器"}],"answer":"D（Cortex-M4 内核内部系统定时器）","answerKey":"D","why":"\u003cp class=\"q-why\">SysTick 是内核私有外设，不挂 APB1/APB2/AHB1。\u003c/p>","source":"L05 p8 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q26","ch":2,"no":"Q26","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于 STM32F407 的 USART1 与 UART5 的时钟总线挂载，正确的是（ ）","options":[{"key":"A","html":"两者都挂在 APB1"},{"key":"B","html":"USART1 挂在 APB2，UART5 挂在 APB1"},{"key":"C","html":"两者都挂在 APB2"},{"key":"D","html":"USART1 挂在 APB1，UART5 挂在 APB2"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">USART1/USART6 在 APB2，USART2/3、UART4/5 在 APB1。\u003c/p>","source":"L05 p8 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q27","ch":2,"no":"Q27","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 使用 25 MHz 外部晶振时，主 PLL 的 VCO 输入分频因子 M 通常设置为 ______，使 VCO 输入时钟为 1 MHz。\u003c/span>","options":[],"answer":"M = 25","answerKey":"","why":"\u003cp class=\"q-why\">25 MHz / M = 1 MHz ⇒ M=25，这是 CubeMX 时钟树配置的常用起点。\u003c/p>","source":"L05 p8 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q28","ch":2,"no":"Q28","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 的 USART 同时支持同步和异步通信，而 UART 只支持异步通信。（ ）\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">USART 的 S 即 Synchronous，可同步也可异步；UART 只有异步。\u003c/p>","source":"L05 p8 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q29","ch":2,"no":"Q29","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZGT6 中，下列外设仅支持异步串行通信的是（ ）","options":[{"key":"A","html":"USART1"},{"key":"B","html":"USART2"},{"key":"C","html":"UART4"},{"key":"D","html":"USART6"}],"answer":"C（UART4）","answerKey":"C","why":"\u003cp class=\"q-why\">名字带 \"UART\" 的只支持异步；带 \"USART\" 的支持同步+异步。\u003c/p>","source":"L06 p2 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q30","ch":2,"no":"Q30","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 的 Cortex-M4 内核不支持以下哪项特性？( )","options":[{"key":"A","html":"单精度浮点运算单元（FPU）"},{"key":"B","html":"DSP 扩展指令集（SIMD）"},{"key":"C","html":"MVE（Helium）向量扩展指令集"},{"key":"D","html":"单周期乘加（MAC）操作"}],"answer":"C（MVE/Helium）","answerKey":"C","why":"\u003cp class=\"q-why\">MVE（Helium）是 Cortex-M55/M85 的 Armv8.1-M 特性；M4 有单精度 FPU、DSP/SIMD 与单周期 MAC。\u003c/p>","source":"L07 p9 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q31","ch":2,"no":"Q31","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在Cortex-M4 上启用硬件 FPU 进行浮点运算时，GCC 编译器需要添加的编译选项是（ ）","options":[{"key":"A","html":"-mfloat-abi=soft"},{"key":"B","html":"-mfpu=none"},{"key":"C","html":"-mfloat-abi=hard -mfpu=fpv4-sp-d16"},{"key":"D","html":"-mthumb -mno-fpu"}],"answer":"C（-mfloat-abi=hard -mfpu=fpv4-sp-d16）","answerKey":"C","why":"\u003cp class=\"q-why\">M4 是 FPv4 单精度 16 个双字寄存器；soft/none/mno-fpu 都是关掉硬件浮点。\u003c/p>","source":"L07 p9 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q32","ch":2,"no":"Q32","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 上部署 AI 模型时，模型的权重数据和运行时激活值必须存放在同一块存储器中。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">权重可放 Flash（只读常量），激活值必须放 RAM，二者不必同块存储器。\u003c/p>","source":"L07 p9 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q33","ch":2,"no":"Q33","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 的 CAN 控制器与 CAN 总线之间必须通过（ ）连接。","options":[{"key":"A","html":"直接相连"},{"key":"B","html":"CAN 收发器"},{"key":"C","html":"电平转换芯片"},{"key":"D","html":"光耦隔离器"}],"answer":"B（CAN 收发器）","answerKey":"B","why":"\u003cp class=\"q-why\">MCU 输出的是 TTL 逻辑电平，必须经收发器转成 CAN_H/CAN_L 差分电平。\u003c/p>","source":"L08 p4 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q34","ch":2,"no":"Q34","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 使用 CAN2 时，必须先使能 ______ 的时钟，因为 CAN1 是主控制器。\u003c/span>","options":[],"answer":"CAN1 的时钟","answerKey":"","why":"\u003cp class=\"q-why\">CAN1 是主控制器，管理滤波器组等共享资源，用 CAN2 前必须先使能 CAN1。\u003c/p>","source":"L08 p4 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q35","ch":2,"no":"Q35","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">某工程师将一块在 PC 上验证通过的轻量级 CNN（权重约 400 KB）通过 X-CUBE-AI 部署到 STM32F407VGT6（1 MB Flash / 192 KB RAM）。CubeMX 的 AI 分析报告显示“Flash 占用 380 KB，RAM 占用 110 KB”，看起来余量充足。但烧录后程序在 MX_X_CUBE_AI_Process() 处卡死或进入 HardFault。以下判断最准确的是( )","options":[{"key":"A","html":"X-CUBE-AI 生成的代码有 bug，与模型无关"},{"key":"B","html":"只要 Flash 没满，RAM 就不会成为瓶颈"},{"key":"C","html":"F407 的 192 KB RAM 对任何 AI 模型都足够，卡死一定是中断冲突"},{"key":"D","html":"报告中的 RAM 占用通常只包含权重和部分激活缓冲的静态估算，实际运行时栈、HAL 缓冲区、用户变量与激活缓冲叠加后可能超出 192 KB，或激活缓冲未被正确分配到可用 RAM 区域"}],"answer":"D","answerKey":"D","why":"\u003cp class=\"q-why\">Analyze 报的是静态估算；实际运行还有栈、HAL 缓冲、用户变量叠加，192 KB RAM 可能被撑爆或激活缓冲分配到不可用的 CCM 区，导致 HardFault。\u003c/p>","source":"L10 p3 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q36","ch":2,"no":"Q36","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在 CubeMX 中，SYS → Debug 的默认设置是______。对于 STM32F407 开发板，如果生成代码前不将其改为______，第一次烧录后 SWD 可能被禁用，导致第二次无法连接。\u003c/span>","options":[],"answer":"No Debug；Serial Wire","answerKey":"","why":"\u003cp class=\"q-why\">默认是 No Debug；不改成 Serial Wire，第一次烧录后 SWD 被禁用，第二次就连不上了。\u003c/p>","source":"L10 p3 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q37","ch":2,"no":"Q37","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 上通过 X-CUBE-AI 部署模型时，若实验目标是“先验证模型在目标板上的数值行为”，应选择哪种模板？( )","options":[{"key":"A","html":"System Performance"},{"key":"B","html":"Application Template"},{"key":"C","html":"Validation"},{"key":"D","html":"空白工程"}],"answer":"C（Validation）","answerKey":"C","why":"\u003cp class=\"q-why\">Validation 会用随机/给定输入在板端跑一遍并与 PC 参考输出比对；System Performance 测耗时，Application Template 生成应用示例。\u003c/p>","source":"L11 p3 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q38","ch":2,"no":"Q38","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 上使用 TFLite Micro 部署模型时，tensor_arena 的起始地址必须满足的对齐要求是（ ）。","options":[{"key":"A","html":"4 字节对齐"},{"key":"B","html":"8 字节对齐"},{"key":"C","html":"16 字节对齐"},{"key":"D","html":"无需对齐，仅需位于 SRAM 范围内"}],"answer":"C（16 字节对齐）","answerKey":"C","why":"\u003cp class=\"q-why\">TFLite Micro 的 tensor arena 需 16 字节对齐，否则某些算子访问会 HardFault。\u003c/p>","source":"L13 p2 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q39","ch":2,"no":"Q39","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407 在 168 MHz 下从 Flash 取指执行 AI 推理时，通常需要插入等待周期。若不开启 ART Accelerator 或未合理利用 I-Cache，可能导致的直接后果是（ ）。","options":[{"key":"A","html":"模型权重的数值精度下降"},{"key":"B","html":"推理延迟显著增加，因为 Flash 访问需要额外等待周期"},{"key":"C","html":"Tensor Arena 的大小自动减小"},{"key":"D","html":"CMSIS-NN 自动禁用 SIMD 指令"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">Flash 取指需要等待周期，直接影响的是推理延迟，不改变权重精度或 arena 大小。\u003c/p>","source":"L13 p2 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q40","ch":2,"no":"Q40","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 上启用 FPU 后，所有浮点运算都会自动获得硬件加速，无需再关注编译器选项或代码对齐。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">还要正确的编译选项、常量加 f 后缀、数据对齐与链接库支持，否则仍可能走软件浮点。\u003c/p>","source":"L13 p2 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q41","ch":3,"no":"Q41","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">在STM32中，NVIC的主要内容是什么？\u003c/span>","options":[],"answer":"嵌套向量中断控制器：管理中断使能/挂起、优先级分组（抢占+响应）、中断向量与嵌套","answerKey":"","why":"\u003cp class=\"q-why\">简答按\"中断管理 + 优先级分组 + 向量表 + 嵌套\"四点写即可。\u003c/p>","source":"L01 p8 题1","tags":[],"needsCheck":false,"points":["简答按\"中断管理 + 优先级分组 + 向量表 + 嵌套\"四点写即可"]},{"id":"stm32-Q42","ch":3,"no":"Q42","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 FreeRTOS 中，从中断服务程序（ISR）向任务发送队列数据时，应使用哪个函数？","options":[{"key":"A","html":"xQueueSend()"},{"key":"B","html":"xQueueSendFromISR()"},{"key":"C","html":"xQueueReceive()"},{"key":"D","html":"xQueuePeek()"}],"answer":"B（xQueueSendFromISR）","answerKey":"B","why":"\u003cp class=\"q-why\">ISR 中必须用 FromISR 版本，普通 xQueueSend 可能引发阻塞或断言。\u003c/p>","source":"L03 p9 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q43","ch":3,"no":"Q43","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">FreeRTOS 中，中断服务程序应尽量简短，将耗时处理“延迟”到任务中完成，这种机制称为____________。\u003c/span>","options":[],"answer":"延迟中断处理（Deferred Interrupt Processing）","answerKey":"","why":"\u003cp class=\"q-why\">ISR 只做最短的现场保护与通知，实际处理交给任务/守护任务。\u003c/p>","source":"L03 p9 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q44","ch":3,"no":"Q44","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在 FreeRTOS 配置中，任何优先级的中断都可以安全地调用 FreeRTOS API 函数.（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">高于 configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY 的中断不能调用 API，否则会破坏临界区。\u003c/p>","source":"L03 p9 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q45","ch":3,"no":"Q45","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在中断服务程序中，可以使用 vTaskDelay() 函数来延时。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">vTaskDelay 会阻塞，ISR 中禁止调用任何可能阻塞的 API。\u003c/p>","source":"L03 p9 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q46","ch":3,"no":"Q46","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32F407 中，如果两个中断的抢占优先级相同，关于响应优先级的作用，下列说法正确的是？","options":[{"key":"A","html":"高响应优先级可以打断低响应优先级的中断"},{"key":"B","html":"响应优先级仅用于判断同时到达的中断的执行顺序，不可打断"},{"key":"C","html":"响应优先级与抢占优先级作用完全相同"},{"key":"D","html":"响应优先级只在组4中有效"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">响应优先级只在多个中断同时挂起时决定先执行谁，不能产生嵌套打断。\u003c/p>","source":"L05 p5 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q47","ch":4,"no":"Q47","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">利用按键key1与key2实现对A53开发板上4个LED灯与蜂鸣器的控制，当第1次按key1时，LED灯实现流水，再次按key1时，LED灯分两组依次实现连续5秒的闪烁，第3次按时，则关闭LED灯，key2按1次，打开蜂鸣器叫，再按则关闭，同时在LCD面板上统计各自按键的次数。\u003c/span>","options":[],"answer":"实验/编程题","answerKey":"","why":"\u003cp class=\"q-why\">要点：按键消抖 + 状态机记录按下次数，三次循环切换 LED 流水/分组闪烁/关闭，key2 切换蜂鸣器，LCD 显示计数。\u003c/p>","source":"L02 p13 题2","tags":[],"needsCheck":false,"points":["要点：按键消抖 + 状态机记录按下次数，三次循环切换 LED 流水/分组闪烁/关闭，key2 切换蜂鸣器，LCD 显示计数"]},{"id":"stm32-Q48","ch":4,"no":"Q48","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">SysTick 定时器的当前数值寄存器（VAL）在计数到 0 后，其行为是（ ）","options":[{"key":"A","html":"停止计数，等待软件清零"},{"key":"B","html":"自动重新装载 LOAD 寄存器的值并继续递减计数"},{"key":"C","html":"触发硬件复位"},{"key":"D","html":"保持为 0 直到手动写入"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">自动重新装载 LOAD 寄存器的值并继续递减计数，不会停下等软件清零。\u003c/p>","source":"L05 p8 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q49","ch":4,"no":"Q49","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">STM32F407ZGT6 的 I2C 总线中，SCL 和 SDA 引脚通常应配置为（ ）","options":[{"key":"A","html":"推挽输出"},{"key":"B","html":"复用开漏输出，并外接上拉电阻"},{"key":"C","html":"浮空输入"},{"key":"D","html":"模拟输入"}],"answer":"B（复用开漏 + 外接上拉电阻）","answerKey":"B","why":"\u003cp class=\"q-why\">I2C 是开漏总线，必须外接上拉才能输出高电平；推挽会造成总线冲突。\u003c/p>","source":"L06 p2 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q50","ch":5,"no":"Q50","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">串口异步通信中，波特率表示每秒钟传输的 ______ 数量。\u003c/span>","options":[],"answer":"码元 / 二进制位（bit）数","answerKey":"","why":"\u003cp class=\"q-why\">单位 bps（bit per second）；异步串口一帧还含起始位、校验位、停止位，有效数据率低于波特率。\u003c/p>","source":"L05 p8 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q51","ch":5,"no":"Q51","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">对题1采集的两板传感器数据记录，至少各100条以上，利用https://qingsong.blog.csdn.net/article/details/130823175（我在STM32单片机上跑神经网络算法—CUBE-AI）操作方法，利用神经网络方法进行训练，在后续采集的数据中进行检测，任取10条记录，能否在串口/页面中判定是哪个开发板数据，是哪个传感器采集数据？\u003c/span>","options":[],"answer":"实验/编程题","answerKey":"","why":"\u003cp class=\"q-why\">每板 ≥100/200/300 条，按板号与传感器打标签；选 SVM / K-Means / iForest / 1D-CNN / MLP 之一训练，报告来源判定准确率与异常判定理由。\u003c/p>","source":"L06 p13 题2","tags":[],"needsCheck":false,"points":["每板 ≥100/200/300 条，按板号与传感器打标签","选 SVM / K-Means / iForest / 1D-CNN / MLP 之一训练，报告来源判定准确率与异常判定理由"]},{"id":"stm32-Q52","ch":5,"no":"Q52","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">使用 HAL 库以查询/阻塞方式通过 USART2 发送一段数据，常用函数是（ ）","options":[{"key":"A","html":"HAL_UART_Transmit()"},{"key":"B","html":"HAL_I2C_Master_Transmit()"},{"key":"C","html":"HAL_UART_Receive_IT()"},{"key":"D","html":"HAL_GPIO_WritePin()"}],"answer":"A（HAL_UART_Transmit）","answerKey":"A","why":"\u003cp class=\"q-why\">阻塞发送用 HAL_UART_Transmit；_IT 是中断方式、_DMA 是 DMA 方式；HAL_GPIO_WritePin 是写引脚。\u003c/p>","source":"L06 p2 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q53","ch":5,"no":"Q53","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在STM32F4 HAL库中，若I2C从机7位地址为 0x50，调用 HAL_I2C_Master_ Transmit() 时，DevAddress通常应写为（ ）","options":[{"key":"A","html":"0x50"},{"key":"B","html":"0x90"},{"key":"C","html":"0x28"},{"key":"D","html":"0xA0"}],"answer":"D（0xA0）","answerKey":"D","why":"\u003cp class=\"q-why\">HAL 的 DevAddress 要求 8 位地址：0x50 左移一位 = 0xA0（最低位是读写位，由 HAL 内部处理）。\u003c/p>","source":"L06 p2 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q54","ch":5,"no":"Q54","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">I2C的SCL和SDA可以直接配置为普通推挽输出，不需要外接上拉电阻。( ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">开漏 + 上拉是 I2C 的电气要求，推挽会破坏\"线与\"特性。\u003c/p>","source":"L06 p2 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q55","ch":5,"no":"Q55","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">RS485 与 RS232 的主要区别在于（ ）","options":[{"key":"A","html":"RS485 使用差分信号，RS232 使用单端信号"},{"key":"B","html":"协议层完全不同"},{"key":"C","html":"RS485 只能点对点通信"},{"key":"D","html":"RS232 传输距离更远"}],"answer":"A","answerKey":"A","why":"\u003cp class=\"q-why\">RS485 差分、RS232 单端；因此 RS485 距离远、可多点，RS232 通常点对点且距离短。\u003c/p>","source":"L08 p4 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q56","ch":5,"no":"Q56","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">RS485 收发器中，控制发送/接收方向切换的引脚是（ ）","options":[{"key":"A","html":"TX 和 RX"},{"key":"B","html":"A 和 B"},{"key":"C","html":"DE/RE"},{"key":"D","html":"VCC 和 GND"}],"answer":"C（DE/RE）","answerKey":"C","why":"\u003cp class=\"q-why\">半双工 RS485 由 DE/RE 控制收发方向；A/B 是差分数据线。\u003c/p>","source":"L08 p4 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q57","ch":6,"no":"Q57","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">在stm32cubemx安装好x-cube-ai, stm32cubemx版本至少6.9以上，并利用st帐号登录，在 [STMicroelectronics] 标签页下找到 [X-CUBE-AI]，勾选需要的 Artificial Intelligence 版本，点 [Install]，按提示完成安装即可。\u003c/span>","options":[],"answer":"操作步骤","answerKey":"","why":"\u003cp class=\"q-why\">CubeMX ≥ 6.9 → 用 ST 账号登录 → Help → Manage embedded software packages → STMicroelectronics 标签 → 勾选 X-CUBE-AI 的 Artificial Intelligence 版本 → Install。\u003c/p>","source":"L06 p13 题0","tags":[],"needsCheck":false,"points":["CubeMX ≥ 6.9 → 用 ST 账号登录 → Help → Manage embedded software packages → STMicroelectronics 标签 → 勾选 X-CUBE-AI 的 Artificial Intelligence 版本 → Install"]},{"id":"stm32-Q58","ch":6,"no":"Q58","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">STM32CubeMX 本身可以训练神经网络，并直接生成训练好的 AI 模型。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">只做转换与部署，不做训练。\u003c/p>","source":"L07 p10 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q59","ch":6,"no":"Q59","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">Spring boot最大特点是基于”零配置”设计，极大的减少了XML配置文件的出现。( )\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">Spring Boot 的核心就是\"约定优于配置 / 零配置\"，大幅减少 XML 配置，靠自动配置与 starter 依赖起步。\u003c/p>","source":"L07 p3 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q60","ch":6,"no":"Q60","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32CubeMX 中安装 X-CUBE-AI 扩展包的正确操作路径是（ ）","options":[{"key":"A","html":"File → New Project → X-CUBE-AI"},{"key":"B","html":"Help → Manage embedded software packages → 找到 X-CUBE-AI → Install"},{"key":"C","html":"Project Manager → Code Generator → X-CUBE-AI"},{"key":"D","html":"Tools → AI Configuration → Install"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">Help → Manage embedded software packages → STMicroelectronics → X-CUBE-AI → Install。\u003c/p>","source":"L08 p5 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q61","ch":6,"no":"Q61","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">使用 X-CUBE-AI 部署 AI 模型时，必须在 CubeMX 中额外开启的外设是（ ）","options":[{"key":"A","html":"DMA"},{"key":"B","html":"CRC"},{"key":"C","html":"RNG"},{"key":"D","html":"RTC"}],"answer":"B（CRC）","answerKey":"B","why":"\u003cp class=\"q-why\">X-CUBE-AI 生成库依赖 CRC 外设做校验，模板会要求使能。\u003c/p>","source":"L08 p5 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q62","ch":6,"no":"Q62","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">X-CUBE-AI 是 STM32Cube 的扩展包，它扩展了 STM32CubeMX 的功能，能够自动转换预训练的______和______模型，并生成优化后的 C 代码库集成到用户项目中。\u003c/span>","options":[],"answer":"神经网络；深度学习","answerKey":"","why":"\u003cp class=\"q-why\">X-CUBE-AI 把预训练模型转成优化 C 代码并集成进工程。\u003c/p>","source":"L08 p5 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q63","ch":6,"no":"Q63","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">X-CUBE-AI 是 STM32CubeMX 的内置核心功能，无需额外安装扩展包即可使用。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">它是需要单独安装的扩展包（AI 插件）。\u003c/p>","source":"L08 p5 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q64","ch":7,"no":"Q64","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">X-CUBE-AI 不支持导入以下哪种模型格式？（ ）","options":[{"key":"A","html":"TensorFlow Lite"},{"key":"B","html":"ONNX"},{"key":"C","html":"Keras"},{"key":"D","html":"Verilog HDL"}],"answer":"D（Verilog HDL）","answerKey":"D","why":"\u003cp class=\"q-why\">Verilog 是硬件描述语言，根本不是神经网络模型格式。\u003c/p>","source":"L07 p10 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q65","ch":7,"no":"Q65","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32CubeMX 中配置 AI 模型时，选择 INT8 量化一定不会造成精度损失。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">量化几乎总会带来一定精度损失，需要校准集与验证；\"一定不会\"是绝对化表述。\u003c/p>","source":"L07 p10 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q66","ch":7,"no":"Q66","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在 CubeMX 中导入 AI 模型后，点击 ________ 按钮可查看模型所需的 Flash、RAM 和 MAC 等估算信息。\u003c/span>","options":[],"answer":"Analyze","answerKey":"","why":"\u003cp class=\"q-why\">Analyze 生成资源占用报告；Validation 是数值验证、System Performance 是性能跑分。\u003c/p>","source":"L07 p10 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q67","ch":7,"no":"Q67","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 STM32CubeMX 的 X-CUBE-AI 配置界面中，点击 “Analyze” 的主要作用是（ ）","options":[{"key":"A","html":"训练神经网络模型"},{"key":"B","html":"分析模型的 Flash、RAM 和 MAC 等资源占用"},{"key":"C","html":"烧录程序到 STM32"},{"key":"D","html":"生成 PCB 封装"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">分析模型的 Flash、RAM、MAC/MACC 等资源占用。\u003c/p>","source":"L07 p10 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q68","ch":7,"no":"Q68","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">以下关于 STM32Cube.AI 的描述，错误的是（ ）","options":[{"key":"A","html":"集成于 STM32CubeMX 工具链中，可自动生成 C 代码接口"},{"key":"B","html":"仅支持 TensorFlow Lite 一种模型格式导入"},{"key":"C","html":"可分析并报告模型所需的 RAM 和 Flash 大小"},{"key":"D","html":"支持对模型进行 INT8 量化以减小资源占用"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">X-CUBE-AI 支持 TFLite、Keras、ONNX 等多种格式，不是\"仅支持 TFLite\"。\u003c/p>","source":"L07 p9 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q69","ch":7,"no":"Q69","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">当 INT8 量化模型的权重数组超出 STM32F407 内部 Flash 容量时，以下方案中最合理的是（ ）","options":[{"key":"A","html":"将模型权重放入外部 QSPI NOR Flash，激活缓冲区保留在片上 SRAM"},{"key":"B","html":"将全部数据（权重和激活缓冲区）放入 SD 卡"},{"key":"C","html":"将模型精度从 INT8 提升到 FP32 以减小体积"},{"key":"D","html":"增大堆栈大小以容纳模型数据"}],"answer":"A","answerKey":"A","why":"\u003cp class=\"q-why\">权重放外部 QSPI NOR Flash（只读、容量大），激活缓冲区必须留在片上 SRAM 保证速度；FP32 反而更大，堆栈调大解决不了 Flash 溢出。\u003c/p>","source":"L07 p9 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q70","ch":7,"no":"Q70","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 X-CUBE-AI 的模型配置界面中，Optimization 选项设置为“Smallest”的含义是（ ）","options":[{"key":"A","html":"最大化推理速度，可能增加内存占用"},{"key":"B","html":"最小化内存占用，牺牲速度"},{"key":"C","html":"平衡速度与内存，为默认选项"},{"key":"D","html":"手动选择每层的优化策略"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">Smallest = 最小化 RAM/Flash 占用，代价是推理变慢；Fastest 反之，Balanced 是默认折中。\u003c/p>","source":"L08 p5 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q71","ch":7,"no":"Q71","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在 CubeMX 6.15.0 中为 F407 生成 X-CUBE-AI 工程后，编译报大量 undefined reference to forward_xxx 或 ai_xxx_run 链接错误。以下最接近根因的描述是( )","options":[{"key":"A","html":"F407 不支持 X-CUBE-AI，必须改用 STM32Cube AI Studio"},{"key":"B","html":"CubeMX 6.15.0 生成的项目不再自动将 AI Runtime 静态库（.a）加入链接器，需要在 MCU GCC Linker 中手动补上库名和搜索路径"},{"key":"C","html":"模型文件损坏，重新导出 ONNX 即可"},{"key":"D","html":"F407 的 Flash 不够，链接器拒绝生成可执行文件"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">CubeMX 6.15 起生成工程可能没自动把 AI Runtime 静态库(.a)加入链接器，需要在 MCU GCC Linker 手动补库名与搜索路径。\u003c/p>","source":"L10 p3 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q72","ch":7,"no":"Q72","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">使用 X-CUBE-AI 将 AI 模型转换为 C 代码时，推荐在 Analyze 阶段重点确认的指标是( )","options":[{"key":"A","html":"模型训练准确率"},{"key":"B","html":"RAM/Flash 占用与 MACC"},{"key":"C","html":"数据集大小"},{"key":"D","html":"摄像头分辨率"}],"answer":"B（RAM/Flash 占用与 MACC）","answerKey":"B","why":"\u003cp class=\"q-why\">部署阶段关心的是能不能装下、跑多快；训练准确率是 PC 端的事。\u003c/p>","source":"L11 p3 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q73","ch":7,"no":"Q73","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">X-CUBE-AI 原生支持的模型格式不包括以下哪一项？( )","options":[{"key":"A","html":"TensorFlow Lite（.tflite）"},{"key":"B","html":"Keras（.h5）"},{"key":"C","html":"PyTorch 原生 .pt 格式"},{"key":"D","html":"可导出为 ONNX 的模型"}],"answer":"C（PyTorch 原生 .pt）","answerKey":"C","why":"\u003cp class=\"q-why\">PyTorch 需先导出为 ONNX 或 TFLite；.pt 不被原生支持。\u003c/p>","source":"L11 p3 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q74","ch":7,"no":"Q74","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">X-CUBE-AI 支持 32 位浮点模型，也支持___位量化 模型（TensorFlow Lite 或 ONNX QDQ 格式），以降低 Flash/RAM 占用并提升推理速度。\u003c/span>","options":[],"answer":"8（INT8）","answerKey":"","why":"\u003cp class=\"q-why\">INT8 量化把权重/激活从 32 位浮点压到 8 位，Flash/RAM 约省 4 倍。\u003c/p>","source":"L11 p3 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q75","ch":7,"no":"Q75","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在 CubeMX 中启用 X-CUBE-AI 后，CRC 外设是完全可选的，不使能也不影响模型推理。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">按课件与 X-CUBE-AI 工程模板要求需使能 CRC；题干说\"完全可选\"与课件考点相悖，判错。\u003c/p>","source":"L11 p3 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q76","ch":7,"no":"Q76","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">使用 X-CUBE-AI 在 STM32F407 上部署量化模型时，推理结果与 PC 端不一致，最不可能的原因是（ ）。","options":[{"key":"A","html":"训练端量化参数（scale / zero-point）与 X-CUBE-AI 工具链生成的参数不一致"},{"key":"B","html":"输入数据的预处理方式与训练时不一致（例如归一化参数不同）"},{"key":"C","html":"STM32F407 的 Flash 容量为 1 MB，导致 INT8 权重被截断"},{"key":"D","html":"模型中使用了 X-CUBE-AI 不支持或回退到低效实现的算子，改变了数值行为"}],"answer":"C","answerKey":"C","why":"\u003cp class=\"q-why\">F407 有 1 MB Flash，\"容量小到截断 INT8 权重\"不成立；量化参数不一致、预处理不一致、算子回退才是常见原因。\u003c/p>","source":"L13 p2 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q77","ch":8,"no":"Q77","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">S5P6818是一款支持64位计算的ARM处理器。( )\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">S5P6818 是三星 8 核 Cortex-A53（ARMv8-A，64 位）。\u003c/p>","source":"L01 p11 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q78","ch":8,"no":"Q78","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">三星S5P6818处理器采用的CPU核心架构是( )","options":[{"key":"A","html":"Cortex-A7"},{"key":"B","html":"Cortex-A9"},{"key":"C","html":"Cortex-A53"},{"key":"D","html":"Cortex-A15"}],"answer":"C（Cortex-A53）","answerKey":"C","why":"\u003cp class=\"q-why\">A53 是 64 位 ARMv8-A 低功耗核心。\u003c/p>","source":"L01 p11 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q79","ch":8,"no":"Q79","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">S5P6818处理器集成的GPU（图形处理单元）型号是( )","options":[{"key":"A","html":"Mali-400"},{"key":"B","html":"Mali-T760"},{"key":"C","html":"Mali-450"},{"key":"D","html":"Mali-T820"}],"answer":"A（Mali-400）","answerKey":"A","why":"\u003cp class=\"q-why\">S5P6818 集成 Mali-400 MP GPU。\u003c/p>","source":"L01 p11 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q80","ch":8,"no":"Q80","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">请根据gec6818开发板-刷机教程v1.1-new.pdf，利用A53将自己开发板重新烧写linux镜像1次，要注意开发板安全与刷写步骤。\u003c/span>","options":[],"answer":"实验/操作题","answerKey":"","why":"\u003cp class=\"q-why\">按刷机教程进入 UBOOT/fastboot 模式，用 fastboot 烧写 Linux 镜像；注意电源电压、串口线序与刷写过程不要断电。\u003c/p>","source":"L02 p12 题2","tags":[],"needsCheck":false,"points":["按刷机教程进入 UBOOT/fastboot 模式，用 fastboot 烧写 Linux 镜像","注意电源电压、串口线序与刷写过程不要断电"]},{"id":"stm32-Q81","ch":8,"no":"Q81","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在Ubuntu主机上为ARM架构的S5P6818开发板编译“Hello World”程序，通常需要使用( )","options":[{"key":"A","html":"gcc"},{"key":"B","html":"g++"},{"key":"C","html":"arm-linux-gcc"},{"key":"D","html":"visual studio"}],"answer":"C（arm-linux-gcc）","answerKey":"C","why":"\u003cp class=\"q-why\">宿主机 x86、目标机 ARM，必须用交叉编译器 arm-linux-gcc。\u003c/p>","source":"L02 p8 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q82","ch":8,"no":"Q82","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">通过串口终端（如Putty、Minicom）连接到S5P6818开发板时，最常见的串口波特率（Baud Rate）是：( )","options":[{"key":"A","html":"9600"},{"key":"B","html":"115200"},{"key":"C","html":"4800"},{"key":"D","html":"57600"}],"answer":"B（115200）","answerKey":"B","why":"\u003cp class=\"q-why\">开发板串口终端（Putty/Minicom）几乎都用 115200 8N1。\u003c/p>","source":"L02 p8 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q83","ch":8,"no":"Q83","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在主机上编译S5P6818开发板的Linux内核时，生成的可执行内核镜像文件通常命名为： ( )","options":[{"key":"A","html":"zImage"},{"key":"B","html":"rootfs.img"},{"key":"C","html":"bootloader.bin"},{"key":"D","html":"system.iso"}],"answer":"A（zImage）","answerKey":"A","why":"\u003cp class=\"q-why\">Linux 内核编译产物是 zImage/uImage；rootfs.img 是根文件系统、bootloader.bin 是引导程序。\u003c/p>","source":"L02 p8 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q84","ch":8,"no":"Q84","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">使用fastboot工具刷写A53开发板系统时，开发板必须处于UBOOT的fastboot模式。( )\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">必须让开发板进入 UBOOT 的 fastboot 模式，PC 端 fastboot 才能识别并烧写。\u003c/p>","source":"L02 p8 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q85","ch":8,"no":"Q85","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">Linux C语言中，temp = (5&lt;3) &amp;&amp;(7&gt;1); 运行此句后temp的逻辑值为( )","options":[{"key":"A","html":"0"},{"key":"B","html":"1"},{"key":"C","html":"2"},{"key":"D","html":"3"}],"answer":"A（0）","answerKey":"A","why":"\u003cp class=\"q-why\">5\u003c3 为假(0)，逻辑与短路，结果为 0。\u003c/p>","source":"L03 p10 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q86","ch":8,"no":"Q86","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在Linux下，QT Creator默认的构建工具是？( )","options":[{"key":"A","html":"Cmake"},{"key":"B","html":"Qmake"},{"key":"C","html":"Autotools"},{"key":"D","html":"Makefile"}],"answer":"B（qmake）","answerKey":"B","why":"\u003cp class=\"q-why\">QT Creator 传统默认用 qmake（新版本也支持 CMake），按课件答案记 B。\u003c/p>","source":"L03 p11 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q87","ch":8,"no":"Q87","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">以下哪个快捷键用于在QT Creator中快速打开项目？","options":[{"key":"A","html":"Ctrl+O"},{"key":"B","html":"Ctrl+N"},{"key":"C","html":"Ctrl+Shift+O"},{"key":"D","html":"Ctrl+Alt+N"}],"answer":"C（Ctrl+Shift+O）","answerKey":"C","why":"\u003cp class=\"q-why\">Ctrl+O 常为打开单个文件；快速打开项目是 Ctrl+Shift+O。\u003c/p>","source":"L03 p11 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q88","ch":8,"no":"Q88","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在QT Creator中，生成项目的编译命令是__________。\u003c/span>","options":[],"answer":"qmake（随后 make）","answerKey":"","why":"\u003cp class=\"q-why\">qmake 根据 .pro 生成 Makefile，再执行 make 编译；也可直接在 QT Creator 里点构建。\u003c/p>","source":"L03 p11 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q89","ch":8,"no":"Q89","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">QT Creator仅支持C++语言开发。 ( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">还支持 QML/JavaScript、Python（PySide）等。\u003c/p>","source":"L03 p11 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q90","ch":8,"no":"Q90","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">QT Designer中可以直接编写C++代码。 ( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">Designer 只做界面拖拽布局；C++ 逻辑在编辑器/槽函数里写。\u003c/p>","source":"L03 p11 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q91","ch":8,"no":"Q91","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在Linux下，QT5应用程序默认使用什么编译器？","options":[{"key":"A","html":"GCC"},{"key":"B","html":"Clang"},{"key":"C","html":"MSVC"},{"key":"D","html":"ICC"}],"answer":"A（GCC）","answerKey":"A","why":"\u003cp class=\"q-why\">Linux 下 QT5 默认用 GCC；Windows 下可能是 MSVC/MinGW。\u003c/p>","source":"L03 p11 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q92","ch":8,"no":"Q92","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">假设温湿度传感器通过I2C总线与S5P6818连接，在编写驱动时，获取I2C适配器（Adapter）后，创建并注册I2C设备数据结构的最佳方式是？( )","options":[{"key":"A","html":"使用 i2c_new_device() 函数动态创建"},{"key":"B","html":"在设备树（Device Tree）的I2C节点下添加子节点，并使用 of_i2c_register_ devices()"},{"key":"C","html":"直接定义一个 struct i2c_client 并填充其地址"},{"key":"D","html":"在板级初始化代码中调用 i2c_register_board_info()"}],"answer":"B（设备树节点 + of_i2c_register_devices）","answerKey":"B","why":"\u003cp class=\"q-why\">现代 Linux 用设备树描述硬件，由 of_i2c_register_devices 自动注册 i2c_client；i2c_new_device / board_info 是旧式做法。\u003c/p>","source":"L03 p2 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q93","ch":8,"no":"Q93","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">驱动模块编译成功后，生成的是.ko文件。将其加载到S5P6818开发板内核的正确命令是？ ( )","options":[{"key":"A","html":"gcc -o sht3x.ko sht3x.c"},{"key":"B","html":"make modules"},{"key":"C","html":"insmod sht3x.ko"},{"key":"D","html":"./sht3x.ko"}],"answer":"C（insmod sht3x.ko）","answerKey":"C","why":"\u003cp class=\"q-why\">.ko 是内核模块，用 insmod（或 modprobe）加载；gcc 是编译、./ 是执行用户程序。\u003c/p>","source":"L03 p2 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q94","ch":9,"no":"Q94","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">分别取题1三个板其中各50条数据，分别分成5组，利用“习题解答.pdf”12.14方法分析三个板采样数据是否有显示性区分，说明理由。数据要求从txt或数据库读取\u003c/span>","options":[],"answer":"实验/分析题","answerKey":"","why":"\u003cp class=\"q-why\">按教材 12.14 的方法（方差分析 / 显著性检验）分组比较，数据从 txt 或数据库读取；结论要写\"是否有显著差异 + 依据 + 图注\"。\u003c/p>","source":"L06 p12 题3","tags":[],"needsCheck":false,"points":["按教材 12.14 的方法（方差分析 / 显著性检验）分组比较，数据从 txt 或数据库读取","结论要写\"是否有显著差异 + 依据 + 图注\""]},{"id":"stm32-Q95","ch":9,"no":"Q95","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">对题1采集的三板传感器数据记录，至少每板各100条以上，选择其中之一：KNN或决策树、集成学习法等AI算法进行python训练，从web显示数据中，在每个传感器数据中任取10条连续记录，利用AI算法进行匹配比较，请列出是哪个开发板数据，是哪个传感器采集数据？准确率是多少？\u003c/span>","options":[],"answer":"实验/分析题","answerKey":"","why":"\u003cp class=\"q-why\">选 KNN / 决策树 / 集成学习之一用 Python 训练，任取 10 条连续记录做来源匹配，报告判定结果与准确率。\u003c/p>","source":"L06 p14 题2","tags":[],"needsCheck":false,"points":["选 KNN / 决策树 / 集成学习之一用 Python 训练，任取 10 条连续记录做来源匹配，报告判定结果与准确率"]},{"id":"stm32-Q96","ch":9,"no":"Q96","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在MySQL中，触发器的执行是在数据的插入、更新或删除之前执行的。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">MySQL 触发器分 BEFORE 与 AFTER 两类，不是一律\"之前\"执行。\u003c/p>","source":"L06 p16 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q97","ch":9,"no":"Q97","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">视图是一种常用的数据对象，它是提供( )和( )数据的另一种途径，可以简化数据库操作。\u003c/span>\u003cbr>\u003cspan class=\"ln\"","options":[{"key":"A","html":"插入，更新"},{"key":"B","html":"查看，插入"},{"key":"C","html":"查看，检索"},{"key":"D","html":"检索，更新"}],"answer":"C","answerKey":"C","why":"\u003cp class=\"q-why\">视图是虚拟表，主要用于查看/检索数据并简化复杂查询；一般不用于插入更新（可更新视图有条件限制）。\u003c/p>","source":"L06 p16 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q98","ch":9,"no":"Q98","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">下面哪些标准可应用于数据库应用程序与数据库的连接操作( )","options":[{"key":"A","html":"JDBC"},{"key":"B","html":"DCOM"},{"key":"C","html":"ODBC"},{"key":"D","html":"ADO.NET"}],"answer":"A、C、D（JDBC / ODBC / ADO.NET）","answerKey":"A","why":"\u003cp class=\"q-why\">DCOM 是组件对象模型，不是数据库连接标准。\u003c/p>","source":"L06 p21 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q99","ch":9,"no":"Q99","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">SpringBoot工程在部署时，采用的是jar包的方式，内部自动依赖Tomcat容器，提供了多环境的配置。( )\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">Spring Boot 默认打成可执行 jar，内嵌 Tomcat，支持多环境 profile 配置。\u003c/p>","source":"L06 p21 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q100","ch":9,"no":"Q100","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">利用安卓系统，实现将主页编辑框中用户姓名与生日传递到第二页，并进行显示，计算用户岁数，当修改后，再返回到第一页上。注意按钮至少有提交与取消按钮。\u003c/span>","options":[],"answer":"实验/编程题","answerKey":"","why":"\u003cp class=\"q-why\">要点：Intent + Bundle 传姓名/生日 → 第二页计算年龄并显示 → setResult 回传 → 第一页 onActivityResult 接收；至少\"提交/取消\"两个按钮。\u003c/p>","source":"L07 p2 题1","tags":[],"needsCheck":false,"points":["要点：Intent + Bundle 传姓名/生日 → 第二页计算年龄并显示 → setResult 回传 → 第一页 onActivityResult 接收","至少\"提交/取消\"两个按钮"]},{"id":"stm32-Q101","ch":9,"no":"Q101","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">Spring为了简化项目设计的开发，在web容器中嵌入了spring容器，扩展了已有容器的功能。( )\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">Spring 的容器理念是把对象管理交给容器，Web 容器中嵌入 Spring 容器扩展功能。\u003c/p>","source":"L07 p3 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q102","ch":9,"no":"Q102","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">由于SpringBoot开发的特殊性，实际工作中往往需要借助于____或gradle这样的构建工具来开发项目.\u003c/span>","options":[],"answer":"Maven","answerKey":"","why":"\u003cp class=\"q-why\">Java 项目主流构建工具是 Maven 或 Gradle。\u003c/p>","source":"L07 p3 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q103","ch":9,"no":"Q103","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">启动spring Boot应用的方法是( )","options":[{"key":"A","html":"SpringBoot.start()"},{"key":"B","html":"ApringApplication.run()"},{"key":"C","html":"Spring.start()"},{"key":"D","html":"Context.start()"}],"answer":"B（SpringApplication.run，选项拼写为 ApringApplication.run）","answerKey":"B","why":"\u003cp class=\"q-why\">标准写法 SpringApplication.run(Application.class, args)；课件选项 B 有拼写笔误但指向它。\u003c/p>","source":"L07 p3 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q104","ch":9,"no":"Q104","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">SpringBoot应用启动的注解是( )","options":[{"key":"A","html":"@SpringBootApplication"},{"key":"B","html":"SpringBoot"},{"key":"C","html":"Application"},{"key":"D","html":"Context"}],"answer":"A（@SpringBootApplication）","answerKey":"A","why":"\u003cp class=\"q-why\">复合注解 = @SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan。\u003c/p>","source":"L07 p3 题5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q105","ch":9,"no":"Q105","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">如果要想在SpringBoot应用中导入XML配置文件，则可以使用_____注解。\u003c/span>","options":[],"answer":"@ImportResource","answerKey":"","why":"\u003cp class=\"q-why\">Spring Boot 推荐 JavaConfig，导入历史 XML 用 @ImportResource(\"classpath:xxx.xml\")。\u003c/p>","source":"L07 p5 题1、L07 p6 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q106","ch":9,"no":"Q106","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">Lombok插件中如果要为属性自动生成Setter,Getter方法，则在类定义时使用________注解\u003c/span>","options":[],"answer":"@Getter / @Setter（或 @Data）","answerKey":"","why":"\u003cp class=\"q-why\">Lombok 在类上加 @Getter @Setter 生成访问器；@Data 一次生成 getter/setter/toString/equals/hashCode。\u003c/p>","source":"L07 p5 题2、L07 p6 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q107","ch":9,"no":"Q107","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">SpringBoot应用每次修改后都需要重新启动，为便于项目的热部署，可以使用_____组件库。","options":[{"key":"A","html":"spring-dev-tools"},{"key":"B","html":"springboot-reload"},{"key":"C","html":"spring-boot-devtools"},{"key":"D","html":"spring-context-reload"}],"answer":"C（spring-boot-devtools）","answerKey":"C","why":"\u003cp class=\"q-why\">正确依赖名是 spring-boot-devtools；A、B、D 都不是官方组件名。\u003c/p>","source":"L07 p5 题3、L07 p6 题3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q108","ch":9,"no":"Q108","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">使用Lombok插件时，下面哪个______注解可以生成建造者模式","options":[{"key":"A","html":"@Accessor"},{"key":"B","html":"@Builder"},{"key":"C","html":"@Data"},{"key":"D","html":"@Creator"}],"answer":"B（@Builder）","answerKey":"B","why":"\u003cp class=\"q-why\">Lombok 的 @Builder 生成 builder() 建造者；@Data 不含建造者。\u003c/p>","source":"L07 p5 题4、L07 p6 题4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q109","ch":9,"no":"Q109","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">SpringBoot默认支持三种WEB容器，分别是___,Jetty,undertow.\u003c/span>","options":[],"answer":"Tomcat、Jetty、Undertow","answerKey":"","why":"\u003cp class=\"q-why\">默认内嵌 Tomcat，排除后换 Jetty 或 Undertow。\u003c/p>","source":"L07 p5 题6、L07 p6 题6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q110","ch":9,"no":"Q110","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">以下运行Spring Boot哪种方式是正确的( )","options":[{"key":"A","html":"使用DEBUG运行"},{"key":"B","html":"打包用命令或者放到容器中运行"},{"key":"C","html":"通过WEB.XML运行"},{"key":"D","html":"通过浏览器运行"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">打成 jar 用 java -jar 运行或放容器；DEBUG 是调试方式，web.xml / 浏览器都不是启动方式。\u003c/p>","source":"L07 p8 题1","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q111","ch":9,"no":"Q111","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">下列哪个不是SpringBoot数据源的配置项( )","options":[{"key":"A","html":"spring.datasource.url=jdbc:mysqI://127.0.0.1:3306/news? useUnicode=true&amp; character Encoding=utf8"},{"key":"B","html":"spring.datasource.username=root"},{"key":"C","html":"spring.datasource.password=root"},{"key":"D","html":"spring.datasource.driver-class =com.mysql.jdbc.Drive"}],"answer":"D（driver-class 写错类名 Drive）","answerKey":"D","why":"\u003cp class=\"q-why\">前三项分别是 url、username、password；D 的驱动类名应是 com.mysql.jdbc.Driver（或 com.mysql.cj.jdbc.Driver），写成 Drive 是错的。\u003c/p>","source":"L07 p8 题2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-Q112","ch":9,"no":"Q112","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">注解@SpringBootApplicati p class=\"q-why\">CPSR 的 N/Z/C/V 分别为负、零、进位/借位、溢出标志；I/F 为 IRQ/FIQ 禁止位，M[4:0] 为处理器模式位。按选项把作用写反的那项挑出来。\u003c/p>","source":"15 RTC原理及应用 · p2","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 4","ch":12,"no":"补 4","kind":"short","group":"written","stem":"4.下述哪一种功能单元不属于 I/O 接口电路( ) .","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">I/O 接口常见单元：数据缓冲/锁存、地址译码、状态与控制寄存器、中断控制、电平转换；ALU、Cache、MMU 属 CPU 内部，不算 I/O 接口。\u003c/p>","source":"15 RTC原理及应用 · p2","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 5","ch":12,"no":"补 5","kind":"short","group":"written","stem":"1.下列关于 DMA 描述不正确的是( )","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">DMA 不需要 CPU 干预即可搬数据，但会与 CPU 争用总线；并非\"任何情况都更快\"。请回原 PPT 页核对选项。\u003c/p>","source":"15 RTC原理及应用 · p3","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 6","ch":12,"no":"补 6","kind":"judge","group":"objective","stem":"1.在整个 PCB 板中，尽量加宽电源、地线宽度，最好是地线比电源线宽，它们的关系是：地线＞电源线＞信号线。( )","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">PCB 布线原则：地线 > 电源线 > 信号线，尽量加宽电源/地以降低阻抗与干扰。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 7","ch":12,"no":"补 7","kind":"judge","group":"objective","stem":"2.在 PCB 板布线中，数字电路的频率高，模拟电路的敏感度强，对信号线来说，高频的信号线尽可能与敏感的模拟电路器件混在一起。( )","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">高频数字信号线必须远离敏感模拟器件，否则串扰会把噪声耦合进模拟电路。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 8","ch":12,"no":"补 8","kind":"judge","group":"objective","stem":"3.在 PCB 板布线中，信号线距离地线越近，线间距越大，产生的串扰信号越小,异步信号和时钟信号更容易产生串扰,因此解串扰的方法是移开发生串扰的信号或屏蔽被严重干扰的信号。( )","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">靠近地平面、加大线间距都能减小串扰；异步信号与时钟信号是主要串扰源，可移开或屏蔽。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 9","ch":12,"no":"补 9","kind":"fill","group":"objective","stem":"1.系统控制寄存器 NVIC 和处理器内核接口紧密耦合，主要目的是( )","options":[],"answer":"低延迟中断处理","answerKey":"","why":"\u003cp class=\"q-why\">紧耦合让中断入口与优先级裁决在内核内完成，减少中断响应延迟并支持嵌套。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p3","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 10","ch":12,"no":"补 10","kind":"short","group":"written","stem":"2.以下对于STM32 ADC描述正确的是( )","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">按上一条 ADC 特点逐项对照：12 位、最多 3 个 ADC、转换时间可配、参考电压 VREF+、支持 DMA；把\"16 位精度\"\"无限多通道\"之类排掉。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p3","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 11","ch":12,"no":"补 11","kind":"short","group":"written","stem":"3.如图所示，U1电压应该为-1V,当现电压测得为20V,","options":[],"answer":"见原 PPT 电路图","answerKey":"","why":"\u003cp class=\"q-why\">这是电路故障分析题，需看原图的元件连接与参考方向；常见考点是万用表/示波器接错、参考点选错或电源极性反接。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p3","tags":["待核对"],"needsCheck":true,"points":["这是电路故障分析题，需看原图的元件连接与参考方向","常见考点是万用表/示波器接错、参考点选错或电源极性反接"]},{"id":"stm32-补 12","ch":12,"no":"补 12","kind":"judge","group":"objective","stem":"1.RS485接口组成的半双工网络,一般只需二根连线(AB线),RS 485接口均采用屏蔽双绞线传输。( )","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">半双工 RS485 只需 A/B 两根差分线，推荐屏蔽双绞线；两端要接终端电阻。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 13","ch":12,"no":"补 13","kind":"fill","group":"objective","stem":"2.RS485总线在实际使用时，一般都要在总线的两端挂接终端电阻，其作用是( );","options":[],"answer":"匹配阻抗、消除反射","answerKey":"","why":"\u003cp class=\"q-why\">终端电阻（典型 120 Ω）与线缆特性阻抗匹配，吸收信号反射，保证长距离通信波形。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 14","ch":12,"no":"补 14","kind":"short","group":"written","stem":"3.下面哪些不属于CAN通信的类型帧( )","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">CAN 的帧类型是数据帧、远程帧、错误帧、过载帧、帧间隔五种；凡写\"应答帧/令牌帧/同步帧\"之类都不是 CAN 帧类型。请对照原页选项。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p4","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 15","ch":12,"no":"补 15","kind":"short","group":"written","stem":"4.哪些是STM32的ADC系统的特点（多选( )。","options":[],"answer":"12 位逐次逼近 / 3 个 ADC / 最多 24 通道 / 规则组与注入组 / 多种触发 / 支持 DMA","answerKey":"","why":"\u003cp class=\"q-why\">F4 的 ADC 为 12 位 SAR 型，可单次/连续/扫描/间断转换，数据左或右对齐（ALIGN 位），转换结束可产生中断或 DMA 请求。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p4","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 16","ch":12,"no":"补 16","kind":"fill","group":"objective","stem":"5.STM32嵌套向量中断控制器(NVIC)具有( )个可编程的优先等级。","options":[],"answer":"16 个可编程优先等级（4 位）","answerKey":"","why":"\u003cp class=\"q-why\">F407 的 NVIC 有 82 个可屏蔽中断、16 级可编程优先级，分组由 AIRCR 的 PRIGROUP 决定。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 17","ch":12,"no":"补 17","kind":"fill","group":"objective","stem":"6.STM32的外部中断/事件控制器（EXTI）支持( )个中断/事件请求。","options":[],"answer":"23 个（16 条 GPIO 线 + 7 条专用线）","answerKey":"","why":"\u003cp class=\"q-why\">课件常按\"16 个 GPIO 中断/事件请求\"作答，完整 bxCAN/USB/RTC 等还有专用线；按题目选项判断。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p4","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 18","ch":12,"no":"补 18","kind":"fill","group":"objective","stem":"1.STM32的bxCAN的主要工作模式为( )。","options":[],"answer":"初始化、正常、睡眠（另有测试/调试模式）","answerKey":"","why":"\u003cp class=\"q-why\">bxCAN 主要工作模式为初始化、正常与睡眠；正常模式下可进一步选择静默/回环等测试方式。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 19","ch":12,"no":"补 19","kind":"short","group":"written","stem":"3.如图所示，电路图中有几个网孔，指出哪些元件是串联或并联，若结点1，2相连接，再回答上述问题？","options":[],"answer":"见原 PPT 电路图","answerKey":"","why":"\u003cp class=\"q-why\">网孔数 = 独立回路数 = 支路数 − 结点数 + 1；串并联判断看元件是否共用同一电流（串联）或同一对结点（并联）。请对照原图。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p5","tags":["待核对"],"needsCheck":true,"points":["网孔数 = 独立回路数 = 支路数 − 结点数 + 1","串并联判断看元件是否共用同一电流（串联）或同一对结点（并联）"]},{"id":"stm32-补 20","ch":12,"no":"补 20","kind":"fill","group":"objective","stem":"1.采用 RS232C 实现最简单的双机互联，至少需要如下信号线：_____,_______,GND","options":[],"answer":"TXD；RXD","answerKey":"","why":"\u003cp class=\"q-why\">RS232 最简单的双机互联是三线制：TXD、RXD、GND（交叉相连）。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 21","ch":12,"no":"补 21","kind":"short","group":"written","stem":"2.以下为STM32的GPIO端口配置寄存器的描述，图见教材P32,在GPIO控制LED电路设计时，要使最大输出速度为10MHz，应该设置( )","options":[],"answer":"见原 PPT 图 P32","answerKey":"","why":"\u003cp class=\"q-why\">输出速度由 GPIOx_OSPEEDR 的 2 位设定：常见 2/25/50/100 MHz 四档；具体编码请对照教材 P32 图。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p6","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 22","ch":12,"no":"补 22","kind":"short","group":"written","stem":"3.以下为GPIO端口配置寄存器的描述，图见教材P32,在GPIO控制LED电路设计时，要使最大输出速度为2MHz，应该设置MODE[1:0]值为( )","options":[],"answer":"见原 PPT 图 P32","answerKey":"","why":"\u003cp class=\"q-why\">输出速度由 GPIOx_OSPEEDR 的 2 位设定：常见 2/25/50/100 MHz 四档；具体编码请对照教材 P32 图。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p6","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 23","ch":12,"no":"补 23","kind":"fill","group":"objective","stem":"4.已知TIM1定时器的起始地址为0x4001 2C00，则定时器1的捕获/比较寄存器1的地址为( )","options":[],"answer":"0x40012C34","answerKey":"","why":"\u003cp class=\"q-why\">CCR1 相对定时器基地址的偏移是 0x34（CR1 0x00、…、ARR 0x2C、RCR 0x30、CCR1 0x34），故 0x40012C00 + 0x34 = 0x40012C34。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p6","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 24","ch":12,"no":"补 24","kind":"fill","group":"objective","stem":"6.如图中Tamper连接了STM32F40X的PC13GPIO，PC13通用IO端口映射到外部中断事件线上是( )","options":[],"answer":"EXTI13","answerKey":"","why":"\u003cp class=\"q-why\">所有端口的 Pin13 共用 EXTI13；PA0/WKUP 则对应 EXTI0。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p7","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 25","ch":12,"no":"补 25","kind":"fill","group":"objective","stem":"7.如图中WKUP连接了STM32F40X的PA0 GPIO，PA0通用IO端口映射到外部中断事件线上是( )","options":[],"answer":"EXTI0","answerKey":"","why":"\u003cp class=\"q-why\">Pin0 → EXTI0，Pin1 → EXTI1，……，Pin15 → EXTI15，与端口字母无关。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p8","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 26","ch":12,"no":"补 26","kind":"short","group":"written","stem":"8.分析在四线连接方式的 RS","options":[],"answer":"题干在原 PPT 被截断","answerKey":"","why":"\u003cp class=\"q-why\">这页文字不完整，请回原 PPT 看完整题目；四线制 RS-485/RS-422 通常是 TX+/TX−/RX+/RX− 两对差分线，全双工。\u003c/p>","source":"17 CAN总线原理及组网编程技术 · p8","tags":[],"needsCheck":false,"points":["这页文字不完整，请回原 PPT 看完整题目","四线制 RS-485/RS-422 通常是 TX+/TX−/RX+/RX− 两对差分线，全双工"]},{"id":"stm32-补 27","ch":12,"no":"补 27","kind":"judge","group":"objective","stem":"1.FreeRTOS小巧，简单，易用，其支持的处理器架构：ARM7, ARM9,COLTEX-m4等。( )","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">FreeRTOS 轻量、可裁剪，支持 ARM7/ARM9/Cortex-M 等多种架构。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 28","ch":12,"no":"补 28","kind":"judge","group":"objective","stem":"2.FreeRTOS系统基本架构其代码可以分解为三个主要区块：任务、通讯、硬件接口。( )","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">FreeRTOS 内核大致由任务调度、任务间通讯、与硬件相关的移植层三部分组成。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 29","ch":12,"no":"补 29","kind":"short","group":"written","stem":"3.以下对STM32F407集成A/D的特性描述不正确的是( )","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">同 ADC 特点：12 位 SAR、3 个 ADC、24 路外部通道、规则/注入组、可 DMA；错误项常见写法是\"分辨率 16 位\"或\"只能软件触发\"。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p2","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 30","ch":12,"no":"补 30","kind":"short","group":"written","stem":"4.下列哪些不是STM32闪存存储器的特点( )。","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">F407 片内 Flash 为 1 MB，分扇区、支持读/写保护、ART 加速器与 I-Cache 提升取指效率、支持 ICP/IAP 编程；\"按字节任意擦写\"\"掉电不丢失但仍当 RAM 用\"之类的说法都不对。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p2","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 31","ch":12,"no":"补 31","kind":"fill","group":"objective","stem":"5.在STM32中,( )寄存器的ALIGN位选择转换后数据储存的对齐方式。","options":[],"answer":"ADC_CR2","answerKey":"","why":"\u003cp class=\"q-why\">ADC 的 ALIGN 位在 ADC_CR2 中，决定转换结果左对齐还是右对齐。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 32","ch":12,"no":"补 32","kind":"fill","group":"objective","stem":"6.在DMA处理时，一个事件发生后，外设发送一个请求信号到 _____,DMA 控制器根据通道的 ____处理请求。","options":[],"answer":"DMA 控制器；通道优先级","answerKey":"","why":"\u003cp class=\"q-why\">外设发请求到 DMA 控制器，控制器按通道/数据流的优先级仲裁后启动传输。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p2","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 33","ch":12,"no":"补 33","kind":"short","group":"written","stem":"2.利用STM32的GPIO接口及其操作，实现4个LED按照LED1、LED2、LED3、LED4的顺序循环显示。硬件连接图如图所示。","options":[],"answer":"编程题：GPIO 输出 + 循环移位","answerKey":"","why":"\u003cp class=\"q-why\">使能 GPIO 时钟 → 4 个引脚设为推挽输出 → 循环里依次置位/复位（或用 BSRR 一次写）→ 加延时；注意消抖与共阴/共阳的有效电平。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p3","tags":[],"needsCheck":false,"points":["使能 GPIO 时钟 → 4 个引脚设为推挽输出 → 循环里依次置位/复位（或用 BSRR 一次写）→ 加延时","注意消抖与共阴/共阳的有效电平"]},{"id":"stm32-补 34","ch":12,"no":"补 34","kind":"short","group":"written","stem":"2.如图所示，已知u_(b)=-2V,u_(cd)=4V,u_(de)=-9V,u_(ef)=6V,u_(af)=10V,求u_(ab),u_(bc),u_(ca),i_(1),i_(2),i_(3)的值。","options":[],"answer":"见原 PPT / 待补充","answerKey":"","why":"\u003cp class=\"q-why\">本题来自 STM32 课程 PPT 的「复习提问」页；解析按对应专题的知识要点作答，需图形/电路图的请回原 PPT 页核对。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p4","tags":["待核对"],"needsCheck":true,"points":["本题来自 STM32 课程 PPT 的「复习提问」页","解析按对应专题的知识要点作答，需图形/电路图的请回原 PPT 页核对"]},{"id":"stm32-补 35","ch":12,"no":"补 35","kind":"fill","group":"objective","stem":"2.定时器TIM1的特殊工作模式包括( ).(多选)","options":[],"answer":"互补 PWM 输出、死区插入、刹车(Break)、重复计数器","answerKey":"","why":"\u003cp class=\"q-why\">TIM1/TIM8 是高级定时器，除通用功能外还有互补输出带死区、刹车输入、重复计数与霍尔传感器接口，多用于电机控制。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 36","ch":12,"no":"补 36","kind":"short","group":"written","stem":"3.嵌入式系统有硬件和软件部分构成,以下( )不属于嵌入式系统软件","options":[],"answer":"见原 PPT 选项","answerKey":"","why":"\u003cp class=\"q-why\">嵌入式软件 = 驱动/BSP + RTOS + 中间件 + 应用程序；处理器、存储器、传感器、PCB 都属于\u003cb>硬件\u003c/b>。按选项把硬件挑出来即可。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p5","tags":["待核对"],"needsCheck":true,"points":[]},{"id":"stm32-补 37","ch":12,"no":"补 37","kind":"judge","group":"objective","stem":"5.STM32端口输入数据寄存器位[15:0]是只读的，并且仅能按字访问，它们包含相关I/O端口的输入值..( )","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">GPIOx_IDR 低 16 位只读，且按字访问，反映引脚当前输入电平。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p5","tags":[],"needsCheck":false,"points":[]},{"id":"stm32-补 38","ch":12,"no":"补 38","kind":"short","group":"written","stem":"1.在一个STM32点亮LED的程序中,解释如下代码：","options":[],"answer":"逐行解释：时钟使能 → 模式配置 → 输出电平","answerKey":"","why":"\u003cp class=\"q-why\">标准三段：① RCC_AHB1PeriphClockCmd / __HAL_RCC_GPIOx_CLK_ENABLE() 开时钟；② GPIO_InitTypeDef 设 MODER 为输出、OTYPER 推挽、OSPEEDR/PUPDR；③ GPIO_SetBits/ResetBits 或 BSRR/ODR ^= 位 改变电平。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p6","tags":[],"needsCheck":false,"points":["标准三段：① RCC_AHB1PeriphClockCmd / __HAL_RCC_GPIOx_CLK_ENABLE() 开时钟","② GPIO_InitTypeDef 设 MODER 为输出、OTYPER 推挽、OSPEEDR/PUPDR","③ GPIO_SetBits/ResetBits 或 BSRR/ODR ^= 位 改变电平"]},{"id":"stm32-补 39","ch":12,"no":"补 39","kind":"short","group":"written","stem":"1.如图所示，利用支路电流法计算各支路电流。","options":[],"answer":"见原 PPT 电路图","answerKey":"","why":"\u003cp class=\"q-why\">设各支路电流方向 → 对独立结点列 KCL → 对网孔列 KVL → 联立求解；结果为负说明实际方向与假设相反。请对照原图数值。\u003c/p>","source":"18 嵌入式实时系统FreeRTOS--ppt课件 · p7","tags":["待核对"],"needsCheck":true,"points":["设各支路电流方向 → 对独立结点列 KCL → 对网孔列 KVL → 联立求解","结果为负说明实际方向与假设相反","请对照原图数值"]}],"metaExtra":{"source":"《STM32 复习资料》174 题 · 含 PPT 补充练习"},"x":{"kicker":"STM32F407 · CORTEX-M4 · 嵌入式课程群","tagline":"从内核、外设到 HAL、CubeMX 与综合实验","desc":"174 道题覆盖嵌入式基础、Cortex-M4、NVIC、GPIO、通信、HAL/CubeMX、X-CUBE-AI、Linux 与安卓、传感器实验。客观题即时判分，简答与实验题按评分点自评。","accent":"green","exam":"选择 68 · 判断 27 · 填空 20 · 简答 38 · 实验/编程 21（含 PPT 补充 39）","guide":[{"id":"s1","ch":1,"title":"嵌入式系统的组成与特点","clues":"问“与 PC 相比嵌入式系统不具备/具备什么特点”“硬件软件由什么组成”","rule":"硬件=处理器+存储器+外设；软件=驱动+RTOS+应用；特点=专用性强、内核小、系统精简、实时性要求高","steps":[{"ask":"先把“硬件/软件”两层分开：处理器、存储器、外设分别属于哪层？","ref":"硬件层：处理器、存储器、外设与接口；软件层：驱动、操作系统、应用程序。"},{"ask":"嵌入式与通用 PC 的差异，核心是“通用”还是“专用”？","ref":"嵌入式是面向特定应用的专用系统，资源受限、实时性要求高；多任务通用计算是 PC 的特征。"},{"ask":"设计流程从哪一步开始，到哪一步结束？","ref":"需求分析 → 软硬件划分 → 选型 → 硬件设计 → 软件设计 → 联调测试。"}],"trap":"把“可执行多任务”当成嵌入式特点；把 RTOS 与通用 OS 混为一谈。","example":{"q":"和 PC 相比，嵌入式系统不具备哪个特点：内核小/专用性强/可执行多任务/系统精简？","a":"可执行多任务。"}},{"id":"s2","ch":2,"title":"Cortex-M4 与 STM32F407 资源","clues":"问内核架构、FPU/DSP、主频、Flash/SRAM、封装引脚","rule":"Cortex-M4：哈佛架构、三级流水、单精度 FPU、DSP/SIMD；STM32F407ZGT6：168 MHz、1 MB Flash、192 KB SRAM、LQFP144","steps":[{"ask":"M3 与 M4 的差别主要在哪两个单元？","ref":"M4 增加单精度浮点单元 FPU 与 DSP/SIMD 指令，适合信号处理。"},{"ask":"F407 的主频、Flash、SRAM 三个数字是多少？","ref":"168 MHz、1 MB Flash、192 KB SRAM（112+16+64）。"},{"ask":"ARM 公司卖的是芯片还是 IP？","ref":"ARM 只授权 IP 核，ST 等厂商集成外设后生产芯片。"}],"trap":"把 M4 说成双精度 FPU；把 168 MHz 记成 72 MHz（那是 F103）。","example":{"q":"STM32F407ZGT6 的内核、主频、Flash、SRAM 各是什么？","a":"Cortex-M4、168 MHz、1 MB Flash、192 KB SRAM。"}},{"id":"s3","ch":3,"title":"NVIC 与中断优先级","clues":"问抢占优先级/响应优先级、优先级分组、中断响应流程、中断嵌套","rule":"4 位优先级可分组；抢占优先级决定能否嵌套，响应优先级只在同抢占级内排队；优先级数值越小越高","steps":[{"ask":"抢占优先级与响应优先级的区别是什么？","ref":"抢占级高（数值小）可以打断正在执行的中断；响应级只决定同抢占级中断的排队顺序，不能嵌套。"},{"ask":"优先级分组把 4 位怎么切分？","ref":"如分组 2：2 位抢占 + 2 位响应；分组决定“几位给抢占”，一旦设定全系统统一。"},{"ask":"中断从触发到执行的流程有哪几步？","ref":"外设置位 → NVIC 判优先级 → 压栈 → 取向量 → 执行 ISR → 清标志 → 出栈。"}],"trap":"以为响应优先级高也能打断；忘记在 ISR 里清中断标志导致反复进入。","example":{"q":"抢占 2 位、响应 2 位时，抢占优先级有几个等级？","a":"2²=4 级（0–3），响应级也是 4 级。"}},{"id":"s4","ch":4,"title":"GPIO 八种模式与寄存器","clues":"问推挽/开漏、上拉/下拉、复用、模拟、MODER 位域","rule":"MODER 每引脚 2 位：00 输入/01 输出/10 复用/11 模拟；OTYPER 0 推挽 1 开漏；PUPDR 00 无/01 上拉/10 下拉","steps":[{"ask":"先把 8 种模式按“输入 4 种 + 输出 2 种 + 复用 2 种 + 模拟”归类。","ref":"输入：浮空/上拉/下拉/模拟；输出：推挽/开漏；复用：推挽/开漏。"},{"ask":"MODER 里第 n 个引脚占哪两位？怎么算？","ref":"位 2n、2n+1；值 = 模式 \u003c\u003c (2n)，掩码 = 3 \u003c\u003c (2n)。"},{"ask":"开漏输出为什么常要外接上拉？","ref":"开漏只能拉低、不能拉高，高电平靠上拉电阻；适合线与总线和电平转换。"}],"trap":"改 MODER 不用“读-改-写”，把其他引脚配置冲掉；开漏不加外部上拉。","example":{"q":"把 PA5 配成推挽输出，MODER 要写什么？","a":"模式 01 左移 10 位 → 0x00000400；掩码 3\u003c\u003c10=0xC00。"}},{"id":"s5","ch":5,"title":"串口、RS485 与通信参数","clues":"问波特率、帧格式、RS232/RS485 电平与距离、I²C/SPI 区别","rule":"UART 帧=起始位+数据位+校验位+停止位；波特率=每秒位数；RS485 差分、1200 m、32 节点","steps":[{"ask":"一帧 UART 数据包含哪些位？8N1 表示什么？","ref":"起始 1 位 + 数据 8 位 + 无校验 + 停止 1 位，共 10 位。"},{"ask":"波特率 115200、8N1 时，传 1 字节要多少时间？","ref":"10 位 ÷ 115200 ≈ 86.8 μs；注意算的是位时间，不是 8 位。"},{"ask":"RS485 为什么比 RS232 传得远？","ref":"差分传输抗共模干扰，半双工两线，最长约 1200 m、32 节点。"}],"trap":"把波特率当成字节率；RS485 当全双工；忘记共地/终端电阻。","example":{"q":"RS485 最大距离与节点数？","a":"约 1200 m，32 个节点（1/8 负载可扩展）。"}},{"id":"s6","ch":6,"title":"CubeMX + HAL 工程流程","clues":"问 CubeMX 配置步骤、HAL 初始化顺序、回调函数、时钟树","rule":"选芯片→配时钟/引脚/外设→生成工程→写初始化与主循环→编译下载；HAL 用句柄+回调","steps":[{"ask":"CubeMX 里先配时钟还是先配引脚？为什么？","ref":"先定时钟源与主频（HSE/PLL），再配外设；外设时钟由时钟树决定。"},{"ask":"HAL 工程里用户代码应写在哪两个区？","ref":"/* USER CODE BEGIN */ 与 /* USER CODE END */ 之间，重新生成才不会被覆盖。"},{"ask":"中断方式收发的回调函数叫什么？","ref":"HAL_UART_RxCpltCallback / HAL_GPIO_EXTI_Callback 等弱函数，用户重定义。"}],"trap":"在生成区外写代码被覆盖；忘记使能外设时钟或 NVIC。","example":{"q":"为何 HAL_Delay 在中断里不能用？","a":"它依赖 SysTick 中断，若在更高优先级 ISR 中调用会阻塞或死等。"}},{"id":"s7","ch":10,"title":"定时器频率与 PWM 占空比","clues":"给 PSC、ARR、时钟，求定时器频率/周期/占空比","rule":"f=f_clk/((PSC+1)(ARR+1))；T=1/f；占空比=CCR/(ARR+1)","steps":[{"ask":"先确认定时器挂在哪个总线，时钟是多少？","ref":"APB1 定时器 84 MHz、APB2 定时器 168 MHz（F407 常见配置），以时钟树为准。"},{"ask":"PSC 与 ARR 各除一次，为什么都要 +1？","ref":"计数器从 0 计到 ARR 共 ARR+1 个数；预分频器写 PSC 实际分频 PSC+1。"},{"ask":"要 1 Hz、时钟 84 MHz，PSC 与 ARR 怎么配？","ref":"PSC=8399 → 10 kHz；ARR=9999 → 1 Hz。乘积 (8400×10000)=84e6。"}],"trap":"忘记 +1；把 CCR 直接当占空比百分数。","example":{"q":"84 MHz、PSC=83、ARR=999 时频率？","a":"84e6/(84×1000)=1000 Hz，周期 1 ms。"}},{"id":"s8","ch":7,"title":"X-CUBE-AI 与模型量化","clues":"问 float32/int8 量化、校准集、精度损失、Flash/RAM 占用","rule":"量化=浮点权重映射到定点；需要代表性校准集；int8 模型约为 float32 的 1/4 体积","steps":[{"ask":"为什么嵌入式部署要量化？","ref":"减小模型体积与内存带宽，提升推理速度，降低功耗。"},{"ask":"校准集起什么作用？","ref":"用代表性输入统计每层激活范围，确定 scale/zero-point；校准集不具代表性会显著掉精度。"},{"ask":"量化后精度下降，先查什么？","ref":"先看校准集分布是否覆盖真实输入，再看是否某层溢出/饱和，最后考虑混合量化。"}],"trap":"用训练集之外随便几张图做校准；以为 int8 一定不掉精度。","example":{"q":"int8 相比 float32，模型体积约多少？","a":"约 1/4（8 位 vs 32 位），另有少量元数据开销。"}}],"formula":[{"title":"定时器频率公式","q":"从计数过程推出 f=f_clk/((PSC+1)(ARR+1))。","steps":["时钟先经预分频器：f_cnt=f_clk/(PSC+1)。","计数器从 0 计到 ARR，共 ARR+1 个计数。","计满一次的时间 T=(ARR+1)/f_cnt。","取倒数得频率。"],"final":"f=f_clk/((PSC+1)(ARR+1))；占空比=CCR/(ARR+1)。"},{"title":"ADC 转换时间","q":"采样时间 480 周期、12 位分辨率、ADC 时钟 21 MHz，转换一次多久？","steps":["12 位逐次逼近需要 12 个 ADC 周期。","总周期=采样周期+12.5（含采样保持与转换）。","时间=总周期/ADC 时钟。"],"final":"t=(480+12.5)/21 MHz≈23.45 μs。"},{"title":"NVIC 优先级级数","q":"4 位优先级、分组 2（2 位抢占+2 位响应），各有多少级？","steps":["优先级寄存器共 4 位。","分组决定高几位给抢占。","抢占级数=2^抢占位数，响应级数=2^响应位数。"],"final":"抢占 4 级、响应 4 级；数值越小优先级越高。"}],"project":{"name":"1 Hz LED + 串口心跳","desc":"用 TIM6 产生 1 Hz 中断翻转 LED，并在串口打印计数。时钟 84 MHz。","steps":[{"ask":"PSC 设为多少，使计数频率为 10 kHz？（填整数）","unit":"","value":8399,"hint":"84 MHz/(PSC+1)=10 kHz → PSC+1=8400。"},{"ask":"ARR 设为多少，使更新频率为 1 Hz？（填整数）","unit":"","value":9999,"hint":"10 kHz/(ARR+1)=1 Hz → ARR+1=10000。"},{"ask":"若占空比 30%、ARR=999，CCR 应为多少？（填整数，向上取整）","unit":"","value":300,"hint":"CCR=(ARR+1)×0.3=300。"}]},"lab":{"title":"定时器与 PWM 实验室","desc":"调节预分频与自动重装值，实时看定时器频率、周期与占空比。"}}};</script>

function paintRail() {
  const rail = $('#rail'); if (!rail) return;
  const obj = BANKS.objective;
  const done = obj.filter(q => R(q.id).ok).length;
  const star = C.bank.filter(q => R(q.id).star).length;
  const weak = C.bank.filter(q => R(q.id).status === 'weak').length;
  const last = store.get('last', '');
  const lq = last ? QBY.get(last) : null;
  const rs = obj.map(q => R(q.id)).filter(r => r.tries);
  const t = rs.reduce((s, r) => s + r.tries, 0), o = rs.reduce((s, r) => s + (r.ok || 0), 0);
  const acc = t ? Math.round(o / t * 100) : 0;
  rail.innerHTML = `
    <div class="k">Study Desk</div><h3>我的学习概览</h3>
    <div class="blk"><div class="big">${done}<small> / ${obj.length}</small></div><div class="q">客观题已独立答对</div>
      <div class="row"><span>答题正确率</span><b>${acc}%</b></div>
      <div class="row"><span>收藏原题</span><b>${star}</b></div>
      <div class="row"><span>大题自评通过</span><b>${BANKS.written.filter(q => R(q.id).status === 'ok').length} / ${BANKS.written.length}</b></div>
      <div class="row"><span>待补练</span><b>${weak}</b></div>
      <div class="row" style="border:0"><span>已交模拟卷</span><b>${EXAMS.length}</b></div>
    </div>
    <div class="blk"><div class="k">继续学习</div>
      <div class="q" style="margin-top:6px">${lq ? E((CH.get(lq.ch) || {}).title || '') + ' · ' + E(lq.no) : '还没有开始，先做一道客观题试试。'}</div>
      <a class="next" href="${lq ? '#/bank/objective?id=' + encodeURIComponent(lq.id) : '#/bank/objective'}">${lq ? '接着这一题 →' : '开始第一道题 →'}</a>
      <div class="mini"><a href="#/errors">错题分析</a><a href="#/exam">模拟考试</a><a href="#/report">学习报告</a></div>
    </div>
    <div class="blk"><div class="k">今日建议</div><div class="q" style="margin-top:6px">${suggest()}</div></div>`;
  const pct = obj.length ? Math.round(done / obj.length * 100) : 0;
  const sp = $('#sideMaster'), sb = $('#sideBar'), st = $('#sideProg');
  if (sp) sp.textContent = pct + '%';
  if (sb) sb.style.width = pct + '%';
  if (st) st.textContent = `已掌握 ${done} / ${obj.length}`;
}
function suggest() {
  const due = BANKS.objective.filter(q => { const r = R(q.id); return r.due && r.due <= Date.now(); }).length;
  const weak = C.bank.filter(q => R(q.id).status === 'weak').length;
  if (weak) return `有 ${weak} 道题标记为待补练，建议先做错题重练，再开新章。`;
  if (due) return `有 ${due} 道题到期，按 1/3/7 天节奏复测一遍最划算。`;
  const un = C.chapters.find(c => BANKS.objective.some(q => q.ch === c.n && !R(q.id).tries));
  return un ? `下一章建议：第 ${un.n} 章《${E(un.title)}》。先读知识讲解，再做随堂练习。` : '客观题已全部做过一遍，建议转大题专练，按评分点自评。';
}

/* ================= 路由 ================= */
let CURRENT = 'home';
function go(path) { if (location.hash === '#/' + path) route(); else location.hash = '#/' + path; }
function route() {
  const rawFull = location.hash.replace(/^#\/?/, '') || 'home';
  const raw = rawFull.split('?')[0];
  const [view, a, b] = raw.split('/');
  CURRENT = view + (a ? '/' + a : '');
  document.body.classList.remove('nav-open');
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  document.body.classList.toggle('bank', view === 'bank');
  const main = $('#main');
  window.speechSynthesis && speechSynthesis.cancel();
  const map = { home, learn, guide, voice, overview, drill, exam, review, errors, graph, library, notes, slides, lab, code, formula, project, path, report, challenge, community, flash, saved };
  if (view === 'bank') bankPage(a || 'objective'); else (map[view] || home)(a, b);
  paintRail();
  if (view !== 'learn') main.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => { mountShell(); route(); });

function speak(text, btn) {
  if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) { alert('当前浏览器不支持朗读，请阅读页面文字。'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).slice(0, 4000));
  u.lang = 'zh-CN'; u.rate = 1;
  if (btn) { const old = btn.textContent; btn.textContent = '朗读中…'; u.onend = u.onerror = () => btn.textContent = old; }
  speechSynthesis.speak(u);
}

  const topics = X.guide || [];
