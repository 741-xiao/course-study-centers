K₂ = −1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>(t) = 2e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>，　t ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>物理意义：\u003c/b>系统一开始存了 1 个单位的“能量”，没有外界输入，它就按自己的两个固有频率慢慢衰减回 0。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>题目给的是 \u003cspan class=\"eq\">y(0⁻)\u003c/span> 还是 \u003cspan class=\"eq\">y(0⁺)\u003c/span>？零输入响应用的是\u003cb>输入接入前\u003c/b>的状态（0⁻）。如果方程右端有 \u003cspan class=\"eq\">δ\u003c/span> 或 \u003cspan class=\"eq\">δ′\u003c/span>，状态会在 \u003cspan class=\"eq\">t=0\u003c/span> 发生跳变，此时要先做“冲激匹配”求出 \u003cspan class=\"eq\">0⁺\u003c/span> 的值，再当初始条件用。\n\u003c/div>"},{"id":"s23","title":"2.3 冲激响应 h(t)","html":"\u003cp>\u003cb>定义：\u003c/b>系统在\u003cb>零状态\u003c/b>下，输入为单位冲激 \u003cspan class=\"eq\">δ(t)\u003c/span> 时的输出，记作 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>\u003cdiv class=\"note\">\u003cb>为什么 h(t) 这么重要？\u003c/b>因为它是系统的“指纹”。知道了 h(t)，任意输入下的零状态响应都能用卷积算出来：\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = x ∗ h\u003c/span>。就像知道了一口钟被敲一下的声音，就能算出连续敲很多下的总声音。\n\u003c/div>\u003ch4>情形一：方程右端只有 x(t)\u003c/h4>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-4　一阶系统求 h(t)（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">dy(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> + 3y(t) = 2x(t)，t &gt; 0\u003c/span>，求冲激响应 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：把 x 换成 δ，y 换成 h。\u003c/b>冲激响应的定义就是“零状态下输入 δ”：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′(t) + 3h(t) = 2δ(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：看特征根定形式。\u003c/b>特征根 \u003cspan class=\"eq\">s = −3\u003c/span>，所以 \u003cspan class=\"eq\">t&gt;0\u003c/span> 时右端为 0，解是指数衰减：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = Ae\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>这里乘 \u003cspan class=\"eq\">u(t)\u003c/span> 是因为系统因果，\u003cspan class=\"eq\">t&lt;0\u003c/span> 时还没有响应。\u003c/p>\u003cp>\u003cb>第三步：代回原方程定 A。\u003c/b>注意 \u003cspan class=\"eq\">u(t)\u003c/span> 求导会产生 δ：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′(t) = −3Ae\u003csup>−3t\u003c/sup>u(t) + Aδ(t)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′ + 3h = Aδ(t) + (−3A + 3A)e\u003csup>−3t\u003c/sup>u(t) = Aδ(t)\u003c/span>\u003c/div>\u003cp>要等于 \u003cspan class=\"eq\">2δ(t)\u003c/span>，所以 \u003cspan class=\"eq\">A = 2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = 2e\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>速记：\u003c/b>对 \u003cspan class=\"eq\">y′ + ay = bx\u003c/span>，直接有 \u003cspan class=\"eq\">h(t) = b·e\u003csup>−at\u003c/sup>u(t)\u003c/span>。考场上可以秒写，再用代回验证。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch4>情形二：方程右端含 x 的导数（难点）\u003c/h4>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-5　右端有 x′ 的冲激响应（课堂原题）\u003c/span>\u003cspan class=\"tag\">拉分题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">dy(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> + 6y(t) = 2x(t) + 3x′(t)，t &gt; 0\u003c/span>，求冲激响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>关键：右端出现 δ′，h(t) 里就要出现 δ(t)。\u003c/b>因为只有 δ 求导才能产生 δ′。所以设：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = Ae\u003csup>−6t\u003c/sup>u(t) + Bδ(t)\u003c/span>\u003c/div>\u003cp>求导（记住 \u003cspan class=\"eq\">u′ = δ\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′ = −6Ae\u003csup>−6t\u003c/sup>u(t) + Aδ(t) + Bδ′(t)\u003c/span>\u003c/div>\u003cp>代入 \u003cspan class=\"eq\">h′ + 6h = 2δ + 3δ′\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Bδ′ + (A + 6B)δ + (−6A + 6A)e\u003csup>−6t\u003c/sup>u(t) = 3δ′ + 2δ\u003c/span>\u003c/div>\u003cp>比较两边 δ′ 与 δ 的系数：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">B = 3\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">A + 6B = 2 ⟹ A = 2 − 18 = −16\u003c/span>\u003c/li>\u003c/ul>\u003cp>所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = 3δ(t) − 16e\u003csup>−6t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>为什么会有 δ 项？\u003c/b>物理上，输入里的 \u003cspan class=\"eq\">x′\u003c/span> 相当于一个“无限陡的变化”，系统瞬间被“踹”了一下，输出在 t=0 处出现一个冲激。这是右端含导数系统的标志性现象。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>① 忘了设 \u003cspan class=\"eq\">Bδ(t)\u003c/span>，导致系数比较不出来；② 求导时漏掉 \u003cspan class=\"eq\">Aδ(t)\u003c/span> 这一项；③ 最后没有把 \u003cspan class=\"eq\">e\u003csup>−6t\u003c/sup>u(t)\u003c/span> 的系数整理干净。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">通用做法（n 阶系统，右端有导数项）\u003c/span>\u003cp style=\"margin:4px 0\">设 \u003cspan class=\"eq\">A(s)\u003c/span> 是左端特征多项式，\u003cspan class=\"eq\">B(s)\u003c/span> 是右端系数多项式。先求“只有 x”时的冲激响应 \u003cspan class=\"eq\">h₁(t)\u003c/span>，再令：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">h(t) = b₀h₁(t) + b₁h₁′(t) + … + b\u003csub>m\u003c/sub>h₁\u003csup>(m)\u003c/sup>(t)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">本质就是 \u003cspan class=\"eq\">H(s) = B(s)/A(s)\u003c/span>，把分子乘上去而已。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">阶跃响应 g(t) 与 h(t) 的关系\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">g(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>h(τ)dτ，　h(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">dg(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">因为 \u003cspan class=\"eq\">u(t) = ∫δ\u003c/span>，由 LTI 的积分特性，输出也积分。这条常用来“已知阶跃响应求冲激响应”。\u003c/p>\u003c/div>"},{"id":"s24","title":"2.4 卷积积分","html":"\u003cp>\u003cb>定义：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = x(t) ∗ h(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> x(τ)h(t − τ)dτ\u003c/span>\u003c/div>\u003cp>这个式子看起来吓人，其实只做了一件事：\u003cb>把输入拆成无数个冲激，每个冲激产生一个延迟的 h，再全部加起来\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>通俗理解：\u003c/b>往平静的水面连续扔石子。每颗石子激起一圈涟漪（h），后扔的石子产生的涟漪会晚一点出现。水面上最终的波形，就是所有涟漪的叠加——这就是卷积。\u003cb>“翻转、平移、相乘、积分”\u003c/b>只是在数学上完成这个叠加。\n\u003c/div>\u003ch4>图解法的四个步骤\u003c/h4>\u003cdiv class=\"card\">\u003col style=\"margin:0\">\u003cli>\u003cb>换元：\u003c/b>把 \u003cspan class=\"eq\">x(t), h(t)\u003c/span> 都写成 \u003cspan class=\"eq\">τ\u003c/span> 的函数，得 \u003cspan class=\"eq\">x(τ)\u003c/span> 和 \u003cspan class=\"eq\">h(τ)\u003c/span>。\u003c/li>\u003cli>\u003cb>反转：\u003c/b>把 \u003cspan class=\"eq\">h(τ)\u003c/span> 关于纵轴翻过来，得 \u003cspan class=\"eq\">h(−τ)\u003c/span>。\u003c/li>\u003cli>\u003cb>平移：\u003c/b>把 \u003cspan class=\"eq\">h(−τ)\u003c/span> 右移 \u003cspan class=\"eq\">t\u003c/span>，得 \u003cspan class=\"eq\">h(t − τ)\u003c/span>。t 从 −∞ 慢慢增大，相当于“滑动窗口”从左往右扫。\u003c/li>\u003cli>\u003cb>相乘积分：\u003c/b>在每个 t 处，把 \u003cspan class=\"eq\">x(τ)\u003c/span> 与 \u003cspan class=\"eq\">h(t−τ)\u003c/span> 重叠部分相乘，算面积，就是 \u003cspan class=\"eq\">y(t)\u003c/span>。\u003c/li>\u003c/ol>\u003c/div>\u003cp>\u003cb>分段的关键：\u003c/b>重叠区间什么时候开始、什么时候结束？把两个信号的“左边界”和“右边界”分别对齐，就能定出分界点。这是卷积大题唯一容易错的地方。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:30%\">性质\u003c/th>\u003cth>表达式\u003c/th>\u003cth style=\"width:30%\">用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>交换律\u003c/td>\u003ctd>\u003cspan class=\"eq\">x ∗ h = h ∗ x\u003c/span>\u003c/td>\u003ctd>谁简单就把谁翻转\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结合律\u003c/td>\u003ctd>\u003cspan class=\"eq\">(x ∗ h₁) ∗ h₂ = x ∗ (h₁ ∗ h₂)\u003c/span>\u003c/td>\u003ctd>级联系统可以合并\u003c/td>\u003c/tr>\u003ctr>\u003ctd>分配律\u003c/td>\u003ctd>\u003cspan class=\"eq\">x ∗ (h₁ + h₂) = x ∗ h₁ + x ∗ h₂\u003c/span>\u003c/td>\u003ctd>并联系统可以相加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>与 δ 卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ δ(t − t₀) = x(t − t₀)\u003c/span>\u003c/td>\u003ctd>“卷积 δ 等于平移”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t−t₁) ∗ h(t−t₂) = y(t−t₁−t₂)\u003c/span>\u003c/td>\u003ctd>两个都延迟，结果延迟相加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>微分\u003c/td>\u003ctd>\u003cspan class=\"eq\">y′ = x′ ∗ h = x ∗ h′\u003c/span>\u003c/td>\u003ctd>难算时先求导\u003c/td>\u003c/tr>\u003ctr>\u003ctd>积分\u003c/td>\u003ctd>\u003cspan class=\"eq\">∫y = (∫x) ∗ h = x ∗ (∫h)\u003c/span>\u003c/td>\u003ctd>把阶跃变斜坡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 2-3　卷积的性质（前四条必须熟到条件反射）\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-6　指数卷积（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>计算 \u003cspan class=\"eq\">2e\u003csup>−2t\u003c/sup>u(t) ∗ 3e\u003csup>−t\u003c/sup>u(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>先提常数，再按定义写：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 6\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> e\u003csup>−2τ\u003c/sup>u(τ)·e\u003csup>−(t−τ)\u003c/sup>u(t−τ)dτ\u003c/span>\u003c/div>\u003cp>\u003cb>定积分限：\u003c/b>两个 u 同时为 1 的条件是 \u003cspan class=\"eq\">τ &gt; 0\u003c/span> 且 \u003cspan class=\"eq\">t − τ &gt; 0\u003c/span>，即 \u003cspan class=\"eq\">0 &lt; τ &lt; t\u003c/span>。这要求 \u003cspan class=\"eq\">t &gt; 0\u003c/span>，否则没有重叠，结果为 0。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 6\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span> e\u003csup>−2τ\u003c/sup>e\u003csup>−t+τ\u003c/sup>dτ = 6e\u003csup>−t\u003c/sup>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span> e\u003csup>−τ\u003c/sup>dτ\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 6e\u003csup>−t\u003c/sup>(1 − e\u003csup>−t\u003c/sup>) = 6(e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)，　t &gt; 0\u003c/span>\u003c/div>\u003cp>最后乘上 \u003cspan class=\"eq\">u(t)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = 6(e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>用公式验算：\u003c/b>套表 0-2，\u003cspan class=\"eq\">α=−2, β=−1\u003c/span>，\u003cspan class=\"eq\">(e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)/(−1+2) = e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>\u003c/span>，再乘 6，一致 ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考场策略：\u003c/b>指数与指数卷积，\u003cb>直接套公式\u003c/b>，再用“t=0 时 y=0、t→∞ 时 y→0”粗验一下，比老老实实积分快得多。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-7　矩形与矩形卷积\u003c/span>\u003cspan class=\"tag g\">图解题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>设 \u003cspan class=\"eq\">x(t) = u(t) − u(t−1)\u003c/span>，\u003cspan class=\"eq\">h(t) = u(t) − u(t−1)\u003c/span>，求 \u003cspan class=\"eq\">y = x ∗ h\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>两个都是“宽 1、高 1”的矩形。用图解法想：一个矩形不动，另一个翻转后从左往右滑，重叠面积先线性增大、再线性减小，所以结果是\u003cb>三角形\u003c/b>。\u003c/p>\u003cp>分段计算：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">0 ≤ t &lt; 1\u003c/span>：重叠长度是 \u003cspan class=\"eq\">t\u003c/span>，所以 \u003cspan class=\"eq\">y = t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 ≤ t &lt; 2\u003c/span>：重叠长度是 \u003cspan class=\"eq\">2 − t\u003c/span>，所以 \u003cspan class=\"eq\">y = 2 − t\u003c/span>；\u003c/li>\u003cli>其他：\u003cspan class=\"eq\">y = 0\u003c/span>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = t[0≤t&lt;1] + (2−t)[1≤t&lt;2]\u003c/span>\u003c/div>\u003cp>图形是底宽 2、高 1、顶点在 \u003cspan class=\"eq\">t=1\u003c/span> 的三角形。面积 = ½×2×1 = 1，正好等于两个矩形面积之积（1×1），可以用来验算。\u003c/p>\u003cdiv class=\"tip\">\u003cb>结论记牢：\u003c/b>两个宽 \u003cspan class=\"eq\">τ₁、τ₂\u003c/span> 的矩形卷积，结果是\u003cb>梯形\u003c/b>（等宽时退化成三角形），总宽度 \u003cspan class=\"eq\">τ₁+τ₂\u003c/span>，平台高度等于重叠区的面积。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-8　带 u(t) 的截断卷积\u003c/span>\u003cspan class=\"tag g\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>设 \u003cspan class=\"eq\">x(t) = u(t) − u(t−2)\u003c/span>，\u003cspan class=\"eq\">h(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>，求 \u003cspan class=\"eq\">y = x ∗ h\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>积分限由 \u003cspan class=\"eq\">0 &lt; τ &lt; 2\u003c/span> 和 \u003cspan class=\"eq\">τ &lt; t\u003c/span> 共同决定，所以\u003cb>分两段\u003c/b>：\u003c/p>\u003cp>\u003cb>当 \u003cspan class=\"eq\">0 &lt; t &lt; 2\u003c/span>：\u003c/b>上限取 \u003cspan class=\"eq\">t\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−(t−τ)\u003c/sup>dτ = e\u003csup>−t\u003c/sup>(e\u003csup>t\u003c/sup> − 1) = 1 − e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>当 \u003cspan class=\"eq\">t ≥ 2\u003c/span>：\u003c/b>上限被截断在 2：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">2\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−(t−τ)\u003c/sup>dτ = e\u003csup>−t\u003c/sup>(e² − 1) = e\u003csup>−(t−2)\u003c/sup> − e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>合起来：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = (1 − e\u003csup>−t\u003c/sup>)[u(t) − u(t−2)] + (e\u003csup>−(t−2)\u003c/sup> − e\u003csup>−t\u003c/sup>)u(t−2)\u003c/span>\u003c/div>\u003cp>\u003cb>物理图像：\u003c/b>输入只持续 2 秒，输出在前 2 秒不断“充电”上升，输入撤掉后按 \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>\u003c/span> 的规律“放电”衰减。这就是一阶系统的充电—放电过程。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s25","title":"2.5 用卷积求零状态响应","html":"\u003cp>推导只有三行，但它是整门课最重要的一段逻辑：\u003c/p>\u003cdiv class=\"kp\">\u003cspan class=\"t\">推导（课堂板书原样）\u003c/span>\u003cp style=\"margin:4px 0\">任何信号都能写成冲激的叠加：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> x(τ)δ(t − τ)dτ\u003c/span>\u003c/div>\u003cp style=\"margin:4px 0\">两边同时过系统 \u003cspan class=\"eq\">T{·}\u003c/span>，利用线性：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>(t) = T{x(t)} = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> x(τ)·T{δ(t − τ)}dτ\u003c/span>\u003c/div>\u003cp style=\"margin:4px 0\">而 \u003cspan class=\"eq\">T{δ(t−τ)} = h(t−τ)\u003c/span>（时不变性），于是：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> x(τ)h(t − τ)dτ = x(t) ∗ h(t)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-9　完整求零状态响应\u003c/span>\u003cspan class=\"tag\">大题模板\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>系统 \u003cspan class=\"eq\">y′(t) + 2y(t) = x(t)\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>，求零状态响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：求 h(t)。\u003c/b>由例 2-4 的速记公式（\u003cspan class=\"eq\">b=1, a=2\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：卷积。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = e\u003csup>−t\u003c/sup>u(t) ∗ e\u003csup>−2t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>套公式（\u003cspan class=\"eq\">α=−1, β=−2\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>−2t\u003c/sup> − e\u003csup>−t\u003c/sup>\u003c/span>\u003cspan class=\"fd\">−2 − (−1)\u003c/span>\u003c/span>u(t) = (e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：验算。\u003c/b>\u003cspan class=\"eq\">y(0)=0\u003c/span> ✓（零状态）；\u003cspan class=\"eq\">t→∞\u003c/span> 时 \u003cspan class=\"eq\">y→0\u003c/span> ✓（稳定系统）；代回方程也成立。\u003c/p>\u003cdiv class=\"tip\">\u003cb>三段式模板：\u003c/b>求 h(t) → 写卷积式定积分限 → 化简并标 \u003cspan class=\"eq\">u(t)\u003c/span>。\u003cb>每步都写出来，步骤分就到手了。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s26","title":"2.6 卷积的奇异信号性质与系统互联（CH3 补充）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">与奇异信号卷积（选择题常客）\u003c/span>\u003ctable style=\"margin-top:8px\">\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ δ(t) = x(t)\u003c/span>\u003c/td>\u003ctd>δ 是卷积的单位元\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ δ(t − t₀) = x(t − t₀)\u003c/span>\u003c/td>\u003ctd>卷积 δ 等于平移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ δ′(t) = x′(t)\u003c/span>\u003c/td>\u003ctd>卷积冲激偶等于求导\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ u(t) = ∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>x(τ)dτ\u003c/span>\u003c/td>\u003ctd>卷积阶跃等于积分\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ u(t−1) = ∫\u003csub>−∞\u003c/sub>\u003csup>t−1\u003c/sup>x(τ)dτ\u003c/span>\u003c/td>\u003ctd>积分上限也要跟着平移\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-10　用微分/积分性质求 y′ 与 y\u003csup>(−1)\u003c/sup>（课件原题）\u003c/span>\u003cspan class=\"tag g\">技巧题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">y(t)=x₁(t)∗x₂(t)\u003c/span>，不直接算卷积，写出 \u003cspan class=\"eq\">y′(t)\u003c/span> 和 \u003cspan class=\"eq\">y\u003csup>(−1)\u003c/sup>(t)=∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>y(τ)dτ\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y′(t) = x₁′(t) ∗ x₂(t) = x₁(t) ∗ x₂′(t)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csup>(−1)\u003c/sup>(t) = x₁\u003csup>(−1)\u003c/sup>(t) ∗ x₂(t) = x₁(t) ∗ x₂\u003csup>(−1)\u003c/sup>(t)\u003c/span>\u003c/div>\u003cp>\u003cb>为什么可以「搬家」？\u003c/b>因为 \u003cspan class=\"eq\">(x₁∗x₂)′ = x₁∗(x₂′)\u003c/span>：卷积里求导可以任意放到其中一个信号上。\u003cb>哪个信号好求导就对哪个动手\u003c/b>——矩形脉冲求导只剩两个冲激，卷积立刻变成「两个平移的波形相加」，比算积分快得多。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">由冲激响应判断系统互联、因果与稳定（CH3 L08）\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:28%\">问题\u003c/th>\u003cth>判据\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>级联\u003c/td>\u003ctd>\u003cspan class=\"eq\">h = h₁ ∗ h₂\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>并联\u003c/td>\u003ctd>\u003cspan class=\"eq\">h = h₁ + h₂\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>因果（连续）\u003c/td>\u003ctd>\u003cspan class=\"eq\">h(t) = 0，t &lt; 0\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>因果（离散）\u003c/td>\u003ctd>\u003cspan class=\"eq\">h[k] = 0，k &lt; 0\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>稳定（连续）\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>|h(t)|dt &lt; ∞\u003c/span>（绝对可积）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>稳定（离散）\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">Σ\u003csub>k\u003c/sub>|h[k]| &lt; ∞\u003c/span>（绝对可和）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-11　滑动平均系统的因果性（课件原题）\u003c/span>\u003cspan class=\"tag\">判定题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">M₁+M₂+1\u003c/span> 点滑动平均系统 \u003cspan class=\"eq\">y[k] = (1/(M₁+M₂+1))\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">M₂\u003c/span>\u003cspan class=\"l\">n=−M₁\u003c/span>\u003c/span>\u003c/span>x[k+n]\u003c/span>，判断是否因果、是否稳定。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>因果：\u003c/b>系统用到了 \u003cspan class=\"eq\">x[k+M₂]\u003c/span>，即\u003cb>未来的输入\u003c/b>。只有当 \u003cspan class=\"eq\">M₁ = 0\u003c/span> 时（只用 x[k] 及以前的值）才因果。\u003c/p>\u003cp>\u003cb>稳定：\u003c/b>冲激响应是长度 \u003cspan class=\"eq\">M₁+M₂+1\u003c/span>、幅度 \u003cspan class=\"eq\">1/(M₁+M₂+1)\u003c/span> 的矩形序列，绝对值之和 = 1 &lt; ∞，\u003cb>恒稳定\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>结论记牢：\u003c/b>任何\u003cb>有限长（FIR）冲激响应\u003c/b>系统，只要系数有限，就一定稳定；但不一定因果（要看起点是否为负）。课件判断题「任何有限长冲激响应系统都一定是因果系统」答案是\u003cb>错\u003c/b>。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s27","title":"2.7 响应的四种叫法，别混（CH3 综合题）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:24%\">分类方式\u003c/th>\u003cth style=\"width:38%\">组成\u003c/th>\u003cth>怎么区分\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>按\u003cb>成因\u003c/b>分\u003c/td>\u003ctd>零输入响应 + 零状态响应\u003c/td>\u003ctd>看是初值产生还是输入产生\u003c/td>\u003c/tr>\u003ctr>\u003ctd>按\u003cb>函数形式\u003c/b>分\u003c/td>\u003ctd>自由响应（固有）+ 强迫响应\u003c/td>\u003ctd>自由响应形如齐次解，强迫响应形如特解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>按\u003cb>时间趋势\u003c/b>分\u003c/td>\u003ctd>暂态响应 + 稳态响应\u003c/td>\u003ctd>暂态随时间衰减到 0，稳态长期保留\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>「零输入响应 = 自由响应」\u003cb>不对\u003c/b>。自由响应包含齐次解的全部，而零输入响应只是其中由初值决定的那一部分；零状态响应里也可能含有齐次解形式的项（衰减暂态）。课件综合题专门要求分别写出这几种响应，务必按定义逐项标注。\u003c/div>\u003c/section>"}]},{"n":3,"title":"离散时间系统时域分析","intro":"\u003cb>对应课件：\u003c/b>L07–L08（CH3 离散部分）\u003cbr>\u003cb>本章地位：\u003c/b>和第二章是“镜像关系”，考法几乎一样，把积分换成求和、把 δ(t) 换成 δ[k] 即可。很多学校会连续、离散各出一道大题。\u003cbr>\u003cb>三个高频点：\u003c/b>① 迭代法算前几项；② 由差分方程求 h[k]；③ 卷积和的计算（尤其是列表法和分段讨论）。","sections":[{"id":"s31","title":"3.1 差分方程与迭代法","html":"\u003cp>离散系统的数学模型是\u003cb>常系数线性差分方程\u003c/b>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] + a₁y[k−1] + … + a\u003csub>n\u003c/sub>y[k−n] = b₀x[k] + b₁x[k−1] + … + b\u003csub>m\u003c/sub>x[k−m]\u003c/span>\u003c/div>\u003cp>差分的定义（课堂板书）：\u003c/p>\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>后向差分 \u003cspan class=\"eq\">∇\u003c/span>\u003c/b>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">∇x[k] = x[k] − x[k−1]\u003c/span>\u003c/div>\u003cp style=\"margin:0;font-size:14px\">二阶：\u003cspan class=\"eq\">∇²x[k] = x[k] − 2x[k−1] + x[k−2]\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>前向差分 \u003cspan class=\"eq\">Δ\u003c/span>\u003c/b>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">Δx[k] = x[k+1] − x[k]\u003c/span>\u003c/div>\u003cp style=\"margin:0;font-size:14px\">二阶：\u003cspan class=\"eq\">Δ²x[k] = x[k+2] − 2x[k+1] + x[k]\u003c/span>\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>小结论：\u003c/b>\u003cspan class=\"eq\">δ[k] = u[k] − u[k−1]\u003c/span>（阶跃的差分为冲激）；反过来 \u003cspan class=\"eq\">u[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span>δ[n]\u003c/span>。这组关系和连续里的 \u003cspan class=\"eq\">δ = u′\u003c/span> 完全对应。\n\u003c/div>\u003ch4>迭代法：最笨但最快\u003c/h4>\u003cp>把方程整理成 \u003cspan class=\"eq\">y[k] = …\u003c/span> 的形式，从初始状态开始，一项一项往前推。适合求前几项、或者验证答案。\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-1　迭代法（课堂原题）\u003c/span>\u003cspan class=\"tag\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">y[k] − 0.5y[k−1] = u[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 1\u003c/span>，用迭代法求解。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>整理成 \u003cspan class=\"eq\">y[k] = 0.5y[k−1] + u[k]\u003c/span>，逐项算：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">y[0] = 0.5×1 + 1 = 1.5\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">y[1] = 0.5×1.5 + 1 = 1.75\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">y[2] = 0.5×1.75 + 1 = 1.875\u003c/span>\u003c/li>\u003c/ul>\u003cp>规律：每次都在上一项基础上“减半再加 1”，结果越来越接近 2。写成闭式就是：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = 2 − 0.5\u003csup>k+1\u003c/sup>，　k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>验证：\u003c/b>k=0 时 \u003cspan class=\"eq\">2−0.5=1.5\u003c/span> ✓。这个“稳态值 2、暂态按 0.5 衰减”的结构，就是一阶离散系统的典型响应。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考试技巧：\u003c/b>迭代法不用求通解，特别适合“求 y[0]～y[3]”这类小题，3 分钟拿满分。但要求通项公式时，还是得用经典法或 Z 变换。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch4>经典法：齐次解 ＋ 特解\u003c/h4>\u003cp>和连续完全平行，只是把 \u003cspan class=\"eq\">e\u003csup>st\u003c/sup>\u003c/span> 换成 \u003cspan class=\"eq\">s\u003csup>k\u003c/sup>\u003c/span>：\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:40%\">激励\u003c/th>\u003cth>特解设法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>\u003c/span>（a 不是特征根）\u003c/td>\u003ctd>\u003cspan class=\"eq\">Aa\u003csup>k\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>\u003c/span>（a 是特征根）\u003c/td>\u003ctd>\u003cspan class=\"eq\">Aka\u003csup>k\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">k\u003csup>n\u003c/sup>\u003c/span>（n 次多项式）\u003c/td>\u003ctd>\u003cspan class=\"eq\">A\u003csub>n\u003c/sub>k\u003csup>n\u003c/sup> + … + A₁k + A₀\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>k\u003csup>n\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>(A\u003csub>n\u003c/sub>k\u003csup>n\u003c/sup> + … + A₀)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">sin Ω₀k\u003c/span> 或 \u003cspan class=\"eq\">cos Ω₀k\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">A₁cos Ω₀k + A₂sin Ω₀k\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 3-1　离散系统特解形式（和连续一一对应，把 e\u003csup>at\u003c/sup> 理解成 a\u003csup>k\u003c/sup>）\u003c/p>"},{"id":"s32","title":"3.2 零输入响应","html":"\u003cp>零输入响应就是“没有输入，只靠初始储能”的自由响应，形式由特征根决定：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = Σ K\u003csub>i\u003c/sub>s\u003csub>i\u003c/sub>\u003csup>k\u003c/sup>\u003c/span>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-2　零输入响应（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">y[k] + 3y[k−1] + 2y[k−2] = x[k]\u003c/span>，初始状态 \u003cspan class=\"eq\">y[−1] = 0，y[−2] = 1/2\u003c/span>。求零输入响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>特征方程：\u003c/b>把 \u003cspan class=\"eq\">y[k−i]\u003c/span> 换成 \u003cspan class=\"eq\">s\u003csup>−i\u003c/sup>\u003c/span>，两边乘 \u003cspan class=\"eq\">s²\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s² + 3s + 2 = 0 ⟹ s₁ = −1，s₂ = −2\u003c/span>\u003c/div>\u003cp>所以 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = C₁(−1)\u003csup>k\u003c/sup> + C₂(−2)\u003csup>k\u003c/sup>\u003c/span>。\u003c/p>\u003cp>\u003cb>代初始状态（注意 k 是负数）：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k = −1\u003c/span>：\u003cspan class=\"eq\">−C₁ − C₂/2 = 0\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k = −2\u003c/span>：\u003cspan class=\"eq\">C₁ + C₂/4 = 1/2\u003c/span>\u003c/li>\u003c/ul>\u003cp>解得 \u003cspan class=\"eq\">C₁ = 1，C₂ = −2\u003c/span>，于是：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = [(−1)\u003csup>k\u003c/sup> − 2(−2)\u003csup>k\u003c/sup>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>由原方程 \u003cspan class=\"eq\">y[0] = −3y[−1] − 2y[−2] = 0 − 1 = −1\u003c/span>；公式给 \u003cspan class=\"eq\">1 − 2 = −1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>代入的是 \u003cspan class=\"eq\">k = −1, −2\u003c/span>，不是 \u003cspan class=\"eq\">k = 0, 1\u003c/span>！题目给的是“初始状态”，也就是输入接入前的值。这一步每年都有人错。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-3　重根情形\u003c/span>\u003cspan class=\"tag g\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y[k] + 4y[k−1] + 4y[k−2] = x[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 0，y[−2] = −1\u003c/span>，求零输入响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>特征方程 \u003cspan class=\"eq\">s² + 4s + 4 = (s+2)² = 0\u003c/span>，\u003cb>二重根\u003c/b>\u003cspan class=\"eq\">s = −2\u003c/span>。重根要乘 \u003cspan class=\"eq\">k\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = (C₁ + C₂k)(−2)\u003csup>k\u003c/sup>\u003c/span>\u003c/div>\u003cp>代入：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k=−1\u003c/span>：\u003cspan class=\"eq\">(C₁ − C₂)(−½) = 0 ⟹ C₁ = C₂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k=−2\u003c/span>：\u003cspan class=\"eq\">(C₁ − 2C₂)(¼) = −1 ⟹ C₁ − 2C₂ = −4\u003c/span>\u003c/li>\u003c/ul>\u003cp>联立得 \u003cspan class=\"eq\">C₁ = C₂ = 4\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = 4(1 + k)(−2)\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y[0] = −4y[−1] − 4y[−2] = 0 + 4 = 4\u003c/span>，公式给 \u003cspan class=\"eq\">4×1×1 = 4\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>为什么重根要乘 k？\u003c/b>因为两个根重合时，\u003cspan class=\"eq\">C₁(−2)\u003csup>k\u003c/sup> + C₂(−2)\u003csup>k\u003c/sup>\u003c/span> 其实只有一个独立常数，凑不出两个初始条件，必须再借一个 \u003cspan class=\"eq\">k(−2)\u003csup>k\u003c/sup>\u003c/span>。这和连续系统重根乘 t 是同一个道理。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-4　共轭复根（三阶）\u003c/span>\u003cspan class=\"tag g\">拔高\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y[k] − 0.5y[k−1] + y[k−2] − 0.5y[k−3] = x[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 2，y[−2] = −1，y[−3] = 8\u003c/span>，求零输入响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>特征方程：\u003cspan class=\"eq\">s³ − 0.5s² + s − 0.5 = 0\u003c/span>。分组分解：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s²(s − 0.5) + (s − 0.5) = (s − 0.5)(s² + 1) = 0\u003c/span>\u003c/div>\u003cp>三个根：\u003cspan class=\"eq\">s₁ = 0.5，s₂ = j，s₃ = −j\u003c/span>。共轭根对应 \u003cspan class=\"eq\">cos(πk/2)\u003c/span> 与 \u003cspan class=\"eq\">sin(πk/2)\u003c/span>（因为 \u003cspan class=\"eq\">|j|=1，arg j = π/2\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = C₁(0.5)\u003csup>k\u003c/sup> + C₂cos\u003cspan class=\"fr\">\u003cspan class=\"fn\">πk\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> + C₃sin\u003cspan class=\"fr\">\u003cspan class=\"fn\">πk\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>代入三个初始状态（注意 \u003cspan class=\"eq\">cos(−π/2)=0，sin(−π/2)=−1，cos(−π)=−1，sin(−π)=0\u003c/span>）：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k=−1\u003c/span>：\u003cspan class=\"eq\">2C₁ − C₃ = 2\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k=−2\u003c/span>：\u003cspan class=\"eq\">4C₁ − C₂ = −1\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k=−3\u003c/span>：\u003cspan class=\"eq\">8C₁ + C₃ = 8\u003c/span>\u003c/li>\u003c/ul>\u003cp>解得 \u003cspan class=\"eq\">C₁ = 1，C₂ = 5，C₃ = 0\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = [(0.5)\u003csup>k\u003c/sup> + 5cos\u003cspan class=\"fr\">\u003cspan class=\"fn\">πk\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y[0] = 1 + 5 = 6\u003c/span>；由方程 \u003cspan class=\"eq\">y[0] = 0.5(2) − (−1) + 0.5(8) = 1 + 1 + 4 = 6\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>看到复根不要慌：\u003c/b>只要根是 \u003cspan class=\"eq\">re\u003csup>±jθ\u003c/sup>\u003c/span>，就写 \u003cspan class=\"eq\">r\u003csup>k\u003c/sup>(A cos θk + B sin θk)\u003c/span>。这里 \u003cspan class=\"eq\">r=1, θ=π/2\u003c/span>，所以是 \u003cspan class=\"eq\">cos(πk/2)\u003c/span> 这种“0, 1, 0, −1”循环的序列。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s33","title":"3.3 单位脉冲响应 h[k]","html":"\u003cp>\u003cb>定义：\u003c/b>零状态下，输入 \u003cspan class=\"eq\">δ[k]\u003c/span> 时的输出。求法和连续完全平行：\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-5　求 h[k]（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>因果 LTI 系统 \u003cspan class=\"eq\">y[k] + 3y[k−1] + 2y[k−2] = x[k]\u003c/span>，求单位脉冲响应 \u003cspan class=\"eq\">h[k]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：把 x 换成 δ。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] + 3h[k−1] + 2h[k−2] = δ[k]\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：k ≥ 0 时右端为 0\u003c/b>，解齐次方程，特征根 \u003cspan class=\"eq\">−1, −2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = C₁(−1)\u003csup>k\u003c/sup> + C₂(−2)\u003csup>k\u003c/sup>，　k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：用 k=0 的方程定“初始值”。\u003c/b>因为系统因果，\u003cspan class=\"eq\">h[−1] = h[−2] = 0\u003c/span>，代入 \u003cspan class=\"eq\">k=0\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[0] + 3h[−1] + 2h[−2] = δ[0] = 1 ⟹ h[0] = 1\u003c/span>\u003c/div>\u003cp>再用 \u003cspan class=\"eq\">k=−1\u003c/span> 的方程（右端 \u003cspan class=\"eq\">δ[−1]=0\u003c/span>）：\u003cspan class=\"eq\">h[−1] + 3h[−2] + 2h[−3] = 0\u003c/span>，恒成立，给不出新信息。改用 \u003cspan class=\"eq\">h[0]=1\u003c/span> 和 \u003cspan class=\"eq\">h[−1]=0\u003c/span>：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">C₁ + C₂ = 1\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">−C₁ − C₂/2 = 0 ⟹ C₁ = −C₂/2\u003c/span>\u003c/li>\u003c/ul>\u003cp>解得 \u003cspan class=\"eq\">C₂ = 2，C₁ = −1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = [−(−1)\u003csup>k\u003c/sup> + 2(−2)\u003csup>k\u003c/sup>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">h[0] = −1 + 2 = 1\u003c/span> ✓；\u003cspan class=\"eq\">h[1] = 1 − 4 = −3\u003c/span>，而迭代 \u003cspan class=\"eq\">h[1] = −3h[0] − 2h[−1] = −3\u003c/span> ✓。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">阶跃响应 g[k] 与 h[k]\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = g[k] − g[k−1] = ∇g[k]，　g[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span>h[n]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">题目若给“系统对 \u003cspan class=\"eq\">u[k]\u003c/span> 的响应是 \u003cspan class=\"eq\">g[k]\u003c/span>，求 \u003cspan class=\"eq\">h[k]\u003c/span>”，直接做差即可。\u003c/p>\u003c/div>"},{"id":"s34","title":"3.4 卷积和","html":"\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = x[k] ∗ h[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span> x[n]h[k−n]\u003c/span>\u003c/div>\u003ch4>四条“变形”性质（课堂重点）\u003c/h4>\u003cdiv class=\"kp\">\u003cspan class=\"t\">① 差分与卷积\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">∇x[k] = x[k] − x[k−1] = x[k] ∗ (δ[k] − δ[k−1])\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">② 求和与卷积\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span>x[n] = x[k] ∗ u[k]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">“累加”等价于“和阶跃做卷积”。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">③ 差分、求和可以“搬家”\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">∇x[k] ∗ h[k] = x[k] ∗ ∇h[k] = ∇y[k]\u003c/span>\u003c/div>\u003cdiv class=\"formula\" style=\"margin-top:6px\">\u003cspan class=\"eq\">x[k] ∗ Σh[n] = (Σx[n]) ∗ h[k] = Σy[n]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">哪个信号好求导/求和，就对哪个动手。\u003c/p>\u003c/div>\u003ch4>计算方法一：列表法（多项式乘法）\u003c/h4>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-6　有限长序列卷积（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>计算 \u003cspan class=\"eq\">x[k] = {1, 0, 2, 4}\u003c/span> 与 \u003cspan class=\"eq\">h[k] = {1, 4, 5, 3}\u003c/span> 的卷积和（箭头都在第一个元素，即从 k=0 开始）。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>方法一：把 x 拆成冲激。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = δ[k] + 0·δ[k−1] + 2δ[k−2] + 4δ[k−3]\u003c/span>\u003c/div>\u003cp>利用 \u003cspan class=\"eq\">δ[k−n] ∗ h[k] = h[k−n]\u003c/span>（移位特性）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = h[k] + 2h[k−2] + 4h[k−3]\u003c/span>\u003c/div>\u003cp>逐项移位相加：\u003c/p>\u003ctable style=\"margin-top:6px\">\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">h[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1, 4, 5, 3\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">2h[k−2]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">0, 0, 2, 8, 10, 6\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">4h[k−3]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">0, 0, 0, 4, 16, 20, 12\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>相加\u003c/b>\u003c/td>\u003ctd>\u003cb>\u003cspan class=\"eq\">1, 4, 7, 15, 26, 26, 12\u003c/span>\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cb>方法二：竖式乘法\u003c/b>（和多项式乘法一模一样，考试时更快）：\u003c/p>\u003cdiv class=\"formula\" style=\"text-align:left;display:inline-block;margin-left:20px\">\u003cspan class=\"eq\">　　1　4　5　3\u003cbr>\n×　1　0　2　4\u003cbr>\n————————————\u003cbr>\n　　4　16　20　12\u003cbr>\n　2　8　10　6\u003cbr>\n1　4　5　3\u003cbr>\n————————————\u003cbr>\n1　4　7　15　26　26　12\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>长度 \u003cspan class=\"eq\">4+4−1 = 7\u003c/span> ✓；首项 \u003cspan class=\"eq\">1×1=1\u003c/span> ✓；末项 \u003cspan class=\"eq\">4×3=12\u003c/span> ✓；总和 \u003cspan class=\"eq\">(1+0+2+4)(1+4+5+3)=7×13=91\u003c/span>，而 \u003cspan class=\"eq\">1+4+7+15+26+26+12=91\u003c/span> ✓。三个检查全过，答案必对。\u003c/p>\u003cdiv class=\"tip\">\u003cb>卷积结果的长度：\u003c/b>\u003cspan class=\"eq\">L = L₁ + L₂ − 1\u003c/span>。这是最快的自查手段，算出 8 项一定是错的。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch4>计算方法二：分段讨论（无限长 / 矩形序列）\u003c/h4>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-7　R\u003csub>N\u003c/sub> ∗ R\u003csub>N\u003c/sub>（课堂原题，易错）\u003c/span>\u003cspan class=\"tag\">拉分题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>设 \u003cspan class=\"eq\">R\u003csub>N\u003c/sub>[k] = 1（0 ≤ k ≤ N−1），其他为 0\u003c/span>。求 \u003cspan class=\"eq\">y[k] = R\u003csub>N\u003c/sub>[k] ∗ R\u003csub>N\u003c/sub>[k]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>两个长度为 N 的“矩形序列”卷积，结果是\u003cb>三角形\u003c/b>，总长度 \u003cspan class=\"eq\">2N−1\u003c/span>。要分三段讨论：\u003c/p>\u003cp>\u003cb>① \u003cspan class=\"eq\">k &lt; 0\u003c/span>：\u003c/b>两个序列完全不重叠，\u003cspan class=\"eq\">y[k] = 0\u003c/span>。\u003c/p>\u003cp>\u003cb>② \u003cspan class=\"eq\">0 ≤ k ≤ N−1\u003c/span>：\u003c/b>重叠区间是 \u003cspan class=\"eq\">[0, k]\u003c/span>，共 \u003cspan class=\"eq\">k+1\u003c/span> 个点，每点乘积为 1：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>1 = k + 1\u003c/span>\u003c/div>\u003cp>\u003cb>③ \u003cspan class=\"eq\">N−1 &lt; k ≤ 2N−2\u003c/span>：\u003c/b>开始“滑出”，重叠区间是 \u003cspan class=\"eq\">[k−(N−1), N−1]\u003c/span>，点数 \u003cspan class=\"eq\">2N−1−k\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">N−1\u003c/span>\u003cspan class=\"l\">n=k−(N−1)\u003c/span>\u003c/span>\u003c/span>1 = 2N − 1 − k\u003c/span>\u003c/div>\u003cp>\u003cb>④ \u003cspan class=\"eq\">k &gt; 2N−2\u003c/span>：\u003c/b>完全滑出，\u003cspan class=\"eq\">y[k] = 0\u003c/span>。\u003c/p>\u003cp>合起来：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan style=\"display:inline-block;text-align:left;vertical-align:middle;line-height:1.6\">k+1,　0 ≤ k ≤ N−1\u003cbr>2N−1−k,　N−1 ≤ k ≤ 2N−2\u003cbr>0,　其他\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>用 N=3 验证：\u003c/b>结果为 \u003cspan class=\"eq\">1, 2, 3, 2, 1\u003c/span>，总和 9 = 3×3 ✓，形状是三角形 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>很多人只写前两段，漏掉“滑出”的第三段；或者把分界点写成 \u003cspan class=\"eq\">N\u003c/span>。正确分界是 \u003cspan class=\"eq\">k = N−1\u003c/span>（顶点位置），总长度到 \u003cspan class=\"eq\">2N−2\u003c/span>。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-8　指数序列卷积（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>计算 \u003cspan class=\"eq\">α\u003csup>k\u003c/sup>u[k] ∗ β\u003csup>k\u003c/sup>u[k]\u003c/span>（\u003cspan class=\"eq\">α ≠ β\u003c/span>）。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>按定义，\u003cspan class=\"eq\">n\u003c/span> 的范围是 \u003cspan class=\"eq\">0 ≤ n ≤ k\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>α\u003csup>n\u003c/sup>β\u003csup>k−n\u003c/sup> = β\u003csup>k\u003c/sup>\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>(\u003cspan class=\"fr\">\u003cspan class=\"fn\">α\u003c/span>\u003cspan class=\"fd\">β\u003c/span>\u003c/span>)\u003csup>n\u003c/sup>\u003c/span>\u003c/div>\u003cp>这是等比数列求和（公比 \u003cspan class=\"eq\">α/β\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= β\u003csup>k\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − (α/β)\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 − α/β\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">β\u003csup>k+1\u003c/sup> − α\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">β − α\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>所以（\u003cspan class=\"eq\">k ≥ 0\u003c/span>，乘 \u003cspan class=\"eq\">u[k]\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">β\u003csup>k+1\u003c/sup> − α\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">β − α\u003c/span>\u003c/span>u[k]\u003c/span>\u003c/div>\u003cp>当 \u003cspan class=\"eq\">α = β\u003c/span> 时，用洛必达或直接求和得 \u003cspan class=\"eq\">y[k] = (k+1)α\u003csup>k\u003c/sup>u[k]\u003c/span>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>和连续对照记：\u003c/b>连续是 \u003cspan class=\"eq\">(e\u003csup>βt\u003c/sup>−e\u003csup>αt\u003c/sup>)/(β−α)\u003c/span>，离散是 \u003cspan class=\"eq\">(β\u003csup>k+1\u003c/sup>−α\u003csup>k+1\u003c/sup>)/(β−α)\u003c/span>。注意离散的指数多了一个 “+1”，这是最容易抄错的地方。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-9　用性质“偷懒”\u003c/span>\u003cspan class=\"tag g\">技巧\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">u[k] ∗ u[k]\u003c/span> 和 \u003cspan class=\"eq\">u[k] ∗ u[k−3]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>直接套公式（\u003cspan class=\"eq\">α=β=1\u003c/span> 的退化情形）：\u003cspan class=\"eq\">u[k] ∗ u[k] = (k+1)u[k]\u003c/span>。\u003c/p>\u003cp>第二问利用时移性质：\u003cspan class=\"eq\">u[k] ∗ u[k−3] = (k−3+1)u[k−3] = (k−2)u[k−3]\u003c/span>。\u003c/p>\u003cp>\u003cb>验证：\u003c/b>k=3 时结果为 1，确实从 k=3 才开始有值 ✓。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>离散部分就是把连续“翻译”一遍：微分→差分、积分→求和、\u003cspan class=\"eq\">e\u003csup>st\u003c/sup>\u003c/span>→\u003cspan class=\"eq\">s\u003csup>k\u003c/sup>\u003c/span>、卷积积分→卷积和。\u003cb>唯一新增的技巧是“列表法/竖式乘法”\u003c/b>，考场上比硬算求和快 5 倍，务必练熟。\n\u003c/div>"},{"id":"s35","title":"3.5 卷积和下标的确定（CH3 L08 补充）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">列表法 / MATLAB 法的两条下标规则\u003c/span>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>结果起点 = 两序列起点之和\u003c/b>：若 \u003cspan class=\"eq\">x[k]\u003c/span> 从 \u003cspan class=\"eq\">k\u003csub>x\u003c/sub>\u003c/span> 开始、\u003cspan class=\"eq\">h[k]\u003c/span> 从 \u003cspan class=\"eq\">k\u003csub>h\u003c/sub>\u003c/span> 开始，则 \u003cspan class=\"eq\">y[k]\u003c/span> 从 \u003cspan class=\"eq\">k\u003csub>x\u003c/sub>+k\u003csub>h\u003c/sub>\u003c/span> 开始；\u003c/li>\u003cli>\u003cb>结果终点 = 两序列终点之和\u003c/b>；总长度 \u003cspan class=\"eq\">L = L₁+L₂−1\u003c/span>。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 3-10　带负下标的卷积（课件原题）\u003c/span>\u003cspan class=\"tag\">易错\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">x=[1 2 0 3 2]\u003c/span>，\u003cspan class=\"eq\">kx=−2:2\u003c/span>；\u003cspan class=\"eq\">h=[1 4 2 3]\u003c/span>，\u003cspan class=\"eq\">kh=−1:2\u003c/span>。写出 \u003cspan class=\"eq\">y=conv(x,h)\u003c/span> 对应的下标向量。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\">\u003cspan class=\"eq\">k = kx(1)+kh(1) : kx(end)+kh(end) = (−2)+(−1) : 2+2 = −3 : 4\u003c/span>\u003c/div>\u003cp>共 \u003cspan class=\"eq\">5+4−1 = 8\u003c/span> 个点，与 \u003cspan class=\"eq\">−3:4\u003c/span> 的长度 8 一致 ✓。MATLAB 代码：\u003c/p>\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">y = conv(x,h); k = kx(1)+kh(1) : kx(end)+kh(end); stem(k,y);\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>最常见的错：\u003c/b>直接 \u003cspan class=\"eq\">stem(y)\u003c/span>，把起点当 1 画，整张图横坐标全错。\u003cb>conv 只给数值，不给下标，必须自己补。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">周期卷积（DFS 里会用到）\u003c/span>\u003cp style=\"margin:4px 0\">两个\u003cb>同周期 N\u003c/b> 的周期序列的卷积，结果仍是周期 N 的序列：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">ỹ[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">N−1\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span> x̃[n]h̃[k−n]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>与线性卷积的区别：\u003c/b>周期卷积会「绕回」产生混叠；把序列补零到足够长（≥ 线性卷积长度）后，周期卷积的主值就与线性卷积相同。这就是用 DFT 快速算线性卷积的原理。\u003c/p>\u003c/div>\u003c/section>"}]},{"n":4,"title":"傅里叶级数：周期信号的频域分析","intro":"\u003cb>对应课件：\u003c/b>L09–L10（CH4 傅里叶级数）\u003cbr>\u003cb>本章地位：\u003c/b>从这一章开始进入“频域”，是后半学期的核心，也是考试分值最重的一块（20～30 分）。\u003cbr>\u003cb>一句话主线：\u003c/b>任何周期信号都能拆成“直流 + 基波 + 各次谐波”的叠加，拆出来的系数 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span> 就是频谱。\u003cbr>\u003cb>必考：\u003c/b>① 系数公式；② 频谱图画法；③ 时移/频移/微分性质；④ 帕塞瓦尔求功率；⑤ 吉布斯现象。","sections":[{"id":"s41","title":"4.1 正交分解：傅里叶级数的“灵魂”","html":"\u003cp>先别急着背公式，先理解一件事：\u003cb>为什么可以把一个复杂信号拆成一堆正弦波？\u003c/b>\u003c/p>\u003cdiv class=\"tip\">\u003cb>类比：\u003c/b>一个斜向上的力，可以分解成“水平分量 + 竖直分量”，因为水平和竖直方向“互不干扰”（正交）。信号也一样：不同频率的正弦波在一个周期内“互相抵消”，内积为 0，所以可以各算各的、互不串味。这就是\u003cb>正交分解\u003c/b>。\n\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">正交函数集的定义\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t₂\u003c/span>\u003cspan class=\"l\">t₁\u003c/span>\u003c/span>\u003c/span> f\u003csub>i\u003c/sub>(t)f\u003csub>j\u003c/sub>*(t)dt = K（i = j），　0（i ≠ j）\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">“自己和自己内积不为零，和别人内积为零”——和向量的点积完全一样。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">正交展开与系数\u003c/span>\u003cp style=\"margin:4px 0\">若 \u003cspan class=\"eq\">x(t) = Σ C\u003csub>n\u003c/sub>f\u003csub>n\u003c/sub>(t)\u003c/span>，两边同乘 \u003cspan class=\"eq\">f\u003csub>n\u003c/sub>*(t)\u003c/span> 再积分，利用正交性，只剩下一项：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">\u003cspan style=\"font-size:1.2em\">∫\u003c/span>\u003csub>t₁\u003c/sub>\u003csup>t₂\u003c/sup>x(t)f\u003csub>n\u003c/sub>*(t)dt\u003c/span>\u003cspan class=\"fd\">\u003cspan style=\"font-size:1.2em\">∫\u003c/span>\u003csub>t₁\u003c/sub>\u003csup>t₂\u003c/sup>|f\u003csub>n\u003c/sub>(t)|²dt\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">这就是“投影”：\u003cb>分子是 x 在第 n 个基上的投影，分母是基自己的长度平方\u003c/b>。和求向量分量 \u003cspan class=\"eq\">(a·e)/|e|²\u003c/span> 一模一样。\u003c/p>\u003c/div>\u003cdiv class=\"note\">\u003cb>为什么用“均方误差最小”来定系数？\u003c/b>如果只用有限项 \u003cspan class=\"eq\">N\u003c/span> 去逼近 \u003cspan class=\"eq\">x(t)\u003c/span>，误差 \u003cspan class=\"eq\">MSE = (1/(t₂−t₁))∫[x − ΣC\u003csub>n\u003c/sub>f\u003csub>n\u003c/sub>]²dt\u003c/span>。可以证明，上面那个投影公式正好让 MSE 最小。换句话说，\u003cb>傅里叶系数是“最不浪费”的一组系数\u003c/b>——多取一项，误差只会更小，不会更差。\n\u003c/div>\u003ch4>虚指数信号为什么是“完美基”\u003c/h4>\u003cp>取 \u003cspan class=\"eq\">f\u003csub>n\u003c/sub>(t) = e\u003csup>jnω₀t\u003c/sup>\u003c/span>，在一个周期内：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">T₀\u003c/span>\u003cspan class=\"l\">&lt;T₀&gt;\u003c/sub> e\u003csup>jnω₀t\u003c/sup>·e\u003csup>−jmω₀t\u003c/sup>dt = \u003cspan style=\"font-size:1.3em\">∫\u003c/span>\u003csub>0\u003c/span>\u003c/span>\u003c/span>e\u003csup>j(n−m)ω₀t\u003c/sup>dt = T₀δ[n−m]\u003c/span>\u003c/div>\u003cp>当 \u003cspan class=\"eq\">n ≠ m\u003c/span> 时，正好转了整数圈，积分抵消为 0；当 \u003cspan class=\"eq\">n = m\u003c/span> 时被积函数是 1，积分等于 \u003cspan class=\"eq\">T₀\u003c/span>。这组基的正交性“干净得不像话”，所以傅里叶级数才能写得那么简洁。\u003c/p>"},{"id":"s42","title":"4.2 指数形式傅里叶级数","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">展开式\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span> C\u003csub>n\u003c/sub>e\u003csup>jnω₀t\u003c/sup>，　ω₀ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2π\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">其中 \u003cspan class=\"eq\">ω₀\u003c/span> 叫基波角频率，\u003cspan class=\"eq\">T₀\u003c/span> 是周期。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">系数公式（考试必写）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t₀+T₀\u003c/span>\u003cspan class=\"l\">t₀\u003c/span>\u003c/span>\u003c/span> x(t)e\u003csup>−jnω₀t\u003c/sup>dt\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">积分区间只要\u003cb>长度为一个周期\u003c/b>即可，从哪开始都行，通常选 \u003cspan class=\"eq\">[0, T₀]\u003c/span> 或 \u003cspan class=\"eq\">[−T₀/2, T₀/2]\u003c/span> 最方便。\u003c/p>\u003c/div>\u003ch4>每一项的物理意义\u003c/h4>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:22%\">项\u003c/th>\u003cth>含义\u003c/th>\u003cth style=\"width:30%\">对应频率\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">C₀\u003c/span>\u003c/td>\u003ctd>\u003cb>直流分量\u003c/b>，信号的平均值\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">C\u003csub>±1\u003c/sub>e\u003csup>±jω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cb>基波分量\u003c/b>，和原信号同周期\u003c/td>\u003ctd>\u003cspan class=\"eq\">±ω₀\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">C\u003csub>±2\u003c/sub>e\u003csup>±j2ω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cb>二次谐波\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">±2ω₀\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">C\u003csub>±N\u003c/sub>e\u003csup>±jNω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cb>N 次谐波\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">±Nω₀\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"note\">\u003cb>负频率是什么？\u003c/b>不是“负的物理频率”，而是数学上为了把 \u003cspan class=\"eq\">cos\u003c/span> 写成两个复指数而引入的“配对项”。\u003cspan class=\"eq\">C₁\u003c/span> 和 \u003cspan class=\"eq\">C\u003csub>−1\u003c/sub>\u003c/span> 合起来才是一个真实的正弦波。画频谱时左右对称，正是这个原因。\n\u003c/div>\u003ch4>三角形式与指数形式的换算\u003c/h4>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = A₀ + \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">n=1\u003c/span>\u003c/span>\u003c/span>A\u003csub>n\u003c/sub>cos(nω₀t + φ\u003csub>n\u003c/sub>)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A₀ = C₀，　A\u003csub>n\u003c/sub> = 2|C\u003csub>n\u003c/sub>|，　φ\u003csub>n\u003c/sub> = ∠C\u003csub>n\u003c/sub>（n ≥ 1）\u003c/span>\u003c/div>\u003cp>考试里如果题目给的是 \u003cspan class=\"eq\">cos\u003c/span> 形式，要你求 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>，直接用欧拉公式拆开最快：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A cos(ω₀t + φ) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">A\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>e\u003csup>jφ\u003c/sup>e\u003csup>jω₀t\u003c/sup> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">A\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>e\u003csup>−jφ\u003c/sup>e\u003csup>−jω₀t\u003c/sup>\u003c/span>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 4-1　由表达式直接读频谱（课堂原题）\u003c/span>\u003cspan class=\"tag\">秒杀题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">x(t) = 2e\u003csup>−j2ω₀t\u003c/sup> + 3e\u003csup>−jω₀t\u003c/sup> + 4 + 3e\u003csup>jω₀t\u003c/sup> + 2e\u003csup>j2ω₀t\u003c/sup>\u003c/span>，求其平均功率。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>对照标准形式 \u003cspan class=\"eq\">ΣC\u003csub>n\u003c/sub>e\u003csup>jnω₀t\u003c/sup>\u003c/span>，直接读出系数：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C₀ = 4，　C\u003csub>±1\u003c/sub> = 3，　C\u003csub>±2\u003c/sub> = 2\u003c/span>\u003c/div>\u003cp>用帕塞瓦尔定理（周期信号平均功率 = 各次谐波功率之和）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = Σ|C\u003csub>n\u003c/sub>|² = 2² + 3² + 4² + 3² + 2² = 4 + 9 + 16 + 9 + 4 = 42\u003c/span>\u003c/div>\u003cp>\u003cb>换个角度验证：\u003c/b>把信号写成实数形式 \u003cspan class=\"eq\">x(t) = 4 + 6cos ω₀t + 4cos 2ω₀t\u003c/span>，用“直流平方 + 各余弦功率 A²/2”：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = 4² + ½×6² + ½×4² = 16 + 18 + 8 = 42\u003c/span>\u003c/div>\u003cp>两种方法结果一致 ✓。这说明\u003cb>指数形式和三角形式只是同一件事的两种写法\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考场建议：\u003c/b>看到已经展开成复指数的式子，\u003cb>直接读系数平方求和\u003c/b>，10 秒出答案，不要再去积分。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s43","title":"4.3 傅里叶级数的性质","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:22%\">性质\u003c/th>\u003cth>时域\u003c/th>\u003cth>频域（系数）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>线性\u003c/td>\u003ctd>\u003cspan class=\"eq\">a x₁ + b x₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">aC\u003csub>1n\u003c/sub> + bC\u003csub>2n\u003c/sub>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t − t₀)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−jnω₀t₀\u003c/sup>C\u003csub>n\u003c/sub>\u003c/span>（幅度不变，相位线性变化）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t)e\u003csup>jMω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">C\u003csub>n−M\u003c/sub>\u003c/span>（频谱整体搬 M 格）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>微分\u003c/td>\u003ctd>\u003cspan class=\"eq\">x′(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">jnω₀C\u003csub>n\u003c/sub>\u003c/span>（高频被放大）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周期卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x̃₁(t) ∗ x̃₂(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">T₀C\u003csub>1n\u003c/sub>C\u003csub>2n\u003c/sub>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 4-1　傅里叶级数的四条核心性质（课堂重点）\u003c/p>\u003cdiv class=\"tip\">\u003cb>怎么记：\u003c/b>① \u003cb>时移只改相位，不改幅度\u003c/b>——把信号整体挪一下，各频率成分的强弱当然不变，只是“起步时刻”变了；② \u003cb>微分乘 jnω₀\u003c/b>——频率越高（n 越大），乘的系数越大，所以求导会让信号“变尖锐”，高频被强调；③ \u003cb>频移就是搬频谱\u003c/b>——乘 \u003cspan class=\"eq\">e\u003csup>jMω₀t\u003c/sup>\u003c/span> 相当于把第 n 根谱线搬到第 n−M 根的位置。\n\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 4-2　时移性质的用法\u003c/span>\u003cspan class=\"tag g\">巩固\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知周期信号 \u003cspan class=\"eq\">x(t)\u003c/span> 的系数为 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>。求 \u003cspan class=\"eq\">x(t − T₀/4)\u003c/span> 的系数。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>套时移公式，\u003cspan class=\"eq\">t₀ = T₀/4\u003c/span>，而 \u003cspan class=\"eq\">ω₀T₀ = 2π\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>′ = e\u003csup>−jnω₀T₀/4\u003c/sup>C\u003csub>n\u003c/sub> = e\u003csup>−jnπ/2\u003c/sup>C\u003csub>n\u003c/sub>\u003c/span>\u003c/div>\u003cp>即 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>′ = (−j)\u003csup>n\u003c/sup>C\u003csub>n\u003c/sub>\u003c/span>。\u003c/p>\u003cp>\u003cb>结论：\u003c/b>幅度谱完全不变（\u003cspan class=\"eq\">|C\u003csub>n\u003c/sub>′| = |C\u003csub>n\u003c/sub>|\u003c/span>），只是相位谱多了一个 \u003cspan class=\"eq\">−nπ/2\u003c/span> 的线性项。这就是“时移不改幅度谱”的最好例子。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch3>4.4 周期信号的功率谱与帕塞瓦尔定理\u003c/h3>\u003cdiv class=\"kp\">\u003cspan class=\"t\">帕塞瓦尔（Parseval）功率守恒\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">T₀/2\u003c/span>\u003cspan class=\"l\">−T₀/2\u003c/span>\u003c/span>\u003c/span>|x(t)|²dt = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span>|C\u003csub>n\u003c/sub>|²\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>物理意义：\u003c/b>时域算出来的平均功率，等于频域各次谐波功率之和。\u003cb>能量守恒，一分不多一分不少。\u003c/b>\u003c/p>\u003c/div>\u003cp>\u003cb>功率谱\u003c/b>就是把 \u003cspan class=\"eq\">|C\u003csub>n\u003c/sub>|²\u003c/span> 随频率 \u003cspan class=\"eq\">nω₀\u003c/span> 画出来。它告诉我们：信号的能量主要分布在哪些频率上。这对滤波器设计、失真分析都非常关键。\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 4-3　周期矩形脉冲的频谱\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>周期矩形脉冲：幅度为 1，脉宽为 \u003cspan class=\"eq\">τ\u003c/span>，周期为 \u003cspan class=\"eq\">T₀\u003c/span>，关于原点对称。求傅里叶系数并画频谱。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>取积分区间 \u003cspan class=\"eq\">[−T₀/2, T₀/2]\u003c/span>，矩形在 \u003cspan class=\"eq\">|t| &lt; τ/2\u003c/span> 内为 1：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">τ/2\u003c/span>\u003cspan class=\"l\">−τ/2\u003c/span>\u003c/span>\u003c/span>e\u003csup>−jnω₀t\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>−jnω₀τ/2\u003c/sup> − e\u003csup>jnω₀τ/2\u003c/sup>\u003c/span>\u003cspan class=\"fd\">−jnω₀\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>用欧拉公式化简（\u003cspan class=\"eq\">sin x = (e\u003csup>jx\u003c/sup>−e\u003csup>−jx\u003c/sup>)/2j\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">τ\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">sin(nω₀τ/2)\u003c/span>\u003cspan class=\"fd\">nω₀τ/2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">τ\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>Sa(\u003cspan class=\"fr\">\u003cspan class=\"fn\">nω₀τ\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>)\u003c/span>\u003c/div>\u003cp>\u003cb>三个结论（考试常考简答）：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>包络是 Sa 函数\u003c/b>，过零点在 \u003cspan class=\"eq\">nω₀τ/2 = kπ\u003c/span>，即 \u003cspan class=\"eq\">f = k/τ\u003c/span>。脉宽越窄，第一个零点越远，频谱越“宽”——这就是“时宽带宽反比”。\u003c/li>\u003cli>\u003cb>离散谱\u003c/b>：只在 \u003cspan class=\"eq\">nω₀\u003c/span> 这些离散频点上才有值，间隔为 \u003cspan class=\"eq\">ω₀ = 2π/T₀\u003c/span>。周期越大，谱线越密。\u003c/li>\u003cli>\u003cb>直流分量\u003c/b>\u003cspan class=\"eq\">C₀ = τ/T₀\u003c/span>，正好是脉冲的占空比（平均值）。\u003c/li>\u003c/ul>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 4-4　对称方波的频谱\u003c/span>\u003cspan class=\"tag\">经典\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>周期为 \u003cspan class=\"eq\">T₀\u003c/span> 的方波：前半周期为 +1，后半周期为 −1。求 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>，并写出前三次谐波。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>分两段积分（或用“奇函数只有正弦项”的对称性）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − (−1)\u003csup>n\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jπn\u003c/span>\u003c/span> = \u003cspan style=\"display:inline-block;text-align:left\">−j\u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">nπ\u003c/span>\u003c/span>（n 为奇数）\u003cbr>0（n 为偶数）\u003c/span>\u003c/span>\u003c/div>\u003cp>所以方波只含\u003cb>奇次谐波\u003c/b>，且幅度按 \u003cspan class=\"eq\">1/n\u003c/span> 衰减：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">π\u003c/span>\u003c/span>sin ω₀t + \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">3π\u003c/span>\u003c/span>sin 3ω₀t + \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">5π\u003c/span>\u003c/span>sin 5ω₀t + …\u003c/span>\u003c/div>\u003cp>\u003cb>为什么偶次谐波为 0？\u003c/b>因为方波有“半波对称性”：\u003cspan class=\"eq\">x(t + T₀/2) = −x(t)\u003c/span>。这种信号平移半个周期就反号，数学上导致偶数项全部抵消。\u003c/p>\u003cdiv class=\"tip\">\u003cb>记结论：\u003c/b>方波的谱线幅度 \u003cspan class=\"eq\">∝ 1/n\u003c/span>，收敛很慢，所以用有限项逼近时会有明显的过冲——这就是下一节的吉布斯现象。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch3>4.5 吉布斯现象\u003c/h3>\u003cdiv class=\"kp\">\u003cspan class=\"t\">现象描述\u003c/span>\u003cp style=\"margin:4px 0\">用有限次谐波去逼近有\u003cb>跳变\u003c/b>的信号（比如方波），在跳变点附近会出现\u003cb>过冲\u003c/b>和振荡。而且：\u003c/p>\u003cul style=\"margin-bottom:0\">\u003cli>过冲的峰值\u003cb>不随项数增加而减小\u003c/b>，始终约为跳变值的 \u003cb>9%\u003c/b>；\u003c/li>\u003cli>项数增加，只是让振荡\u003cb>更靠近\u003c/b>跳变点、变得更“窄”，但高度不变。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"note\">\u003cb>为什么会这样？\u003c/b>因为方波在跳变点处不连续，而有限项的正弦波都是光滑的。用光滑函数去拼一个“断崖”，在断崖附近必然“刹不住车”，冲过头再拉回来。项数越多，刹车越急，但冲过头的那一下（9%）是数学上的必然，消不掉。\n\u003c/div>\u003cdiv class=\"tip\">\u003cb>考点：\u003c/b>选择题常问“增加谐波项数，吉布斯现象的过冲幅度如何变化？”答案是\u003cb>不变（约 9%）\u003c/b>，只是振荡区间变窄。不要选“减小”。\n\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>傅里叶级数 = 正交分解 + 系数公式 + 四条性质 + 帕塞瓦尔。\u003cbr>\n做题顺序永远是：\u003cb>先看周期 T₀ 求 ω₀ → 代系数公式积分 → 用对称性化简 → 画幅度谱/相位谱\u003c/b>。对称性用得好，能省一半计算量：偶函数只有余弦项（\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span> 为实数），奇函数只有正弦项（\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span> 为纯虚数），半波对称只有奇次谐波。\n\u003c/div>"},{"id":"s44","title":"4.6 频谱的三大特性与对称性（CH4 L09 补充）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">周期信号频谱的三条规律\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>\u003cb>离散性：\u003c/b>谱线间隔 \u003cspan class=\"eq\">ω₀ = 2π/T₀\u003c/span>；周期越大，谱线越密；\u003c/li>\u003cli>\u003cb>衰减性：\u003c/b>信号不连续时 \u003cspan class=\"eq\">|C\u003csub>n\u003c/sub>| ∝ 1/n\u003c/span>；一阶导不连续时 \u003cspan class=\"eq\">∝ 1/n²\u003c/span>；越光滑衰减越快；\u003c/li>\u003cli>\u003cb>有效带宽：\u003c/b>周期矩形脉冲取 \u003cspan class=\"eq\">0 ~ 2π/τ\u003c/span> 为有效带宽，与时域脉宽 \u003cspan class=\"eq\">τ\u003c/span> 成反比。丢掉带外谐波对波形影响不大。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">四种对称性 → 简化一半计算（L09）\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:34%\">信号对称性\u003c/th>\u003cth>傅里叶级数中剩下的项\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>纵轴对称（偶函数）\u003c/td>\u003ctd>只有直流 + 余弦项（\u003cspan class=\"eq\">b\u003csub>n\u003c/sub>=0\u003c/span>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>原点对称（奇函数）\u003c/td>\u003ctd>只有正弦项（\u003cspan class=\"eq\">a\u003csub>0\u003c/sub>=a\u003csub>n\u003c/sub>=0\u003c/span>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>半波重叠 \u003cspan class=\"eq\">x(t±T₀/2)=x(t)\u003c/span>\u003c/td>\u003ctd>只有\u003cb>偶次\u003c/b>谐波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>半波镜像 \u003cspan class=\"eq\">x(t±T₀/2)=−x(t)\u003c/span>\u003c/td>\u003ctd>只有\u003cb>奇次\u003c/b>谐波（方波就是）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp style=\"margin-bottom:0\">\u003cb>提醒：\u003c/b>有些信号要\u003cb>先去掉直流\u003c/b>或左右平移后才显出对称性（课件专门有例题）。看到「平移后才奇对称」，答案是「含直流 + 正弦各次谐波」。\u003c/p>\u003c/div>\u003cdiv class=\"note\">\u003cb>相位谱的作用（L09 p55）：\u003c/b>把幅度谱保持不变、相位谱全部置零，合成出来的波形会明显变样；反过来保留相位谱、把幅度谱设成常数，波形轮廓反而还能认出来。\u003cb>结论：相位谱和幅度谱一样重要\u003c/b>，图像/语音处理里不能随便丢相位。\n\u003c/div>\u003c/section>"}]},{"n":5,"title":"傅里叶变换：非周期信号的频域分析","intro":"\u003cb>对应课件：\u003c/b>L11–L14（CH4 傅里叶变换、离散频谱、抽样）\u003cbr>\u003cb>本章地位：\u003c/b>全书分值最高的一章，选择题、计算题、综合题都可能出，20～30 分。\u003cbr>\u003cb>核心思想：\u003c/b>把周期 \u003cspan class=\"eq\">T₀\u003c/span> 推到无穷大，离散的谱线就“挤”成了连续的频谱密度。\u003cb>傅里叶级数是傅里叶变换的特例\u003c/b>。\u003cbr>\u003cb>必背：\u003c/b>8 个常用变换对、6 条性质、抽样定理。剩下的都是套公式。","sections":[{"id":"s51","title":"5.1 从傅里叶级数到傅里叶变换","html":"\u003cp>周期信号的谱是\u003cb>离散\u003c/b>的（一根一根谱线）。那非周期信号呢？思路很巧妙：\u003cb>把非周期信号看成周期趋于无穷大的周期信号\u003c/b>。\u003c/p>\u003cdiv class=\"kp\">\u003cspan class=\"t\">推导三步（理解即可，不必死记）\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>周期信号：\u003cspan class=\"eq\">x(t) = Σ C\u003csub>n\u003c/sub>e\u003csup>jnω₀t\u003c/sup>，C\u003csub>n\u003c/sub> = (1/T₀)∫\u003csub>−T₀/2\u003c/sub>\u003csup>T₀/2\u003c/sup>x(t)e\u003csup>−jnω₀t\u003c/sup>dt\u003c/span>。\u003c/li>\u003cli>令 \u003cspan class=\"eq\">T₀ → ∞\u003c/span>：谱线间隔 \u003cspan class=\"eq\">ω₀ = 2π/T₀ → 0\u003c/span>，离散的 \u003cspan class=\"eq\">nω₀\u003c/span> 变成连续的 \u003cspan class=\"eq\">ω\u003c/span>，求和变成积分。\u003c/li>\u003cli>定义 \u003cspan class=\"eq\">X(jω) = lim T₀C\u003csub>n\u003c/sub>\u003c/span>，就得到傅里叶变换对。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>x(t)e\u003csup>−jωt\u003c/sup>dt　（正变换）\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>X(jω)e\u003csup>jωt\u003c/sup>dω　（反变换）\u003c/span>\u003c/div>\u003cdiv class=\"note\">\u003cb>物理意义：\u003c/b>\u003cspan class=\"eq\">X(jω)\u003c/span> 叫\u003cb>频谱密度\u003c/b>。它表示“在频率 \u003cspan class=\"eq\">ω\u003c/span> 附近单位频带内，信号成分的强弱”。\u003cbr>\n为什么叫“密度”？因为非周期信号在单个频点上的能量是 0，只有在一段频带上积分才有意义——就像质量密度，单点的质量是 0，要乘体积才有质量。\u003cb>这也是它和 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span> 量纲不同的原因。\u003c/b>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-1　矩形脉冲的频谱（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">f(t) = 1（0 &lt; t &lt; 4），其他为 0\u003c/span> 的频谱函数。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>直接积分：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">F(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">4\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − e\u003csup>−j4ω\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>关键一步：提出“半宽延迟”因子\u003c/b>，把分子化成正弦。上下同乘 \u003cspan class=\"eq\">e\u003csup>−j2ω\u003c/sup>\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= e\u003csup>−j2ω\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>j2ω\u003c/sup> − e\u003csup>−j2ω\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span> = e\u003csup>−j2ω\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">2j sin 2ω\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 4·\u003cspan class=\"fr\">\u003cspan class=\"fn\">sin 2ω\u003c/span>\u003cspan class=\"fd\">2ω\u003c/span>\u003c/span>·e\u003csup>−j2ω\u003c/sup> = 4Sa(2ω)e\u003csup>−j2ω\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>怎么读这个结果：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>幅度谱\u003c/b>\u003cspan class=\"eq\">|F| = 4|Sa(2ω)|\u003c/span>：Sa 形包络，第一个零点在 \u003cspan class=\"eq\">2ω = π\u003c/span>，即 \u003cspan class=\"eq\">ω = π/2\u003c/span>；\u003c/li>\u003cli>\u003cb>相位谱\u003c/b>\u003cspan class=\"eq\">−2ω\u003c/span>：线性相位，来自“脉冲中心在 t=2”这个延迟；\u003c/li>\u003cli>若把脉冲平移到关于原点对称，则 \u003cspan class=\"eq\">F = 4Sa(2ω)\u003c/span>，是纯实数，没有相位。\u003c/li>\u003c/ul>\u003cdiv class=\"tip\">\u003cb>通用结论：\u003c/b>宽 \u003cspan class=\"eq\">τ\u003c/span>、高 1 的矩形脉冲，频谱是 \u003cspan class=\"eq\">τSa(ωτ/2)\u003c/span>，相位由“中心位置”决定。\u003cb>时域越窄，频域越宽\u003c/b>，这是后面抽样定理的伏笔。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s52","title":"5.2 常用信号的频谱（逐个推一遍）","html":"\u003ch4>① 单边指数信号\u003c/h4>\u003cp>\u003cspan class=\"eq\">x(t) = e\u003csup>−αt\u003c/sup>u(t)，α &gt; 0\u003c/span>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−αt\u003c/sup>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">α + jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">|X(jω)| = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">√(α² + ω²)\u003c/span>\u003c/span>，　φ(ω) = −arctan\u003cspan class=\"fr\">\u003cspan class=\"fn\">ω\u003c/span>\u003cspan class=\"fd\">α\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>幅度谱在 \u003cspan class=\"eq\">ω=0\u003c/span> 处最大（等于 \u003cspan class=\"eq\">1/α\u003c/span>），向两边单调下降；相位从 \u003cspan class=\"eq\">0\u003c/span> 变到 \u003cspan class=\"eq\">−π/2\u003c/span>。这是一个“低通”形状——低频强、高频弱。\u003c/p>\u003ch4>② 双边指数信号\u003c/h4>\u003cp>\u003cspan class=\"eq\">x(t) = e\u003csup>−α|t|\u003c/sup>，α &gt; 0\u003c/span>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2α\u003c/span>\u003cspan class=\"fd\">α² + ω²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>因为信号是偶函数，频谱是\u003cb>纯实数\u003c/b>，相位恒为 0。这也是一个“低通”形状，但比单边指数更“尖”。\u003c/p>\u003ch4>③ 单位冲激与直流\u003c/h4>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">δ(t) ⟷ 1，　　1 ⟷ 2πδ(ω)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>这一对是“时频对偶”的极致：\u003c/b>\u003cbr>\n· \u003cspan class=\"eq\">δ(t)\u003c/span> 在时域“窄到极致”（宽度 0），频谱却“宽到极致”（所有频率等幅为 1）——冲激包含一切频率。\u003cbr>\n· \u003cspan class=\"eq\">1\u003c/span> 在时域“宽到极致”（无限长），频谱却“窄到极致”（只在 ω=0 有一根冲激）——直流只有零频。\u003cbr>\u003cb>记住这张图，时宽带宽的关系就再也不会忘。\u003c/b>\u003c/div>\u003ch4>④ 符号函数与阶跃\u003c/h4>\u003cp>\u003cspan class=\"eq\">sgn(t)\u003c/span> 不满足绝对可积，要用“衰减因子”取极限：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">sgn(t) ⟷ \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span> = −j\u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">ω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>幅度 \u003cspan class=\"eq\">2/|ω|\u003c/span>，相位在 \u003cspan class=\"eq\">ω&gt;0\u003c/span> 时为 \u003cspan class=\"eq\">−π/2\u003c/span>，\u003cspan class=\"eq\">ω&lt;0\u003c/span> 时为 \u003cspan class=\"eq\">+π/2\u003c/span>。\u003c/p>\u003cp>阶跃可以拆成“偶部 + 奇部”：\u003cspan class=\"eq\">u(t) = ½ + ½sgn(t)\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">u(t) ⟷ πδ(ω) + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>为什么多出 \u003cspan class=\"eq\">πδ(ω)\u003c/span>？\u003c/b>因为 \u003cspan class=\"eq\">u(t)\u003c/span> 有一个非零的平均值 \u003cspan class=\"eq\">½\u003c/span>，这个直流成分对应 \u003cspan class=\"eq\">ω=0\u003c/span> 的冲激。\u003cb>漏掉它是最常见的错误。\u003c/b>\u003c/p>\u003ch4>⑤ 正弦与余弦\u003c/h4>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">cos ω₀t ⟷ π[δ(ω − ω₀) + δ(ω + ω₀)]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">sin ω₀t ⟷ jπ[δ(ω + ω₀) − δ(ω − ω₀)]\u003c/span>\u003c/div>\u003cp>余弦在 \u003cspan class=\"eq\">±ω₀\u003c/span> 各有一根强度为 \u003cspan class=\"eq\">π\u003c/span> 的冲激，且\u003cb>正负频率处相位相同\u003c/b>（偶对称）；正弦则是\u003cb>反相\u003c/b>（奇对称）。\u003c/p>\u003ch4>⑥ 一般周期信号\u003c/h4>\u003cp>把 \u003cspan class=\"eq\">x̃(t) = ΣC\u003csub>n\u003c/sub>e\u003csup>jnω₀t\u003c/sup>\u003c/span> 两边取傅里叶变换，利用 \u003cspan class=\"eq\">e\u003csup>jnω₀t\u003c/sup> ⟷ 2πδ(ω−nω₀)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(jω) = 2π\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">n=−∞\u003c/span>\u003c/span>\u003c/span>C\u003csub>n\u003c/sub>δ(ω − nω₀)\u003c/span>\u003c/div>\u003cdiv class=\"note\">\u003cb>这个式子把第 4 章和第 5 章缝在了一起：\u003c/b>周期信号的傅里叶变换，就是一串“强度为 \u003cspan class=\"eq\">2πC\u003csub>n\u003c/sub>\u003c/span>”的冲激。\u003cb>周期信号的频谱是离散的冲激串，非周期信号的频谱是连续函数\u003c/b>——这就是两者的本质区别。\n\u003c/div>"},{"id":"s53","title":"5.3 傅里叶变换的性质","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:18%\">性质\u003c/th>\u003cth style=\"width:42%\">时域\u003c/th>\u003cth>频域\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>线性\u003c/td>\u003ctd>\u003cspan class=\"eq\">a x₁(t) + b x₂(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">aX₁(jω) + bX₂(jω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t − t₀)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−jωt₀\u003c/sup>X(jω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频移（调制）\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t)e\u003csup>jω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(j(ω − ω₀))\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>尺度\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(at)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(1/|a|)X(jω/a)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>对称（互易）\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(jt)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">2πx(−ω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ h(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(jω)·H(jω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域相乘\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t)·h(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(1/2π)X(jω) ∗ H(jω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>微分\u003c/td>\u003ctd>\u003cspan class=\"eq\">dx/dt\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">jωX(jω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>积分\u003c/td>\u003ctd>\u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>x(τ)dτ\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(jω)/(jω) + πX(0)δ(ω)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 5-1　傅里叶变换性质总表（打星的四条是高频考点）\u003c/p>\u003cdiv class=\"tip\">\u003cb>记忆口诀：\u003c/b>\u003cbr>\u003cb>“时移相移”\u003c/b>——时域延迟，频域乘一个线性相位；\u003cbr>\u003cb>“频移搬移”\u003c/b>——时域乘复指数，频谱整体搬家；\u003cbr>\u003cb>“卷积变相乘”\u003c/b>——时域卷，频域乘；时域乘，频域卷（还要除以 2π）；\u003cbr>\u003cb>“微分乘 jω”\u003c/b>——求导一次，频谱乘 \u003cspan class=\"eq\">jω\u003c/span>，高频被放大。\n\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-2　互易对称性（课堂原题）\u003c/span>\u003cspan class=\"tag\">易错\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">sgn(t) ⟷ 2/(jω)\u003c/span>，求 \u003cspan class=\"eq\">2/(jt)\u003c/span> 的傅里叶变换。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>对称性公式：若 \u003cspan class=\"eq\">x(t) ⟷ X(jω)\u003c/span>，则 \u003cspan class=\"eq\">X(jt) ⟷ 2πx(−ω)\u003c/span>。\u003c/p>\u003cp>这里 \u003cspan class=\"eq\">X(jω) = 2/(jω)\u003c/span>，把 \u003cspan class=\"eq\">ω\u003c/span> 换成 \u003cspan class=\"eq\">t\u003c/span> 得 \u003cspan class=\"eq\">X(jt) = 2/(jt)\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">2/(jt) ⟷ 2π·sgn(−ω) = −2π sgn(ω)\u003c/span>\u003c/div>\u003cp>\u003cb>怎么理解这个“反着来”：\u003c/b>原信号在时域是奇函数，频谱是奇函数；把频谱的形状搬到时域后，新频谱就变成原时域信号“翻转”后的样子。\u003cb>对称性就是“时域和频域可以互换角色”\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>常用推论：\u003c/b>由 \u003cspan class=\"eq\">δ(t)⟷1\u003c/span> 得 \u003cspan class=\"eq\">1⟷2πδ(ω)\u003c/span>；由 \u003cspan class=\"eq\">矩形⟷Sa\u003c/span> 得 \u003cspan class=\"eq\">Sa⟷矩形\u003c/span>。很多“新变换对”都是这么白捡的。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-3　调制（频移）性质（课堂原题）\u003c/span>\u003cspan class=\"tag\">高频\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">x(t)cos ω₀t\u003c/span> 的频谱，并说明物理意义。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"bo
