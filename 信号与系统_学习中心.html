z/(z−a)²\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">(k+1)a\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z²/(z−a)²\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">−a\u003csup>k\u003c/sup>u[−k−1]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z/(z−a)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &lt; |a|\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">R\u003csub>N\u003c/sub>[k] = 1（0≤k≤N−1）\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(1 − z\u003csup>−N\u003c/sup>)/(1 − z\u003csup>−1\u003c/sup>)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; 0\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">cos Ω₀k·u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z(z − cos Ω₀)/(z² − 2z cos Ω₀ + 1)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; 1\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 8-1　常用 Z 变换对（\u003cb>注意：\u003c/b>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k]\u003c/span> 与 \u003cspan class=\"eq\">−a\u003csup>k\u003c/sup>u[−k−1]\u003c/span> 的 X(z) 相同，只有 ROC 不同）\u003c/p>\u003cdiv class=\"warn\">\u003cb>最经典的陷阱：\u003c/b>\u003cspan class=\"eq\">z/(z−a)\u003c/span> 的反变换有两个答案——ROC \u003cspan class=\"eq\">|z|&gt;|a|\u003c/span> 给 \u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k]\u003c/span>，ROC \u003cspan class=\"eq\">|z|&lt;|a|\u003c/span> 给 \u003cspan class=\"eq\">−a\u003csup>k\u003c/sup>u[−k−1]\u003c/span>。题目不给 ROC 就反变换，等于答错一半。\n\u003c/div>"},{"id":"s83","title":"8.3 Z 变换的性质","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:24%\">性质\u003c/th>\u003cth style=\"width:36%\">时域\u003c/th>\u003cth>z 域\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>线性\u003c/td>\u003ctd>\u003cspan class=\"eq\">a x₁ + b x₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">aX₁ + bX₂\u003c/span>（ROC 取交集，可能扩大）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>单边右移\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[k−1]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>X(z) + x[−1]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>单边右移 m 位\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[k−m]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z\u003csup>−m\u003c/sup>X(z) + \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">m\u003c/span>\u003cspan class=\"l\">j=1\u003c/span>\u003c/span>\u003c/span>x[−j]z\u003csup>−(m−j)\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>左移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[k+1]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z[X(z) − x[0]]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>卷积\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x₁ ∗ x₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X₁(z)X₂(z)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>z 域微分（k 加权）\u003c/td>\u003ctd>\u003cspan class=\"eq\">k x[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">−z·dX(z)/dz\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>指数加权\u003c/td>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>x[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(z/a)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>初值定理\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[0]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">lim\u003csub>z→∞\u003c/sub>X(z)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>终值定理\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[∞]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">lim\u003csub>z→1\u003c/sub>(z−1)X(z)\u003c/span>，需 \u003cspan class=\"eq\">(z−1)X(z)\u003c/span> 的 ROC 含单位圆\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 8-2　Z 变换性质（单边位移带初始状态，是解差分方程的关键）\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-1　求 k a\u003csup>k\u003c/sup>u[k] 的 Z 变换（课件原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k] ⟷ z/(z−a)\u003c/span>，求 \u003cspan class=\"eq\">x[k] = k a\u003csup>k\u003c/sup>u[k]\u003c/span> 的 \u003cspan class=\"eq\">X(z)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>用 z 域微分性质 \u003cspan class=\"eq\">k x[k] ⟷ −z dX/dz\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">d\u003c/span>\u003cspan class=\"fd\">dz\u003c/span>\u003c/span>[\u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − a\u003c/span>\u003c/span>] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">(z − a) − z\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">−a\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(z) = −z·\u003cspan class=\"fr\">\u003cspan class=\"fn\">−a\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">az\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span>，　ROC：|z| &gt; |a|\u003c/span>\u003c/div>\u003cp>顺带可得 \u003cspan class=\"eq\">(k+1)a\u003csup>k\u003c/sup>u[k] ⟷ z²/(z−a)²\u003c/span>（把两项相加即可）。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-2　初值、终值定理（课件原题）\u003c/span>\u003cspan class=\"tag g\">填空常客\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">X(z) = 1/(1 − a z\u003csup>−1\u003c/sup>) = z/(z−a)\u003c/span>，\u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>。求 \u003cspan class=\"eq\">x[0], x[1], x[∞]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>初值：\u003c/b>\u003cspan class=\"eq\">x[0] = lim\u003csub>z→∞\u003c/sub> z/(z−a) = 1\u003c/span>。\u003c/p>\u003cp>\u003cb>下一项：\u003c/b>用位移性质 \u003cspan class=\"eq\">Z{x[k+1]} = z[X(z) − x[0]] = z[z/(z−a) − 1] = az/(z−a)\u003c/span>，故 \u003cspan class=\"eq\">x[1] = lim\u003csub>z→∞\u003c/sub> az/(z−a) = a\u003c/span>。与 \u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k]\u003c/span> 一致 ✓。\u003c/p>\u003cp>\u003cb>终值：\u003c/b>\u003cspan class=\"eq\">(z−1)X(z) = z(z−1)/(z−a)\u003c/span>，其 ROC 是 \u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>。\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">|a| &lt; 1\u003c/span>：ROC 包含单位圆，\u003cspan class=\"eq\">x[∞] = lim\u003csub>z→1\u003c/sub>z(z−1)/(z−a) = 0\u003c/span> ✓（衰减到 0）；\u003c/li>\u003cli>\u003cspan class=\"eq\">|a| &gt; 1\u003c/span> 或 \u003cspan class=\"eq\">a = −1\u003c/span>：ROC 不含单位圆或极点在单位圆上，\u003cb>终值不存在\u003c/b>；\u003c/li>\u003cli>\u003cspan class=\"eq\">a = 1\u003c/span>：\u003cspan class=\"eq\">x[k] = u[k]\u003c/span>，终值为 1（此时 \u003cspan class=\"eq\">(z−1)X(z) = z\u003c/span>，极限为 1）✓。\u003c/li>\u003c/ul>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>不检查 ROC 就套终值公式，会算出「\u003cspan class=\"eq\">a=2\u003c/span> 时 x[∞]=0」这种明显荒谬的结论（实际 \u003cspan class=\"eq\">2\u003csup>k\u003c/sup>\u003c/span> 发散）。\u003cb>先判收敛，再求极限。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s84","title":"8.4 Z 反变换","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">三种方法\u003c/span>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>幂级数展开（长除法）：\u003c/b>把 \u003cspan class=\"eq\">X(z)\u003c/span> 展开成 \u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>\u003c/span> 的幂级数，系数就是 \u003cspan class=\"eq\">x[k]\u003c/span>。适合只求前几项，得不到闭式。\u003c/li>\u003cli>\u003cb>部分分式展开（主力）：\u003c/b>关键技巧是\u003cb>先对 X(z)/z 展开\u003c/b>，再乘回 z，这样每一项都是 \u003cspan class=\"eq\">z/(z−p)\u003c/span> 的标准形，可直接查表。\u003c/li>\u003cli>\u003cb>留数法：\u003c/b>理论通用，计算量大，了解即可。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-3　部分分式法求反变换\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">X(z) = z²/[(z−1)(z−0.5)]\u003c/span>，\u003cspan class=\"eq\">|z| &gt; 1\u003c/span>，求 \u003cspan class=\"eq\">x[k]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：对 X(z)/z 展开。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">X(z)\u003c/span>\u003cspan class=\"fd\">z\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">(z−1)(z−0.5)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">A\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">B\u003c/span>\u003cspan class=\"fd\">z − 0.5\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：遮盖法。\u003c/b>\u003cspan class=\"eq\">A = z/(z−0.5)|\u003csub>z=1\u003c/sub> = 1/0.5 = 2\u003c/span>；\u003cspan class=\"eq\">B = z/(z−1)|\u003csub>z=0.5\u003c/sub> = 0.5/(−0.5) = −1\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2z\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 0.5\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：查表。\u003c/b>ROC 是 \u003cspan class=\"eq\">|z|&gt;1\u003c/span>（圆外）→ 两项都是右边序列：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = [2 − (0.5)\u003csup>k\u003c/sup>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">x[0]=2−1=1\u003c/span>；初值定理 \u003cspan class=\"eq\">lim\u003csub>z→∞\u003c/sub>X(z)=1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>为什么先除 z？\u003c/b>因为标准变换对是 \u003cspan class=\"eq\">z/(z−a)\u003c/span> 的形式，直接对 \u003cspan class=\"eq\">X(z)\u003c/span> 展开会得到 \u003cspan class=\"eq\">1/(z−a)\u003c/span>，查表时容易错一位（对应 \u003cspan class=\"eq\">a\u003csup>k−1\u003c/sup>u[k−1]\u003c/span>）。\u003cb>先除 z、再乘回 z，是课件反复强调的规范动作。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-4　同一 X(z) 不同 ROC（课件原题）\u003c/span>\u003cspan class=\"tag\">拉分题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">X(z) = z/[(z−2)(z−3)]\u003c/span>，分别求 ROC 为 \u003cspan class=\"eq\">|z|&gt;3\u003c/span>、\u003cspan class=\"eq\">2&lt;|z|&lt;3\u003c/span>、\u003cspan class=\"eq\">|z|&lt;2\u003c/span> 时的 \u003cspan class=\"eq\">x[k]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>先展开（对 \u003cspan class=\"eq\">X(z)/z\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">X(z)\u003c/span>\u003cspan class=\"fd\">z\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(z−2)(z−3)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">−1\u003c/span>\u003cspan class=\"fd\">z − 2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">z − 3\u003c/span>\u003c/span> ⟹ X(z) = −\u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 3\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>① \u003cspan class=\"eq\">|z| &gt; 3\u003c/span>：\u003c/b>两项都是右边序列：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = (3\u003csup>k\u003c/sup> − 2\u003csup>k\u003c/sup>)u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>② \u003cspan class=\"eq\">2 &lt; |z| &lt; 3\u003c/span>：\u003c/b>极点 2 属于 ROC 内侧 → 取右边；极点 3 属于外侧 → 取左边（\u003cspan class=\"eq\">z/(z−3)\u003c/span> 配 \u003cspan class=\"eq\">−3\u003csup>k\u003c/sup>u[−k−1]\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = −2\u003csup>k\u003c/sup>u[k] − 3\u003csup>k\u003c/sup>u[−k−1]\u003c/span>\u003c/div>\u003cp>\u003cb>③ \u003cspan class=\"eq\">|z| &lt; 2\u003c/span>：\u003c/b>两项都是左边序列：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = (2\u003csup>k\u003c/sup> − 3\u003csup>k\u003c/sup>)u[−k−1]\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>判定口诀：\u003c/b>「ROC 在某个极点\u003cb>外侧\u003c/b>，那一项就是\u003cb>右边\u003c/b>序列；ROC 在某个极点\u003cb>内侧\u003c/b>，那一项就是\u003cb>左边\u003c/b>序列」。逐个极点判，绝不会乱。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s85","title":"8.5 离散系统函数 H(z) 与系统特性","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">H(z) 的三种求法\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">Y\u003csub>zs\u003c/sub>(z)\u003c/span>\u003cspan class=\"fd\">X(z)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">Σ b\u003csub>j\u003c/sub>z\u003csup>−j\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 + Σ a\u003csub>i\u003c/sub>z\u003csup>−i\u003c/sup>\u003c/span>\u003c/span> = \u003cspan class=\"eq\">Z\u003c/span>{h[k]}\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">对差分方程两边取（零状态）Z 变换，把 \u003cspan class=\"eq\">y[k−i] → z\u003csup>−i\u003c/sup>Y(z)\u003c/span>、\u003cspan class=\"eq\">x[k−j] → z\u003csup>−j\u003c/sup>X(z)\u003c/span>，整理即得。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">极点位置与稳定性（把「左半平面」换成「单位圆」）\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:36%\">极点在 z 平面\u003c/th>\u003cth>\u003cspan class=\"eq\">h[k]\u003c/span> 形状\u003c/th>\u003cth style=\"width:20%\">因果系统稳定性\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">|p| &lt; 1\u003c/span> 单位圆内\u003c/td>\u003ctd>衰减\u003c/td>\u003ctd>稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">|p| = 1\u003c/span> 单位圆上\u003c/td>\u003ctd>等幅振荡 / 常数\u003c/td>\u003ctd>临界（不算稳定）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">|p| &gt; 1\u003c/span> 单位圆外\u003c/td>\u003ctd>增长\u003c/td>\u003ctd>不稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>共轭复极点 \u003cspan class=\"eq\">re\u003csup>±jθ\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">r\u003csup>k\u003c/sup>cos(θk + φ)\u003c/span>\u003c/td>\u003ctd>看 r\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp style=\"margin-bottom:0\">\u003cb>一般系统稳定\u003c/b> ⟺ ROC 包含单位圆；\u003cb>因果系统稳定\u003c/b> ⟺ 全部极点在单位圆内；\u003cb>因果\u003c/b> ⟺ \u003cspan class=\"eq\">h[k]=0（k&lt;0）\u003c/span>、ROC 为 \u003cspan class=\"eq\">|z| &gt; max|p|\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-5　由差分方程求 H(z)（课件原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y[k] + 3y[k−1] + 2y[k−2] = 3x[k] − x[k−1]\u003c/span>，求 \u003cspan class=\"eq\">H(z)\u003c/span> 并判断因果系统的稳定性。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>零状态取 Z 变换：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">(1 + 3z\u003csup>−1\u003c/sup> + 2z\u003csup>−2\u003c/sup>)Y(z) = (3 − z\u003csup>−1\u003c/sup>)X(z)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">3 − z\u003csup>−1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 + 3z\u003csup>−1\u003c/sup> + 2z\u003csup>−2\u003c/sup>\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z(3z − 1)\u003c/span>\u003cspan class=\"fd\">z² + 3z + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z(3z − 1)\u003c/span>\u003cspan class=\"fd\">(z+1)(z+2)\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>极点 \u003cspan class=\"eq\">z = −1, −2\u003c/span>。其中 \u003cspan class=\"eq\">|−2| = 2 &gt; 1\u003c/span>，在单位圆外 → \u003cb>因果系统不稳定\u003c/b>。零点为 \u003cspan class=\"eq\">z = 0\u003c/span> 与 \u003cspan class=\"eq\">z = 1/3\u003c/span>。\u003c/p>\u003cp>\u003cb>补充：\u003c/b>如果不要求因果，只要 ROC 取 \u003cspan class=\"eq\">1 &lt; |z| &lt; 2\u003c/span>（包含单位圆），系统就是稳定的，但此时的 \u003cspan class=\"eq\">h[k]\u003c/span> 是双边序列、非因果。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-6　单位延时器（最简单的 H(z)）\u003c/span>\u003cspan class=\"tag g\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">y[k] = x[k−1]\u003c/span> 的系统函数。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z) = z\u003csup>−1\u003c/sup>X(z) ⟹ H(z) = z\u003csup>−1\u003c/sup>，　h[k] = δ[k−1]\u003c/span>\u003c/div>\u003cp>这是离散系统模拟框图里最基本的单元：\u003cb>一个 \u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>\u003c/span> 方框 = 延迟一个采样点\u003c/b>。连续系统对应的是积分器 \u003cspan class=\"eq\">1/s\u003c/span>。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-7　判断因果系统稳定性（课件原题）\u003c/span>\u003cspan class=\"tag\">选择常客\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>某因果离散系统的极点为 \u003cspan class=\"eq\">z₁=0.5, z₂=1.5\u003c/span>，判断稳定性。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>因果 → ROC 为 \u003cspan class=\"eq\">|z| &gt; 1.5\u003c/span>，\u003cb>不包含单位圆\u003c/b> → 不稳定。从极点看：\u003cspan class=\"eq\">1.5\u003c/span> 在单位圆外，\u003cspan class=\"eq\">h[k]\u003c/span> 中含 \u003cspan class=\"eq\">1.5\u003csup>k\u003c/sup>\u003c/span> 增长项，故不稳定。\u003c/p>\u003cp>\u003cb>两种说法都对，写任一种即可；最好两种都写，显得思路完整。\u003c/b>\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s86","title":"8.6 z 域求系统响应","html":"\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-8　一阶差分方程的 z 域解（与第 3 章对照）\u003c/span>\u003cspan class=\"tag\">大题模板\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y[k] − 0.5y[k−1] = u[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 1\u003c/span>，用 Z 变换求完全响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：两边取单边 Z 变换\u003c/b>，用 \u003cspan class=\"eq\">Z{y[k−1]} = z\u003csup>−1\u003c/sup>Y(z) + y[−1]\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z) − 0.5[z\u003csup>−1\u003c/sup>Y(z) + 1] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：整理。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z)(1 − 0.5z\u003csup>−1\u003c/sup>) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span> + 0.5 ⟹ Y(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z²\u003c/span>\u003cspan class=\"fd\">(z − 1)(z − 0.5)\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">0.5z\u003c/span>\u003cspan class=\"fd\">z − 0.5\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：分别反变换。\u003c/b>第一项在例 8-3 已算过，是 \u003cspan class=\"eq\">[2 − (0.5)\u003csup>k\u003c/sup>]u[k]\u003c/span>；第二项是 \u003cspan class=\"eq\">0.5·(0.5)\u003csup>k\u003c/sup>u[k] = (0.5)\u003csup>k+1\u003c/sup>u[k]\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = 2 − (0.5)\u003csup>k\u003c/sup> + (0.5)\u003csup>k+1\u003c/sup> = 2 − (0.5)\u003csup>k+1\u003c/sup>，　k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>与第 3 章迭代法的结果完全一致 ✓\u003c/b>（\u003cspan class=\"eq\">y[0]=1.5, y[1]=1.75, y[2]=1.875\u003c/span>）。\u003c/p>\u003cdiv class=\"tip\">\u003cb>拆分含义：\u003c/b>第一项只含输入 \u003cspan class=\"eq\">u[k]\u003c/span>，是\u003cb>零状态响应\u003c/b>；第二项只含 \u003cspan class=\"eq\">y[−1]\u003c/span>，是\u003cb>零输入响应\u003c/b>。Z 变换把两者自动分开了，这正是它比时域法省心的地方。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s87","title":"8.7 离散系统的模拟框图","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">基本单元与三种结构\u003c/span>\u003cp style=\"margin:4px 0\">基本单元：\u003cb>数乘器、加法器、单位延时器 \u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>\u003c/span>\u003c/b>。选\u003cb>延时器输出端\u003c/b>作为状态变量，围绕延时器输入端列方程，就能写出状态方程（见第 9 章）。\u003c/p>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>直接型：\u003c/b>把 \u003cspan class=\"eq\">H(z)\u003c/span> 写成 \u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>\u003c/span> 的有理式，分母系数变号作反馈、分子系数作前馈；\u003c/li>\u003cli>\u003cb>级联型：\u003c/b>\u003cspan class=\"eq\">H(z) = H₁(z)H₂(z)…\u003c/span>，每个一阶/二阶子系统画直接型再串联；\u003c/li>\u003cli>\u003cb>并联型：\u003c/b>部分分式展开 \u003cspan class=\"eq\">H(z) = H₁(z) + H₂(z)+…\u003c/span>，各子系统并联。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-9　自激振荡器设计（课件原题）\u003c/span>\u003cspan class=\"tag g\">综合\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>要设计一个产生等幅余弦波 \u003cspan class=\"eq\">cos Ω₀k\u003c/span> 的数字振荡器，\u003cspan class=\"eq\">H(z)\u003c/span> 的极点应放在哪里？\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>等幅正弦/余弦对应的极点必须在\u003cb>单位圆上\u003c/b>：\u003cspan class=\"eq\">p = e\u003csup>±jΩ₀\u003c/sup>\u003c/span>，此时 \u003cspan class=\"eq\">|p|=1\u003c/span>，\u003cspan class=\"eq\">h[k]\u003c/span> 不衰减也不增长。\u003c/p>\u003cp>取 \u003cspan class=\"eq\">H(z) = 1/(1 − 2cos Ω₀·z\u003csup>−1\u003c/sup> + z\u003csup>−2\u003c/sup>)\u003c/span>，极点为 \u003cspan class=\"eq\">e\u003csup>±jΩ₀\u003c/sup>\u003c/span>。由 \u003cspan class=\"eq\">Z{cos Ω₀k·u[k]}\u003c/span> 可知，零状态响应正是等幅余弦波。\u003c/p>\u003cp>\u003cb>注意：\u003c/b>这类系统\u003cb>不是 BIBO 稳定\u003c/b>的（极点在单位圆上），但正好利用这一点让振荡持续——工程上靠非线性限幅来稳住幅度。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s88","title":"8.8 综合案例：回声消除的 z 域分析（课程案例）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">问题：电话/会议里的回声\u003c/span>\u003cp style=\"margin:4px 0\">声波遇到障碍物反射，延时后叠加到原声上。设抽样间隔 \u003cspan class=\"eq\">T₀\u003c/span>、延时 \u003cspan class=\"eq\">N\u003c/span> 点、衰减系数 \u003cspan class=\"eq\">0 &lt; α &lt; 1\u003c/span>，则回声信号：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">r[k] = x[k] + αx[k − N]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">课件实例：\u003cspan class=\"eq\">α=0.5, N=18000, f\u003csub>s\u003c/sub>=44100\u003c/span> Hz，对应延时 \u003cspan class=\"eq\">18000/44100 ≈ 408.2 ms\u003c/span>——远大于人耳可分辨的 100 ms，听得非常清楚。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">时域思路 vs z 域思路\u003c/span>\u003cp style=\"margin:4px 0\">要消除回声，得设计一个「逆系统」\u003cspan class=\"eq\">h\u003csub>i\u003c/sub>[k]\u003c/span> 使 \u003cspan class=\"eq\">h ∗ h\u003csub>i\u003c/sub> = δ[k]\u003c/span>。时域解卷积非常麻烦；z 域里却只是\u003cb>取倒数\u003c/b>：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">H(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">R(z)\u003c/span>\u003cspan class=\"fd\">X(z)\u003c/span>\u003c/span> = 1 + αz\u003csup>−N\u003c/sup> ⟹ H\u003csub>i\u003c/sub>(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">H(z)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + αz\u003csup>−N\u003c/sup>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">由 \u003cspan class=\"eq\">Y(z)(1 + αz\u003csup>−N\u003c/sup>) = R(z)\u003c/span> 反变换，得到递归差分方程：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">y[k] = r[k] − α·y[k − N]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">只要 \u003cspan class=\"eq\">|α| &lt; 1\u003c/span>，逆系统的极点满足 \u003cspan class=\"eq\">|z| = |α|\u003csup>1/N\u003c/sup> &lt; 1\u003c/span>，全在单位圆内 → \u003cb>系统稳定，回声可消除\u003c/b>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 8-10　写出回声消除的 MATLAB 仿真（课件代码）\u003c/span>\u003cspan class=\"tag g\">编程题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>给出实现 \u003cspan class=\"eq\">r[k]=x[k]+αx[k−N]\u003c/span> 与 \u003cspan class=\"eq\">y[k]=r[k]−αy[k−N]\u003c/span> 的核心代码。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">alpha = 0.5;  N = 18000;\u003cbr>\nr = [x, zeros(1,N)] + [zeros(1,N), alpha*x];   % 产生回声\u003cbr>\nL = length(r);  y = zeros(1,L);\u003cbr>\nfor k = 1:L\u003cbr>\n&nbsp;&nbsp;if k &gt; N\u003cbr>\n&nbsp;&nbsp;&nbsp;&nbsp;y(k) = r(k) - alpha*y(k-N);              % 逆系统递归\u003cbr>\n&nbsp;&nbsp;else\u003cbr>\n&nbsp;&nbsp;&nbsp;&nbsp;y(k) = r(k);\u003cbr>\n&nbsp;&nbsp;end\u003cbr>\nend\u003cbr>\ne = y - [x, zeros(1,N)];                        % 误差应接近 0\u003c/span>\u003c/div>\u003cp>\u003cb>为什么前 N 个点直接抄 r[k]？\u003c/b>因为 \u003cspan class=\"eq\">y[k−N]\u003c/span> 还没定义，相当于逆系统的初始状态为零。从第 \u003cspan class=\"eq\">N+1\u003c/span> 点起才开始反馈抵消。\u003c/p>\u003cp>\u003cb>考点：\u003c/b>把「求逆系统」翻译成 z 域的「取倒数」，再把 \u003cspan class=\"eq\">H\u003csub>i\u003c/sub>(z)\u003c/span> 翻译成可迭代的差分方程——这正是 CH7 最综合的应用题。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>Z 变换与拉氏变换一一对应：\u003cspan class=\"eq\">e\u003csup>st\u003c/sup> ↔ z\u003csup>k\u003c/sup>\u003c/span>、\u003cspan class=\"eq\">1/s ↔ z\u003csup>−1\u003c/sup>\u003c/span>、左半平面 ↔ 单位圆内、jω 轴 ↔ 单位圆。三件大事：\u003cb>①\u003c/b> 用 ROC 判断右边/左边/双边序列；\u003cb>②\u003c/b> 用 \u003cspan class=\"eq\">H(z)\u003c/span> 的极点判断因果稳定；\u003cb>③\u003c/b> 用部分分式（先除 z）做反变换。\u003cb>下一章讲状态变量，把「一个高阶方程」变成「一组一阶方程」。\u003c/b>\u003c/div>\u003c/section>"}]},{"n":9,"title":"状态变量分析（CH8）","intro":"\u003cb>对应课件：\u003c/b>L25 状态方程建立、L26 连续状态方程求解、L26 离散状态方程求解。\u003cbr>\u003cb>本章地位：\u003c/b>课程最后一章，把「输入—输出描述」升级成「内部状态描述」，是多输入多输出（MIMO）系统和计算机仿真的基础。考试以\u003cb>写状态方程、求状态转移矩阵、判能控能观（若讲）\u003c/b>为主。\u003cbr>\u003cb>一句话主线：\u003c/b>把 \u003cspan class=\"eq\">n\u003c/span> 阶微分/差分方程，改写成 \u003cspan class=\"eq\">n\u003c/span> 个一阶方程组成的矩阵方程组 \u003cspan class=\"eq\">q′ = Aq + Bx，y = Cq + Dx\u003c/span>。","sections":[{"id":"s91","title":"9.1 为什么需要状态变量","html":"\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>输入—输出描述（前 8 章）\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">只关心 \u003cspan class=\"eq\">x(t) → y(t)\u003c/span>，用一个 \u003cspan class=\"eq\">n\u003c/span> 阶微分方程描述。适合单输入单输出（SISO），但看不到系统\u003cb>内部\u003c/b>发生了什么。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>状态变量描述（本章）\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">引入内部状态 \u003cspan class=\"eq\">q(t)\u003c/span>，用 \u003cspan class=\"eq\">n\u003c/span> 个一阶方程描述。能描述 MIMO 系统、能反映内部变量变化、\u003cb>天生适合计算机迭代求解\u003c/b>。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tip\">\u003cb>什么是「状态」？\u003c/b>就是系统「记住了什么」。知道 \u003cspan class=\"eq\">t₀\u003c/span> 时刻的状态 \u003cspan class=\"eq\">q(t₀)\u003c/span> 和之后的输入，就能唯一确定之后的所有输出——\u003cb>过去的历史全部压缩在这几个数里\u003c/b>。电路里最自然的两个状态是\u003cb>电容电压 \u003cspan class=\"eq\">u\u003csub>C\u003c/sub>\u003c/span> 和电感电流 \u003cspan class=\"eq\">i\u003csub>L\u003c/sub>\u003c/span>\u003c/b>，因为它们不能突变，正好是「记忆元件」。\n\u003c/div>"},{"id":"s92","title":"9.2 状态方程与输出方程的一般形式","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">连续时间系统\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">状态方程：q′(t) = A q(t) + B x(t)；　输出方程：y(t) = C q(t) + D x(t)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">离散时间系统\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">状态方程：q[k+1] = A q[k] + B x[k]；　输出方程：y[k] = C q[k] + D x[k]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">其中 \u003cspan class=\"eq\">q\u003c/span> 是 \u003cspan class=\"eq\">n×1\u003c/span> 状态向量，\u003cspan class=\"eq\">x\u003c/span> 是 \u003cspan class=\"eq\">p×1\u003c/span> 输入向量，\u003cspan class=\"eq\">y\u003c/span> 是 \u003cspan class=\"eq\">r×1\u003c/span> 输出向量；矩阵维度：\u003cspan class=\"eq\">A: n×n\u003c/span>、\u003cspan class=\"eq\">B: n×p\u003c/span>、\u003cspan class=\"eq\">C: r×n\u003c/span>、\u003cspan class=\"eq\">D: r×p\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 9-1　读懂双输入双输出状态方程（课件原题）\u003c/span>\u003cspan class=\"tag\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>某系统有 2 个状态、2 个输入、2 个输出，写出其矩阵形式并说明各符号含义。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\">\u003cspan class=\"eq\" style=\"line-height:1.9\">[\u003cspan class=\"fr\">\u003cspan class=\"fn\">q₁′\u003c/span>\u003cspan class=\"fd\">q₂′\u003c/span>\u003c/span>] = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">a₁₁ a₁₂\u003c/span>\u003cspan class=\"fd\">a₂₁ a₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">q₁\u003c/span>\u003cspan class=\"fd\">q₂\u003c/span>\u003c/span>] + [\u003cspan class=\"fr\">\u003cspan class=\"fn\">b₁₁ b₁₂\u003c/span>\u003cspan class=\"fd\">b₂₁ b₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">x₁\u003c/span>\u003cspan class=\"fd\">x₂\u003c/span>\u003c/span>]\u003cbr>\n[\u003cspan class=\"fr\">\u003cspan class=\"fn\">y₁\u003c/span>\u003cspan class=\"fd\">y₂\u003c/span>\u003c/span>] = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">c₁₁ c₁₂\u003c/span>\u003cspan class=\"fd\">c₂₁ c₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">q₁\u003c/span>\u003cspan class=\"fd\">q₂\u003c/span>\u003c/span>] + [\u003cspan class=\"fr\">\u003cspan class=\"fn\">d₁₁ d₁₂\u003c/span>\u003cspan class=\"fd\">d₂₁ d₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">x₁\u003c/span>\u003cspan class=\"fd\">x₂\u003c/span>\u003c/span>]\u003c/span>\u003c/div>\u003cp>\u003cb>含义：\u003c/b>\u003cspan class=\"eq\">A\u003c/span> 描述状态之间如何互相影响（系统内部结构），\u003cspan class=\"eq\">B\u003c/span> 描述输入如何注入状态，\u003cspan class=\"eq\">C\u003c/span> 描述状态如何组合成输出，\u003cspan class=\"eq\">D\u003c/span> 是输入到输出的\u003cb>直通\u003c/b>部分（多数物理系统 \u003cspan class=\"eq\">D=0\u003c/span>）。\u003c/p>\u003cp>\u003cb>考试常问：\u003c/b>「状态变量的个数等于什么？」答案：\u003cb>系统阶数 = 独立储能元件个数 = 积分器/延时器个数\u003c/b>。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s93","title":"9.3 状态方程的建立（三条路）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">方法一：由电路建立（课件四步法）\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>选\u003cb>电容电压和电感电流\u003c/b>作为状态变量；\u003c/li>\u003cli>选一组回路电流，写出它们与状态变量的关系；\u003c/li>\u003cli>列写 KVL/KCL 回路方程；\u003c/li>\u003cli>消去非状态变量，整理成 \u003cspan class=\"eq\">q′ = Aq + Bx\u003c/span> 与 \u003cspan class=\"eq\">y = Cq + Dx\u003c/span>。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">方法二：由模拟框图建立（最常考）\u003c/span>\u003cp style=\"margin:4px 0\">连续系统选\u003cb>积分器输出端\u003c/b>为状态变量，离散系统选\u003cb>延时器输出端\u003c/b>为状态变量；围绕积分器/延时器的\u003cb>输入端\u003c/b>列状态方程，围绕系统\u003cb>输出端\u003c/b>列输出方程。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">方法三：由微分方程 / 系统函数建立\u003c/span>\u003cp style=\"margin-bottom:0\">先由 \u003cspan class=\"eq\">H(s)\u003c/span> 或 \u003cspan class=\"eq\">H(z)\u003c/span> 画出\u003cb>直接型模拟框图\u003c/b>，再按方法二写方程。这是考试最标准的流程。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 9-2　由二阶系统函数写状态方程\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">H(s) = 1/(s² + 5s + 6)\u003c/span>，写出直接型状态方程与输出方程。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：写出微分方程。\u003c/b>\u003cspan class=\"eq\">(s²+5s+6)Y(s) = X(s)\u003c/span> ⟹ \u003cspan class=\"eq\">y″ + 5y′ + 6y = x\u003c/span>。\u003c/p>\u003cp>\u003cb>第二步：选状态变量。\u003c/b>取 \u003cspan class=\"eq\">q₁ = y\u003c/span>，\u003cspan class=\"eq\">q₂ = y′\u003c/span>（即两个积分器的输出，从右往左）。\u003c/p>\u003cp>\u003cb>第三步：列一阶方程组。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₁′ = q₂；　q₂′ = y″ = −6q₁ − 5q₂ + x；　y = q₁\u003c/span>\u003c/div>\u003cp>\u003cb>第四步：写成矩阵形式。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">0　　1\u003c/span>\u003cspan class=\"fd\">−6　−5\u003c/span>\u003c/span>]，　B = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">0\u003c/span>\u003cspan class=\"fd\">1\u003c/span>\u003c/span>]，　C = [1　0]，　D = 0\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>规律（相伴矩阵 / 可控标准型）：\u003c/b>对 \u003cspan class=\"eq\">y″ + a₁y′ + a₀y = b₀x\u003c/span>，直接写 \u003cspan class=\"eq\">A = [[0,1],[−a₀,−a₁]]\u003c/span>，\u003cspan class=\"eq\">B=[0,1]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">C=[b₀,0]\u003c/span>，\u003cspan class=\"eq\">D=0\u003c/span>。\u003cb>背下这个模板，选择题和大题的第一步都能秒写。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 9-3　离散系统由框图写状态方程（课件原题）\u003c/span>\u003cspan class=\"tag g\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>二阶离散系统直接型结构，中间变量为 \u003cspan class=\"eq\">w[k]\u003c/span>，差分方程 \u003cspan class=\"eq\">y[k] + a₁y[k−1] + a₂y[k−2] = b₀x[k] + b₁x[k−1] + b₂x[k−2]\u003c/span>，写出状态方程。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>取两个延时器的输出为状态：\u003cspan class=\"eq\">q₁[k] = w[k−1]\u003c/span>，\u003cspan class=\"eq\">q₂[k] = w[k−2]\u003c/span>。由延时器输入关系：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₁[k+1] = w[k] = x[k] − a₁q₁[k] − a₂q₂[k]；　q₂[k+1] = q₁[k]\u003c/span>\u003c/div>\u003cp>输出：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = b₀w[k] + b₁q₁[k] + b₂q₂[k] = b₀x[k] + (b₁ − b₀a₁)q₁[k] + (b₂ − b₀a₂)q₂[k]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">−a₁　−a₂\u003c/span>\u003cspan class=\"fd\">1　　0\u003c/span>\u003c/span>]，　B = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">0\u003c/span>\u003c/span>]，　C = [b₁−b₀a₁　b₂−b₀a₂]，　D = b₀\u003c/span>\u003c/div>\u003cp>\u003cb>注意：\u003c/b>离散版的状态方程是 \u003cspan class=\"eq\">q[k+1] = Aq[k] + Bx[k]\u003c/span>，\u003cb>不是\u003c/b>\u003cspan class=\"eq\">q′\u003c/span>；而且 \u003cspan class=\"eq\">D\u003c/span> 这一项来自 \u003cspan class=\"eq\">w[k]\u003c/span> 里直接含有的 \u003cspan class=\"eq\">x[k]\u003c/span>，别漏掉。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s94","title":"9.4 连续状态方程的求解","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">时域解（状态转移矩阵）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q(t) = e\u003csup>At\u003c/sup>q(0\u003csup>−\u003c/sup>) + \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>A(t−τ)\u003c/sup>B x(τ)dτ\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = C q(t) + D x(t)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">第一项是\u003cb>零输入响应\u003c/b>（只由初始状态），第二项是\u003cb>零状态响应\u003c/b>（只由输入）。\u003cspan class=\"eq\">Φ(t) = e\u003csup>At\u003c/sup>\u003c/span> 叫状态转移矩阵，可以用 \u003cspan class=\"eq\">e\u003csup>At\u003c/sup> = \u003cspan class=\"eq\">L\u003c/span>\u003csup>−1\u003c/sup>{(sI − A)\u003csup>−1\u003c/sup>}\u003c/span> 求。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">s 域解（推荐，考场上更稳）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">sQ(s) − q(0\u003csup>−\u003c/sup>) = AQ(s) + BX(s) ⟹ Q(s) = (sI − A)\u003csup>−1\u003c/sup>[q(0\u003csup>−\u003c/sup>) + BX(s)]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(s) = C(sI − A)\u003csup>−1\u003c/sup>q(0\u003csup>−\u003c/sup>) + [C(sI − A)\u003csup>−1\u003c/sup>B + D]X(s)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">后一项里的 \u003cspan class=\"eq\">C(sI−A)\u003csup>−1\u003c/sup>B + D\u003c/span> 正好就是\u003cb>系统函数 H(s)\u003c/b>——状态方程与前面各章在这里完全打通。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 9-4　对角 A 矩阵求解（初学者友好）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">A = [[−1, 0],[0, −2]]\u003c/span>，\u003cspan class=\"eq\">B = [1, 1]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">C = [1, 1]\u003c/span>，\u003cspan class=\"eq\">D = 0\u003c/span>，初始状态 \u003cspan class=\"eq\">q(0)=[1,1]\u003csup>T\u003c/sup>\u003c/span>，输入 \u003cspan class=\"eq\">x(t)=u(t)\u003c/span>。求 \u003cspan class=\"eq\">y(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>因为 A 是对角阵，两个状态互不耦合\u003c/b>，可以拆成两个一阶方程分别解：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₁′ = −q₁ + 1，q₁(0)=1 ⟹ q₁(t) = e\u003csup>−t\u003c/sup> + (1 − e\u003csup>−t\u003c/sup>) = 1\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₂′ = −2q₂ + 1，q₂(0)=1 ⟹ q₂(t) = e\u003csup>−2t\u003c/sup> + ½(1 − e\u003csup>−2t\u003c/sup>) = ½ + ½e\u003csup>−2t\u003c/sup>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = q₁ + q₂ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">3\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup>，　t ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>用状态转移矩阵验证：\u003c/b>\u003cspan class=\"eq\">e\u003csup>At\u003c/sup> = diag(e\u003csup>−t\u003c/sup>, e\u003csup>−2t\u003c/sup>)\u003c/span>，代入时域解公式结果相同 ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考试技巧：\u003c/b>遇到 \u003cspan class=\"eq\">2×2\u003c/span> 矩阵，先算 \u003cspan class=\"eq\">(sI−A)\u003csup>−1\u003c/sup>\u003c/span>——对 \u003cspan class=\"eq\">2×2\u003c/span> 矩阵就是「主对角换位置、副对角变号、再除以行列式」，10 秒可写出来。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s95","title":"9.5 离散状态方程的求解","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">时域：迭代法（计算机最擅长）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q[k] = A\u003csup>k\u003c/sup>q[0] + \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k−1\u003c/span>\u003cspan class=\"l\">j=0\u003c/span>\u003c/span>\u003c/span>A\u003csup>k−1−j\u003c/sup>B x[j]，　y[k] = Cq[k] + Dx[k]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">给定 \u003cspan class=\"eq\">q[0]\u003c/span> 和输入序列，直接逐点递推 \u003cspan class=\"eq\">q[1], q[2], …\u003c/span>，\u003cb>不需要求闭式\u003c/b>。课件里就是用 k=0,1,2 逐次代入演示的。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">z 域解\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">zQ(z) − z q[0] = AQ(z) + BX(z) ⟹ Q(z) = (zI − A)\u003csup>−1\u003c/sup>[z q[0] + BX(z)]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z) = C(zI − A)\u003csup>−1\u003c/sup>z q[0] + [C(zI − A)\u003csup>−1\u003c/sup>B + D]X(z)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">同样地，\u003cspan class=\"eq\">H(z) = C(zI−A)\u003csup>−1\u003c/sup>B + D\u003c/span>，与第 8 章一致。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 9-5　迭代法求前几项（课件原题）\u003c/span>\u003cspan class=\"tag g\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">A = [[0, 1],[−1/6, 5/6]]\u003c/span>，\u003cspan class=\"eq\">B = [0, 1]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">C = [[−1, 5],[2, 0]]\u003c/span>，\u003cspan class=\"eq\">D = 0\u003c/span>，\u003cspan class=\"eq\">q[0] = [2, 3]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">x[k] = u[k]\u003c/span>。求 \u003cspan class=\"eq\">q[1]\u003c/span> 与 \u003cspan class=\"eq\">y[0], y[1]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>k=0 的输出：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[0] = C q[0] = [[−1,5],[2,0]]·[2,3]\u003csup>T\u003c/sup> = [−2+15, 4]\u003csup>T\u003c/sup> = [13, 4]\u003csup>T\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>递推一步：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q[1] = A q[0] + B x[0] = [3, (−2/6 + 15/6) + 1]\u003csup>T\u003c/sup> = [3, 13/6 + 1]\u003csup>T\u003c/sup> = [3, 19/6]\u003csup>T\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>k=1 的输出：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[1] = C q[1] = [−3 + 5·19/6, 6]\u003csup>T\u003c/sup> = [−3 + 95/6, 6]\u003csup>T\u003c/sup> = [77/6, 6]\u003csup>T\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>要点：\u003c/b>离散状态方程不需要任何变换，只要矩阵乘法 + 加法，\u003cb>天然适合编程\u003c/b>。课件给的 \u003cspan class=\"eq\">dlsim(A,B,C,D,x,q0)\u003c/span> 就是干这个的。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s96","title":"9.6 状态方程与系统函数、稳定性的关系","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:34%\">概念\u003c/th>\u003cth>连续\u003c/th>\u003cth>离散\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>系统函数\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(s) = C(sI−A)\u003csup>−1\u003c/sup>B + D\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(z) = C(zI−A)\u003csup>−1\u003c/sup>B + D\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>特征方程\u003c/td>\u003ctd>\u003cspan class=\"eq\">det(sI − A) = 0\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">det(zI − A) = 0\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>极点 = \u003c/td>\u003ctd colspan=\"2\">矩阵 \u003cspan class=\"eq\">A\u003c/span> 的\u003cb>特征值\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>稳定条件\u003c/td>\u003ctd>所有特征值实部 &lt; 0（左半平面）\u003c/td>\u003ctd>所有特征值模 &lt; 1（单位圆内）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"note\">\u003cb>这条表把全书串起来了：\u003c/b>第 2、3 章的「特征根」、第 7 章 \u003cspan class=\"eq\">H(s)\u003c/span> 的极点、第 8 章 \u003cspan class=\"eq\">H(z)\u003c/span> 的极点，到第 9 章统一成 \u003cb>A 矩阵的特征值\u003c/b>。同一个东西换了四种说法，本质都是「系统固有的那些衰减/振荡模式」。\n\u003c/div>"},{"id":"s97","title":"9.7 MATLAB 求解与考试要点","html":"\u003cdiv class=\"card\">\u003cp style=\"margin-top:0\">\u003cb>四个必记函数（课件原样）：\u003c/b>\u003c/p>\u003ctable style=\"margin:6px 0\">\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">sys = ss(A,B,C,D)\u003c/span>\u003c/td>\u003ctd>由状态空间矩阵建立系统模型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">[y, t, q] = lsim(sys, x, t, q0)\u003c/span>\u003c/td>\u003ctd>求\u003cb>连续\u003c/b>状态方程的数值解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">[y, q] = dlsim(A,B,C,D,x,q0)\u003c/span>\u003c/td>\u003ctd>求\u003cb>离散\u003c/b>状态方程的数值解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">[b, a] = ss2tf(A,B,C,D)\u003c/span>\u003c/td>\u003ctd>状态方程 ↔ 系统函数（传递函数）互转\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp style=\"margin-bottom:0\">课件示例：\u003cspan class=\"eq\">A=[2 3;0 -1]; B=[0 1;1 0]; C=[1 1;0 -1]; D=[1 0;1 0]; q0=[2 -1];\u003c/span> 再用 \u003cspan class=\"eq\">lsim\u003c/span> 画出 \u003cspan class=\"eq\">y₁(t), y₂(t)\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"tip\">\u003cb>本章应试清单：\u003c/b>① 会由 \u003cspan class=\"eq\">H(s)/H(z)\u003c/span> 画直接型框图并写出 \u003cspan class=\"eq\">A,B,C,D\u003c/span>（最常考）；② 会由电路选 \u003cspan class=\"eq\">u\u003csub>C\u003c/sub>, i\u003csub>L\u003c/sub>\u003c/span> 列方程；③ 会算 \u003cspan class=\"eq\">(sI−A)\u003csup>−1\u003c/sup>\u003c/span> 并求 \u003cspan class=\"eq\">e\u003csup>At\u003c/sup>\u003c/span>；④ 会用迭代法算离散系统的前几项；⑤ 知道「极点 = A 的特征值」，能用它判稳定。\n\u003c/div>\u003cdiv class=\"warn\">\u003cb>三个易错点：\u003c/b>① 状态变量个数选错（应为积分器/延时器个数，不是输入个数）；② 离散写成 \u003cspan class=\"eq\">q′\u003c/span> 而不是 \u003cspan class=\"eq\">q[k+1]\u003c/span>；③ 忘了输出方程里的 \u003cspan class=\"eq\">D\u003c/span> 直通项（当 \u003cspan class=\"eq\">w[k]\u003c/span> 里直接含 \u003cspan class=\"eq\">x[k]\u003c/span> 时 \u003cspan class=\"eq\">D ≠ 0\u003c/span>）。\n\u003c/div>\u003cdiv class=\"note\">\u003cb>全书总结：\u003c/b>信号可以拆成 δ（时域）、\u003cspan class=\"eq\">e\u003csup>jωt\u003c/sup>\u003c/span>（频域）、\u003cspan class=\"eq\">e\u003csup>st\u003c/sup>/z\u003csup>k\u003c/sup>\u003c/span>（复频域）；系统可以用微分方程、\u003cspan class=\"eq\">h\u003c/span>、\u003cspan class=\"eq\">H(jω)\u003c/span>、\u003cspan class=\"eq\">H(s)/H(z)\u003c/span>、\u003cspan class=\"eq\">A,B,C,D\u003c/span> 五种方式描述。\u003cb>换一种描述，就换一种更省力的算法——这就是这门课的全部内容。\u003c/b>\u003c/div>\u003c/section>"}]},{"n":10,"title":"MATLAB 与实验速查（CH0 ＋ 课件函数）","intro":"\u003cb>对应课件：\u003c/b>ch0MATLAB简介；L04/L06/L12/L15/L18/L19/L20/L23/L24/L26 中的 MATLAB 代码与实验提示。\u003cbr>\u003cb>为什么单列一章：\u003c/b>课件明确写了笔试卷里有 \u003cb>计算机题（20 分 / 2 题）与编程分析题（20 分 / 2 题）\u003c/b>，而且机试另占 50%。这一章把散落在 26 讲里的函数集中成速查表，方便考前突击。","sections":[{"id":"s101","title":"10.1 MATLAB 基础语法（CH0）","html":"\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>工作方式与帮助\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">命令窗口直接输入语句，或运行 \u003cspan class=\"eq\">.m\u003c/span> 文件；\u003cspan class=\"eq\">help plot\u003c/span> 查函数用法。变量无需声明类型，首字符必须是字母；\u003cspan class=\"eq\">pi, inf, NaN\u003c/span> 是预置常量。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>冒号运算符（最高频）\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">\u003cspan class=\"eq\">1:10\u003c/span> 产生 1～10；\u003cspan class=\"eq\">10:-2:1\u003c/span> 产生 10,8,6,4,2；\u003cspan class=\"eq\">linspace(0,2,11)\u003c/span> 在区间内均匀取 11 点。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>数组与下标\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">\u003cb>下标从 1 开始\u003c/b>；分号表示换行：\u003cspan class=\"eq\">z=[1 2; 3 4]\u003c/span>；\u003cspan class=\"eq\">size(A)\u003c/span> 返回行列数，\u003cspan class=\"eq\">length(x)\u003c/span> 返回长度；\u003cspan class=\"eq\">zeros, ones, rand, randn\u003c/span> 生成矩阵。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>点运算（最易错）\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">\u003cspan class=\"eq\">A*B\u003c/span> 是\u003cb>矩阵乘\u003c/b>，\u003cspan class=\"eq\">A.*B\u003c/span> 是\u003cb>对应元素相乘\u003c/b>；同理 \u003cspan class=\"eq\">./ .^\u003c/span>。画信号时几乎都要用点运算。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">运算符与常用函数速查\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:26%\">类别\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>算术\u003c/td>\u003ctd>\u003cspan class=\"eq\">+ − * / ^ '\u003c/span>（\u003cspan class=\"eq\">'\u003c/span> 是复共轭转置）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>逻辑 / 关系\u003c/td>\u003ctd>\u003cspan class=\"eq\">&amp; | ~\u003c/span>；\u003cspan class=\"eq\">&lt; &gt; &lt;= &gt;= == ~=\u003c/span>；0 为假，非 0 为真\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复数\u003c/td>\u003ctd>\u003cspan class=\"eq\">2+3j\u003c/span>；\u003cspan class=\"eq\">abs, angle, real, imag, conj\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>流程\u003c/td>\u003ctd>\u003cspan class=\"eq\">for n=1:100 … end\u003c/span>、\u003cspan class=\"eq\">while 条件 … end\u003c/span>、\u003cspan class=\"eq\">if … end\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>函数文件\u003c/td>\u003ctd>\u003cspan class=\"eq\">function y=tri(t)\u003c/span> 开头，文件名必须与函数名一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>绘图\u003c/td>\u003ctd>\u003cspan class=\"eq\">plot, stem, subplot, xlabel, ylabel, title, legend, grid, axis\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 10-1　用 MATLAB 画三角波（课件原题）\u003c/span>\u003cspan class=\"tag g\">编程题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>写出产生 \u003cspan class=\"eq\">y = (1−|t|)·[|t| ≤ 1]\u003c/span> 的函数并画图。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">function y = tri(t)\u003cbr>\ny = (t&gt;=-1 &amp; t&lt;=1).*(1-abs(t));\u003cbr>\u003cbr>\nt = -2:0.05:2;\u003cbr>\nplot(t, tri(t)); grid on;\u003c/span>\u003c/div>\u003cp>\u003cb>两个关键点：\u003c/b>① \u003cspan class=\"eq\">(t&gt;=-1 &amp; t&lt;=1)\u003c/span> 是逻辑数组（0/1），用它做「门控」；② 必须用 \u003cspan class=\"eq\">.*\u003c/span> 逐点相乘，用 \u003cspan class=\"eq\">*\u003c/span> 会报矩阵维数错误。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s102","title":"10.2 信号与系统函数总表（全书汇总）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:30%\">用途\u003c/th>\u003cth style=\"width:34%\">函数\u003c/th>\u003cth>说明 / 出处\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>产生基本信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">rectpuls(t,width)\u003c/span>\u003c/td>\u003ctd>矩形脉冲，width 缺省 1（L04）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">tripuls(t,width,skew)\u003c/span>\u003c/td>\u003ctd>三角脉冲，skew ∈ [−1,1]（L04）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">sinc(x)\u003c/span>\u003c/td>\u003ctd>\u003cb>注意定义为 sin(πx)/(πx)\u003c/b>，与课程 Sa(x)=sin x/x 差一个 π（L02）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">square, sawtooth\u003c/span>\u003c/td>\u003ctd>周期方波 / 锯齿波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">conv(x,h)\u003c/span>\u003c/td>\u003ctd>结果长度 \u003cspan class=\"eq\">L₁+L₂−1\u003c/span>；下标要自己补：\u003cspan class=\"eq\">k = kx(1)+kh(1) : kx(end)+kh(end)\u003c/span>（L08）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>微分方程\u003c/td>\u003ctd>\u003cspan class=\"eq\">lsim(sys,x,t)\u003c/span>\u003c/td>\u003ctd>求任意输入下的响应（L06/L15）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">impulse(b,a)\u003c/span>、\u003cspan class=\"eq\">step(b,a)\u003c/span>\u003c/td>\u003ctd>冲激响应 / 阶跃响应（L06）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">tf(b,a)\u003c/span>\u003c/td>\u003ctd>由分子分母系数建传递函数模型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域\u003c/td>\u003ctd>\u003cspan class=\"eq\">freqs(b,a,w)\u003c/span>\u003c/td>\u003ctd>连续系统频率响应 \u003cspan class=\"eq\">H(jω)\u003c/span>（L15/L20）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">freqz(b,a,W)\u003c/span>\u003c/td>\u003ctd>离散系统频率响应 \u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>)\u003c/span>（L24）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">fft / ifft\u003c/span>\u003c/td>\u003ctd>DFT / IDFT；补零只减小栅栏效应，不提高物理分辨率\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复频域\u003c/td>\u003ctd>\u003cspan class=\"eq\">residue(num,den)\u003c/span>\u003c/td>\u003ctd>拉氏反变换的部分分式：\u003cspan class=\"eq\">[r,p,k]\u003c/span>（L19）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">residuez(num,den)\u003c/span>\u003c/td>\u003ctd>z 反变换的部分分式（按 \u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>\u003c/span> 展开）（L23）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">laplace / ilaplace\u003c/span>\u003c/td>\u003ctd>符号工具箱的拉氏正/反变换\u003c/td>\u003c/tr>\u003ctr>\u003ctd>状态空间\u003c/td>\u003ctd>\u003cspan class=\"eq\">ss(A,B,C,D)\u003c/span>\u003c/td>\u003ctd>建立状态空间模型（L26）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">lsim(sys,x,t,q0)\u003c/span>\u003c/td>\u003ctd>连续状态方程数值解，返回 \u003cspan class=\"eq\">[y,t,q]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">dlsim(A,B,C,D,x,q0)\u003c/span>\u003c/td>\u003ctd>离散状态方程数值解，返回 \u003cspan class=\"eq\">[y,q]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多项式 / 方程\u003c/td>\u003ctd>\u003cspan class=\"eq\">roots(a)\u003c/span>\u003c/td>\u003ctd>求多项式根（求特征根、零极点）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数值积分\u003c/td>\u003ctd>\u003cspan class=\"eq\">integral(@(x)f(x),a,b)\u003c/span>\u003c/td>\u003ctd>求傅里叶变换的数值近似（L12）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 10-1　按「用途」记函数，比按字母背高效得多\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 10-2　用 freqs 画三阶 Butterworth 低通（课件原题）\u003c/span>\u003cspan class=\"tag\">编程分析题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>画出 \u003cspan class=\"eq\">H(s)=1/(s³+2s²+2s+1)\u003c/span> 的幅度响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">w = linspace(0,5,1001);\u003cbr>\nb = [1];  a = [1 2 2 1];\u003cbr>\nH = freqs(b,a,w);\u003cbr>\nplot(w, abs(H)); grid on;\u003cbr>\nset(gca,'ytick',[0 0.4 0.707 1]);\u003cbr>\ntitle('3阶 Butterworth 幅度响应'); xlabel('\\omega');\u003c/span>\u003c/div>\u003cp>\u003cb>系数怎么来：\u003c/b>\u003cspan class=\"eq\">a\u003c/span> 按 \u003cspan class=\"eq\">s\u003c/span> 的降幂排列，缺项补 0；\u003cspan class=\"eq\">b\u003c/span> 是分子。\u003cspan class=\"eq\">|H(0)|=1\u003c/span>，\u003cspan class=\"eq\">|H(1)|=1/√2≈0.707\u003c/span>，正是 3 dB 截频 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>=1\u003c/span>（归一化 Butterworth 的定义）。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 10-3　用 lsim 求微分方程响应（课件原题）\u003c/span>\u003cspan class=\"tag\">编程分析题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y″+3y′+2y = 3x+2x′，t ≥ 0\u003c/span>，用 lsim 求零状态响应并与理论解比较。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">sys = tf([2 3],[1 3 2]);\u003cbr>\ndt = 0.01;  t = 0:dt:10;\u003cbr>\nx = exp(-t);                 % 也可换成 u(t)、sin(t)\u003cbr>\ny = lsim(sys, x, t);\u003cbr>\nplot(t,y); grid on;\u003cbr>\nhold on; h = impulse(sys,t); % 冲激响应对照\u003c/span>\u003c/div>\u003cp>\u003cb>时域理论解（对照用）：\u003c/b>由例 7-6 \u003cspan class=\"eq\">h(t)=(e\u003csup>−t\u003c/sup>+e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>，\u003cspan class=\"eq\">x=e\u003csup>−t\u003c/sup>u(t)\u003c/span> 时 \u003cspan class=\"eq\">H(s)=(2s+3)/[(s+1)(s+2)]\u003c/span>，\u003cspan class=\"eq\">X(s)=1/(s+1)\u003c/span>，故 \u003cspan class=\"eq\">Y(s)=(2s+3)/[(s+1)²(s+2)]\u003c/span>，部分分式展开后反变换即可与曲线比对。\u003c/p>\u003cdiv class=\"tip\">\u003cb>答题套路：\u003c/b>先写理论解（s 域），再写代码，最后说「两条曲线重合，验证正确」——课件里 L06/L15 的实验都是这个结构，编程分析题按这个写不会跑偏。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s103","title":"10.3 机试 / 编程题常见扣分点","html":"\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>1. 下标从 1 开始\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">x(0)\u003c/span> 非法；序列 \u003cspan class=\"eq\">k=−2:2\u003c/span> 要用单独的索引向量，别指望 MATLAB 自动记负下标。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>2. conv 不给下标\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">conv\u003c/span> 只返回数值数组，画图必须自己构造 \u003cspan class=\"eq\">k = kx(1)+kh(1) : kx(end)+kh(end)\u003c/span> 并配 \u003cspan class=\"eq\">stem\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>3. sinc 定义不同\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">MATLAB 的 \u003cspan class=\"eq\">sinc(x)=sin(πx)/(πx)\u003c/span>，课程的 \u003cspan class=\"eq\">Sa(x)=sin x/x\u003c/span>，换算关系是 \u003cspan class=\"eq\">Sa(x)=sinc(x/π)\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>4. 漏掉点运算\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">t.*exp(-t)\u003c/span> 不能写成 \u003cspan class=\"eq\">t*exp(-t)\u003c/span>；画频谱、产生信号时必查。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>5. 采样与补零\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">补零只让谱线更密（减小栅栏效应），\u003cb>不提高物理频率分辨率\u003c/b>；分辨率由有效数据时长决定 \u003cspan class=\"eq\">Δf≈1/T₀\u003c/span>（L15 复习题）。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>6. 矩阵维度\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">lsim\u003c/span> 的多输入要写成 \u003cspan class=\"eq\">x(:,k)\u003c/span> 各列；\u003cspan class=\"eq\">q0\u003c/span> 是列向量。维度不匹配会直接报错。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>课件里的考试信息（L15 p2 原文）：\u003c/b>题型为判定题（10 分）、选择题（30 分）、填空题（20 分）、计算机题（20 分，2 题）、编程分析题（20 分，2 题）；时间 2 小时，90 分钟后才允许交卷。\u003cb>注意：这份讲义只覆盖其中「信号与系统」部分\u003c/b>，课件复习提问里还混有 EDA、STM32、X-CUBE-AI、数据库、Simulink 等其他课程题目，那些不在本讲义范围内。\n\u003c/div>\u003c/section>"}]},{"n":11,"title":"应试冲刺与自测","intro":"\u003cb>对应课件：\u003c/b>全书复习与课件「复习提问」精选\u003cbr>\u003cb>这一章是“考前急救包”。\u003c/b>前面十章讲“为什么”，这一章只讲“怎么拿分”。\u003cbr>\n建议用法：先看 6.1 的考点清单，对照自己的薄弱环节回到对应章节；再做 6.3、6.4 两套自测卷（答案在每题下方，先做完再看）。","sections":[{"id":"s111","title":"11.1 高频考点清单","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:16%\">题型\u003c/th>\u003cth style=\"width:12%\">分值\u003c/th>\u003cth style=\"width:36%\">常考内容\u003c/th>\u003cth>必做动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>选择/填空\u003c/td>\u003ctd>15～20\u003c/td>\u003ctd>δ 抽样性、系统性质、能量功率、变换对、抽样率\u003c/td>\u003ctd>背表 0-1、0-2；δ 题先看积分区间\u003c/td>\u003c/tr>\u003ctr>\u003ctd>画图题\u003c/td>\u003ctd>5～8\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(at+b)\u003c/span>、卷积波形、频谱草图\u003c/td>\u003ctd>抓关键点，解方程定新位置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>微分方程求解\u003c/td>\u003ctd>12～15\u003c/td>\u003ctd>完全响应、零输入/零状态、冲激响应\u003c/td>\u003ctd>四步法：特征根→齐次解→特解→定常数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>卷积计算\u003c/td>\u003ctd>10～12\u003c/td>\u003ctd>指数卷积、矩形卷积、分段讨论\u003c/td>\u003ctd>先定重叠区间，再积分；用公式验算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>差分方程\u003c/td>\u003ctd>10～12\u003c/td>\u003ctd>迭代、h[k]、卷积和\u003c/td>\u003ctd>列表法/竖式乘法，长度 \u003cspan class=\"eq\">L₁+L₂−1\u003c/span> 自查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>傅里叶级数\u003c/td>\u003ctd>12～15\u003c/td>\u003ctd>求 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>、画频谱、帕塞瓦尔求功率\u003c/td>\u003ctd>先求 \u003cspan class=\"eq\">ω₀\u003c/span>，用对称性化简\u003c/td>\u003c/tr>\u003ctr>\u003ctd>傅里叶变换\u003c/td>\u003ctd>12～18\u003c/td>\u003ctd>常用变换对、性质、调制、抽样定理\u003c/td>\u003ctd>能拆就拆，能套就套，别硬积\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"},{"id":"s112","title":"11.2 十大易错点（阅卷老师最爱扣分的地方）","html":"\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>1. δ 的积分区间没看\u003c/b>\u003cbr>\u003cspan class=\"eq\">∫\u003csub>−1\u003c/sub>\u003csup>1\u003c/sup>f(t)δ(t−2)dt = 0\u003c/span>，不是 \u003cspan class=\"eq\">f(2)\u003c/span>。冲激点不在区间内，答案就是 0。\u003c/div>\u003cdiv class=\"card\">\u003cb>2. δ(at) 忘了 1/|a|\u003c/b>\u003cbr>\u003cspan class=\"eq\">δ(2t)=½δ(t)\u003c/span>。负号被绝对值吃掉，\u003cspan class=\"eq\">δ(−3t)=⅓δ(t)\u003c/span>。\u003c/div>\u003cdiv class=\"card\">\u003cb>3. 特解撞根没乘 t\u003c/b>\u003cbr>激励指数等于特征根时，必须设 \u003cspan class=\"eq\">Ate\u003csup>at\u003c/sup>\u003c/span>，否则代进去得 0 = 激励，无解。\u003c/div>\u003cdiv class=\"card\">\u003cb>4. 初始条件代错地方\u003c/b>\u003cbr>零输入响应代 \u003cspan class=\"eq\">y(0⁻)\u003c/span>；离散代 \u003cspan class=\"eq\">y[−1], y[−2]\u003c/span>，不是 \u003cspan class=\"eq\">y[0], y[1]\u003c/span>。\u003c/div>\u003cdiv class=\"card\">\u003cb>5. 卷积漏写 u(t)\u003c/b>\u003cbr>结果是 \u003cspan class=\"eq\">6(e\u003csup>−t\u003c/sup>−e\u003csup>−2t\u003c/sup>)\u003c/span> 只在 \u003cspan class=\"eq\">t&gt;0\u003c/span> 成立，必须乘 \u003cspan class=\"eq\">u(t)\u003c/span>，否则整段扣分。\u003c/div>\u003cdiv class=\"card\">\u003cb>6. 卷积分段分界点错\u003c/b>\u003cbr>分界点由两个信号的左右边界决定，不是凭感觉。画一条时间轴标出 \u003cspan class=\"eq\">0, τ₁, τ₂, τ₁+τ₂\u003c/span>。\u003c/div>\u003cdiv class=\"card\">\u003cb>7. u(t) 的频谱漏 πδ(ω)\u003c/b>\u003cbr>\u003cspan class=\"eq\">u(t)⟷πδ(ω)+1/(jω)\u003c/span>，只写 \u003cspan class=\"eq\">1/(jω)\u003c/span> 是最常见的错误。\u003c/div>\u003cdiv class=\"card\">\u003cb>8. 抽样率忘记乘 2\u003c/b>\u003cbr>奈奎斯特速率是 \u003cspan class=\"eq\">2f\u003csub>m\u003c/sub>\u003c/span>；\u003cspan class=\"eq\">Sa\u003c/span> 的带宽是 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>\u003c/span>，换算成 Hz 要除以 \u003cspan class=\"eq\">2π\u003c/span>。\u003c/div>\u003cdiv class=\"card\">\u003cb>9. 平方信号的带宽没翻倍\u003c/b>\u003cbr>\u003cspan class=\"eq\">Sa²(ω\u003csub>c\u003c/sub>t)\u003c/span> 的带宽是 \u003cspan class=\"eq\">2ω\u003csub>c\u003c/sub>\u003c/span>，因为时域平方 = 频域卷积。\u003c/div>\u003cdiv class=\"card\">\u003cb>10. 结果不验算\u003c/b>\u003cbr>代 \u003cspan class=\"eq\">t=0\u003c/span> 看初值、看 \u003cspan class=\"eq\">t→∞\u003c/span> 是否收敛、卷积看长度和总和。10 秒能救回 10 分。\u003c/div>\u003c/div>"},{"id":"s113","title":"11.3 自测卷 A（选择 + 填空）","html":"\u003cp class=\"lead\">限时 20 分钟。做完再展开答案，错题回到对应小节。\u003c/p>\u003ch4>一、选择题\u003c/h4>\u003cdiv class=\"qs\">\u003cdiv class=\"q\">下列信号中属于\u003cb>能量信号\u003c/b>的是（　）\u003cbr>\nA. \u003cspan class=\"eq\">u(t)\u003c/span>　B. \u003cspan class=\"eq\">sin 2t\u003c/span>　C. \u003cspan class=\"eq\">e\u003csup>−3t\u003c/sup>u(t)\u003c/span>　D. \u003cspan class=\"eq\">t·u(t)\u003c/span>\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">δ(2t − 4)\u003c/span> 等于（　）\u003cbr>\nA. \u003cspan class=\"eq\">δ(t−2)\u003c/span>　B. \u003cspan class=\"eq\">½δ(t−2)\u003c/span>　C. \u003cspan class=\"eq\">2δ(t−2)\u003c/span>　D. \u003cspan class=\"eq\">½δ(t−4)\u003c/span>\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">∫\u003csub>−1\u003c/sub>\u003csup>3\u003c/sup>(t² + 1)δ(t − 2)dt\u003c/span> 等于（　）\u003cbr>\nA. 0　B. 5　C. 17　D. 1\u003c/div>\u003cdiv class=\"q\">下列系统中属于\u003cb>时变系统\u003c/b>的是（　）\u003cbr>\nA. \u003cspan class=\"eq\">y(t)=x(t−1)\u003c/span>　B. \u003cspan class=\"eq\">y(t)=x(2t)\u003c/span>　C. \u003cspan class=\"eq\">y(t)=2x(t)\u003c/span>　D. \u003cspan class=\"eq\">y(t)=x(t)+x(t−1)\u003c/span>\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">u(t) ∗ u(t)\u003c/span> 等于（　）\u003cbr>\nA. \u003cspan class=\"eq\">u(t)\u003c/span>　B. \u003cspan class=\"eq\">t·u(t)\u003c/span>　C. \u003cspan class=\"eq\">t²u(t)\u003c/span>　D. \u003cspan class=\"eq\">δ(t)\u003c/span>\u003c/div>\u003cdiv class=\"q\">周期信号 \u003cspan class=\"eq\">x(t) = 1 + 2cos ω₀t + 3sin 2ω₀t\u003c/span> 的平均功率为（　）\u003cbr>\nA. 6　B. 7.5　C. 14　D. 36\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">F[δ(t − 2)]\u003c/span> 等于（　）\u003cbr>\nA. 1　B. \u003cspan class=\"eq\">e\u003csup>−j2ω\u003c/sup>\u003c/span>　C. \u003cspan class=\"eq\">e\u003csup>j2ω\u003c/sup>\u003c/span>　D. \u003cspan class=\"eq\">2πe\u003csup>−j2ω\u003c/sup>\u003c/span>\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">F[e\u003csup>j3t\u003c/sup>]\u003c/span> 等于（　）\u003cbr>\nA. \u003cspan class=\"eq\">2πδ(ω−3)\u003c/span>　B. \u003cspan class=\"eq\">δ(ω−3)\u003c/span>　C. \u003cspan class=\"eq\">2πδ(ω+3)\u003c/span>　D. \u003cspan class=\"eq\">1/(j(ω−3))\u003c/span>\u003c/div>\u003cdiv class=\"q\">某信号最高频率为 4 kHz，则奈奎斯特抽样速率为（　）\u003cbr>\nA. 2 kHz　B. 4 kHz　C. 8 kHz　D. 16 kHz\u003c/div>\u003cdiv class=\"q\">系统 \u003cspan class=\"eq\">h(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span> 是（　）\u003cbr>\nA. 不稳定　B. 稳定　C. 临界稳定　D. 无法判断\u003c/div>\u003c/div>\u003cdetails class=\"sol\">\u003csummary>查看选择题答案与解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>1. C\u003c/b>\u003cspan class=\"eq\">E = ∫\u003csub>0\u003c/sub>\u003csup>∞\u003c/sup>e\u003csup>−6t\u003c/sup>dt = 1/6 &lt; ∞\u003c/span>。A、B 是功率信号，D 既非能量也非功率。\u003c/p>\u003cp>\u003cb>2. B\u003c/b>\u003cspan class=\"eq\">δ(2t−4) = δ(2(t−2)) = ½δ(t−2)\u003c/span>。套 \u003cspan class=\"eq\">δ(at)=δ(t)/|a|\u003c/span>。\u003c/p>\u003cp>\u003cb>3. B\u003c/b>\u003cspan class=\"eq\">t=2\u003c/span> 在 \u003cspan class=\"eq\">[−1,3]\u003c/span> 内，代值得 \u003cspan class=\"eq\">4+1=5\u003c/span>。\u003c/p>\u003cp>\u003cb>4. B\u003c/b>　时间被压缩，延迟量对不上，是时变系统；而且 \u003cspan class=\"eq\">t=1\u003c/span> 时要用 \u003cspan class=\"eq\">x(2)\u003c/span>，还是非因果的。\u003c/p>\u003cp>\u003cb>5. B\u003c/b>\u003cspan class=\"eq\">u∗u = (k+1)\u003c/span> 的连续版本，即 \u003cspan class=\"eq\">t·u(t)\u003c/span>。\u003c/p>\u003cp>\u003cb>6. B\u003c/b>\u003cspan class=\"eq\">P = 1² + 2²/2 + 3²/2 = 1+2+4.5 = 7.5\u003c/span>。注意正弦余弦的功率是 \u003cspan class=\"eq\">A²/2\u003c/span>。\u003c/p>\u003cp>\u003cb>7. B\u003c/b>　时移性质：\u003cspan class=\"eq\">δ(t−2) ⟷ e\u003csup>−j2ω\u003c/sup>·1\u003c/span>。\u003c/p>\u003cp>\u003cb>8. A\u003c/b>\u003cspan class=\"eq\">e\u003csup>jω₀t\u003c/sup> ⟷ 2πδ(ω−ω₀)\u003c/span>，这里 \u003cspan class=\"eq\">ω₀=3\u003c/span>。\u003c/p>\u003cp>\u003cb>9. C\u003c/b>\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>m\u003c/sub> = 8\u003c/span> kHz。\u003c/p>\u003cp>\u003cb>10. B\u003c/b>\u003cspan class=\"eq\">∫\u003csub>0\u003c/sub>\u003csup>∞\u003c/sup>|h|dt = 1/2 &lt; ∞\u003c/span>，绝对可积，系统稳定。\u003c/p>\u003c/div>\u003c/details>\u003ch4>二、填空题\u003c/h4>\u003cdiv class=\"qs\">\u003cdiv class=\"q\">\u003cspan class=\"eq\">δ(t)\u003c/span> 与 \u003cspan class=\"eq\">u(t)\u003c/span> 的关系：\u003cspan class=\"eq\">δ(t) =\u003c/span> ______。\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">x(t) ∗ δ(t − t₀) =\u003c/span> ______。\u003c/div>\u003cdiv class=\"q\">方程 \u003cspan class=\"eq\">y″ + 5y′ + 6y = 0\u003c/span> 的通解为 ______。\u003c/div>\u003cdiv class=\"q\">特征根为 \u003cspan class=\"eq\">−1 ± j2\u003c/span> 时，齐次解的形式为 ______。\u003c/div>\u003cdiv class=\"q\">\u003cspan class=\"eq\">F[1] =\u003c/span> ______。\u003c/div>\u003cdiv class=\"q\">周期矩形脉冲（幅度 1、脉宽 \u003cspan class=\"eq\">τ\u003c/span>、周期 \u003cspan class=\"eq\">T₀\u003c/span>）的傅里叶系数 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub> =\u003c/span> ______。\u003c/div>\u003c/div>\u003cdetails class=\"sol\">\u003csummary>查看填空题答案\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>1.\u003c/b>\u003cspan class=\"eq\">du(t)/dt\u003c/span>（阶跃的导数）\u003c/p>\u003cp>\u003cb>2.\u003c/b>\u003cspan class=\"eq\">x(t − t₀)\u003c/span>（卷积 δ 等于平移）\u003c/p>\u003cp>\u003cb>3.\u003c/b>\u003cspan class=\"eq\">y = K₁e\u003csup>−2t\u003c/sup> + K₂e\u003csup>−3t\u003c/sup>\u003c/span>（根为 −2、−3）\u003c/p>\u003cp>\u003cb>4.\u003c/b>\u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>(A cos 2t + B sin 2t)\u003c/span>\u003c/p>\u003cp>\u003cb>5.\u003c/b>\u003cspan class=\"eq\">2πδ(ω)\u003c/span>\u003c/p>\u003cp>\u003cb>6.\u003c/b>\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = (τ/T₀)·Sa(nω₀τ/2)\u003c/span>，其中 \u003cspan class=\"eq\">ω₀ = 2π/T₀\u003c/span>\u003c/p>\u003c/div>\u003c/details>"},{"id":"s114","title":"11.4 自测卷 B（六道大题）","html":"\u003cp class=\"lead\">限时 90 分钟。每题先自己在纸上写完整过程，再对照解析。解析里标出了“步骤分”在哪里。\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>B-1　一阶系统完全响应（12 分）\u003c/span>\u003cspan class=\"tag\">基础大题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知系统 \u003cspan class=\"eq\">y′(t) + 2y(t) = x(t)\u003c/span>，初始条件 \u003cspan class=\"eq\">y(0) = 2\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>。用经典法求完全响应 \u003cspan class=\"eq\">y(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>① 齐次解（3 分）：\u003c/b>特征方程 \u003cspan class=\"eq\">s + 2 = 0 → s = −2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>h\u003c/sub> = Ke\u003csup>−2t\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>② 特解（4 分）：\u003c/b>设 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = Ce\u003csup>−t\u003c/sup>\u003c/span>，代入：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">−Ce\u003csup>−t\u003c/sup> + 2Ce\u003csup>−t\u003c/sup> = Ce\u003csup>−t\u003c/sup> = e\u003csup>−t\u003c/sup> ⟹ C = 1\u003c/span>\u003c/div>\u003cp>\u003cb>③ 定常数（4 分）：\u003c/b>\u003cspan class=\"eq\">y(0) = K + 1 = 2 ⟹ K = 1\u003c/span>。\u003c/p>\u003cp>\u003cb>④ 结果（1 分）：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = (e\u003csup>−t\u003c/sup> + e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y(0)=2\u003c/span> ✓；代回：\u003cspan class=\"eq\">y′+2y = (−e\u003csup>−t\u003c/sup>−2e\u003csup>−2t\u003c/sup>) + 2(e\u003csup>−t\u003c/sup>+e\u003csup>−2t\u003c/sup>) = e\u003csup>−t\u003c/sup>\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>步骤分提示：\u003c/b>即使特解算错，只要齐次解形式和“代初值”的动作写出来，12 分里至少能拿 7 分。\u003cb>千万不要只写一个答案。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>B-2　求冲激响应（12 分）\u003c/span>\u003cspan class=\"tag\">高频\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>系统方程 \u003cspan class=\"eq\">y″(t) + 5y′(t) + 6y(t) = x′(t) + 2x(t)\u003c/span>，求冲激响应 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>① 先求“右端只有 x”的 h₁（5 分）。\u003c/b>特征根 \u003cspan class=\"eq\">−2, −3\u003c/span>，设 \u003cspan class=\"eq\">h₁ = (C₁e\u003csup>−2t\u003c/sup> + C₂e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>。由 \u003cspan class=\"eq\">h₁(0⁺)=0，h₁′(0⁺)=1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C₁ + C₂ = 0，　−2C₁ − 3C₂ = 1 ⟹ C₁ = 1，C₂ = −1\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h₁(t) = (e\u003csup>−2t\u003c/sup> − e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>② 用线性组合求 h（5 分）。\u003c/b>右端是 \u003cspan class=\"eq\">x′ + 2x\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h = h₁′ + 2h₁\u003c/span>\u003c/div>\u003cp>先求导（注意 \u003cspan class=\"eq\">t=0\u003c/span> 处系数为 0，不产生 δ 项）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h₁′ = (−2e\u003csup>−2t\u003c/sup> + 3e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>代入：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h = [(−2+2)e\u003csup>−2t\u003c/sup> + (3−2)e\u003csup>−3t\u003c/sup>]u(t) = e\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>③ 验算（2 分）。\u003c/b>\u003cspan class=\"eq\">h = e\u003csup>−3t\u003c/sup>u\u003c/span>，\u003cspan class=\"eq\">h′ = −3e\u003csup>−3t\u003c/sup>u + δ\u003c/span>，\u003cspan class=\"eq\">h″ = 9e\u003csup>−3t\u003c/sup>u − 3δ + δ′\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h″ + 5h′ + 6h = δ′ + (−3+5)δ + (9−15+6)e\u003csup>−3t\u003c/sup>u = δ′ + 2δ\u003c/span>\u003c/div>\u003cp>正好等于 \u003cspan class=\"eq\">x′ + 2x\u003c/span> 在 \u003cspan class=\"eq\">x=δ\u003c/span> 时的值 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>很多人直接设 \u003cspan class=\"eq\">h = Ae\u003csup>−2t\u003c/sup> + Be\u003csup>−3t\u003c/sup>\u003c/span>，忽略了右端的 \u003cspan class=\"eq\">x′\u003c/span>。只要右端最高阶导数与左端同阶，h 里就可能出现 \u003cspan class=\"eq\">δ\u003c/span> 项，必须先判断。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>B-3　离散系统全响应（12 分）\u003c/span>\u003cspan class=\"tag\">高频\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">y[k] − 0.5y[k−1] = x[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 1\u003c/span>，\u003cspan class=\"eq\">x[k] = u[k]\u003c/span>。求全响应 \u003cspan class=\"eq\">y[k]\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>① 零输入响应（4 分）。\u003c/b>特征根 \u003cspan class=\"eq\">s = 0.5\u003c/span>，设 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> = C(0.5)\u003csup>k\u003c/sup>\u003c/span>。由 \u003cspan class=\"eq\">y[−1] = 1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C(0.5)\u003csup>−1\u003c/sup> = 2C = 1 ⟹ C = 0.5\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = 0.5(0.5)\u003csup>k\u003c/sup> = (0.5)\u003csup>k+1\u003c/sup>，k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>② 冲激响应（3 分）。\u003c/b>由 \u003cspan class=\"eq\">h[k] − 0.5h[k−1] = δ[k]\u003c/span>，得 \u003cspan class=\"eq\">h[0]=1\u003c/span>，故：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = (0.5)\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>③ 零状态响应（3 分）。\u003c/b>用等比数列求和：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>(0.5)\u003csup>n\u003c/sup> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − (0.5)\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 − 0.5\u003c/span>\u003c/span> = 2 − (0.5)\u003csup>k\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>④ 相加（2 分）。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = (0.5)\u003csup>k+1\u003c/sup> + 2 − (0.5)\u003csup>k\u003c/sup> = 2 − (0.5)\u003csup>k+1\u003c/sup>，k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y[0] = 1.5\u003c/span>、\u003cspan class=\"eq\">y[1] = 1.75\u003c/span>、\u003cspan class=\"eq\">y[2] = 1.875\u003c/span>，与例 3-1 的迭代结果完全一致 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>最易混淆的一点：\u003c/b>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k] ∗ a\u003csup>k\u003c/sup>u[k] = (k+1)a\u003csup>k\u003c/sup>u[k]\u003c/span>，但 \u003cspan class=\"eq\">u[k] ∗ a\u003csup>k\u003c/sup>u[k] = (1−a\u003csup>k+1\u003c/sup>)/(1−a)\u003c/span>。\u003cb>前者是两个指数序列相卷，后者是阶跃与指数相卷\u003c/b>，公式完全不同。记混了就会像上面那样，k=1 时算出 1.25 而不是 1.75。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>B-4　周期方波的频谱（15 分）\u003c/span>\u003cspan class=\"tag\">频域大题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>周期 \u003cspan class=\"eq\">T₀ = 2\u003c/span> 的方波：\u003cspan class=\"eq\">0 &lt; t &lt; 1\u003c/span> 时为 1，\u003cspan class=\"eq\">1 &lt; t &lt; 2\u003c/span> 时为 0。求：(1) 傅里叶系数 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>；(2) 前三次谐波表达式；(3) 平均功率。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>(1) 求系数（7 分）。\u003c/b>\u003cspan class=\"eq\">ω₀ = 2π/T₀ = π\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">1\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−jnπt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − e\u003csup>−jnπ\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jnπ\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cul>\u003cli>\u003cspan class=\"eq\">n = 0\u003c/span>：\u003cspan class=\"eq\">C₀ = ½\u003c/span>（占空比，也就是平均值）；\u003c/li>\u003cli>\u003cspan class=\"eq\">n\u003c/span> 为偶数：\u003cspan class=\"eq\">e\u003csup>−jnπ\u003c/sup> = 1\u003c/span>，\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = 0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">n\u003c/span> 为奇数：\u003cspan class=\"eq\">e\u003csup>−jnπ\u003c/sup> = −1\u003c/span>，\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = 1/(jnπ) = −j/(nπ)\u003c/span>。\u003c/li>\u003c/ul>\u003cp>\u003cb>(2) 前三次谐波（5 分）。\u003c/b>把共轭对合成实信号：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>e\u003csup>jnπt\u003c/sup> + C\u003csub>−n\u003c/sub>e\u003csup>−jnπt\u003c/sup> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">nπ\u003c/span>\u003c/span>sin(nπt)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">π\u003c/span>\u003c/span>sin πt + \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">3π\u003c/span>\u003c/span>sin 3πt + \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">5π\u003c/span>\u003c/span>sin 5πt + …\u003c/span>\u003c/div>\u003cp>幅度按 \u003cspan class=\"eq\">1/n\u003c/span> 衰减，只有奇次项——这是“半波对称”信号的典型特征。\u003c/p>\u003cp>\u003cb>(3) 平均功率（3 分）。\u003c/b>用帕塞瓦尔：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = Σ|C\u003csub>n\u003c/sub>|² = (½)² + 2Σ\u003csub>n 奇\u003c/sub>\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">n²π²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>而 \u003cspan class=\"eq\">Σ\u003csub>n 奇\u003c/sub>1/n² = π²/8\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = ¼ + 2·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">π²\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">π²\u003c/span>\u003cspan class=\"fd\">8\u003c/span>\u003c/span> = ¼ + ¼ = ½\u003c/span>\u003c/div>\u003cp>\u003cb>时域验证：\u003c/b>方波一半时间为 1、一半为 0，平均功率 = \u003cspan class=\"eq\">(1²×1 + 0²×1)/2 = ½\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>结论：\u003c/b>占空比 50% 的 0/1 方波，平均功率恒为 ½，与周期无关。这个结论可以直接用来检查答案。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>B-5　傅里叶变换计算（12 分）\u003c/span>\u003cspan class=\"tag\">计算题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求下列信号的傅里叶变换：(1) \u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup>u(t)\u003c/span>；(2) \u003cspan class=\"eq\">e\u003csup>−2|t|\u003c/sup>\u003c/span>；(3) \u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup>u(t) · cos 3t\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>(1)（3 分）\u003c/b>直接积分：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X₁(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>(2)（4 分）\u003c/b>拆成左右两半，或用偶函数性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X₂(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">0\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>e\u003csup>2t\u003c/sup>e\u003csup>−jωt\u003c/sup>dt + \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2−jω\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2+jω\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">4 + ω²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>是实偶函数，相位为 0。\u003c/p>\u003cp>\u003cb>(3)（5 分）\u003c/b>用调制性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X₃(jω) = ½[X₁(j(ω−3)) + X₁(j(ω+3))]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>[\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + j(ω−3)\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + j(ω+3)\u003c/span>\u003c/span>]\u003c/span>\u003c/div>\u003cp>\u003cb>对比记忆：\u003c/b>(1) 是“单边”指数，频谱是复数、相位非零；(2) 是“双边”偶对称指数，频谱是实数、相位为零。\u003cb>时域的对称性，直接决定了频域是实还是复。\u003c/b>\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>B-6　卷积与分段（15 分）\u003c/span>\u003cspan class=\"tag\">压轴\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>设 \u003cspan class=\"eq\">x(t) = u(t) − u(t−1)\u003c/span>，\u003cspan class=\"eq\">h(t) = u(t) − u(t−2)\u003c/span>。求 \u003cspan class=\"eq\">y = x ∗ h\u003c/span>，并画出波形。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>① 定重叠区间（5 分）。\u003c/b>\u003cspan class=\"eq\">x\u003c/span> 在 \u003cspan class=\"eq\">[0,1]\u003c/span> 非零，\u003cspan class=\"eq\">h(t−τ)\u003c/span> 在 \u003cspan class=\"eq\">t−2 &lt; τ &lt; t\u003c/span> 非零。两者重叠要求：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">max(0, t−2) &lt; τ &lt; min(1, t)\u003c/span>\u003c/div>\u003cp>由此定出分界点 \u003cspan class=\"eq\">t = 0, 1, 2, 3\u003c/span>，共四段。\u003c/p>\u003cp>\u003cb>② 分段积分（6 分）。\u003c/b>被积函数是 1×1 = 1，所以 \u003cspan class=\"eq\">y(t)\u003c/span> 就是重叠区间的\u003cb>长度\u003c/b
