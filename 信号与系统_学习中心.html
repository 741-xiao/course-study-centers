>：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">t &lt; 0\u003c/span>：无重叠，\u003cspan class=\"eq\">y = 0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">0 ≤ t &lt; 1\u003c/span>：重叠 \u003cspan class=\"eq\">[0, t]\u003c/span>，长度 \u003cspan class=\"eq\">t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 ≤ t &lt; 2\u003c/span>：完全覆盖 \u003cspan class=\"eq\">x\u003c/span>，长度 1；\u003c/li>\u003cli>\u003cspan class=\"eq\">2 ≤ t &lt; 3\u003c/span>：重叠 \u003cspan class=\"eq\">[t−2, 1]\u003c/span>，长度 \u003cspan class=\"eq\">3 − t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">t ≥ 3\u003c/span>：无重叠，\u003cspan class=\"eq\">y = 0\u003c/span>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = \u003cspan style=\"display:inline-block;text-align:left;vertical-align:middle;line-height:1.65\">t，　0 ≤ t &lt; 1\u003cbr>1，　1 ≤ t &lt; 2\u003cbr>3 − t，　2 ≤ t &lt; 3\u003cbr>0，　其他\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>③ 画图（2 分）。\u003c/b>上升段（斜率 1）→ 平台（高 1）→ 下降段（斜率 −1），是一个\u003cb>梯形\u003c/b>。\u003c/p>\u003cp>\u003cb>④ 验算（2 分）。\u003c/b>面积 = \u003cspan class=\"eq\">½(1+3)×1 = 2\u003c/span>，等于两个矩形面积之积 \u003cspan class=\"eq\">1×2 = 2\u003c/span> ✓；总宽度 \u003cspan class=\"eq\">1+2 = 3\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>规律总结：\u003c/b>两个矩形卷积 → 梯形；等宽 → 三角形；一个宽一个窄 → 梯形（平台高度 = 窄矩形的面积）。\u003cb>把这张“形状表”背下来，画图题直接秒。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch3>6.5 考前 30 分钟清单\u003c/h3>\u003cdiv class=\"card\">\u003col style=\"margin:0\">\u003cli>默写表 0-1 的 8 个变换对（δ、1、u、sgn、单边指数、双边指数、cos、矩形）。\u003c/li>\u003cli>默写卷积公式：\u003cspan class=\"eq\">e\u003csup>αt\u003c/sup>∗e\u003csup>βt\u003c/sup>\u003c/span>、\u003cspan class=\"eq\">α\u003csup>k\u003c/sup>∗β\u003csup>k\u003c/sup>\u003c/span>、\u003cspan class=\"eq\">u∗u\u003c/span>。\u003c/li>\u003cli>默写齐次解三种形式、特解表前四行。\u003c/li>\u003cli>默写抽样定理：\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>m\u003c/sub>\u003c/span>，并想一遍“为什么是 2 倍”。\u003c/li>\u003cli>想一遍冲激响应的两种设法（右端有无导数）。\u003c/li>\u003cli>想一遍卷积的四个步骤（换元、反转、平移、积分）。\u003c/li>\u003cli>提醒自己：\u003cb>每道题算完，代 t=0 验算。\u003c/b>\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"note\" style=\"margin-top:26px\">\u003cb>写在最后：\u003c/b>信号与系统这门课，公式多，但逻辑其实很统一——\u003cb>所有问题都是“把信号拆开，让系统分别作用，再合起来”\u003c/b>。时域用 δ 拆，频域用复指数拆；拆完以后的“作用”，就是 h(t) 或 H(jω)。\u003cbr>\n把这条主线记住，零散的知识点就会自动归位。祝考试顺利。\n\u003c/div>"},{"id":"s115","title":"11.5 全书公式总表（考前默写用）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:22%\">模块\u003c/th>\u003cth>核心公式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>基本信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">δ(at)=δ(t)/|a|\u003c/span>；\u003cspan class=\"eq\">x(t)δ(t−t₀)=x(t₀)δ(t−t₀)\u003c/span>；\u003cspan class=\"eq\">δ=du/dt\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>系统性质\u003c/td>\u003ctd>线性：\u003cspan class=\"eq\">T{ax₁+bx₂}=aT{x₁}+bT{x₂}\u003c/span>；因果：\u003cspan class=\"eq\">h(t&lt;0)=0\u003c/span>；稳定：\u003cspan class=\"eq\">∫|h|&lt;∞\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域\u003c/td>\u003ctd>\u003cspan class=\"eq\">y=y\u003csub>zi\u003c/sub>+y\u003csub>zs\u003c/sub>\u003c/span>；\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>=x∗h\u003c/span>；\u003cspan class=\"eq\">e\u003csup>αt\u003c/sup>∗e\u003csup>βt\u003c/sup>=(e\u003csup>βt\u003c/sup>−e\u003csup>αt\u003c/sup>)/(β−α)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>傅里叶级数\u003c/td>\u003ctd>\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>=(1/T₀)∫\u003csub>T₀\u003c/sub>x(t)e\u003csup>−jnω₀t\u003c/sup>dt\u003c/span>；\u003cspan class=\"eq\">P=Σ|C\u003csub>n\u003c/sub>|²\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>傅里叶变换\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(jω)=∫x(t)e\u003csup>−jωt\u003c/sup>dt\u003c/span>；\u003cspan class=\"eq\">x(t)=(1/2π)∫X e\u003csup>jωt\u003c/sup>dω\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域系统\u003c/td>\u003ctd>\u003cspan class=\"eq\">H=Y\u003csub>zs\u003c/sub>/X\u003c/span>；无失真 \u003cspan class=\"eq\">H=Ke\u003csup>−jωt\u003csub>d\u003c/sub>\u003c/sup>\u003c/span>；调制 \u003cspan class=\"eq\">x cos ω₀t ⟷ ½[X(ω−ω₀)+X(ω+ω₀)]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>抽样\u003c/td>\u003ctd>\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>max\u003c/sub>\u003c/span>；\u003cspan class=\"eq\">X\u003csub>s\u003c/sub>=(1/T\u003csub>s\u003c/sub>)ΣX(j(ω−nω\u003csub>s\u003c/sub>))\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>拉普拉斯\u003c/td>\u003ctd>\u003cspan class=\"eq\">x′ ⟷ sX−x(0\u003csup>−\u003c/sup>)\u003c/span>；\u003cspan class=\"eq\">H(s)=B(s)/A(s)\u003c/span>；稳定：极点全在左半平面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Z 变换\u003c/td>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k] ⟷ z/(z−a)\u003c/span>；\u003cspan class=\"eq\">H(z)=B(z)/A(z)\u003c/span>；稳定：极点全在单位圆内\u003c/td>\u003c/tr>\u003ctr>\u003ctd>状态空间\u003c/td>\u003ctd>\u003cspan class=\"eq\">q′=Aq+Bx\u003c/span>；\u003cspan class=\"eq\">y=Cq+Dx\u003c/span>；\u003cspan class=\"eq\">H(s)=C(sI−A)\u003csup>−1\u003c/sup>B+D\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"},{"id":"s116","title":"11.6 课件复习题精选（原创解析）","html":"\u003cp class=\"lead\">下面题目取自各讲开头的「复习提问」，公式部分由讲义补全并重新给出解析。只保留信号与系统相关题目，剔除 EDA / STM32 / 数据库等其他课程内容。\u003c/p>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>题 1　全响应的线性分解（L04 / L13 反复出现）\u003c/span>\u003cspan class=\"tag\">高频\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>某 LTI 系统，输入 \u003cspan class=\"eq\">f(t)\u003c/span> 时完全响应为 \u003cspan class=\"eq\">(3sin t − 2cos t)u(t)\u003c/span>；输入 \u003cspan class=\"eq\">2f(t)\u003c/span> 时完全响应为 \u003cspan class=\"eq\">(5sin t + cos t)u(t)\u003c/span>。求输入 \u003cspan class=\"eq\">3f(t)\u003c/span> 时的完全响应（初始状态始终不变）。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>关键：\u003c/b>完全响应 = 零输入响应（与输入无关）+ 零状态响应（与输入成正比）。设 \u003cspan class=\"eq\">y = y\u003csub>zi\u003c/sub> + k·y\u003csub>zs0\u003c/sub>\u003c/span>，其中 \u003cspan class=\"eq\">k\u003c/span> 是输入倍数。\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k=1\u003c/span>：\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> + y\u003csub>zs0\u003c/sub> = 3sin t − 2cos t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">k=2\u003c/span>：\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> + 2y\u003csub>zs0\u003c/sub> = 5sin t + cos t\u003c/span>。\u003c/li>\u003c/ul>\u003cp>两式相减得 \u003cspan class=\"eq\">y\u003csub>zs0\u003c/sub> = 2sin t + 3cos t\u003c/span>，代回得 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> = sin t − 5cos t\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">k=3：y = y\u003csub>zi\u003c/sub> + 3y\u003csub>zs0\u003c/sub> = (sin t − 5cos t) + (6sin t + 9cos t) = (7sin t + 4cos t)u(t)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>套路：\u003c/b>把「完全响应」看成 \u003cspan class=\"eq\">k\u003c/span> 的一次函数 \u003cspan class=\"eq\">y(k)=a+bk\u003c/span>，两组数据解出 \u003cspan class=\"eq\">a,b\u003c/span>，再代 k=3。\u003cb>千万别把完全响应直接乘 3\u003c/b>——零输入那部分不随输入变。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>题 2　由阶跃响应反推微分方程（L05 复习题）\u003c/span>\u003cspan class=\"tag\">易错\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>某系统 \u003cspan class=\"eq\">y′(t)+3y(t)=2f′(t)\u003c/span>，求其阶跃响应 \u003cspan class=\"eq\">g(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>阶跃响应 = 输入 \u003cspan class=\"eq\">u(t)\u003c/span> 时的零状态输出，此时 \u003cspan class=\"eq\">f′(t)=δ(t)\u003c/span>。右端变成 \u003cspan class=\"eq\">2δ(t)\u003c/span>。\u003c/p>\u003cp>由第 2 章一阶系统的速记公式 \u003cspan class=\"eq\">y′+ay=bx ⟹ h(t)=b e\u003csup>−at\u003c/sup>u(t)\u003c/span>，这里 \u003cspan class=\"eq\">a=3, b=2\u003c/span>，故：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = 2e\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>但注意：\u003cspan class=\"eq\">h(t)\u003c/span> 是\u003cb>冲激响应\u003c/b>，题目要的是\u003cb>阶跃响应\u003c/b>。由 \u003cspan class=\"eq\">g(t)=∫h\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">g(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>2e\u003csup>−3τ\u003c/sup>dτ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">3\u003c/span>\u003c/span>(1 − e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>陷阱：\u003c/b>课件选项是 \u003cspan class=\"eq\">2e\u003csup>−3t\u003c/sup>u(t)\u003c/span> 之类，很多人直接选了 h(t)。\u003cb>看清问的是 h 还是 g\u003c/b>：h 是 δ 输入的响应，g 是 u 输入的响应，两者相差一次积分。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>题 3　抽样与混叠判断（L15 复习题）\u003c/span>\u003cspan class=\"tag\">选择常客\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>连续信号最高频率 \u003cspan class=\"eq\">f\u003csub>max\u003c/sub>=3 kHz\u003c/span>，以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>=5 kHz\u003c/span> 抽样。正频率轴上发生混叠的频率范围是？\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>抽样后频谱以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>=5 kHz\u003c/span> 为周期复制，原频谱副本的中心在 5 kHz，占据 \u003cspan class=\"eq\">2 ~ 8 kHz\u003c/span>。它与原信号频谱 \u003cspan class=\"eq\">0 ~ 3 kHz\u003c/span> 的重叠区间为：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">[f\u003csub>s\u003c/sub> − f\u003csub>max\u003c/sub>, f\u003csub>max\u003c/sub>] = [5 − 3, 3] = [2, 3] kHz\u003c/span>\u003c/div>\u003cp>\u003cb>答案：2～3 kHz\u003c/b>（课件选项 B）。\u003c/p>\u003cp>\u003cb>通用公式：\u003c/b>混叠区间是 \u003cspan class=\"eq\">[f\u003csub>s\u003c/sub>−f\u003csub>max\u003c/sub>, f\u003csub>max\u003c/sub>]\u003c/span>，只有当 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>max\u003c/sub>\u003c/span> 时这个区间才为空（不混叠）。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>题 4　补零与频率分辨率（L15 复习题）\u003c/span>\u003cspan class=\"tag\">概念题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>时长 \u003cspan class=\"eq\">T₀=0.1 s\u003c/span> 的信号以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>=1000 Hz\u003c/span> 采样，做 \u003cspan class=\"eq\">N=100\u003c/span> 点 DFT，再补零到 1000 点。下列说法正确的是？\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>正确：补零只减小栅栏效应，物理频率分辨率仍约为 10 Hz。\u003c/b>\u003c/p>\u003cp>物理分辨率由\u003cb>有效数据时长\u003c/b>决定：\u003cspan class=\"eq\">Δf = 1/T₀ = 1/0.1 = 10\u003c/span> Hz。补零只是把频谱曲线画得更密（频点间隔从 10 Hz 变成 1 Hz），并没有增加任何新信息，两个相距 5 Hz 的谱峰仍然分不开。\u003c/p>\u003cdiv class=\"tip\">\u003cb>一句话：\u003c/b>「\u003cb>补零让谱线变密，不让它变清\u003c/b>」。想要真正提高分辨率，只能延长采样时间。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>题 5　由系统函数判断稳定与因果（L20 / L24 综合）\u003c/span>\u003cspan class=\"tag\">压轴\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">H(s)=(s+5)/[(s+1)(s+2)]\u003c/span>，输入 \u003cspan class=\"eq\">x(t)=u(t)\u003c/span> 时零状态响应为某 \u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>(t)\u003c/span>。写出系统微分方程、求 \u003cspan class=\"eq\">h(t)\u003c/span>、判断因果与稳定。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>① 微分方程：\u003c/b>交叉相乘 \u003cspan class=\"eq\">(s²+3s+2)Y=(s+5)X\u003c/span> ⟹ \u003cspan class=\"eq\">y″+3y′+2y = x′ + 5x\u003c/span>。\u003c/p>\u003cp>\u003cb>② 冲激响应：\u003c/b>部分分式展开\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">3\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span> ⟹ h(t) = (4e\u003csup>−t\u003c/sup> − 3e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>③ 因果与稳定：\u003c/b>\u003cspan class=\"eq\">h(t)\u003c/span> 含 \u003cspan class=\"eq\">u(t)\u003c/span>，\u003cspan class=\"eq\">t&lt;0\u003c/span> 为 0 → \u003cb>因果\u003c/b>；极点 \u003cspan class=\"eq\">−1, −2\u003c/span> 都在左半平面 → \u003cb>稳定\u003c/b>。\u003c/p>\u003cp>\u003cb>④ 频率响应：\u003c/b>因稳定，可直接令 \u003cspan class=\"eq\">s=jω\u003c/span> 得 \u003cspan class=\"eq\">H(jω)=(jω+5)/[(jω+1)(jω+2)]\u003c/span>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>这是 CH6 综合题的标准四问：\u003c/b>由 H(s) 反推微分方程 → 部分分式求 h(t) → 判因果稳定 → 求频响。四问写全，20 分到手。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s117","title":"11.7 全书考点清单（按章节）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:12%\">章\u003c/th>\u003cth style=\"width:44%\">高频考点\u003c/th>\u003cth>必练题型\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>δ 抽样性、信号运算画图、五性质判定、奇偶/直流分解\u003c/td>\u003ctd>选择、填空、画图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>经典法四步、冲激响应两种设法、卷积分段、零输入零状态\u003c/td>\u003ctd>大题（微分方程）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>迭代法、h[k]、卷积和列表法、R\u003csub>N\u003c/sub>∗R\u003csub>N\u003c/sub>\u003c/td>\u003ctd>大题（差分方程）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>C\u003csub>n\u003c/sub> 计算、对称性化简、Parseval、Gibbs 9%\u003c/td>\u003ctd>频谱图、功率计算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>变换对、性质、抽样率、DFS/DTFT、频域抽样\u003c/td>\u003ctd>选择、频谱搬移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>H(jω) 三种求法、无失真条件、滤波器、调制解调\u003c/td>\u003ctd>大题（频域法）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>拉氏性质、部分分式反变换、H(s) 零极点与稳定、s 域求解\u003c/td>\u003ctd>\u003cb>大题必考\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>ROC 与序列类型、z 反变换、H(z) 极点与稳定、回声消除\u003c/td>\u003ctd>\u003cb>大题必考\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>由 H(s)/框图写 A,B,C,D、状态转移矩阵、迭代求解\u003c/td>\u003ctd>矩阵方程、填空\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>MATLAB 函数、点运算、conv 下标、sinc 定义、补零\u003c/td>\u003ctd>计算机题 / 编程分析题\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"note\">\u003cb>考前 30 分钟（更新版）：\u003c/b>① 默写第 0 章三张表；② 默写拉氏/Z 变换对各 8 行；③ 默写「左半平面 ↔ 单位圆内」的稳定性对照；④ 默写无失真传输两个条件与抽样定理；⑤ 提醒自己每道题算完代 \u003cspan class=\"eq\">t=0\u003c/span> 或 \u003cspan class=\"eq\">k=0\u003c/span> 验算。\u003cb>公式是骨架，验算是保险。\u003c/b>\u003c/div>\u003c/section>\u003c/div>"}]}],"blocks":[],"pitfalls":["1. δ 的积分区间没看\n∫−11f(t)δ(t−2)dt = 0，不是 f(2)。冲激点不在区间内，答案就是 0。","2. δ(at) 忘了 1/|a|\nδ(2t)=½δ(t)。负号被绝对值吃掉，δ(−3t)=⅓δ(t)。","3. 特解撞根没乘 t\n激励指数等于特征根时，必须设 Ateat，否则代进去得 0 = 激励，无解。","4. 初始条件代错地方\n零输入响应代 y(0⁻)；离散代 y[−1], y[−2]，不是 y[0], y[1]。","5. 卷积漏写 u(t)\n结果是 6(e−t−e−2t) 只在 t>0 成立，必须乘 u(t)，否则整段扣分。","6. 卷积分段分界点错\n分界点由两个信号的左右边界决定，不是凭感觉。画一条时间轴标出 0, τ₁, τ₂, τ₁+τ₂。","7. u(t) 的频谱漏 πδ(ω)\nu(t)⟷πδ(ω)+1/(jω)，只写 1/(jω) 是最常见的错误。","8. 抽样率忘记乘 2\n奈奎斯特速率是 2fm；Sa 的带宽是 ωc，换算成 Hz 要除以 2π。","9. 平方信号的带宽没翻倍\nSa²(ωct) 的带宽是 2ωc，因为时域平方 = 频域卷积。","10. 结果不验算\n代 t=0 看初值、看 t→∞ 是否收敛、卷积看长度和总和。10 秒能救回 10 分。"],"bank":[{"ch":1,"no":"自测A-1","kind":"choice","group":"objective","stem":"下列信号中属于\u003cb>能量信号\u003c/b>的是（　）","options":[{"key":"A","html":"\u003cspan class=\"eq\">u(t)\u003c/span>"},{"key":"B","html":"\u003cspan class=\"eq\">sin 2t\u003c/span>"},{"key":"C","html":"\u003cspan class=\"eq\">e\u003csup>−3t\u003c/sup>u(t)\u003c/span>"},{"key":"D","html":"\u003cspan class=\"eq\">t·u(t)\u003c/span>"}],"answer":"C","answerKey":"C","why":"\u003cspan class=\"eq\">E = ∫\u003csub>0\u003c/sub>\u003csup>∞\u003c/sup>e\u003csup>−6t\u003c/sup>dt = 1/6 &lt; ∞\u003c/span>。A、B 是功率信号，D 既非能量也非功率。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-1","points":[]},{"ch":1,"no":"自测A-2","kind":"choice","group":"objective","stem":"\u003cspan class=\"eq\">δ(2t − 4)\u003c/span> 等于（　）","options":[{"key":"A","html":"\u003cspan class=\"eq\">δ(t−2)\u003c/span>"},{"key":"B","html":"\u003cspan class=\"eq\">½δ(t−2)\u003c/span>"},{"key":"C","html":"\u003cspan class=\"eq\">2δ(t−2)\u003c/span>"},{"key":"D","html":"\u003cspan class=\"eq\">½δ(t−4)\u003c/span>"}],"answer":"B","answerKey":"B","why":"\u003cspan class=\"eq\">δ(2t−4) = δ(2(t−2)) = ½δ(t−2)\u003c/span>。套 \u003cspan class=\"eq\">δ(at)=δ(t)/|a|\u003c/span>。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-2","points":[]},{"ch":1,"no":"自测A-3","kind":"choice","group":"objective","stem":"\u003cspan class=\"eq\">∫\u003csub>−1\u003c/sub>\u003csup>3\u003c/sup>(t² + 1)δ(t − 2)dt\u003c/span> 等于（　）","options":[{"key":"A","html":"0"},{"key":"B","html":"5"},{"key":"C","html":"17"},{"key":"D","html":"1"}],"answer":"B","answerKey":"B","why":"\u003cspan class=\"eq\">t=2\u003c/span> 在 \u003cspan class=\"eq\">[−1,3]\u003c/span> 内，代值得 \u003cspan class=\"eq\">4+1=5\u003c/span>。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-3","points":[]},{"ch":1,"no":"自测A-4","kind":"choice","group":"objective","stem":"下列系统中属于\u003cb>时变系统\u003c/b>的是（　）","options":[{"key":"A","html":"\u003cspan class=\"eq\">y(t)=x(t−1)\u003c/span>"},{"key":"B","html":"\u003cspan class=\"eq\">y(t)=x(2t)\u003c/span>"},{"key":"C","html":"\u003cspan class=\"eq\">y(t)=2x(t)\u003c/span>"},{"key":"D","html":"\u003cspan class=\"eq\">y(t)=x(t)+x(t−1)\u003c/span>"}],"answer":"B","answerKey":"B","why":"时间被压缩，延迟量对不上，是时变系统；而且 \u003cspan class=\"eq\">t=1\u003c/span> 时要用 \u003cspan class=\"eq\">x(2)\u003c/span>，还是非因果的。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-4","points":[]},{"ch":1,"no":"自测A-5","kind":"choice","group":"objective","stem":"\u003cspan class=\"eq\">u(t) ∗ u(t)\u003c/span> 等于（　）","options":[{"key":"A","html":"\u003cspan class=\"eq\">u(t)\u003c/span>"},{"key":"B","html":"\u003cspan class=\"eq\">t·u(t)\u003c/span>"},{"key":"C","html":"\u003cspan class=\"eq\">t²u(t)\u003c/span>"},{"key":"D","html":"\u003cspan class=\"eq\">δ(t)\u003c/span>"}],"answer":"B","answerKey":"B","why":"\u003cspan class=\"eq\">u∗u = (k+1)\u003c/span> 的连续版本，即 \u003cspan class=\"eq\">t·u(t)\u003c/span>。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-5","points":[]},{"ch":1,"no":"自测A-6","kind":"choice","group":"objective","stem":"周期信号 \u003cspan class=\"eq\">x(t) = 1 + 2cos ω₀t + 3sin 2ω₀t\u003c/span> 的平均功率为（　）","options":[{"key":"A","html":"6"},{"key":"B","html":"7.5"},{"key":"C","html":"14"},{"key":"D","html":"36"}],"answer":"B","answerKey":"B","why":"\u003cspan class=\"eq\">P = 1² + 2²/2 + 3²/2 = 1+2+4.5 = 7.5\u003c/span>。注意正弦余弦的功率是 \u003cspan class=\"eq\">A²/2\u003c/span>。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-6","points":[]},{"ch":1,"no":"自测A-7","kind":"choice","group":"objective","stem":"\u003cspan class=\"eq\">F[δ(t − 2)]\u003c/span> 等于（　）","options":[{"key":"A","html":"1"},{"key":"B","html":"\u003cspan class=\"eq\">e\u003csup>−j2ω\u003c/sup>\u003c/span>"},{"key":"C","html":"\u003cspan class=\"eq\">e\u003csup>j2ω\u003c/sup>\u003c/span>"},{"key":"D","html":"\u003cspan class=\"eq\">2πe\u003csup>−j2ω\u003c/sup>\u003c/span>"}],"answer":"B","answerKey":"B","why":"时移性质：\u003cspan class=\"eq\">δ(t−2) ⟷ e\u003csup>−j2ω\u003c/sup>·1\u003c/span>。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-7","points":[]},{"ch":1,"no":"自测A-8","kind":"choice","group":"objective","stem":"\u003cspan class=\"eq\">F[e\u003csup>j3t\u003c/sup>]\u003c/span> 等于（　）","options":[{"key":"A","html":"\u003cspan class=\"eq\">2πδ(ω−3)\u003c/span>"},{"key":"B","html":"\u003cspan class=\"eq\">δ(ω−3)\u003c/span>"},{"key":"C","html":"\u003cspan class=\"eq\">2πδ(ω+3)\u003c/span>"},{"key":"D","html":"\u003cspan class=\"eq\">1/(j(ω−3))\u003c/span>"}],"answer":"A","answerKey":"A","why":"\u003cspan class=\"eq\">e\u003csup>jω₀t\u003c/sup> ⟷ 2πδ(ω−ω₀)\u003c/span>，这里 \u003cspan class=\"eq\">ω₀=3\u003c/span>。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-8","points":[]},{"ch":1,"no":"自测A-9","kind":"choice","group":"objective","stem":"某信号最高频率为 4 kHz，则奈奎斯特抽样速率为（　）","options":[{"key":"A","html":"2 kHz"},{"key":"B","html":"4 kHz"},{"key":"C","html":"8 kHz"},{"key":"D","html":"16 kHz"}],"answer":"C","answerKey":"C","why":"\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>m\u003c/sub> = 8\u003c/span> kHz。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-9","points":[]},{"ch":1,"no":"自测A-10","kind":"choice","group":"objective","stem":"系统 \u003cspan class=\"eq\">h(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span> 是（　）","options":[{"key":"A","html":"不稳定"},{"key":"B","html":"稳定"},{"key":"C","html":"临界稳定"},{"key":"D","html":"无法判断"}],"answer":"B","answerKey":"B","why":"\u003cspan class=\"eq\">∫\u003csub>0\u003c/sub>\u003csup>∞\u003c/sup>|h|dt = 1/2 &lt; ∞\u003c/span>，绝对可积，系统稳定。","source":"自测卷 A · 选择题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-10","points":[]},{"ch":1,"no":"自测A-11","kind":"fill","group":"objective","stem":"\u003cspan class=\"eq\">δ(t)\u003c/span> 与 \u003cspan class=\"eq\">u(t)\u003c/span> 的关系：\u003cspan class=\"eq\">δ(t) =\u003c/span> ______。","options":[],"answer":"\u003cspan class=\"eq\">du(t)/dt\u003c/span>（阶跃的导数）","answerKey":"","why":"","source":"自测卷 A · 填空题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-11","points":[]},{"ch":1,"no":"自测A-12","kind":"fill","group":"objective","stem":"\u003cspan class=\"eq\">x(t) ∗ δ(t − t₀) =\u003c/span> ______。","options":[],"answer":"\u003cspan class=\"eq\">x(t − t₀)\u003c/span>（卷积 δ 等于平移）","answerKey":"","why":"","source":"自测卷 A · 填空题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-12","points":[]},{"ch":1,"no":"自测A-13","kind":"fill","group":"objective","stem":"方程 \u003cspan class=\"eq\">y″ + 5y′ + 6y = 0\u003c/span> 的通解为 ______。","options":[],"answer":"\u003cspan class=\"eq\">y = K₁e\u003csup>−2t\u003c/sup> + K₂e\u003csup>−3t\u003c/sup>\u003c/span>（根为 −2、−3）","answerKey":"","why":"","source":"自测卷 A · 填空题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-13","points":[]},{"ch":1,"no":"自测A-14","kind":"fill","group":"objective","stem":"特征根为 \u003cspan class=\"eq\">−1 ± j2\u003c/span> 时，齐次解的形式为 ______。","options":[],"answer":"\u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>(A cos 2t + B sin 2t)\u003c/span>","answerKey":"","why":"","source":"自测卷 A · 填空题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-14","points":[]},{"ch":1,"no":"自测A-15","kind":"fill","group":"objective","stem":"\u003cspan class=\"eq\">F[1] =\u003c/span> ______。","options":[],"answer":"\u003cspan class=\"eq\">2πδ(ω)\u003c/span>","answerKey":"","why":"","source":"自测卷 A · 填空题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-15","points":[]},{"ch":1,"no":"自测A-16","kind":"fill","group":"objective","stem":"周期矩形脉冲（幅度 1、脉宽 \u003cspan class=\"eq\">τ\u003c/span>、周期 \u003cspan class=\"eq\">T₀\u003c/span>）的傅里叶系数 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub> =\u003c/span> ______。","options":[],"answer":"\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = (τ/T₀)·Sa(nω₀τ/2)\u003c/span>，其中 \u003cspan class=\"eq\">ω₀ = 2π/T₀\u003c/span>","answerKey":"","why":"","source":"自测卷 A · 填空题","tags":["自测卷 A"],"needsCheck":false,"id":"signals-自测A-16","points":[]},{"ch":1,"no":"例1-1","kind":"short","group":"written","stem":"\u003cp>判断下列信号是能量信号还是功率信号：\u003c/p>\u003cp>(1) \u003cspan class=\"eq\">x₁(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span>　　(2) \u003cspan class=\"eq\">x₂(t) = u(t)\u003c/span>　　(3) \u003cspan class=\"eq\">x₃(t) = 3cos(2t)\u003c/span>\u003c/p>","options":[],"answer":"\u003cp>\u003cb>(1)\u003c/b> 先算能量：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">E = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span> e\u003csup>−4t\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">4\u003c/span>\u003c/span> &lt; ∞\u003c/span>\u003c/div>\u003cp>能量有限，所以是\u003cb>能量信号\u003c/b>，功率 \u003cspan class=\"eq\">P = 0\u003c/span>。\u003cbr>\u003cb>思路：\u003c/b>看到 \u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>u(t)\u003c/span>（a&gt;0）就想到“衰减得足够快，积分收敛”。\u003c/p>\u003cp>\u003cb>(2)\u003c/b>\u003cspan class=\"eq\">E = ∫\u003csub>0\u003c/sub>\u003csup>∞\u003c/sup>1²dt → ∞\u003c/span>，能量无穷；但\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = lim\u003csub>T→∞\u003c/sub>\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">T\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>1 dt = 1\u003c/span>\u003c/div>\u003cp>平均功率有限且不为零，是\u003cb>功率信号\u003c/b>。\u003c/p>\u003cp>\u003cb>(3)\u003c/b> 周期信号，直接套周期信号功率公式：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = \u003cspan class=\"fr\">\u003cspan class=\"fn\">A²\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">9\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> = 4.5\u003c/span>\u003c/div>\u003cp>是\u003cb>功率信号\u003c/b>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>不要看到“无限长”就判成能量无穷、功率无穷。阶跃、正弦都是功率信号；只有像 \u003cspan class=\"eq\">t·u(t)\u003c/span> 这种“越涨越大”的才既不是能量也不是功率信号。","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-1　判断信号类型","tags":["讲义例题"],"needsCheck":false,"steps":["(1)","(2)","(3)"],"title":"例 1-1　判断信号类型","id":"signals-例1-1","points":["(1)","(2)","(3)"]},{"ch":1,"no":"例1-2","kind":"short","group":"written","stem":"\u003cp>计算　\u003cspan class=\"eq\">x = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">1\u003c/span>\u003cspan class=\"l\">−1\u003c/span>\u003c/span>\u003c/span> (2t² + 1)·δ(t − 2) dt\u003c/span>\u003c/p>","options":[],"answer":"\u003cp>\u003cb>答案：0\u003c/b>\u003c/p>\u003cp>\u003cb>为什么：\u003c/b>抽样性要求“冲激所在的位置 t₀ 落在积分区间内”。这里 \u003cspan class=\"eq\">t₀ = 2\u003c/span>，而积分区间是 \u003cspan class=\"eq\">[−1, 1]\u003c/span>，2 根本不在里面，所以整个积分是 0。\u003c/p>\u003cp>\u003cb>如果题目改成\u003c/b>\u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>\u003c/span>，答案才是 \u003cspan class=\"eq\">2×2² + 1 = 9\u003c/span>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>90% 的人会直接算成 9。做这类题，\u003cb>第一步永远先看积分上下限包不包含冲激点\u003c/b>，再代值。","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-2　δ 函数的抽样性（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["答案：0","为什么：","如果题目改成"],"title":"例 1-2　δ 函数的抽样性（课堂原题）","id":"signals-例1-2","points":["为什么：","如果题目改成"]},{"ch":1,"no":"例1-3","kind":"short","group":"written","stem":"\u003cp>化简　\u003cspan class=\"eq\">(t² + 3t)·δ(t − 1)\u003c/span>，并求 \u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>(t² + 3t)δ(t − 1)dt\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>由乘积性质，把 \u003cspan class=\"eq\">t = 1\u003c/span> 代进去：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">(t² + 3t)δ(t − 1) = (1 + 3)δ(t − 1) = 4δ(t − 1)\u003c/span>\u003c/div>\u003cp>再积分，δ 的面积为 1，所以结果为 \u003cb>4\u003c/b>。\u003c/p>\u003cp>\u003cb>一句话：\u003c/b>δ 是“取值器”——它只关心自己脚下那一点的函数值。\u003c/p>","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-3　δ 与普通函数相乘","tags":["讲义例题"],"needsCheck":false,"steps":["一句话："],"title":"例 1-3　δ 与普通函数相乘","id":"signals-例1-3","points":["由乘积性质，把 t = 1 代进去：(t² + 3t)δ(t − 1) = (1 + 3)δ(t − 1) = 4δ(t − 1)再积分，δ 的面积为 1，所以结果为 4","一句话：δ 是“取值器”——它只关心自己脚下那一点的函数值"]},{"ch":1,"no":"例1-4","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">x(t)\u003c/span> 是宽度为 2、以原点为中心的三角形（顶点在 (0,1)，底边从 −1 到 1）。画出 \u003cspan class=\"eq\">x(2 − 2t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步，改写成标准形式：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(2 − 2t) = x(−2(t − 1))\u003c/span>\u003c/div>\u003cp>这告诉我们：先\u003cb>右移 1\u003c/b>，再\u003cb>关于纵轴反转\u003c/b>，最后\u003cb>横向压缩 2 倍\u003c/b>。\u003c/p>\u003cp>\u003cb>第二步，抓三个关键点（最快的方法）：\u003c/b>原来三角形的三个拐点是 \u003cspan class=\"eq\">t = −1, 0, 1\u003c/span>，对应函数值 \u003cspan class=\"eq\">0, 1, 0\u003c/span>。令 \u003cspan class=\"eq\">2 − 2t\u003c/span> 分别等于这三个值：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">2 − 2t = −1 → t = 1.5\u003c/span>，值 0\u003c/li>\u003cli>\u003cspan class=\"eq\">2 − 2t = 0 → t = 1\u003c/span>，值 1\u003c/li>\u003cli>\u003cspan class=\"eq\">2 − 2t = 1 → t = 0.5\u003c/span>，值 0\u003c/li>\u003c/ul>\u003cp>所以新图形是：底边从 \u003cspan class=\"eq\">t = 0.5\u003c/span> 到 \u003cspan class=\"eq\">1.5\u003c/span>（宽度 1），顶点在 \u003cspan class=\"eq\">t = 1\u003c/span>、高度仍为 1 的三角形。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考场技巧：\u003c/b>不要真的去“先平移再反转”，容易绕晕。\u003cb>直接解方程 at+b = 原关键点\u003c/b>，把三五个拐点的新位置算出来，连点成线，30 秒搞定，而且不会错。","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-4　画 x(2 − 2t)","tags":["讲义例题"],"needsCheck":false,"steps":["第一步，改写成标准形式：","第二步，抓三个关键点（最快的方法）："],"title":"例 1-4　画 x(2 − 2t)","id":"signals-例1-4","points":["第一步，改写成标准形式：","第二步，抓三个关键点（最快的方法）："]},{"ch":1,"no":"例1-5","kind":"short","group":"written","stem":"\u003cp>判断下列系统的线性、时不变、因果、稳定性：\u003c/p>\u003cp>(1) \u003cspan class=\"eq\">y(t) = x(t)cos(2πt)\u003c/span>　(2) \u003cspan class=\"eq\">y(t) = x(2t)\u003c/span>　(3) \u003cspan class=\"eq\">y(t) = x²(t)\u003c/span>　(4) \u003cspan class=\"eq\">y(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>x(τ)dτ\u003c/span>\u003c/p>","options":[],"answer":"\u003cp>\u003cb>(1) \u003cspan class=\"eq\">y = x(t)cos(2πt)\u003c/span>\u003c/b>：线性（乘以一个与 x 无关的时间函数，满足齐次与可加）；\u003cb>时变\u003c/b>（把输入延迟 t₀，输出变成 \u003cspan class=\"eq\">x(t−t₀)cos(2πt)\u003c/span>，而 \u003cspan class=\"eq\">y(t−t₀) = x(t−t₀)cos(2π(t−t₀))\u003c/span>，两者不相等）；因果；稳定（\u003cspan class=\"eq\">|y| ≤ |x|\u003c/span>）；无记忆。\u003c/p>\u003cp>\u003cb>(2) \u003cspan class=\"eq\">y = x(2t)\u003c/span>\u003c/b>：线性；\u003cb>时变\u003c/b>（时间被压缩，延迟量对不上）；\u003cb>非因果\u003c/b>（t=1 时要用到 x(2)，是“未来”的值）；稳定。\u003c/p>\u003cp>\u003cb>(3) \u003cspan class=\"eq\">y = x²(t)\u003c/span>\u003c/b>：\u003cb>非线性\u003c/b>（\u003cspan class=\"eq\">(ax)² ≠ a x²\u003c/span>）；时不变；因果；稳定（输入有界则平方也有界）；无记忆。\u003c/p>\u003cp>\u003cb>(4) 积分器\u003c/b>：线性；时不变；因果；\u003cb>不稳定\u003c/b>——输入 \u003cspan class=\"eq\">u(t)\u003c/span> 有界（最大 1），输出却是 \u003cspan class=\"eq\">t·u(t)\u003c/span>，随时间无限增大。\u003c/p>\u003cdiv class=\"tip\">\u003cb>判稳定的快速法：\u003c/b>先看系统里有没有“累加/积分”这种会存东西的结构。积分器、累加器对阶跃输入都会线性增长，因此通常不稳定。","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-5　四个典型系统，一次判完","tags":["讲义例题"],"needsCheck":false,"steps":["(4) 积分器"],"title":"例 1-5　四个典型系统，一次判完","id":"signals-例1-5","points":["(1) y = x(t)cos(2πt)：线性（乘以一个与 x 无关的时间函数，满足齐次与可加）","时变（把输入延迟 t₀，输出变成 x(t−t₀)cos(2πt)，而 y(t−t₀) = x(t−t₀)cos(2π(t−t₀))，两者不相等）","稳定（|y| ≤ |x|）","(2) y = x(2t)：线性"]},{"ch":1,"no":"例1-6","kind":"short","group":"written","stem":"\u003cp>判断 \u003cspan class=\"eq\">y(t) = 3x(t) + 2\u003c/span> 是否线性、时不变。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>非线性。\u003c/b>检验齐次性：输入 \u003cspan class=\"eq\">2x(t)\u003c/span> 时，输出是 \u003cspan class=\"eq\">6x(t)+2\u003c/span>，而 \u003cspan class=\"eq\">2y(t) = 6x(t)+4\u003c/span>，两者不相等。\u003c/p>\u003cp>\u003cb>时不变。\u003c/b>把输入延迟 t₀：\u003cspan class=\"eq\">3x(t−t₀)+2\u003c/span>，恰好等于 \u003cspan class=\"eq\">y(t−t₀)\u003c/span>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>记住：\u003c/b>只要式子里有“与输入无关的常数项”（如 +2、+1），就一定非线性；但常数项\u003cb>不影响\u003c/b>时不变性。这两个性质是分开判的，别混。","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-6　带常数项的系统","tags":["讲义例题"],"needsCheck":false,"steps":["非线性。","时不变。"],"title":"例 1-6　带常数项的系统","id":"signals-例1-6","points":["非线性。","时不变。"]},{"ch":1,"no":"例1-7","kind":"short","group":"written","stem":"\u003cp>已知某 LTI 系统对输入 \u003cspan class=\"eq\">u(t)\u003c/span> 的零状态响应是 \u003cspan class=\"eq\">g(t) = (1 − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>。求输入为 \u003cspan class=\"eq\">δ(t)\u003c/span> 时的响应。\u003c/p>","options":[],"answer":"\u003cp>因为 \u003cspan class=\"eq\">δ(t) = du(t)/dt\u003c/span>，由微分特性，输出也要求导：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = g′(t) = 2e\u003csup>−2t\u003c/sup>u(t) + (1 − e\u003csup>−2t\u003c/sup>)δ(t) = 2e\u003csup>−2t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>最后一步是因为 \u003cspan class=\"eq\">(1 − e\u003csup>−2t\u003c/sup>)\u003c/span> 在 \u003cspan class=\"eq\">t=0\u003c/span> 处等于 0，把 δ 项“消掉”了。\u003c/p>","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-7　利用微分特性“偷答案”","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 1-7　利用微分特性“偷答案”","id":"signals-例1-7","points":["因为 δ(t) = du(t)/dt，由微分特性，输出也要求导：h(t) = g′(t) = 2e−2tu(t) + (1 − e−2t)δ(t) = 2e−2tu(t)最后一步是因为 (1 − e−2t) 在 t=0 处等于 0，把 δ 项“消掉”了"]},{"ch":1,"no":"例1-8","kind":"short","group":"written","stem":"\u003cp>课件给出的 MATLAB 函数是 \u003cspan class=\"eq\">y = r(t+1) − r(t) − r(t−1) + r(t−2)\u003c/span>，说明它画的是什么波形。\u003c/p>","options":[],"answer":"\u003cp>\u003cspan class=\"eq\">r(t+a)\u003c/span> 是在 \u003cspan class=\"eq\">t=−a\u003c/span> 处开始、斜率为 1 的斜线。把四个斜坡按斜率变化点叠加：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">t &lt; −1\u003c/span>：全为 0 → \u003cspan class=\"eq\">y=0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">−1 ≤ t &lt; 0\u003c/span>：只有 \u003cspan class=\"eq\">r(t+1)\u003c/span> 起作用 → 斜率 +1，线性上升；\u003c/li>\u003cli>\u003cspan class=\"eq\">0 ≤ t &lt; 1\u003c/span>：\u003cspan class=\"eq\">−r(t)\u003c/span> 加入 → 斜率变 0，\u003cb>平台\u003c/b>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 ≤ t &lt; 2\u003c/span>：\u003cspan class=\"eq\">−r(t−1)\u003c/span> 加入 → 斜率 −1，线性下降；\u003c/li>\u003cli>\u003cspan class=\"eq\">t ≥ 2\u003c/span>：\u003cspan class=\"eq\">+r(t−2)\u003c/span> 加入 → 斜率又变 0，回到 0。\u003c/li>\u003c/ul>\u003cp>所以是一个\u003cb>梯形\u003c/b>：在 −1～0 上升、0～1 平顶、1～2 下降。\u003c/p>\u003cdiv class=\"tip\">\u003cb>通用套路：\u003c/b>折线信号用斜坡函数写，\u003cb>每个拐点放一个 r，系数 = 该点斜率的变化量\u003c/b>。阶跃信号则用 u，系数 = 该点幅度的跳变量。这两种写法在填空里很常见。","answerKey":"","why":"","source":"讲义第 1 章 · 例 1-8　用 u(t) 和 r(t) 表示一个折线信号（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 1-8　用 u(t) 和 r(t) 表示一个折线信号（课件原题）","id":"signals-例1-8","points":["r(t+a) 是在 t=−a 处开始、斜率为 1 的斜线","把四个斜坡按斜率变化点叠加：t \u003c −1：全为 0 → y=0","−1 ≤ t \u003c 0：只有 r(t+1) 起作用 → 斜率 +1，线性上升","0 ≤ t \u003c 1：−r(t) 加入 → 斜率变 0，平台"]},{"ch":1,"kind":"fill","group":"objective","stem":"若信号的总能量满足 ______，称为能量信号；周期信号一定是 ______ 信号。","options":[],"answer":"0\u003cE\u003c∞；功率","answerKey":"","accept":[["0\u003cE\u003c∞","0\ u003c∞（绝对可积）","h(t)绝对可积"]],"why":"冲激响应绝对可积，有界输入才一定有界输出；离散对应 Σ|h[k]|\u003c∞。","source":"讲义提炼 · 第 1 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-7","id":"sig-extra-7"},{"ch":1,"kind":"choice","group":"objective","stem":"下列信号中属于功率信号的是（　）。","options":[{"key":"A","html":"u(t)"},{"key":"B","html":"e\u003csup>−2t\u003c/sup>u(t)"},{"key":"C","html":"t·u(t)"},{"key":"D","html":"e\u003csup>−2|t|\u003c/sup>"}],"answer":"A","answerKey":"A","why":"u(t) 能量无限、平均功率 1/2；B、D 能量有限；C 两者都无限。","source":"讲义提炼 · 第 1 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-27","id":"sig-extra-27"},{"ch":1,"kind":"choice","group":"objective","stem":"下列系统属于线性系统的是（　）。","options":[{"key":"A","html":"y(t)=x²(t)"},{"key":"B","html":"y(t)=3x(t)+1"},{"key":"C","html":"y(t)=∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>x(τ)dτ"},{"key":"D","html":"y(t)=x(t)x(t−1)"}],"answer":"C","answerKey":"C","why":"积分是线性运算；平方、加常数、相乘都破坏线性。","source":"讲义提炼 · 第 1 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-28","id":"sig-extra-28"},{"ch":1,"kind":"choice","group":"objective","stem":"下列系统属于时变系统的是（　）。","options":[{"key":"A","html":"y(t)=x(t−1)"},{"key":"B","html":"y(t)=2x(t)"},{"key":"C","html":"y(t)=x(t)cos 2t"},{"key":"D","html":"y(t)=x(t)+x(t−1)"}],"answer":"C","answerKey":"C","why":"乘以随时间变化的 cos 2t，输入平移后输出不再整体平移，是线性时变系统。","source":"讲义提炼 · 第 1 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-29","id":"sig-extra-29"},{"ch":1,"kind":"choice","group":"objective","stem":"下列系统属于非因果系统的是（　）。","options":[{"key":"A","html":"y(t)=x(t−1)"},{"key":"B","html":"y(t)=x(t+1)"},{"key":"C","html":"y(t)=x(t)u(t)"},{"key":"D","html":"y(t)=∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>x(τ)dτ"}],"answer":"B","answerKey":"B","why":"t 时刻用到 t+1 的输入，即未来值，非因果。","source":"讲义提炼 · 第 1 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-30","id":"sig-extra-30"},{"ch":2,"no":"例2-1","kind":"short","group":"written","stem":"\u003cp>已知二阶系统 \u003cspan class=\"eq\">y″(t) + 6y′(t) + 8y(t) = x(t)，t &gt; 0\u003c/span>，初始状态 \u003cspan class=\"eq\">y(0) = 1，y′(0) = 2\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>。求系统的完全响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：写特征方程。\u003c/b>右端令 0：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s² + 6s + 8 = 0 ⟹ (s + 2)(s + 4) = 0 ⟹ s₁ = −2，s₂ = −4\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：写齐次解。\u003c/b>两个不等实根：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>h\u003c/sub>(t) = K₁e\u003csup>−2t\u003c/sup> + K₂e\u003csup>−4t\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：设特解。\u003c/b>输入是 \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>\u003c/span>，而 \u003cspan class=\"eq\">−1\u003c/span> 不是特征根，所以设同型：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>(t) = Ce\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>求导：\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>′ = −Ce\u003csup>−t\u003c/sup>，y\u003csub>p\u003c/sub>″ = Ce\u003csup>−t\u003c/sup>\u003c/span>，代入原方程：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Ce\u003csup>−t\u003c/sup> + 6(−Ce\u003csup>−t\u003c/sup>) + 8Ce\u003csup>−t\u003c/sup> = (1 − 6 + 8)Ce\u003csup>−t\u003c/sup> = 3Ce\u003csup>−t\u003c/sup> = e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>所以 \u003cspan class=\"eq\">C = 1/3\u003c/span>，即 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = ⅓e\u003csup>−t\u003c/sup>\u003c/span>。\u003c/p>\u003cp>\u003cb>第四步：用初始条件定 K₁、K₂。\u003c/b>全解：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = K₁e\u003csup>−2t\u003c/sup> + K₂e\u003csup>−4t\u003c/sup> + ⅓e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>代入 \u003cspan class=\"eq\">y(0) = 1\u003c/span>：\u003cspan class=\"eq\">K₁ + K₂ + ⅓ = 1 ⟹ K₁ + K₂ = 2/3\u003c/span>。\u003c/p>\u003cp>先求导再代 \u003cspan class=\"eq\">y′(0) = 2\u003c/span>：\u003cspan class=\"eq\">y′ = −2K₁e\u003csup>−2t\u003c/sup> − 4K₂e\u003csup>−4t\u003c/sup> − ⅓e\u003csup>−t\u003c/sup>\u003c/span>，于是 \u003cspan class=\"eq\">−2K₁ − 4K₂ − ⅓ = 2\u003c/span>，即 \u003cspan class=\"eq\">2K₁ + 4K₂ = −7/3\u003c/span>。\u003c/p>\u003cp>联立解得 \u003cspan class=\"eq\">K₁ = 5/2，K₂ = −11/6\u003c/span>。最终：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">5\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">11\u003c/span>\u003cspan class=\"fd\">6\u003c/span>\u003c/span>e\u003csup>−4t\u003c/sup> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">3\u003c/span>\u003c/span>e\u003csup>−t\u003c/sup>，　t &gt; 0\u003c/span>\u003c/div>\u003cp>\u003cb>检查（考场必做，10 秒）：\u003c/b>代 \u003cspan class=\"eq\">t=0\u003c/span>：\u003cspan class=\"eq\">2.5 − 1.833 + 0.333 = 1\u003c/span> ✓；求导代 0：\u003cspan class=\"eq\">−5 + 7.333 − 0.333 = 2\u003c/span> ✓。两个初始条件都对上，答案就稳了。\u003c/p>","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-1　求完全响应（课堂原题，完整版）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：写特征方程。","第二步：写齐次解。","第三步：设特解。","第四步：用初始条件定 K₁、K₂。","检查（考场必做，10 秒）："],"title":"例 2-1　求完全响应（课堂原题，完整版）","id":"signals-例2-1","points":["第一步：写特征方程。","第二步：写齐次解。","第三步：设特解。","第四步：用初始条件定 K₁、K₂。","检查（考场必做，10 秒）："]},{"ch":2,"no":"例2-2","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">y″ + 3y′ + 2y = e\u003csup>−t\u003c/sup>\u003c/span> 的特解。\u003c/p>","options":[],"answer":"\u003cp>特征根是 \u003cspan class=\"eq\">s = −1, −2\u003c/span>。输入 \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>\u003c/span> 的指数 \u003cspan class=\"eq\">−1\u003c/span>\u003cb>正好是特征根\u003c/b>，如果还设 \u003cspan class=\"eq\">Ae\u003csup>−t\u003c/sup>\u003c/span>，代进去会得到 0 = e\u003csup>−t\u003c/sup>，无解。所以要乘一个 t：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = Ate\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>求导：\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>′ = A(1 − t)e\u003csup>−t\u003c/sup>，y\u003csub>p\u003c/sub>″ = A(t − 2)e\u003csup>−t\u003c/sup>\u003c/span>，代入：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A[(t − 2) + 3(1 − t) + 2t]e\u003csup>−t\u003c/sup> = A·1·e\u003csup>−t\u003c/sup> = e\u003csup>−t\u003c/sup> ⟹ A = 1\u003c/span>\u003c/div>\u003cp>所以 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = te\u003csup>−t\u003c/sup>\u003c/span>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>规律：\u003c/b>激励的指数是几重根，就乘 \u003cspan class=\"eq\">t\u003c/span> 的几次方。单根乘 t，二重根乘 t²。这一步漏乘，整道题 0 分。","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-2　“撞根”怎么办","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 2-2　“撞根”怎么办","id":"signals-例2-2","points":["特征根是 s = −1, −2","输入 e−t 的指数 −1正好是特征根，如果还设 Ae−t，代进去会得到 0 = e−t，无解","所以要乘一个 t：yp = Ate−t求导：yp′ = A(1 − t)e−t，yp″ = A(t − 2)e−t，代入：A[(t − 2) + 3(1 − t) + 2t]e−t = A·1·e−t = e−t ⟹ A = 1所以 yp = te−t","规律：激励的指数是几重根，就乘 t 的几次方"]},{"ch":2,"no":"例2-3","kind":"short","group":"written","stem":"\u003cp>系统方程 \u003cspan class=\"eq\">y″ + 3y′ + 2y = x(t)\u003c/span>，初始状态 \u003cspan class=\"eq\">y(0) = 1，y′(0) = 0\u003c/span>。求零输入响应。\u003c/p>","options":[],"answer":"\u003cp>零输入 → 右端为 0。特征方程 \u003cspan class=\"eq\">s² + 3s + 2 = 0\u003c/span>，根为 \u003cspan class=\"eq\">−1, −2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> = K₁e\u003csup>−t\u003c/sup> + K₂e\u003csup>−2t\u003c/sup>\u003c/span>\u003c/div>\u003cp>代入初始条件：\u003cspan class=\"eq\">K₁ + K₂ = 1\u003c/span>；\u003cspan class=\"eq\">−K₁ − 2K₂ = 0\u003c/span>。解得 \u003cspan class=\"eq\">K₁ = 2，K₂ = −1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>(t) = 2e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>，　t ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>物理意义：\u003c/b>系统一开始存了 1 个单位的“能量”，没有外界输入，它就按自己的两个固有频率慢慢衰减回 0。\u003c/p>","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-3　零输入响应","tags":["讲义例题"],"needsCheck":false,"steps":["物理意义："],"title":"例 2-3　零输入响应","id":"signals-例2-3","points":["零输入 → 右端为 0","特征方程 s² + 3s + 2 = 0，根为 −1, −2：yzi = K₁e−t + K₂e−2t代入初始条件：K₁ + K₂ = 1","−K₁ − 2K₂ = 0","解得 K₁ = 2，K₂ = −1：yzi(t) = 2e−t − e−2t，　t ≥ 0物理意义：系统一开始存了 1 个单位的“能量”，没有外界输入，它就按自己的两个固有频率慢慢衰减回 0"]},{"ch":2,"no":"例2-4","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">dy(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> + 3y(t) = 2x(t)，t &gt; 0\u003c/span>，求冲激响应 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：把 x 换成 δ，y 换成 h。\u003c/b>冲激响应的定义就是“零状态下输入 δ”：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′(t) + 3h(t) = 2δ(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：看特征根定形式。\u003c/b>特征根 \u003cspan class=\"eq\">s = −3\u003c/span>，所以 \u003cspan class=\"eq\">t&gt;0\u003c/span> 时右端为 0，解是指数衰减：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = Ae\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>这里乘 \u003cspan class=\"eq\">u(t)\u003c/span> 是因为系统因果，\u003cspan class=\"eq\">t&lt;0\u003c/span> 时还没有响应。\u003c/p>\u003cp>\u003cb>第三步：代回原方程定 A。\u003c/b>注意 \u003cspan class=\"eq\">u(t)\u003c/span> 求导会产生 δ：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′(t) = −3Ae\u003csup>−3t\u003c/sup>u(t) + Aδ(t)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′ + 3h = Aδ(t) + (−3A + 3A)e\u003csup>−3t\u003c/sup>u(t) = Aδ(t)\u003c/span>\u003c/div>\u003cp>要等于 \u003cspan class=\"eq\">2δ(t)\u003c/span>，所以 \u003cspan class=\"eq\">A = 2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = 2e\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>速记：\u003c/b>对 \u003cspan class=\"eq\">y′ + ay = bx\u003c/span>，直接有 \u003cspan class=\"eq\">h(t) = b·e\u003csup>−at\u003c/sup>u(t)\u003c/span>。考场上可以秒写，再用代回验证。","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-4　一阶系统求 h(t)（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：把 x 换成 δ，y 换成 h。","第二步：看特征根定形式。","第三步：代回原方程定 A。"],"title":"例 2-4　一阶系统求 h(t)（课堂原题）","id":"signals-例2-4","points":["第一步：把 x 换成 δ，y 换成 h。","第二步：看特征根定形式。","第三步：代回原方程定 A。"]},{"ch":2,"no":"例2-5","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">dy(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> + 6y(t) = 2x(t) + 3x′(t)，t &gt; 0\u003c/span>，求冲激响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>关键：右端出现 δ′，h(t) 里就要出现 δ(t)。\u003c/b>因为只有 δ 求导才能产生 δ′。所以设：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = Ae\u003csup>−6t\u003c/sup>u(t) + Bδ(t)\u003c/span>\u003c/div>\u003cp>求导（记住 \u003cspan class=\"eq\">u′ = δ\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h′ = −6Ae\u003csup>−6t\u003c/sup>u(t) + Aδ(t) + Bδ′(t)\u003c/span>\u003c/div>\u003cp>代入 \u003cspan class=\"eq\">h′ + 6h = 2δ + 3δ′\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Bδ′ + (A + 6B)δ + (−6A + 6A)e\u003csup>−6t\u003c/sup>u(t) = 3δ′ + 2δ\u003c/span>\u003c/div>\u003cp>比较两边 δ′ 与 δ 的系数：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">B = 3\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">A + 6B = 2 ⟹ A = 2 − 18 = −16\u003c/span>\u003c/li>\u003c/ul>\u003cp>所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = 3δ(t) − 16e\u003csup>−6t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>为什么会有 δ 项？\u003c/b>物理上，输入里的 \u003cspan class=\"eq\">x′\u003c/span> 相当于一个“无限陡的变化”，系统瞬间被“踹”了一下，输出在 t=0 处出现一个冲激。这是右端含导数系统的标志性现象。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>① 忘了设 \u003cspan class=\"eq\">Bδ(t)\u003c/span>，导致系数比较不出来；② 求导时漏掉 \u003cspan class=\"eq\">Aδ(t)\u003c/span> 这一项；③ 最后没有把 \u003cspan class=\"eq\">e\u003csup>−6t\u003c/sup>u(t)\u003c/span> 的系数整理干净。","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-5　右端有 x′ 的冲激响应（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["关键：右端出现 δ′，h(t) 里就要出现 δ(t)。","为什么会有 δ 项？"],"title":"例 2-5　右端有 x′ 的冲激响应（课堂原题）","id":"signals-例2-5","points":["关键：右端出现 δ′，h(t) 里就要出现 δ(t)。","为什么会有 δ 项？"]},{"ch":2,"no":"例2-6","kind":"short","group":"written","stem":"\u003cp>计算 \u003cspan class=\"eq\">2e\u003csup>−2t\u003c/sup>u(t) ∗ 3e\u003csup>−t\u003c/sup>u(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>先提常数，再按定义写：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 6\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> e\u003csup>−2τ\u003c/sup>u(τ)·e\u003csup>−(t−τ)\u003c/sup>u(t−τ)dτ\u003c/span>\u003c/div>\u003cp>\u003cb>定积分限：\u003c/b>两个 u 同时为 1 的条件是 \u003cspan class=\"eq\">τ &gt; 0\u003c/span> 且 \u003cspan class=\"eq\">t − τ &gt; 0\u003c/span>，即 \u003cspan class=\"eq\">0 &lt; τ &lt; t\u003c/span>。这要求 \u003cspan class=\"eq\">t &gt; 0\u003c/span>，否则没有重叠，结果为 0。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 6\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span> e\u003csup>−2τ\u003c/sup>e\u003csup>−t+τ\u003c/sup>dτ = 6e\u003csup>−t\u003c/sup>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span> e\u003csup>−τ\u003c/sup>dτ\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 6e\u003csup>−t\u003c/sup>(1 − e\u003csup>−t\u003c/sup>) = 6(e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)，　t &gt; 0\u003c/span>\u003c/div>\u003cp>最后乘上 \u003cspan class=\"eq\">u(t)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = 6(e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>用公式验算：\u003c/b>套表 0-2，\u003cspan class=\"eq\">α=−2, β=−1\u003c/span>，\u003cspan class=\"eq\">(e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)/(−1+2) = e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>\u003c/span>，再乘 6，一致 ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考场策略：\u003c/b>指数与指数卷积，\u003cb>直接套公式\u003c/b>，再用“t=0 时 y=0、t→∞ 时 y→0”粗验一下，比老老实实积分快得多。","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-6　指数卷积（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["定积分限：","用公式验算："],"title":"例 2-6　指数卷积（课堂原题）","id":"signals-例2-6","points":["定积分限：","用公式验算："]},{"ch":2,"no":"例2-7","kind":"short","group":"written","stem":"\u003cp>设 \u003cspan class=\"eq\">x(t) = u(t) − u(t−1)\u003c/span>，\u003cspan class=\"eq\">h(t) = u(t) − u(t−1)\u003c/span>，求 \u003cspan class=\"eq\">y = x ∗ h\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>两个都是“宽 1、高 1”的矩形。用图解法想：一个矩形不动，另一个翻转后从左往右滑，重叠面积先线性增大、再线性减小，所以结果是\u003cb>三角形\u003c/b>。\u003c/p>\u003cp>分段计算：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">0 ≤ t &lt; 1\u003c/span>：重叠长度是 \u003cspan class=\"eq\">t\u003c/span>，所以 \u003cspan class=\"eq\">y = t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 ≤ t &lt; 2\u003c/span>：重叠长度是 \u003cspan class=\"eq\">2 − t\u003c/span>，所以 \u003cspan class=\"eq\">y = 2 − t\u003c/span>；\u003c/li>\u003cli>其他：\u003cspan class=\"eq\">y = 0\u003c/span>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = t[0≤t&lt;1] + (2−t)[1≤t&lt;2]\u003c/span>\u003c/div>\u003cp>图形是底宽 2、高 1、顶点在 \u003cspan class=\"eq\">t=1\u003c/span> 的三角形。面积 = ½×2×1 = 1，正好等于两个矩形面积之积（1×1），可以用来验算。\u003c/p>\u003cdiv class=\"tip\">\u003cb>结论记牢：\u003c/b>两个宽 \u003cspan class=\"eq\">τ₁、τ₂\u003c/span> 的矩形卷积，结果是\u003cb>梯形\u003c/b>（等宽时退化成三角形），总宽度 \u003cspan class=\"eq\">τ₁+τ₂\u003c/span>，平台高度等于重叠区的面积。","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-7　矩形与矩形卷积","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 2-7　矩形与矩形卷积","id":"signals-例2-7","points":["两个都是“宽 1、高 1”的矩形","用图解法想：一个矩形不动，另一个翻转后从左往右滑，重叠面积先线性增大、再线性减小，所以结果是三角形","分段计算：0 ≤ t \u003c 1：重叠长度是 t，所以 y = t","1 ≤ t \u003c 2：重叠长度是 2 − t，所以 y = 2 − t"]},{"ch":2,"no":"例2-8","kind":"short","group":"written","stem":"\u003cp>设 \u003cspan class=\"eq\">x(t) = u(t) − u(t−2)\u003c/span>，\u003cspan class=\"eq\">h(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>，求 \u003cspan class=\"eq\">y = x ∗ h\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>积分限由 \u003cspan class=\"eq\">0 &lt; τ &lt; 2\u003c/span> 和 \u003cspan class=\"eq\">τ &lt; t\u003c/span> 共同决定，所以\u003cb>分两段\u003c/b>：\u003c/p>\u003cp>\u003cb>当 \u003cspan class=\"eq\">0 &lt; t &lt; 2\u003c/span>：\u003c/b>上限取 \u003cspan class=\"eq\">t\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−(t−τ)\u003c/sup>dτ = e\u003csup>−t\u003c/sup>(e\u003csup>t\u003c/sup> − 1) = 1 − e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>当 \u003cspan class=\"eq\">t ≥ 2\u003c/span>：\u003c/b>上限被截断在 2：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">2\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−(t−τ)\u003c/sup>dτ = e\u003csup>−t\u003c/sup>(e² − 1) = e\u003csup>−(t−2)\u003c/sup> − e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>合起来：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = (1 − e\u003csup>−t\u003c/sup>)[u(t) − u(t−2)] + (e\u003csup>−(t−2)\u003c/sup> − e\u003csup>−t\u003c/sup>)u(t−2)\u003c/span>\u003c/div>\u003cp>\u003cb>物理图像：\u003c/b>输入只持续 2 秒，输出在前 2 秒不断“充电”上升，输入撤掉后按 \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>\u003c/span> 的规律“放电”衰减。这就是一阶系统的充电—放电过程。\u003c/p>","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-8　带 u(t) 的截断卷积","tags":["讲义例题"],"needsCheck":false,"steps":["物理图像："],"title":"例 2-8　带 u(t) 的截断卷积","id":"signals-例2-8","points":["积分限由 0 \u003c τ \u003c 2 和 τ \u003c t 共同决定，所以分两段：当 0 \u003c t \u003c 2：上限取 t：y = ∫t0e−(t−τ)dτ = e−t(et − 1) = 1 − e−t当 t ≥ 2：上限被截断在 2：y = ∫20e−(t−τ)dτ = e−t(e² − 1) = e−(t−2) − e−t合起来：y(t) = (1 − e−t)[u(t) − u(t−2)] + (e−(t−2) − e−t)u(t−2)物理图像：输入只持续 2 秒，输出在前 2 秒不断“充电”上升，输入撤掉后按 e−t 的规律“放电”衰减","这就是一阶系统的充电—放电过程"]},{"ch":2,"no":"例2-9","kind":"short","group":"written","stem":"\u003cp>系统 \u003cspan class=\"eq\">y′(t) + 2y(t) = x(t)\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>，求零状态响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：求 h(t)。\u003c/b>由例 2-4 的速记公式（\u003cspan class=\"eq\">b=1, a=2\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：卷积。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = e\u003csup>−t\u003c/sup>u(t) ∗ e\u003csup>−2t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>套公式（\u003cspan class=\"eq\">α=−1, β=−2\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>−2t\u003c/sup> − e\u003csup>−t\u003c/sup>\u003c/span>\u003cspan class=\"fd\">−2 − (−1)\u003c/span>\u003c/span>u(t) = (e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：验算。\u003c/b>\u003cspan class=\"eq\">y(0)=0\u003c/span> ✓（零状态）；\u003cspan class=\"eq\">t→∞\u003c/span> 时 \u003cspan class=\"eq\">y→0\u003c/span> ✓（稳定系统）；代回方程也成立。\u003c/p>\u003cdiv class=\"tip\">\u003cb>三段式模板：\u003c/b>求 h(t) → 写卷积式定积分限 → 化简并标 \u003cspan class=\"eq\">u(t)\u003c/span>。\u003cb>每步都写出来，步骤分就到手了。\u003c/b>","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-9　完整求零状态响应","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：求 h(t)。","第二步：卷积。","第三步：验算。"],"title":"例 2-9　完整求零状态响应","id":"signals-例2-9","points":["第一步：求 h(t)。","第二步：卷积。","第三步：验算。"]},{"ch":2,"no":"例2-10","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">y(t)=x₁(t)∗x₂(t)\u003c/span>，不直接算卷积，写出 \u003cspan class=\"eq\">y′(t)\u003c/span> 和 \u003cspan class=\"eq\">y\u003csup>(−1)\u003c/sup>(t)=∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>y(τ)dτ\u003c/span>。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y′(t) = x₁′(t) ∗ x₂(t) = x₁(t) ∗ x₂′(t)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csup>(−1)\u003c/sup>(t) = x₁\u003csup>(−1)\u003c/sup>(t) ∗ x₂(t) = x₁(t) ∗ x₂\u003csup>(−1)\u003c/sup>(t)\u003c/span>\u003c/div>\u003cp>\u003cb>为什么可以「搬家」？\u003c/b>因为 \u003cspan class=\"eq\">(x₁∗x₂)′ = x₁∗(x₂′)\u003c/span>：卷积里求导可以任意放到其中一个信号上。\u003cb>哪个信号好求导就对哪个动手\u003c/b>——矩形脉冲求导只剩两个冲激，卷积立刻变成「两个平移的波形相加」，比算积分快得多。\u003c/p>","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-10　用微分/积分性质求 y′ 与 y(−1)（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["为什么可以「搬家」？"],"title":"例 2-10　用微分/积分性质求 y′ 与 y(−1)（课件原题）","id":"signals-例2-10","points":["y′(t) = x₁′(t) ∗ x₂(t) = x₁(t) ∗ x₂′(t)y(−1)(t) = x₁(−1)(t) ∗ x₂(t) = x₁(t) ∗ x₂(−1)(t)为什么可以「搬家」？因为 (x₁∗x₂)′ = x₁∗(x₂′)：卷积里求导可以任意放到其中一个信号上","哪个信号好求导就对哪个动手——矩形脉冲求导只剩两个冲激，卷积立刻变成「两个平移的波形相加」，比算积分快得多"]},{"ch":2,"no":"例2-11","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">M₁+M₂+1\u003c/span> 点滑动平均系统 \u003cspan class=\"eq\">y[k] = (1/(M₁+M₂+1))\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">M₂\u003c/span>\u003cspan class=\"l\">n=−M₁\u003c/span>\u003c/span>\u003c/span>x[k+n]\u003c/span>，判断是否因果、是否稳定。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>因果：\u003c/b>系统用到了 \u003cspan class=\"eq\">x[k+M₂]\u003c/span>，即\u003cb>未来的输入\u003c/b>。只有当 \u003cspan class=\"eq\">M₁ = 0\u003c/span> 时（只用 x[k] 及以前的值）才因果。\u003c/p>\u003cp>\u003cb>稳定：\u003c/b>冲激响应是长度 \u003cspan class=\"eq\">M₁+M₂+1\u003c/span>、幅度 \u003cspan class=\"eq\">1/(M₁+M₂+1)\u003c/span> 的矩形序列，绝对值之和 = 1 &lt; ∞，\u003cb>恒稳定\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>结论记牢：\u003c/b>任何\u003cb>有限长（FIR）冲激响应\u003c/b>系统，只要系数有限，就一定稳定；但不一定因果（要看起点是否为负）。课件判断题「任何有限长冲激响应系统都一定是因果系统」答案是\u003cb>错\u003c/b>。","answerKey":"","why":"","source":"讲义第 2 章 · 例 2-11　滑动平均系统的因果性（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["因果：","稳定："],"title":"例 2-11　滑动平均系统的因果性（课件原题）","id":"signals-例2-11","points":["因果：","稳定："]},{"ch":2,"no":"B-1","kind":"short","group":"written","stem":"\u003cp>已知系统 \u003cspan class=\"eq\">y′(t) + 2y(t) = x(t)\u003c/span>，初始条件 \u003cspan class=\"eq\">y(0) = 2\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>。用经典法求完全响应 \u003cspan class=\"eq\">y(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>① 齐次解（3 分）：\u003c/b>特征方程 \u003cspan class=\"eq\">s + 2 = 0 → s = −2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>h\u003c/sub> = Ke\u003csup>−2t\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>② 特解（4 分）：\u003c/b>设 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = Ce\u003csup>−t\u003c/sup>\u003c/span>，代入：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">−Ce\u003csup>−t\u003c/sup> + 2Ce\u003csup>−t\u003c/sup> = Ce\u003csup>−t\u003c/sup> = e\u003csup>−t\u003c/sup> ⟹ C = 1\u003c/span>\u003c/div>\u003cp>\u003cb>③ 定常数（4 分）：\u003c/b>\u003cspan class=\"eq\">y(0) = K + 1 = 2 ⟹ K = 1\u003c/span>。\u003c/p>\u003cp>\u003cb>④ 结果（1 分）：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = (e\u003csup>−t\u003c/sup> + e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y(0)=2\u003c/span> ✓；代回：\u003cspan class=\"eq\">y′+2y = (−e\u003csup>−t\u003c/sup>−2e\u003csup>−2t\u003c/sup>) + 2(e\u003csup>−t\u003c/sup>+e\u003csup>−2t\u003c/sup>) = e\u003csup>−t\u003c/sup>\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>步骤分提示：\u003c/b>即使特解算错，只要齐次解形式和“代初值”的动作写出来，12 分里至少能拿 7 分。\u003cb>千万不要只写一个答案。\u003c/b>","answerKey":"","why":"","source":"自测卷 B · 1","tags":["自测卷 B","一阶系统完全响应（12 分）"],"needsCheck":false,"title":"一阶系统完全响应（12 分）","id":"signals-B-1","points":["① 齐次解（3 分）：","② 特解（4 分）：","③ 定常数（4 分）：","④ 结果（1 分）：","验算："]},{"ch":2,"no":"B-2","kind":"short","group":"written","stem":"\u003cp>系统方程 \u003cspan class=\"eq\">y″(t) + 5y′(t) + 6y(t) = x′(t) + 2x(t)\u003c/span>，求冲激响应 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>① 先求“右端只有 x”的 h₁（5 分）。\u003c/b>特征根 \u003cspan class=\"eq\">−2, −3\u003c/span>，设 \u003cspan class=\"eq\">h₁ = (C₁e\u003csup>−2t\u003c/sup> + C₂e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>。由 \u003cspan class=\"eq\">h₁(0⁺)=0，h₁′(0⁺)=1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C₁ + C₂ = 0，　−2C₁ − 3C₂ = 1 ⟹ C₁ = 1，C₂ = −1\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h₁(t) = (e\u003csup>−2t\u003c/sup> − e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>② 用线性组合求 h（5 分）。\u003c/b>右端是 \u003cspan class=\"eq\">x′ + 2x\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h = h₁′ + 2h₁\u003c/span>\u003c/div>\u003cp>先求导（注意 \u003cspan class=\"eq\">t=0\u003c/span> 处系数为 0，不产生 δ 项）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h₁′ = (−2e\u003csup>−2t\u003c/sup> + 3e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>代入：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h = [(−2+2)e\u003csup>−2t\u003c/sup> + (3−2)e\u003csup>−3t\u003c/sup>]u(t) = e\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>③ 验算（2 分）。\u003c/b>\u003cspan class=\"eq\">h = e\u003csup>−3t\u003c/sup>u\u003c/span>，\u003cspan class=\"eq\">h′ = −3e\u003csup>−3t\u003c/sup>u + δ\u003c/span>，\u003cspan class=\"eq\">h″ = 9e\u003csup>−3t\u003c/sup>u − 3δ + δ′\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h″ + 5h′ + 6h = δ′ + (−3+5)δ + (9−15+6)e\u003csup>−3t\u003c/sup>u = δ′ + 2δ\u003c/span>\u003c/div>\u003cp>正好等于 \u003cspan class=\"eq\">x′ + 2x\u003c/span> 在 \u003cspan class=\"eq\">x=δ\u003c/span> 时的值 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>很多人直接设 \u003cspan class=\"eq\">h = Ae\u003csup>−2t\u003c/sup> + Be\u003csup>−3t\u003c/sup>\u003c/span>，忽略了右端的 \u003cspan class=\"eq\">x′\u003c/span>。只要右端最高阶导数与左端同阶，h 里就可能出现 \u003cspan class=\"eq\">δ\u003c/span> 项，必须先判断。","answerKey":"","why":"","source":"自测卷 B · 2","tags":["自测卷 B","求冲激响应（12 分）"],"needsCheck":false,"title":"求冲激响应（12 分）","id":"signals-B-2","points":["① 先求“右端只有 x”的 h₁（5 分）。","② 用线性组合求 h（5 分）。","③ 验算（2 分）。"]},{"ch":2,"no":"B-6","kind":"short","group":"written","stem":"\u003cp>设 \u003cspan class=\"eq\">x(t) = u(t) − u(t−1)\u003c/span>，\u003cspan class=\"eq\">h(t) = u(t) − u(t−2)\u003c/span>。求 \u003cspan class=\"eq\">y = x ∗ h\u003c/span>，并画出波形。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>① 定重叠区间（5 分）。\u003c/b>\u003cspan class=\"eq\">x\u003c/span> 在 \u003cspan class=\"eq\">[0,1]\u003c/span> 非零，\u003cspan class=\"eq\">h(t−τ)\u003c/span> 在 \u003cspan class=\"eq\">t−2 &lt; τ &lt; t\u003c/span> 非零。两者重叠要求：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">max(0, t−2) &lt; τ &lt; min(1, t)\u003c/span>\u003c/div>\u003cp>由此定出分界点 \u003cspan class=\"eq\">t = 0, 1, 2, 3\u003c/span>，共四段。\u003c/p>\u003cp>\u003cb>② 分段积分（6 分）。\u003c/b>被积函数是 1×1 = 1，所以 \u003cspan class=\"eq\">y(t)\u003c/span> 就是重叠区间的\u003cb>长度\u003c/b>：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">t &lt; 0\u003c/span>：无重叠，\u003cspan class=\"eq\">y = 0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">0 ≤ t &lt; 1\u003c/span>：重叠 \u003cspan class=\"eq\">[0, t]\u003c/span>，长度 \u003cspan class=\"eq\">t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 ≤ t &lt; 2\u003c/span>：完全覆盖 \u003cspan class=\"eq\">x\u003c/span>，长度 1；\u003c/li>\u003cli>\u003cspan class=\"eq\">2 ≤ t &lt; 3\u003c/span>：重叠 \u003cspan class=\"eq\">[t−2, 1]\u003c/span>，长度 \u003cspan class=\"eq\">3 − t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">t ≥ 3\u003c/span>：无重叠，\u003cspan class=\"eq\">y = 0\u003c/span>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = \u003cspan style=\"display:inline-block;text-align:left;vertical-align:middle;line-height:1.65\">t，　0 ≤ t &lt; 1\u003cbr>1，　1 ≤ t &lt; 2\u003cbr>3 − t，　2 ≤ t &lt; 3\u003cbr>0，　其他\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>③ 画图（2 分）。\u003c/b>上升段（斜率 1）→ 平台（高 1）→ 下降段（斜率 −1），是一个\u003cb>梯形\u003c/b>。\u003c/p>\u003cp>\u003cb>④ 验算（2 分）。\u003c/b>面积 = \u003cspan class=\"eq\">½(1+3)×1 = 2\u003c/span>，等于两个矩形面积之积 \u003cspan class=\"eq\">1×2 = 2\u003c/span> ✓；总宽度 \u003cspan class=\"eq\">1+2 = 3\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>规律总结：\u003c/b>两个矩形卷积 → 梯形；等宽 → 三角形；一个宽一个窄 → 梯形（平台高度 = 窄矩形的面积）。\u003cb>把这张“形状表”背下来，画图题直接秒。\u003c/b>","answerKey":"","why":"","source":"自测卷 B · 6","tags":["自测卷 B","卷积与分段（15 分）"],"needsCheck":false,"title":"卷积与分段（15 分）","id":"signals-B-6","points":["① 定重叠区间（5 分）。","② 分段积分（6 分）。","③ 画图（2 分）。","④ 验算（2 分）。"]},{"ch":2,"no":"题-1","kind":"short","group":"written","stem":"\u003cp>某 LTI 系统，输入 \u003cspan class=\"eq\">f(t)\u003c/span> 时完全响应为 \u003cspan class=\"eq\">(3sin t − 2cos t)u(t)\u003c/span>；输入 \u003cspan class=\"eq\">2f(t)\u003c/span> 时完全响应为 \u003cspan class=\"eq\">(5sin t + cos t)u(t)\u003c/span>。求输入 \u003cspan class=\"eq\">3f(t)\u003c/span> 时的完全响应（初始状态始终不变）。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>关键：\u003c/b>完全响应 = 零输入响应（与输入无关）+ 零状态响应（与输入成正比）。设 \u003cspan class=\"eq\">y = y\u003csub>zi\u003c/sub> + k·y\u003csub>zs0\u003c/sub>\u003c/span>，其中 \u003cspan class=\"eq\">k\u003c/span> 是输入倍数。\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k=1\u003c/span>：\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> + y\u003csub>zs0\u003c/sub> = 3sin t − 2cos t\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">k=2\u003c/span>：\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> + 2y\u003csub>zs0\u003c/sub> = 5sin t + cos t\u003c/span>。\u003c/li>\u003c/ul>\u003cp>两式相减得 \u003cspan class=\"eq\">y\u003csub>zs0\u003c/sub> = 2sin t + 3cos t\u003c/span>，代回得 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> = sin t − 5cos t\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">k=3：y = y\u003csub>zi\u003c/sub> + 3y\u003csub>zs0\u003c/sub> = (sin t − 5cos t) + (6sin t + 9cos t) = (7sin t + 4cos t)u(t)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>套路：\u003c/b>把「完全响应」看成 \u003cspan class=\"eq\">k\u003c/span> 的一次函数 \u003cspan class=\"eq\">y(k)=a+bk\u003c/span>，两组数据解出 \u003cspan class=\"eq\">a,b\u003c/span>，再代 k=3。\u003cb>千万别把完全响应直接乘 3\u003c/b>——零输入那部分不随输入变。","answerKey":"","why":"","source":"课件复习题精选 · 1","tags":["课件复习题精选","全响应的线性分解（L04 / L13 反复出现）"],"needsCheck":false,"title":"全响应的线性分解（L04 / L13 反复出现）","id":"signals-题-1","points":["关键：完全响应 = 零输入响应（与输入无关）+ 零状态响应（与输入成正比）","设 y = yzi + k·yzs0，其中 k 是输入倍数","k=1：yzi + yzs0 = 3sin t − 2cos t","k=2：yzi + 2yzs0 = 5sin t + cos t"]},{"ch":2,"no":"题-2","kind":"short","group":"written","stem":"\u003cp>某系统 \u003cspan class=\"eq\">y′(t)+3y(t)=2f′(t)\u003c/span>，求其阶跃响应 \u003cspan class=\"eq\">g(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>阶跃响应 = 输入 \u003cspan class=\"eq\">u(t)\u003c/span> 时的零状态输出，此时 \u003cspan class=\"eq\">f′(t)=δ(t)\u003c/span>。右端变成 \u003cspan class=\"eq\">2δ(t)\u003c/span>。\u003c/p>\u003cp>由第 2 章一阶系统的速记公式 \u003cspan class=\"eq\">y′+ay=bx ⟹ h(t)=b e\u003csup>−at\u003c/sup>u(t)\u003c/span>，这里 \u003cspan class=\"eq\">a=3, b=2\u003c/span>，故：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = 2e\u003csup>−3t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>但注意：\u003cspan class=\"eq\">h(t)\u003c/span> 是\u003cb>冲激响应\u003c/b>，题目要的是\u003cb>阶跃响应\u003c/b>。由 \u003cspan class=\"eq\">g(t)=∫h\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">g(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>2e\u003csup>−3τ\u003c/sup>dτ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">3\u003c/span>\u003c/span>(1 − e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>陷阱：\u003c/b>课件选项是 \u003cspan class=\"eq\">2e\u003csup>−3t\u003c/sup>u(t)\u003c/span> 之类，很多人直接选了 h(t)。\u003cb>看清问的是 h 还是 g\u003c/b>：h 是 δ 输入的响应，g 是 u 输入的响应，两者相差一次积分。","answerKey":"","why":"","source":"课件复习题精选 · 2","tags":["课件复习题精选","由阶跃响应反推微分方程（L05 复习题）"],"needsCheck":false,"title":"由阶跃响应反推微分方程（L05 复习题 (t−τ)：先换元、再反转、再平移 t、最后对 τ 积分。","source":"讲义提炼 · 第 2 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-12","id":"sig-extra-12"},{"ch":2,"kind":"choice","group":"objective","stem":"微分方程 y″+5y′+6y=x(t)，若激励 x(t)=e\u003csup>−2t\u003c/sup>u(t)，特解应设为（　）。","options":[{"key":"A","html":"Ae\u003csup>−2t\u003c/sup>"},{"key":"B","html":"Ate\u003csup>−2t\u003c/sup>"},{"key":"C","html":"At²e\u003csup>−2t\u003c/sup>"},{"key":"D","html":"A"}],"answer":"B","answerKey":"B","why":"−2 是特征单根，直接设 Ae^{−2t} 代入会得 0=激励，必须乘 t。","source":"讲义提炼 · 第 2 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-31","id":"sig-extra-31"},{"ch":2,"kind":"choice","group":"objective","stem":"求零输入响应时，待定常数应代入（　）。","options":[{"key":"A","html":"y(0⁺)"},{"key":"B","html":"y(0⁻)"},{"key":"C","html":"y(∞)"},{"key":"D","html":"任意时刻的值"}],"answer":"B","answerKey":"B","why":"零输入响应由初始状态决定，用 0⁻ 值；0⁺ 值含冲激跳变，不能直接用。","source":"讲义提炼 · 第 2 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-32","id":"sig-extra-32"},{"ch":3,"no":"例3-1","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">y[k] − 0.5y[k−1] = u[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 1\u003c/span>，用迭代法求解。\u003c/p>","options":[],"answer":"\u003cp>整理成 \u003cspan class=\"eq\">y[k] = 0.5y[k−1] + u[k]\u003c/span>，逐项算：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">y[0] = 0.5×1 + 1 = 1.5\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">y[1] = 0.5×1.5 + 1 = 1.75\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">y[2] = 0.5×1.75 + 1 = 1.875\u003c/span>\u003c/li>\u003c/ul>\u003cp>规律：每次都在上一项基础上“减半再加 1”，结果越来越接近 2。写成闭式就是：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = 2 − 0.5\u003csup>k+1\u003c/sup>，　k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>验证：\u003c/b>k=0 时 \u003cspan class=\"eq\">2−0.5=1.5\u003c/span> ✓。这个“稳态值 2、暂态按 0.5 衰减”的结构，就是一阶离散系统的典型响应。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考试技巧：\u003c/b>迭代法不用求通解，特别适合“求 y[0]～y[3]”这类小题，3 分钟拿满分。但要求通项公式时，还是得用经典法或 Z 变换。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-1　迭代法（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["验证："],"title":"例 3-1　迭代法（课堂原题）","id":"signals-例3-1","points":["整理成 y[k] = 0.5y[k−1] + u[k]，逐项算：y[0] = 0.5×1 + 1 = 1.5y[1] = 0.5×1.5 + 1 = 1.75y[2] = 0.5×1.75 + 1 = 1.875规律：每次都在上一项基础上“减半再加 1”，结果越来越接近 2","写成闭式就是：y[k] = 2 − 0.5k+1，　k ≥ 0验证：k=0 时 2−0.5=1.5 ✓","这个“稳态值 2、暂态按 0.5 衰减”的结构，就是一阶离散系统的典型响应","考试技巧：迭代法不用求通解，特别适合“求 y[0]～y[3]”这类小题，3 分钟拿满分"]},{"ch":3,"no":"例3-2","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">y[k] + 3y[k−1] + 2y[k−2] = x[k]\u003c/span>，初始状态 \u003cspan class=\"eq\">y[−1] = 0，y[−2] = 1/2\u003c/span>。求零输入响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>特征方程：\u003c/b>把 \u003cspan class=\"eq\">y[k−i]\u003c/span> 换成 \u003cspan class=\"eq\">s\u003csup>−i\u003c/sup>\u003c/span>，两边乘 \u003cspan class=\"eq\">s²\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s² + 3s + 2 = 0 ⟹ s₁ = −1，s₂ = −2\u003c/span>\u003c/div>\u003cp>所以 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = C₁(−1)\u003csup>k\u003c/sup> + C₂(−2)\u003csup>k\u003c/sup>\u003c/span>。\u003c/p>\u003cp>\u003cb>代初始状态（注意 k 是负数）：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k = −1\u003c/span>：\u003cspan class=\"eq\">−C₁ − C₂/2 = 0\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k = −2\u003c/span>：\u003cspan class=\"eq\">C₁ + C₂/4 = 1/2\u003c/span>\u003c/li>\u003c/ul>\u003cp>解得 \u003cspan class=\"eq\">C₁ = 1，C₂ = −2\u003c/span>，于是：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = [(−1)\u003csup>k\u003c/sup> − 2(−2)\u003csup>k\u003c/sup>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>由原方程 \u003cspan class=\"eq\">y[0] = −3y[−1] − 2y[−2] = 0 − 1 = −1\u003c/span>；公式给 \u003cspan class=\"eq\">1 − 2 = −1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>代入的是 \u003cspan class=\"eq\">k = −1, −2\u003c/span>，不是 \u003cspan class=\"eq\">k = 0, 1\u003c/span>！题目给的是“初始状态”，也就是输入接入前的值。这一步每年都有人错。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-2　零输入响应（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["特征方程：","代初始状态（注意 k 是负数）：","验算："],"title":"例 3-2　零输入响应（课堂原题）","id":"signals-例3-2","points":["特征方程：","代初始状态（注意 k 是负数）：","验算："]},{"ch":3,"no":"例3-3","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y[k] + 4y[k−1] + 4y[k−2] = x[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 0，y[−2] = −1\u003c/span>，求零输入响应。\u003c/p>","options":[],"answer":"\u003cp>特征方程 \u003cspan class=\"eq\">s² + 4s + 4 = (s+2)² = 0\u003c/span>，\u003cb>二重根\u003c/b>\u003cspan class=\"eq\">s = −2\u003c/span>。重根要乘 \u003cspan class=\"eq\">k\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = (C₁ + C₂k)(−2)\u003csup>k\u003c/sup>\u003c/span>\u003c/div>\u003cp>代入：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k=−1\u003c/span>：\u003cspan class=\"eq\">(C₁ − C₂)(−½) = 0 ⟹ C₁ = C₂\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k=−2\u003c/span>：\u003cspan class=\"eq\">(C₁ − 2C₂)(¼) = −1 ⟹ C₁ − 2C₂ = −4\u003c/span>\u003c/li>\u003c/ul>\u003cp>联立得 \u003cspan class=\"eq\">C₁ = C₂ = 4\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = 4(1 + k)(−2)\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y[0] = −4y[−1] − 4y[−2] = 0 + 4 = 4\u003c/span>，公式给 \u003cspan class=\"eq\">4×1×1 = 4\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>为什么重根要乘 k？\u003c/b>因为两个根重合时，\u003cspan class=\"eq\">C₁(−2)\u003csup>k\u003c/sup> + C₂(−2)\u003csup>k\u003c/sup>\u003c/span> 其实只有一个独立常数，凑不出两个初始条件，必须再借一个 \u003cspan class=\"eq\">k(−2)\u003csup>k\u003c/sup>\u003c/span>。这和连续系统重根乘 t 是同一个道理。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-3　重根情形","tags":["讲义例题"],"needsCheck":false,"steps":["验算："],"title":"例 3-3　重根情形","id":"signals-例3-3","points":["特征方程 s² + 4s + 4 = (s+2)² = 0，二重根s = −2","重根要乘 k：yzi[k] = (C₁ + C₂k)(−2)k代入：k=−1：(C₁ − C₂)(−½) = 0 ⟹ C₁ = C₂k=−2：(C₁ − 2C₂)(¼) = −1 ⟹ C₁ − 2C₂ = −4联立得 C₁ = C₂ = 4：yzi[k] = 4(1 + k)(−2)ku[k]验算：y[0] = −4y[−1] − 4y[−2] = 0 + 4 = 4，公式给 4×1×1 = 4 ✓","为什么重根要乘 k？因为两个根重合时，C₁(−2)k + C₂(−2)k 其实只有一个独立常数，凑不出两个初始条件，必须再借一个 k(−2)k","这和连续系统重根乘 t 是同一个道理"]},{"ch":3,"no":"例3-4","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y[k] − 0.5y[k−1] + y[k−2] − 0.5y[k−3] = x[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 2，y[−2] = −1，y[−3] = 8\u003c/span>，求零输入响应。\u003c/p>","options":[],"answer":"\u003cp>特征方程：\u003cspan class=\"eq\">s³ − 0.5s² + s − 0.5 = 0\u003c/span>。分组分解：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s²(s − 0.5) + (s − 0.5) = (s − 0.5)(s² + 1) = 0\u003c/span>\u003c/div>\u003cp>三个根：\u003cspan class=\"eq\">s₁ = 0.5，s₂ = j，s₃ = −j\u003c/span>。共轭根对应 \u003cspan class=\"eq\">cos(πk/2)\u003c/span> 与 \u003cspan class=\"eq\">sin(πk/2)\u003c/span>（因为 \u003cspan class=\"eq\">|j|=1，arg j = π/2\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = C₁(0.5)\u003csup>k\u003c/sup> + C₂cos\u003cspan class=\"fr\">\u003cspan class=\"fn\">πk\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> + C₃sin\u003cspan class=\"fr\">\u003cspan class=\"fn\">πk\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>代入三个初始状态（注意 \u003cspan class=\"eq\">cos(−π/2)=0，sin(−π/2)=−1，cos(−π)=−1，sin(−π)=0\u003c/span>）：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">k=−1\u003c/span>：\u003cspan class=\"eq\">2C₁ − C₃ = 2\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k=−2\u003c/span>：\u003cspan class=\"eq\">4C₁ − C₂ = −1\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">k=−3\u003c/span>：\u003cspan class=\"eq\">8C₁ + C₃ = 8\u003c/span>\u003c/li>\u003c/ul>\u003cp>解得 \u003cspan class=\"eq\">C₁ = 1，C₂ = 5，C₃ = 0\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = [(0.5)\u003csup>k\u003c/sup> + 5cos\u003cspan class=\"fr\">\u003cspan class=\"fn\">πk\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y[0] = 1 + 5 = 6\u003c/span>；由方程 \u003cspan class=\"eq\">y[0] = 0.5(2) − (−1) + 0.5(8) = 1 + 1 + 4 = 6\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>看到复根不要慌：\u003c/b>只要根是 \u003cspan class=\"eq\">re\u003csup>±jθ\u003c/sup>\u003c/span>，就写 \u003cspan class=\"eq\">r\u003csup>k\u003c/sup>(A cos θk + B sin θk)\u003c/span>。这里 \u003cspan class=\"eq\">r=1, θ=π/2\u003c/span>，所以是 \u003cspan class=\"eq\">cos(πk/2)\u003c/span> 这种“0, 1, 0, −1”循环的序列。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-4　共轭复根（三阶）","tags":["讲义例题"],"needsCheck":false,"steps":["验算："],"title":"例 3-4　共轭复根（三阶）","id":"signals-例3-4","points":["特征方程：s³ − 0.5s² + s − 0.5 = 0","分组分解：s²(s − 0.5) + (s − 0.5) = (s − 0.5)(s² + 1) = 0三个根：s₁ = 0.5，s₂ = j，s₃ = −j","共轭根对应 cos(πk/2) 与 sin(πk/2)（因为 |j|=1，arg j = π/2）：yzi[k] = C₁(0.5)k + C₂cosπk2 + C₃sinπk2代入三个初始状态（注意 cos(−π/2)=0，sin(−π/2)=−1，cos(−π)=−1，sin(−π)=0）：k=−1：2C₁ − C₃ = 2k=−2：4C₁ − C₂ = −1k=−3：8C₁ + C₃ = 8解得 C₁ = 1，C₂ = 5，C₃ = 0：yzi[k] = [(0.5)k + 5cosπk2]u[k]验算：y[0] = 1 + 5 = 6","由方程 y[0] = 0.5(2) − (−1) + 0.5(8) = 1 + 1 + 4 = 6 ✓"]},{"ch":3,"no":"例3-5","kind":"short","group":"written","stem":"\u003cp>因果 LTI 系统 \u003cspan class=\"eq\">y[k] + 3y[k−1] + 2y[k−2] = x[k]\u003c/span>，求单位脉冲响应 \u003cspan class=\"eq\">h[k]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：把 x 换成 δ。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] + 3h[k−1] + 2h[k−2] = δ[k]\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：k ≥ 0 时右端为 0\u003c/b>，解齐次方程，特征根 \u003cspan class=\"eq\">−1, −2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = C₁(−1)\u003csup>k\u003c/sup> + C₂(−2)\u003csup>k\u003c/sup>，　k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：用 k=0 的方程定“初始值”。\u003c/b>因为系统因果，\u003cspan class=\"eq\">h[−1] = h[−2] = 0\u003c/span>，代入 \u003cspan class=\"eq\">k=0\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[0] + 3h[−1] + 2h[−2] = δ[0] = 1 ⟹ h[0] = 1\u003c/span>\u003c/div>\u003cp>再用 \u003cspan class=\"eq\">k=−1\u003c/span> 的方程（右端 \u003cspan class=\"eq\">δ[−1]=0\u003c/span>）：\u003cspan class=\"eq\">h[−1] + 3h[−2] + 2h[−3] = 0\u003c/span>，恒成立，给不出新信息。改用 \u003cspan class=\"eq\">h[0]=1\u003c/span> 和 \u003cspan class=\"eq\">h[−1]=0\u003c/span>：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">C₁ + C₂ = 1\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"eq\">−C₁ − C₂/2 = 0 ⟹ C₁ = −C₂/2\u003c/span>\u003c/li>\u003c/ul>\u003cp>解得 \u003cspan class=\"eq\">C₂ = 2，C₁ = −1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = [−(−1)\u003csup>k\u003c/sup> + 2(−2)\u003csup>k\u003c/sup>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">h[0] = −1 + 2 = 1\u003c/span> ✓；\u003cspan class=\"eq\">h[1] = 1 − 4 = −3\u003c/span>，而迭代 \u003cspan class=\"eq\">h[1] = −3h[0] − 2h[−1] = −3\u003c/span> ✓。\u003c/p>","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-5　求 h[k]（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：把 x 换成 δ。","第二步：k ≥ 0 时右端为 0","第三步：用 k=0 的方程定“初始值”。","验算："],"title":"例 3-5　求 h[k]（课堂原题）","id":"signals-例3-5","points":["第一步：把 x 换成 δ。","第二步：k ≥ 0 时右端为 0","第三步：用 k=0 的方程定“初始值”。","验算："]},{"ch":3,"no":"例3-6","kind":"short","group":"written","stem":"\u003cp>计算 \u003cspan class=\"eq\">x[k] = {1, 0, 2, 4}\u003c/span> 与 \u003cspan class=\"eq\">h[k] = {1, 4, 5, 3}\u003c/span> 的卷积和（箭头都在第一个元素，即从 k=0 开始）。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>方法一：把 x 拆成冲激。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = δ[k] + 0·δ[k−1] + 2δ[k−2] + 4δ[k−3]\u003c/span>\u003c/div>\u003cp>利用 \u003cspan class=\"eq\">δ[k−n] ∗ h[k] = h[k−n]\u003c/span>（移位特性）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = h[k] + 2h[k−2] + 4h[k−3]\u003c/span>\u003c/div>\u003cp>逐项移位相加：\u003c/p>\u003ctable style=\"margin-top:6px\">\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">h[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1, 4, 5, 3\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">2h[k−2]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">0, 0, 2, 8, 10, 6\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">4h[k−3]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">0, 0, 0, 4, 16, 20, 12\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>相加\u003c/b>\u003c/td>\u003ctd>\u003cb>\u003cspan class=\"eq\">1, 4, 7, 15, 26, 26, 12\u003c/span>\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cb>方法二：竖式乘法\u003c/b>（和多项式乘法一模一样，考试时更快）：\u003c/p>\u003cdiv class=\"formula\" style=\"text-align:left;display:inline-block;margin-left:20px\">\u003cspan class=\"eq\">　　1　4　5　3\u003cbr>\n×　1　0　2　4\u003cbr>\n————————————\u003cbr>\n　　4　16　20　12\u003cbr>\n　2　8　10　6\u003cbr>\n1　4　5　3\u003cbr>\n————————————\u003cbr>\n1　4　7　15　26　26　12\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>长度 \u003cspan class=\"eq\">4+4−1 = 7\u003c/span> ✓；首项 \u003cspan class=\"eq\">1×1=1\u003c/span> ✓；末项 \u003cspan class=\"eq\">4×3=12\u003c/span> ✓；总和 \u003cspan class=\"eq\">(1+0+2+4)(1+4+5+3)=7×13=91\u003c/span>，而 \u003cspan class=\"eq\">1+4+7+15+26+26+12=91\u003c/span> ✓。三个检查全过，答案必对。\u003c/p>\u003cdiv class=\"tip\">\u003cb>卷积结果的长度：\u003c/b>\u003cspan class=\"eq\">L = L₁ + L₂ − 1\u003c/span>。这是最快的自查手段，算出 8 项一定是错的。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-6　有限长序列卷积（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["方法一：把 x 拆成冲激。","方法二：竖式乘法","验算："],"title":"例 3-6　有限长序列卷积（课堂原题）","id":"signals-例3-6","points":["方法一：把 x 拆成冲激。","方法二：竖式乘法","验算："]},{"ch":3,"no":"例3-7","kind":"short","group":"written","stem":"\u003cp>设 \u003cspan class=\"eq\">R\u003csub>N\u003c/sub>[k] = 1（0 ≤ k ≤ N−1），其他为 0\u003c/span>。求 \u003cspan class=\"eq\">y[k] = R\u003csub>N\u003c/sub>[k] ∗ R\u003csub>N\u003c/sub>[k]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>两个长度为 N 的“矩形序列”卷积，结果是\u003cb>三角形\u003c/b>，总长度 \u003cspan class=\"eq\">2N−1\u003c
