\u003c/span> 一致 ✓。\u003c/p>\u003cp>\u003cb>终值：\u003c/b>\u003cspan class=\"eq\">(z−1)X(z) = z(z−1)/(z−a)\u003c/span>，其 ROC 是 \u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>。\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">|a| &lt; 1\u003c/span>：ROC 包含单位圆，\u003cspan class=\"eq\">x[∞] = lim\u003csub>z→1\u003c/sub>z(z−1)/(z−a) = 0\u003c/span> ✓（衰减到 0）；\u003c/li>\u003cli>\u003cspan class=\"eq\">|a| &gt; 1\u003c/span> 或 \u003cspan class=\"eq\">a = −1\u003c/span>：ROC 不含单位圆或极点在单位圆上，\u003cb>终值不存在\u003c/b>；\u003c/li>\u003cli>\u003cspan class=\"eq\">a = 1\u003c/span>：\u003cspan class=\"eq\">x[k] = u[k]\u003c/span>，终值为 1（此时 \u003cspan class=\"eq\">(z−1)X(z) = z\u003c/span>，极限为 1）✓。\u003c/li>\u003c/ul>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>不检查 ROC 就套终值公式，会算出「\u003cspan class=\"eq\">a=2\u003c/span> 时 x[∞]=0」这种明显荒谬的结论（实际 \u003cspan class=\"eq\">2\u003csup>k\u003c/sup>\u003c/span> 发散）。\u003cb>先判收敛，再求极限。\u003c/b>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-2　初值、终值定理（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["初值：","下一项：","终值："],"title":"例 8-2　初值、终值定理（课件原题）","id":"signals-例8-2","points":["初值：","下一项：","终值："]},{"ch":8,"no":"例8-3","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">X(z) = z²/[(z−1)(z−0.5)]\u003c/span>，\u003cspan class=\"eq\">|z| &gt; 1\u003c/span>，求 \u003cspan class=\"eq\">x[k]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：对 X(z)/z 展开。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">X(z)\u003c/span>\u003cspan class=\"fd\">z\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">(z−1)(z−0.5)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">A\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">B\u003c/span>\u003cspan class=\"fd\">z − 0.5\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：遮盖法。\u003c/b>\u003cspan class=\"eq\">A = z/(z−0.5)|\u003csub>z=1\u003c/sub> = 1/0.5 = 2\u003c/span>；\u003cspan class=\"eq\">B = z/(z−1)|\u003csub>z=0.5\u003c/sub> = 0.5/(−0.5) = −1\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2z\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 0.5\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：查表。\u003c/b>ROC 是 \u003cspan class=\"eq\">|z|&gt;1\u003c/span>（圆外）→ 两项都是右边序列：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = [2 − (0.5)\u003csup>k\u003c/sup>]u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">x[0]=2−1=1\u003c/span>；初值定理 \u003cspan class=\"eq\">lim\u003csub>z→∞\u003c/sub>X(z)=1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>为什么先除 z？\u003c/b>因为标准变换对是 \u003cspan class=\"eq\">z/(z−a)\u003c/span> 的形式，直接对 \u003cspan class=\"eq\">X(z)\u003c/span> 展开会得到 \u003cspan class=\"eq\">1/(z−a)\u003c/span>，查表时容易错一位（对应 \u003cspan class=\"eq\">a\u003csup>k−1\u003c/sup>u[k−1]\u003c/span>）。\u003cb>先除 z、再乘回 z，是课件反复强调的规范动作。\u003c/b>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-3　部分分式法求反变换","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：对 X(z)/z 展开。","第二步：遮盖法。","第三步：查表。","验算："],"title":"例 8-3　部分分式法求反变换","id":"signals-例8-3","points":["第一步：对 X(z)/z 展开。","第二步：遮盖法。","第三步：查表。","验算："]},{"ch":8,"no":"例8-4","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">X(z) = z/[(z−2)(z−3)]\u003c/span>，分别求 ROC 为 \u003cspan class=\"eq\">|z|&gt;3\u003c/span>、\u003cspan class=\"eq\">2&lt;|z|&lt;3\u003c/span>、\u003cspan class=\"eq\">|z|&lt;2\u003c/span> 时的 \u003cspan class=\"eq\">x[k]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>先展开（对 \u003cspan class=\"eq\">X(z)/z\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">X(z)\u003c/span>\u003cspan class=\"fd\">z\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(z−2)(z−3)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">−1\u003c/span>\u003cspan class=\"fd\">z − 2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">z − 3\u003c/span>\u003c/span> ⟹ X(z) = −\u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 3\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>① \u003cspan class=\"eq\">|z| &gt; 3\u003c/span>：\u003c/b>两项都是右边序列：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = (3\u003csup>k\u003c/sup> − 2\u003csup>k\u003c/sup>)u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>② \u003cspan class=\"eq\">2 &lt; |z| &lt; 3\u003c/span>：\u003c/b>极点 2 属于 ROC 内侧 → 取右边；极点 3 属于外侧 → 取左边（\u003cspan class=\"eq\">z/(z−3)\u003c/span> 配 \u003cspan class=\"eq\">−3\u003csup>k\u003c/sup>u[−k−1]\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = −2\u003csup>k\u003c/sup>u[k] − 3\u003csup>k\u003c/sup>u[−k−1]\u003c/span>\u003c/div>\u003cp>\u003cb>③ \u003cspan class=\"eq\">|z| &lt; 2\u003c/span>：\u003c/b>两项都是左边序列：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x[k] = (2\u003csup>k\u003c/sup> − 3\u003csup>k\u003c/sup>)u[−k−1]\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>判定口诀：\u003c/b>「ROC 在某个极点\u003cb>外侧\u003c/b>，那一项就是\u003cb>右边\u003c/b>序列；ROC 在某个极点\u003cb>内侧\u003c/b>，那一项就是\u003cb>左边\u003c/b>序列」。逐个极点判，绝不会乱。","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-4　同一 X(z) 不同 ROC（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 8-4　同一 X(z) 不同 ROC（课件原题）","id":"signals-例8-4","points":["先展开（对 X(z)/z）：X(z)z = 1(z−2)(z−3) = −1z − 2 + 1z − 3 ⟹ X(z) = −zz − 2 + zz − 3① |z| > 3：两项都是右边序列：x[k] = (3k − 2k)u[k]② 2 \u003c |z| \u003c 3：极点 2 属于 ROC 内侧 → 取右边","极点 3 属于外侧 → 取左边（z/(z−3) 配 −3ku[−k−1]）：x[k] = −2ku[k] − 3ku[−k−1]③ |z| \u003c 2：两项都是左边序列：x[k] = (2k − 3k)u[−k−1]判定口诀：「ROC 在某个极点外侧，那一项就是右边序列","ROC 在某个极点内侧，那一项就是左边序列」","逐个极点判，绝不会乱"]},{"ch":8,"no":"例8-5","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y[k] + 3y[k−1] + 2y[k−2] = 3x[k] − x[k−1]\u003c/span>，求 \u003cspan class=\"eq\">H(z)\u003c/span> 并判断因果系统的稳定性。\u003c/p>","options":[],"answer":"\u003cp>零状态取 Z 变换：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">(1 + 3z\u003csup>−1\u003c/sup> + 2z\u003csup>−2\u003c/sup>)Y(z) = (3 − z\u003csup>−1\u003c/sup>)X(z)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">3 − z\u003csup>−1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 + 3z\u003csup>−1\u003c/sup> + 2z\u003csup>−2\u003c/sup>\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z(3z − 1)\u003c/span>\u003cspan class=\"fd\">z² + 3z + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z(3z − 1)\u003c/span>\u003cspan class=\"fd\">(z+1)(z+2)\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>极点 \u003cspan class=\"eq\">z = −1, −2\u003c/span>。其中 \u003cspan class=\"eq\">|−2| = 2 &gt; 1\u003c/span>，在单位圆外 → \u003cb>因果系统不稳定\u003c/b>。零点为 \u003cspan class=\"eq\">z = 0\u003c/span> 与 \u003cspan class=\"eq\">z = 1/3\u003c/span>。\u003c/p>\u003cp>\u003cb>补充：\u003c/b>如果不要求因果，只要 ROC 取 \u003cspan class=\"eq\">1 &lt; |z| &lt; 2\u003c/span>（包含单位圆），系统就是稳定的，但此时的 \u003cspan class=\"eq\">h[k]\u003c/span> 是双边序列、非因果。\u003c/p>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-5　由差分方程求 H(z)（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["补充："],"title":"例 8-5　由差分方程求 H(z)（课件原题）","id":"signals-例8-5","points":["零状态取 Z 变换：(1 + 3z−1 + 2z−2)Y(z) = (3 − z−1)X(z)H(z) = 3 − z−11 + 3z−1 + 2z−2 = z(3z − 1)z² + 3z + 2 = z(3z − 1)(z+1)(z+2)极点 z = −1, −2","其中 |−2| = 2 > 1，在单位圆外 → 因果系统不稳定","零点为 z = 0 与 z = 1/3","补充：如果不要求因果，只要 ROC 取 1 \u003c |z| \u003c 2（包含单位圆），系统就是稳定的，但此时的 h[k] 是双边序列、非因果"]},{"ch":8,"no":"例8-6","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">y[k] = x[k−1]\u003c/span> 的系统函数。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z) = z\u003csup>−1\u003c/sup>X(z) ⟹ H(z) = z\u003csup>−1\u003c/sup>，　h[k] = δ[k−1]\u003c/span>\u003c/div>\u003cp>这是离散系统模拟框图里最基本的单元：\u003cb>一个 \u003cspan class=\"eq\">z\u003csup>−1\u003c/sup>\u003c/span> 方框 = 延迟一个采样点\u003c/b>。连续系统对应的是积分器 \u003cspan class=\"eq\">1/s\u003c/span>。\u003c/p>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-6　单位延时器（最简单的 H(z)）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 8-6　单位延时器（最简单的 H(z)）","id":"signals-例8-6","points":["Y(z) = z−1X(z) ⟹ H(z) = z−1，　h[k] = δ[k−1]这是离散系统模拟框图里最基本的单元：一个 z−1 方框 = 延迟一个采样点","连续系统对应的是积分器 1/s"]},{"ch":8,"no":"例8-7","kind":"short","group":"written","stem":"\u003cp>某因果离散系统的极点为 \u003cspan class=\"eq\">z₁=0.5, z₂=1.5\u003c/span>，判断稳定性。\u003c/p>","options":[],"answer":"\u003cp>因果 → ROC 为 \u003cspan class=\"eq\">|z| &gt; 1.5\u003c/span>，\u003cb>不包含单位圆\u003c/b> → 不稳定。从极点看：\u003cspan class=\"eq\">1.5\u003c/span> 在单位圆外，\u003cspan class=\"eq\">h[k]\u003c/span> 中含 \u003cspan class=\"eq\">1.5\u003csup>k\u003c/sup>\u003c/span> 增长项，故不稳定。\u003c/p>\u003cp>\u003cb>两种说法都对，写任一种即可；最好两种都写，显得思路完整。\u003c/b>\u003c/p>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-7　判断因果系统稳定性（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["两种说法都对，写任一种即可；最好两种都写，显得思路完整。"],"title":"例 8-7　判断因果系统稳定性（课件原题）","id":"signals-例8-7","points":["因果 → ROC 为 |z| > 1.5，不包含单位圆 → 不稳定","从极点看：1.5 在单位圆外，h[k] 中含 1.5k 增长项，故不稳定","两种说法都对，写任一种即可","最好两种都写，显得思路完整"]},{"ch":8,"no":"例8-8","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y[k] − 0.5y[k−1] = u[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 1\u003c/span>，用 Z 变换求完全响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：两边取单边 Z 变换\u003c/b>，用 \u003cspan class=\"eq\">Z{y[k−1]} = z\u003csup>−1\u003c/sup>Y(z) + y[−1]\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z) − 0.5[z\u003csup>−1\u003c/sup>Y(z) + 1] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：整理。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(z)(1 − 0.5z\u003csup>−1\u003c/sup>) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − 1\u003c/span>\u003c/span> + 0.5 ⟹ Y(z) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">z²\u003c/span>\u003cspan class=\"fd\">(z − 1)(z − 0.5)\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">0.5z\u003c/span>\u003cspan class=\"fd\">z − 0.5\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：分别反变换。\u003c/b>第一项在例 8-3 已算过，是 \u003cspan class=\"eq\">[2 − (0.5)\u003csup>k\u003c/sup>]u[k]\u003c/span>；第二项是 \u003cspan class=\"eq\">0.5·(0.5)\u003csup>k\u003c/sup>u[k] = (0.5)\u003csup>k+1\u003c/sup>u[k]\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = 2 − (0.5)\u003csup>k\u003c/sup> + (0.5)\u003csup>k+1\u003c/sup> = 2 − (0.5)\u003csup>k+1\u003c/sup>，　k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>与第 3 章迭代法的结果完全一致 ✓\u003c/b>（\u003cspan class=\"eq\">y[0]=1.5, y[1]=1.75, y[2]=1.875\u003c/span>）。\u003c/p>\u003cdiv class=\"tip\">\u003cb>拆分含义：\u003c/b>第一项只含输入 \u003cspan class=\"eq\">u[k]\u003c/span>，是\u003cb>零状态响应\u003c/b>；第二项只含 \u003cspan class=\"eq\">y[−1]\u003c/span>，是\u003cb>零输入响应\u003c/b>。Z 变换把两者自动分开了，这正是它比时域法省心的地方。","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-8　一阶差分方程的 z 域解（与第 3 章对照）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：两边取单边 Z 变换","第二步：整理。","第三步：分别反变换。","与第 3 章迭代法的结果完全一致 ✓"],"title":"例 8-8　一阶差分方程的 z 域解（与第 3 章对照）","id":"signals-例8-8","points":["第一步：两边取单边 Z 变换","第二步：整理。","第三步：分别反变换。","与第 3 章迭代法的结果完全一致 ✓"]},{"ch":8,"no":"例8-9","kind":"short","group":"written","stem":"\u003cp>要设计一个产生等幅余弦波 \u003cspan class=\"eq\">cos Ω₀k\u003c/span> 的数字振荡器，\u003cspan class=\"eq\">H(z)\u003c/span> 的极点应放在哪里？\u003c/p>","options":[],"answer":"\u003cp>等幅正弦/余弦对应的极点必须在\u003cb>单位圆上\u003c/b>：\u003cspan class=\"eq\">p = e\u003csup>±jΩ₀\u003c/sup>\u003c/span>，此时 \u003cspan class=\"eq\">|p|=1\u003c/span>，\u003cspan class=\"eq\">h[k]\u003c/span> 不衰减也不增长。\u003c/p>\u003cp>取 \u003cspan class=\"eq\">H(z) = 1/(1 − 2cos Ω₀·z\u003csup>−1\u003c/sup> + z\u003csup>−2\u003c/sup>)\u003c/span>，极点为 \u003cspan class=\"eq\">e\u003csup>±jΩ₀\u003c/sup>\u003c/span>。由 \u003cspan class=\"eq\">Z{cos Ω₀k·u[k]}\u003c/span> 可知，零状态响应正是等幅余弦波。\u003c/p>\u003cp>\u003cb>注意：\u003c/b>这类系统\u003cb>不是 BIBO 稳定\u003c/b>的（极点在单位圆上），但正好利用这一点让振荡持续——工程上靠非线性限幅来稳住幅度。\u003c/p>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-9　自激振荡器设计（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["注意："],"title":"例 8-9　自激振荡器设计（课件原题）","id":"signals-例8-9","points":["等幅正弦/余弦对应的极点必须在单位圆上：p = e±jΩ₀，此时 |p|=1，h[k] 不衰减也不增长","取 H(z) = 1/(1 − 2cos Ω₀·z−1 + z−2)，极点为 e±jΩ₀","由 Z{cos Ω₀k·u[k]} 可知，零状态响应正是等幅余弦波","注意：这类系统不是 BIBO 稳定的（极点在单位圆上），但正好利用这一点让振荡持续——工程上靠非线性限幅来稳住幅度"]},{"ch":8,"no":"例8-10","kind":"short","group":"written","stem":"\u003cp>给出实现 \u003cspan class=\"eq\">r[k]=x[k]+αx[k−N]\u003c/span> 与 \u003cspan class=\"eq\">y[k]=r[k]−αy[k−N]\u003c/span> 的核心代码。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">alpha = 0.5;  N = 18000;\u003cbr>\nr = [x, zeros(1,N)] + [zeros(1,N), alpha*x];   % 产生回声\u003cbr>\nL = length(r);  y = zeros(1,L);\u003cbr>\nfor k = 1:L\u003cbr>\n&nbsp;&nbsp;if k &gt; N\u003cbr>\n&nbsp;&nbsp;&nbsp;&nbsp;y(k) = r(k) - alpha*y(k-N);              % 逆系统递归\u003cbr>\n&nbsp;&nbsp;else\u003cbr>\n&nbsp;&nbsp;&nbsp;&nbsp;y(k) = r(k);\u003cbr>\n&nbsp;&nbsp;end\u003cbr>\nend\u003cbr>\ne = y - [x, zeros(1,N)];                        % 误差应接近 0\u003c/span>\u003c/div>\u003cp>\u003cb>为什么前 N 个点直接抄 r[k]？\u003c/b>因为 \u003cspan class=\"eq\">y[k−N]\u003c/span> 还没定义，相当于逆系统的初始状态为零。从第 \u003cspan class=\"eq\">N+1\u003c/span> 点起才开始反馈抵消。\u003c/p>\u003cp>\u003cb>考点：\u003c/b>把「求逆系统」翻译成 z 域的「取倒数」，再把 \u003cspan class=\"eq\">H\u003csub>i\u003c/sub>(z)\u003c/span> 翻译成可迭代的差分方程——这正是 CH7 最综合的应用题。\u003c/p>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-10　写出回声消除的 MATLAB 仿真（课件代码）","tags":["讲义例题"],"needsCheck":false,"steps":["为什么前 N 个点直接抄 r[k]？","考点："],"title":"例 8-10　写出回声消除的 MATLAB 仿真（课件代码）","id":"signals-例8-10","points":["为什么前 N 个点直接抄 r[k]？","考点："]},{"ch":8,"kind":"fill","group":"objective","stem":"Z 变换：Z{a\u003csup>k\u003c/sup>u[k]} = ______，收敛域 ______。","options":[],"answer":"z/(z−a)；|z|>|a|","answerKey":"","accept":[["z/(z−a)","z/(z-a)"],["|z|>|a|","|z|>|a|"]],"why":"极点 z=a，收敛域在圆外；a=1 时就是 u[k] ↔ z/(z−1)。","source":"讲义提炼 · 第 8 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-24","id":"sig-extra-24"},{"ch":8,"kind":"fill","group":"objective","stem":"离散系统稳定的判据：H(z) 的全部极点位于 ______。","options":[],"answer":"单位圆内","answerKey":"","accept":[["单位圆内","z平面单位圆内","单位圆内部"]],"why":"极点模小于 1，h[k] 才随 k 衰减；连续对应左半平面。","source":"讲义提炼 · 第 8 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-25","id":"sig-extra-25"},{"ch":8,"kind":"choice","group":"objective","stem":"Z{a\u003csup>k\u003c/sup>u[k]} 的收敛域是（　）。","options":[{"key":"A","html":"|z|\u003c|a|"},{"key":"B","html":"|z|>|a|"},{"key":"C","html":"|z|>1"},{"key":"D","html":"全 z 平面"}],"answer":"B","answerKey":"B","why":"右边序列收敛域在极点圆外；因果系统的 ROC 一定是某圆外。","source":"讲义提炼 · 第 8 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-38","id":"sig-extra-38"},{"ch":9,"no":"例9-1","kind":"short","group":"written","stem":"\u003cp>某系统有 2 个状态、2 个输入、2 个输出，写出其矩阵形式并说明各符号含义。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\">\u003cspan class=\"eq\" style=\"line-height:1.9\">[\u003cspan class=\"fr\">\u003cspan class=\"fn\">q₁′\u003c/span>\u003cspan class=\"fd\">q₂′\u003c/span>\u003c/span>] = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">a₁₁ a₁₂\u003c/span>\u003cspan class=\"fd\">a₂₁ a₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">q₁\u003c/span>\u003cspan class=\"fd\">q₂\u003c/span>\u003c/span>] + [\u003cspan class=\"fr\">\u003cspan class=\"fn\">b₁₁ b₁₂\u003c/span>\u003cspan class=\"fd\">b₂₁ b₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">x₁\u003c/span>\u003cspan class=\"fd\">x₂\u003c/span>\u003c/span>]\u003cbr>\n[\u003cspan class=\"fr\">\u003cspan class=\"fn\">y₁\u003c/span>\u003cspan class=\"fd\">y₂\u003c/span>\u003c/span>] = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">c₁₁ c₁₂\u003c/span>\u003cspan class=\"fd\">c₂₁ c₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">q₁\u003c/span>\u003cspan class=\"fd\">q₂\u003c/span>\u003c/span>] + [\u003cspan class=\"fr\">\u003cspan class=\"fn\">d₁₁ d₁₂\u003c/span>\u003cspan class=\"fd\">d₂₁ d₂₂\u003c/span>\u003c/span>][\u003cspan class=\"fr\">\u003cspan class=\"fn\">x₁\u003c/span>\u003cspan class=\"fd\">x₂\u003c/span>\u003c/span>]\u003c/span>\u003c/div>\u003cp>\u003cb>含义：\u003c/b>\u003cspan class=\"eq\">A\u003c/span> 描述状态之间如何互相影响（系统内部结构），\u003cspan class=\"eq\">B\u003c/span> 描述输入如何注入状态，\u003cspan class=\"eq\">C\u003c/span> 描述状态如何组合成输出，\u003cspan class=\"eq\">D\u003c/span> 是输入到输出的\u003cb>直通\u003c/b>部分（多数物理系统 \u003cspan class=\"eq\">D=0\u003c/span>）。\u003c/p>\u003cp>\u003cb>考试常问：\u003c/b>「状态变量的个数等于什么？」答案：\u003cb>系统阶数 = 独立储能元件个数 = 积分器/延时器个数\u003c/b>。\u003c/p>","answerKey":"","why":"","source":"讲义第 9 章 · 例 9-1　读懂双输入双输出状态方程（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["含义：","考试常问："],"title":"例 9-1　读懂双输入双输出状态方程（课件原题）","id":"signals-例9-1","points":["含义：","考试常问："]},{"ch":9,"no":"例9-2","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">H(s) = 1/(s² + 5s + 6)\u003c/span>，写出直接型状态方程与输出方程。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：写出微分方程。\u003c/b>\u003cspan class=\"eq\">(s²+5s+6)Y(s) = X(s)\u003c/span> ⟹ \u003cspan class=\"eq\">y″ + 5y′ + 6y = x\u003c/span>。\u003c/p>\u003cp>\u003cb>第二步：选状态变量。\u003c/b>取 \u003cspan class=\"eq\">q₁ = y\u003c/span>，\u003cspan class=\"eq\">q₂ = y′\u003c/span>（即两个积分器的输出，从右往左）。\u003c/p>\u003cp>\u003cb>第三步：列一阶方程组。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₁′ = q₂；　q₂′ = y″ = −6q₁ − 5q₂ + x；　y = q₁\u003c/span>\u003c/div>\u003cp>\u003cb>第四步：写成矩阵形式。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">0　　1\u003c/span>\u003cspan class=\"fd\">−6　−5\u003c/span>\u003c/span>]，　B = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">0\u003c/span>\u003cspan class=\"fd\">1\u003c/span>\u003c/span>]，　C = [1　0]，　D = 0\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>规律（相伴矩阵 / 可控标准型）：\u003c/b>对 \u003cspan class=\"eq\">y″ + a₁y′ + a₀y = b₀x\u003c/span>，直接写 \u003cspan class=\"eq\">A = [[0,1],[−a₀,−a₁]]\u003c/span>，\u003cspan class=\"eq\">B=[0,1]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">C=[b₀,0]\u003c/span>，\u003cspan class=\"eq\">D=0\u003c/span>。\u003cb>背下这个模板，选择题和大题的第一步都能秒写。\u003c/b>","answerKey":"","why":"","source":"讲义第 9 章 · 例 9-2　由二阶系统函数写状态方程","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：写出微分方程。","第二步：选状态变量。","第三步：列一阶方程组。","第四步：写成矩阵形式。"],"title":"例 9-2　由二阶系统函数写状态方程","id":"signals-例9-2","points":["第一步：写出微分方程。","第二步：选状态变量。","第三步：列一阶方程组。","第四步：写成矩阵形式。"]},{"ch":9,"no":"例9-3","kind":"short","group":"written","stem":"\u003cp>二阶离散系统直接型结构，中间变量为 \u003cspan class=\"eq\">w[k]\u003c/span>，差分方程 \u003cspan class=\"eq\">y[k] + a₁y[k−1] + a₂y[k−2] = b₀x[k] + b₁x[k−1] + b₂x[k−2]\u003c/span>，写出状态方程。\u003c/p>","options":[],"answer":"\u003cp>取两个延时器的输出为状态：\u003cspan class=\"eq\">q₁[k] = w[k−1]\u003c/span>，\u003cspan class=\"eq\">q₂[k] = w[k−2]\u003c/span>。由延时器输入关系：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₁[k+1] = w[k] = x[k] − a₁q₁[k] − a₂q₂[k]；　q₂[k+1] = q₁[k]\u003c/span>\u003c/div>\u003cp>输出：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = b₀w[k] + b₁q₁[k] + b₂q₂[k] = b₀x[k] + (b₁ − b₀a₁)q₁[k] + (b₂ − b₀a₂)q₂[k]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">−a₁　−a₂\u003c/span>\u003cspan class=\"fd\">1　　0\u003c/span>\u003c/span>]，　B = [\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">0\u003c/span>\u003c/span>]，　C = [b₁−b₀a₁　b₂−b₀a₂]，　D = b₀\u003c/span>\u003c/div>\u003cp>\u003cb>注意：\u003c/b>离散版的状态方程是 \u003cspan class=\"eq\">q[k+1] = Aq[k] + Bx[k]\u003c/span>，\u003cb>不是\u003c/b>\u003cspan class=\"eq\">q′\u003c/span>；而且 \u003cspan class=\"eq\">D\u003c/span> 这一项来自 \u003cspan class=\"eq\">w[k]\u003c/span> 里直接含有的 \u003cspan class=\"eq\">x[k]\u003c/span>，别漏掉。\u003c/p>","answerKey":"","why":"","source":"讲义第 9 章 · 例 9-3　离散系统由框图写状态方程（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["注意："],"title":"例 9-3　离散系统由框图写状态方程（课件原题）","id":"signals-例9-3","points":["取两个延时器的输出为状态：q₁[k] = w[k−1]，q₂[k] = w[k−2]","由延时器输入关系：q₁[k+1] = w[k] = x[k] − a₁q₁[k] − a₂q₂[k]","q₂[k+1] = q₁[k]输出：y[k] = b₀w[k] + b₁q₁[k] + b₂q₂[k] = b₀x[k] + (b₁ − b₀a₁)q₁[k] + (b₂ − b₀a₂)q₂[k]A = [−a₁　−a₂1　　0]，　B = [10]，　C = [b₁−b₀a₁　b₂−b₀a₂]，　D = b₀注意：离散版的状态方程是 q[k+1] = Aq[k] + Bx[k]，不是q′","而且 D 这一项来自 w[k] 里直接含有的 x[k]，别漏掉"]},{"ch":9,"no":"例9-4","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">A = [[−1, 0],[0, −2]]\u003c/span>，\u003cspan class=\"eq\">B = [1, 1]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">C = [1, 1]\u003c/span>，\u003cspan class=\"eq\">D = 0\u003c/span>，初始状态 \u003cspan class=\"eq\">q(0)=[1,1]\u003csup>T\u003c/sup>\u003c/span>，输入 \u003cspan class=\"eq\">x(t)=u(t)\u003c/span>。求 \u003cspan class=\"eq\">y(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>因为 A 是对角阵，两个状态互不耦合\u003c/b>，可以拆成两个一阶方程分别解：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₁′ = −q₁ + 1，q₁(0)=1 ⟹ q₁(t) = e\u003csup>−t\u003c/sup> + (1 − e\u003csup>−t\u003c/sup>) = 1\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q₂′ = −2q₂ + 1，q₂(0)=1 ⟹ q₂(t) = e\u003csup>−2t\u003c/sup> + ½(1 − e\u003csup>−2t\u003c/sup>) = ½ + ½e\u003csup>−2t\u003c/sup>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = q₁ + q₂ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">3\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup>，　t ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>用状态转移矩阵验证：\u003c/b>\u003cspan class=\"eq\">e\u003csup>At\u003c/sup> = diag(e\u003csup>−t\u003c/sup>, e\u003csup>−2t\u003c/sup>)\u003c/span>，代入时域解公式结果相同 ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考试技巧：\u003c/b>遇到 \u003cspan class=\"eq\">2×2\u003c/span> 矩阵，先算 \u003cspan class=\"eq\">(sI−A)\u003csup>−1\u003c/sup>\u003c/span>——对 \u003cspan class=\"eq\">2×2\u003c/span> 矩阵就是「主对角换位置、副对角变号、再除以行列式」，10 秒可写出来。","answerKey":"","why":"","source":"讲义第 9 章 · 例 9-4　对角 A 矩阵求解（初学者友好）","tags":["讲义例题"],"needsCheck":false,"steps":["因为 A 是对角阵，两个状态互不耦合","用状态转移矩阵验证："],"title":"例 9-4　对角 A 矩阵求解（初学者友好）","id":"signals-例9-4","points":["因为 A 是对角阵，两个状态互不耦合","用状态转移矩阵验证："]},{"ch":9,"no":"例9-5","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">A = [[0, 1],[−1/6, 5/6]]\u003c/span>，\u003cspan class=\"eq\">B = [0, 1]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">C = [[−1, 5],[2, 0]]\u003c/span>，\u003cspan class=\"eq\">D = 0\u003c/span>，\u003cspan class=\"eq\">q[0] = [2, 3]\u003csup>T\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">x[k] = u[k]\u003c/span>。求 \u003cspan class=\"eq\">q[1]\u003c/span> 与 \u003cspan class=\"eq\">y[0], y[1]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>k=0 的输出：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[0] = C q[0] = [[−1,5],[2,0]]·[2,3]\u003csup>T\u003c/sup> = [−2+15, 4]\u003csup>T\u003c/sup> = [13, 4]\u003csup>T\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>递推一步：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">q[1] = A q[0] + B x[0] = [3, (−2/6 + 15/6) + 1]\u003csup>T\u003c/sup> = [3, 13/6 + 1]\u003csup>T\u003c/sup> = [3, 19/6]\u003csup>T\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>k=1 的输出：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[1] = C q[1] = [−3 + 5·19/6, 6]\u003csup>T\u003c/sup> = [−3 + 95/6, 6]\u003csup>T\u003c/sup> = [77/6, 6]\u003csup>T\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>要点：\u003c/b>离散状态方程不需要任何变换，只要矩阵乘法 + 加法，\u003cb>天然适合编程\u003c/b>。课件给的 \u003cspan class=\"eq\">dlsim(A,B,C,D,x,q0)\u003c/span> 就是干这个的。\u003c/p>","answerKey":"","why":"","source":"讲义第 9 章 · 例 9-5　迭代法求前几项（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["k=0 的输出：","递推一步：","k=1 的输出：","要点："],"title":"例 9-5　迭代法求前几项（课件原题）","id":"signals-例9-5","points":["k=0 的输出：","递推一步：","k=1 的输出：","要点："]},{"ch":9,"kind":"fill","group":"objective","stem":"状态方程与输出方程的标准形式为 q′ = ______，y = ______；系统函数 H(s) = ______。","options":[],"answer":"Aq+Bx；Cq+Dx；C(sI−A)\u003csup>−1\u003c/sup>B+D","answerKey":"","accept":[["Aq+Bx","Aq+Bx"],["Cq+Dx","Cq+Dx"],["C(sI−A)^(−1)B+D","C(sI−A)^-1B+D","C(sI−A)⁻¹B+D"]],"why":"这是状态空间的标准式，H(s) 由 (sI−A) 的逆得到。","source":"讲义提炼 · 第 9 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-26","id":"sig-extra-26"},{"ch":9,"kind":"choice","group":"objective","stem":"n 阶连续 LTI 系统的状态变量个数通常为（　）。","options":[{"key":"A","html":"1"},{"key":"B","html":"n"},{"key":"C","html":"n−1"},{"key":"D","html":"2n"}],"answer":"B","answerKey":"B","why":"状态变量个数等于系统阶数，也等于独立储能元件个数。","source":"讲义提炼 · 第 9 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-39","id":"sig-extra-39"},{"ch":10,"no":"例10-1","kind":"short","group":"written","stem":"\u003cp>写出产生 \u003cspan class=\"eq\">y = (1−|t|)·[|t| ≤ 1]\u003c/span> 的函数并画图。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">function y = tri(t)\u003cbr>\ny = (t&gt;=-1 &amp; t&lt;=1).*(1-abs(t));\u003cbr>\u003cbr>\nt = -2:0.05:2;\u003cbr>\nplot(t, tri(t)); grid on;\u003c/span>\u003c/div>\u003cp>\u003cb>两个关键点：\u003c/b>① \u003cspan class=\"eq\">(t&gt;=-1 &amp; t&lt;=1)\u003c/span> 是逻辑数组（0/1），用它做「门控」；② 必须用 \u003cspan class=\"eq\">.*\u003c/span> 逐点相乘，用 \u003cspan class=\"eq\">*\u003c/span> 会报矩阵维数错误。\u003c/p>","answerKey":"","why":"","source":"讲义第 10 章 · 例 10-1　用 MATLAB 画三角波（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["两个关键点："],"title":"例 10-1　用 MATLAB 画三角波（课件原题）","id":"signals-例10-1","points":["function y = tri(t)\n\ny = (t>=-1 & t\u003c=1).*(1-abs(t))","t = -2:0.05:2","plot(t, tri(t))","grid on"]},{"ch":10,"no":"例10-2","kind":"short","group":"written","stem":"\u003cp>画出 \u003cspan class=\"eq\">H(s)=1/(s³+2s²+2s+1)\u003c/span> 的幅度响应。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">w = linspace(0,5,1001);\u003cbr>\nb = [1];  a = [1 2 2 1];\u003cbr>\nH = freqs(b,a,w);\u003cbr>\nplot(w, abs(H)); grid on;\u003cbr>\nset(gca,'ytick',[0 0.4 0.707 1]);\u003cbr>\ntitle('3阶 Butterworth 幅度响应'); xlabel('\\omega');\u003c/span>\u003c/div>\u003cp>\u003cb>系数怎么来：\u003c/b>\u003cspan class=\"eq\">a\u003c/span> 按 \u003cspan class=\"eq\">s\u003c/span> 的降幂排列，缺项补 0；\u003cspan class=\"eq\">b\u003c/span> 是分子。\u003cspan class=\"eq\">|H(0)|=1\u003c/span>，\u003cspan class=\"eq\">|H(1)|=1/√2≈0.707\u003c/span>，正是 3 dB 截频 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>=1\u003c/span>（归一化 Butterworth 的定义）。\u003c/p>","answerKey":"","why":"","source":"讲义第 10 章 · 例 10-2　用 freqs 画三阶 Butterworth 低通（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["系数怎么来："],"title":"例 10-2　用 freqs 画三阶 Butterworth 低通（课件原题）","id":"signals-例10-2","points":["w = linspace(0,5,1001)","b = [1]","a = [1 2 2 1]","H = freqs(b,a,w)"]},{"ch":10,"no":"例10-3","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y″+3y′+2y = 3x+2x′，t ≥ 0\u003c/span>，用 lsim 求零状态响应并与理论解比较。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">sys = tf([2 3],[1 3 2]);\u003cbr>\ndt = 0.01;  t = 0:dt:10;\u003cbr>\nx = exp(-t);                 % 也可换成 u(t)、sin(t)\u003cbr>\ny = lsim(sys, x, t);\u003cbr>\nplot(t,y); grid on;\u003cbr>\nhold on; h = impulse(sys,t); % 冲激响应对照\u003c/span>\u003c/div>\u003cp>\u003cb>时域理论解（对照用）：\u003c/b>由例 7-6 \u003cspan class=\"eq\">h(t)=(e\u003csup>−t\u003c/sup>+e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>，\u003cspan class=\"eq\">x=e\u003csup>−t\u003c/sup>u(t)\u003c/span> 时 \u003cspan class=\"eq\">H(s)=(2s+3)/[(s+1)(s+2)]\u003c/span>，\u003cspan class=\"eq\">X(s)=1/(s+1)\u003c/span>，故 \u003cspan class=\"eq\">Y(s)=(2s+3)/[(s+1)²(s+2)]\u003c/span>，部分分式展开后反变换即可与曲线比对。\u003c/p>\u003cdiv class=\"tip\">\u003cb>答题套路：\u003c/b>先写理论解（s 域），再写代码，最后说「两条曲线重合，验证正确」——课件里 L06/L15 的实验都是这个结构，编程分析题按这个写不会跑偏。","answerKey":"","why":"","source":"讲义第 10 章 · 例 10-3　用 lsim 求微分方程响应（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["时域理论解（对照用）："],"title":"例 10-3　用 lsim 求微分方程响应（课件原题）","id":"signals-例10-3","points":["sys = tf([2 3],[1 3 2])","dt = 0.01","t = 0:dt:10","x = exp(-t)"]}],"metaExtra":{"source":"《信号与系统 期末应试讲义》CH0–CH11 · 88 道大题 + 55 道客观题","highfreq":[{"type":"选择/填空","score":"15～20","content":"δ 抽样性、系统性质、能量功率、变换对、抽样率","action":"背表 0-1、0-2；δ 题先看积分区间"},{"type":"画图题","score":"5～8","content":"\u003cspan class=\"eq\">x(at+b)\u003c/span>、卷积波形、频谱草图","action":"抓关键点，解方程定新位置"},{"type":"微分方程求解","score":"12～15","content":"完全响应、零输入/零状态、冲激响应","action":"四步法：特征根→齐次解→特解→定常数"},{"type":"卷积计算","score":"10～12","content":"指数卷积、矩形卷积、分段讨论","action":"先定重叠区间，再积分；用公式验算"},{"type":"差分方程","score":"10～12","content":"迭代、h[k]、卷积和","action":"列表法/竖式乘法，长度 \u003cspan class=\"eq\">L₁+L₂−1\u003c/span> 自查"},{"type":"傅里叶级数","score":"12～15","content":"求 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>、画频谱、帕塞瓦尔求功率","action":"先求 \u003cspan class=\"eq\">ω₀\u003c/span>，用对称性化简"},{"type":"傅里叶变换","score":"12～18","content":"常用变换对、性质、调制、抽样定理","action":"能拆就拆，能套就套，别硬积"}]},"x":{"kicker":"SIGNALS & SYSTEMS · CH0—CH11","tagline":"把课堂公式变成考场上能写出来的步骤","desc":"覆盖 CH0–CH11 全部章节：δ 与系统性质、时域卷积、傅里叶级数与变换、抽样、拉氏与 z 域、状态变量。88 道大题按评分点自评，55 道客观题逐空核对。","accent":"blue","exam":"选择/填空 15–20 分 · 画图 5–8 分 · 微分方程 12–15 分 · 卷积 10–12 分 · 差分方程 10–12 分 · 傅里叶级数 12–15 分 · 傅里叶变换 12–18 分","guide":[{"id":"g1","ch":1,"title":"δ 的抽样性与缩放","clues":"出现 ∫f(t)δ(t−t₀)dt、δ(at)、x(t)δ(t−t₀)","rule":"δ(at)=δ(t)/|a|；∫f(t)δ(t−t₀)dt=f(t₀)（t₀ 必须在积分区间内，否则为 0）","steps":[{"ask":"第一步只看一件事：冲激点 t₀ 落在积分区间里吗？先写出区间上下限。","ref":"t₀ 不在区间内 → 积分直接为 0，不能代 f(t₀)。t₀ 在区间内 → 才代值。"},{"ask":"如果 δ 里是 at+b，怎样化成 δ(t−t₀) 的标准形式？提出来的系数放在哪里？","ref":"δ(at+b)=δ(a(t+b/a))=δ(t+b/a)/|a|。系数 1/|a| 提到 δ 外面，负号被绝对值吃掉。"},{"ask":"写出最终结果，并检查符号、系数和量纲。","ref":"例：δ(2t−4)=½δ(t−2)；∫_{−1}^{3}(t²+1)δ(t−2)dt=4+1=5。"}],"trap":"最常见两错：不看积分区间直接代 f(t₀)；δ(at) 忘记 1/|a|，把 δ(2t) 当成 δ(t)。","example":{"q":"化简 δ(−3t)，并求 ∫_{−1}^{1} f(t)δ(t−2)dt。","a":"δ(−3t)=⅓δ(t)；t=2 不在 [−1,1] 内，积分为 0。"}},{"id":"g2","ch":1,"title":"系统四性质：线性、时不变、因果、稳定","clues":"选择题问“下列系统是线性/时变/因果/稳定系统的是”","rule":"线性=齐次性+可加性；时不变=输入延迟 t₀，输出整体延迟 t₀；因果 h(t)=0(t\u003c0)；稳定 ∫|h(t)|dt\u003c∞","steps":[{"ask":"先找“平方、两个输入相乘、加常数”这三类结构，它们说明什么？","ref":"出现 x²、x(t)x(t−1)、+1 等 → 非线性。线性只允许一次运算的线性组合。"},{"ask":"把 x(t) 换成 x(t−t₀)，输出是不是也整体平移 t₀？t 前有系数说明什么？","ref":"y(t)=x(2t) 中时间被压缩，延迟量对不上 → 时变；t 前有系数一定时变。"},{"ask":"输出有没有用到未来时刻的输入？","ref":"x(t+1)、x(2t)（t>0 时用到未来值）→ 非因果；h(t)=0(t\u003c0) 是因果的等价判据。"},{"ask":"最后看稳定性：h(t) 是否绝对可积？","ref":"∫|h|dt\u003c∞ 才 BIBO 稳定；e^{−2t}u(t) 可积，e^{2t}u(t) 不可积。"}],"trap":"线性与时不变是两件事：y(t)=x(t)cos2t 是线性的，但时变。因果与稳定也互不蕴含。","example":{"q":"判断 y(t)=x(t)cos2t 与 y(t)=x(t+1) 的性质。","a":"前者线性、时变、因果；后者线性、时不变、非因果。"}},{"id":"g3","ch":2,"title":"经典法求完全响应","clues":"给微分方程和初始条件，要求 y(t)","rule":"y=y_h+y_p；特征根定齐次解形式；激励定特解形式；代初值定常数","steps":[{"ask":"写出特征方程并求根。根是哪一种：互异实根、重根、共轭复根？","ref":"y″+5y′+6y=0 → s²+5s+6=0 → s=−2,−3，互异实根。"},{"ask":"按根型写齐次解。共轭复根 α±jβ 时写什么？","ref":"互异：ΣK_i e^{s_i t}；重根乘 t 的幂；共轭：e^{αt}(A cos βt+B sin βt)。"},{"ask":"设特解。若激励指数正好等于特征根，形式要怎么改？","ref":"撞单根要乘 t：设 Ate^{at}；撞重根乘 t²。否则代进去会出现 0=激励。"},{"ask":"代 y(0)、y′(0) 定常数，最后别忘乘 u(t)。","ref":"先求导再代初值；结果只在 t>0 成立，必须写 u(t)。"}],"trap":"特解撞根没乘 t；先代初值后求导导致常数错；结果漏 u(t)。","example":{"q":"y′+2y=x，y(0)=2，x=e^{−t}u(t)，求 y(t)。","a":"y_h=Ke^{−2t}，y_p=e^{−t}，K=1 → y=(e^{−t}+e^{−2t})u(t)。"}},{"id":"g4","ch":2,"title":"冲激响应 h(t)","clues":"求 h(t)，且微分方程右端含 x′ 或 x″","rule":"右端只有 x：设 h=(…)u(t)，用 h(0⁺)=0、h′(0⁺)=1；右端有导数：h 是各阶 h₁ 的线性组合","steps":[{"ask":"先比较左右两端最高阶导数。右端有 x′ 意味着 h 里可能出现什么？","ref":"右端最高阶与左端同阶时，h 可能含 δ 项，不能直接设纯指数形式。"},{"ask":"先求“右端只有 x”的 h₁，它的初始条件怎么定？","ref":"n 阶系统：h₁(0⁺)=…=h₁^{(n−2)}(0⁺)=0，h₁^{(n−1)}(0⁺)=1。"},{"ask":"用线性组合写出 h。右端是 x′+2x 时，h 等于什么？","ref":"h=h₁′+2h₁；求导时注意 t=0 处是否产生 δ。"},{"ask":"把 h 代回原方程验算 δ 项系数。","ref":"h=e^{−3t}u(t) 时，h″+5h′+6h=δ′+2δ，正好对应 x′+2x。"}],"trap":"忽略右端 x′，直接设 h=Ae^{−2t}+Be^{−3t}，漏掉 δ 项。","example":{"q":"y″+5y′+6y=x′+2x，求 h(t)。","a":"h₁=(e^{−2t}−e^{−3t})u(t)，h=h₁′+2h₁=e^{−3t}u(t)。"}},{"id":"g5","ch":2,"title":"卷积积分与分段","clues":"给 x(t)、h(t) 的波形或表达式，求 y=x∗h 并画图","rule":"y(t)=∫x(τ)h(t−τ)dτ；重叠区间 max(左界)\u003cτ\u003cmin(右界)；分界点由两个信号的边界相加得到","steps":[{"ask":"先把 h(τ) 变成 h(t−τ)：换元、反转、平移，三步各做什么？","ref":"τ 替换变量 → 关于纵轴反转 → 整体右移 t。画图时先画 h(t−τ) 的支撑区间。"},{"ask":"写出重叠区间的不等式，分界点有哪几个？","ref":"x 在 [0,1]，h(t−τ) 在 [t−2,t]，重叠要求 max(0,t−2)\u003cτ\u003cmin(1,t)；分界 t=0,1,2,3。"},{"ask":"逐段积分。若被积函数恒为 1，积分等于什么？","ref":"等于重叠区间的长度，不必真积。矩形卷积可直接用“形状表”。"},{"ask":"用面积和宽度验算：总面积等于两个信号面积之积吗？","ref":"面积守恒：∫y=∫x·∫h；宽度相加：支撑宽度=L_x+L_h。"}],"trap":"分界点算错；漏乘 u(t)；把 h(t−τ) 的平移方向搞反。","example":{"q":"x=u(t)−u(t−1)，h=u(t)−u(t−2)，求 y。","a":"分段梯形：t∈[0,1) 为 t；[1,2) 为 1；[2,3) 为 3−t；其余 0。"}},{"id":"g6","ch":3,"title":"离散卷积和","clues":"给差分方程或两个序列，求 y[k]=x[k]∗h[k]","rule":"y[k]=Σx[n]h[k−n]；结果长度 N₁+N₂−1；a^k u[k]∗a^k u[k]=(k+1)a^k u[k]","steps":[{"ask":"先写出两个序列的非零区间和长度。","ref":"x[k] 长度 N₁、h[k] 长度 N₂，则 y[k] 长度 N₁+N₂−1，起点为两者起点之和。"},{"ask":"用列表法或竖式乘法逐项相乘相加，第一项和最后一项分别是多少？","ref":"竖式乘法把 h 反转滑动；列表法固定 k 逐项求和。"},{"ask":"用“长度”和“总和”两个不变量验算。","ref":"Σy=(Σx)(Σh)；长度=N₁+N₂−1。两个都对，基本不会错。"},{"ask":"若出现 a^k u[k] 自卷积，套哪个公式？和 u[k]∗a^k u[k] 有何不同？","ref":"自卷积=(k+1)a^k u[k]；阶跃卷指数=(1−a^{k+1})/(1−a)，两者完全不同。"}],"trap":"把 a^k∗a^k 与 u[k]∗a^k 的公式混用；下标起点算错。","example":{"q":"y[k]−0.5y[k−1]=x[k]，y[−1]=1，x=u[k]，求全响应。","a":"y_zi=(0.5)^{k+1}，y_zs=2−(0.5)^k，合计 2−(0.5)^{k+1}，k≥0。"}},{"id":"g7","ch":4,"title":"傅里叶系数、频谱与功率","clues":"周期信号，求 C_n、画频谱、求平均功率","rule":"ω₀=2π/T₀；C_n=(1/T₀)∫_{T₀}x(t)e^{−jnω₀t}dt；P=Σ|C_n|²","steps":[{"ask":"先算 ω₀，并选定一个周期作为积分区间。","ref":"ω₀=2π/T₀；区间可以平移，选使表达式最简单的一段。"},{"ask":"分段积分时，n=0 要不要单独算？","ref":"要。C₀ 是平均值（直流分量），代入 e^0=1 单独积。"},{"ask":"用对称性化简：偶信号、奇信号、半波对称分别给出什么结论？","ref":"偶 → C_n 实；奇 → C_n 纯虚；半波对称 → 只有奇次谐波。"},{"ask":"用帕塞瓦尔求功率，再用时域均方值验算。","ref":"P=Σ|C_n|²；50% 的 0/1 方波 P=½，与周期无关。"}],"trap":"C_n 与三角形式系数 a_n 混；功率漏 1/2；积分区间取错。","example":{"q":"T₀=2 的方波，0\u003ct\u003c1 为 1，1\u003ct\u003c2 为 0，求 C_n 与前三次谐波。","a":"C₀=½，C_n=0（偶），C_n=−j/(nπ)（奇）；x=½+(2/π)sinπt+(2/3π)sin3πt+…，P=½。"}},{"id":"g8","ch":5,"title":"抽样定理与混叠","clues":"给最高频率，问奈奎斯特速率 / 是否混叠 / 恢复滤波器截止频率","rule":"f_s≥2f_m；f_s\u003c2f_m 时混叠频率为 |f_0−kf_s| 中最小的那个","steps":[{"ask":"先确认信号的最高频率 f_m。相乘、平方、Sa 这些运算会改变带宽吗？","ref":"时域相乘 → 频域卷积，带宽相加；平方 → 带宽翻倍；Sa 的带宽要换算成 Hz（÷2π）。"},{"ask":"算出 2f_m，与给定 f_s 比较。","ref":"f_s≥2f_m 才能无失真恢复；等于 2f_m 是临界抽样。"},{"ask":"若 f_s\u003c2f_m，混叠后的频率是多少？","ref":"采样后频谱以 f_s 为周期搬移，落在 [0,f_s/2] 内的那个就是混叠频率。"}],"trap":"只背 2 倍，不看信号实际带宽；平方信号仍按原带宽算。","example":{"q":"f_m=4 kHz，f_s 至少多少？若 f_s=6 kHz，10 kHz 分量会混叠到哪？","a":"f_s≥8 kHz；10−6=4 kHz，混叠到 4 kHz。"}},{"id":"g9","ch":7,"title":"拉普拉斯反变换：部分分式","clues":"给 H(s) 或 X(s)，求 h(t)/x(t)","rule":"先化真分式；单极点 A/(s+a) ↔ Ae^{−at}u(t)；重极点产生 t 的幂","steps":[{"ask":"分子阶数是否小于分母？不是的话先做什么？","ref":"先做多项式长除，分出常数项/多项式，余下真分式再展开。"},{"ask":"分母因式分解，极点有哪些？有没有重根或共轭复根？","ref":"极点决定 e^{−at} 的形式；共轭复根配成 e^{αt}cos/sin。"},{"ask":"待定系数展开，单极点的系数怎么求最快？","ref":"覆盖法：A=(s+a)F(s)|_{s=−a}。"},{"ask":"逐项查表并写收敛域。","ref":"因果信号 ROC 在极点右侧；稳定要求 ROC 含虚轴。"}],"trap":"假分式不先除；重极点仍按单极点设系数。","example":{"q":"求 1/(s²+3s+2) 的反变换。","a":"=1/(s+1)−1/(s+2) → (e^{−t}−e^{−2t})u(t)。"}},{"id":"g10","ch":8,"title":"z 域系统函数与稳定性","clues":"给 H(z) 或差分方程，判断稳定/因果，或求响应","rule":"稳定 ⇔ 极点全在单位圆内；因果 ⇔ ROC 为某圆外且含 z=∞","steps":[{"ask":"把 H(z) 写成 z 的正幂或负幂，极点在哪里？","ref":"H(z)=z/(z−0.5) 极点 z=0.5；也可写 1/(1−0.5z^{−1})。"},{"ask":"算极点的模，与 1 比较。","ref":"|0.5|\u003c1 → 稳定；|2|>1 → 不稳定。"},{"ask":"结合 ROC 判断因果性：ROC 在圆外还是圆内？","ref":"因果序列 ROC 为 |z|>r（圆外）；反因果为 |z|\u003cr。"}],"trap":"把 s 平面“左半平面”直接套成 z 平面“左半”；忽略 ROC 只谈极点。","example":{"q":"H(z)=z/(z−0.5)，判断稳定性与因果性。","a":"极点 0.5 在单位圆内；ROC |z|>0.5 含 ∞ → 稳定且因果。"}}],"formula":[{"title":"抽样定理为什么是 2 倍","q":"从“采样后频谱搬移”出发，说明 f_s≥2f_m 的来历。","steps":["采样 = 乘冲激串，频域 = 原频谱以 f_s 为周期复制。","复制后相邻两块频谱的间距是 f_s。","要让 Blocks 不重叠，需 f_s−f_m>f_m，即 f_s>2f_m。","临界 2f_m 时边缘相接，工程上要留余量。"],"final":"f_s ≥ 2f_m；否则高频搬到低频，形成混叠。"},{"title":"指数卷积公式的来历","q":"推导 e^{αt}u(t)∗e^{βt}u(t)。","steps":["y(t)=∫_0^t e^{ατ}e^{β(t−τ)}dτ（t>0）。","提出 e^{βt}：y=e^{βt}∫_0^t e^{(α−β)τ}dτ。","积分得 (e^{(α−β)t}−1)/(α−β)。","乘 e^{βt} 整理，并补 u(t)。"],"final":"(e^{βt}−e^{αt})/(β−α)·u(t)，α≠β。"},{"title":"δ(at) 的缩放性质","q":"为什么 δ(2t) 等于 ½δ(t)，而不是 2δ(t)？","steps":["δ 的定义是“面积为 1 的冲激”，看的是积分值而不是高度。","令 u=at，∫f(t)δ(at)dt=(1/|a|)∫f(u/a)δ(u)du。","右边等于 f(0)/|a|。","所以 δ(at)=δ(t)/|a|，系数是 1/|a|。"],"final":"δ(at)=δ(t)/|a|；负号被绝对值消掉。"}],"project":{"name":"一阶离散系统的 z 域分析","desc":"用差分方程 y[k]−0.5y[k−1]=x[k] 走完“极点→稳定性→阶跃终值”三步。","steps":[{"ask":"该系统函数 H(z) 的极点是（填数值）","unit":"","value":0.5,"hint":"H(z)=1/(1−0.5z^{−1})=z/(z−0.5)，极点为 0.5。"},{"ask":"极点模小于 1，系统是否稳定？（稳定填 1，不稳定填 0）","unit":"","value":1,"hint":"极点 0.5 在单位圆内，系统稳定且因果。"},{"ask":"单位阶跃输入下的终值 y[∞]（填数值）","unit":"","value":2,"hint":"终值定理：lim (z−1)Y(z)/z = 1/(1−0.5)=2。"}]},"lab":{"title":"抽样与混叠实验室","desc":"改变信号频率与抽样频率，观察样点能否唯一还原正弦，并读出混叠频率。"}}};</script>
<script>'use strict';
/* ================= 基础 ================= */
const C = window.COURSE, X = C.x || {};
const $ = (s, r = document) => r.querySelector(s);

function norm(s) {
  return T(s).normalize('NFKC').toLowerCase()
    .replace(/<[^>]+>/g, '')
    .replace(/[\s。；;、，,．.·`'"]/g, '')
    .replace(/[（(]/g, '(').replace(/[）)]/g, ')')
    .replace(/[−–—]/g, '-')
    .replace(/×/g, 'x').replace(/÷/g, '/');
}
function doc(h) {
  let s = String(h || '');
  s = s.replace(/<table/g, '<div class="tablewrap"><table').replace(/<\/table>/g, '</table></div>');
  return s;
}

function paintRail() {
  const rail = $('#rail'); if (!rail) return;
  const obj = BANKS.objective;
  const done = obj.filter(q => R(q.id).ok).length;
  const star = C.bank.filter(q => R(q.id).star).length;
  const weak = C.bank.filter(q => R(q.id).status === 'weak').length;
  const last = store.get('last', '');
  const lq = last ? QBY.get(last) : null;
  const rs = obj.map(q => R(q.id)).filter(r => r.tries);
  const t = rs.reduce((s, r) => s + r.tries, 0), o = rs.reduce((s, r) => s + (r.ok || 0), 0);
  const acc = t ? Math.round(o / t * 100) : 0;
  rail.innerHTML = `
    <div class="k">Study Desk</div><h3>我的学习概览</h3>
    <div class="blk"><div class="big">${done}<small> / ${obj.length}</small></div><div class="q">客观题已独立答对</div>
      <div class="row"><span>答题正确率</span><b>${acc}%</b></div>
      <div class="row"><span>收藏原题</span><b>${star}</b></div>
      <div class="row"><span>大题自评通过</span><b>${BANKS.written.filter(q => R(q.id).status === 'ok').length} / ${BANKS.written.length}</b></div>
      <div class="row"><span>待补练</span><b>${weak}</b></div>
      <div class="row" style="border:0"><span>已交模拟卷</span><b>${EXAMS.length}</b></div>
    </div>
    <div class="blk"><div class="k">继续学习</div>
      <div class="q" style="margin-top:6px">${lq ? E((CH.get(lq.ch) || {}).title || '') + ' · ' + E(lq.no) : '还没有开始，先做一道客观题试试。'}</div>
      <a class="next" href="${lq ? '#/bank/objective?id=' + encodeURIComponent(lq.id) : '#/bank/objective'}">${lq ? '接着这一题 →' : '开始第一道题 →'}</a>
      <div class="mini"><a href="#/errors">错题分析</a><a href="#/exam">模拟考试</a><a href="#/report">学习报告</a></div>
    </div>
    <div class="blk"><div class="k">今日建议</div><div class="q" style="margin-top:6px">${suggest()}</div></div>`;
  const pct = obj.length ? Math.round(done / obj.length * 100) : 0;
  const sp = $('#sideMaster'), sb = $('#sideBar'), st = $('#sideProg');
  if (sp) sp.textContent = pct + '%';
  if (sb) sb.style.width = pct + '%';
  if (st) st.textContent = `已掌握 ${done} / ${obj.length}`;
}
function suggest() {
  const due = BANKS.objective.filter(q => { const r = R(q.id); return r.due && r.due <= Date.now(); }).length;
  const weak = C.bank.filter(q => R(q.id).status === 'weak').length;
  if (weak) return `有 ${weak} 道题标记为待补练，建议先做错题重练，再开新章。`;
  if (due) return `有 ${due} 道题到期，按 1/3/7 天节奏复测一遍最划算。`;
  const un = C.chapters.find(c => BANKS.objective.some(q => q.ch === c.n && !R(q.id).tries));
  return un ? `下一章建议：第 ${un.n} 章《${E(un.title)}》。先读知识讲解，再做随堂练习。` : '客观题已全部做过一遍，建议转大题专练，按评分点自评。';
}

function go(path) { if (location.hash === '#/' + path) route(); else location.hash = '#/' + path; }
function route() {
  const rawFull = location.hash.replace(/^#\/?/, '') || 'home';
  const raw = rawFull.split('?')[0];
  const [view, a, b] = raw.split('/');
  CURRENT = view + (a ? '/' + a : '');
  document.body.classList.remove('nav-open');
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  document.body.classList.toggle('bank', view === 'bank');
  const main = $('#main');
  window.speechSynthesis && speechSynthesis.cancel();
  const map = { home, learn, guide, voice, overview, drill, exam, review, errors, graph, library, notes, slides, lab, code, formula, project, path, report, challenge, community, flash, saved };
  if (view === 'bank') bankPage(a || 'objective'); else (map[view] || home)(a, b);
  paintRail();
  if (view !== 'learn') main.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ================= 题目渲染 ================= */
function qTags(q) {
  const t = (q.tags || []).filter(x => !['讲义提炼'].includes(x));
  return t.slice(0, 2).map(x => `<span class="badge ${x === '待核对' ? 'o' : 'p'}">${E(x)}</span>`).join('');
}
function qMeta(q) {
  return `<div class="qmeta"><span class="no">${E(q.no)}</span><span class="badge b">${KIND[q.kind] || '题目'}</span>
    <span class="sp">·</span><span>第 ${q.ch} 章 · ${E((CH.get(q.ch) || {}).title || '')}</span>${qTags(q) ? '<span class="sp">·</span>' + qTags(q) : ''}
    <span class="src">${E(q.source || '')}</span></div>`;
}
function blankCount(q) { const m = String(q.stem).match(/_{3,}|（\s*）|\(\s*\)/g); return Math.max(1, m ? m.length : 1); }
function answerParts(q) {
  if (q.accept && q.accept.length) return q.accept;
  return T(q.answer).split(/[；;]/).map(s => s.trim()).filter(Boolean);
}
function sameText(input, want) {
  const a = norm(input), b = norm(want);
  if (!a || !b) return false;
  if (a === b) return true;
  const na = Number(a.replace(/[^\d.eE+\-]/g, '')), nb = Number(b.replace(/[^\d.eE+\-]/g, ''));
  if (a.match(/^[\d.]+$/) && b.match(/^[\d.]+$/) && Number.isFinite(na) && Number.isFinite(nb)) return Math.abs(na - nb) < 1e-6;
  return b.length >= 4 && (a.includes(b) || b.includes(a));
}
function hitBlank(input, accepts) { return (accepts || []).some(x => sameText(input, x)); }

function optionsHTML(q, picked) {
  return `<div class="opts" role="group" aria-label="选项">${q.options.map(o => `
    <button class="opt ${picked === o.key ? 'pick' : ''}" data-k="${o.key}"><span class="k">${o.key}</span><span class="oh">${doc(o.html)}</span></button>`).join('')}</div>`;
}
function judgeHTML(q, picked) {
  return `<div class="judge" role="group" aria-label="判断"><button data-k="√" class="${picked === '√' ? 'pick' : ''}">正确 √</button><button data-k="×" class="${picked === '×' ? 'pick' : ''}">错误 ×</button></div>`;
}
function fillHTML(q, values) {
  const n = blankCount(q);
  return `<div class="fills">${Array.from({ length: n }, (_, i) => `<div class="fillrow"><span>第 ${i + 1} 空</span><input data-i="${i}" value="${E((values || [])[i] || '')}" placeholder="写下答案"><span class="mark"></span></div>`).join('')}</div>`;
}
function qBody(q, state) {
  if (q.kind === 'choice') return optionsHTML(q, state.pick);
  if (q.kind === 'judge') return judgeHTML(q, state.pick);
  return fillHTML(q, state.vals);
}
function feedHTML(q, ok) {
  let shown = q.answer;
  if (q.kind === 'choice' && q.answerKey) {
    const o = (q.options || []).find(x => x.key === q.answerKey);
    if (o) shown = `${q.answerKey}. ${o.html}`;
  }
  const ans = shown ? `<div class="ans"><b>参考答案</b>　<span class="doc" style="display:inline">${doc(shown)}</span></div>` : '<div class="ans"><b>参考答案</b>　本题原文未给答案，标为待核对。</div>';
  return `<div class="feed">${ok ? '<p class="badge g">答对了</p>' : '<p class="badge r">这次没对</p>'}${ans}
    ${q.why ? `<div class="why doc">${doc(q.why)}</div>` : ''}
    ${ok ? '' : `<div class="cause"><span>错在哪：</span>${['概念', '选式', '单位', '运算', '表述'].map(c => `<button class="chip" data-cause="${c}">${c}</button>`).join('')}</div>`}
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="weak">加入补练</button>${variantLink(q)}</div></div>`;
}

let qSeq = 0;
function objectiveCard(q, opts = {}) {
  const r = R(q.id);
  const values = opts.values || [];
  const pickv = opts.pick || '';
  const html = `<article class="qcard" id="qc${++qSeq}" data-qid="${q.id}">
    ${qMeta(q)}
    <div class="qstem doc">${doc(q.stem)}</div>
    ${qBody(q, { pick: pickv, vals: values })}
    <div class="qfoot">
      ${q.kind === 'fill' ? '<button class="btn pri" data-act="check">核对答案</button>' : ''}
      <button class="btn" data-act="star">${r.star ? '★ 已收藏' : '☆ 收藏'}</button>
      <span class="state">${r.status === 'ok' ? '已掌握' : r.status === 'weak' ? '待补练' : '未核对'}${r.tries ? ' · 作答 ' + r.tries + ' 次' : ''}</span>
    </div></article>`;
  return html;
}

function bindObjective(root, q, opts = {}) {
  const card = root.querySelector('.qcard') || root;
  let done = false;
  const picked = { k: opts.pick || '' };
  const record = ok => { if (opts.noRecord) return; recordAnswer(q, ok); };
  const finish = (ok, detail) => {
    if (done) return; done = true;
    card.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (q.kind === 'choice') { if (b.dataset.k === q.answerKey) b.classList.add('right'); if (b.dataset.k === picked.k && picked.k !== q.answerKey) b.classList.add('wrong'); } });
    card.querySelectorAll('.judge button').forEach(b => { b.disabled = true; if (b.dataset.k === q.answerKey) b.classList.add('right'); if (b.dataset.k === picked.k && picked.k !== q.answerKey) b.classList.add('wrong'); });
    if (detail) card.querySelectorAll('.fillrow').forEach((row, i) => {
      const mark = row.querySelector('.mark');
      if (detail[i] !== undefined) { mark.textContent = detail[i] ? '✓' : '✗'; mark.className = 'mark ' + (detail[i] ? 'ok' : 'no'); }
      row.querySelector('input').disabled = true;
    });
    const host = document.createElement('div');
    host.innerHTML = feedHTML(q, ok);
    card.appendChild(host);
    bindFeed(card, q, ok);
    if (q.kind !== 'choice' || q.answerKey) record(ok);
    const st = card.querySelector('.qfoot .state');
    if (st) st.textContent = ok ? '已掌握 · 已记录' : '待补练 · 已记录';
    opts.onAnswer && opts.onAnswer(ok, q);
  };
  const checkFill = () => {
    const vals = $$('.fillrow input', card).map(i => i.value);
    if (vals.every(v => !v.trim())) { alert('先写下答案，再核对。'); return; }
    const parts = answerParts(q);
    const detail = vals.map((v, i) => hitBlank(v, parts[i] ? [].concat(parts[i]) : parts));
    const ok = detail.length > 0 && detail.every(Boolean);
    store.set('draft:' + q.id, vals);
    finish(ok, detail);
  };
  if (q.kind === 'choice') {
    $$('.opt', card).forEach(b => b.onclick = () => {
      if (done) return;
      picked.k = b.dataset.k;
      $$('.opt', card).forEach(x => x.classList.toggle('pick', x === b));
      store.set('pick:' + q.id, picked.k);
      const ok = picked.k === q.answerKey;
      if (!q.answerKey) { alert('本题原文答案待核对，先按参考答案自评。'); }
      finish(ok);
    });
  } else if (q.kind === 'judge') {
    $$('.judge button', card).forEach(b => b.onclick = () => {
      if (done) return;
      picked.k = b.dataset.k;
      $$('.judge button', card).forEach(x => x.classList.toggle('pick', x === b));
      finish(picked.k === q.answerKey);
    });
  } else {
    const cbtn = card.querySelector('[data-act="check"]');
    if (cbtn) cbtn.onclick = checkFill;
    $$('.fillrow input', card).forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkFill(); }));
    $$('.fillrow input', card).forEach((inp, i) => inp.oninput = () => { const v = $$('.fillrow input', card).map(x => x.value); store.set('draft:' + q.id, v); });
  }
  card.querySelector('[data-act="star"]').onclick = ev => {
    const on = !R(q.id).star; setR(q.id, { star: on }); ev.target.textContent = on ? '★ 已收藏' : '☆ 收藏';
  };
}
function variantLink(q) {
  const pool = (q.group === 'objective' ? BANKS.objective : BANKS.written).filter(x => !x.needsCheck && x.ch === q.ch && x.id !== q.id && x.kind === q.kind);
  if (!pool.length) return '';
  const v = pool[Math.floor(Math.random() * pool.length)];
  return `<a class="btn sm" href="#/bank/${q.group === 'objective' ? 'objective' : 'written'}?id=${encodeURIComponent(v.id)}" title="同章同题型、条件和数值都换了">换一道同类题 · ${E(v.no)}</a>`;
}
function bindFeed(card, q, ok) {
  const weak = card.querySelector('[data-act="weak"]'), star = card.querySelector('[data-act="star"]');
  if (weak) weak.onclick = () => { setR(q.id, { status: 'weak', due: Date.now() + 864e5 }); weak.textContent = '已加入补练'; weak.disabled = true; };
  if (star) star.onclick = () => { const on = !R(q.id).star; setR(q.id, { star: on }); star.textContent = on ? '★ 已收藏' : '☆ 收藏'; };
  $$('[data-cause]', card).forEach(b => b.onclick = () => { setR(q.id, { cause: b.dataset.cause }); $$('[data-cause]', card).forEach(x => x.classList.toggle('on', x === b)); });
}
function recordAnswer(q, ok) {
  const r = R(q.id);
  const tries = (r.tries || 0) + 1, okc = (r.ok || 0) + (ok ? 1 : 0), bad = (r.bad || 0) + (ok ? 0 : 1);
  const streak = ok ? (r.streak || 0) + 1 : 0;
  const days = [1, 3, 7, 15, 30][Math.min(streak, 4)];
  setR(q.id, { tries, ok: okc, bad, streak, last: Date.now(), due: Date.now() + days * 864e5, status: ok ? 'ok' : 'weak' });
  store.set('last', q.id);
}

      (scope === 'star' && R(q.id).star) ||
      (scope === 'weak' && R(q.id).status === 'weak') ||
      (scope === 'wrong' && (R(q.id).bad || 0) > 0) ||
      (scope === 'todo' && !R(q.id).tries)));
    if (!bankPool.length) { $('#qhost').innerHTML = '<div class="empty">没有匹配题目，调整章节或筛选条件。</div>'; $('#jump').innerHTML = ''; return; }
    bankIndex = keepId ? Math.max(0, bankPool.findIndex(q => q.id === keepId)) : 0;
    $('#jump').innerHTML = bankPool.map((q, i) => `<option value="${i}" ${i === bankIndex ? 'selected' : ''}>第 ${q.ch} 章 · ${E(q.no)}　${E(T(q.stem).slice(0, 34))}</option>`).join('');
    drawQ();
  };
  const drawQ = () => {
    const q = bankPool[bankIndex]; if (!q) return;
    $('#jump').value = bankIndex;
    $('#prev').disabled = bankIndex === 0;
    $('#next').disabled = bankIndex >= bankPool.length - 1;
    const host = $('#qhost');
    if (q.group === 'written') { host.innerHTML = writtenCard(q); bindWritten(host, q); }
    else { host.innerHTML = objectiveCard(q, { values: store.get('draft:' + q.id, []), pick: store.get('pick:' + q.id, '') }); bindObjective(host, q); }
    store.set('last', q.id);
    paintRail();
  };
  $('#fch').onchange = () => refresh();
  $('#fscope').onchange = () => refresh();
  if ($('#fkind')) $('#fkind').onchange = () => refresh();
  let tm; $('#fq').oninput = () => { clearTimeout(tm); tm = setTimeout(() => refresh(), 220); };
  $('#jump').onchange = ev => { bankIndex = +ev.target.value; drawQ(); };
  $('#prev').onclick = () => { if (bankIndex > 0) { bankIndex--; drawQ(); } };
  $('#next').onclick = () => { if (bankIndex < bankPool.length - 1) { bankIndex++; drawQ(); } };
  document.onkeydown = ev => {
    if (!CURRENT.startsWith('bank')) return;
    if (ev.target.matches('input,textarea,select')) return;
    if (ev.key === 'ArrowLeft') $('#prev').click();
    if (ev.key === 'ArrowRight') $('#next').click();
  };
  refresh(qid || qs.get('id'));
}

function writtenCard(q) {
  const r = R(q.id);
  return `<article class="qcard" id="wc" data-qid="${q.id}">
    ${qMeta(q)}
    <div class="qstem doc">${doc(q.stem)}</div>
    <label class="small muted" style="display:block;margin-top:10px">我的卷面答案（先写完整过程，再对照评分点）</label>
    <textarea id="wdraft" rows="7" placeholder="写出：已知 → 所求 → 公式与条件 → 代入 → 结果与单位 / 结论">${E(r.draft || '')}</textarea>
    <div class="qfoot"><button class="btn pri" data-act="reveal">对照评分点自评</button><button class="btn" data-act="star">${r.star ? '★ 已收藏' : '☆ 收藏'}</button>

function bindWritten(root, q) {

      <div class="row" style="margin-top:10px"><button class="btn green" data-act="pass">独立通过</button><button class="btn" data-act="weak2">仍需补练</button><span class="small muted" id="ptout"></span></div></div>
      <div class="cause"><span>错在哪：</span>${['概念', '选式', '单位', '运算', '表述'].map(c => `<button class="chip" data-cause="${c}">${c}</button>`).join('')}</div></div>`;

    $$('[data-pt]', card).forEach(x => x.onchange = update);
    card.querySelector('[data-act="pass"]').onclick = () => { setR(q.id, { status: 'ok', last: Date.now(), due: Date.now() + 3 * 864e5, streak: (R(q.id).streak || 0) + 1 }); alert('已记录：独立通过。3 天后进入复习。'); };
    card.querySelector('[data-act="weak2"]').onclick = () => { setR(q.id, { status: 'weak', last: Date.now(), due: Date.now() + 864e5 }); alert('已加入补练。建议先看解析，再关掉答案重写一遍。'); };
  };
}

/* ================= 随堂练习 ================= */
function drill(a) {
  const qs = new URLSearchParams(location.hash.split('?')[1] || '');
  const ch = Number(qs.get('ch') || 0);
  const diag = qs.get('diag') === '1';
  const pool = SCORABLE.filter(q => !ch || q.ch === ch);
  const items = sample(pool, Math.min(diag ? 3 : 8, pool.length));
  if (!items.length) return ($('#main').innerHTML = '<div class="empty">本章暂无客观题，请到大题专练或换一章。</div>');
  let i = 0, right = 0, answered = false;
  const draw = () => {
    if (i >= items.length) return result();
    const q = items[i], r = R(q.id);
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 随堂练习</div>
      <div class="row" style="justify-content:space-between"><h1 class="ph">${diag ? '入门诊断' : '随堂练习'}</h1><span class="small muted">${ch ? '第 ' + ch + ' 章' : '全章混合'}</span></div>
      ${diag ? '<p class="small muted" style="margin:-6px 0 10px">3 道短题，只用来判断下一步从哪章开始；不计入考试成绩。</p>' : ''}
      <div class="drillbar"><div class="bar"><i style="width:${Math.round(i / items.length * 100)}%"></i></div><small>${i + 1} / ${items.length} · 已对 ${right}</small></div>
      ${objectiveCard(q, { pick: store.get('pick:' + q.id, '') })}
      <div class="navq"><button class="btn" id="quitD">结束练习</button><button class="btn pri" id="nextD" disabled>下一题 →</button></div>`;
    answered = false;
    bindObjective($('#main'), q, { onAnswer: ok => { if (answered) return; answered = true; if (ok) right++; $('#nextD').disabled = false; $('#nextD').textContent = i + 1 >= items.length ? '看结果 →' : '下一题 →'; } });
    $('#nextD').onclick = () => { i++; draw(); };
    $('#quitD').onclick = () => { i = items.length; result(); };
  };
  const result = () => {
    const weak = items.filter(q => R(q.id).status === 'weak');
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 随堂练习</div>
      <div class="result"><div class="big">${right}<small> / ${items.length}</small></div><p class="muted">${diag ? '诊断结果：独立答对' : '本组独立答对'}</p>
      ${weak.length ? `<p>待补练 ${weak.length} 题：${weak.map(q => E(q.no)).join('、')}</p>` : '<p>本组没有新增错题。</p>'}
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" id="again">再来一组</button><a class="btn" href="#/path">看学习路径</a><a class="btn" href="#/errors">看错题分析</a></div></div>`;
    $('#again').onclick = () => go('drill' + (diag ? '?diag=1' : (ch ? '?ch=' + ch : '')));
  };
  draw();
}

/* ================= 模拟考试 ================= */
let examTimer = null, EXAM = null;
function exam(a) {
  const qs = new URLSearchParams(location.hash.split('?')[1] || '');
  const preset = Number(qs.get('ch') || 0);
  if (qs.get('start') === '1') return; // 由开始按钮触发
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 模拟考试</div>
  <h1 class="ph">模拟考试</h1><p class="psub">按章组卷：客观题自动判分，大题交卷后按评分点自评。限时结束会自动交卷。</p>
  <div class="panel"><div class="row">
    <label class="field">范围<select id="ech"><option value="0">全章混合</option>${C.chapters.filter(c => C.bank.some(q => q.ch === c.n)).map(c => `<option value="${c.n}" ${preset === c.n ? 'selected' : ''}>第 ${c.n} 章 · ${E(c.title)}</option>`).join('')}</select></label>

    <button class="btn pri" id="estart">开始组卷</button>
  </div><p class="small muted" style="margin:10px 0 0">历史交卷 ${EXAMS.length} 次${EXAMS.length ? ' · 最近 ' + fmtTime(EXAMS[0].time) : ''}。试卷只在本机生成，不联网。</p></div>
  <div id="epaper"></div>`;
  $('#estart').onclick = () => startExam(+$('#ech').value, +$('#ecount').value, +$('#ewcount').value, +$('#etime').value);
}
function startExam(ch, oc, wc, mins) {
  const pool = SCORABLE.filter(q => !ch || q.ch === ch);
  const wp = BANKS.written.filter(q => !q.needsCheck && (!ch || q.ch === ch));
  const items = sample(pool, Math.min(oc, pool.length)).concat(sample(wp, Math.min(wc, wp.length)));
  if (!items.length) return alert('该范围没有可用题目。');
  EXAM = { items, ans: {}, ch, start: Date.now(), end: Date.now() + mins * 60000, mins, submitted: false };
  const tick = () => {
    if (!EXAM || EXAM.submitted) return;
    const left = Math.max(0, EXAM.end - Date.now());
    const el = $('#etimer'); if (el) el.textContent = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left % 60000 / 1000))}`;
    if (left <= 0) submitExam();
  };
  clearInterval(examTimer); examTimer = setInterval(tick, 500);
  $('#main').innerHTML = `<div class="row" style="justify-content:space-between;margin:16px 0 4px"><div><div class="bk small muted">${E(C.name)} · 模拟卷</div><h1 class="ph" style="font-size:22px">${ch ? '第 ' + ch + ' 章' : '全章混合'} · ${items.length} 题</h1></div><div class="row"><span class="timer" id="etimer">--:--</span><button class="btn pri" id="esubmit">交卷</button></div></div>
  <p class="small muted">客观题 ${Math.min(oc, pool.length)} 道 · 大题 ${Math.min(wc, wp.length)} 道 · 答案只在交卷后显示。</p>
  <div id="elist">${items.map((q, i) => `<section class="examq" data-qid="${q.id}">
    <div class="qn">第 ${i + 1} 题 · ${KIND[q.kind]} · 第 ${q.ch} 章 ${E(q.no)}</div>
    <div class="qstem doc">${doc(q.stem)}</div>
    ${q.group === 'written' ? `<textarea rows="5" data-w="${q.id}" placeholder="卷面答案（交卷后自评）"></textarea>` : qBody(q, {})}
  </section>`).join('')}</div>
  <div class="row" style="margin:14px 0 60px"><button class="btn pri" id="esubmit2">交卷核对</button><span class="small muted">交卷前请检查是否有漏答。</span></div>`;
  $$('#elist .opt').forEach(b => b.onclick = () => {
    const card = b.closest('.examq'), qid = card.dataset.qid;
    $$('.opt', card).forEach(x => x.classList.toggle('pick', x === b));
    EXAM.ans[qid] = b.dataset.k;
  });
  $$('#elist .judge button').forEach(b => b.onclick = () => {
    const card = b.closest('.examq'), qid = card.dataset.qid;
    $$('.judge button', card).forEach(x => x.classList.toggle('pick', x === b));
    EXAM.ans[qid] = b.dataset.k;
  });
  $$('#elist .fillrow input').forEach(inp => {
    const card = inp.closest('.examq'), qid = card.dataset.qid;
    inp.oninput = () => { const vals = $$('.fillrow input', card).map(x => x.value); EXAM.ans[qid] = vals; };
  });
  $$('#elist textarea[data-w]').forEach(t => t.oninput = () => { EXAM.ans[t.dataset.w] = t.value; });
  $('#esubmit').onclick = submitExam; $('#esubmit2').onclick = submitExam;
  tick();
}
function submitExam() {
  if (!EXAM || EXAM.submitted) return;
  if (!confirm('确认交卷？交卷后不能再修改答案。')) return;
  EXAM.submitted = true; clearInterval(examTimer);
  const obj = EXAM.items.filter(q => q.group === 'objective');
  let hits = 0, graded = [];
  obj.forEach(q => {
    let ok = false;
    if (q.kind === 'choice' || q.kind === 'judge') ok = EXAM.ans[q.id] === q.answerKey;
    else {
      const vals = EXAM.ans[q.id] || [], parts = answerParts(q);
      ok = vals.length > 0 && vals.every((v, i) => hitBlank(v, parts[i] ? [].concat(parts[i]) : parts));
    }
    if (ok) hits++;
    graded.push({ q, ok, given: EXAM.ans[q.id] });
  });
  const written = EXAM.items.filter(q => q.group === 'written');
  const rec = { time: Date.now(), ch: EXAM.ch, total: obj.length, hits, written: written.length, minutes: EXAM.mins, self: null };
  EXAMS = [rec].concat(EXAMS).slice(0, 50); store.set('exams', EXAMS);
  const score = obj.length ? Math.round(hits / obj.length * 100) : 0;
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 模拟考试 / 交卷</div>
  <div class="result"><div class="big">${score}<small> 分</small></div><p class="muted">客观题 ${hits} / ${obj.length} 自动判分；大题 ${written.length} 道需按点自评</p>
  <p class="small muted">用时 ${Math.round((Date.now() - EXAM.start) / 60000)} 分钟 · 记录已保存</p>
  <div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#/report">看学习报告</a><a class="btn" href="#/errors">错题分析</a><button class="btn" id="eagain">再考一次</button></div></div>
  <h2 class="sec">逐题核对</h2>
  ${graded.map(({ q, ok, given }, i) => `<div class="review ${ok ? 'ok' : 'no'}"><b>${i + 1}. ${E(q.no)}　${ok ? '<span class="badge g">正确</span>' : '<span class="badge r">错误</span>'}</b>
    <div class="small muted">我的作答：${E(Array.isArray(given) ? given.join('；') : (given || '未答'))}</div>
    <details><summary class="small">看答案与解析</summary><div class="doc">${doc(q.answer)}${q.why ? doc(q.why) : ''}</div></details>
    ${ok ? '' : `<button class="btn sm" data-weak="${q.id}">加入补练</button>`}</div>`).join('')}
  ${written.length ? `<h2 class="sec">大题自评</h2>${written.map((q, i) => `<div class="review"><b>${E(q.no)}</b><div class="doc">${doc(q.stem)}</div>
    <p class="small muted">我的卷面：${E((EXAM.ans[q.id] || '未答').slice(0, 160))}</p>
    <details><summary class="small">参考答案与评分点</summary><div class="doc">${doc(q.answer)}</div></details>
    <label class="small">自评得分（0–10）<input type="number" min="0" max="10" data-self="${q.id}" style="width:78px;margin-left:6px"></label>
    <button class="btn sm" data-selfsave="${q.id}">保存自评</button></div>`).join('')}` : ''}`;
  $$('[data-weak]').forEach(b => b.onclick = () => { setR(b.dataset.weak, { status: 'weak', due: Date.now() + 864e5 }); b.textContent = '已加入'; b.disabled = true; });
  $$('[data-selfsave]').forEach(b => b.onclick = () => {
    const inp = $(`[data-self="${b.dataset.selfsave}"]`); const v = +inp.value;
    if (!Number.isFinite(v)) return alert('填 0–10 的分数');
    const q = QBY.get(b.dataset.selfsave); setR(q.id, { draft: (EXAM.ans[q.id] || ''), status: v >= 6 ? 'ok' : 'weak', self: v, last: Date.now(), due: Date.now() + (v >= 6 ? 3 : 1) * 864e5 });
    b.textContent = '已保存'; b.disabled = true;
  });
  $('#eagain').onclick = () => go('exam');
  paintRail();
  EXAM = null;
}

/* ================= 错题分析 ================= */
function errors() {
  const bad = C.bank.filter(q => (R(q.id).bad || 0) > 0 || R(q.id).status === 'weak')
    .sort((a, b) => (R(b.id).bad || 0) - (R(a.id).bad || 0));
  const causes = {};
  C.bank.forEach(q => { const c = R(q.id).cause; if (c) causes[c] = (causes[c] || 0) + 1; });
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 错题分析</div>
  <h1 class="ph">错题分析</h1><p class="psub">按“错了几次”排序；错因由你在作答后自己标记，不用关键词猜。</p>
  ${bad.length ? `<div class="panel"><div class="row"><button class="btn pri" id="redo">重练这批（最多 10 题）</button><a class="btn" href="#/bank/objective?mode=weak">只看待补练</a><a class="btn" href="#/bank/written?mode=weak">大题待补练</a></div>
    <p class="small muted" style="margin:10px 0 0">错因分布：${Object.keys(causes).length ? Object.entries(causes).map(([k, v]) => `${E(k)} ${v}`).join(' · ') : '还没有标记错因'}</p></div>
    <div class="list">${bad.map(q => { const r = R(q.id); return `<div class="li"><span class="no">${E(q.no)}</span><div class="body">
      <div class="small"><b>第 ${q.ch} 章</b> · ${KIND[q.kind]} ${r.cause ? `<span class="badge o">${E(r.cause)}</span>` : ''} ${r.status === 'weak' ? '<span class="badge r">待补练</span>' : (r.bad ? '<span class="badge g">已通过后续复测</span>' : '')}</div>
      <div style="margin-top:3px">${E(T(q.stem).slice(0, 92))}</div></div>
      <div class="act"><a class="btn sm" href="#/bank/${q.group === 'written' ? 'written' : 'objective'}?id=${encodeURIComponent(q.id)}">重做</a></div></div>`; }).join('')}</div>`
      : `<div class="empty"><p>还没有错题记录。</p><a class="btn pri" href="#/drill">做一组随堂练习</a></div>`}`;
  if ($('#redo')) $('#redo').onclick = () => {
    const ids = bad.filter(q => q.group === 'objective').slice(0, 10).map(q => q.id);
    if (!ids.length) return alert('这批里没有客观题，请点“重做”逐题自评。');
    drillIds(ids);
  };
}
function drillIds(ids) {
  const items = ids.map(id => QBY.get(id)).filter(Boolean);
  let i = 0, right = 0;
  const draw = () => {
    if (i >= items.length) return $('#main').innerHTML = `<div class="result"><div class="big">${right}<small> / ${items.length}</small></div><p class="muted">错题重练完成</p><div class="row" style="justify-content:center"><a class="btn pri" href="#/errors">回到错题分析</a></div></div>`;
    const q = items[i];
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 错题重练</div>
      <div class="drillbar"><div class="bar"><i style="width:${Math.round(i / items.length * 100)}%"></i></div><small>${i + 1} / ${items.length}</small></div>
      ${objectiveCard(q, { pick: '' })}<div class="navq"><button class="btn" id="q">退出</button><button class="btn pri" id="n" disabled>下一题 →</button></div>`;
    let ans = false;
    bindObjective($('#main'), q, { onAnswer: ok => { if (ans) return; ans = true; if (ok) right++; $('#n').disabled = false; } });
    $('#n').onclick = () => { i++; draw(); };
    $('#q').onclick = () => go('errors');
  };
  draw();
}

/* ================= 智能复习 ================= */

  <div class="grid3">

function htmlToMd(h) {
  return String(h).replace(/<\/(p|div|li|h[1-6]|tr)>/g, '\n').replace(/<br\s*\/?>/g, '\n')
    .replace(/<li>/g, '- ').replace(/<\/t[dh]>/g, ' | ').replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/\n{3,}/g, '\n\n').trim();
}
function download(name, text) {
  const u = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));

  setTimeout(() => URL.revokeObjectURL(u), 800);
}

function labSignals() {
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 交互实验室</div>
  <h1 class="ph">${E(X.lab.title)}</h1><p class="psub">${E(X.lab.desc)}</p>
  <div class="panel"><div class="tool"><div>
    <label class="field">信号频率 f<sub>m</sub>：<span class="v" id="fmv">4 Hz</span><input id="fm" type="range" min="1" max="10" step="0.5" value="4"></label>
    <label class="field">抽样频率 f<sub>s</sub>：<span class="v" id="fsv">20 Hz</span><input id="fs" type="range" min="2" max="40" step="1" value="20"></label>
    <p class="small muted">灰虚线：原信号；蓝点：抽样点；橙线：由样点唯一确定的最低频正弦（混叠后的“假信号”）。</p>
  </div><div><canvas id="cv" width="640" height="280" aria-label="抽样波形图"></canvas><div class="out" id="lout" style="margin-top:10px"></div></div></div></div>`;
  const draw = () => {
    const fm = +$('#fm').value, fs = +$('#fs').value;
    $('#fmv').textContent = fm + ' Hz'; $('#fsv').textContent = fs + ' Hz';
    const cv = $('#cv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height, mid = H / 2, A = 88;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#e2e8f2'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 10); ctx.lineTo(x, H - 10); ctx.stroke(); }
    ctx.strokeStyle = '#cfd9e8'; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
    const T0 = 1 / fm, scale = W / (2 * T0);
    ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.6; ctx.beginPath();
    for (let x = 0; x <= W; x += 2) { const t = x / scale; const y = mid - A * Math.sin(2 * Math.PI * fm * t); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); ctx.setLineDash([]);
    const n = Math.floor(2 * T0 * fs);
    ctx.fillStyle = '#2f6fdb';
    for (let k = 0; k <= n; k++) { const t = k / fs, x = t * scale, y = mid - A * Math.sin(2 * Math.PI * fm * t); ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2); ctx.fill(); }
    const alias = Math.abs(fm - Math.round(fm / fs) * fs);
    if (fs < 2 * fm && alias > 0.001) {
      ctx.strokeStyle = '#c4700f'; ctx.lineWidth = 1.8; ctx.beginPath();
      for (let x = 0; x <= W; x += 2) { const t = x / scale; const y = mid - A * Math.sin(2 * Math.PI * alias * t + Math.PI); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    const ok = fs >= 2 * fm;
    $('#lout').innerHTML = `f<sub>m</sub>=${fm} Hz，f<sub>s</sub>=${fs} Hz<br>奈奎斯特下限 2f<sub>m</sub>=${2 * fm} Hz<br><b>${ok ? '可以无失真恢复' : '发生混叠'}</b>${ok ? '' : `<br>混叠频率 ≈ ${alias.toFixed(1)} Hz`}`;
  };
  $('#fm').oninput = draw; $('#fs').oninput = draw; draw();
}

/* 1. 载流线宽 */
function labWidth(host) {
  host.innerHTML = `<section class="panel"><div class="tool"><div>
    <label class="field">电流 I（A）<input id="wI" type="number" value="2" min="0.1" step="0.1"></label>
    <label class="field">允许温升 ΔT（℃）<input id="wT" type="number" value="10" min="1" step="1"></label>
    <label class="field">铜厚<select id="wOz"><option value="0.5">0.5 oz（17.5 μm）</option><option value="1" selected>1 oz（35 μm）</option><option value="2">2 oz（70 μm）</option></select></label>
    <label class="field">走线位置<select id="wK"><option value="0.048">外层（k=0.048）</option><option value="0.024">内层（k=0.024）</option></select></label>
  </div><div><div class="out" id="wOut"></div>
    <div class="vbar"><i id="wBar" style="width:0"></i></div>
    <div class="vscale"><span>0</span><span>1 mm</span><span>2 mm</span></div>
    <div class="labnote">按 1 mm 参考看线宽占比；实际还要考虑压降、载流均匀性和板厂最小线宽。</div>
    <div class="doc" style="margin-top:10px"><div class="kp"><span class="t">公式</span><p>A = (I/(k·ΔT<sup>0.44</sup>))<sup>1/0.725</sup>（mil²），W = A/(oz×1.378)，1 mil = 0.0254 mm。</p></div></div>
  </div></div></section>`;
  const calc = () => {
    const I = +$('#wI').value, dT = +$('#wT').value, oz = +$('#wOz').value, k = +$('#wK').value;
    const A = Math.pow(I / (k * Math.pow(dT, 0.44)), 1 / 0.725);
    const mil = A / (oz * 1.378), mm = mil * 0.0254, rec = Math.ceil(mm * 1.2 * 10) / 10;
    $('#wOut').innerHTML = `最小线宽 <b>${mm.toFixed(2)} mm</b><br>≈ ${mil.toFixed(1)} mil · 截面积 ${A.toFixed(1)} mil²<br>建议取 <b>${rec.toFixed(1)} mm</b>（留 20% 余量）`;
    $('#wBar').style.width = Math.min(100, mm / 2 * 100) + '%';
  };
  ['wI', 'wT', 'wOz', 'wK'].forEach(id => $('#' + id).oninput = calc);
  calc();
}

/* 2. 过孔载流 */
function labVia(host) {
  host.innerHTML = `<section class="panel"><div class="tool"><div>
    <label class="field">孔径 d（mm）<input id="vD" type="number" value="0.3" min="0.1" max="0.8" step="0.05"></label>
    <label class="field">孔壁镀铜厚度（μm）<select id="vT"><option value="20">20 μm</option><option value="25" selected>25 μm</option><option value="30">30 μm</option></select></label>
    <label class="field">孔深 ≈ 板厚（mm）<input id="vL" type="number" value="1.6" min="0.4" max="3" step="0.1"></label>
    <label class="field">需要通过电流 I（A）<input id="vI" type="number" value="1" min="0.1" step="0.1"></label>
    <label class="field">允许温升 ΔT（℃）<select id="vDT"><option value="10" selected>10 ℃</option><option value="20">20 ℃</option><option value="30">30 ℃</option></select></label>
  </div><div><div class="out" id="vOut"></div>
    <div class="vbar"><i id="vBar" style="width:0"></i></div>
    <div class="vscale"><span>0</span><span>需求 / 单孔能力</span><span>100%</span></div>
    <div class="labnote">孔壁镀铜并不均匀，工程上常按 0.5–1 A/孔保守取值；大电流请多孔并联并铺铜。</div>
    <div class="doc" style="margin-top:10px"><div class="kp"><span class="t">公式</span><p>镀铜截面 A = π·d·t；电阻 R = 0.0172·L/A（mΩ）；载流按 IPC-2221 用同截面积反算。</p></div></div>
  </div></div></section>`;
  const calc = () => {
    const d = +$('#vD').value, t = +$('#vT').value / 1000, L = +$('#vL').value, I = +$('#vI').value, dT = +$('#vDT').value;
    const A = Math.PI * d * t;
    const R = A > 0 ? 0.0172 * L / A : 0;
    const Imax = 0.048 * Math.pow(dT, 0.44) * Math.pow(A * 1550, 0.725);
    const need = Imax > 0 ? Math.ceil(I / Imax) : 0;
    $('#vOut').innerHTML = `单孔镀铜截面 <b>${A.toFixed(4)} mm²</b><br>单孔电阻 <b>${R.toFixed(2)} mΩ</b><br>按 ΔT=${dT} ℃ 估算载流 <b>${Imax.toFixed(2)} A/孔</b><br>${I} A 至少 <b>${Math.max(1, need)} 个</b>并联（建议再留 1–2 个）`;
    $('#vBar').style.width = Math.min(100, I / Math.max(Imax, 0.001) * 100) + '%';
  };
  ['vD', 'vT', 'vL', 'vI', 'vDT'].forEach(id => $('#' + id).oninput = calc);

function labZ0(host) {
  host.innerHTML = `<section class="panel"><div class="tool"><div>

    <label class="field">介电常数 εr<select id="zEr"><option value="4.2">FR-4 · 4.2</option><option value="4.4" selected>FR-4 · 4.4</option><option value="4.6">FR-4 · 4.6</option><option value="3.5"> Rogers · 3.5</option></select></label>

    <div class="doc" style="margin-top:10px"><div class="kp"><span class="t">公式</span><p>Z₀ ≈ 87/√(εr+1.41) · ln(5.98h/(0.8w+t))（IPC-2141 微带近似）。</p></div></div>
  </div></div></section>`;
  const zof = (w, h, t, er) => 87 / Math.sqrt(er + 1.41) * Math.log(5.98 * h / (0.8 * w + t));
  const calc = () => {
    const w = +$('#zW').value, h = +$('#zH').value, oz = +$('#zOz').value, er = +$('#zEr').value, t = oz * 0.035;
    const z = zof(w, h, t, er);
    let lo = 0.02, hi = 3;
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (zof(mid, h, t, er) > 50) lo = mid; else hi = mid; }
    const w50 = (lo + hi) / 2, dev = (z - 50) / 50 * 100;
    $('#zOut').innerHTML = `特征阻抗 <b>${z.toFixed(1)} Ω</b><br>50 Ω 目标线宽 <b>${w50.toFixed(3)} mm</b><br>当前线宽偏离 50 Ω <b>${dev > 0 ? '+' : ''}${dev.toFixed(1)}%</b><br><span style="color:#9fc0ea">t = ${t.toFixed(3)} mm，h/w = ${(h / w).toFixed(2)}</span>`;
    $('#zBar').style.width = Math.min(100, z / 120 * 100) + '%';
  };
  ['zW', 'zH', 'zOz', 'zEr'].forEach(id => $('#' + id).oninput = calc);
  calc();
}

/* 5. 拼板利用率 */
function labPanel(host) {
  host.innerHTML = `<section class="panel"><div class="tool"><div>
    <label class="field">单板长 a（mm）<input id="pA" type="number" value="100" min="5" step="1"></label>
    <label class="field">单板宽 b（mm）<input id="pB" type="number" value="80" min="5" step="1"></label>
    <label class="field">板间距 g（mm）<input id="pG" type="number" value="2" min="0" step="0.5"></label>
    <label class="field">工艺边 e（mm，四边）<input id="pE" type="number" value="5" min="0" step="1"></label>
    <label class="field">大板长 A（mm）<input id="pPA" type="number" value="300" min="20" step="5"></label>
    <label class="field">大板宽 B（mm）<input id="pPB" type="number" value="300" min="20" step="5"></label>
  </div><div><div class="out" id="pOut"></div>
    <canvas id="pCv" width="640" height="400" aria-label="拼板排版示意"></canvas>
    <div class="labnote">示意未计 V-cut / 邮票孔与夹持边；实际拼板还要留 MARK 点、定位孔和铣刀路径。</div>
  </div></div></section>`;
  const calc = () => {
    const a = +$('#pA').value, b = +$('#pB').value, g = +$('#pG').value, e = +$('#pE').value, PA = +$('#pPA').value, PB = +$('#pPB').value;
    const fit = (x, y) => [Math.floor((PA - 2 * e + g) / (x + g)), Math.floor((PB - 2 * e + g) / (y + g))];
    const [c1, r1] = fit(a, b), [c2, r2] = fit(b, a);
    const n1 = Math.max(0, c1) * Math.max(0, r1), n2 = Math.max(0, c2) * Math.max(0, r2);
    const rot = n2 > n1, n = Math.max(n1, n2);
    const cols = rot ? c2 : c1, rows = rot ? r2 : r1;
    const util = n * a * b / (PA * PB) * 100;
    $('#pOut').innerHTML = `可拼 <b>${n} 块</b><br>排列 <b>${cols} × ${rows}</b>${rot ? '（旋转 90°）' : ''}<br>面积利用率 <b>${util.toFixed(1)}%</b><br><span style="color:#9fc0ea">单板 ${a}×${b} mm，大板 ${PA}×${PB} mm</span>`;
    const cv = $('#pCv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const sc = Math.min((W - 24) / PA, (H - 24) / PB);
    const pw = PA * sc, ph = PB * sc, ox = (W - pw) / 2, oy = (H - ph) / 2;
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(ox, oy, pw, ph);
    ctx.strokeStyle = '#0f2440'; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, pw, ph);
    const bw = rot ? b : a, bh = rot ? a : b;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const x = ox + (e + i * (bw + g)) * sc, y = oy + (e + j * (bh + g)) * sc;
      ctx.fillStyle = '#bcd7ff'; ctx.fillRect(x, y, bw * sc, bh * sc);
      ctx.strokeStyle = '#2f6fdb'; ctx.lineWidth = 1; ctx.strokeRect(x, y, bw * sc, bh * sc);
    }
    if (!n) { ctx.fillStyle = '#8a95a6'; ctx.font = '14px sans-serif'; ctx.fillText('当前大板放不下，减小单板或工艺边', ox + 8, oy + 24); }
  };
  ['pA', 'pB', 'pG', 'pE', 'pPA', 'pPB'].forEach(id => $('#' + id).oninput = calc);
  calc();
}
