dy\">\u003cp>先用欧拉公式拆开：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t)cos ω₀t = ½x(t)e\u003csup>jω₀t\u003c/sup> + ½x(t)e\u003csup>−jω₀t\u003c/sup>\u003c/span>\u003c/div>\u003cp>再用频移性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">⟷ ½X(j(ω − ω₀)) + ½X(j(ω + ω₀))\u003c/span>\u003c/div>\u003cp>\u003cb>物理意义：\u003c/b>把原频谱\u003cb>一分为二\u003c/b>，分别搬到 \u003cspan class=\"eq\">±ω₀\u003c/span> 处，幅度减半。\u003cb>这就是“调制”\u003c/b>——把低频信号（语音、音乐）“骑”到高频载波上，才能通过天线发射出去。收音机调台，本质上就是用不同 \u003cspan class=\"eq\">ω₀\u003c/span> 把不同电台的频谱搬到不同位置。\u003c/p>\u003cdiv class=\"note\">\u003cb>反过来就是“解调”：\u003c/b>收到信号后再乘一次 \u003cspan class=\"eq\">cos ω₀t\u003c/span>，频谱会再搬一次，其中一份回到原点（基带），用低通滤波器滤出来就还原了。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-4　时宽与带宽\u003c/span>\u003cspan class=\"tag g\">概念题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>对比 \u003cspan class=\"eq\">δ(t)⟷1\u003c/span> 与 \u003cspan class=\"eq\">1⟷2πδ(ω)\u003c/span>，说明时域宽度与频域带宽的关系。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cspan class=\"eq\">δ(t)\u003c/span>：时域宽度 → 0，频谱是常数 1，带宽 → ∞。\u003cbr>\u003cspan class=\"eq\">1\u003c/span>：时域宽度 → ∞，频谱是 \u003cspan class=\"eq\">δ(ω)\u003c/span>，带宽 → 0。\u003c/p>\u003cp>再看矩形脉冲：脉宽 \u003cspan class=\"eq\">τ\u003c/span> 越小，\u003cspan class=\"eq\">Sa(ωτ/2)\u003c/span> 的第一个零点 \u003cspan class=\"eq\">2π/τ\u003c/span> 越远，主瓣越宽。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">τ·B ≈ 常数　（时宽 × 带宽 ≈ 定值）\u003c/span>\u003c/div>\u003cp>\u003cb>结论：\u003c/b>信号在时间上越“窄”，在频率上就越“宽”，两者不可能同时无限小。这就是著名的\u003cb>不确定性原理\u003c/b>在信号领域的版本。\u003c/p>\u003cdiv class=\"tip\">\u003cb>工程意义：\u003c/b>想传得更快（脉冲更窄），就必然占用更宽的频带；想省带宽（脉冲更宽），速度就上不去。5G 比 4G 快，代价就是带宽更宽。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s54","title":"5.4 抽样定理与频谱混叠","html":"\u003cp>连续信号要送进计算机处理，必须先抽样。抽样会不会丢信息？抽样定理回答了这个问题。\u003c/p>\u003cdiv class=\"kp\">\u003cspan class=\"t\">理想抽样\u003c/span>\u003cp style=\"margin:4px 0\">用冲激串 \u003cspan class=\"eq\">δ\u003csub>T\u003c/sub>(t) = Σδ(t − nT\u003csub>s\u003c/sub>)\u003c/span> 去乘信号：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">x\u003csub>s\u003c/sub>(t) = x(t)·δ\u003csub>T\u003c/sub>(t) = Σx(nT\u003csub>s\u003c/sub>)δ(t − nT\u003csub>s\u003c/sub>)\u003c/span>\u003c/div>\u003cp style=\"margin:4px 0\">频域上，时域相乘 = 频域卷积，结果是\u003cb>频谱的周期复制\u003c/b>：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">X\u003csub>s\u003c/sub>(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T\u003csub>s\u003c/sub>\u003c/span>\u003c/span>Σ\u003csub>n\u003c/sub>X(j(ω − nω\u003csub>s\u003c/sub>))，　ω\u003csub>s\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2π\u003c/span>\u003cspan class=\"fd\">T\u003csub>s\u003c/sub>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">奈奎斯特抽样定理\u003c/span>\u003cp style=\"margin:4px 0\">设 \u003cspan class=\"eq\">x(t)\u003c/span> 是带限信号，最高频率为 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub>\u003c/span>（对应 \u003cspan class=\"eq\">ω\u003csub>m\u003c/sub>\u003c/span>）。要能从样本\u003cb>无失真恢复\u003c/b>\u003cspan class=\"eq\">x(t)\u003c/span>，必须：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>m\u003c/sub>　（即 ω\u003csub>s\u003c/sub> ≥ 2ω\u003csub>m\u003c/sub>）\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cspan class=\"eq\">2f\u003csub>m\u003c/sub>\u003c/span> 叫\u003cb>奈奎斯特速率\u003c/b>，\u003cspan class=\"eq\">1/(2f\u003csub>m\u003c/sub>)\u003c/span> 叫\u003cb>奈奎斯特间隔\u003c/b>。\u003c/p>\u003c/div>\u003cdiv class=\"tip\">\u003cb>为什么是 2 倍？\u003c/b>抽样后频谱会以 \u003cspan class=\"eq\">ω\u003csub>s\u003c/sub>\u003c/span> 为周期复制。如果复制出来的“副本”和原来的频谱\u003cb>重叠\u003c/b>了，就再也分不开——这叫\u003cb>混叠\u003c/b>。要不重叠，两个频谱中心至少隔 \u003cspan class=\"eq\">2ω\u003csub>m\u003c/sub>\u003c/span>，所以 \u003cspan class=\"eq\">ω\u003csub>s\u003c/sub> ≥ 2ω\u003csub>m\u003c/sub>\u003c/span>。\u003cbr>\u003cb>生活例子：\u003c/b>电影里车轮看起来在“倒转”，就是采样率不够导致的混叠——轮子的转速超过帧率的一半，人眼就被骗了。\n\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-5　求奈奎斯特抽样频率（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">f(t) = Sa²(100πt) + Sa(50πt)\u003c/span>，若对 \u003cspan class=\"eq\">f(t)\u003c/span> 抽样，求奈奎斯特抽样频率 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>关键：先分别求每一项的最高频率。\u003c/b>记住 \u003cspan class=\"eq\">Sa(ω\u003csub>c\u003c/sub>t)\u003c/span> 的频谱是矩形，带宽为 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>\u003c/span>（单边），即 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = ω\u003csub>c\u003c/sub>/(2π)\u003c/span>。\u003c/p>\u003cp>\u003cb>第一项 \u003cspan class=\"eq\">Sa(100πt)\u003c/span>：\u003c/b>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> = 100π\u003c/span>，所以 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = 100π/(2π) = 50\u003c/span> Hz。\u003c/p>\u003cp>\u003cb>但它是平方！\u003c/b>时域平方 = 频域卷积，两个宽 \u003cspan class=\"eq\">100π\u003c/span> 的矩形卷积，宽度变成 \u003cspan class=\"eq\">200π\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Sa²(100πt) 的最高频率 = \u003cspan class=\"fr\">\u003cspan class=\"fn\">200π\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span> = 100 Hz\u003c/span>\u003c/div>\u003cp>\u003cb>第二项 \u003cspan class=\"eq\">Sa(50πt)\u003c/span>：\u003c/b>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> = 50π\u003c/span>，\u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = 25\u003c/span> Hz。\u003c/p>\u003cp>整个信号取最高者：\u003cspan class=\"eq\">f\u003csub>max\u003c/sub> = max(100, 25) = 100\u003c/span> Hz。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>max\u003c/sub> = 200 Hz\u003c/span>\u003c/div>\u003cp>\u003cb>答案：200 Hz。\u003c/b>\u003c/p>\u003cdiv class=\"warn\">\u003cb>三个坑：\u003c/b>① 忘了平方会让带宽翻倍，直接取 50 Hz；② 把 \u003cspan class=\"eq\">100π\u003c/span> 当成 100 Hz（忘了除以 2π）；③ 两项相加时把频率也相加（应该是取最大值，不是求和）。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-6　判断是否混叠\u003c/span>\u003cspan class=\"tag g\">应用题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>信号 \u003cspan class=\"eq\">x(t) = cos(400πt) + Sa(200πt)\u003c/span>，若以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub> = 300\u003c/span> Hz 抽样，会不会发生混叠？\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>先求最高频率：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">cos(400πt)\u003c/span>：\u003cspan class=\"eq\">ω₀ = 400π → f = 200\u003c/span> Hz；\u003c/li>\u003cli>\u003cspan class=\"eq\">Sa(200πt)\u003c/span>：\u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = 100\u003c/span> Hz。\u003c/li>\u003c/ul>\u003cp>所以 \u003cspan class=\"eq\">f\u003csub>max\u003c/sub> = 200\u003c/span> Hz，需要的抽样率至少 \u003cspan class=\"eq\">400\u003c/span> Hz。\u003c/p>\u003cp>实际只用了 300 Hz &lt; 400 Hz，\u003cb>会发生混叠\u003c/b>。\u003c/p>\u003cp>\u003cb>混叠后变成什么？\u003c/b>200 Hz 的成分会被“折叠”到 \u003cspan class=\"eq\">|300 − 200| = 100\u003c/span> Hz 处，和原本 100 Hz 的成分叠在一起，再也分不开——听起来就是“失真”或“刺耳”的杂音。\u003c/p>\u003cdiv class=\"tip\">\u003cb>工程做法：\u003c/b>抽样前先加一个\u003cb>抗混叠低通滤波器\u003c/b>，把 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>/2\u003c/span> 以上的成分滤掉，从源头上杜绝混叠。这也是为什么实际采样率通常取 \u003cspan class=\"eq\">2.5～5\u003c/span> 倍，而不是刚好 2 倍。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>傅里叶变换这一章，真正要“背”的只有三样：\u003cb>8 个变换对、6 条性质、抽样定理\u003c/b>。剩下的全是“套公式 + 化简”。\u003cbr>\n考场上遇到复杂信号，先问自己三个问题：能不能用时移/频移拆开？能不能用对称性换成已知的？能不能用卷积性质绕开积分？\u003cb>能绕就绕，千万别硬积。\u003c/b>\u003c/div>"},{"id":"s55","title":"5.5 离散周期信号的频域分析：DFS（CH4 L13）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">DFS 与 CTFS 一一对应\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x̃[k] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">N\u003c/span>\u003c/span>\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">N−1\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span> X̃[n]e\u003csup>j2πnk/N\u003c/sup>，　X̃[n] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">N−1\u003c/span>\u003cspan class=\"l\">k=0\u003c/span>\u003c/span>\u003c/span> x̃[k]e\u003csup>−j2πnk/N\u003c/sup>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">两个关键不同：\u003cb>①\u003c/b> 时域和频域\u003cb>都是离散、都是周期 N\u003c/b>；\u003cb>②\u003c/b> 求和只有 N 项，没有无穷级数，计算机可以直接算（这就是 DFT 的由来）。\u003c/p>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:22%\">性质\u003c/th>\u003cth>时域\u003c/th>\u003cth>频域\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>线性\u003c/td>\u003ctd>\u003cspan class=\"eq\">a x̃₁ + b x̃₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">aX̃₁ + bX̃₂\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域位移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x̃[k−m]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−j2πnm/N\u003c/sup>X̃[n]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域位移（调制）\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>j2πmk/N\u003c/sup>x̃[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X̃[n−m]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周期卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x̃₁ ⊛ x̃₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X̃₁[n]·X̃₂[n]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>对称（实序列）\u003c/td>\u003ctd>实偶 / 实奇\u003c/td>\u003ctd>实偶 / 纯虚奇\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 5-2　DFS 性质（与连续傅里叶级数完全平行）\u003c/p>\u003cdiv class=\"tip\">\u003cb>一句话记 DFS：\u003c/b>「周期 + 离散 ↔ 周期 + 离散」，只在一个周期内算 N 个数。DFT 就是把 DFS 的主值区间拿来用，配上快速算法 FFT。\u003cb>课件 L15 复习题考点：补零只减小栅栏效应，不提高物理频率分辨率 \u003cspan class=\"eq\">Δf ≈ 1/T₀\u003c/span>。\u003c/b>\u003c/div>"},{"id":"s56","title":"5.6 离散非周期信号的频域分析：DTFT（CH4 L13）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">DTFT 定义与两个特点\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(e\u003csup>jΩ\u003c/sup>) = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">k=−∞\u003c/span>\u003c/span>\u003c/span> x[k]e\u003csup>−jΩk\u003c/sup>，　x[k] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">π\u003c/span>\u003cspan class=\"l\">−π\u003c/span>\u003c/span>\u003c/span>X(e\u003csup>jΩ\u003c/sup>)e\u003csup>jΩk\u003c/sup>dΩ\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>①\u003c/b>\u003cspan class=\"eq\">X(e\u003csup>jΩ\u003c/sup>)\u003c/span> 是 \u003cspan class=\"eq\">Ω\u003c/span> 的\u003cb>连续\u003c/b>函数；\u003cb>②\u003c/b> 以 \u003cspan class=\"eq\">2π\u003c/span> 为\u003cb>周期\u003c/b>，所以反变换只积一个周期 \u003cspan class=\"eq\">[−π, π]\u003c/span>。\u003cb>时域离散 → 频域周期\u003c/b>，这是与 CTFT 最大的区别。\u003c/p>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:30%\">性质\u003c/th>\u003cth>表达式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>时移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[k−k₀] ⟷ e\u003csup>−jΩk₀\u003c/sup>X(e\u003csup>jΩ\u003c/sup>)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频移\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>jΩ₀k\u003c/sup>x[k] ⟷ X(e\u003csup>j(Ω−Ω₀)\u003c/sup>)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x ∗ h ⟷ X(e\u003csup>jΩ\u003c/sup>)H(e\u003csup>jΩ\u003c/sup>)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x·h ⟷ (1/2π)X ⊛ H\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域微分\u003c/td>\u003ctd>\u003cspan class=\"eq\">k x[k] ⟷ j·dX(e\u003csup>jΩ\u003c/sup>)/dΩ\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>能量定理（Parseval）\u003c/td>\u003ctd>\u003cspan class=\"eq\">Σ|x[k]|² = (1/2π)∫\u003csub>−π\u003c/sub>\u003csup>π\u003c/sup>|X(e\u003csup>jΩ\u003c/sup>)|²dΩ\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 5-3　DTFT 性质（与 CTFT 一一对应，把 ∫ 换成 Σ、把 2π 系数换个位置）\u003c/p>"},{"id":"s57","title":"5.7 四类信号的时频对应关系（全书框架，L13/L14）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:26%\">时域\u003c/th>\u003cth style=\"width:22%\">频域\u003c/th>\u003cth style=\"width:24%\">分析工具\u003c/th>\u003cth>口诀\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>连续 + 周期\u003c/td>\u003ctd>离散 + 非周期\u003c/td>\u003ctd>CTFS（\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>）\u003c/td>\u003ctd>周期 ↔ 离散谱线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>连续 + 非周期\u003c/td>\u003ctd>连续 + 非周期\u003c/td>\u003ctd>CTFT（\u003cspan class=\"eq\">X(jω)\u003c/span>）\u003c/td>\u003ctd>非周期 ↔ 连续谱\u003c/td>\u003c/tr>\u003ctr>\u003ctd>离散 + 周期\u003c/td>\u003ctd>离散 + 周期\u003c/td>\u003ctd>DFS（\u003cspan class=\"eq\">X̃[n]\u003c/span>）\u003c/td>\u003ctd>两边都离散且周期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>离散 + 非周期\u003c/td>\u003ctd>连续 + 周期\u003c/td>\u003ctd>DTFT（\u003cspan class=\"eq\">X(e\u003csup>jΩ\u003c/sup>)\u003c/span>）\u003c/td>\u003ctd>时域离散 ↔ 频域周期\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"tip\">\u003cb>一条规律通吃：\u003c/b>\u003cb>时域「周期」→ 频域「离散」；时域「离散」→ 频域「周期」\u003c/b>。这两组对偶关系记住了，四行表格不用背也能推出来。\u003c/div>"},{"id":"s58","title":"5.8 时域抽样与频域抽样（L14 补充）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">频域抽样定理（时域抽样的镜像）\u003c/span>\u003cp style=\"margin:4px 0\">对 \u003cspan class=\"eq\">X(e\u003csup>jΩ\u003c/sup>)\u003c/span> 在一个 \u003cspan class=\"eq\">2π\u003c/span> 周期内均匀抽 N 个点（即做 N 点 DFT），时域序列就会以 N 为周期\u003cb>周期化\u003c/b>：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">x̃[k] = Σ\u003csub>r\u003c/sub> x[k − rN]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>结论：\u003c/b>序列长度 ≤ N 时，一个周期内与原序列完全相同，可无失真恢复；长度 &gt; N 时发生\u003cb>时域混叠\u003c/b>。这与「时域抽样导致频谱周期化、抽样率不够导致频域混叠」完全对称。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-7　三种运算后的最高频率（课件原题，易错）\u003c/span>\u003cspan class=\"tag\">拉分题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>实信号 \u003cspan class=\"eq\">x(t)\u003c/span> 最高频率 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub>\u003c/span> Hz，求对 \u003cspan class=\"eq\">x(2t)\u003c/span>、\u003cspan class=\"eq\">x(t)∗x(2t)\u003c/span>、\u003cspan class=\"eq\">x(t)·x(2t)\u003c/span> 抽样不混叠的最小抽样频率。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>先求三个信号各自的最高频率：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">x(2t)\u003c/span>：时域压缩 2 倍 → 频域展宽 2 倍，\u003cspan class=\"eq\">f\u003csub>max\u003c/sub>=2f\u003csub>m\u003c/sub>\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">x(t)∗x(2t)\u003c/span>：时域卷积 → \u003cb>频域相乘\u003c/b>，\u003cspan class=\"eq\">X(jω)·X(jω/2)/2\u003c/span>，两者同时非零的区间取\u003cb>较窄\u003c/b>的那个，故 \u003cspan class=\"eq\">f\u003csub>max\u003c/sub>=f\u003csub>m\u003c/sub>\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">x(t)·x(2t)\u003c/span>：时域相乘 → \u003cb>频域卷积\u003c/b>，带宽\u003cb>相加\u003c/b>：\u003cspan class=\"eq\">f\u003csub>m\u003c/sub> + 2f\u003csub>m\u003c/sub> = 3f\u003csub>m\u003c/sub>\u003c/span>。\u003c/li>\u003c/ul>\u003cp>再乘 2（奈奎斯特速率）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(2t)：4f\u003csub>m\u003c/sub>；　x(t)∗x(2t)：2f\u003csub>m\u003c/sub>；　x(t)·x(2t)：6f\u003csub>m\u003c/sub>\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>口诀：\u003c/b>「\u003cb>时域相乘，带宽相加；时域卷积，带宽取小\u003c/b>」。再配上尺度变换（压缩 a 倍 → 带宽 × a），这类题 30 秒可解。课件 L14 p27 的标准答案就是 4、2、6 倍。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s59","title":"5.9 傅里叶变换性质补全（L11/L12）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:26%\">性质\u003c/th>\u003cth>表达式\u003c/th>\u003cth style=\"width:24%\">考点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>共轭对称\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t)\u003c/span> 实 ⟹ \u003cspan class=\"eq\">X(jω)=X*(−jω)\u003c/span>\u003c/td>\u003ctd>幅度偶、相位奇\u003c/td>\u003c/tr>\u003ctr>\u003ctd>奇偶分量\u003c/td>\u003ctd>\u003cspan class=\"eq\">x\u003csub>e\u003c/sub> ⟷ Re{X}\u003c/span>；\u003cspan class=\"eq\">x\u003csub>o\u003c/sub> ⟷ jIm{X}\u003c/span>\u003c/td>\u003ctd>实偶→实偶，实奇→纯虚奇\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域微分\u003c/td>\u003ctd>\u003cspan class=\"eq\">−j t x(t) ⟷ dX(jω)/dω\u003c/span>\u003c/td>\u003ctd>求 \u003cspan class=\"eq\">t·x(t)\u003c/span> 的频谱\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域卷积\u003c/td>\u003ctd>\u003cspan class=\"eq\">x·h ⟷ (1/2π)X∗H\u003c/span>\u003c/td>\u003ctd>调制、乘法定理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域积分\u003c/td>\u003ctd>\u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>t\u003c/sup>x ⟷ X/(jω) + πX(0)δ(ω)\u003c/span>\u003c/td>\u003ctd>别漏 \u003cspan class=\"eq\">πX(0)δ(ω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>修正微分\u003c/td>\u003ctd>含直流的信号求导会丢直流，需补 \u003cspan class=\"eq\">π[x(∞)+x(−∞)]δ(ω)\u003c/span>\u003c/td>\u003ctd>L12 专门强调\u003c/td>\u003c/tr>\u003ctr>\u003ctd>能量定理\u003c/td>\u003ctd>\u003cspan class=\"eq\">E = ∫|x|²dt = (1/2π)∫|X|²dω\u003c/span>\u003c/td>\u003ctd>算 \u003cspan class=\"eq\">∫Sa²(t)dt\u003c/span> 类积分\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 5-8　用 Parseval 求积分（课件原题）\u003c/span>\u003cspan class=\"tag\">技巧题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>计算 \u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>Sa²(t)dt\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>硬积很难，用能量定理秒杀。\u003c/b>已知 \u003cspan class=\"eq\">Sa(t) ⟷ π·p\u003csub>2\u003c/sub>(ω)\u003c/span>（宽 2、高 π 的矩形频谱，即 \u003cspan class=\"eq\">|ω|&lt;1\u003c/span> 内为 π）。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">E = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>|X(jω)|²dω = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span>·π²·2 = π\u003c/span>\u003c/div>\u003cp>\u003cb>答案：\u003cspan class=\"eq\">π\u003c/span>。\u003c/b>这类「求 ∫Sa²、∫Sa⁴」的题，正面积分几乎算不动，转成频域矩形面积一下子就出来了。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003c/section>"}]},{"n":6,"title":"系统的频域分析（CH5）","intro":"\u003cb>对应课件：\u003c/b>L15 系统频域、L16 理想滤波器、L17 调制。\u003cbr>\u003cb>本章地位：\u003c/b>把第 5 章的「信号频谱」升级成「系统怎么处理频谱」，是频域部分的综合应用，也是 CH6/CH7 复频域分析的引子。\u003cbr>\u003cb>一句话主线：\u003c/b>\u003cspan class=\"eq\">Y\u003csub>zs\u003c/sub>(jω) = X(jω)·H(jω)\u003c/span>——输入频谱乘上系统频率响应，就是输出频谱。","sections":[{"id":"s61","title":"6.1 频率响应 H(jω) 与 H(ejΩ)","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">定义：频率响应就是冲激响应的傅里叶变换\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">Y\u003csub>zs\u003c/sub>(jω)\u003c/span>\u003cspan class=\"fd\">X(jω)\u003c/span>\u003c/span> = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> h(t)e\u003csup>−jωt\u003c/sup>dt\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">离散版：\u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>) = Σ\u003csub>k\u003c/sub> h[k]e\u003csup>−jΩk\u003c/sup>\u003c/span>，它是周期为 \u003cspan class=\"eq\">2π\u003c/span> 的函数。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">由微分方程直接写 H(jω)（最快的方法）\u003c/span>\u003cp style=\"margin:4px 0\">把 \u003cspan class=\"eq\">y\u003csup>(n)\u003c/sup>(t)\u003c/span> 换成 \u003cspan class=\"eq\">(jω)\u003csup>n\u003c/sup>Y(jω)\u003c/span>，把 \u003cspan class=\"eq\">x\u003csup>(m)\u003c/sup>(t)\u003c/span> 换成 \u003cspan class=\"eq\">(jω)\u003csup>m\u003c/sup>X(jω)\u003c/span>，再相除：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">b\u003csub>m\u003c/sub>(jω)\u003csup>m\u003c/sup> + … + b₁(jω) + b₀\u003c/span>\u003cspan class=\"fd\">(jω)\u003csup>n\u003c/sup> + a\u003csub>n−1\u003c/sub>(jω)\u003csup>n−1\u003c/sup> + … + a₀\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-1　由微分方程求频率响应（课件原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">y″(t) + 3y′(t) + 2y(t) = x(t)\u003c/span>，求 \u003cspan class=\"eq\">H(jω)\u003c/span>、幅度响应和相位响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：两边取傅里叶变换\u003c/b>（用微分性质 \u003cspan class=\"eq\">y′ ⟷ jωY\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">[(jω)² + 3(jω) + 2]Y(jω) = X(jω)\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：相除\u003c/b>（注意 \u003cspan class=\"eq\">(jω)² = −ω²\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">−ω² + 3jω + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(1 + jω)(2 + jω)\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：拆成幅度与相位。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">|H(jω)| = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">√(1 + ω²)·√(4 + ω²)\u003c/span>\u003c/span>，　φ(ω) = −arctan ω − arctan\u003cspan class=\"fr\">\u003cspan class=\"fn\">ω\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>读图：\u003c/b>\u003cspan class=\"eq\">ω=0\u003c/span> 时 \u003cspan class=\"eq\">|H|=1/2\u003c/span>，频率越高 \u003cspan class=\"eq\">|H|\u003c/span> 越小 → 这是一个\u003cb>低通\u003c/b>系统。\u003cspan class=\"eq\">φ(0)=0\u003c/span>，\u003cspan class=\"eq\">ω→∞\u003c/span> 时 \u003cspan class=\"eq\">φ→−π\u003c/span>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>三条求 H(jω) 的路：\u003c/b>① 由微分方程（最快）；② 由 \u003cspan class=\"eq\">h(t)\u003c/span> 取傅里叶变换；③ 由电路的频域模型（电阻 R、电容 1/jωC、电感 jωL）。考试给什么就用什么。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-2　由 h(t) 求 H(jω)\u003c/span>\u003cspan class=\"tag g\">巩固\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">h(t) = (e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>，求 \u003cspan class=\"eq\">H(jω)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>用单边指数变换对 \u003cspan class=\"eq\">e\u003csup>−αt\u003c/sup>u(t) ⟷ 1/(α+jω)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + jω\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + jω\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(1 + jω)(2 + jω)\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>与例 6-1 完全一致 ✓。这说明\u003cb>同一个系统，用微分方程和用冲激响应算出的 H(jω) 必然相同\u003c/b>，可以互相验算。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>实系统的对称性：\u003c/b>若 \u003cspan class=\"eq\">h(t)\u003c/span> 是实函数，则 \u003cspan class=\"eq\">|H(jω)|\u003c/span> 是 \u003cspan class=\"eq\">ω\u003c/span> 的\u003cb>偶\u003c/b>函数，\u003cspan class=\"eq\">φ(ω)\u003c/span> 是\u003cb>奇\u003c/b>函数。画频谱图时只画正频率，负频率按对称补上即可。\n\u003c/div>"},{"id":"s62","title":"6.2 信号通过 LTI 系统的频域分析","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">四种典型情形，一张表记住\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:28%\">输入\u003c/th>\u003cth>零状态输出\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>虚指数 \u003cspan class=\"eq\">e\u003csup>jω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(jω₀)·e\u003csup>jω₀t\u003c/sup>\u003c/span>（频率不变，只改幅相）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>余弦 \u003cspan class=\"eq\">A cos(ω₀t + θ)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">A|H(jω₀)|cos[ω₀t + θ + φ(ω₀)]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般非周期信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">Y\u003csub>zs\u003c/sub>(jω) = X(jω)H(jω)\u003c/span>，再取反变换\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周期信号 \u003cspan class=\"eq\">ΣC\u003csub>n\u003c/sub>e\u003csup>jnω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">y(t) = Σ C\u003csub>n\u003c/sub>H(jnω₀)e\u003csup>jnω₀t\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"tip\">\u003cb>为什么 \u003cspan class=\"eq\">e\u003csup>jωt\u003c/sup>\u003c/span> 这么特殊？\u003c/b>它是 LTI 系统的\u003cb>特征函数\u003c/b>——进去什么频率，出来还是什么频率，只是被系统「调了音量、拧了相位」。所以只要知道系统对每个频率的 \u003cspan class=\"eq\">H(jω)\u003c/span>，任意信号拆成复指数之和后，逐频率处理再相加即可。\u003cb>这就是整门频域分析的宪法。\u003c/b>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-3　正弦稳态响应\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>系统 \u003cspan class=\"eq\">H(jω) = 1/(1 + jω)\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = 2 + 3cos 2t\u003c/span>（\u003cspan class=\"eq\">−∞ &lt; t &lt; ∞\u003c/span>），求稳态响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>拆成两个频率分别处理。\u003c/b>\u003c/p>\u003cp>\u003cb>直流 \u003cspan class=\"eq\">ω=0\u003c/span>：\u003c/b>\u003cspan class=\"eq\">H(0)=1\u003c/span>，所以 \u003cspan class=\"eq\">2 → 2\u003c/span>。\u003c/p>\u003cp>\u003cb>余弦 \u003cspan class=\"eq\">ω=2\u003c/span>：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(j2) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + 2j\u003c/span>\u003c/span>，　|H(j2)| = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">√5\u003c/span>\u003c/span>，　φ(2) = −arctan 2 ≈ −63.4°\u003c/span>\u003c/div>\u003cp>幅度乘 \u003cspan class=\"eq\">1/√5\u003c/span>，相位加 \u003cspan class=\"eq\">−arctan 2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = 2 + \u003cspan class=\"fr\">\u003cspan class=\"fn\">3\u003c/span>\u003cspan class=\"fd\">√5\u003c/span>\u003c/span>cos(2t − arctan 2)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>答题模板：\u003c/b>「拆频率 → 逐个算 H → 幅度乘 |H|、相位加 φ → 合起来」。写全这四步，步骤分就齐了。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-4　RC 低通电路（课件原题）\u003c/span>\u003cspan class=\"tag g\">应用\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>RC 串联电路，输入为电压源 \u003cspan class=\"eq\">x(t)\u003c/span>，输出为电容电压 \u003cspan class=\"eq\">v\u003csub>C\u003c/sub>(t)\u003c/span>，初始状态为零。求 \u003cspan class=\"eq\">H(jω)\u003c/span>、\u003cspan class=\"eq\">h(t)\u003c/span> 和 3dB 截频。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>用分压公式\u003c/b>（电容阻抗 \u003cspan class=\"eq\">1/(jωC)\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/(jωC)\u003c/span>\u003cspan class=\"fd\">R + 1/(jωC)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + jωRC\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/RC\u003c/span>\u003cspan class=\"fd\">1/RC + jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>反变换得冲激响应\u003c/b>（对照 \u003cspan class=\"eq\">e\u003csup>−αt\u003c/sup>u(t) ⟷ 1/(α+jω)\u003c/span>，\u003cspan class=\"eq\">α=1/RC\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">RC\u003c/span>\u003c/span>e\u003csup>−t/RC\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>3dB 截频：\u003c/b>令 \u003cspan class=\"eq\">|H(jω\u003csub>c\u003c/sub>)| = 1/√2\u003c/span>，解得 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> = 1/RC\u003c/span>。频率越高 \u003cspan class=\"eq\">|H|\u003c/span> 越小，高频被衰减 → 低通滤波器。\u003c/p>\u003cdiv class=\"note\">\u003cb>课件结论：\u003c/b>3dB 截频处的幅度是通带的 \u003cspan class=\"eq\">0.707\u003c/span> 倍（功率减半，故叫 3dB）。工程上把 \u003cspan class=\"eq\">0 ~ ω\u003csub>c\u003c/sub>\u003c/span> 视作通带。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"warn\">\u003cb>频域法的两条限制（年年考）：\u003c/b>① 只能求\u003cb>零状态响应\u003c/b>，零输入响应仍要回时域算；② 要求输入信号的傅里叶变换\u003cb>存在\u003c/b>、且系统\u003cb>稳定\u003c/b>。例如 \u003cspan class=\"eq\">x(t)=e\u003csup>2t\u003c/sup>u(t)\u003c/span> 没有傅里叶变换，就无法用频域法——这正是下一章引入拉普拉斯变换的原因。\n\u003c/div>"},{"id":"s63","title":"6.3 无失真传输系统","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">无失真的定义与条件\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">时域：y(t) = K·x(t − t\u003csub>d\u003c/sub>)　⟷　频域：H(jω) = K·e\u003csup>−jωt\u003csub>d\u003c/sub>\u003c/sup>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">即输出只是「整体放大 K 倍 + 延迟 t\u003csub>d\u003c/sub>」，波形形状一点不变。两个条件缺一不可：\u003c/p>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>幅度条件：\u003c/b>\u003cspan class=\"eq\">|H(jω)| = K\u003c/span> 为常数（带宽无穷大，所有频率一视同仁）；\u003c/li>\u003cli>\u003cb>相位条件：\u003c/b>\u003cspan class=\"eq\">φ(ω) = −ωt\u003csub>d\u003c/sub>\u003c/span>，与 \u003cspan class=\"eq\">ω\u003c/span> 成\u003cb>正比（线性相位）\u003c/b>。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"tip\">\u003cb>为什么相位必须线性？\u003c/b>延迟 \u003cspan class=\"eq\">t\u003csub>d\u003c/sub>\u003c/span> 在频域就是乘 \u003cspan class=\"eq\">e\u003csup>−jωt\u003csub>d\u003c/sub>\u003c/sup>\u003c/span>，每个频率分量延迟的时间相同，合起来波形才不变。如果相位是弯的，不同频率延迟的时间不一样，各分量就会「错开」，波形就变形了——这叫\u003cb>相位失真（群时延失真）\u003c/b>，幅度谱没变也会失真。\n\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-5　判断无失真（课件原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>系统 \u003cspan class=\"eq\">H(jω) = 2e\u003csup>−j3ω\u003c/sup>\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = sin t + sin 3t\u003c/span>，求输出并判断是否失真。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cspan class=\"eq\">|H| = 2\u003c/span> 为常数，\u003cspan class=\"eq\">φ(ω) = −3ω\u003c/span> 是线性相位 → \u003cb>无失真传输\u003c/b>，\u003cspan class=\"eq\">K=2, t\u003csub>d\u003c/sub>=3\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = 2x(t − 3) = 2sin(t − 3) + 2sin(3t − 9)\u003c/span>\u003c/div>\u003cp>\u003cb>注意：\u003c/b>两个频率分量都延迟 3 秒，所以 \u003cspan class=\"eq\">sin 3t\u003c/span> 的相位偏移是 \u003cspan class=\"eq\">−9\u003c/span>（而不是 −3）。很多同学在这里只写 \u003cspan class=\"eq\">2sin(3t−3)\u003c/span>，那就错了——\u003cb>延迟时间相同，相位偏移与频率成正比\u003c/b>。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-6　幅度不失真但相位失真\u003c/span>\u003cspan class=\"tag g\">易错\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>系统 \u003cspan class=\"eq\">H(jω) = 2e\u003csup>−j·arctan ω\u003c/sup>\u003c/span>，输入仍为 \u003cspan class=\"eq\">sin t + sin 3t\u003c/span>，判断是否失真。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cspan class=\"eq\">|H| = 2\u003c/span> 是常数，幅度条件满足；但 \u003cspan class=\"eq\">φ(ω) = −arctan ω\u003c/span> 不是 \u003cspan class=\"eq\">ω\u003c/span> 的线性函数，\u003cb>相位条件不满足 → 有失真\u003c/b>。\u003c/p>\u003cp>两个分量分别延迟的「等效时间」不同：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">ω=1\u003c/span>：\u003cspan class=\"eq\">φ=−π/4\u003c/span>，等效延迟 \u003cspan class=\"eq\">π/4\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">ω=3\u003c/span>：\u003cspan class=\"eq\">φ=−arctan 3≈−1.249\u003c/span>，等效延迟 \u003cspan class=\"eq\">≈0.416\u003c/span>。\u003c/li>\u003c/ul>\u003cp>两个分量错开不同时间，合成波形就变了形。\u003cb>结论：幅度谱平 ≠ 无失真。\u003c/b>\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s64","title":"6.4 理想滤波器","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:20%\">类型\u003c/th>\u003cth style=\"width:40%\">通带\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>理想低通\u003c/td>\u003ctd>\u003cspan class=\"eq\">|ω| &lt; ω\u003csub>c\u003c/sub>\u003c/span>\u003c/td>\u003ctd>滤除高频噪声\u003c/td>\u003c/tr>\u003ctr>\u003ctd>理想高通\u003c/td>\u003ctd>\u003cspan class=\"eq\">|ω| &gt; ω\u003csub>c\u003c/sub>\u003c/span>\u003c/td>\u003ctd>提取边缘、去直流\u003c/td>\u003c/tr>\u003ctr>\u003ctd>理想带通\u003c/td>\u003ctd>\u003cspan class=\"eq\">ω₁ &lt; |ω| &lt; ω₂\u003c/span>\u003c/td>\u003ctd>选台、提取特定频段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>理想带阻\u003c/td>\u003ctd>\u003cspan class=\"eq\">|ω| &lt; ω₁\u003c/span> 或 \u003cspan class=\"eq\">|ω| &gt; ω₂\u003c/span>\u003c/td>\u003ctd>陷波，滤除工频干扰\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"kp\">\u003cspan class=\"t\">线性相位理想低通滤波器\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = e\u003csup>−jωt\u003csub>d\u003c/sub>\u003c/sup>（|ω| &lt; ω\u003csub>c\u003c/sub>），　0（其他）\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">ω\u003csub>c\u003c/sub>\u003c/span>\u003cspan class=\"fd\">π\u003c/span>\u003c/span>Sa[ω\u003csub>c\u003c/sub>(t − t\u003csub>d\u003c/sub>)]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">三个必背结论：\u003cb>①\u003c/b>\u003cspan class=\"eq\">h(t)\u003c/span> 是 Sa 函数，主峰在 \u003cspan class=\"eq\">t = t\u003csub>d\u003c/sub>\u003c/span>（相位斜率就是延迟）；\u003cb>②\u003c/b>\u003cspan class=\"eq\">t &lt; 0\u003c/span> 时 \u003cspan class=\"eq\">h(t) ≠ 0\u003c/span>，所以理想低通\u003cb>非因果、物理不可实现\u003c/b>；\u003cb>③\u003c/b> 阶跃响应的上升时间 \u003cspan class=\"eq\">t\u003csub>r\u003c/sub> ∝ 1/ω\u003csub>c\u003c/sub>\u003c/span>，带宽越宽上升越快，并伴随 \u003cb>9% 的 Gibbs 过冲\u003c/b>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-7　Sa(t)cos2t 通过理想低通（课件原题）\u003c/span>\u003cspan class=\"tag\">拉分题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">x(t) = Sa(t)cos 2t\u003c/span> 通过线性相位理想低通 \u003cspan class=\"eq\">H(jω)\u003c/span>（截止 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>\u003c/span>，延迟 \u003cspan class=\"eq\">t\u003csub>d\u003c/sub>\u003c/span>），分情况求输出。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>先求输入频谱。\u003c/b>\u003cspan class=\"eq\">Sa(t)\u003c/span> 的频谱是矩形：带宽 \u003cspan class=\"eq\">|ω| &lt; 1\u003c/span>。乘 \u003cspan class=\"eq\">cos 2t\u003c/span> 后频谱一分为二、各搬 ±2、幅度减半，所以 \u003cspan class=\"eq\">X(jω)\u003c/span> 占据 \u003cspan class=\"eq\">1 &lt; |ω| &lt; 3\u003c/span>。\u003c/p>\u003cp>\u003cb>分三种情况：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> &gt; 3\u003c/span>：所有频率分量都通过（通带内 \u003cspan class=\"eq\">|H|=1\u003c/span>，只有线性相位）→ \u003cspan class=\"eq\">y(t) = x(t − t\u003csub>d\u003c/sub>) = Sa(t − t\u003csub>d\u003c/sub>)cos[2(t − t\u003csub>d\u003c/sub>)]\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> &lt; 1\u003c/span>：全被挡住 → \u003cspan class=\"eq\">y(t) = 0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 &lt; ω\u003csub>c\u003c/sub> &lt; 3\u003c/span>：只通过 \u003cspan class=\"eq\">1 ~ ω\u003csub>c\u003c/sub>\u003c/span> 那一段频谱 → 输出是部分频率分量的叠加，\u003cb>波形必然失真\u003c/b>。\u003c/li>\u003c/ul>\u003cdiv class=\"tip\">\u003cb>解题套路：\u003c/b>先画出 \u003cspan class=\"eq\">X(jω)\u003c/span> 的「占频区间」，再看滤波器通带覆盖了哪一段。覆盖全 → 只是延迟；覆盖零 → 输出 0；覆盖一部分 → 失真。\u003cb>画频谱图比硬算积分快得多。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>实际滤波器 vs 理想滤波器：\u003c/b>理想滤波器通带、阻带之间是「断崖式」跳变，所以不可实现。实际滤波器有\u003cb>通带、过渡带、阻带\u003c/b>三段，还允许通带内有 \u003cspan class=\"eq\">δ\u003csub>p\u003c/sub>\u003c/span> 的起伏、阻带内有 \u003cspan class=\"eq\">δ\u003csub>s\u003c/sub>\u003c/span> 的残余。常见逼近：Butterworth（通带最平）、Chebyshev、椭圆。\n\u003c/div>"},{"id":"s65","title":"6.5 离散时间系统的频域分析","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">离散频率响应\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">Σ b\u003csub>j\u003c/sub>e\u003csup>−jΩj\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 + Σ a\u003csub>i\u003c/sub>e\u003csup>−jΩi\u003c/sup>\u003c/span>\u003c/span> = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">k=−∞\u003c/span>\u003c/span>\u003c/span>h[k]e\u003csup>−jΩk\u003c/sup>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">与连续版的三点不同：\u003cb>①\u003c/b>\u003cspan class=\"eq\">Ω\u003c/span> 是数字角频率（弧度/样本）；\u003cb>②\u003c/b>\u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>)\u003c/span> 以 \u003cspan class=\"eq\">2π\u003c/span> 为周期，只需画 \u003cspan class=\"eq\">[−π, π]\u003c/span>；\u003cb>③\u003c/b>\u003cspan class=\"eq\">Ω=π\u003c/span> 是\u003cb>最高\u003c/b>频率（对应 \u003cspan class=\"eq\">(−1)\u003csup>k\u003c/sup>\u003c/span>），不是「越高频越好」。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-8　两点平均器（课件原题）\u003c/span>\u003cspan class=\"tag\">经典\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>离散 LTI 系统 \u003cspan class=\"eq\">h[k] = (δ[k] + δ[k−1])/2\u003c/span>，输入 \u003cspan class=\"eq\">x[k] = 1 + 2(−1)\u003csup>k\u003c/sup>\u003c/span>，求输出。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：求频率响应。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>) = ½(1 + e\u003csup>−jΩ\u003c/sup>) = e\u003csup>−jΩ/2\u003c/sup>cos\u003cspan class=\"fr\">\u003cspan class=\"fn\">Ω\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：把输入看成两个频率分量。\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">1 = e\u003csup>j·0·k\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">Ω=0\u003c/span>：\u003cspan class=\"eq\">H(e\u003csup>j0\u003c/sup>) = 1\u003c/span> → 原样通过；\u003c/li>\u003cli>\u003cspan class=\"eq\">2(−1)\u003csup>k\u003c/sup> = 2e\u003csup>jπk\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">Ω=π\u003c/span>：\u003cspan class=\"eq\">H(e\u003csup>jπ\u003c/sup>) = ½(1 − 1) = 0\u003c/span> → \u003cb>被完全滤掉\u003c/b>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = 1\u003c/span>\u003c/div>\u003cp>\u003cb>物理解释：\u003c/b>相邻两点取平均，缓慢变化的直流成分不受影响，而 \u003cspan class=\"eq\">+1, −1, +1, −1\u003c/span> 这种「一正一负」的最高频振荡，两两相加正好抵消。\u003cb>所以两点平均器是一个低通（平滑）滤波器。\u003c/b>\u003c/p>\u003cdiv class=\"tip\">\u003cb>考试秒杀：\u003c/b>看到 \u003cspan class=\"eq\">(−1)\u003csup>k\u003c/sup>\u003c/span> 就想到 \u003cspan class=\"eq\">Ω=π\u003c/span>；看到常数就想到 \u003cspan class=\"eq\">Ω=0\u003c/span>。代 \u003cspan class=\"eq\">H(e\u003csup>j0\u003c/sup>)\u003c/span> 和 \u003cspan class=\"eq\">H(e\u003csup>jπ\u003c/sup>)\u003c/span> 两个数即可，不必做卷积。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s66","title":"6.6 幅度调制、同步解调与频分复用","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">为什么要调制\u003c/span>\u003cp style=\"margin:4px 0\">天线尺寸约为波长的 \u003cspan class=\"eq\">1/10\u003c/span>。音乐信号最高 20 kHz，对应波长 \u003cspan class=\"eq\">λ = 3×10⁸/2×10⁴ = 15 km\u003c/span>，天线要 1.5 km——根本造不出来。把低频信号「搬」到高频载波上，天线就能做得很小；不同信号用不同载波，还能共用一条信道。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">调制定理（第 5 章频移性质的直接应用）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t)cos ω\u003csub>0\u003c/sub>t ⟷ ½[X(j(ω − ω₀)) + X(j(ω + ω₀))]\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">频谱一分为二、各搬到 \u003cspan class=\"eq\">±ω₀\u003c/span>、幅度减半。要求 \u003cspan class=\"eq\">ω₀ &gt; ω\u003csub>m\u003c/sub>\u003c/span>（载波高于信号最高频率），否则两片频谱会重叠。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">同步解调\u003c/span>\u003cp style=\"margin:4px 0\">收端再乘一次 \u003cspan class=\"eq\">cos ω₀t\u003c/span>，用低通滤波器取出基带：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t)cos²ω₀t = ½x(t) + ½x(t)cos 2ω₀t\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">低通滤掉 \u003cspan class=\"eq\">2ω₀\u003c/span> 附近的分量，剩下 \u003cspan class=\"eq\">½x(t)\u003c/span>，再放大 2 倍即还原。\u003cb>关键：收端载波必须与发端同频同相\u003c/b>（所以叫「同步」），相位差 θ 会使输出衰减 \u003cspan class=\"eq\">cos θ\u003c/span> 倍，差 90° 时完全收不到。\u003c/p>\u003c/div>\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>DSB-SC（双边带抑制载波）\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">就是 \u003cspan class=\"eq\">x(t)cos ω₀t\u003c/span>。上下两个边带携带相同信息，带宽 \u003cspan class=\"eq\">2ω\u003csub>m\u003c/sub>\u003c/span>，浪费一半。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>SSB（单边带）\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14.5px\">用带通滤波器只留上边带或下边带，带宽省一半；也可用希尔伯特变换实现。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>频分复用 FDM：\u003c/b>中波广播频段 526.5～1606.5 kHz，而每路广播信号只有几十 kHz 带宽。给每路分配不同的 \u003cspan class=\"eq\">ω₀\u003c/span>，把各自频谱搬到不同位置，就能在同一信道里同时传几十路；收端用可调带通滤波器「挑」出想听的那一台，再同步解调。\u003cb>收音机调台 = 搬动带通滤波器的中心频率。\u003c/b>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 6-9　调制系统的频谱分析\u003c/span>\u003cspan class=\"tag g\">综合\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">x(t)\u003c/span> 的频谱 \u003cspan class=\"eq\">X(jω)\u003c/span> 在 \u003cspan class=\"eq\">|ω| &lt; ω\u003csub>m\u003c/sub>\u003c/span> 内非零。\u003cspan class=\"eq\">y(t) = x(t)cos ω₀t\u003c/span>，再与 \u003cspan class=\"eq\">cos ω₀t\u003c/span> 相乘后经理想低通（截止 \u003cspan class=\"eq\">ω\u003csub>m\u003c/sub>\u003c/span>）。写出各点频谱并求最终输出。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>A 点（调制后）：\u003c/b>\u003cspan class=\"eq\">Y\u003csub>A\u003c/sub> = ½[X(ω−ω₀) + X(ω+ω₀)]\u003c/span>，两片谱分别在 \u003cspan class=\"eq\">±ω₀\u003c/span> 附近，各宽 \u003cspan class=\"eq\">2ω\u003csub>m\u003c/sub>\u003c/span>。\u003c/p>\u003cp>\u003cb>B 点（再乘一次载波）：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>B\u003c/sub> = x(t)cos²ω₀t = ½x(t) + ½x(t)cos 2ω₀t\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y\u003csub>B\u003c/sub>(jω) = ½X(jω) + ¼[X(j(ω − 2ω₀)) + X(j(ω + 2ω₀))]\u003c/span>\u003c/div>\u003cp>\u003cb>C 点（低通后）：\u003c/b>\u003cspan class=\"eq\">2ω₀\u003c/span> 附近的分量被滤掉，只剩 \u003cspan class=\"eq\">½X(jω)\u003c/span>，即 \u003cspan class=\"eq\">y\u003csub>C\u003c/sub>(t) = ½x(t)\u003c/span>。\u003c/p>\u003cp>\u003cb>最终：\u003c/b>后接增益为 2 的放大器，得 \u003cspan class=\"eq\">y(t) = x(t)\u003c/span>，无失真还原 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>漏掉 \u003cspan class=\"eq\">½\u003c/span> 这个系数，或者忘了第二次调制会产生 \u003cspan class=\"eq\">2ω₀\u003c/span> 分量。写频谱时把每一片的中心位置和宽度都标出来，最不容易错。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s67","title":"6.7 频域分析的局限 → 为什么要学复频域","html":"\u003cdiv class=\"card\">\u003cp style=\"margin-top:0\">\u003cb>频域法（傅里叶）的三个短板：\u003c/b>\u003c/p>\u003col style=\"margin-bottom:0\">\u003cli>只能求\u003cb>零状态响应\u003c/b>，算不了零输入响应；\u003c/li>\u003cli>要求输入信号的傅里叶变换存在（\u003cspan class=\"eq\">e\u003csup>2t\u003c/sup>u(t)\u003c/span>、\u003cspan class=\"eq\">u(t)\u003c/span> 这类增长信号不满足绝对可积）；\u003c/li>\u003cli>要求系统稳定，否则 \u003cspan class=\"eq\">H(jω)\u003c/span> 可能不存在（例如 \u003cspan class=\"eq\">y″+y=x\u003c/span> 的 \u003cspan class=\"eq\">h(t)=sin t·u(t)\u003c/span>）。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"tip\">\u003cb>解决办法：\u003c/b>给信号乘一个「收敛因子」\u003cspan class=\"eq\">e\u003csup>−σt\u003c/sup>\u003c/span>，把不收敛的信号硬压成收敛，这就是\u003cb>拉普拉斯变换\u003c/b>（连续）和 \u003cb>Z 变换\u003c/b>（离散）。它们既能处理增长信号、不稳定系统，又能自动把初始状态带进代数方程，一口气算出\u003cb>完全响应\u003c/b>。第 7、8 章就讲这个。\n\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>频率响应 \u003cspan class=\"eq\">H\u003c/span> 是系统的「频域指纹」：由微分方程 / \u003cspan class=\"eq\">h\u003c/span> / 电路模型三选一求出来；用它乘输入频谱得到输出频谱；幅度恒定＋相位线性 = 无失真；通带受限 = 滤波；乘载波 = 频谱搬移。\u003cb>下一章把 \u003cspan class=\"eq\">jω\u003c/span> 换成 \u003cspan class=\"eq\">s = σ + jω\u003c/span>，功能立刻强大十倍。\u003c/b>\u003c/div>\u003c/section>"}]},{"n":7,"title":"拉普拉斯变换与 s 域分析（CH6）","intro":"\u003cb>对应课件：\u003c/b>L18 s 域、L19 L 反变换、L20 系统函数、L21 系统连接与模拟。\u003cbr>\u003cb>本章地位：\u003c/b>连续系统的「终极工具」，大题几乎必考。它把微分方程变成\u003cb>代数方程\u003c/b>，还能同时处理零输入、零状态、增长信号和不稳定系统。\u003cbr>\u003cb>一句话主线：\u003c/b>\u003cspan class=\"eq\">时域微分方程 → 取 L 变换 → s 域代数方程 → 解出 Y(s) → 取反变换得 y(t)\u003c/span>。","sections":[{"id":"s71","title":"7.1 为什么要用拉普拉斯变换","html":"\u003cdiv class=\"tip\">\u003cb>通俗理解：\u003c/b>傅里叶变换要求信号「老老实实衰减」，遇到 \u003cspan class=\"eq\">e\u003csup>2t\u003c/sup>u(t)\u003c/span> 这种越涨越大的信号就积不出结果。拉普拉斯变换先给它乘一个衰减因子 \u003cspan class=\"eq\">e\u003csup>−σt\u003c/sup>\u003c/span>，把信号「按住」，等算完再放回来。这个额外的 \u003cspan class=\"eq\">σ\u003c/span> 让 \u003cspan class=\"eq\">jω\u003c/span> 扩展成 \u003cspan class=\"eq\">s = σ + jω\u003c/span>（复频率），能力一下强了很多。\n\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">单边拉普拉斯变换的定义\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003csup>−\u003c/sup>\u003c/span>\u003c/span>\u003c/span> x(t)e\u003csup>−st\u003c/sup>dt，　s = σ + jω\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">积分下限取 \u003cspan class=\"eq\">0\u003csup>−\u003c/sup>\u003c/span>，是为了\u003cb>把 t=0 处的冲激和初始状态都包进来\u003c/b>——这正是它能自动处理初始条件的原因。反变换：\u003cspan class=\"eq\">x(t) = (1/2πj)∫\u003csub>σ−j∞\u003c/sub>\u003csup>σ+j∞\u003c/sup>X(s)e\u003csup>st\u003c/sup>ds\u003c/span>（了解即可，考试用部分分式）。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">收敛域 ROC\u003c/span>\u003cp style=\"margin:4px 0\">使积分收敛的 \u003cspan class=\"eq\">σ\u003c/span> 的范围。对\u003cb>因果（右边）信号\u003c/b>，ROC 总是某个竖直线右侧的半平面：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>u(t) ⟷ \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + a\u003c/span>\u003c/span>，　ROC：Re{s} &gt; −a\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>与傅里叶变换的关系：\u003c/b>ROC 包含 \u003cspan class=\"eq\">jω\u003c/span> 轴（即 \u003cspan class=\"eq\">σ=0\u003c/span>）时，直接令 \u003cspan class=\"eq\">s=jω\u003c/span> 就得到傅里叶变换；不包含时傅里叶变换不存在，但拉氏变换仍在。\u003c/p>\u003c/div>"},{"id":"s72","title":"7.2 常用单边拉普拉斯变换对（必背）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:38%\">时域 \u003cspan class=\"eq\">x(t)\u003c/span>\u003c/th>\u003cth style=\"width:34%\">\u003cspan class=\"eq\">X(s)\u003c/span>\u003c/th>\u003cth>ROC / 备注\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">δ(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1\u003c/span>\u003c/td>\u003ctd>全平面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">δ′(t)\u003c/span>（冲激偶）\u003c/td>\u003ctd>\u003cspan class=\"eq\">s\u003c/span>\u003c/td>\u003ctd>全平面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1/s\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">t u(t)\u003c/span>（斜坡）\u003c/td>\u003ctd>\u003cspan class=\"eq\">1/s²\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">t\u003csup>n\u003c/sup>u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">n!/s\u003csup>n+1\u003c/sup>\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1/(s+a)\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; −a\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">t e\u003csup>−at\u003c/sup>u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1/(s+a)²\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; −a\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">t\u003csup>n\u003c/sup>e\u003csup>−at\u003c/sup>u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">n!/(s+a)\u003csup>n+1\u003c/sup>\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; −a\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">sin ω₀t·u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">ω₀/(s² + ω₀²)\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">cos ω₀t·u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">s/(s² + ω₀²)\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>sin ω₀t·u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">ω₀/[(s+a)² + ω₀²]\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; −a\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>cos ω₀t·u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(s+a)/[(s+a)² + ω₀²]\u003c/span>\u003c/td>\u003ctd>Re{s} &gt; −a\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周期为 T 的单边周期信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">X₁(s)/(1 − e\u003csup>−sT\u003c/sup>)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X₁(s)\u003c/span> 是第一个周期的变换\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 7-1　单边拉普拉斯变换对（和傅里叶变换对对照着记，令 s=jω 就能互相验证）\u003c/p>"},{"id":"s73","title":"7.3 单边拉普拉斯变换的性质","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:22%\">性质\u003c/th>\u003cth style=\"width:38%\">时域\u003c/th>\u003cth>s 域\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>线性\u003c/td>\u003ctd>\u003cspan class=\"eq\">a x₁ + b x₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">aX₁ + bX₂\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>展缩\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(at)\u003c/span>，a&gt;0\u003c/td>\u003ctd>\u003cspan class=\"eq\">(1/a)X(s/a)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t − t₀)u(t − t₀)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−st₀\u003c/sup>X(s)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>s 域平移（指数加权）\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−λt\u003c/sup>x(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(s + λ)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>时域微分\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x′(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">sX(s) − x(0\u003csup>−\u003c/sup>)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x″(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">s²X(s) − s x(0\u003csup>−\u003c/sup>) − x′(0\u003csup>−\u003c/sup>)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时域积分\u003c/td>\u003ctd>\u003cspan class=\"eq\">∫\u003csub>0\u003csup>−\u003c/sup>\u003c/sub>\u003csup>t\u003c/sup>x(τ)dτ\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(s)/s\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>时域卷积\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x₁ ∗ x₂\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X₁(s)X₂(s)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>s 域微分（t 加权）\u003c/td>\u003ctd>\u003cspan class=\"eq\">t x(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">−dX(s)/ds\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 7-2　拉普拉斯变换性质（加粗三条是解微分方程的核心）\u003c/p>\u003cdiv class=\"kp\">\u003cspan class=\"t\">初值定理与终值定理（填空常客）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(0\u003csup>+\u003c/sup>) = lim\u003csub>s→∞\u003c/sub> sX(s)，　x(∞) = lim\u003csub>s→0\u003c/sub> sX(s)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>使用条件：\u003c/b>初值定理要求 \u003cspan class=\"eq\">X(s)\u003c/span> 是真分式（分子次数 &lt; 分母次数）；终值定理要求 \u003cspan class=\"eq\">sX(s)\u003c/span> 的 ROC \u003cb>包含 jω 轴\u003c/b>（即系统最终确实收敛）。若 \u003cspan class=\"eq\">X(s)\u003c/span> 有右半平面极点或虚轴极点，终值不存在，硬套公式会得出荒谬答案。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-1　求矩形脉冲的拉氏变换（课件原题）\u003c/span>\u003cspan class=\"tag\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">x(t) = u(t) − u(t−1)\u003c/span> 的 \u003cspan class=\"eq\">X(s)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>用线性 + 时移性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> − e\u003csup>−s\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − e\u003csup>−s\u003c/sup>\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>注意：\u003c/b>因为它是\u003cb>有限长信号\u003c/b>，ROC 是整个 s 平面（包括 \u003cspan class=\"eq\">s=0\u003c/span> 处，那里分子也为 0，是可去奇点）。\u003c/p>\u003cdiv class=\"tip\">\u003cb>对照记忆：\u003c/b>同一个矩形脉冲的傅里叶变换是 \u003cspan class=\"eq\">Sa(ω/2)e\u003csup>−jω/2\u003c/sup>\u003c/span>；把 \u003cspan class=\"eq\">s=jω\u003c/span> 代入上式得 \u003cspan class=\"eq\">(1−e\u003csup>−jω\u003c/sup>)/(jω)\u003c/span>，两者等价 ✓。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-2　利用微分性质求 h(t)（课件原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知某 LTI 系统的冲激响应满足 \u003cspan class=\"eq\">h″(t) + h(t) = δ(t)\u003c/span>，用拉氏变换求 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>零状态下两边取拉氏变换（\u003cspan class=\"eq\">δ(t) ⟷ 1\u003c/span>，初始状态全为 0）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s²H(s) + H(s) = 1 ⟹ H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s² + 1\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>查表 7-1（\u003cspan class=\"eq\">sin ω₀t ⟷ ω₀/(s²+ω₀²)\u003c/span>，取 \u003cspan class=\"eq\">ω₀=1\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = sin t · u(t)\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>这道题在课件里是用来「打脸傅里叶法」的：\u003c/b>因为极点在 \u003cspan class=\"eq\">±j\u003c/span> 虚轴上，系统不稳定，\u003cspan class=\"eq\">H(jω)\u003c/span> 不存在（会漏掉虚轴上的冲激项）。用频域法会得到 \u003cspan class=\"eq\">H(jω)=1/(1−ω²)\u003c/span> 这种错误答案。\u003cb>凡是遇到不稳定系统，一律改用拉普拉斯变换。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s74","title":"7.4 拉普拉斯反变换：部分分式展开法","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">三步走\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>\u003cb>化真分式：\u003c/b>若分子次数 ≥ 分母次数，先做多项式除法，把常数项（对应 \u003cspan class=\"eq\">δ(t)\u003c/span> 及其导数）单独拎出来。\u003c/li>\u003cli>\u003cb>分解极点：\u003c/b>设 \u003cspan class=\"eq\">X(s) = Σ K\u003csub>i\u003c/sub>/(s − p\u003csub>i\u003c/sub>)\u003c/span>，一阶极点用 \u003cspan class=\"eq\">K\u003csub>i\u003c/sub> = (s − p\u003csub>i\u003c/sub>)X(s)|\u003csub>s=p\u003csub>i\u003c/sub>\u003c/sub>\u003c/span>（遮盖法）。\u003c/li>\u003cli>\u003cb>查表反变换：\u003c/b>\u003cspan class=\"eq\">K/(s − p) ⟷ K e\u003csup>pt\u003c/sup>u(t)\u003c/span>；共轭复极点配成 \u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>(A cos ωt + B sin ωt)\u003c/span>。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">r 重极点的处理\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">K₁\u003c/span>\u003cspan class=\"fd\">s − p\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">K₂\u003c/span>\u003cspan class=\"fd\">(s − p)²\u003c/span>\u003c/span> + … + \u003cspan class=\"fr\">\u003cspan class=\"fn\">K\u003csub>r\u003c/sub>\u003c/span>\u003cspan class=\"fd\">(s − p)\u003csup>r\u003c/sup>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">K\u003csub>m\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(r − m)!\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">d\u003csup>r−m\u003c/sup>\u003c/span>\u003cspan class=\"fd\">ds\u003csup>r−m\u003c/sup>\u003c/span>\u003c/span>[(s − p)\u003csup>r\u003c/sup>X(s)]\u003cspan style=\"font-size:.8em\">|\u003csub>s=p\u003c/sub>\u003c/span>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>对应时域：\u003c/b>\u003cspan class=\"eq\">K\u003csub>m\u003c/sub> t\u003csup>m−1\u003c/sup>e\u003csup>pt\u003c/sup>u(t)/(m−1)!\u003c/span>。考场上最常用的是二重极点：先乘 \u003cspan class=\"eq\">(s−p)²\u003c/span>，求导一次得 \u003cspan class=\"eq\">K₁\u003c/span>，直接代值得 \u003cspan class=\"eq\">K₂\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-3　一阶极点（基础题型）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">X(s) = (s+2)/(s²+4s+3)\u003c/span> 的反变换。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>因式分解：\u003c/b>\u003cspan class=\"eq\">s²+4s+3 = (s+1)(s+3)\u003c/span>，两个一阶极点 \u003cspan class=\"eq\">p₁=−1, p₂=−3\u003c/span>。\u003c/p>\u003cp>\u003cb>遮盖法求系数：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">K₁ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">s + 2\u003c/span>\u003cspan class=\"fd\">s + 3\u003c/span>\u003c/span>\u003cspan style=\"font-size:.8em\">|\u003csub>s=−1\u003c/sub>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>，　K₂ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">s + 2\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span>\u003cspan style=\"font-size:.8em\">|\u003csub>s=−3\u003c/sub>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">−1\u003c/span>\u003cspan class=\"fd\">−2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s + 3\u003c/span>\u003c/span> ⟹ x(t) = ½(e\u003csup>−t\u003c/sup> + e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">x(0\u003csup>+\u003c/sup>) = ½(1+1) = 1\u003c/span>；用初值定理 \u003cspan class=\"eq\">lim\u003csub>s→∞\u003c/sub>sX(s) = lim s·(s+2)/(s²+4s+3) = 1\u003c/span> ✓。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-4　含二重极点\u003c/span>\u003cspan class=\"tag g\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">X(s) = 1/[s(s+1)²]\u003c/span> 的反变换。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>设 \u003cspan class=\"eq\">X(s) = A/s + B/(s+1) + C/(s+1)²\u003c/span>。\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">A = sX(s)|\u003csub>s=0\u003c/sub> = 1\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">C = (s+1)²X(s)|\u003csub>s=−1\u003c/sub> = 1/s|\u003csub>s=−1\u003c/sub> = −1\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">B = d/ds[(s+1)²X(s)]|\u003csub>s=−1\u003c/sub> = d/ds(1/s)|\u003csub>s=−1\u003c/sub> = −1/s²|\u003csub>s=−1\u003c/sub> = −1\u003c/span>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(s + 1)²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>查表（\u003cspan class=\"eq\">1/s ↔ u(t)\u003c/span>，\u003cspan class=\"eq\">1/(s+1)² ↔ t e\u003csup>−t\u003c/sup>u(t)\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = [1 − e\u003csup>−t\u003c/sup> − t e\u003csup>−t\u003c/sup>]u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">x(0\u003csup>+\u003c/sup>)=1−1−0=0\u003c/span>；初值定理 \u003cspan class=\"eq\">lim sX(s)=lim 1/(s+1)²=0\u003c/span> ✓；终值定理 \u003cspan class=\"eq\">lim\u003csub>s→0\u003c/sub>sX(s)=1\u003c/span>，而 \u003cspan class=\"eq\">x(∞)=1\u003c/span> ✓。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>MATLAB 辅助：\u003c/b>\u003cspan class=\"eq\">[r, p, k] = residue(num, den)\u003c/span> 直接给出留数 \u003cspan class=\"eq\">r\u003c/span>、极点 \u003cspan class=\"eq\">p\u003c/span> 和多项式部分 \u003cspan class=\"eq\">k\u003c/span>。例如 \u003cspan class=\"eq\">[r,p]=residue([1 2],[1 4 3])\u003c/span> 会返回 \u003cspan class=\"eq\">r=[0.5;0.5], p=[−3;−1]\u003c/span>。课件里的例题都用这个验算，机试会用到。\n\u003c/div>"},{"id":"s75","title":"7.5 系统函数 H(s) 与零极点","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">系统函数的三种求法\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">Y\u003csub>zs\u003c/sub>(s)\u003c/span>\u003cspan class=\"fd\">X(s)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">B(s)\u003c/span>\u003cspan class=\"fd\">A(s)\u003c/span>\u003c/span> = \u003cspan class=\"eq\">L\u003c/span>{h(t)}\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">① 由微分方程两边取拉氏变换（零状态）；② 对 \u003cspan class=\"eq\">h(t)\u003c/span> 取变换；③ 由输入输出的变换相除。\u003cb>分母的根 = 极点，分子的根 = 零点。\u003c/b>\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">极点位置决定系统的「性格」\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:36%\">极点在 s 平面的位置\u003c/th>\u003cth>对应的 \u003cspan class=\"eq\">h(t)\u003c/span> 形状\u003c/th>\u003cth style=\"width:20%\">稳定性（因果系统）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>左半平面 \u003cspan class=\"eq\">σ &lt; 0\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>u(t)\u003c/span>，衰减\u003c/td>\u003ctd>稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右半平面 \u003cspan class=\"eq\">σ &gt; 0\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>at\u003c/sup>u(t)\u003c/span>，增长\u003c/td>\u003ctd>不稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>虚轴单极点 \u003cspan class=\"eq\">σ = 0\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">sin ωt·u(t)\u003c/span>，等幅振荡\u003c/td>\u003ctd>临界（不算 BIBO 稳定）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>虚轴重极点\u003c/td>\u003ctd>\u003cspan class=\"eq\">t·sin ωt·u(t)\u003c/span>，振荡增长\u003c/td>\u003ctd>不稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>共轭复极点 \u003cspan class=\"eq\">−a ± jω\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>sin ωt·u(t)\u003c/span>，衰减振荡\u003c/td>\u003ctd>稳定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r 重实极点\u003c/td>\u003ctd>\u003cspan class=\"eq\">t\u003csup>r−1\u003c/sup>e\u003csup>pt\u003c/sup>u(t)\u003c/span>\u003c/td>\u003ctd>看 p 的实部\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">稳定性与因果性的判据\u003c/span>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>一般 LTI 系统稳定\u003c/b> ⟺ \u003cspan class=\"eq\">H(s)\u003c/span> 的 ROC \u003cb>包含 jω 轴\u003c/b>；\u003c/li>\u003cli>\u003cb>因果系统稳定\u003c/b> ⟺ \u003cspan class=\"eq\">H(s)\u003c/span> 的\u003cb>全部极点都在左半 s 平面\u003c/b>；\u003c/li>\u003cli>\u003cb>因果\u003c/b> ⟺ \u003cspan class=\"eq\">h(t) = 0（t &lt; 0）\u003c/span>，ROC 为最右极点右侧的半平面；\u003c/li>\u003cli>只有稳定系统才有 \u003cspan class=\"eq\">H(jω) = H(s)|\u003csub>s=jω\u003c/sub>\u003c/span>。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-5　判断稳定性（课件原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>判断下列因果系统是否稳定：① \u003cspan class=\"eq\">H(s)=1/(s+2)\u003c/span>；② \u003cspan class=\"eq\">H(s)=s/(s²+ω₀²)\u003c/span>；③ \u003cspan class=\"eq\">H(s)=1/(s−3)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>①\u003c/b> 极点 \u003cspan class=\"eq\">s=−2\u003c/span> 在左半平面 → \u003cb>稳定\u003c/b>。\u003cspan class=\"eq\">h(t)=e\u003csup>−2t\u003c/sup>u(t)\u003c/span>，绝对可积。\u003c/p>\u003cp>\u003cb>②\u003c/b> 极点 \u003cspan class=\"eq\">s=±jω₀\u003c/span> 在虚轴上 → \u003cb>不稳定\u003c/b>。\u003cspan class=\"eq\">h(t)=cos ω₀t·u(t)\u003c/span> 永不衰减；若输入有界信号 \u003cspan class=\"eq\">sin ω₀t·u(t)\u003c/span>（同频），输出会共振线性增长。\u003c/p>\u003cp>\u003cb>③\u003c/b> 极点 \u003cspan class=\"eq\">s=+3\u003c/span> 在右半平面 → \u003cb>不稳定\u003c/b>。\u003cspan class=\"eq\">h(t)=e\u003csup>3t\u003c/sup>u(t)\u003c/span> 指数爆炸。\u003c/p>\u003cdiv class=\"tip\">\u003cb>答题模板：\u003c/b>「求出极点 → 画 s 平面图 → 因题目说因果，故 ROC 在最右极点右侧 → 看是否含 jω 轴 / 极点是否全在左半平面 → 结论」。四步写全，步骤分到手。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-6　由微分方程求 H(s) 与 h(t)\u003c/span>\u003cspan class=\"tag\">大题模板\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y″(t) + 3y′(t) + 2y(t) = 3x(t) + 2x′(t)，t ≥ 0\u003c/span>，求 \u003cspan class=\"eq\">H(s)\u003c/span>、\u003cspan class=\"eq\">h(t)\u003c/span>，并判断稳定性。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>零状态下取拉氏变换：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">(s² + 3s + 2)Y(s) = (3 + 2s)X(s)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2s + 3\u003c/span>\u003cspan class=\"fd\">s² + 3s + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2s + 3\u003c/span>\u003cspan class=\"fd\">(s+1)(s+2)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>遮盖法核对：\u003cspan class=\"eq\">K₁=(2s+3)/(s+2)|\u003csub>s=−1\u003c/sub> = 1/1 = 1\u003c/span>；\u003cspan class=\"eq\">K₂=(2s+3)/(s+1)|\u003csub>s=−2\u003c/sub> = (−1)/(−1) = 1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = (e\u003csup>−t\u003c/sup> + e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>极点 \u003cspan class=\"eq\">−1, −2\u003c/span> 都在左半平面，系统因果且\u003cb>稳定\u003c/b> ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>注意：\u003c/b>右端含 \u003cspan class=\"eq\">x′(t)\u003c/span> 时，\u003cspan class=\"eq\">H(s)\u003c/span> 的分子次数可能等于分母次数减 1，但这里仍是真分式，所以 \u003cspan class=\"eq\">h(t)\u003c/span> 里\u003cb>没有\u003c/b>\u003cspan class=\"eq\">δ(t)\u003c/span> 项。判断口诀：\u003cb>分子次数 ≥ 分母次数，h 中才有 δ 及其导数。\u003c/b>\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s76","title":"7.6 s 域求系统响应（完全响应一次算完）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">解题四步\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>对微分方程两边取\u003cb>单边\u003c/b>拉氏变换，用微分性质把 \u003cspan class=\"eq\">y(0\u003csup>−\u003c/sup>), y′(0\u003csup>−\u003c/sup>)\u003c/span> 代进去；\u003c/li>\u003cli>整理出 \u003cspan class=\"eq\">Y(s) = Y\u003csub>zi\u003c/sub>(s) + H(s)X(s)\u003c/span>（前者只含初值，后者只含输入）；\u003c/li>\u003cli>部分分式展开；\u003c/li>\u003cli>逐项反变换，得 \u003cspan class=\"eq\">y(t) = y\u003csub>zi\u003c/sub>(t) + y\u003csub>zs\u003c/sub>(t)\u003c/span>。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-7　一阶系统 s 域求解（含初值）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">y′(t) + 2y(t) = x(t)\u003c/span>，\u003cspan class=\"eq\">x(t) = u(t)\u003c/span>，\u003cspan class=\"eq\">y(0\u003csup>−\u003c/sup>) = 1\u003c/span>。求完全响应，并分出零输入、零状态。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：取单边拉氏变换。\u003c/b>用 \u003cspan class=\"eq\">y′ ⟷ sY − y(0\u003csup>−\u003c/sup>)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">[sY(s) − 1] + 2Y(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：整理。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 + 1/s\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">s + 1\u003c/span>\u003cspan class=\"fd\">s(s + 2)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：反变换。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = (½ + ½e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第四步：拆分验证。\u003c/b>\u003c/p>\u003cul>\u003cli>零输入：\u003cspan class=\"eq\">Y\u003csub>zi\u003c/sub>(s) = y(0\u003csup>−\u003c/sup>)/(s+2) = 1/(s+2) → y\u003csub>zi\u003c/sub>(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span>；\u003c/li>\u003cli>零状态：\u003cspan class=\"eq\">Y\u003csub>zs\u003c/sub>(s) = H(s)X(s) = 1/[s(s+2)] = ½/s − ½/(s+2) → y\u003csub>zs\u003c/sub>(t) = ½(1 − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>；\u003c/li>\u003cli>相加：\u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup> + ½ − ½e\u003csup>−2t\u003c/sup> = ½ + ½e\u003csup>−2t\u003c/sup>\u003c/span> ✓。\u003c/li>\u003c/ul>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y(0\u003csup>+\u003c/sup>)=1\u003c/span> ✓；代回方程 \u003cspan class=\"eq\">y′+2y = −e\u003csup>−2t\u003c/sup> + 1 + e\u003csup>−2t\u003c/sup> = 1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>对比第 2 章：\u003c/b>时域法要「求齐次解 + 设特解 + 定常数」三大步；s 域法只需要「取变换 → 解一个代数方程 → 反变换」，\u003cb>初始条件自动进方程\u003c/b>，而且零输入零状态自然分开。这就是复频域法在考场上的最大优势。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s77","title":"7.7 系统互联与模拟框图","html":"\u003cdiv class=\"grid3\">\u003cdiv class=\"card\">\u003cb>级联\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">H = H₁H₂\u003c/span>，时域 \u003cspan class=\"eq\">h = h₁∗h₂\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>并联\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">H = H₁ + H₂\u003c/span>，时域 \u003cspan class=\"eq\">h = h₁ + h₂\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>反馈\u003c/b>\u003cp style=\"margin:4px 0 0;font-size:14px\">\u003cspan class=\"eq\">H = H₁/(1 ± H₁H₂)\u003c/span>，负反馈取 +\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">三种模拟结构\u003c/span>\u003cp style=\"margin:4px 0\">基本单元只有三个：\u003cb>加法器、数乘器、积分器 1/s\u003c/b>。把 \u003cspan class=\"eq\">H(s)\u003c/span> 写成不同形式，就得到不同框图：\u003c/p>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>直接型：\u003c/b>直接按 \u003cspan class=\"eq\">H(s)=B(s)/A(s)\u003c/span> 画，用最少的积分器；\u003c/li>\u003cli>\u003cb>级联型：\u003c/b>把 \u003cspan class=\"eq\">H(s)\u003c/span> 因式分解成 \u003cspan class=\"eq\">H₁H₂…\u003c/span>，每个子系统画直接型再串起来；\u003c/li>\u003cli>\u003cb>并联型：\u003c/b>部分分式展开成 \u003cspan class=\"eq\">H₁+H₂+…\u003c/span>，每个子系统画直接型再并起来。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-8　画直接型框图\u003c/span>\u003cspan class=\"tag g\">画图题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">H(s) = (2s + 3)/(s² + 3s + 2)\u003c/span>，说明如何画直接型模拟框图。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：改写成积分器形式\u003c/b>（分子分母同除 \u003cspan class=\"eq\">s²\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2s\u003csup>−1\u003c/sup> + 3s\u003csup>−2\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 + 3s\u003csup>−1\u003c/sup> + 2s\u003csup>−2\u003c/sup>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：引入中间变量\u003c/b>\u003cspan class=\"eq\">W(s)\u003c/span>，令分母为 \u003cspan class=\"eq\">X(s)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">W(s) = X(s) − 3s\u003csup>−1\u003c/sup>W(s) − 2s\u003csup>−2\u003c/sup>W(s)，　Y(s) = 2s\u003csup>−1\u003c/sup>W(s) + 3s\u003csup>−2\u003c/sup>W(s)\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：画图。\u003c/b>画一条含\u003cb>两个串联 1/s 积分器\u003c/b>的主链，积分器输出自右向左依次是 \u003cspan class=\"eq\">s\u003csup>−2\u003c/sup>W, s\u003csup>−1\u003c/sup>W\u003c/span>；用数乘器把 \u003cspan class=\"eq\">−3\u003c/span>、\u003cspan class=\"eq\">−2\u003c/span> 反馈回输入端加法器，把 \u003cspan class=\"eq\">+2\u003c/span>、\u003cspan class=\"eq\">+3\u003c/span> 送到输出端加法器。\u003c/p>\u003cp>\u003cb>记忆：\u003c/b>分母系数变号后作\u003cb>反馈\u003c/b>，分子系数直接作\u003cb>前馈\u003c/b>。\u003cb>积分器个数 = 系统阶数\u003c/b>。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s78","title":"7.8 双边拉普拉斯变换与收敛域","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">同一 X(s)，不同 ROC 对应不同信号\u003c/span>\u003cp style=\"margin:4px 0\">\u003cspan class=\"eq\">X(s) = ∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>x(t)e\u003csup>−st\u003c/sup>dt\u003c/span>，ROC 是带状区域 \u003cspan class=\"eq\">σ₁ &lt; Re{s} &lt; σ₂\u003c/span>。\u003c/p>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:30%\">信号类型\u003c/th>\u003cth>ROC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>有限长信号\u003c/td>\u003ctd>整个 s 平面（可能除去 0 或 ∞）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右边信号 \u003cspan class=\"eq\">x(t)u(t−t₀)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">Re{s} &gt; σ₀\u003c/span>（某竖线右侧）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>左边信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">Re{s} &lt; σ₀\u003c/span>（某竖线左侧）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>双边信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">σ₁ &lt; Re{s} &lt; σ₂\u003c/span>（带状）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 7-9　ROC 决定时域信号（经典考点）\u003c/span>\u003cspan class=\"tag\">拉分题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>\u003cspan class=\"eq\">X(s) = 1/[(s+1)(s+2)]\u003c/span>，分别求三种 ROC 下的 \u003cspan class=\"eq\">x(t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>先分解：\u003cspan class=\"eq\">X(s) = 1/(s+1) − 1/(s+2)\u003c/span>，极点 \u003cspan class=\"eq\">−1, −2\u003c/span>。\u003c/p>\u003cp>\u003cb>① ROC：Re{s} &gt; −1\u003c/b>（最右极点右侧）→ 两项都是右边信号：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = (e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>② ROC：Re{s} &lt; −2\u003c/b>（最左极点左侧）→ 两项都是左边信号（\u003cspan class=\"eq\">1/(s+a)\u003c/span> 配左边是 \u003cspan class=\"eq\">−e\u003csup>−at\u003c/sup>u(−t)\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = (e\u003csup>−2t\u003c/sup> − e\u003csup>−t\u003c/sup>)u(−t)\u003c/span>\u003c/div>\u003cp>\u003cb>③ ROC：−2 &lt; Re{s} &lt; −1\u003c/b>（带状）→ \u003cspan class=\"eq\">1/(s+1)\u003c/span> 取左边、\u003cspan class=\"eq\">−1/(s+2)\u003c/span> 取右边：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = −e\u003csup>−2t\u003c/sup>u(t) − e\u003csup>−t\u003c/sup>u(−t)\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>核心结论：\u003c/b>\u003cb>只给 X(s) 不给 ROC，反变换不唯一。\u003c/b>单边拉氏变换默认因果，ROC 常被省略；但双边变换题目里 ROC 是必给条件，答题时一定要先判它是右边、左边还是双边信号。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>拉氏变换 = 傅里叶变换的「加强版」：\u003cspan class=\"eq\">s = σ + jω\u003c/span>。三件大事——\u003cb>①\u003c/b> 用微分性质把微分方程变代数方程，一次算出完全响应；\u003cb>②\u003c/b> 用 \u003cspan class=\"eq\">H(s)\u003c/span> 的零极点判断时域特性、因果性与稳定性；\u003cb>③\u003c/b> 用部分分式做反变换。\u003cb>下一章把这套方法平移到离散系统，就是 Z 变换。\u003c/b>\u003c/div>\u003c/section>"}]},{"n":8,"title":"Z 变换与 z 域分析（CH7）","intro":"\u003cb>对应课件：\u003c/b>L22 z 变换、L23 z 反变换、L24 系统 z 域 ＋《回声消除的 z 域分析》（案例）。\u003cbr>\u003cb>本章地位：\u003c/b>离散系统的「终极工具」，与第 7 章高度平行——把 \u003cspan class=\"eq\">s\u003c/span> 换成 \u003cspan class=\"eq\">z\u003c/span>、把积分换成求和、把「左半平面」换成「单位圆内」即可。\u003cbr>\u003cb>一句话主线：\u003c/b>\u003cspan class=\"eq\">差分方程 → 取 Z 变换 → 代数方程 → 解 Y(z) → 反变换得 y[k]\u003c/span>。","sections":[{"id":"s81","title":"8.1 为什么需要 Z 变换","html":"\u003cdiv class=\"tip\">\u003cb>类比着学：\u003c/b>连续系统里，拉普拉斯变换把信号写成 \u003cspan class=\"eq\">e\u003csup>st\u003c/sup>\u003c/span> 的线性组合；离散系统里，Z 变换把序列写成 \u003cspan class=\"eq\">z\u003csup>k\u003c/sup>\u003c/span> 的线性组合。频域法（DTFT）同样只能求零状态、要求绝对可和、要求系统稳定；Z 变换加上收敛因子后，增长序列、不稳定系统、初始状态全都能处理。\n\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">定义\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">双边：X(z) = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">k=−∞\u003c/span>\u003c/span>\u003c/span> x[k]z\u003csup>−k\u003c/sup>；　单边：X(z) = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">k=0\u003c/span>\u003c/span>\u003c/span> x[k]z\u003csup>−k\u003c/sup>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">单边 Z 变换从 \u003cspan class=\"eq\">k=0\u003c/span> 起求和，配合位移性质可自然带入 \u003cspan class=\"eq\">y[−1], y[−2]\u003c/span> 等初始状态，是解差分方程的主力。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">收敛域 ROC（必考概念）\u003c/span>\u003ctable style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth style=\"width:32%\">序列类型\u003c/th>\u003cth>ROC 形状\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>有限长序列\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; 0\u003c/span>（或除 0、∞ 外的全平面）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右边序列 \u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>（圆外）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>左边序列 \u003cspan class=\"eq\">−a\u003csup>k\u003c/sup>u[−k−1]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &lt; |a|\u003c/span>（圆内）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>双边序列\u003c/td>\u003ctd>\u003cspan class=\"eq\">R\u003csub>−\u003c/sub> &lt; |z| &lt; R\u003csub>+\u003c/sub>\u003c/span>（圆环）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp style=\"margin-bottom:0\">\u003cb>单位圆 \u003cspan class=\"eq\">|z| = 1\u003c/span>：\u003c/b>ROC 包含单位圆 ⟺ 序列绝对可和 ⟺ DTFT 存在 ⟺ 系统稳定。且 \u003cspan class=\"eq\">X(e\u003csup>jΩ\u003c/sup>) = X(z)|\u003csub>z=e\u003csup>jΩ\u003c/sup>\u003c/sub>\u003c/span>。\u003c/p>\u003c/div>"},{"id":"s82","title":"8.2 常用 Z 变换对（必背）","html":"\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:36%\">序列 \u003cspan class=\"eq\">x[k]\u003c/span>\u003c/th>\u003cth style=\"width:34%\">\u003cspan class=\"eq\">X(z)\u003c/span>\u003c/th>\u003cth>ROC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">δ[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1\u003c/span>\u003c/td>\u003ctd>全平面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">δ[k − m]\u003c/span>，m&gt;0\u003c/td>\u003ctd>\u003cspan class=\"eq\">z\u003csup>−m\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; 0\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z/(z−1) = 1/(1 − z\u003csup>−1\u003c/sup>)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; 1\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">z/(z−a) = 1/(1 − az\u003csup>−1\u003c/sup>)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">k a\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">a
