/span>。要分三段讨论：\u003c/p>\u003cp>\u003cb>① \u003cspan class=\"eq\">k &lt; 0\u003c/span>：\u003c/b>两个序列完全不重叠，\u003cspan class=\"eq\">y[k] = 0\u003c/span>。\u003c/p>\u003cp>\u003cb>② \u003cspan class=\"eq\">0 ≤ k ≤ N−1\u003c/span>：\u003c/b>重叠区间是 \u003cspan class=\"eq\">[0, k]\u003c/span>，共 \u003cspan class=\"eq\">k+1\u003c/span> 个点，每点乘积为 1：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>1 = k + 1\u003c/span>\u003c/div>\u003cp>\u003cb>③ \u003cspan class=\"eq\">N−1 &lt; k ≤ 2N−2\u003c/span>：\u003c/b>开始“滑出”，重叠区间是 \u003cspan class=\"eq\">[k−(N−1), N−1]\u003c/span>，点数 \u003cspan class=\"eq\">2N−1−k\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">N−1\u003c/span>\u003cspan class=\"l\">n=k−(N−1)\u003c/span>\u003c/span>\u003c/span>1 = 2N − 1 − k\u003c/span>\u003c/div>\u003cp>\u003cb>④ \u003cspan class=\"eq\">k &gt; 2N−2\u003c/span>：\u003c/b>完全滑出，\u003cspan class=\"eq\">y[k] = 0\u003c/span>。\u003c/p>\u003cp>合起来：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan style=\"display:inline-block;text-align:left;vertical-align:middle;line-height:1.6\">k+1,　0 ≤ k ≤ N−1\u003cbr>2N−1−k,　N−1 ≤ k ≤ 2N−2\u003cbr>0,　其他\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>用 N=3 验证：\u003c/b>结果为 \u003cspan class=\"eq\">1, 2, 3, 2, 1\u003c/span>，总和 9 = 3×3 ✓，形状是三角形 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>很多人只写前两段，漏掉“滑出”的第三段；或者把分界点写成 \u003cspan class=\"eq\">N\u003c/span>。正确分界是 \u003cspan class=\"eq\">k = N−1\u003c/span>（顶点位置），总长度到 \u003cspan class=\"eq\">2N−2\u003c/span>。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-7　RN ∗ RN（课堂原题，易错）","tags":["讲义例题"],"needsCheck":false,"steps":["用 N=3 验证："],"title":"例 3-7　RN ∗ RN（课堂原题，易错）","id":"signals-例3-7","points":["两个长度为 N 的“矩形序列”卷积，结果是三角形，总长度 2N−1","要分三段讨论：① k \u003c 0：两个序列完全不重叠，y[k] = 0","② 0 ≤ k ≤ N−1：重叠区间是 [0, k]，共 k+1 个点，每点乘积为 1：y[k] = Σkn=01 = k + 1③ N−1 \u003c k ≤ 2N−2：开始“滑出”，重叠区间是 [k−(N−1), N−1]，点数 2N−1−k：y[k] = ΣN−1n=k−(N−1)1 = 2N − 1 − k④ k > 2N−2：完全滑出，y[k] = 0","合起来：y[k] = k+1,　0 ≤ k ≤ N−1\n2N−1−k,　N−1 ≤ k ≤ 2N−2\n0,　其他用 N=3 验证：结果为 1, 2, 3, 2, 1，总和 9 = 3×3 ✓，形状是三角形 ✓"]},{"ch":3,"no":"例3-8","kind":"short","group":"written","stem":"\u003cp>计算 \u003cspan class=\"eq\">α\u003csup>k\u003c/sup>u[k] ∗ β\u003csup>k\u003c/sup>u[k]\u003c/span>（\u003cspan class=\"eq\">α ≠ β\u003c/span>）。\u003c/p>","options":[],"answer":"\u003cp>按定义，\u003cspan class=\"eq\">n\u003c/span> 的范围是 \u003cspan class=\"eq\">0 ≤ n ≤ k\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>α\u003csup>n\u003c/sup>β\u003csup>k−n\u003c/sup> = β\u003csup>k\u003c/sup>\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>(\u003cspan class=\"fr\">\u003cspan class=\"fn\">α\u003c/span>\u003cspan class=\"fd\">β\u003c/span>\u003c/span>)\u003csup>n\u003c/sup>\u003c/span>\u003c/div>\u003cp>这是等比数列求和（公比 \u003cspan class=\"eq\">α/β\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= β\u003csup>k\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − (α/β)\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 − α/β\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">β\u003csup>k+1\u003c/sup> − α\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">β − α\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>所以（\u003cspan class=\"eq\">k ≥ 0\u003c/span>，乘 \u003cspan class=\"eq\">u[k]\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">β\u003csup>k+1\u003c/sup> − α\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">β − α\u003c/span>\u003c/span>u[k]\u003c/span>\u003c/div>\u003cp>当 \u003cspan class=\"eq\">α = β\u003c/span> 时，用洛必达或直接求和得 \u003cspan class=\"eq\">y[k] = (k+1)α\u003csup>k\u003c/sup>u[k]\u003c/span>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>和连续对照记：\u003c/b>连续是 \u003cspan class=\"eq\">(e\u003csup>βt\u003c/sup>−e\u003csup>αt\u003c/sup>)/(β−α)\u003c/span>，离散是 \u003cspan class=\"eq\">(β\u003csup>k+1\u003c/sup>−α\u003csup>k+1\u003c/sup>)/(β−α)\u003c/span>。注意离散的指数多了一个 “+1”，这是最容易抄错的地方。","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-8　指数序列卷积（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 3-8　指数序列卷积（课堂原题）","id":"signals-例3-8","points":["按定义，n 的范围是 0 ≤ n ≤ k：y[k] = Σkn=0αnβk−n = βkΣkn=0(αβ)n这是等比数列求和（公比 α/β）：= βk·1 − (α/β)k+11 − α/β = βk+1 − αk+1β − α所以（k ≥ 0，乘 u[k]）：y[k] = βk+1 − αk+1β − αu[k]当 α = β 时，用洛必达或直接求和得 y[k] = (k+1)αku[k]","和连续对照记：连续是 (eβt−eαt)/(β−α)，离散是 (βk+1−αk+1)/(β−α)","注意离散的指数多了一个 “+1”，这是最容易抄错的地方"]},{"ch":3,"no":"例3-9","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">u[k] ∗ u[k]\u003c/span> 和 \u003cspan class=\"eq\">u[k] ∗ u[k−3]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>直接套公式（\u003cspan class=\"eq\">α=β=1\u003c/span> 的退化情形）：\u003cspan class=\"eq\">u[k] ∗ u[k] = (k+1)u[k]\u003c/span>。\u003c/p>\u003cp>第二问利用时移性质：\u003cspan class=\"eq\">u[k] ∗ u[k−3] = (k−3+1)u[k−3] = (k−2)u[k−3]\u003c/span>。\u003c/p>\u003cp>\u003cb>验证：\u003c/b>k=3 时结果为 1，确实从 k=3 才开始有值 ✓。\u003c/p>","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-9　用性质“偷懒”","tags":["讲义例题"],"needsCheck":false,"steps":["验证："],"title":"例 3-9　用性质“偷懒”","id":"signals-例3-9","points":["直接套公式（α=β=1 的退化情形）：u[k] ∗ u[k] = (k+1)u[k]","第二问利用时移性质：u[k] ∗ u[k−3] = (k−3+1)u[k−3] = (k−2)u[k−3]","验证：k=3 时结果为 1，确实从 k=3 才开始有值 ✓"]},{"ch":3,"no":"例3-10","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">x=[1 2 0 3 2]\u003c/span>，\u003cspan class=\"eq\">kx=−2:2\u003c/span>；\u003cspan class=\"eq\">h=[1 4 2 3]\u003c/span>，\u003cspan class=\"eq\">kh=−1:2\u003c/span>。写出 \u003cspan class=\"eq\">y=conv(x,h)\u003c/span> 对应的下标向量。\u003c/p>","options":[],"answer":"\u003cdiv class=\"formula\">\u003cspan class=\"eq\">k = kx(1)+kh(1) : kx(end)+kh(end) = (−2)+(−1) : 2+2 = −3 : 4\u003c/span>\u003c/div>\u003cp>共 \u003cspan class=\"eq\">5+4−1 = 8\u003c/span> 个点，与 \u003cspan class=\"eq\">−3:4\u003c/span> 的长度 8 一致 ✓。MATLAB 代码：\u003c/p>\u003cdiv class=\"formula\" style=\"text-align:left\">\u003cspan class=\"eq\" style=\"font-family:Consolas,Monaco,monospace;font-size:14px\">y = conv(x,h); k = kx(1)+kh(1) : kx(end)+kh(end); stem(k,y);\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>最常见的错：\u003c/b>直接 \u003cspan class=\"eq\">stem(y)\u003c/span>，把起点当 1 画，整张图横坐标全错。\u003cb>conv 只给数值，不给下标，必须自己补。\u003c/b>","answerKey":"","why":"","source":"讲义第 3 章 · 例 3-10　带负下标的卷积（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 3-10　带负下标的卷积（课件原题）","id":"signals-例3-10","points":["k = kx(1)+kh(1) : kx(end)+kh(end) = (−2)+(−1) : 2+2 = −3 : 4共 5+4−1 = 8 个点，与 −3:4 的长度 8 一致 ✓","MATLAB 代码：y = conv(x,h)","k = kx(1)+kh(1) : kx(end)+kh(end)","stem(k,y)"]},{"ch":3,"no":"B-3","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">y[k] − 0.5y[k−1] = x[k]\u003c/span>，\u003cspan class=\"eq\">y[−1] = 1\u003c/span>，\u003cspan class=\"eq\">x[k] = u[k]\u003c/span>。求全响应 \u003cspan class=\"eq\">y[k]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>① 零输入响应（4 分）。\u003c/b>特征根 \u003cspan class=\"eq\">s = 0.5\u003c/span>，设 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> = C(0.5)\u003csup>k\u003c/sup>\u003c/span>。由 \u003cspan class=\"eq\">y[−1] = 1\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C(0.5)\u003csup>−1\u003c/sup> = 2C = 1 ⟹ C = 0.5\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>[k] = 0.5(0.5)\u003csup>k\u003c/sup> = (0.5)\u003csup>k+1\u003c/sup>，k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>② 冲激响应（3 分）。\u003c/b>由 \u003cspan class=\"eq\">h[k] − 0.5h[k−1] = δ[k]\u003c/span>，得 \u003cspan class=\"eq\">h[0]=1\u003c/span>，故：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h[k] = (0.5)\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/div>\u003cp>\u003cb>③ 零状态响应（3 分）。\u003c/b>用等比数列求和：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>[k] = \u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">k\u003c/span>\u003cspan class=\"l\">n=0\u003c/span>\u003c/span>\u003c/span>(0.5)\u003csup>n\u003c/sup> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − (0.5)\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 − 0.5\u003c/span>\u003c/span> = 2 − (0.5)\u003csup>k\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>④ 相加（2 分）。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = (0.5)\u003csup>k+1\u003c/sup> + 2 − (0.5)\u003csup>k\u003c/sup> = 2 − (0.5)\u003csup>k+1\u003c/sup>，k ≥ 0\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y[0] = 1.5\u003c/span>、\u003cspan class=\"eq\">y[1] = 1.75\u003c/span>、\u003cspan class=\"eq\">y[2] = 1.875\u003c/span>，与例 3-1 的迭代结果完全一致 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>最易混淆的一点：\u003c/b>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k] ∗ a\u003csup>k\u003c/sup>u[k] = (k+1)a\u003csup>k\u003c/sup>u[k]\u003c/span>，但 \u003cspan class=\"eq\">u[k] ∗ a\u003csup>k\u003c/sup>u[k] = (1−a\u003csup>k+1\u003c/sup>)/(1−a)\u003c/span>。\u003cb>前者是两个指数序列相卷，后者是阶跃与指数相卷\u003c/b>，公式完全不同。记混了就会像上面那样，k=1 时算出 1.25 而不是 1.75。","answerKey":"","why":"","source":"自测卷 B · 3","tags":["自测卷 B","离散系统全响应（12 分）"],"needsCheck":false,"title":"离散系统全响应（12 分）","id":"signals-B-3","points":["① 零输入响应（4 分）。","② 冲激响应（3 分）。","③ 零状态响应（3 分）。","④ 相加（2 分）。","验算："]},{"ch":3,"kind":"fill","group":"objective","stem":"两个长度分别为 N₁、N₂ 的序列做卷积和，结果长度为 ______。","options":[],"answer":"N₁+N₂−1","answerKey":"","accept":[["N1+N2−1","N₁+N₂−1","N1+N2-1"]],"why":"卷积长度等于两序列长度之和减 1，可用来快速自查。","source":"讲义提炼 · 第 3 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-13","id":"sig-extra-13"},{"ch":3,"kind":"fill","group":"objective","stem":"a\u003csup>k\u003c/sup>u[k] ∗ a\u003csup>k\u003c/sup>u[k] = ______。","options":[],"answer":"(k+1)a\u003csup>k\u003c/sup>u[k]","answerKey":"","accept":[["(k+1)a^ku[k]","(k+1)aku[k]","(k+1)a^k u[k]","(k+1)aᵏu[k]"]],"why":"与连续 u∗u=t·u(t) 对应；注意别与 u[k]∗a^k u[k] 的等比求和公式混。","source":"讲义提炼 · 第 3 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-14","id":"sig-extra-14"},{"ch":3,"kind":"choice","group":"objective","stem":"系统 y[k]−0.5y[k−1]=x[k] 的单位脉冲响应 h[k] 为（　）。","options":[{"key":"A","html":"(0.5)\u003csup>k\u003c/sup>u[k]"},{"key":"B","html":"2\u003csup>k\u003c/sup>u[k]"},{"key":"C","html":"0.5u[k]"},{"key":"D","html":"δ[k]"}],"answer":"A","answerKey":"A","why":"h[0]=1，递推 h[k]=0.5h[k−1]，得 (0.5)^k u[k]。","source":"讲义提炼 · 第 3 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-33","id":"sig-extra-33"},{"ch":4,"no":"例4-1","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">x(t) = 2e\u003csup>−j2ω₀t\u003c/sup> + 3e\u003csup>−jω₀t\u003c/sup> + 4 + 3e\u003csup>jω₀t\u003c/sup> + 2e\u003csup>j2ω₀t\u003c/sup>\u003c/span>，求其平均功率。\u003c/p>","options":[],"answer":"\u003cp>对照标准形式 \u003cspan class=\"eq\">ΣC\u003csub>n\u003c/sub>e\u003csup>jnω₀t\u003c/sup>\u003c/span>，直接读出系数：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C₀ = 4，　C\u003csub>±1\u003c/sub> = 3，　C\u003csub>±2\u003c/sub> = 2\u003c/span>\u003c/div>\u003cp>用帕塞瓦尔定理（周期信号平均功率 = 各次谐波功率之和）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = Σ|C\u003csub>n\u003c/sub>|² = 2² + 3² + 4² + 3² + 2² = 4 + 9 + 16 + 9 + 4 = 42\u003c/span>\u003c/div>\u003cp>\u003cb>换个角度验证：\u003c/b>把信号写成实数形式 \u003cspan class=\"eq\">x(t) = 4 + 6cos ω₀t + 4cos 2ω₀t\u003c/span>，用“直流平方 + 各余弦功率 A²/2”：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = 4² + ½×6² + ½×4² = 16 + 18 + 8 = 42\u003c/span>\u003c/div>\u003cp>两种方法结果一致 ✓。这说明\u003cb>指数形式和三角形式只是同一件事的两种写法\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考场建议：\u003c/b>看到已经展开成复指数的式子，\u003cb>直接读系数平方求和\u003c/b>，10 秒出答案，不要再去积分。","answerKey":"","why":"","source":"讲义第 4 章 · 例 4-1　由表达式直接读频谱（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["换个角度验证："],"title":"例 4-1　由表达式直接读频谱（课堂原题）","id":"signals-例4-1","points":["对照标准形式 ΣCnejnω₀t，直接读出系数：C₀ = 4，　C±1 = 3，　C±2 = 2用帕塞瓦尔定理（周期信号平均功率 = 各次谐波功率之和）：P = Σ|Cn|² = 2² + 3² + 4² + 3² + 2² = 4 + 9 + 16 + 9 + 4 = 42换个角度验证：把信号写成实数形式 x(t) = 4 + 6cos ω₀t + 4cos 2ω₀t，用“直流平方 + 各余弦功率 A²/2”：P = 4² + ½×6² + ½×4² = 16 + 18 + 8 = 42两种方法结果一致 ✓","这说明指数形式和三角形式只是同一件事的两种写法","考场建议：看到已经展开成复指数的式子，直接读系数平方求和，10 秒出答案，不要再去积分"]},{"ch":4,"no":"例4-2","kind":"short","group":"written","stem":"\u003cp>已知周期信号 \u003cspan class=\"eq\">x(t)\u003c/span> 的系数为 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>。求 \u003cspan class=\"eq\">x(t − T₀/4)\u003c/span> 的系数。\u003c/p>","options":[],"answer":"\u003cp>套时移公式，\u003cspan class=\"eq\">t₀ = T₀/4\u003c/span>，而 \u003cspan class=\"eq\">ω₀T₀ = 2π\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>′ = e\u003csup>−jnω₀T₀/4\u003c/sup>C\u003csub>n\u003c/sub> = e\u003csup>−jnπ/2\u003c/sup>C\u003csub>n\u003c/sub>\u003c/span>\u003c/div>\u003cp>即 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>′ = (−j)\u003csup>n\u003c/sup>C\u003csub>n\u003c/sub>\u003c/span>。\u003c/p>\u003cp>\u003cb>结论：\u003c/b>幅度谱完全不变（\u003cspan class=\"eq\">|C\u003csub>n\u003c/sub>′| = |C\u003csub>n\u003c/sub>|\u003c/span>），只是相位谱多了一个 \u003cspan class=\"eq\">−nπ/2\u003c/span> 的线性项。这就是“时移不改幅度谱”的最好例子。\u003c/p>","answerKey":"","why":"","source":"讲义第 4 章 · 例 4-2　时移性质的用法","tags":["讲义例题"],"needsCheck":false,"steps":["结论："],"title":"例 4-2　时移性质的用法","id":"signals-例4-2","points":["套时移公式，t₀ = T₀/4，而 ω₀T₀ = 2π：Cn′ = e−jnω₀T₀/4Cn = e−jnπ/2Cn即 Cn′ = (−j)nCn","结论：幅度谱完全不变（|Cn′| = |Cn|），只是相位谱多了一个 −nπ/2 的线性项","这就是“时移不改幅度谱”的最好例子"]},{"ch":4,"no":"例4-3","kind":"short","group":"written","stem":"\u003cp>周期矩形脉冲：幅度为 1，脉宽为 \u003cspan class=\"eq\">τ\u003c/span>，周期为 \u003cspan class=\"eq\">T₀\u003c/span>，关于原点对称。求傅里叶系数并画频谱。\u003c/p>","options":[],"answer":"\u003cp>取积分区间 \u003cspan class=\"eq\">[−T₀/2, T₀/2]\u003c/span>，矩形在 \u003cspan class=\"eq\">|t| &lt; τ/2\u003c/span> 内为 1：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">τ/2\u003c/span>\u003cspan class=\"l\">−τ/2\u003c/span>\u003c/span>\u003c/span>e\u003csup>−jnω₀t\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>−jnω₀τ/2\u003c/sup> − e\u003csup>jnω₀τ/2\u003c/sup>\u003c/span>\u003cspan class=\"fd\">−jnω₀\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>用欧拉公式化简（\u003cspan class=\"eq\">sin x = (e\u003csup>jx\u003c/sup>−e\u003csup>−jx\u003c/sup>)/2j\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">τ\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">sin(nω₀τ/2)\u003c/span>\u003cspan class=\"fd\">nω₀τ/2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">τ\u003c/span>\u003cspan class=\"fd\">T₀\u003c/span>\u003c/span>Sa(\u003cspan class=\"fr\">\u003cspan class=\"fn\">nω₀τ\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>)\u003c/span>\u003c/div>\u003cp>\u003cb>三个结论（考试常考简答）：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>包络是 Sa 函数\u003c/b>，过零点在 \u003cspan class=\"eq\">nω₀τ/2 = kπ\u003c/span>，即 \u003cspan class=\"eq\">f = k/τ\u003c/span>。脉宽越窄，第一个零点越远，频谱越“宽”——这就是“时宽带宽反比”。\u003c/li>\u003cli>\u003cb>离散谱\u003c/b>：只在 \u003cspan class=\"eq\">nω₀\u003c/span> 这些离散频点上才有值，间隔为 \u003cspan class=\"eq\">ω₀ = 2π/T₀\u003c/span>。周期越大，谱线越密。\u003c/li>\u003cli>\u003cb>直流分量\u003c/b>\u003cspan class=\"eq\">C₀ = τ/T₀\u003c/span>，正好是脉冲的占空比（平均值）。\u003c/li>\u003c/ul>","answerKey":"","why":"","source":"讲义第 4 章 · 例 4-3　周期矩形脉冲的频谱","tags":["讲义例题"],"needsCheck":false,"steps":["三个结论（考试常考简答）："],"title":"例 4-3　周期矩形脉冲的频谱","id":"signals-例4-3","points":["取积分区间 [−T₀/2, T₀/2]，矩形在 |t| \u003c τ/2 内为 1：Cn = 1T₀∫τ/2−τ/2e−jnω₀tdt = 1T₀·e−jnω₀τ/2 − ejnω₀τ/2−jnω₀用欧拉公式化简（sin x = (ejx−e−jx)/2j）：Cn = τT₀·sin(nω₀τ/2)nω₀τ/2 = τT₀Sa(nω₀τ2)三个结论（考试常考简答）：包络是 Sa 函数，过零点在 nω₀τ/2 = kπ，即 f = k/τ","脉宽越窄，第一个零点越远，频谱越“宽”——这就是“时宽带宽反比”","离散谱：只在 nω₀ 这些离散频点上才有值，间隔为 ω₀ = 2π/T₀","周期越大，谱线越密"]},{"ch":4,"no":"例4-4","kind":"short","group":"written","stem":"\u003cp>周期为 \u003cspan class=\"eq\">T₀\u003c/span> 的方波：前半周期为 +1，后半周期为 −1。求 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>，并写出前三次谐波。\u003c/p>","options":[],"answer":"\u003cp>分两段积分（或用“奇函数只有正弦项”的对称性）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − (−1)\u003csup>n\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jπn\u003c/span>\u003c/span> = \u003cspan style=\"display:inline-block;text-align:left\">−j\u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">nπ\u003c/span>\u003c/span>（n 为奇数）\u003cbr>0（n 为偶数）\u003c/span>\u003c/span>\u003c/div>\u003cp>所以方波只含\u003cb>奇次谐波\u003c/b>，且幅度按 \u003cspan class=\"eq\">1/n\u003c/span> 衰减：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">π\u003c/span>\u003c/span>sin ω₀t + \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">3π\u003c/span>\u003c/span>sin 3ω₀t + \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">5π\u003c/span>\u003c/span>sin 5ω₀t + …\u003c/span>\u003c/div>\u003cp>\u003cb>为什么偶次谐波为 0？\u003c/b>因为方波有“半波对称性”：\u003cspan class=\"eq\">x(t + T₀/2) = −x(t)\u003c/span>。这种信号平移半个周期就反号，数学上导致偶数项全部抵消。\u003c/p>\u003cdiv class=\"tip\">\u003cb>记结论：\u003c/b>方波的谱线幅度 \u003cspan class=\"eq\">∝ 1/n\u003c/span>，收敛很慢，所以用有限项逼近时会有明显的过冲——这就是下一节的吉布斯现象。","answerKey":"","why":"","source":"讲义第 4 章 · 例 4-4　对称方波的频谱","tags":["讲义例题"],"needsCheck":false,"steps":["为什么偶次谐波为 0？"],"title":"例 4-4　对称方波的频谱","id":"signals-例4-4","points":["分两段积分（或用“奇函数只有正弦项”的对称性）：Cn = 1 − (−1)njπn = −j2nπ（n 为奇数）\n0（n 为偶数）所以方波只含奇次谐波，且幅度按 1/n 衰减：x(t) = 4πsin ω₀t + 43πsin 3ω₀t + 45πsin 5ω₀t + …为什么偶次谐波为 0？因为方波有“半波对称性”：x(t + T₀/2) = −x(t)","这种信号平移半个周期就反号，数学上导致偶数项全部抵消","记结论：方波的谱线幅度 ∝ 1/n，收敛很慢，所以用有限项逼近时会有明显的过冲——这就是下一节的吉布斯现象"]},{"ch":4,"no":"B-4","kind":"short","group":"written","stem":"\u003cp>周期 \u003cspan class=\"eq\">T₀ = 2\u003c/span> 的方波：\u003cspan class=\"eq\">0 &lt; t &lt; 1\u003c/span> 时为 1，\u003cspan class=\"eq\">1 &lt; t &lt; 2\u003c/span> 时为 0。求：(1) 傅里叶系数 \u003cspan class=\"eq\">C\u003csub>n\u003c/sub>\u003c/span>；(2) 前三次谐波表达式；(3) 平均功率。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>(1) 求系数（7 分）。\u003c/b>\u003cspan class=\"eq\">ω₀ = 2π/T₀ = π\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">1\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−jnπt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − e\u003csup>−jnπ\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jnπ\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cul>\u003cli>\u003cspan class=\"eq\">n = 0\u003c/span>：\u003cspan class=\"eq\">C₀ = ½\u003c/span>（占空比，也就是平均值）；\u003c/li>\u003cli>\u003cspan class=\"eq\">n\u003c/span> 为偶数：\u003cspan class=\"eq\">e\u003csup>−jnπ\u003c/sup> = 1\u003c/span>，\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = 0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">n\u003c/span> 为奇数：\u003cspan class=\"eq\">e\u003csup>−jnπ\u003c/sup> = −1\u003c/span>，\u003cspan class=\"eq\">C\u003csub>n\u003c/sub> = 1/(jnπ) = −j/(nπ)\u003c/span>。\u003c/li>\u003c/ul>\u003cp>\u003cb>(2) 前三次谐波（5 分）。\u003c/b>把共轭对合成实信号：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">C\u003csub>n\u003c/sub>e\u003csup>jnπt\u003c/sup> + C\u003csub>−n\u003c/sub>e\u003csup>−jnπt\u003c/sup> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">nπ\u003c/span>\u003c/span>sin(nπt)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">π\u003c/span>\u003c/span>sin πt + \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">3π\u003c/span>\u003c/span>sin 3πt + \u003cspan class=\"fr\">\u003cspan class=\"fn\">2\u003c/span>\u003cspan class=\"fd\">5π\u003c/span>\u003c/span>sin 5πt + …\u003c/span>\u003c/div>\u003cp>幅度按 \u003cspan class=\"eq\">1/n\u003c/span> 衰减，只有奇次项——这是“半波对称”信号的典型特征。\u003c/p>\u003cp>\u003cb>(3) 平均功率（3 分）。\u003c/b>用帕塞瓦尔：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = Σ|C\u003csub>n\u003c/sub>|² = (½)² + 2Σ\u003csub>n 奇\u003c/sub>\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">n²π²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>而 \u003cspan class=\"eq\">Σ\u003csub>n 奇\u003c/sub>1/n² = π²/8\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = ¼ + 2·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">π²\u003c/span>\u003c/span>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">π²\u003c/span>\u003cspan class=\"fd\">8\u003c/span>\u003c/span> = ¼ + ¼ = ½\u003c/span>\u003c/div>\u003cp>\u003cb>时域验证：\u003c/b>方波一半时间为 1、一半为 0，平均功率 = \u003cspan class=\"eq\">(1²×1 + 0²×1)/2 = ½\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>结论：\u003c/b>占空比 50% 的 0/1 方波，平均功率恒为 ½，与周期无关。这个结论可以直接用来检查答案。","answerKey":"","why":"","source":"自测卷 B · 4","tags":["自测卷 B","周期方波的频谱（15 分）"],"needsCheck":false,"title":"周期方波的频谱（15 分）","id":"signals-B-4","points":["(1) 求系数（7 分）。","(2) 前三次谐波（5 分）。","(3) 平均功率（3 分）。","时域验证："]},{"ch":4,"kind":"fill","group":"objective","stem":"周期为 T₀ 的信号，指数形式傅里叶系数 C\u003csub>n\u003c/sub> = ______。","options":[],"answer":"(1/T₀)∫\u003csub>T₀\u003c/sub> x(t)e\u003csup>−jnω₀t\u003c/sup>dt","answerKey":"","accept":[["(1/T₀)∫x(t)e^(−jnω₀t)dt","(1/T0)∫x(t)e^(-jnω0t)dt","(1/T₀)∫T₀x(t)e^(−jnω₀t)dt"]],"why":"一个周期内积分再除以 T₀；ω₀=2π/T₀。","source":"讲义提炼 · 第 4 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-15","id":"sig-extra-15"},{"ch":4,"kind":"fill","group":"objective","stem":"帕塞瓦尔定理：周期信号平均功率 P = ______。","options":[],"answer":"Σ|C\u003csub>n\u003c/sub>|²","answerKey":"","accept":[["Σ|Cn|²","Σ|C_n|²","Σ|Cn|^2","sum|Cn|²"]],"why":"时域平均功率等于各次谐波功率之和，用来验算频谱题。","source":"讲义提炼 · 第 4 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-16","id":"sig-extra-16"},{"ch":4,"kind":"choice","group":"objective","stem":"幅度为 0/1、占空比 50% 的周期方波，其平均功率为（　）。","options":[{"key":"A","html":"¼"},{"key":"B","html":"½"},{"key":"C","html":"1"},{"key":"D","html":"0"}],"answer":"B","answerKey":"B","why":"一半时间为 1、一半为 0，均方值 = (1²×1+0²×1)/2 = ½，与周期无关。","source":"讲义提炼 · 第 4 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-34","id":"sig-extra-34"},{"ch":5,"no":"例5-1","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">f(t) = 1（0 &lt; t &lt; 4），其他为 0\u003c/span> 的频谱函数。\u003c/p>","options":[],"answer":"\u003cp>直接积分：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">F(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">4\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − e\u003csup>−j4ω\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>关键一步：提出“半宽延迟”因子\u003c/b>，把分子化成正弦。上下同乘 \u003cspan class=\"eq\">e\u003csup>−j2ω\u003c/sup>\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= e\u003csup>−j2ω\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>j2ω\u003c/sup> − e\u003csup>−j2ω\u003c/sup>\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span> = e\u003csup>−j2ω\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">2j sin 2ω\u003c/span>\u003cspan class=\"fd\">jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= 4·\u003cspan class=\"fr\">\u003cspan class=\"fn\">sin 2ω\u003c/span>\u003cspan class=\"fd\">2ω\u003c/span>\u003c/span>·e\u003csup>−j2ω\u003c/sup> = 4Sa(2ω)e\u003csup>−j2ω\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>怎么读这个结果：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cb>幅度谱\u003c/b>\u003cspan class=\"eq\">|F| = 4|Sa(2ω)|\u003c/span>：Sa 形包络，第一个零点在 \u003cspan class=\"eq\">2ω = π\u003c/span>，即 \u003cspan class=\"eq\">ω = π/2\u003c/span>；\u003c/li>\u003cli>\u003cb>相位谱\u003c/b>\u003cspan class=\"eq\">−2ω\u003c/span>：线性相位，来自“脉冲中心在 t=2”这个延迟；\u003c/li>\u003cli>若把脉冲平移到关于原点对称，则 \u003cspan class=\"eq\">F = 4Sa(2ω)\u003c/span>，是纯实数，没有相位。\u003c/li>\u003c/ul>\u003cdiv class=\"tip\">\u003cb>通用结论：\u003c/b>宽 \u003cspan class=\"eq\">τ\u003c/span>、高 1 的矩形脉冲，频谱是 \u003cspan class=\"eq\">τSa(ωτ/2)\u003c/span>，相位由“中心位置”决定。\u003cb>时域越窄，频域越宽\u003c/b>，这是后面抽样定理的伏笔。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-1　矩形脉冲的频谱（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["关键一步：提出“半宽延迟”因子","怎么读这个结果："],"title":"例 5-1　矩形脉冲的频谱（课堂原题）","id":"signals-例5-1","points":["关键一步：提出“半宽延迟”因子","怎么读这个结果："]},{"ch":5,"no":"例5-2","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">sgn(t) ⟷ 2/(jω)\u003c/span>，求 \u003cspan class=\"eq\">2/(jt)\u003c/span> 的傅里叶变换。\u003c/p>","options":[],"answer":"\u003cp>对称性公式：若 \u003cspan class=\"eq\">x(t) ⟷ X(jω)\u003c/span>，则 \u003cspan class=\"eq\">X(jt) ⟷ 2πx(−ω)\u003c/span>。\u003c/p>\u003cp>这里 \u003cspan class=\"eq\">X(jω) = 2/(jω)\u003c/span>，把 \u003cspan class=\"eq\">ω\u003c/span> 换成 \u003cspan class=\"eq\">t\u003c/span> 得 \u003cspan class=\"eq\">X(jt) = 2/(jt)\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">2/(jt) ⟷ 2π·sgn(−ω) = −2π sgn(ω)\u003c/span>\u003c/div>\u003cp>\u003cb>怎么理解这个“反着来”：\u003c/b>原信号在时域是奇函数，频谱是奇函数；把频谱的形状搬到时域后，新频谱就变成原时域信号“翻转”后的样子。\u003cb>对称性就是“时域和频域可以互换角色”\u003c/b>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>常用推论：\u003c/b>由 \u003cspan class=\"eq\">δ(t)⟷1\u003c/span> 得 \u003cspan class=\"eq\">1⟷2πδ(ω)\u003c/span>；由 \u003cspan class=\"eq\">矩形⟷Sa\u003c/span> 得 \u003cspan class=\"eq\">Sa⟷矩形\u003c/span>。很多“新变换对”都是这么白捡的。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-2　互易对称性（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["怎么理解这个“反着来”："],"title":"例 5-2　互易对称性（课堂原题）","id":"signals-例5-2","points":["对称性公式：若 x(t) ⟷ X(jω)，则 X(jt) ⟷ 2πx(−ω)","这里 X(jω) = 2/(jω)，把 ω 换成 t 得 X(jt) = 2/(jt)，所以：2/(jt) ⟷ 2π·sgn(−ω) = −2π sgn(ω)怎么理解这个“反着来”：原信号在时域是奇函数，频谱是奇函数","把频谱的形状搬到时域后，新频谱就变成原时域信号“翻转”后的样子","对称性就是“时域和频域可以互换角色”"]},{"ch":5,"no":"例5-3","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">x(t)cos ω₀t\u003c/span> 的频谱，并说明物理意义。\u003c/p>","options":[],"answer":"\u003cp>先用欧拉公式拆开：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t)cos ω₀t = ½x(t)e\u003csup>jω₀t\u003c/sup> + ½x(t)e\u003csup>−jω₀t\u003c/sup>\u003c/span>\u003c/div>\u003cp>再用频移性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">⟷ ½X(j(ω − ω₀)) + ½X(j(ω + ω₀))\u003c/span>\u003c/div>\u003cp>\u003cb>物理意义：\u003c/b>把原频谱\u003cb>一分为二\u003c/b>，分别搬到 \u003cspan class=\"eq\">±ω₀\u003c/span> 处，幅度减半。\u003cb>这就是“调制”\u003c/b>——把低频信号（语音、音乐）“骑”到高频载波上，才能通过天线发射出去。收音机调台，本质上就是用不同 \u003cspan class=\"eq\">ω₀\u003c/span> 把不同电台的频谱搬到不同位置。\u003c/p>\u003cdiv class=\"note\">\u003cb>反过来就是“解调”：\u003c/b>收到信号后再乘一次 \u003cspan class=\"eq\">cos ω₀t\u003c/span>，频谱会再搬一次，其中一份回到原点（基带），用低通滤波器滤出来就还原了。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-3　调制（频移）性质（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["物理意义："],"title":"例 5-3　调制（频移）性质（课堂原题）","id":"signals-例5-3","points":["先用欧拉公式拆开：x(t)cos ω₀t = ½x(t)ejω₀t + ½x(t)e−jω₀t再用频移性质：⟷ ½X(j(ω − ω₀)) + ½X(j(ω + ω₀))物理意义：把原频谱一分为二，分别搬到 ±ω₀ 处，幅度减半","这就是“调制”——把低频信号（语音、音乐）“骑”到高频载波上，才能通过天线发射出去","收音机调台，本质上就是用不同 ω₀ 把不同电台的频谱搬到不同位置","反过来就是“解调”：收到信号后再乘一次 cos ω₀t，频谱会再搬一次，其中一份回到原点（基带），用低通滤波器滤出来就还原了"]},{"ch":5,"no":"例5-4","kind":"short","group":"written","stem":"\u003cp>对比 \u003cspan class=\"eq\">δ(t)⟷1\u003c/span> 与 \u003cspan class=\"eq\">1⟷2πδ(ω)\u003c/span>，说明时域宽度与频域带宽的关系。\u003c/p>","options":[],"answer":"\u003cp>\u003cspan class=\"eq\">δ(t)\u003c/span>：时域宽度 → 0，频谱是常数 1，带宽 → ∞。\u003cbr>\u003cspan class=\"eq\">1\u003c/span>：时域宽度 → ∞，频谱是 \u003cspan class=\"eq\">δ(ω)\u003c/span>，带宽 → 0。\u003c/p>\u003cp>再看矩形脉冲：脉宽 \u003cspan class=\"eq\">τ\u003c/span> 越小，\u003cspan class=\"eq\">Sa(ωτ/2)\u003c/span> 的第一个零点 \u003cspan class=\"eq\">2π/τ\u003c/span> 越远，主瓣越宽。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">τ·B ≈ 常数　（时宽 × 带宽 ≈ 定值）\u003c/span>\u003c/div>\u003cp>\u003cb>结论：\u003c/b>信号在时间上越“窄”，在频率上就越“宽”，两者不可能同时无限小。这就是著名的\u003cb>不确定性原理\u003c/b>在信号领域的版本。\u003c/p>\u003cdiv class=\"tip\">\u003cb>工程意义：\u003c/b>想传得更快（脉冲更窄），就必然占用更宽的频带；想省带宽（脉冲更宽），速度就上不去。5G 比 4G 快，代价就是带宽更宽。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-4　时宽与带宽","tags":["讲义例题"],"needsCheck":false,"steps":["结论："],"title":"例 5-4　时宽与带宽","id":"signals-例5-4","points":["δ(t)：时域宽度 → 0，频谱是常数 1，带宽 → ∞","1：时域宽度 → ∞，频谱是 δ(ω)，带宽 → 0","再看矩形脉冲：脉宽 τ 越小，Sa(ωτ/2) 的第一个零点 2π/τ 越远，主瓣越宽","τ·B ≈ 常数　（时宽 × 带宽 ≈ 定值）结论：信号在时间上越“窄”，在频率上就越“宽”，两者不可能同时无限小"]},{"ch":5,"no":"例5-5","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">f(t) = Sa²(100πt) + Sa(50πt)\u003c/span>，若对 \u003cspan class=\"eq\">f(t)\u003c/span> 抽样，求奈奎斯特抽样频率 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>关键：先分别求每一项的最高频率。\u003c/b>记住 \u003cspan class=\"eq\">Sa(ω\u003csub>c\u003c/sub>t)\u003c/span> 的频谱是矩形，带宽为 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>\u003c/span>（单边），即 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = ω\u003csub>c\u003c/sub>/(2π)\u003c/span>。\u003c/p>\u003cp>\u003cb>第一项 \u003cspan class=\"eq\">Sa(100πt)\u003c/span>：\u003c/b>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> = 100π\u003c/span>，所以 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = 100π/(2π) = 50\u003c/span> Hz。\u003c/p>\u003cp>\u003cb>但它是平方！\u003c/b>时域平方 = 频域卷积，两个宽 \u003cspan class=\"eq\">100π\u003c/span> 的矩形卷积，宽度变成 \u003cspan class=\"eq\">200π\u003c/span>，所以：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Sa²(100πt) 的最高频率 = \u003cspan class=\"fr\">\u003cspan class=\"fn\">200π\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span> = 100 Hz\u003c/span>\u003c/div>\u003cp>\u003cb>第二项 \u003cspan class=\"eq\">Sa(50πt)\u003c/span>：\u003c/b>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> = 50π\u003c/span>，\u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = 25\u003c/span> Hz。\u003c/p>\u003cp>整个信号取最高者：\u003cspan class=\"eq\">f\u003csub>max\u003c/sub> = max(100, 25) = 100\u003c/span> Hz。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>max\u003c/sub> = 200 Hz\u003c/span>\u003c/div>\u003cp>\u003cb>答案：200 Hz。\u003c/b>\u003c/p>\u003cdiv class=\"warn\">\u003cb>三个坑：\u003c/b>① 忘了平方会让带宽翻倍，直接取 50 Hz；② 把 \u003cspan class=\"eq\">100π\u003c/span> 当成 100 Hz（忘了除以 2π）；③ 两项相加时把频率也相加（应该是取最大值，不是求和）。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-5　求奈奎斯特抽样频率（课堂原题）","tags":["讲义例题"],"needsCheck":false,"steps":["关键：先分别求每一项的最高频率。","但它是平方！","答案：200 Hz。"],"title":"例 5-5　求奈奎斯特抽样频率（课堂原题）","id":"signals-例5-5","points":["关键：先分别求每一项的最高频率。","但它是平方！"]},{"ch":5,"no":"例5-6","kind":"short","group":"written","stem":"\u003cp>信号 \u003cspan class=\"eq\">x(t) = cos(400πt) + Sa(200πt)\u003c/span>，若以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub> = 300\u003c/span> Hz 抽样，会不会发生混叠？\u003c/p>","options":[],"answer":"\u003cp>\u003cb>先求最高频率：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">cos(400πt)\u003c/span>：\u003cspan class=\"eq\">ω₀ = 400π → f = 200\u003c/span> Hz；\u003c/li>\u003cli>\u003cspan class=\"eq\">Sa(200πt)\u003c/span>：\u003cspan class=\"eq\">f\u003csub>m\u003c/sub> = 100\u003c/span> Hz。\u003c/li>\u003c/ul>\u003cp>所以 \u003cspan class=\"eq\">f\u003csub>max\u003c/sub> = 200\u003c/span> Hz，需要的抽样率至少 \u003cspan class=\"eq\">400\u003c/span> Hz。\u003c/p>\u003cp>实际只用了 300 Hz &lt; 400 Hz，\u003cb>会发生混叠\u003c/b>。\u003c/p>\u003cp>\u003cb>混叠后变成什么？\u003c/b>200 Hz 的成分会被“折叠”到 \u003cspan class=\"eq\">|300 − 200| = 100\u003c/span> Hz 处，和原本 100 Hz 的成分叠在一起，再也分不开——听起来就是“失真”或“刺耳”的杂音。\u003c/p>\u003cdiv class=\"tip\">\u003cb>工程做法：\u003c/b>抽样前先加一个\u003cb>抗混叠低通滤波器\u003c/b>，把 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>/2\u003c/span> 以上的成分滤掉，从源头上杜绝混叠。这也是为什么实际采样率通常取 \u003cspan class=\"eq\">2.5～5\u003c/span> 倍，而不是刚好 2 倍。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-6　判断是否混叠","tags":["讲义例题"],"needsCheck":false,"steps":["先求最高频率：","混叠后变成什么？"],"title":"例 5-6　判断是否混叠","id":"signals-例5-6","points":["先求最高频率：","混叠后变成什么？"]},{"ch":5,"no":"例5-7","kind":"short","group":"written","stem":"\u003cp>实信号 \u003cspan class=\"eq\">x(t)\u003c/span> 最高频率 \u003cspan class=\"eq\">f\u003csub>m\u003c/sub>\u003c/span> Hz，求对 \u003cspan class=\"eq\">x(2t)\u003c/span>、\u003cspan class=\"eq\">x(t)∗x(2t)\u003c/span>、\u003cspan class=\"eq\">x(t)·x(2t)\u003c/span> 抽样不混叠的最小抽样频率。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>先求三个信号各自的最高频率：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">x(2t)\u003c/span>：时域压缩 2 倍 → 频域展宽 2 倍，\u003cspan class=\"eq\">f\u003csub>max\u003c/sub>=2f\u003csub>m\u003c/sub>\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">x(t)∗x(2t)\u003c/span>：时域卷积 → \u003cb>频域相乘\u003c/b>，\u003cspan class=\"eq\">X(jω)·X(jω/2)/2\u003c/span>，两者同时非零的区间取\u003cb>较窄\u003c/b>的那个，故 \u003cspan class=\"eq\">f\u003csub>max\u003c/sub>=f\u003csub>m\u003c/sub>\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">x(t)·x(2t)\u003c/span>：时域相乘 → \u003cb>频域卷积\u003c/b>，带宽\u003cb>相加\u003c/b>：\u003cspan class=\"eq\">f\u003csub>m\u003c/sub> + 2f\u003csub>m\u003c/sub> = 3f\u003csub>m\u003c/sub>\u003c/span>。\u003c/li>\u003c/ul>\u003cp>再乘 2（奈奎斯特速率）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(2t)：4f\u003csub>m\u003c/sub>；　x(t)∗x(2t)：2f\u003csub>m\u003c/sub>；　x(t)·x(2t)：6f\u003csub>m\u003c/sub>\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>口诀：\u003c/b>「\u003cb>时域相乘，带宽相加；时域卷积，带宽取小\u003c/b>」。再配上尺度变换（压缩 a 倍 → 带宽 × a），这类题 30 秒可解。课件 L14 p27 的标准答案就是 4、2、6 倍。","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-7　三种运算后的最高频率（课件原题，易错）","tags":["讲义例题"],"needsCheck":false,"steps":["先求三个信号各自的最高频率："],"title":"例 5-7　三种运算后的最高频率（课件原题，易错）","id":"signals-例5-7","points":["先求三个信号各自的最高频率：x(2t)：时域压缩 2 倍 → 频域展宽 2 倍，fmax=2fm","x(t)∗x(2t)：时域卷积 → 频域相乘，X(jω)·X(jω/2)/2，两者同时非零的区间取较窄的那个，故 fmax=fm","x(t)·x(2t)：时域相乘 → 频域卷积，带宽相加：fm + 2fm = 3fm","再乘 2（奈奎斯特速率）：x(2t)：4fm"]},{"ch":5,"no":"例5-8","kind":"short","group":"written","stem":"\u003cp>计算 \u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>Sa²(t)dt\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>硬积很难，用能量定理秒杀。\u003c/b>已知 \u003cspan class=\"eq\">Sa(t) ⟷ π·p\u003csub>2\u003c/sub>(ω)\u003c/span>（宽 2、高 π 的矩形频谱，即 \u003cspan class=\"eq\">|ω|&lt;1\u003c/span> 内为 π）。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">E = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>|X(jω)|²dω = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span>·π²·2 = π\u003c/span>\u003c/div>\u003cp>\u003cb>答案：\u003cspan class=\"eq\">π\u003c/span>。\u003c/b>这类「求 ∫Sa²、∫Sa⁴」的题，正面积分几乎算不动，转成频域矩形面积一下子就出来了。\u003c/p>","answerKey":"","why":"","source":"讲义第 5 章 · 例 5-8　用 Parseval 求积分（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["硬积很难，用能量定理秒杀。"],"title":"例 5-8　用 Parseval 求积分（课件原题）","id":"signals-例5-8","points":["硬积很难，用能量定理秒杀","已知 Sa(t) ⟷ π·p2(ω)（宽 2、高 π 的矩形频谱，即 |ω|\u003c1 内为 π）","E = 12π∫∞−∞|X(jω)|²dω = 12π·π²·2 = π答案：π","这类「求 ∫Sa²、∫Sa⁴」的题，正面积分几乎算不动，转成频域矩形面积一下子就出来了"]},{"ch":5,"no":"B-5","kind":"short","group":"written","stem":"\u003cp>求下列信号的傅里叶变换：(1) \u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup>u(t)\u003c/span>；(2) \u003cspan class=\"eq\">e\u003csup>−2|t|\u003c/sup>\u003c/span>；(3) \u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup>u(t) · cos 3t\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>(1)（3 分）\u003c/b>直接积分：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X₁(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>(2)（4 分）\u003c/b>拆成左右两半，或用偶函数性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X₂(jω) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">0\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>e\u003csup>2t\u003c/sup>e\u003csup>−jωt\u003c/sup>dt + \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup>e\u003csup>−jωt\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2−jω\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2+jω\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">4 + ω²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>是实偶函数，相位为 0。\u003c/p>\u003cp>\u003cb>(3)（5 分）\u003c/b>用调制性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X₃(jω) = ½[X₁(j(ω−3)) + X₁(j(ω+3))]\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">= \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>[\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + j(ω−3)\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + j(ω+3)\u003c/span>\u003c/span>]\u003c/span>\u003c/div>\u003cp>\u003cb>对比记忆：\u003c/b>(1) 是“单边”指数，频谱是复数、相位非零；(2) 是“双边”偶对称指数，频谱是实数、相位为零。\u003cb>时域的对称性，直接决定了频域是实还是复。\u003c/b>\u003c/p>","answerKey":"","why":"","source":"自测卷 B · 5","tags":["自测卷 B","傅里叶变换计算（12 分）"],"needsCheck":false,"title":"傅里叶变换计算（12 分）","id":"signals-B-5","points":["(1)（3 分）","(2)（4 分）","(3)（5 分）","对比记忆："]},{"ch":5,"no":"题-3","kind":"short","group":"written","stem":"\u003cp>连续信号最高频率 \u003cspan class=\"eq\">f\u003csub>max\u003c/sub>=3 kHz\u003c/span>，以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>=5 kHz\u003c/span> 抽样。正频率轴上发生混叠的频率范围是？\u003c/p>","options":[],"answer":"\u003cp>抽样后频谱以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>=5 kHz\u003c/span> 为周期复制，原频谱副本的中心在 5 kHz，占据 \u003cspan class=\"eq\">2 ~ 8 kHz\u003c/span>。它与原信号频谱 \u003cspan class=\"eq\">0 ~ 3 kHz\u003c/span> 的重叠区间为：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">[f\u003csub>s\u003c/sub> − f\u003csub>max\u003c/sub>, f\u003csub>max\u003c/sub>] = [5 − 3, 3] = [2, 3] kHz\u003c/span>\u003c/div>\u003cp>\u003cb>答案：2～3 kHz\u003c/b>（课件选项 B）。\u003c/p>\u003cp>\u003cb>通用公式：\u003c/b>混叠区间是 \u003cspan class=\"eq\">[f\u003csub>s\u003c/sub>−f\u003csub>max\u003c/sub>, f\u003csub>max\u003c/sub>]\u003c/span>，只有当 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub> ≥ 2f\u003csub>max\u003c/sub>\u003c/span> 时这个区间才为空（不混叠）。\u003c/p>","answerKey":"","why":"","source":"课件复习题精选 · 3","tags":["课件复习题精选","抽样与混叠判断（L15 复习题）"],"needsCheck":false,"title":"抽样与混叠判断（L15 复习题）","id":"signals-题-3","points":["抽样后频谱以 fs=5 kHz 为周期复制，原频谱副本的中心在 5 kHz，占据 2 ~ 8 kHz","它与原信号频谱 0 ~ 3 kHz 的重叠区间为：[fs − fmax, fmax] = [5 − 3, 3] = [2, 3] kHz答案：2～3 kHz（课件选项 B）","通用公式：混叠区间是 [fs−fmax, fmax]，只有当 fs ≥ 2fmax 时这个区间才为空（不混叠）"]},{"ch":5,"no":"题-4","kind":"short","group":"written","stem":"\u003cp>时长 \u003cspan class=\"eq\">T₀=0.1 s\u003c/span> 的信号以 \u003cspan class=\"eq\">f\u003csub>s\u003c/sub>=1000 Hz\u003c/span> 采样，做 \u003cspan class=\"eq\">N=100\u003c/span> 点 DFT，再补零到 1000 点。下列说法正确的是？\u003c/p>","options":[],"answer":"\u003cp>\u003cb>正确：补零只减小栅栏效应，物理频率分辨率仍约为 10 Hz。\u003c/b>\u003c/p>\u003cp>物理分辨率由\u003cb>有效数据时长\u003c/b>决定：\u003cspan class=\"eq\">Δf = 1/T₀ = 1/0.1 = 10\u003c/span> Hz。补零只是把频谱曲线画得更密（频点间隔从 10 Hz 变成 1 Hz），并没有增加任何新信息，两个相距 5 Hz 的谱峰仍然分不开。\u003c/p>\u003cdiv class=\"tip\">\u003cb>一句话：\u003c/b>「\u003cb>补零让谱线变密，不让它变清\u003c/b>」。想要真正提高分辨率，只能延长采样时间。","answerKey":"","why":"","source":"课件复习题精选 · 4","tags":["课件复习题精选","补零与频率分辨率（L15 复习题）"],"needsCheck":false,"title":"补零与频率分辨率（L15 复习题）","id":"signals-题-4","points":["正确：补零只减小栅栏效应，物理频率分辨率仍约为 10 Hz","物理分辨率由有效数据时长决定：Δf = 1/T₀ = 1/0.1 = 10 Hz","补零只是把频谱曲线画得更密（频点间隔从 10 Hz 变成 1 Hz），并没有增加任何新信息，两个相距 5 Hz 的谱峰仍然分不开","一句话：「补零让谱线变密，不让它变清」"]},{"ch":5,"kind":"fill","group":"objective","stem":"F[1] = ______。","options":[],"answer":"2πδ(ω)","answerKey":"","accept":[["2πδ(ω)","2πδ(w)","2piδ(ω)"]],"why":"直流只在 ω=0 处有冲激，强度 2π；与 F[δ(t)]=1 成对记。","source":"讲义提炼 · 第 5 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-17","id":"sig-extra-17"},{"ch":5,"kind":"fill","group":"objective","stem":"F[δ(t)] = ______。","options":[],"answer":"1","answerKey":"","accept":[["1"]],"why":"冲激包含所有频率且等幅，所以频谱恒为 1。","source":"讲义提炼 · 第 5 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-18","id":"sig-extra-18"},{"ch":5,"kind":"fill","group":"objective","stem":"F[cos ω₀t] = ______。","options":[],"answer":"π[δ(ω−ω₀)+δ(ω+ω₀)]","answerKey":"","accept":[["π[δ(ω−ω₀)+δ(ω+ω₀)]","π(δ(ω−ω0)+δ(ω+ω0))","π[δ(ω-ω0)+δ(ω+ω0)]"]],"why":"一对谱线，各为 π；sin 的频谱还带 j 与负号。","source":"讲义提炼 · 第 5 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-19","id":"sig-extra-19"},{"ch":5,"kind":"fill","group":"objective","stem":"抽样定理：为无失真恢复，抽样频率必须满足 f\u003csub>s\u003c/sub> ≥ ______。","options":[],"answer":"2f\u003csub>m\u003c/sub>","answerKey":"","accept":[["2fm","2f_m","2f\u003csub>m\u003c/sub>","2fmax","2f_max"]],"why":"f_m 是信号最高频率；等于 2f_m 是临界抽样，工程上要留余量。","source":"讲义提炼 · 第 5 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-20","id":"sig-extra-20"},{"ch":5,"kind":"choice","group":"objective","stem":"时域两个信号相乘，对应频域是（　）。","options":[{"key":"A","html":"两频谱相乘"},{"key":"B","html":"两频谱相加"},{"key":"C","html":"两频谱卷积再除以 2π"},{"key":"D","html":"两频谱卷积"}],"answer":"C","answerKey":"C","why":"时域相乘 ↔ 频域卷积，系数 1/(2π) 不能丢；时域卷积才对应频域相乘。","source":"讲义提炼 · 第 5 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-35","id":"sig-extra-35"},{"ch":6,"no":"例6-1","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">y″(t) + 3y′(t) + 2y(t) = x(t)\u003c/span>，求 \u003cspan class=\"eq\">H(jω)\u003c/span>、幅度响应和相位响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：两边取傅里叶变换\u003c/b>（用微分性质 \u003cspan class=\"eq\">y′ ⟷ jωY\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">[(jω)² + 3(jω) + 2]Y(jω) = X(jω)\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：相除\u003c/b>（注意 \u003cspan class=\"eq\">(jω)² = −ω²\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">−ω² + 3jω + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(1 + jω)(2 + jω)\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：拆成幅度与相位。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">|H(jω)| = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">√(1 + ω²)·√(4 + ω²)\u003c/span>\u003c/span>，　φ(ω) = −arctan ω − arctan\u003cspan class=\"fr\">\u003cspan class=\"fn\">ω\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>读图：\u003c/b>\u003cspan class=\"eq\">ω=0\u003c/span> 时 \u003cspan class=\"eq\">|H|=1/2\u003c/span>，频率越高 \u003cspan class=\"eq\">|H|\u003c/span> 越小 → 这是一个\u003cb>低通\u003c/b>系统。\u003cspan class=\"eq\">φ(0)=0\u003c/span>，\u003cspan class=\"eq\">ω→∞\u003c/span> 时 \u003cspan class=\"eq\">φ→−π\u003c/span>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>三条求 H(jω) 的路：\u003c/b>① 由微分方程（最快）；② 由 \u003cspan class=\"eq\">h(t)\u003c/span> 取傅里叶变换；③ 由电路的频域模型（电阻 R、电容 1/jωC、电感 jωL）。考试给什么就用什么。","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-1　由微分方程求频率响应（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：两边取傅里叶变换","第二步：相除","第三步：拆成幅度与相位。","读图："],"title":"例 6-1　由微分方程求频率响应（课件原题）","id":"signals-例6-1","points":["第一步：两边取傅里叶变换","第二步：相除","第三步：拆成幅度与相位。","读图："]},{"ch":6,"no":"例6-2","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">h(t) = (e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>，求 \u003cspan class=\"eq\">H(jω)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>用单边指数变换对 \u003cspan class=\"eq\">e\u003csup>−αt\u003c/sup>u(t) ⟷ 1/(α+jω)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + jω\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2 + jω\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(1 + jω)(2 + jω)\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>与例 6-1 完全一致 ✓。这说明\u003cb>同一个系统，用微分方程和用冲激响应算出的 H(jω) 必然相同\u003c/b>，可以互相验算。\u003c/p>","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-2　由 h(t) 求 H(jω)","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 6-2　由 h(t) 求 H(jω)","id":"signals-例6-2","points":["用单边指数变换对 e−αtu(t) ⟷ 1/(α+jω)：H(jω) = 11 + jω − 12 + jω = 1(1 + jω)(2 + jω)与例 6-1 完全一致 ✓","这说明同一个系统，用微分方程和用冲激响应算出的 H(jω) 必然相同，可以互相验算"]},{"ch":6,"no":"例6-3","kind":"short","group":"written","stem":"\u003cp>系统 \u003cspan class=\"eq\">H(jω) = 1/(1 + jω)\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = 2 + 3cos 2t\u003c/span>（\u003cspan class=\"eq\">−∞ &lt; t &lt; ∞\u003c/span>），求稳态响应。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>拆成两个频率分别处理。\u003c/b>\u003c/p>\u003cp>\u003cb>直流 \u003cspan class=\"eq\">ω=0\u003c/span>：\u003c/b>\u003cspan class=\"eq\">H(0)=1\u003c/span>，所以 \u003cspan class=\"eq\">2 → 2\u003c/span>。\u003c/p>\u003cp>\u003cb>余弦 \u003cspan class=\"eq\">ω=2\u003c/span>：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(j2) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + 2j\u003c/span>\u003c/span>，　|H(j2)| = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">√5\u003c/span>\u003c/span>，　φ(2) = −arctan 2 ≈ −63.4°\u003c/span>\u003c/div>\u003cp>幅度乘 \u003cspan class=\"eq\">1/√5\u003c/span>，相位加 \u003cspan class=\"eq\">−arctan 2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = 2 + \u003cspan class=\"fr\">\u003cspan class=\"fn\">3\u003c/span>\u003cspan class=\"fd\">√5\u003c/span>\u003c/span>cos(2t − arctan 2)\u003c/span>\u003c/div>\u003cdiv class=\"tip\">\u003cb>答题模板：\u003c/b>「拆频率 → 逐个算 H → 幅度乘 |H|、相位加 φ → 合起来」。写全这四步，步骤分就齐了。","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-3　正弦稳态响应","tags":["讲义例题"],"needsCheck":false,"steps":["拆成两个频率分别处理。"],"title":"例 6-3　正弦稳态响应","id":"signals-例6-3","points":["拆成两个频率分别处理","直流 ω=0：H(0)=1，所以 2 → 2","余弦 ω=2：H(j2) = 11 + 2j，　|H(j2)| = 1√5，　φ(2) = −arctan 2 ≈ −63.4°幅度乘 1/√5，相位加 −arctan 2：y(t) = 2 + 3√5cos(2t − arctan 2)答题模板：「拆频率 → 逐个算 H → 幅度乘 |H|、相位加 φ → 合起来」","写全这四步，步骤分就齐了"]},{"ch":6,"no":"例6-4","kind":"short","group":"written","stem":"\u003cp>RC 串联电路，输入为电压源 \u003cspan class=\"eq\">x(t)\u003c/span>，输出为电容电压 \u003cspan class=\"eq\">v\u003csub>C\u003c/sub>(t)\u003c/span>，初始状态为零。求 \u003cspan class=\"eq\">H(jω)\u003c/span>、\u003cspan class=\"eq\">h(t)\u003c/span> 和 3dB 截频。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>用分压公式\u003c/b>（电容阻抗 \u003cspan class=\"eq\">1/(jωC)\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(jω) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/(jωC)\u003c/span>\u003cspan class=\"fd\">R + 1/(jωC)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">1 + jωRC\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/RC\u003c/span>\u003cspan class=\"fd\">1/RC + jω\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>反变换得冲激响应\u003c/b>（对照 \u003cspan class=\"eq\">e\u003csup>−αt\u003c/sup>u(t) ⟷ 1/(α+jω)\u003c/span>，\u003cspan class=\"eq\">α=1/RC\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">RC\u003c/span>\u003c/span>e\u003csup>−t/RC\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>3dB 截频：\u003c/b>令 \u003cspan class=\"eq\">|H(jω\u003csub>c\u003c/sub>)| = 1/√2\u003c/span>，解得 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> = 1/RC\u003c/span>。频率越高 \u003cspan class=\"eq\">|H|\u003c/span> 越小，高频被衰减 → 低通滤波器。\u003c/p>\u003cdiv class=\"note\">\u003cb>课件结论：\u003c/b>3dB 截频处的幅度是通带的 \u003cspan class=\"eq\">0.707\u003c/span> 倍（功率减半，故叫 3dB）。工程上把 \u003cspan class=\"eq\">0 ~ ω\u003csub>c\u003c/sub>\u003c/span> 视作通带。","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-4　RC 低通电路（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["用分压公式","反变换得冲激响应","3dB 截频："],"title":"例 6-4　RC 低通电路（课件原题）","id":"signals-例6-4","points":["用分压公式","反变换得冲激响应","3dB 截频："]},{"ch":6,"no":"例6-5","kind":"short","group":"written","stem":"\u003cp>系统 \u003cspan class=\"eq\">H(jω) = 2e\u003csup>−j3ω\u003c/sup>\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = sin t + sin 3t\u003c/span>，求输出并判断是否失真。\u003c/p>","options":[],"answer":"\u003cp>\u003cspan class=\"eq\">|H| = 2\u003c/span> 为常数，\u003cspan class=\"eq\">φ(ω) = −3ω\u003c/span> 是线性相位 → \u003cb>无失真传输\u003c/b>，\u003cspan class=\"eq\">K=2, t\u003csub>d\u003c/sub>=3\u003c/span>。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = 2x(t − 3) = 2sin(t − 3) + 2sin(3t − 9)\u003c/span>\u003c/div>\u003cp>\u003cb>注意：\u003c/b>两个频率分量都延迟 3 秒，所以 \u003cspan class=\"eq\">sin 3t\u003c/span> 的相位偏移是 \u003cspan class=\"eq\">−9\u003c/span>（而不是 −3）。很多同学在这里只写 \u003cspan class=\"eq\">2sin(3t−3)\u003c/span>，那就错了——\u003cb>延迟时间相同，相位偏移与频率成正比\u003c/b>。\u003c/p>","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-5　判断无失真（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["注意："],"title":"例 6-5　判断无失真（课件原题）","id":"signals-例6-5","points":["|H| = 2 为常数，φ(ω) = −3ω 是线性相位 → 无失真传输，K=2, td=3","y(t) = 2x(t − 3) = 2sin(t − 3) + 2sin(3t − 9)注意：两个频率分量都延迟 3 秒，所以 sin 3t 的相位偏移是 −9（而不是 −3）","很多同学在这里只写 2sin(3t−3)，那就错了——延迟时间相同，相位偏移与频率成正比"]},{"ch":6,"no":"例6-6","kind":"short","group":"written","stem":"\u003cp>系统 \u003cspan class=\"eq\">H(jω) = 2e\u003csup>−j·arctan ω\u003c/sup>\u003c/span>，输入仍为 \u003cspan class=\"eq\">sin t + sin 3t\u003c/span>，判断是否失真。\u003c/p>","options":[],"answer":"\u003cp>\u003cspan class=\"eq\">|H| = 2\u003c/span> 是常数，幅度条件满足；但 \u003cspan class=\"eq\">φ(ω) = −arctan ω\u003c/span> 不是 \u003cspan class=\"eq\">ω\u003c/span> 的线性函数，\u003cb>相位条件不满足 → 有失真\u003c/b>。\u003c/p>\u003cp>两个分量分别延迟的「等效时间」不同：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">ω=1\u003c/span>：\u003cspan class=\"eq\">φ=−π/4\u003c/span>，等效延迟 \u003cspan class=\"eq\">π/4\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">ω=3\u003c/span>：\u003cspan class=\"eq\">φ=−arctan 3≈−1.249\u003c/span>，等效延迟 \u003cspan class=\"eq\">≈0.416\u003c/span>。\u003c/li>\u003c/ul>\u003cp>两个分量错开不同时间，合成波形就变了形。\u003cb>结论：幅度谱平 ≠ 无失真。\u003c/b>\u003c/p>","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-6　幅度不失真但相位失真","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 6-6　幅度不失真但相位失真","id":"signals-例6-6","points":["|H| = 2 是常数，幅度条件满足","但 φ(ω) = −arctan ω 不是 ω 的线性函数，相位条件不满足 → 有失真","两个分量分别延迟的「等效时间」不同：ω=1：φ=−π/4，等效延迟 π/4","ω=3：φ=−arctan 3≈−1.249，等效延迟 ≈0.416"]},{"ch":6,"no":"例6-7","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">x(t) = Sa(t)cos 2t\u003c/span> 通过线性相位理想低通 \u003cspan class=\"eq\">H(jω)\u003c/span>（截止 \u003cspan class=\"eq\">ω\u003csub>c\u003c/sub>\u003c/span>，延迟 \u003cspan class=\"eq\">t\u003csub>d\u003c/sub>\u003c/span>），分情况求输出。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>先求输入频谱。\u003c/b>\u003cspan class=\"eq\">Sa(t)\u003c/span> 的频谱是矩形：带宽 \u003cspan class=\"eq\">|ω| &lt; 1\u003c/span>。乘 \u003cspan class=\"eq\">cos 2t\u003c/span> 后频谱一分为二、各搬 ±2、幅度减半，所以 \u003cspan class=\"eq\">X(jω)\u003c/span> 占据 \u003cspan class=\"eq\">1 &lt; |ω| &lt; 3\u003c/span>。\u003c/p>\u003cp>\u003cb>分三种情况：\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> &gt; 3\u003c/span>：所有频率分量都通过（通带内 \u003cspan class=\"eq\">|H|=1\u003c/span>，只有线性相位）→ \u003cspan class=\"eq\">y(t) = x(t − t\u003csub>d\u003c/sub>) = Sa(t − t\u003csub>d\u003c/sub>)cos[2(t − t\u003csub>d\u003c/sub>)]\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">ω\u003csub>c\u003c/sub> &lt; 1\u003c/span>：全被挡住 → \u003cspan class=\"eq\">y(t) = 0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 &lt; ω\u003csub>c\u003c/sub> &lt; 3\u003c/span>：只通过 \u003cspan class=\"eq\">1 ~ ω\u003csub>c\u003c/sub>\u003c/span> 那一段频谱 → 输出是部分频率分量的叠加，\u003cb>波形必然失真\u003c/b>。\u003c/li>\u003c/ul>\u003cdiv class=\"tip\">\u003cb>解题套路：\u003c/b>先画出 \u003cspan class=\"eq\">X(jω)\u003c/span> 的「占频区间」，再看滤波器通带覆盖了哪一段。覆盖全 → 只是延迟；覆盖零 → 输出 0；覆盖一部分 → 失真。\u003cb>画频谱图比硬算积分快得多。\u003c/b>","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-7　Sa(t)cos2t 通过理想低通（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["先求输入频谱。","分三种情况："],"title":"例 6-7　Sa(t)cos2t 通过理想低通（课件原题）","id":"signals-例6-7","points":["先求输入频谱。","分三种情况："]},{"ch":6,"no":"例6-8","kind":"short","group":"written","stem":"\u003cp>离散 LTI 系统 \u003cspan class=\"eq\">h[k] = (δ[k] + δ[k−1])/2\u003c/span>，输入 \u003cspan class=\"eq\">x[k] = 1 + 2(−1)\u003csup>k\u003c/sup>\u003c/span>，求输出。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：求频率响应。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>) = ½(1 + e\u003csup>−jΩ\u003c/sup>) = e\u003csup>−jΩ/2\u003c/sup>cos\u003cspan class=\"fr\">\u003cspan class=\"fn\">Ω\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：把输入看成两个频率分量。\u003c/b>\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">1 = e\u003csup>j·0·k\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">Ω=0\u003c/span>：\u003cspan class=\"eq\">H(e\u003csup>j0\u003c/sup>) = 1\u003c/span> → 原样通过；\u003c/li>\u003cli>\u003cspan class=\"eq\">2(−1)\u003csup>k\u003c/sup> = 2e\u003csup>jπk\u003c/sup>\u003c/span>，\u003cspan class=\"eq\">Ω=π\u003c/span>：\u003cspan class=\"eq\">H(e\u003csup>jπ\u003c/sup>) = ½(1 − 1) = 0\u003c/span> → \u003cb>被完全滤掉\u003c/b>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] = 1\u003c/span>\u003c/div>\u003cp>\u003cb>物理解释：\u003c/b>相邻两点取平均，缓慢变化的直流成分不受影响，而 \u003cspan class=\"eq\">+1, −1, +1, −1\u003c/span> 这种「一正一负」的最高频振荡，两两相加正好抵消。\u003cb>所以两点平均器是一个低通（平滑）滤波器。\u003c/b>\u003c/p>\u003cdiv class=\"tip\">\u003cb>考试秒杀：\u003c/b>看到 \u003cspan class=\"eq\">(−1)\u003csup>k\u003c/sup>\u003c/span> 就想到 \u003cspan class=\"eq\">Ω=π\u003c/span>；看到常数就想到 \u003cspan class=\"eq\">Ω=0\u003c/span>。代 \u003cspan class=\"eq\">H(e\u003csup>j0\u003c/sup>)\u003c/span> 和 \u003cspan class=\"eq\">H(e\u003csup>jπ\u003c/sup>)\u003c/span> 两个数即可，不必做卷积。","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-8　两点平均器（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：求频率响应。","第二步：把输入看成两个频率分量。","物理解释："],"title":"例 6-8　两点平均器（课件原题）","id":"signals-例6-8","points":["第一步：求频率响应。","第二步：把输入看成两个频率分量。","物理解释："]},{"ch":6,"no":"例6-9","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">x(t)\u003c/span> 的频谱 \u003cspan class=\"eq\">X(jω)\u003c/span> 在 \u003cspan class=\"eq\">|ω| &lt; ω\u003csub>m\u003c/sub>\u003c/span> 内非零。\u003cspan class=\"eq\">y(t) = x(t)cos ω₀t\u003c/span>，再与 \u003cspan class=\"eq\">cos ω₀t\u003c/span> 相乘后经理想低通（截止 \u003cspan class=\"eq\">ω\u003csub>m\u003c/sub>\u003c/span>）。写出各点频谱并求最终输出。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>A 点（调制后）：\u003c/b>\u003cspan class=\"eq\">Y\u003csub>A\u003c/sub> = ½[X(ω−ω₀) + X(ω+ω₀)]\u003c/span>，两片谱分别在 \u003cspan class=\"eq\">±ω₀\u003c/span> 附近，各宽 \u003cspan class=\"eq\">2ω\u003csub>m\u003c/sub>\u003c/span>。\u003c/p>\u003cp>\u003cb>B 点（再乘一次载波）：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>B\u003c/sub> = x(t)cos²ω₀t = ½x(t) + ½x(t)cos 2ω₀t\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y\u003csub>B\u003c/sub>(jω) = ½X(jω) + ¼[X(j(ω − 2ω₀)) + X(j(ω + 2ω₀))]\u003c/span>\u003c/div>\u003cp>\u003cb>C 点（低通后）：\u003c/b>\u003cspan class=\"eq\">2ω₀\u003c/span> 附近的分量被滤掉，只剩 \u003cspan class=\"eq\">½X(jω)\u003c/span>，即 \u003cspan class=\"eq\">y\u003csub>C\u003c/sub>(t) = ½x(t)\u003c/span>。\u003c/p>\u003cp>\u003cb>最终：\u003c/b>后接增益为 2 的放大器，得 \u003cspan class=\"eq\">y(t) = x(t)\u003c/span>，无失真还原 ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>漏掉 \u003cspan class=\"eq\">½\u003c/span> 这个系数，或者忘了第二次调制会产生 \u003cspan class=\"eq\">2ω₀\u003c/span> 分量。写频谱时把每一片的中心位置和宽度都标出来，最不容易错。","answerKey":"","why":"","source":"讲义第 6 章 · 例 6-9　调制系统的频谱分析","tags":["讲义例题"],"needsCheck":false,"steps":["A 点（调制后）：","B 点（再乘一次载波）：","C 点（低通后）：","最终："],"title":"例 6-9　调制系统的频谱分析","id":"signals-例6-9","points":["A 点（调制后）：","B 点（再乘一次载波）：","C 点（低通后）：","最终："]},{"ch":6,"kind":"fill","group":"objective","stem":"无失真传输系统的频率响应 H(jω) = ______。","options":[],"answer":"K e\u003csup>−jωt\u003csub>d\u003c/sub>\u003c/sup>","answerKey":"","accept":[["Ke^(−jωtd)","K e^(-jωtd)","Ke−jωtd","K·e^(−jωt_d)"]],"why":"幅频为常数 K、相频为线性 −ωt_d，二者缺一不可。","source":"讲义提炼 · 第 6 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-21","id":"sig-extra-21"},{"ch":6,"kind":"choice","group":"objective","stem":"关于理想低通滤波器，下列说法正确的是（　）。","options":[{"key":"A","html":"它是因果系统"},{"key":"B","html":"它的冲激响应是 Sa 型函数，t\u003c0 时不为零"},{"key":"C","html":"它可以物理实现"},{"key":"D","html":"它的群时延为零"}],"answer":"B","answerKey":"B","why":"理想低通的 h(t) 是 Sa 函数，向 t\u003c0 延伸，因此非因果、不可物理实现；群时延为常数 t_d。","source":"讲义提炼 · 第 6 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-36","id":"sig-extra-36"},{"ch":7,"no":"例7-1","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">x(t) = u(t) − u(t−1)\u003c/span> 的 \u003cspan class=\"eq\">X(s)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>用线性 + 时移性质：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> − e\u003csup>−s\u003c/sup>·\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 − e\u003csup>−s\u003c/sup>\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>注意：\u003c/b>因为它是\u003cb>有限长信号\u003c/b>，ROC 是整个 s 平面（包括 \u003cspan class=\"eq\">s=0\u003c/span> 处，那里分子也为 0，是可去奇点）。\u003c/p>\u003cdiv class=\"tip\">\u003cb>对照记忆：\u003c/b>同一个矩形脉冲的傅里叶变换是 \u003cspan class=\"eq\">Sa(ω/2)e\u003csup>−jω/2\u003c/sup>\u003c/span>；把 \u003cspan class=\"eq\">s=jω\u003c/span> 代入上式得 \u003cspan class=\"eq\">(1−e\u003csup>−jω\u003c/sup>)/(jω)\u003c/span>，两者等价 ✓。","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-1　求矩形脉冲的拉氏变换（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["注意："],"title":"例 7-1　求矩形脉冲的拉氏变换（课件原题）","id":"signals-例7-1","points":["用线性 + 时移性质：X(s) = 1s − e−s·1s = 1 − e−ss注意：因为它是有限长信号，ROC 是整个 s 平面（包括 s=0 处，那里分子也为 0，是可去奇点）","对照记忆：同一个矩形脉冲的傅里叶变换是 Sa(ω/2)e−jω/2","把 s=jω 代入上式得 (1−e−jω)/(jω)，两者等价 ✓"]},{"ch":7,"no":"例7-2","kind":"short","group":"written","stem":"\u003cp>已知某 LTI 系统的冲激响应满足 \u003cspan class=\"eq\">h″(t) + h(t) = δ(t)\u003c/span>，用拉氏变换求 \u003cspan class=\"eq\">h(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>零状态下两边取拉氏变换（\u003cspan class=\"eq\">δ(t) ⟷ 1\u003c/span>，初始状态全为 0）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s²H(s) + H(s) = 1 ⟹ H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s² + 1\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>查表 7-1（\u003cspan class=\"eq\">sin ω₀t ⟷ ω₀/(s²+ω₀²)\u003c/span>，取 \u003cspan class=\"eq\">ω₀=1\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = sin t · u(t)\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>这道题在课件里是用来「打脸傅里叶法」的：\u003c/b>因为极点在 \u003cspan class=\"eq\">±j\u003c/span> 虚轴上，系统不稳定，\u003cspan class=\"eq\">H(jω)\u003c/span> 不存在（会漏掉虚轴上的冲激项）。用频域法会得到 \u003cspan class=\"eq\">H(jω)=1/(1−ω²)\u003c/span> 这种错误答案。\u003cb>凡是遇到不稳定系统，一律改用拉普拉斯变换。\u003c/b>","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-2　利用微分性质求 h(t)（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 7-2　利用微分性质求 h(t)（课件原题）","id":"signals-例7-2","points":["零状态下两边取拉氏变换（δ(t) ⟷ 1，初始状态全为 0）：s²H(s) + H(s) = 1 ⟹ H(s) = 1s² + 1查表 7-1（sin ω₀t ⟷ ω₀/(s²+ω₀²)，取 ω₀=1）：h(t) = sin t · u(t)这道题在课件里是用来「打脸傅里叶法」的：因为极点在 ±j 虚轴上，系统不稳定，H(jω) 不存在（会漏掉虚轴上的冲激项）","用频域法会得到 H(jω)=1/(1−ω²) 这种错误答案","凡是遇到不稳定系统，一律改用拉普拉斯变换"]},{"ch":7,"no":"例7-3","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">X(s) = (s+2)/(s²+4s+3)\u003c/span> 的反变换。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>因式分解：\u003c/b>\u003cspan class=\"eq\">s²+4s+3 = (s+1)(s+3)\u003c/span>，两个一阶极点 \u003cspan class=\"eq\">p₁=−1, p₂=−3\u003c/span>。\u003c/p>\u003cp>\u003cb>遮盖法求系数：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">K₁ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">s + 2\u003c/span>\u003cspan class=\"fd\">s + 3\u003c/span>\u003c/span>\u003cspan style=\"font-size:.8em\">|\u003csub>s=−1\u003c/sub>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>，　K₂ = \u003cspan class=\"fr\">\u003cspan class=\"fn\">s + 2\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span>\u003cspan style=\"font-size:.8em\">|\u003csub>s=−3\u003c/sub>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">−1\u003c/span>\u003cspan class=\"fd\">−2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s + 3\u003c/span>\u003c/span> ⟹ x(t) = ½(e\u003csup>−t\u003c/sup> + e\u003csup>−3t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">x(0\u003csup>+\u003c/sup>) = ½(1+1) = 1\u003c/span>；用初值定理 \u003cspan class=\"eq\">lim\u003csub>s→∞\u003c/sub>sX(s) = lim s·(s+2)/(s²+4s+3) = 1\u003c/span> ✓。\u003c/p>","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-3　一阶极点（基础题型）","tags":["讲义例题"],"needsCheck":false,"steps":["因式分解：","遮盖法求系数：","验算："],"title":"例 7-3　一阶极点（基础题型）","id":"signals-例7-3","points":["因式分解：","遮盖法求系数：","验算："]},{"ch":7,"no":"例7-4","kind":"short","group":"written","stem":"\u003cp>求 \u003cspan class=\"eq\">X(s) = 1/[s(s+1)²]\u003c/span> 的反变换。\u003c/p>","options":[],"answer":"\u003cp>设 \u003cspan class=\"eq\">X(s) = A/s + B/(s+1) + C/(s+1)²\u003c/span>。\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">A = sX(s)|\u003csub>s=0\u003c/sub> = 1\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">C = (s+1)²X(s)|\u003csub>s=−1\u003c/sub> = 1/s|\u003csub>s=−1\u003c/sub> = −1\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">B = d/ds[(s+1)²X(s)]|\u003csub>s=−1\u003c/sub> = d/ds(1/s)|\u003csub>s=−1\u003c/sub> = −1/s²|\u003csub>s=−1\u003c/sub> = −1\u003c/span>。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">(s + 1)²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>查表（\u003cspan class=\"eq\">1/s ↔ u(t)\u003c/span>，\u003cspan class=\"eq\">1/(s+1)² ↔ t e\u003csup>−t\u003c/sup>u(t)\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = [1 − e\u003csup>−t\u003c/sup> − t e\u003csup>−t\u003c/sup>]u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">x(0\u003csup>+\u003c/sup>)=1−1−0=0\u003c/span>；初值定理 \u003cspan class=\"eq\">lim sX(s)=lim 1/(s+1)²=0\u003c/span> ✓；终值定理 \u003cspan class=\"eq\">lim\u003csub>s→0\u003c/sub>sX(s)=1\u003c/span>，而 \u003cspan class=\"eq\">x(∞)=1\u003c/span> ✓。\u003c/p>","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-4　含二重极点","tags":["讲义例题"],"needsCheck":false,"steps":["验算："],"title":"例 7-4　含二重极点","id":"signals-例7-4","points":["设 X(s) = A/s + B/(s+1) + C/(s+1)²","A = sX(s)|s=0 = 1","C = (s+1)²X(s)|s=−1 = 1/s|s=−1 = −1","B = d/ds[(s+1)²X(s)]|s=−1 = d/ds(1/s)|s=−1 = −1/s²|s=−1 = −1"]},{"ch":7,"no":"例7-5","kind":"short","group":"written","stem":"\u003cp>判断下列因果系统是否稳定：① \u003cspan class=\"eq\">H(s)=1/(s+2)\u003c/span>；② \u003cspan class=\"eq\">H(s)=s/(s²+ω₀²)\u003c/span>；③ \u003cspan class=\"eq\">H(s)=1/(s−3)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>①\u003c/b> 极点 \u003cspan class=\"eq\">s=−2\u003c/span> 在左半平面 → \u003cb>稳定\u003c/b>。\u003cspan class=\"eq\">h(t)=e\u003csup>−2t\u003c/sup>u(t)\u003c/span>，绝对可积。\u003c/p>\u003cp>\u003cb>②\u003c/b> 极点 \u003cspan class=\"eq\">s=±jω₀\u003c/span> 在虚轴上 → \u003cb>不稳定\u003c/b>。\u003cspan class=\"eq\">h(t)=cos ω₀t·u(t)\u003c/span> 永不衰减；若输入有界信号 \u003cspan class=\"eq\">sin ω₀t·u(t)\u003c/span>（同频），输出会共振线性增长。\u003c/p>\u003cp>\u003cb>③\u003c/b> 极点 \u003cspan class=\"eq\">s=+3\u003c/span> 在右半平面 → \u003cb>不稳定\u003c/b>。\u003cspan class=\"eq\">h(t)=e\u003csup>3t\u003c/sup>u(t)\u003c/span> 指数爆炸。\u003c/p>\u003cdiv class=\"tip\">\u003cb>答题模板：\u003c/b>「求出极点 → 画 s 平面图 → 因题目说因果，故 ROC 在最右极点右侧 → 看是否含 jω 轴 / 极点是否全在左半平面 → 结论」。四步写全，步骤分到手。","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-5　判断稳定性（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":["①","②","③"],"title":"例 7-5　判断稳定性（课件原题）","id":"signals-例7-5","points":["①","②","③"]},{"ch":7,"no":"例7-6","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y″(t) + 3y′(t) + 2y(t) = 3x(t) + 2x′(t)，t ≥ 0\u003c/span>，求 \u003cspan class=\"eq\">H(s)\u003c/span>、\u003cspan class=\"eq\">h(t)\u003c/span>，并判断稳定性。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>零状态下取拉氏变换：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">(s² + 3s + 2)Y(s) = (3 + 2s)X(s)\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2s + 3\u003c/span>\u003cspan class=\"fd\">s² + 3s + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2s + 3\u003c/span>\u003cspan class=\"fd\">(s+1)(s+2)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>遮盖法核对：\u003cspan class=\"eq\">K₁=(2s+3)/(s+2)|\u003csub>s=−1\u003c/sub> = 1/1 = 1\u003c/span>；\u003cspan class=\"eq\">K₂=(2s+3)/(s+1)|\u003csub>s=−2\u003c/sub> = (−1)/(−1) = 1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = (e\u003csup>−t\u003c/sup> + e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>极点 \u003cspan class=\"eq\">−1, −2\u003c/span> 都在左半平面，系统因果且\u003cb>稳定\u003c/b> ✓。\u003c/p>\u003cdiv class=\"warn\">\u003cb>注意：\u003c/b>右端含 \u003cspan class=\"eq\">x′(t)\u003c/span> 时，\u003cspan class=\"eq\">H(s)\u003c/span> 的分子次数可能等于分母次数减 1，但这里仍是真分式，所以 \u003cspan class=\"eq\">h(t)\u003c/span> 里\u003cb>没有\u003c/b>\u003cspan class=\"eq\">δ(t)\u003c/span> 项。判断口诀：\u003cb>分子次数 ≥ 分母次数，h 中才有 δ 及其导数。\u003c/b>","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-6　由微分方程求 H(s) 与 h(t)","tags":["讲义例题"],"needsCheck":false,"steps":["零状态下取拉氏变换："],"title":"例 7-6　由微分方程求 H(s) 与 h(t)","id":"signals-例7-6","points":["零状态下取拉氏变换：(s² + 3s + 2)Y(s) = (3 + 2s)X(s)H(s) = 2s + 3s² + 3s + 2 = 2s + 3(s+1)(s+2) = 1s + 1 + 1s + 2遮盖法核对：K₁=(2s+3)/(s+2)|s=−1 = 1/1 = 1","K₂=(2s+3)/(s+1)|s=−2 = (−1)/(−1) = 1 ✓","h(t) = (e−t + e−2t)u(t)极点 −1, −2 都在左半平面，系统因果且稳定 ✓","注意：右端含 x′(t) 时，H(s) 的分子次数可能等于分母次数减 1，但这里仍是真分式，所以 h(t) 里没有δ(t) 项"]},{"ch":7,"no":"例7-7","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">y′(t) + 2y(t) = x(t)\u003c/span>，\u003cspan class=\"eq\">x(t) = u(t)\u003c/span>，\u003cspan class=\"eq\">y(0\u003csup>−\u003c/sup>) = 1\u003c/span>。求完全响应，并分出零输入、零状态。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：取单边拉氏变换。\u003c/b>用 \u003cspan class=\"eq\">y′ ⟷ sY − y(0\u003csup>−\u003c/sup>)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">[sY(s) − 1] + 2Y(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：整理。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Y(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1 + 1/s\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">s + 1\u003c/span>\u003cspan class=\"fd\">s(s + 2)\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s\u003c/span>\u003c/span> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1/2\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：反变换。\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = (½ + ½e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>第四步：拆分验证。\u003c/b>\u003c/p>\u003cul>\u003cli>零输入：\u003cspan class=\"eq\">Y\u003csub>zi\u003c/sub>(s) = y(0\u003csup>−\u003c/sup>)/(s+2) = 1/(s+2) → y\u003csub>zi\u003c/sub>(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span>；\u003c/li>\u003cli>零状态：\u003cspan class=\"eq\">Y\u003csub>zs\u003c/sub>(s) = H(s)X(s) = 1/[s(s+2)] = ½/s − ½/(s+2) → y\u003csub>zs\u003c/sub>(t) = ½(1 − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>；\u003c/li>\u003cli>相加：\u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup> + ½ − ½e\u003csup>−2t\u003c/sup> = ½ + ½e\u003csup>−2t\u003c/sup>\u003c/span> ✓。\u003c/li>\u003c/ul>\u003cp>\u003cb>验算：\u003c/b>\u003cspan class=\"eq\">y(0\u003csup>+\u003c/sup>)=1\u003c/span> ✓；代回方程 \u003cspan class=\"eq\">y′+2y = −e\u003csup>−2t\u003c/sup> + 1 + e\u003csup>−2t\u003c/sup> = 1\u003c/span> ✓。\u003c/p>\u003cdiv class=\"tip\">\u003cb>对比第 2 章：\u003c/b>时域法要「求齐次解 + 设特解 + 定常数」三大步；s 域法只需要「取变换 → 解一个代数方程 → 反变换」，\u003cb>初始条件自动进方程\u003c/b>，而且零输入零状态自然分开。这就是复频域法在考场上的最大优势。","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-7　一阶系统 s 域求解（含初值）","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：取单边拉氏变换。","第二步：整理。","第三步：反变换。","第四步：拆分验证。","验算："],"title":"例 7-7　一阶系统 s 域求解（含初值）","id":"signals-例7-7","points":["第一步：取单边拉氏变换。","第二步：整理。","第三步：反变换。","第四步：拆分验证。","验算："]},{"ch":7,"no":"例7-8","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">H(s) = (2s + 3)/(s² + 3s + 2)\u003c/span>，说明如何画直接型模拟框图。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>第一步：改写成积分器形式\u003c/b>（分子分母同除 \u003cspan class=\"eq\">s²\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">2s\u003csup>−1\u003c/sup> + 3s\u003csup>−2\u003c/sup>\u003c/span>\u003cspan class=\"fd\">1 + 3s\u003csup>−1\u003c/sup> + 2s\u003csup>−2\u003c/sup>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：引入中间变量\u003c/b>\u003cspan class=\"eq\">W(s)\u003c/span>，令分母为 \u003cspan class=\"eq\">X(s)\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">W(s) = X(s) − 3s\u003csup>−1\u003c/sup>W(s) − 2s\u003csup>−2\u003c/sup>W(s)，　Y(s) = 2s\u003csup>−1\u003c/sup>W(s) + 3s\u003csup>−2\u003c/sup>W(s)\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：画图。\u003c/b>画一条含\u003cb>两个串联 1/s 积分器\u003c/b>的主链，积分器输出自右向左依次是 \u003cspan class=\"eq\">s\u003csup>−2\u003c/sup>W, s\u003csup>−1\u003c/sup>W\u003c/span>；用数乘器把 \u003cspan class=\"eq\">−3\u003c/span>、\u003cspan class=\"eq\">−2\u003c/span> 反馈回输入端加法器，把 \u003cspan class=\"eq\">+2\u003c/span>、\u003cspan class=\"eq\">+3\u003c/span> 送到输出端加法器。\u003c/p>\u003cp>\u003cb>记忆：\u003c/b>分母系数变号后作\u003cb>反馈\u003c/b>，分子系数直接作\u003cb>前馈\u003c/b>。\u003cb>积分器个数 = 系统阶数\u003c/b>。\u003c/p>","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-8　画直接型框图","tags":["讲义例题"],"needsCheck":false,"steps":["第一步：改写成积分器形式","第二步：引入中间变量","第三步：画图。","记忆："],"title":"例 7-8　画直接型框图","id":"signals-例7-8","points":["第一步：改写成积分器形式","第二步：引入中间变量","第三步：画图。","记忆："]},{"ch":7,"no":"例7-9","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">X(s) = 1/[(s+1)(s+2)]\u003c/span>，分别求三种 ROC 下的 \u003cspan class=\"eq\">x(t)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>先分解：\u003cspan class=\"eq\">X(s) = 1/(s+1) − 1/(s+2)\u003c/span>，极点 \u003cspan class=\"eq\">−1, −2\u003c/span>。\u003c/p>\u003cp>\u003cb>① ROC：Re{s} &gt; −1\u003c/b>（最右极点右侧）→ 两项都是右边信号：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = (e\u003csup>−t\u003c/sup> − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>② ROC：Re{s} &lt; −2\u003c/b>（最左极点左侧）→ 两项都是左边信号（\u003cspan class=\"eq\">1/(s+a)\u003c/span> 配左边是 \u003cspan class=\"eq\">−e\u003csup>−at\u003c/sup>u(−t)\u003c/span>）：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = (e\u003csup>−2t\u003c/sup> − e\u003csup>−t\u003c/sup>)u(−t)\u003c/span>\u003c/div>\u003cp>\u003cb>③ ROC：−2 &lt; Re{s} &lt; −1\u003c/b>（带状）→ \u003cspan class=\"eq\">1/(s+1)\u003c/span> 取左边、\u003cspan class=\"eq\">−1/(s+2)\u003c/span> 取右边：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t) = −e\u003csup>−2t\u003c/sup>u(t) − e\u003csup>−t\u003c/sup>u(−t)\u003c/span>\u003c/div>\u003cdiv class=\"warn\">\u003cb>核心结论：\u003c/b>\u003cb>只给 X(s) 不给 ROC，反变换不唯一。\u003c/b>单边拉氏变换默认因果，ROC 常被省略；但双边变换题目里 ROC 是必给条件，答题时一定要先判它是右边、左边还是双边信号。","answerKey":"","why":"","source":"讲义第 7 章 · 例 7-9　ROC 决定时域信号（经典考点）","tags":["讲义例题"],"needsCheck":false,"steps":["① ROC：Re{s} > −1","② ROC：Re{s} \u003c −2","③ ROC：−2 \u003c Re{s} \u003c −1"],"title":"例 7-9　ROC 决定时域信号（经典考点）","id":"signals-例7-9","points":["① ROC：Re{s} &gt; −1","② ROC：Re{s} &lt; −2","③ ROC：−2 &lt; Re{s} &lt; −1"]},{"ch":7,"no":"题-5","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">H(s)=(s+5)/[(s+1)(s+2)]\u003c/span>，输入 \u003cspan class=\"eq\">x(t)=u(t)\u003c/span> 时零状态响应为某 \u003cspan class=\"eq\">y\u003csub>zs\u003c/sub>(t)\u003c/span>。写出系统微分方程、求 \u003cspan class=\"eq\">h(t)\u003c/span>、判断因果与稳定。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>① 微分方程：\u003c/b>交叉相乘 \u003cspan class=\"eq\">(s²+3s+2)Y=(s+5)X\u003c/span> ⟹ \u003cspan class=\"eq\">y″+3y′+2y = x′ + 5x\u003c/span>。\u003c/p>\u003cp>\u003cb>② 冲激响应：\u003c/b>部分分式展开\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">H(s) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">4\u003c/span>\u003cspan class=\"fd\">s + 1\u003c/span>\u003c/span> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">3\u003c/span>\u003cspan class=\"fd\">s + 2\u003c/span>\u003c/span> ⟹ h(t) = (4e\u003csup>−t\u003c/sup> − 3e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>\u003c/div>\u003cp>\u003cb>③ 因果与稳定：\u003c/b>\u003cspan class=\"eq\">h(t)\u003c/span> 含 \u003cspan class=\"eq\">u(t)\u003c/span>，\u003cspan class=\"eq\">t&lt;0\u003c/span> 为 0 → \u003cb>因果\u003c/b>；极点 \u003cspan class=\"eq\">−1, −2\u003c/span> 都在左半平面 → \u003cb>稳定\u003c/b>。\u003c/p>\u003cp>\u003cb>④ 频率响应：\u003c/b>因稳定，可直接令 \u003cspan class=\"eq\">s=jω\u003c/span> 得 \u003cspan class=\"eq\">H(jω)=(jω+5)/[(jω+1)(jω+2)]\u003c/span>。\u003c/p>\u003cdiv class=\"tip\">\u003cb>这是 CH6 综合题的标准四问：\u003c/b>由 H(s) 反推微分方程 → 部分分式求 h(t) → 判因果稳定 → 求频响。四问写全，20 分到手。","answerKey":"","why":"","source":"课件复习题精选 · 5","tags":["课件复习题精选","由系统函数判断稳定与因果（L20 / L24 综合）"],"needsCheck":false,"title":"由系统函数判断稳定与因果（L20 / L24 综合）","id":"signals-题-5","points":["① 微分方程：","② 冲激响应：","③ 因果与稳定：","④ 频率响应："]},{"ch":7,"kind":"fill","group":"objective","stem":"单边拉普拉斯变换：L[e\u003csup>−at\u003c/sup>u(t)] = ______，收敛域 ______。","options":[],"answer":"1/(s+a)；Re(s)>−a","answerKey":"","accept":[["1/(s+a)","1/(s+a)"],["Re(s)>−a","σ>−a","Re(s)>-a"]],"why":"极点在 s=−a，收敛域在极点右侧；这是最常用的变换对。","source":"讲义提炼 · 第 7 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-22","id":"sig-extra-22"},{"ch":7,"kind":"fill","group":"objective","stem":"连续系统稳定的判据：H(s) 的全部极点位于 ______。","options":[],"answer":"s 左半平面","answerKey":"","accept":[["左半平面","s左半平面","左半s平面","s平面左半平面"]],"why":"极点实部全为负，冲激响应才衰减；虚轴上单极点对应临界稳定。","source":"讲义提炼 · 第 7 章","tags":["讲义提炼"],"needsCheck":false,"no":"补填-23","id":"sig-extra-23"},{"ch":7,"kind":"choice","group":"objective","stem":"L[e\u003csup>−3t\u003c/sup>u(t)] 的收敛域是（　）。","options":[{"key":"A","html":"Re(s)>−3"},{"key":"B","html":"Re(s)\u003c−3"},{"key":"C","html":"Re(s)>3"},{"key":"D","html":"全 s 平面"}],"answer":"A","answerKey":"A","why":"单边指数信号极点在 s=−3，收敛域为极点右侧 Re(s)>−3。","source":"讲义提炼 · 第 7 章","tags":["讲义提炼"],"needsCheck":false,"no":"补选-37","id":"sig-extra-37"},{"ch":8,"no":"例8-1","kind":"short","group":"written","stem":"\u003cp>已知 \u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k] ⟷ z/(z−a)\u003c/span>，求 \u003cspan class=\"eq\">x[k] = k a\u003csup>k\u003c/sup>u[k]\u003c/span> 的 \u003cspan class=\"eq\">X(z)\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>用 z 域微分性质 \u003cspan class=\"eq\">k x[k] ⟷ −z dX/dz\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">d\u003c/span>\u003cspan class=\"fd\">dz\u003c/span>\u003c/span>[\u003cspan class=\"fr\">\u003cspan class=\"fn\">z\u003c/span>\u003cspan class=\"fd\">z − a\u003c/span>\u003c/span>] = \u003cspan class=\"fr\">\u003cspan class=\"fn\">(z − a) − z\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">−a\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">X(z) = −z·\u003cspan class=\"fr\">\u003cspan class=\"fn\">−a\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">az\u003c/span>\u003cspan class=\"fd\">(z − a)²\u003c/span>\u003c/span>，　ROC：|z| &gt; |a|\u003c/span>\u003c/div>\u003cp>顺带可得 \u003cspan class=\"eq\">(k+1)a\u003csup>k\u003c/sup>u[k] ⟷ z²/(z−a)²\u003c/span>（把两项相加即可）。\u003c/p>","answerKey":"","why":"","source":"讲义第 8 章 · 例 8-1　求 k aku[k] 的 Z 变换（课件原题）","tags":["讲义例题"],"needsCheck":false,"steps":[],"title":"例 8-1　求 k aku[k] 的 Z 变换（课件原题）","id":"signals-例8-1","points":["用 z 域微分性质 k x[k] ⟷ −z dX/dz：ddz[zz − a] = (z − a) − z(z − a)² = −a(z − a)²X(z) = −z·−a(z − a)² = az(z − a)²，　ROC：|z| > |a|顺带可得 (k+1)aku[k] ⟷ z²/(z−a)²（把两项相加即可）"]},{"ch":8,"no":"例8-2","kind":"short","group":"written","stem":"\u003cp>\u003cspan class=\"eq\">X(z) = 1/(1 − a z\u003csup>−1\u003c/sup>) = z/(z−a)\u003c/span>，\u003cspan class=\"eq\">|z| &gt; |a|\u003c/span>。求 \u003cspan class=\"eq\">x[0], x[1], x[∞]\u003c/span>。\u003c/p>","options":[],"answer":"\u003cp>\u003cb>初值：\u003c/b>\u003cspan class=\"eq\">x[0] = lim\u003csub>z→∞\u003c/sub> z/(z−a) = 1\u003c/span>。\u003c/p>\u003cp>\u003cb>下一项：\u003c/b>用位移性质 \u003cspan class=\"eq\">Z{x[k+1]} = z[X(z) − x[0]] = z[z/(z−a) − 1] = az/(z−a)\u003c/span>，故 \u003cspan class=\"eq\">x[1] = lim\u003csub>z→∞\u003c/sub> az/(z−a) = a\u003c/span>。与 \u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k]
