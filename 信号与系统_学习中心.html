<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="信号与系统 分步备考学习中心：知识讲解、引导式教学、客观题与大题专练、模拟考试、错题重练与学习报告。离线可用。">
<title>信号与系统 · 完整学习中心</title>
<style>:root{
  --bg:#f4f6fb; --card:#fff; --line:#e2e8f2; --line2:#eef2f9;
  --ink:#16202f; --muted:#5d6b80; --dim:#8a95a6;
  --navy:#0f2440; --navy2:#17365e; --brand:#2f6fdb; --brand-d:#1d4ed8;
  --teal:#0f766e; --purple:#6846bd; --amber:#b45309;
  --blue-bg:#eef4ff; --green-bg:#ecfdf5; --purple-bg:#f5f3ff; --amber-bg:#fff7ed;
  --ok:#15803d; --bad:#b91c1c;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(22,32,47,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);background:#eef1f5;border:1px solid #e0e5ec;border-radius:4px;padding:1px 5px;font-size:.9em;color:#243b6b}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:52px;display:flex;align-items:center;gap:14px;padding:0 18px}
.top .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--navy),#2f6fdb);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.top b{font-size:13.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{color:#c8d2e2}
.top .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim)}
.top .right a{color:var(--muted)}
.top .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px}

/* ---------- 三栏 ---------- */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 296px;max-width:1380px;margin:0 auto;align-items:start}
aside.side{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:20px 14px 36px}
.side .brand{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.35}
.side .brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:4px;letter-spacing:.4px}
.prog{background:linear-gradient(135deg,#eef4ff,#f7faff);border:1px solid #dbe7ff;border-radius:10px;padding:10px 12px;margin:14px 0 12px;font-size:12px;color:#274a8c}
.prog .pt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog .pt span{font-size:11.5px;line-height:1.4}
.prog .pt b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;flex:none}
.progbar{height:5px;background:#d5e2fb;border-radius:5px;margin-top:7px;overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fdb,#5b9bff);border-radius:5px;transition:width .3s}
.side .grp{margin:16px 0 5px;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.9px;padding-left:6px;text-transform:uppercase}
.side a.toc{display:flex;gap:7px;align-items:baseline;font-size:12.8px;line-height:1.45;color:#3b4657;padding:5px 8px;border-radius:6px;border-left:2px solid transparent}
.side a.toc:hover{background:var(--blue-bg);color:var(--brand-d)}
.side a.toc.on{background:var(--blue-bg);color:var(--brand-d);border-left-color:var(--brand);font-weight:700}
.side a.toc .num{font-family:var(--mono);color:#9aa4b2;font-size:10.5px;min-width:15px}
.side .tip{margin-top:20px;font-size:11.4px;color:var(--dim);line-height:1.7;border-top:1px dashed var(--line);padding-top:12px}

main{padding:0 28px 80px;min-width:0}
main:focus{outline:none}
aside.rail{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;padding:20px 18px 40px;border-left:1px solid var(--line);background:#fbfcff}
.rail .k{font-size:9.5px;letter-spacing:1.6px;color:var(--dim);font-weight:800;text-transform:uppercase}
.rail h3{margin:4px 0 12px;font-size:17px}
.rail .big{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.rail .big small{font-size:13px;color:var(--dim);font-weight:400}
.rail .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px;color:var(--muted)}
.rail .row b{color:var(--ink);font-variant-numeric:tabular-nums}
#saveWarn{background:#fff8ec;border-bottom:1px solid #f6dfb6;color:#8a5a12;padding:7px 14px;font-size:12.5px;text-align:center;position:sticky;top:52px;z-index:35}
.rail .blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rail .q{font-size:12px;color:var(--muted);line-height:1.65}
.rail .next{display:block;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--navy);color:#fff;text-align:center;font-size:12.5px;font-weight:700}
.rail .mini{display:flex;gap:6px;flex-wrap:nowrap;margin-top:8px}
.rail .mini a{flex:1 1 0;min-width:0;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:11px;color:var(--muted);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 首页 ---------- */
.hero{position:relative;margin:22px 0 18px;border-radius:16px;overflow:hidden;background:linear-gradient(120deg,#0d2140 0%,#123059 62%,#1b4476 100%);color:#fff;padding:28px 30px 26px;box-shadow:0 6px 24px rgba(15,36,64,.16)}
.hero .kick{font-size:10.5px;letter-spacing:2.2px;color:#9fc0ea;font-weight:700;text-transform:uppercase}
.hero h1{margin:7px 0 8px;font-size:30px;letter-spacing:.5px;line-height:1.25}
.hero p{margin:0;color:#c9d8ec;font-size:13.6px;max-width:560px}
.hero .met{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.hero .met span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:3px 11px;font-size:11.5px;color:#dce8f8}
.hero .acts{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.hero .acts a,.hero .acts button{border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.hero .acts .pri{background:#fff;color:var(--navy);border-color:#fff}
.hero .deco{position:absolute;right:0;top:0;bottom:0;width:42%;opacity:.55;pointer-events:none}

.groups{margin-top:8px}
.chead{display:flex;align-items:baseline;gap:10px;margin:22px 0 9px;border-bottom:1px solid var(--line);padding-bottom:7px}
.chead h2{margin:0;font-size:14.5px;letter-spacing:.4px}
.chead h2 .n{color:var(--dim);font-family:var(--mono);font-size:12px;margin-right:7px}
.chead small{margin-left:auto;color:var(--dim);font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:12px;padding:14px 14px 12px;color:#fff;min-height:118px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,32,47,.14)}
.tile .ic{width:22px;height:22px;margin-bottom:8px;opacity:.92}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14.5px;font-weight:800;letter-spacing:.2px}
.tile span{font-size:11.5px;opacity:.82;line-height:1.5;margin-top:2px}
.tile small{margin-top:auto;font-size:11px;opacity:.9;padding-top:8px}
.tile.navy{background:linear-gradient(150deg,#16345c,#0f2440)}
.tile.blue{background:linear-gradient(150deg,#2f6fdb,#1d4ed8)}
.tile.green{background:linear-gradient(150deg,#12876f,#0f766e)}
.tile.purple{background:linear-gradient(150deg,#7b57cf,#5b3aa8)}
.tile.orange{background:linear-gradient(150deg,#c4700f,#9a4f08)}
.tile .dot{position:absolute;right:-18px;bottom:-18px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.07)}

.entrylinks{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.entrylinks a{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.entrylinks a b{color:var(--ink)}
.entrylinks a:hover{border-color:#c9d8f2;color:var(--brand-d)}

.sec{margin:30px 0 10px;font-size:15px;display:flex;align-items:center;gap:9px}
.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand)}
.chaplist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow);display:block;color:inherit}
.chcard:hover{border-color:#c9d8f2}
.chcard .r{display:flex;align-items:center;gap:8px}
.chcard .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chcard b{font-size:13.5px}
.chcard .bar{height:4px;background:var(--line2);border-radius:4px;margin-top:9px;overflow:hidden}
.chcard .bar i{display:block;height:100%;background:var(--teal)}
.chcard small{color:var(--dim);font-size:11px;display:block;margin-top:6px}

/* ---------- 通用 ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:18px 0 8px}
.crumb a{color:var(--muted)}
.ph{margin:6px 0 4px;font-size:24px;letter-spacing:.3px}
.psub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);margin:12px 0}
.panel h3{margin:0 0 10px;font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=search],input[type=number],input[type=text],textarea{border:1px solid #cfd9e8;border-radius:8px;padding:7px 10px;background:#fff;font-size:13.5px;min-height:37px}
textarea{width:100%;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(47,111,219,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfd9e8;background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ink);font-weight:600}
.btn:hover{border-color:#9fb6da;background:#f8faff}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#17365e}
.btn.green{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--blue-bg);border-color:#bfd4f7;color:var(--brand-d);font-weight:700}
.badge{display:inline-block;border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:700;line-height:1.7;vertical-align:1px}
.badge.g{background:var(--green-bg);color:var(--ok)}
.badge.b{background:var(--blue-bg);color:var(--brand-d)}
.badge.o{background:var(--amber-bg);color:var(--amber)}
.badge.p{background:var(--purple-bg);color:var(--purple)}
.badge.r{background:#fef2f2;color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11.5px}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* ---------- 文档 ---------- */
.doc{font-size:15px;line-height:1.85;color:#263449;min-width:0}
.doc p{margin:9px 0}
.doc ul,.doc ol{padding-left:22px;margin:8px 0}
.doc li{margin:4px 0}
.doc b{color:#0f2a5c}
.doc h4{margin:18px 0 6px;font-size:15.5px}
.doc .eq{font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;font-size:17px;line-height:2.05}
.doc .formula{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 16px 12px;margin:12px 0;text-align:center;overflow-x:auto;overflow-y:hidden}
.doc .formula .eq{font-size:17.5px;line-height:2.3}
.doc .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .22em;font-size:.96em;line-height:1.15}
.doc .fr>.fn{border-bottom:1.2px solid currentColor;padding:0 .28em .06em}
.doc .fr>.fd{padding:.04em .28em 0}
.doc .intg,.doc .sum{white-space:nowrap}
.doc .intg>.lim,.doc .sum>.lim{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.56em;line-height:1.15;margin:0 .1em 0 -.05em;text-align:left}
.doc .intg>.lim>.u,.doc .sum>.lim>.u{order:1}
.doc .intg>.lim>.l,.doc .sum>.lim>.l{order:2}
.doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.8px;background:#fff}
.doc th,.doc td{border:1px solid #e3e9f3;padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:#f5f8fd;color:#0f2a5c;font-weight:800;font-size:13px}
.doc .tablewrap{overflow-x:auto;max-width:100%;margin:12px 0;border-radius:8px}
.doc .tablewrap table{margin:0;min-width:560px}
.doc td:first-child,.doc th:first-child{min-width:74px}
.doc td:last-child,.doc th:last-child{min-width:112px}
.doc .kp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:0 12px 12px 0;padding:13px 17px;margin:14px 0}
.doc .kp .t{font-weight:800;color:var(--brand-d);font-size:15.5px;display:block;margin-bottom:3px}
.doc .tip{background:#fff8ec;border:1px solid #f6dfb6;border-radius:11px;padding:11px 15px;margin:12px 0;font-size:14.4px}
.doc .tip b{color:var(--amber)}
.doc .warn{background:#fef2f2;border:1px solid #f6cdcd;border-radius:11px;padding:11px 15px;margin:12px 0;font-size:14.4px}
.doc .warn b{color:var(--bad)}
.doc .note{background:#f0f9ff;border:1px solid #cfe8fb;border-radius:11px;padding:11px 15px;margin:12px 0}
.doc .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin:10px 0;font-size:14px}
.doc .ch-intro{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 17px;margin:10px 0 16px;font-size:14.3px;color:#41506a}
.doc .ch-intro b{color:#0f2a5c}
.doc .lead{color:var(--muted);font-size:13.7px}
.doc .eg{background:#fff;border:1px solid var(--line);border-radius:13px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
.doc .eg-h{background:linear-gradient(90deg,#edf3ff,#f9fbff);padding:9px 15px;font-weight:800;color:var(--brand-d);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14.5px}
.doc .eg-h .tag{font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:1px 8px;flex:none}
.doc .eg-h .tag.g{background:var(--teal)}
.doc .eg-b{padding:11px 16px 13px}
.doc details.sol{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.doc details.sol summary{cursor:pointer;color:var(--brand);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:13.8px;user-select:none}
.doc details.sol summary::-webkit-details-marker{display:none}
.doc details.sol summary::before{content:"▸";display:inline-block;transition:transform .2s}
.doc details.sol[open] summary::before{transform:rotate(90deg)}
.doc details.sol .body{margin-top:8px;font-size:14.5px}
.doc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc .qs .q{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin:8px 0;font-size:14.3px}
.doc .qs .q::before{content:"›";color:var(--brand);font-weight:800;margin-right:7px}
.doc img{max-width:100%;height:auto}

/* ---------- 阅读器 ---------- */
.reader{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.rnav{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.rnav a{display:block;font-size:12.3px;line-height:1.45;color:#42506a;padding:6px 9px;border-radius:6px}
.rnav a:hover{background:var(--blue-bg)}
.rnav a.on{background:var(--blue-bg);color:var(--brand-d);font-weight:700}
.rnav .h{font-size:10.5px;color:var(--dim);letter-spacing:.7px;font-weight:800;padding:6px 9px 3px}
.rbody{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px 30px;box-shadow:var(--shadow)}
.rbody h2{margin:0 0 6px;font-size:21px}
.rbody .meta{font-size:12px;color:var(--dim);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.rbody .secbody{border-top:1px solid var(--line2);padding-top:16px;margin-top:18px}
.rbody .secbody:first-of-type{border-top:0;margin-top:8px;padding-top:0}
.rbody h3{font-size:17px;margin:4px 0 10px}
.rtools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}

/* ---------- 题库 ---------- */
body.bank .rail,body.bank .side{display:none}
body.bank .menu{display:none}
body.bank .layout{grid-template-columns:minmax(0,1fr)}
body.bank main{max-width:900px;margin:0 auto;padding:0 22px 80px}
.bhead{margin:22px 0 6px}
.bhead .bk{font-size:10.5px;letter-spacing:2px;color:var(--dim);font-weight:800;text-transform:uppercase}
.bhead h1{font-size:28px;margin:5px 0 4px}
.bhead p{margin:0;color:var(--muted);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.filters select,.filters input{width:100%;min-width:0}
.qjump{display:flex;gap:8px;align-items:center;margin:8px 0 14px}
.qjump select{flex:1;min-width:0}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 20px 15px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);margin-bottom:9px}
.qmeta .no{font-weight:800;color:var(--brand-d);font-size:13px}
.qmeta .src{margin-left:auto}
.qmeta .sp{color:#c8d2e2}
.qstem{font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.qstem .ln{display:inline}
.opts{display:grid;gap:7px;margin:13px 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid #d7e0ee;background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;line-height:1.7;color:#243247;width:100%}
.opt:hover{border-color:#9fb6da;background:#f9fbff}
.opt .k{font-weight:800;color:var(--brand-d);flex:none;width:16px}
.opt .oh{min-width:0;overflow-wrap:anywhere}
.opt.pick{border-color:var(--brand);background:var(--blue-bg)}
.opt.right{border-color:#86c9a4;background:#f0fbf4}
.opt.wrong{border-color:#e6a3a3;background:#fef2f2}
.opt:disabled{cursor:default}
.opt .eq{font-family:"Cambria Math",Cambria,Georgia,serif}
.judge{display:flex;gap:9px;margin:13px 0 4px}
.judge button{min-width:88px;border:1px solid #d7e0ee;background:#fff;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700}
.judge button:hover{border-color:#9fb6da}
.judge button.right{border-color:#86c9a4;background:#f0fbf4;color:var(--ok)}
.judge button.wrong{border-color:#e6a3a3;background:#fef2f2;color:var(--bad)}
.fills{margin:12px 0 4px;display:grid;gap:8px}
.fillrow{display:flex;gap:9px;align-items:center}
.fillrow span{font-size:11.5px;color:var(--dim);min-width:34px}
.fillrow input{flex:1}
.fillrow .mark{font-weight:800;min-width:18px}
.fillrow .mark.ok{color:var(--ok)}
.fillrow .mark.no{color:var(--bad)}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:13px}
.qfoot .state{font-size:11.5px;color:var(--dim);margin-left:2px}
.feed{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
.feed .ans{background:#f0fbf4;border:1px solid #cfe9d8;border-radius:9px;padding:9px 13px;font-size:14px;margin:8px 0}
.feed .ans b{color:var(--ok)}
.feed .why{font-size:14px;color:#3b4a61}
.feed .cause{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.navq{display:flex;justify-content:space-between;gap:8px;margin:14px 0 0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- 训练/考试 ---------- */
.drillbar{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.drillbar .bar{flex:1}
.drillbar small{font-size:11.5px;color:var(--dim);white-space:nowrap}
.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.result .big{font-size:44px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.result .big small{font-size:15px;color:var(--dim);font-weight:400}
.timer{font-family:var(--mono);font-size:14px;background:#0f2440;color:#fff;border-radius:8px;padding:5px 11px}
.examq{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:11px 0}
.examq .qn{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.review{border-left:3px solid var(--line);padding-left:12px;margin:12px 0}
.review.ok{border-color:#86c9a4}
.review.no{border-color:#e6a3a3}

/* ---------- 工具 ---------- */
.tool{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.tool .out{background:#0f2440;color:#e7f0fb;border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.8}
.tool .out b{color:#fff;font-size:22px;font-variant-numeric:tabular-nums}
.tool .out code{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.field{display:block;margin:10px 0;font-size:12px;color:var(--muted)}
.field input,.field select{display:block;width:100%;margin-top:4px}
.field input[type=range]{margin-top:8px}
.field input[type=range]{width:100%;min-height:26px}
.field .v{font-weight:800;color:var(--ink);font-size:13.5px}
.labtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.labtab{text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.labtab:hover{transform:translateY(-1px);border-color:#b9cdea}
.labtab b{display:block;font-size:13px;color:var(--ink);line-height:1.4}
.labtab span{display:block;font-size:10.8px;color:var(--muted);margin-top:2px;line-height:1.45}
.labtab.on{border-color:#9fb6da;background:var(--blue-bg);box-shadow:0 0 0 2px rgba(47,111,219,.08)}
.labtab.on b{color:var(--brand-d)}
.labnote{font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:8px}
.vbar{height:8px;background:#e6edf8;border-radius:6px;overflow:hidden;margin:9px 0 4px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fdb,#69a6f5);border-radius:6px;transition:width .2s}
.vscale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);gap:4px}
.dfm{display:grid;gap:6px;margin-top:8px}
.dfm .r{display:flex;align-items:center;gap:8px;font-size:12.2px;border-bottom:1px dashed rgba(255,255,255,.14);padding-bottom:5px;color:#dbe7f6}
.dfm .r b{margin-left:auto;flex:none}
.powergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin:6px 0 2px}
.powergrid .field{margin:0}
.checkline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:9px 0 2px;line-height:1.5}
.checkline input{width:14px;height:14px;min-height:0;margin:0}
.pwsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.pwsum div{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
.pwsum small{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}
.pwsum b{display:block;font-size:16.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.verdict{padding:11px 14px;border-radius:10px;font-size:13.4px;line-height:1.75;margin:10px 0;border:1px solid}
.verdict.bad{background:#fef2f2;border-color:#f2c9c9;color:#7f1d1d}
.verdict.warn{background:#fff8ec;border-color:#f1dab3;color:#7a4a0c}
.verdict.ok{background:#f0fbf4;border-color:#c9e7d4;color:#14532d}
table.tb tr.cur td{background:#eef4ff}
.pwtb th,.pwtb td{white-space:nowrap}
@media(max-width:700px){
  .pwtb thead{display:none}
  .pwtb,.pwtb tbody,.pwtb tr,.pwtb td{display:block;width:100%}
  .pwtb{margin:0;border:0;background:transparent}
  .pwtb tr{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:7px 11px;background:#fff}
  .pwtb tr.cur{background:#eef4ff;border-color:#bcd4f6}
  .pwtb td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:3px 0;font-size:12.5px;text-align:right;white-space:normal}
  .pwtb td::before{content:attr(data-l);color:var(--muted);font-weight:600;text-align:left;flex:none}
  .pwtb td:first-child{font-weight:800;color:var(--brand-d);font-size:13.5px;border-bottom:1px dashed var(--line);margin-bottom:5px;padding-bottom:6px}
  .pwtb td:first-child{justify-content:space-between}
}



canvas{display:block;width:100%;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.tool>*{min-width:0}
.deriv{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin:10px 0;background:#fff}
.deriv h4{margin:0 0 6px;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 10px 8px 34px;border-bottom:1px dashed var(--line2);font-size:13.5px}
.steps li::before{content:counter(s);position:absolute;left:4px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--blue-bg);color:var(--brand-d);font-size:11px;font-weight:800;display:grid;place-items:center}

/* ---------- 表格/列表 ---------- */
.list{display:grid;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.li .no{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:52px}
.li .body{flex:1;min-width:0}
.li .act{display:flex;gap:5px;flex:none}
.tablewrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.tb th{background:#f5f8fd;font-weight:800;color:#0f2a5c}

/* ---------- 闪卡 ---------- */
.flash{max-width:640px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:16px;min-height:260px;padding:26px 28px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(22,32,47,.06)}
.flash .fl{font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:800}
.flash .fb{flex:1;display:flex;align-items:center;font-size:16px;line-height:1.9;padding:14px 0}
.flash .fa{border-top:1px dashed var(--line);padding-top:14px;font-size:14px}
.flash .acts{display:flex;gap:8px;margin-top:14px}

/* ---------- 响应式 ---------- */
@media(max-width:1180px){
  .layout{grid-template-columns:236px minmax(0,1fr)}
  .labtabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  aside.rail{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;z-index:60;left:0;top:0;bottom:0;width:280px;height:100vh;transform:translateX(-102%);transition:transform .22s;box-shadow:0 10px 40px rgba(0,0,0,.2);padding-top:18px}
  body.nav-open aside.side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(12,22,38,.38);z-index:55}
  .top .menu{display:inline-flex}
  .top .sub,.top .sep{display:none}
  main{padding:0 14px 70px}
  .hero{padding:22px 20px 20px;border-radius:14px}
  .hero h1{font-size:23px}
  .hero .deco{opacity:.28;width:60%}
  .reader{grid-template-columns:minmax(0,1fr)}
  .rnav{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}
  .rnav .h{display:none}
  .rnav a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px}
  .rbody{padding:16px 15px 22px}
  .filters{grid-template-columns:1fr 1fr}
  .filters label:nth-child(3),.filters label:nth-child(4){grid-column:1/-1}
  .qjump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qjump select{grid-column:1/-1;grid-row:1;width:100%}
  .qjump #prev{grid-column:1;grid-row:2}
  .qjump #next{grid-column:2;grid-row:2}
  .top .right span{display:none}
  body.bank.nav-open::after{display:none}
  .grid2,.grid3,.tool{grid-template-columns:1fr}
  .labtabs{grid-template-columns:1fr 1fr}
  .powergrid{grid-template-columns:1fr 1fr}
  .pwsum{grid-template-columns:1fr 1fr}
  .labtabs .labtab:last-child:nth-child(odd){grid-column:1/-1}
  .chaplist{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{min-height:104px;padding:12px}
  .tile b{font-size:13.5px}
  .tile span{font-size:11px}
  .qcard{padding:14px 14px 13px}
  .bhead h1{font-size:23px}
  .doc{font-size:14.5px}
  .doc .eq{font-size:16px}
  body.bank main{padding:0 12px 70px}
}
@media(max-width:560px){
  .powergrid{grid-template-columns:1fr}
}
@media(max-width:420px){
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile b{font-size:12.8px}
  .hero h1{font-size:21px}
}
@media print{
  .top,aside.side,aside.rail,.filters,.qfoot,.navq,.hero .acts{display:none!important}
  .layout{display:block}
  body{background:#fff}
  .doc details.sol .body{display:block!important}
}
</style>

<script>window.COURSE={"id":"signals","name":"信号与系统","chapters":[{"n":0,"title":"考前速查表（背这一页）","intro":"","sections":[{"id":"s00","title":"考前速查表（背这一页）","html":"\u003cp class=\"lead\">这一章是全书的“压缩包”。考试前 30 分钟只看这里，把表格里的东西默写一遍，能覆盖大部分计算题的第一步。\u003c/p>\u003ch3>0.1 常用傅里叶变换对\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:44%\">时域 \u003cspan class=\"eq\">x(t)\u003c/span>\u003c/th>\u003cth>频域 \u003cspan class=\"eq\">X(jω)\u003c/span>\u003c/th>\u003cth style=\"width:26%\">记忆点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">δ(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">1\u003c/span>\u003c/td>\u003ctd>冲激包含所有频率，且等幅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">1\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">2πδ(ω)\u003c/span>\u003c/td>\u003ctd>直流只在 ω=0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">πδ(ω) + 1/(jω)\u003c/span>\u003c/td>\u003ctd>直流 + 衰减\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">sgn(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">2/(jω)\u003c/span>\u003c/td>\u003ctd>无直流，只有 1/ω\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−αt\u003c/sup>u(t)\u003c/span>（α&gt;0）\u003c/td>\u003ctd>\u003cspan class=\"eq\">1/(α + jω)\u003c/span>\u003c/td>\u003ctd>单边指数，最常考\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−α|t|\u003c/sup>\u003c/span>（α&gt;0）\u003c/td>\u003ctd>\u003cspan class=\"eq\">2α/(α² + ω²)\u003c/span>\u003c/td>\u003ctd>双边指数，相位为 0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>jω₀t\u003c/sup>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">2πδ(ω − ω₀)\u003c/span>\u003c/td>\u003ctd>单根谱线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">cos ω₀t\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">π[δ(ω − ω₀) + δ(ω + ω₀)]\u003c/span>\u003c/td>\u003ctd>一对谱线，各 π\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">sin ω₀t\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">jπ[δ(ω + ω₀) − δ(ω − ω₀)]\u003c/span>\u003c/td>\u003ctd>注意 j 与负号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">p\u003csub>τ\u003c/sub>(t)\u003c/span>（宽 τ、高 1 的矩形）\u003c/td>\u003ctd>\u003cspan class=\"eq\">τ·Sa(ωτ/2)\u003c/span>\u003c/td>\u003ctd>矩形 ↔ Sa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Sa(ω\u003csub>c\u003c/sub>t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(π/ω\u003csub>c\u003c/sub>)·p\u003csub>2ω\u003csub>c\u003c/sub>\u003c/sub>(ω)\u003c/span>\u003c/td>\u003ctd>Sa ↔ 矩形\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">δ\u003csub>T\u003c/sub>(t) = Σδ(t − nT)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">ω₀Σδ(ω − nω₀)，ω₀ = 2π/T\u003c/span>\u003c/td>\u003ctd>冲激串 ↔ 冲激串\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 0-1　傅里叶变换对（\u003cspan class=\"eq\">Sa(x) = sin x / x\u003c/span>）\u003c/p>\u003ch3>0.2 必背卷积公式\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:50%\">卷积\u003c/th>\u003cth>结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>αt\u003c/sup>u(t) ∗ e\u003csup>βt\u003c/sup>u(t)\u003c/span>，α ≠ β\u003c/td>\u003ctd>\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">e\u003csup>βt\u003c/sup> − e\u003csup>αt\u003c/sup>\u003c/span>\u003cspan class=\"fd\">β − α\u003c/span>\u003c/span> u(t)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">e\u003csup>αt\u003c/sup>u(t) ∗ e\u003csup>αt\u003c/sup>u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">t·e\u003csup>αt\u003c/sup>u(t)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">α\u003csup>k\u003c/sup>u[k] ∗ β\u003csup>k\u003c/sup>u[k]\u003c/span>，α ≠ β\u003c/td>\u003ctd>\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">β\u003csup>k+1\u003c/sup> − α\u003csup>k+1\u003c/sup>\u003c/span>\u003cspan class=\"fd\">β − α\u003c/span>\u003c/span> u[k]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">α\u003csup>k\u003c/sup>u[k] ∗ α\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(k + 1)α\u003csup>k\u003c/sup>u[k]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">u(t) ∗ u(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">t·u(t)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">u[k] ∗ u[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(k + 1)u[k]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">x(t) ∗ δ(t − t₀)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t − t₀)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>两个宽 1、高 1 的矩形卷积\u003c/td>\u003ctd>底宽 2、高 1 的三角形\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 0-2　卷积“秒杀”公式（考场上直接套，省 5 分钟）\u003c/p>\u003ch3>0.3 齐次解与特解的形式\u003c/h3>\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>齐次解 \u003cspan class=\"eq\">y\u003csub>h\u003c/sub>\u003c/span> 看特征根\u003c/b>\u003ctable style=\"margin-top:8px\">\u003ctbody>\u003ctr>\u003ctd>互异实根 \u003cspan class=\"eq\">s₁, s₂, …, s\u003csub>n\u003c/sub>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">Σ K\u003csub>i\u003c/sub>e\u003csup>s\u003csub>i\u003c/sub>t\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r 重实根 \u003cspan class=\"eq\">s\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">(K₁ + K₂t + … + K\u003csub>r\u003c/sub>t\u003csup>r−1\u003c/sup>)e\u003csup>st\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>共轭复根 \u003cspan class=\"eq\">α ± jβ\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>αt\u003c/sup>(A cos βt + B sin βt)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"card\">\u003cb>特解 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub>\u003c/span> 看输入（连续）\u003c/b>\u003ctable style=\"margin-top:8px\">\u003ctbody>\u003ctr>\u003ctd>常数 \u003cspan class=\"eq\">K\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">A\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Kt\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">At + B\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Ke\u003csup>at\u003c/sup>\u003c/span>（a 不是根）\u003c/td>\u003ctd>\u003cspan class=\"eq\">Ae\u003csup>at\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Ke\u003csup>at\u003c/sup>\u003c/span>（a 是单根）\u003c/td>\u003ctd>\u003cspan class=\"eq\">Ate\u003csup>at\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">K sin ω₀t\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">A sin ω₀t + B cos ω₀t\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003ch3>0.4 三条主线，一张图记住\u003c/h3>\u003cdiv class=\"flow\">\u003cdiv class=\"box\">\u003cb>输入 x\u003c/b>信号分解\u003cbr>δ / 复指数\u003c/div>\u003cdiv class=\"arw\">→\u003c/div>\u003cdiv class=\"box\">\u003cb>系统 T\u003c/b>线性 + 时不变\u003cbr>h(t) / H(jω)\u003c/div>\u003cdiv class=\"arw\">→\u003c/div>\u003cdiv class=\"box\">\u003cb>输出 y\u003c/b>卷积 / 相乘\u003cbr>时域 ↔ 频域\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>一句话总纲：\u003c/b>时域里，输出 = 输入 ∗ 冲激响应；频域里，输出 = 输入频谱 × 系统函数。所有章节都在反复讲这一件事。\n\u003c/div>\u003ch3>0.5 判定口诀\u003c/h3>\u003cdiv class=\"tip\">\u003cb>线性：\u003c/b>只看“一次方”，有平方、乘积、常数项就不是线性。\u003cbr>\u003cb>时不变：\u003c/b>把 x(t) 换成 x(t−t₀)，看输出是不是也整体平移 t₀；t 前有系数（如 x(2t)）一定时变。\u003cbr>\u003cb>因果：\u003c/b>输出不超前；x(2t)、x(t+1) 这类“提前取未来值”的都非因果。\u003cbr>\u003cb>稳定：\u003c/b>连续看 \u003cspan class=\"eq\">∫|h(t)|dt &lt; ∞\u003c/span>，离散看 \u003cspan class=\"eq\">Σ|h[k]| &lt; ∞\u003c/span>。\n\u003c/div>\u003ch3>0.6 复频域速查（第 7、8 章压缩版）\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:24%\">项目\u003c/th>\u003cth style=\"width:38%\">连续（拉普拉斯）\u003c/th>\u003cth>离散（Z 变换）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>变换定义\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(s)=∫\u003csub>0\u003csup>−\u003c/sup>\u003c/sub>\u003csup>∞\u003c/sup>x(t)e\u003csup>−st\u003c/sup>dt\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">X(z)=\u003cspan class=\"sum\">Σ\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">k=0\u003c/span>\u003c/span>\u003c/span>x[k]z\u003csup>−k\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基本对\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>u(t) ⟷ 1/(s+a)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">a\u003csup>k\u003c/sup>u[k] ⟷ z/(z−a)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>阶跃\u003c/td>\u003ctd>\u003cspan class=\"eq\">u(t) ⟷ 1/s\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">u[k] ⟷ z/(z−1)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>微分 / 位移\u003c/td>\u003ctd>\u003cspan class=\"eq\">x′(t) ⟷ sX(s) − x(0\u003csup>−\u003c/sup>)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">x[k−1] ⟷ z\u003csup>−1\u003c/sup>X(z)+x[−1]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>系统函数\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(s)=B(s)/A(s)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(z)=B(z)/A(z)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频响\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(jω)=H(s)|\u003csub>s=jω\u003c/sub>\u003c/span>（需稳定）\u003c/td>\u003ctd>\u003cspan class=\"eq\">H(e\u003csup>jΩ\u003c/sup>)=H(z)|\u003csub>z=e\u003csup>jΩ\u003c/sup>\u003c/sub>\u003c/span>（需稳定）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>稳定（因果）\u003c/td>\u003ctd>全部极点在\u003cb>左半 s 平面\u003c/b>\u003c/td>\u003ctd>全部极点在\u003cb>单位圆内\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>反变换\u003c/td>\u003ctd>部分分式 + 遮盖法\u003c/td>\u003ctd>先对 \u003cspan class=\"eq\">X(z)/z\u003c/span> 展开，再乘回 z\u003c/td>\u003c/tr>\u003ctr>\u003ctd>初值 / 终值\u003c/td>\u003ctd>\u003cspan class=\"eq\">lim\u003csub>s→∞\u003c/sub>sX(s)\u003c/span> / \u003cspan class=\"eq\">lim\u003csub>s→0\u003c/sub>sX(s)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">lim\u003csub>z→∞\u003c/sub>X(z)\u003c/span> / \u003cspan class=\"eq\">lim\u003csub>z→1\u003c/sub>(z−1)X(z)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3>0.7 全书公式地图（一页看完全课程）\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:26%\">分析域\u003c/th>\u003cth style=\"width:36%\">信号分解\u003c/th>\u003cth>系统描述 → 输出\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>时域\u003c/td>\u003ctd>\u003cspan class=\"eq\">x(t)=∫x(τ)δ(t−τ)dτ\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = x ∗ h\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域（连续）\u003c/td>\u003ctd>傅里叶级数 / 傅里叶变换\u003c/td>\u003ctd>\u003cspan class=\"eq\">Y(jω)=X(jω)H(jω)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>频域（离散）\u003c/td>\u003ctd>DFS / DTFT\u003c/td>\u003ctd>\u003cspan class=\"eq\">Y(e\u003csup>jΩ\u003c/sup>)=X(e\u003csup>jΩ\u003c/sup>)H(e\u003csup>jΩ\u003c/sup>)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复频域（连续）\u003c/td>\u003ctd>单边/双边拉普拉斯变换\u003c/td>\u003ctd>\u003cspan class=\"eq\">Y(s)=X(s)H(s)\u003c/span> ＋ 初值项\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复频域（离散）\u003c/td>\u003ctd>单边/双边 Z 变换\u003c/td>\u003ctd>\u003cspan class=\"eq\">Y(z)=X(z)H(z)\u003c/span> ＋ 初值项\u003c/td>\u003c/tr>\u003ctr>\u003ctd>状态空间\u003c/td>\u003ctd>状态变量 \u003cspan class=\"eq\">q\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">q′=Aq+Bx，y=Cq+Dx\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"tip\">\u003cb>全书只有一句话：\u003c/b>把信号拆成某种「基本单元」，让 LTI 系统分别作用（乘 \u003cspan class=\"eq\">h\u003c/span> / \u003cspan class=\"eq\">H\u003c/span>），再叠加。\u003cb>换分解方式，就换一个章节。\u003c/b>考场上先判断题目在哪个域，再选对应的公式，就不会乱。\u003c/div>\u003c/section>"}]},{"n":1,"title":"信号与系统基础","intro":"\u003cb>对应课件：\u003c/b>L01（CH1）、L02–L04（CH2）\u003cbr>\u003cb>本章在考试里的位置：\u003c/b>通常 10～20 分，以选择、填空、判断、画图为主。它不直接出大题，但后面所有章节都在用它——\u003cb>δ 函数用错，卷积必错；系统性质判断错，频域分析也救不回来。\u003c/b>\u003cbr>\u003cb>本章要拿到手的四件事：\u003c/b>① 会判断信号类型；② 会用 δ 的抽样性；③ 会画 x(at+b)；④ 会判断线性/时不变/因果/稳定。","sections":[{"id":"s11","title":"1.1 信号分类与能量、功率","html":"\u003cp>信号就是“某个物理量随时间（或空间）变化”的记录，写成 \u003cspan class=\"eq\">x(t)\u003c/span>（连续）或 \u003cspan class=\"eq\">x[k]\u003c/span>（离散）。系统则是把输入信号变成输出信号的“加工厂”，记作 \u003cspan class=\"eq\">y = T{x}\u003c/span>。\u003c/p>\u003cp>考试里最先要分清的是下面四组概念：\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:22%\">分类\u003c/th>\u003cth>判据\u003c/th>\u003cth>典型例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>连续 / 离散\u003c/td>\u003ctd>时间变量是否连续取值\u003c/td>\u003ctd>\u003cspan class=\"eq\">sin t\u003c/span> / \u003cspan class=\"eq\">sin(0.3k)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周期 / 非周期\u003c/td>\u003ctd>是否存在 \u003cspan class=\"eq\">T\u003c/span> 使 \u003cspan class=\"eq\">x(t+T)=x(t)\u003c/span> 恒成立\u003c/td>\u003ctd>\u003cspan class=\"eq\">cos 2t\u003c/span> / \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>u(t)\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>能量 / 功率\u003c/td>\u003ctd>总能量有限 → 能量信号；平均功率有限且非零 → 功率信号\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−2t\u003c/sup>u(t)\u003c/span> / \u003cspan class=\"eq\">sin t\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>确定 / 随机\u003c/td>\u003ctd>能否用确定的数学式子描述\u003c/td>\u003ctd>\u003cspan class=\"eq\">cos t\u003c/span> / 噪声\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"kp\">\u003cspan class=\"t\">能量与功率的定义\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">E = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> |x(t)|² dt，　P = lim\u003csub>T→∞\u003c/sub>\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">T/2\u003c/span>\u003cspan class=\"l\">−T/2\u003c/span>\u003c/span>\u003c/span> |x(t)|² dt\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">离散把积分换成求和即可：\u003cspan class=\"eq\">E = Σ|x[k]|²\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"tip\">\u003cb>通俗理解：\u003c/b>能量信号像“一次性闪光灯”——总能量有限，但平均到无限长时间上功率为 0；功率信号像“长明灯”——总能量无穷，但平均功率是一个有限的正数。\u003cb>周期信号一定是功率信号\u003c/b>，有限长的信号一定是能量信号。\n\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-1　判断信号类型\u003c/span>\u003cspan class=\"tag\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>判断下列信号是能量信号还是功率信号：\u003c/p>\u003cp>(1) \u003cspan class=\"eq\">x₁(t) = e\u003csup>−2t\u003c/sup>u(t)\u003c/span>　　(2) \u003cspan class=\"eq\">x₂(t) = u(t)\u003c/span>　　(3) \u003cspan class=\"eq\">x₃(t) = 3cos(2t)\u003c/span>\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>(1)\u003c/b> 先算能量：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">E = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span> e\u003csup>−4t\u003c/sup>dt = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">4\u003c/span>\u003c/span> &lt; ∞\u003c/span>\u003c/div>\u003cp>能量有限，所以是\u003cb>能量信号\u003c/b>，功率 \u003cspan class=\"eq\">P = 0\u003c/span>。\u003cbr>\u003cb>思路：\u003c/b>看到 \u003cspan class=\"eq\">e\u003csup>−at\u003c/sup>u(t)\u003c/span>（a&gt;0）就想到“衰减得足够快，积分收敛”。\u003c/p>\u003cp>\u003cb>(2)\u003c/b>\u003cspan class=\"eq\">E = ∫\u003csub>0\u003c/sub>\u003csup>∞\u003c/sup>1²dt → ∞\u003c/span>，能量无穷；但\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = lim\u003csub>T→∞\u003c/sub>\u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">T\u003c/span>\u003c/span>\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">T\u003c/span>\u003cspan class=\"l\">0\u003c/span>\u003c/span>\u003c/span>1 dt = 1\u003c/span>\u003c/div>\u003cp>平均功率有限且不为零，是\u003cb>功率信号\u003c/b>。\u003c/p>\u003cp>\u003cb>(3)\u003c/b> 周期信号，直接套周期信号功率公式：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">P = \u003cspan class=\"fr\">\u003cspan class=\"fn\">A²\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">9\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span> = 4.5\u003c/span>\u003c/div>\u003cp>是\u003cb>功率信号\u003c/b>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>不要看到“无限长”就判成能量无穷、功率无穷。阶跃、正弦都是功率信号；只有像 \u003cspan class=\"eq\">t·u(t)\u003c/span> 这种“越涨越大”的才既不是能量也不是功率信号。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s12","title":"1.2 基本信号与 δ 函数","html":"\u003cp>这一节是整门课的“字母表”。后面所有的推导，都是拿这几个基本信号拼出来的。\u003c/p>\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>单位阶跃 \u003cspan class=\"eq\">u(t)\u003c/span>\u003c/b>\u003cdiv class=\"formula\" style=\"margin:8px 0\">\u003cspan class=\"eq\">u(t) = 1 (t&gt;0)，　0 (t&lt;0)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0;font-size:14.5px\">作用：\u003cb>“开门”\u003c/b>。乘上 \u003cspan class=\"eq\">u(t)\u003c/span>，信号就从 t=0 开始才有，表示因果性。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003cb>单位冲激 \u003cspan class=\"eq\">δ(t)\u003c/span>\u003c/b>\u003cdiv class=\"formula\" style=\"margin:8px 0\">\u003cspan class=\"eq\">δ(t) = 0 (t≠0)，　\u003cspan style=\"font-size:1.3em\">∫\u003c/span>δ(t)dt = 1\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0;font-size:14.5px\">作用：\u003cb>“取样器”＋“探针”\u003c/b>。它宽度趋于 0、面积为 1，用来测系统的冲激响应。\u003c/p>\u003c/div>\u003c/div>\u003ch4>δ(t) 的五条性质（必须背）\u003c/h4>\u003cdiv class=\"kp\">\u003cspan class=\"t\">① 抽样性（最常考）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">b\u003c/span>\u003cspan class=\"l\">a\u003c/span>\u003c/span>\u003c/span> x(t)δ(t − t₀)dt = x(t₀)，　当 a &lt; t₀ &lt; b\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">若 \u003cspan class=\"eq\">t₀\u003c/span> 不在积分区间内，结果直接为 \u003cb>0\u003c/b>。这一条是选择题的常客。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">② 偶函数\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">δ(−t) = δ(t)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">③ 尺度变换\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">δ(at) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">|a|\u003c/span>\u003c/span> δ(t)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">例如 \u003cspan class=\"eq\">δ(2t) = ½δ(t)\u003c/span>，\u003cspan class=\"eq\">δ(−3t) = ⅓δ(t)\u003c/span>。\u003cb>注意是 |a|，负号会被吃掉。\u003c/b>\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">④ 与 u(t) 的关系\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">u(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span> δ(τ)dτ，　δ(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">du(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">阶跃求导得冲激，冲激积分得阶跃。做题时“看到 δ 想积分，看到 u 想求导”。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">⑤ 乘积性质\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(t)·δ(t − t₀) = x(t₀)·δ(t − t₀)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">δ 只“挑出”它所在时刻的函数值，其余全被压成 0。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-2　δ 函数的抽样性（课堂原题）\u003c/span>\u003cspan class=\"tag\">必考\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>计算　\u003cspan class=\"eq\">x = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">1\u003c/span>\u003cspan class=\"l\">−1\u003c/span>\u003c/span>\u003c/span> (2t² + 1)·δ(t − 2) dt\u003c/span>\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>答案：0\u003c/b>\u003c/p>\u003cp>\u003cb>为什么：\u003c/b>抽样性要求“冲激所在的位置 t₀ 落在积分区间内”。这里 \u003cspan class=\"eq\">t₀ = 2\u003c/span>，而积分区间是 \u003cspan class=\"eq\">[−1, 1]\u003c/span>，2 根本不在里面，所以整个积分是 0。\u003c/p>\u003cp>\u003cb>如果题目改成\u003c/b>\u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>\u003c/span>，答案才是 \u003cspan class=\"eq\">2×2² + 1 = 9\u003c/span>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>90% 的人会直接算成 9。做这类题，\u003cb>第一步永远先看积分上下限包不包含冲激点\u003c/b>，再代值。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-3　δ 与普通函数相乘\u003c/span>\u003cspan class=\"tag g\">巩固\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>化简　\u003cspan class=\"eq\">(t² + 3t)·δ(t − 1)\u003c/span>，并求 \u003cspan class=\"eq\">∫\u003csub>−∞\u003c/sub>\u003csup>∞\u003c/sup>(t² + 3t)δ(t − 1)dt\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>由乘积性质，把 \u003cspan class=\"eq\">t = 1\u003c/span> 代进去：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">(t² + 3t)δ(t − 1) = (1 + 3)δ(t − 1) = 4δ(t − 1)\u003c/span>\u003c/div>\u003cp>再积分，δ 的面积为 1，所以结果为 \u003cb>4\u003c/b>。\u003c/p>\u003cp>\u003cb>一句话：\u003c/b>δ 是“取值器”——它只关心自己脚下那一点的函数值。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003ch4>其他几个常客\u003c/h4>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:26%\">信号\u003c/th>\u003cth>表达式 / 特点\u003c/th>\u003cth style=\"width:30%\">考试用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>符号函数 \u003cspan class=\"eq\">sgn(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">t&gt;0 取 1，t&lt;0 取 −1\u003c/span>\u003c/td>\u003ctd>其频谱 \u003cspan class=\"eq\">2/(jω)\u003c/span>，推导 u(t) 频谱要用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>抽样函数 \u003cspan class=\"eq\">Sa(t)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">Sa(t) = sin t / t，Sa(0)=1\u003c/span>\u003c/td>\u003ctd>矩形脉冲的频谱；过零点在 \u003cspan class=\"eq\">t = ±kπ\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>单边指数\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>−αt\u003c/sup>u(t)，α&gt;0\u003c/span>\u003c/td>\u003ctd>频谱 \u003cspan class=\"eq\">1/(α+jω)\u003c/span>，最常考的变换对\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复指数\u003c/td>\u003ctd>\u003cspan class=\"eq\">e\u003csup>jω₀t\u003c/sup> = cos ω₀t + j sin ω₀t\u003c/span>\u003c/td>\u003ctd>LTI 系统的“特征函数”，傅里叶分析的基石\u003c/td>\u003c/tr>\u003ctr>\u003ctd>离散阶跃 / 冲激\u003c/td>\u003ctd>\u003cspan class=\"eq\">u[k]、δ[k]\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">δ[k]\u003c/span> 只在 k=0 为 1；\u003cspan class=\"eq\">u[k]\u003c/span> 从 k=0 起为 1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"note\">\u003cb>为什么偏偏用复指数做“基本单元”？\u003c/b>因为复指数信号输入 LTI 系统后，输出仍然是\u003cb>同频率\u003c/b>的复指数，只是幅度和相位变了（\u003cspan class=\"eq\">e\u003csup>jωt\u003c/sup> → H(jω)e\u003csup>jωt\u003c/sup>\u003c/span>）。这就像敲音叉：你敲 440 Hz，它回给你的还是 440 Hz，只是变轻了。正因为“频率不变”，我们才能一个频率一个频率地分析——这就是傅里叶分析的全部出发点。\n\u003c/div>"},{"id":"s13","title":"1.3 信号运算与画图（重点）","html":"\u003cp>信号的加、乘、微分、积分都不难，真正容易丢分的是\u003cb>平移、反转、尺度\u003c/b>这三件事混在一起的时候。\u003c/p>\u003cdiv class=\"kp\">\u003cspan class=\"t\">三步法：画 x(at + b)\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>先把括号里的 \u003cspan class=\"eq\">at + b\u003c/span> 写成 \u003cspan class=\"eq\">a(t + b/a)\u003c/span>，看清“先平移多少、再压缩多少”。\u003c/li>\u003cli>\u003cb>先平移\u003c/b>：画出 \u003cspan class=\"eq\">x(t + b/a)\u003c/span>（左加右减，与直觉相反要小心）。\u003c/li>\u003cli>\u003cb>再尺度\u003c/b>：\u003cspan class=\"eq\">|a|&gt;1\u003c/span> 横向压缩 \u003cspan class=\"eq\">1/|a|\u003c/span> 倍；\u003cspan class=\"eq\">|a|&lt;1\u003c/span> 拉伸；\u003cspan class=\"eq\">a&lt;0\u003c/span> 再关于纵轴反转。\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-4　画 x(2 − 2t)\u003c/span>\u003cspan class=\"tag\">画图题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知 \u003cspan class=\"eq\">x(t)\u003c/span> 是宽度为 2、以原点为中心的三角形（顶点在 (0,1)，底边从 −1 到 1）。画出 \u003cspan class=\"eq\">x(2 − 2t)\u003c/span>。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步，改写成标准形式：\u003c/b>\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">x(2 − 2t) = x(−2(t − 1))\u003c/span>\u003c/div>\u003cp>这告诉我们：先\u003cb>右移 1\u003c/b>，再\u003cb>关于纵轴反转\u003c/b>，最后\u003cb>横向压缩 2 倍\u003c/b>。\u003c/p>\u003cp>\u003cb>第二步，抓三个关键点（最快的方法）：\u003c/b>原来三角形的三个拐点是 \u003cspan class=\"eq\">t = −1, 0, 1\u003c/span>，对应函数值 \u003cspan class=\"eq\">0, 1, 0\u003c/span>。令 \u003cspan class=\"eq\">2 − 2t\u003c/span> 分别等于这三个值：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">2 − 2t = −1 → t = 1.5\u003c/span>，值 0\u003c/li>\u003cli>\u003cspan class=\"eq\">2 − 2t = 0 → t = 1\u003c/span>，值 1\u003c/li>\u003cli>\u003cspan class=\"eq\">2 − 2t = 1 → t = 0.5\u003c/span>，值 0\u003c/li>\u003c/ul>\u003cp>所以新图形是：底边从 \u003cspan class=\"eq\">t = 0.5\u003c/span> 到 \u003cspan class=\"eq\">1.5\u003c/span>（宽度 1），顶点在 \u003cspan class=\"eq\">t = 1\u003c/span>、高度仍为 1 的三角形。\u003c/p>\u003cdiv class=\"tip\">\u003cb>考场技巧：\u003c/b>不要真的去“先平移再反转”，容易绕晕。\u003cb>直接解方程 at+b = 原关键点\u003c/b>，把三五个拐点的新位置算出来，连点成线，30 秒搞定，而且不会错。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"warn\">\u003cb>易错点：\u003c/b>① 平移方向记反（\u003cspan class=\"eq\">x(t−2)\u003c/span> 是\u003cb>右\u003c/b>移 2，不是左移）；② 反转和尺度顺序搞混，导致图形位置差一个负号；③ 只改横坐标忘了纵坐标不变（平移、反转、尺度都\u003cb>不影响幅度\u003c/b>，除非外面乘了系数）。\n\u003c/div>"},{"id":"s14","title":"1.4 系统性质判定（选择题必考）","html":"\u003cp>描述一个系统，就是描述它对输入做了什么。考试只考五个性：\u003cb>线性、时不变、因果、稳定、记忆性\u003c/b>。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:16%\">性质\u003c/th>\u003cth>数学定义\u003c/th>\u003cth>人话版\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>线性\u003c/td>\u003ctd>\u003cspan class=\"eq\">T{a x₁ + b x₂} = a T{x₁} + b T{x₂}\u003c/span>\u003c/td>\u003ctd>“输入翻倍，输出翻倍；输入相加，输出相加”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>时不变\u003c/td>\u003ctd>若 \u003cspan class=\"eq\">x(t)→y(t)\u003c/span>，则 \u003cspan class=\"eq\">x(t−t₀)→y(t−t₀)\u003c/span>\u003c/td>\u003ctd>“今天敲和明天敲，响应形状一样，只是晚一点”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>因果\u003c/td>\u003ctd>输出只与 \u003cspan class=\"eq\">t\u003c/span> 及以前的输入有关\u003c/td>\u003ctd>“不能未卜先知”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>稳定\u003c/td>\u003ctd>有界输入 → 有界输出（BIBO）\u003c/td>\u003ctd>“输入不爆炸，输出就不爆炸”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>无记忆\u003c/td>\u003ctd>输出只取决于当前时刻的输入\u003c/td>\u003ctd>“只看眼前，不翻旧账”\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-5　四个典型系统，一次判完\u003c/span>\u003cspan class=\"tag\">高频\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>判断下列系统的线性、时不变、因果、稳定性：\u003c/p>\u003cp>(1) \u003cspan class=\"eq\">y(t) = x(t)cos(2πt)\u003c/span>　(2) \u003cspan class=\"eq\">y(t) = x(2t)\u003c/span>　(3) \u003cspan class=\"eq\">y(t) = x²(t)\u003c/span>　(4) \u003cspan class=\"eq\">y(t) = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>x(τ)dτ\u003c/span>\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>(1) \u003cspan class=\"eq\">y = x(t)cos(2πt)\u003c/span>\u003c/b>：线性（乘以一个与 x 无关的时间函数，满足齐次与可加）；\u003cb>时变\u003c/b>（把输入延迟 t₀，输出变成 \u003cspan class=\"eq\">x(t−t₀)cos(2πt)\u003c/span>，而 \u003cspan class=\"eq\">y(t−t₀) = x(t−t₀)cos(2π(t−t₀))\u003c/span>，两者不相等）；因果；稳定（\u003cspan class=\"eq\">|y| ≤ |x|\u003c/span>）；无记忆。\u003c/p>\u003cp>\u003cb>(2) \u003cspan class=\"eq\">y = x(2t)\u003c/span>\u003c/b>：线性；\u003cb>时变\u003c/b>（时间被压缩，延迟量对不上）；\u003cb>非因果\u003c/b>（t=1 时要用到 x(2)，是“未来”的值）；稳定。\u003c/p>\u003cp>\u003cb>(3) \u003cspan class=\"eq\">y = x²(t)\u003c/span>\u003c/b>：\u003cb>非线性\u003c/b>（\u003cspan class=\"eq\">(ax)² ≠ a x²\u003c/span>）；时不变；因果；稳定（输入有界则平方也有界）；无记忆。\u003c/p>\u003cp>\u003cb>(4) 积分器\u003c/b>：线性；时不变；因果；\u003cb>不稳定\u003c/b>——输入 \u003cspan class=\"eq\">u(t)\u003c/span> 有界（最大 1），输出却是 \u003cspan class=\"eq\">t·u(t)\u003c/span>，随时间无限增大。\u003c/p>\u003cdiv class=\"tip\">\u003cb>判稳定的快速法：\u003c/b>先看系统里有没有“累加/积分”这种会存东西的结构。积分器、累加器对阶跃输入都会线性增长，因此通常不稳定。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-6　带常数项的系统\u003c/span>\u003cspan class=\"tag g\">易错\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>判断 \u003cspan class=\"eq\">y(t) = 3x(t) + 2\u003c/span> 是否线性、时不变。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>非线性。\u003c/b>检验齐次性：输入 \u003cspan class=\"eq\">2x(t)\u003c/span> 时，输出是 \u003cspan class=\"eq\">6x(t)+2\u003c/span>，而 \u003cspan class=\"eq\">2y(t) = 6x(t)+4\u003c/span>，两者不相等。\u003c/p>\u003cp>\u003cb>时不变。\u003c/b>把输入延迟 t₀：\u003cspan class=\"eq\">3x(t−t₀)+2\u003c/span>，恰好等于 \u003cspan class=\"eq\">y(t−t₀)\u003c/span>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>记住：\u003c/b>只要式子里有“与输入无关的常数项”（如 +2、+1），就一定非线性；但常数项\u003cb>不影响\u003c/b>时不变性。这两个性质是分开判的，别混。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s15","title":"1.5 LTI 系统的描述与两个“神技”","html":"\u003cp>LTI = Linear Time-Invariant，线性时不变。这是本课程的主角，因为只有它才有 \u003cspan class=\"eq\">y = x ∗ h\u003c/span> 这么漂亮的关系。\u003c/p>\u003cdiv class=\"kp\">\u003cspan class=\"t\">连续系统：常系数线性微分方程\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csup>(n)\u003c/sup>(t) + a\u003csub>n−1\u003c/sub>y\u003csup>(n−1)\u003c/sup>(t) + … + a₀y(t) = b\u003csub>m\u003c/sub>x\u003csup>(m)\u003c/sup>(t) + … + b₀x(t)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">初始条件一般给 \u003cspan class=\"eq\">y(0⁻), y′(0⁻), …\u003c/span>，表示系统在输入接入\u003cb>之前\u003c/b>的“存量”。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">离散系统：常系数线性差分方程\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y[k] + a₁y[k−1] + … + a\u003csub>n\u003c/sub>y[k−n] = b₀x[k] + b₁x[k−1] + … + b\u003csub>m\u003c/sub>x[k−m]\u003c/span>\u003c/div>\u003c/div>\u003ch4>LTI 的两个“神技”：微分特性和积分特性\u003c/h4>\u003cdiv class=\"card\">\u003cp style=\"margin-top:0\">如果 \u003cspan class=\"eq\">T{x(t)} = y(t)\u003c/span>，那么对 LTI 系统一定有：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">T{\u003cspan class=\"fr\">\u003cspan class=\"fn\">dx(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span>} = \u003cspan class=\"fr\">\u003cspan class=\"fn\">dy(t)\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span>，　　T{\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>x(τ)dτ} = \u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">t\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>y(τ)dτ\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">离散版：\u003cspan class=\"eq\">T{x[k] − x[k−1]} = y[k] − y[k−1]\u003c/span>，\u003cspan class=\"eq\">T{Σx[n]} = Σy[n]\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-7　利用微分特性“偷答案”\u003c/span>\u003cspan class=\"tag g\">技巧\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知某 LTI 系统对输入 \u003cspan class=\"eq\">u(t)\u003c/span> 的零状态响应是 \u003cspan class=\"eq\">g(t) = (1 − e\u003csup>−2t\u003c/sup>)u(t)\u003c/span>。求输入为 \u003cspan class=\"eq\">δ(t)\u003c/span> 时的响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>因为 \u003cspan class=\"eq\">δ(t) = du(t)/dt\u003c/span>，由微分特性，输出也要求导：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">h(t) = g′(t) = 2e\u003csup>−2t\u003c/sup>u(t) + (1 − e\u003csup>−2t\u003c/sup>)δ(t) = 2e\u003csup>−2t\u003c/sup>u(t)\u003c/span>\u003c/div>\u003cp>最后一步是因为 \u003cspan class=\"eq\">(1 − e\u003csup>−2t\u003c/sup>)\u003c/span> 在 \u003cspan class=\"eq\">t=0\u003c/span> 处等于 0，把 δ 项“消掉”了。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"note\">\u003cb>本章小结：\u003c/b>认识信号、会画图、会判系统——就这三件事。下一章进入“给方程求输出”的主战场。\n\u003c/div>"},{"id":"s16","title":"1.6 奇异信号家族与信号分解（CH2 补充）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">四种奇异信号的微积分链条\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">δ′(t) ← \u003cspan class=\"fr\">\u003cspan class=\"fn\">d\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> ← δ(t) ← \u003cspan class=\"fr\">\u003cspan class=\"fn\">d\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> ← u(t) ← \u003cspan class=\"fr\">\u003cspan class=\"fn\">d\u003c/span>\u003cspan class=\"fd\">dt\u003c/span>\u003c/span> ← r(t) = t·u(t)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cspan class=\"eq\">r(t)\u003c/span> 是\u003cb>斜坡信号\u003c/b>（单位斜率的斜线），\u003cspan class=\"eq\">δ′(t)\u003c/span> 是\u003cb>冲激偶\u003c/b>。记忆方向：\u003cb>往右是积分，往左是求导\u003c/b>。任意一个都可以用另外两个表示，例如 \u003cspan class=\"eq\">u(t)=r′(t)\u003c/span>、\u003cspan class=\"eq\">δ(t)=u′(t)\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">冲激偶 δ′(t) 的两条性质\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">\u003cspan class=\"intg\">∫\u003cspan class=\"lim\">\u003cspan class=\"u\">∞\u003c/span>\u003cspan class=\"l\">−∞\u003c/span>\u003c/span>\u003c/span>x(t)δ′(t − t₀)dt = −x′(t₀)，　x(t)δ′(t) = x(0)δ′(t) − x′(0)δ(t)\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">第一条叫「筛选特性」：\u003cb>δ′ 挑出的是函数的导数值，还带一个负号\u003c/b>（分部积分得来）。选择题常拿它和 δ 的抽样性混着考。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">信号的四种分解（CH2 L04）\u003c/span>\u003cul style=\"margin-bottom:0\">\u003cli>\u003cb>直流 + 交流：\u003c/b>\u003cspan class=\"eq\">x(t) = x\u003csub>DC\u003c/sub> + x\u003csub>AC\u003c/sub>\u003c/span>，直流就是平均值；\u003c/li>\u003cli>\u003cb>奇分量 + 偶分量：\u003c/b>\u003cspan class=\"eq\">x\u003csub>e\u003c/sub>(t)=½[x(t)+x(−t)]\u003c/span>，\u003cspan class=\"eq\">x\u003csub>o\u003c/sub>(t)=½[x(t)−x(−t)]\u003c/span>；\u003c/li>\u003cli>\u003cb>实部 + 虚部：\u003c/b>复信号 \u003cspan class=\"eq\">x(t)=x\u003csub>r\u003c/sub>(t)+jx\u003csub>i\u003c/sub>(t)\u003c/span>，对应 MATLAB 的 \u003cspan class=\"eq\">real / imag / abs / angle\u003c/span>；\u003c/li>\u003cli>\u003cb>冲激的线性组合：\u003c/b>\u003cspan class=\"eq\">x(t)=∫x(τ)δ(t−τ)dτ\u003c/span>——这是\u003cb>卷积法的理论源头\u003c/b>。\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 1-8　用 u(t) 和 r(t) 表示一个折线信号（课件原题）\u003c/span>\u003cspan class=\"tag g\">画图题\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>课件给出的 MATLAB 函数是 \u003cspan class=\"eq\">y = r(t+1) − r(t) − r(t−1) + r(t−2)\u003c/span>，说明它画的是什么波形。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cspan class=\"eq\">r(t+a)\u003c/span> 是在 \u003cspan class=\"eq\">t=−a\u003c/span> 处开始、斜率为 1 的斜线。把四个斜坡按斜率变化点叠加：\u003c/p>\u003cul>\u003cli>\u003cspan class=\"eq\">t &lt; −1\u003c/span>：全为 0 → \u003cspan class=\"eq\">y=0\u003c/span>；\u003c/li>\u003cli>\u003cspan class=\"eq\">−1 ≤ t &lt; 0\u003c/span>：只有 \u003cspan class=\"eq\">r(t+1)\u003c/span> 起作用 → 斜率 +1，线性上升；\u003c/li>\u003cli>\u003cspan class=\"eq\">0 ≤ t &lt; 1\u003c/span>：\u003cspan class=\"eq\">−r(t)\u003c/span> 加入 → 斜率变 0，\u003cb>平台\u003c/b>；\u003c/li>\u003cli>\u003cspan class=\"eq\">1 ≤ t &lt; 2\u003c/span>：\u003cspan class=\"eq\">−r(t−1)\u003c/span> 加入 → 斜率 −1，线性下降；\u003c/li>\u003cli>\u003cspan class=\"eq\">t ≥ 2\u003c/span>：\u003cspan class=\"eq\">+r(t−2)\u003c/span> 加入 → 斜率又变 0，回到 0。\u003c/li>\u003c/ul>\u003cp>所以是一个\u003cb>梯形\u003c/b>：在 −1～0 上升、0～1 平顶、1～2 下降。\u003c/p>\u003cdiv class=\"tip\">\u003cb>通用套路：\u003c/b>折线信号用斜坡函数写，\u003cb>每个拐点放一个 r，系数 = 该点斜率的变化量\u003c/b>。阶跃信号则用 u，系数 = 该点幅度的跳变量。这两种写法在填空里很常见。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s17","title":"1.7 离散信号、周期判定与抽取内插（CH2 补充）","html":"\u003cdiv class=\"kp\">\u003cspan class=\"t\">离散正弦序列的周期（和连续不一样！）\u003c/span>\u003cp style=\"margin:4px 0\">连续信号 \u003cspan class=\"eq\">sin ω₀t\u003c/span> 一定周期；离散序列 \u003cspan class=\"eq\">sin Ω₀k\u003c/span>\u003cb>不一定\u003c/b>周期，条件是：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">\u003cspan class=\"fr\">\u003cspan class=\"fn\">Ω₀\u003c/span>\u003cspan class=\"fd\">2π\u003c/span>\u003c/span> = \u003cspan class=\"fr\">\u003cspan class=\"fn\">m\u003c/span>\u003cspan class=\"fd\">N\u003c/span>\u003c/span> 为有理数 ⟹ 周期 N（取最小正整数）\u003c/span>\u003c/div>\u003cp style=\"margin-bottom:0\">例如 \u003cspan class=\"eq\">sin(0.8πk)\u003c/span>：\u003cspan class=\"eq\">0.8π/2π = 2/5\u003c/span> → 周期 5；\u003cspan class=\"eq\">cos(0.1πk)\u003c/span>：\u003cspan class=\"eq\">=1/20\u003c/span> → 周期 20；两者之和的周期是 \u003cspan class=\"eq\">lcm(5,20)=20\u003c/span>（课件复习题答案）。\u003c/p>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">抽取与内插（离散特有的尺度变换）\u003c/span>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">抽取 ↓M：x[k] → x[Mk]\u003c/span>（每隔 M−1 点取一点，时间压缩）\u003cbr>\u003cspan class=\"eq\">内插 ↑L：两点之间插入 L−1 个零\u003c/span>（时间展宽）\u003c/div>\u003cp style=\"margin-bottom:0\">\u003cb>注意：\u003c/b>连续信号 \u003cspan class=\"eq\">x(2t)\u003c/span> 只是压缩，不会丢点；离散抽取会\u003cb>真的丢掉样本\u003c/b>，可能引起频谱混叠，所以抽取前往往先低通滤波。\u003c/p>\u003c/div>\u003cdiv class=\"warn\">\u003cb>易错：\u003c/b>课件复习题里「\u003cspan class=\"eq\">x[n]=x[−2n]\u003c/span> 是时不变系统吗？」答案为\u003cb>否\u003c/b>（时变且非因果）。判断时不变要用 \u003cspan class=\"eq\">T{x[n−n₀]}\u003c/span> 与 \u003cspan class=\"eq\">y[n−n₀]\u003c/span> 比较：\u003cspan class=\"eq\">x[−2n+n₀] ≠ x[−2(n−n₀)]\u003c/span>，一眼看出不等。\u003c/div>\u003c/section>"}]},{"n":2,"title":"连续时间系统的时域分析","intro":"\u003cb>对应课件：\u003c/b>L05–L06（CH3 连续部分）\u003cbr>\u003cb>本章地位：\u003c/b>全书第一个大题必考区，通常 15～25 分。核心就一句话——\u003cb>给一个微分方程和输入，求输出\u003c/b>。\u003cbr>\u003cb>两条路：\u003c/b>① 经典法（齐次解＋特解，纯数学）；② 卷积法（先求 h(t)，再卷一把）。考试常常两种都考，卷积法更常用、更不容易算错。\u003cbr>\u003cb>怎么选路：\u003c/b>题目给“初始状态”就拆成 \u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> + y\u003csub>zs\u003c/sub>\u003c/span>；给“完整初值”就直接用经典法。\u003cbr>\u003cb>必须掌握：\u003c/b>齐次解三种形式、特解表、冲激响应的两种设法、卷积的四个性质、分段卷积。","sections":[{"id":"s21","title":"2.1 经典法：齐次解 ＋ 特解","html":"\u003cp>微分方程的全解 = 齐次解 + 特解，也就是\u003cb>系统完全响应\u003c/b>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = y\u003csub>h\u003c/sub>(t) + y\u003csub>p\u003c/sub>(t)\u003c/span>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">解题四步（背下来）\u003c/span>\u003col style=\"margin-bottom:0\">\u003cli>\u003cb>写特征方程\u003c/b>：把 \u003cspan class=\"eq\">y\u003csup>(n)\u003c/sup>\u003c/span> 换成 \u003cspan class=\"eq\">s\u003csup>n\u003c/sup>\u003c/span>，右端令 0，解出特征根。\u003c/li>\u003cli>\u003cb>写齐次解\u003c/b>\u003cspan class=\"eq\">y\u003csub>h\u003c/sub>\u003c/span>：形式由特征根决定（见表 2-1）。\u003c/li>\u003cli>\u003cb>设特解\u003c/b>\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>\u003c/span>：形状由右端激励决定（见表 2-2），代入原方程定出系数。\u003c/li>\u003cli>\u003cb>定常数\u003c/b>：把初始条件 \u003cspan class=\"eq\">y(0), y′(0)\u003c/span> 代入\u003cb>全解\u003c/b>，解出 \u003cspan class=\"eq\">K₁, K₂…\u003c/span>。\u003c/li>\u003c/ol>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:34%\">特征根的情况\u003c/th>\u003cth>齐次解的形式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>互不相等的实根 \u003cspan class=\"eq\">s₁, s₂, …, s\u003csub>n\u003c/sub>\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">y\u003csub>h\u003c/sub> = K₁e\u003csup>s₁t\u003c/sup> + K₂e\u003csup>s₂t\u003c/sup> + … + K\u003csub>n\u003c/sub>e\u003csup>s\u003csub>n\u003c/sub>t\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>r 重实根 \u003cspan class=\"eq\">s\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">y\u003csub>h\u003c/sub> = (K₁ + K₂t + … + K\u003csub>r\u003c/sub>t\u003csup>r−1\u003c/sup>)e\u003csup>st\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>共轭复根 \u003cspan class=\"eq\">α ± jβ\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">y\u003csub>h\u003c/sub> = e\u003csup>αt\u003c/sup>(A cos βt + B sin βt)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 2-1　齐次解的形式（“看根下菜”）\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:40%\">激励（方程右端）\u003c/th>\u003cth>特解设法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>常数 \u003cspan class=\"eq\">K\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">A\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Kt\u003c/span>（一次多项式）\u003c/td>\u003ctd>\u003cspan class=\"eq\">At + B\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Kt²\u003c/span>（二次多项式）\u003c/td>\u003ctd>\u003cspan class=\"eq\">At² + Bt + C\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Ke\u003csup>at\u003c/sup>\u003c/span>，且 \u003cspan class=\"eq\">a\u003c/span>\u003cb>不是\u003c/b>特征根\u003c/td>\u003ctd>\u003cspan class=\"eq\">Ae\u003csup>at\u003c/sup>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">Ke\u003csup>at\u003c/sup>\u003c/span>，且 \u003cspan class=\"eq\">a\u003c/span>\u003cb>是\u003c/b>单特征根\u003c/td>\u003ctd>\u003cspan class=\"eq\">Ate\u003csup>at\u003c/sup>\u003c/span>（撞根就乘 t）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"eq\">K sin ω₀t\u003c/span> 或 \u003cspan class=\"eq\">K cos ω₀t\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"eq\">A sin ω₀t + B cos ω₀t\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"tbl-cap\">表 2-2　特解的形式（“看输入下菜”，撞根就乘 t）\u003c/p>\u003cdiv class=\"tip\">\u003cb>口诀：\u003c/b>“\u003cb>齐次看根，特解看输入，系数看初值\u003c/b>。”\u003cbr>\n特解的直觉：输入是常数，输出最终也会稳定到一个常数；输入是 \u003cspan class=\"eq\">e\u003csup>at\u003c/sup>\u003c/span>，输出也是同频率的指数。系统的“形状”跟着输入走，只是幅度和相位不同。\n\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-1　求完全响应（课堂原题，完整版）\u003c/span>\u003cspan class=\"tag\">大题模板\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>已知二阶系统 \u003cspan class=\"eq\">y″(t) + 6y′(t) + 8y(t) = x(t)，t &gt; 0\u003c/span>，初始状态 \u003cspan class=\"eq\">y(0) = 1，y′(0) = 2\u003c/span>，输入 \u003cspan class=\"eq\">x(t) = e\u003csup>−t\u003c/sup>u(t)\u003c/span>。求系统的完全响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析（跟着四步走）\u003c/summary>\u003cdiv class=\"body\">\u003cp>\u003cb>第一步：写特征方程。\u003c/b>右端令 0：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">s² + 6s + 8 = 0 ⟹ (s + 2)(s + 4) = 0 ⟹ s₁ = −2，s₂ = −4\u003c/span>\u003c/div>\u003cp>\u003cb>第二步：写齐次解。\u003c/b>两个不等实根：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>h\u003c/sub>(t) = K₁e\u003csup>−2t\u003c/sup> + K₂e\u003csup>−4t\u003c/sup>\u003c/span>\u003c/div>\u003cp>\u003cb>第三步：设特解。\u003c/b>输入是 \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>\u003c/span>，而 \u003cspan class=\"eq\">−1\u003c/span> 不是特征根，所以设同型：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>(t) = Ce\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>求导：\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>′ = −Ce\u003csup>−t\u003c/sup>，y\u003csub>p\u003c/sub>″ = Ce\u003csup>−t\u003c/sup>\u003c/span>，代入原方程：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">Ce\u003csup>−t\u003c/sup> + 6(−Ce\u003csup>−t\u003c/sup>) + 8Ce\u003csup>−t\u003c/sup> = (1 − 6 + 8)Ce\u003csup>−t\u003c/sup> = 3Ce\u003csup>−t\u003c/sup> = e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>所以 \u003cspan class=\"eq\">C = 1/3\u003c/span>，即 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = ⅓e\u003csup>−t\u003c/sup>\u003c/span>。\u003c/p>\u003cp>\u003cb>第四步：用初始条件定 K₁、K₂。\u003c/b>全解：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = K₁e\u003csup>−2t\u003c/sup> + K₂e\u003csup>−4t\u003c/sup> + ⅓e\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>代入 \u003cspan class=\"eq\">y(0) = 1\u003c/span>：\u003cspan class=\"eq\">K₁ + K₂ + ⅓ = 1 ⟹ K₁ + K₂ = 2/3\u003c/span>。\u003c/p>\u003cp>先求导再代 \u003cspan class=\"eq\">y′(0) = 2\u003c/span>：\u003cspan class=\"eq\">y′ = −2K₁e\u003csup>−2t\u003c/sup> − 4K₂e\u003csup>−4t\u003c/sup> − ⅓e\u003csup>−t\u003c/sup>\u003c/span>，于是 \u003cspan class=\"eq\">−2K₁ − 4K₂ − ⅓ = 2\u003c/span>，即 \u003cspan class=\"eq\">2K₁ + 4K₂ = −7/3\u003c/span>。\u003c/p>\u003cp>联立解得 \u003cspan class=\"eq\">K₁ = 5/2，K₂ = −11/6\u003c/span>。最终：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y(t) = \u003cspan class=\"fr\">\u003cspan class=\"fn\">5\u003c/span>\u003cspan class=\"fd\">2\u003c/span>\u003c/span>e\u003csup>−2t\u003c/sup> − \u003cspan class=\"fr\">\u003cspan class=\"fn\">11\u003c/span>\u003cspan class=\"fd\">6\u003c/span>\u003c/span>e\u003csup>−4t\u003c/sup> + \u003cspan class=\"fr\">\u003cspan class=\"fn\">1\u003c/span>\u003cspan class=\"fd\">3\u003c/span>\u003c/span>e\u003csup>−t\u003c/sup>，　t &gt; 0\u003c/span>\u003c/div>\u003cp>\u003cb>检查（考场必做，10 秒）：\u003c/b>代 \u003cspan class=\"eq\">t=0\u003c/span>：\u003cspan class=\"eq\">2.5 − 1.833 + 0.333 = 1\u003c/span> ✓；求导代 0：\u003cspan class=\"eq\">−5 + 7.333 − 0.333 = 2\u003c/span> ✓。两个初始条件都对上，答案就稳了。\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-2　“撞根”怎么办\u003c/span>\u003cspan class=\"tag g\">易错点\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>求 \u003cspan class=\"eq\">y″ + 3y′ + 2y = e\u003csup>−t\u003c/sup>\u003c/span> 的特解。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>特征根是 \u003cspan class=\"eq\">s = −1, −2\u003c/span>。输入 \u003cspan class=\"eq\">e\u003csup>−t\u003c/sup>\u003c/span> 的指数 \u003cspan class=\"eq\">−1\u003c/span>\u003cb>正好是特征根\u003c/b>，如果还设 \u003cspan class=\"eq\">Ae\u003csup>−t\u003c/sup>\u003c/span>，代进去会得到 0 = e\u003csup>−t\u003c/sup>，无解。所以要乘一个 t：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = Ate\u003csup>−t\u003c/sup>\u003c/span>\u003c/div>\u003cp>求导：\u003cspan class=\"eq\">y\u003csub>p\u003c/sub>′ = A(1 − t)e\u003csup>−t\u003c/sup>，y\u003csub>p\u003c/sub>″ = A(t − 2)e\u003csup>−t\u003c/sup>\u003c/span>，代入：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">A[(t − 2) + 3(1 − t) + 2t]e\u003csup>−t\u003c/sup> = A·1·e\u003csup>−t\u003c/sup> = e\u003csup>−t\u003c/sup> ⟹ A = 1\u003c/span>\u003c/div>\u003cp>所以 \u003cspan class=\"eq\">y\u003csub>p\u003c/sub> = te\u003csup>−t\u003c/sup>\u003c/span>。\u003c/p>\u003cdiv class=\"warn\">\u003cb>规律：\u003c/b>激励的指数是几重根，就乘 \u003cspan class=\"eq\">t\u003c/span> 的几次方。单根乘 t，二重根乘 t²。这一步漏乘，整道题 0 分。\u003c/div>\u003c/div>\u003c/details>\u003c/div>\u003c/div>"},{"id":"s22","title":"2.2 零输入响应与零状态响应","html":"\u003cp>经典法有个致命问题：\u003cb>输入一换、初始条件一改，全部要重算\u003c/b>。而且它把“系统自身的惯性”和“外部激励的效果”混在一起，看不出物理意义。于是我们把响应拆成两块：\u003c/p>\u003cdiv class=\"flow\">\u003cdiv class=\"box\">\u003cb>完全响应\u003c/b>y(t)\u003c/div>\u003cdiv class=\"arw\">=\u003c/div>\u003cdiv class=\"box\">\u003cb>零输入响应\u003c/b>只看初始状态\u003cbr>输入为 0\u003c/div>\u003cdiv class=\"arw\">+\u003c/div>\u003cdiv class=\"box\">\u003cb>零状态响应\u003c/b>只看输入\u003cbr>初始状态为 0\u003c/div>\u003c/div>\u003cdiv class=\"tip\">\u003cb>开车的比喻：\u003c/b>零输入响应 = 松开油门、挂空挡，车靠惯性滑行到停（只由“初始速度”决定）；零状态响应 = 车本来停着，你踩油门起步（只由“输入”决定）。真实的行车轨迹，是两者叠加。\n\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">零输入响应 y\u003csub>zi\u003c/sub>(t)\u003c/span>\u003cp style=\"margin:4px 0\">令输入为 0，解齐次方程，形式由特征根定，系数由\u003cb>初始状态\u003c/b>定：\u003c/p>\u003cdiv class=\"formula\" style=\"margin:6px 0\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub>(t) = Σ K\u003csub>i\u003c/sub>e\u003csup>s\u003csub>i\u003c/sub>t\u003c/sup>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"kp\">\u003cspan class=\"t\">零状态响应 y\u003csub>zs\u003c/sub>(t)\u003c/span>\u003cp style=\"margin:4px 0\">令初始状态全为 0，只由输入产生。求法有两种：直接解非齐次方程（初始条件取 0），或者用卷积 \u003cspan class=\"eq\">y\u003csub>zs\u003c/sub> = x ∗ h\u003c/span>。\u003c/p>\u003c/div>\u003cdiv class=\"eg\">\u003cdiv class=\"eg-h\">\u003cspan>例 2-3　零输入响应\u003c/span>\u003cspan class=\"tag\">基础\u003c/span>\u003c/div>\u003cdiv class=\"eg-b\">\u003cp>系统方程 \u003cspan class=\"eq\">y″ + 3y′ + 2y = x(t)\u003c/span>，初始状态 \u003cspan class=\"eq\">y(0) = 1，y′(0) = 0\u003c/span>。求零输入响应。\u003c/p>\u003cdetails class=\"sol\">\u003csummary>点击看解析\u003c/summary>\u003cdiv class=\"body\">\u003cp>零输入 → 右端为 0。特征方程 \u003cspan class=\"eq\">s² + 3s + 2 = 0\u003c/span>，根为 \u003cspan class=\"eq\">−1, −2\u003c/span>：\u003c/p>\u003cdiv class=\"formula\">\u003cspan class=\"eq\">y\u003csub>zi\u003c/sub> = K₁e\u003csup>−t\u003c/sup> + K₂e\u003csup>−2t\u003c/sup>\u003c/span>\u003c/div>\u003cp>代入初始条件：\u003cspan class=\"eq\">K₁ + K₂ = 1\u003c/span>；\u003cspan class=\"eq\">−K₁ − 2K₂ = 0\u003c/span>。解得 \u003cspan class=\"eq\">K₁ = 2，
