/* ================= 题目渲染 ================= */
function qTags(q) {
  const t = (q.tags || []).filter(x => !['讲义提炼'].includes(x));
  return t.slice(0, 2).map(x => `<span class="badge ${x === '待核对' ? 'o' : 'p'}">${E(x)}</span>`).join('');
}
function qMeta(q) {
  return `<div class="qmeta"><span class="no">${E(q.no)}</span><span class="badge b">${KIND[q.kind] || '题目'}</span>
    <span class="sp">·</span><span>第 ${q.ch} 章 · ${E((CH.get(q.ch) || {}).title || '')}</span>${qTags(q) ? '<span class="sp">·</span>' + qTags(q) : ''}
    <span class="src">${E(q.source || '')}</span></div>`;
}
function blankCount(q) { const m = String(q.stem).match(/_{3,}|（\s*）|\(\s*\)/g); return Math.max(1, m ? m.length : 1); }
function answerParts(q) {
  if (q.accept && q.accept.length) return q.accept;
  return T(q.answer).split(/[；;]/).map(s => s.trim()).filter(Boolean);
}
function sameText(input, want) {
  const a = norm(input), b = norm(want);
  if (!a || !b) return false;
  if (a === b) return true;
  const na = Number(a.replace(/[^\d.eE+\-]/g, '')), nb = Number(b.replace(/[^\d.eE+\-]/g, ''));
  if (a.match(/^[\d.]+$/) && b.match(/^[\d.]+$/) && Number.isFinite(na) && Number.isFinite(nb)) return Math.abs(na - nb) < 1e-6;
  return b.length >= 4 && (a.includes(b) || b.includes(a));
}
function hitBlank(input, accepts) { return (accepts || []).some(x => sameText(input, x)); }

function optionsHTML(q, picked) {
  return `<div class="opts" role="group" aria-label="选项">${q.options.map(o => `
    <button class="opt ${picked === o.key ? 'pick' : ''}" data-k="${o.key}"><span class="k">${o.key}</span><span class="oh">${doc(o.html)}</span></button>`).join('')}</div>`;
}
function judgeHTML(q, picked) {
  return `<div class="judge" role="group" aria-label="判断"><button data-k="√" class="${picked === '√' ? 'pick' : ''}">正确 √</button><button data-k="×" class="${picked === '×' ? 'pick' : ''}">错误 ×</button></div>`;
}
function fillHTML(q, values) {
  const n = blankCount(q);
  return `<div class="fills">${Array.from({ length: n }, (_, i) => `<div class="fillrow"><span>第 ${i + 1} 空</span><input data-i="${i}" value="${E((values || [])[i] || '')}" placeholder="写下答案"><span class="mark"></span></div>`).join('')}</div>`;
}
function qBody(q, state) {
  if (q.kind === 'choice') return optionsHTML(q, state.pick);
  if (q.kind === 'judge') return judgeHTML(q, state.pick);
  return fillHTML(q, state.vals);
}
function feedHTML(q, ok) {
  let shown = q.answer;
  if (q.kind === 'choice' && q.answerKey) {
    const o = (q.options || []).find(x => x.key === q.answerKey);
    if (o) shown = `${q.answerKey}. ${o.html}`;
  }
  const ans = shown ? `<div class="ans"><b>参考答案</b>　<span class="doc" style="display:inline">${doc(shown)}</span></div>` : '<div class="ans"><b>参考答案</b>　本题原文未给答案，标为待核对。</div>';
  return `<div class="feed">${ok ? '<p class="badge g">答对了</p>' : '<p class="badge r">这次没对</p>'}${ans}
    ${q.why ? `<div class="why doc">${doc(q.why)}</div>` : ''}
    ${ok ? '' : `<div class="cause"><span>错在哪：</span>${['概念', '选式', '单位', '运算', '表述'].map(c => `<button class="chip" data-cause="${c}">${c}</button>`).join('')}</div>`}
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="weak">加入补练</button>${variantLink(q)}</div></div>`;
}

let qSeq = 0;
function objectiveCard(q, opts = {}) {
  const r = R(q.id);
  const values = opts.values || [];
  const pickv = opts.pick || '';
  const html = `<article class="qcard" id="qc${++qSeq}" data-qid="${q.id}">
    ${qMeta(q)}
    <div class="qstem doc">${doc(q.stem)}</div>
    ${qBody(q, { pick: pickv, vals: values })}
    <div class="qfoot">
      ${q.kind === 'fill' ? '<button class="btn pri" data-act="check">核对答案</button>' : ''}
      <button class="btn" data-act="star">${r.star ? '★ 已收藏' : '☆ 收藏'}</button>
      <span class="state">${r.status === 'ok' ? '已掌握' : r.status === 'weak' ? '待补练' : '未核对'}${r.tries ? ' · 作答 ' + r.tries + ' 次' : ''}</span>
    </div></article>`;
  return html;
}

function bindObjective(root, q, opts = {}) {
  const card = root.querySelector('.qcard') || root;
  let done = false;
  const picked = { k: opts.pick || '' };
  const record = ok => { if (opts.noRecord) return; recordAnswer(q, ok); };
  const finish = (ok, detail) => {
    if (done) return; done = true;
    card.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (q.kind === 'choice') { if (b.dataset.k === q.answerKey) b.classList.add('right'); if (b.dataset.k === picked.k && picked.k !== q.answerKey) b.classList.add('wrong'); } });
    card.querySelectorAll('.judge button').forEach(b => { b.disabled = true; if (b.dataset.k === q.answerKey) b.classList.add('right'); if (b.dataset.k === picked.k && picked.k !== q.answerKey) b.classList.add('wrong'); });
    if (detail) card.querySelectorAll('.fillrow').forEach((row, i) => {
      const mark = row.querySelector('.mark');
      if (detail[i] !== undefined) { mark.textContent = detail[i] ? '✓' : '✗'; mark.className = 'mark ' + (detail[i] ? 'ok' : 'no'); }
      row.querySelector('input').disabled = true;
    });
    const host = document.createElement('div');
    host.innerHTML = feedHTML(q, ok);
    card.appendChild(host);
    bindFeed(card, q, ok);
    if (q.kind !== 'choice' || q.answerKey) record(ok);
    const st = card.querySelector('.qfoot .state');
    if (st) st.textContent = ok ? '已掌握 · 已记录' : '待补练 · 已记录';
    opts.onAnswer && opts.onAnswer(ok, q);
  };
  const checkFill = () => {
    const vals = $$('.fillrow input', card).map(i => i.value);
    if (vals.every(v => !v.trim())) { alert('先写下答案，再核对。'); return; }
    const parts = answerParts(q);
    const detail = vals.map((v, i) => hitBlank(v, parts[i] ? [].concat(parts[i]) : parts));
    const ok = detail.length > 0 && detail.every(Boolean);
    store.set('draft:' + q.id, vals);
    finish(ok, detail);
  };
  if (q.kind === 'choice') {
    $$('.opt', card).forEach(b => b.onclick = () => {
      if (done) return;
      picked.k = b.dataset.k;
      $$('.opt', card).forEach(x => x.classList.toggle('pick', x === b));
      store.set('pick:' + q.id, picked.k);
      const ok = picked.k === q.answerKey;
      if (!q.answerKey) { alert('本题原文答案待核对，先按参考答案自评。'); }
      finish(ok);
    });
  } else if (q.kind === 'judge') {
    $$('.judge button', card).forEach(b => b.onclick = () => {
      if (done) return;
      picked.k = b.dataset.k;
      $$('.judge button', card).forEach(x => x.classList.toggle('pick', x === b));
      finish(picked.k === q.answerKey);
    });
  } else {
    const cbtn = card.querySelector('[data-act="check"]');
    if (cbtn) cbtn.onclick = checkFill;
    $$('.fillrow input', card).forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkFill(); }));
    $$('.fillrow input', card).forEach((inp, i) => inp.oninput = () => { const v = $$('.fillrow input', card).map(x => x.value); store.set('draft:' + q.id, v); });
  }
  card.querySelector('[data-act="star"]').onclick = ev => {
    const on = !R(q.id).star; setR(q.id, { star: on }); ev.target.textContent = on ? '★ 已收藏' : '☆ 收藏';
  };
}
function variantLink(q) {
  const pool = (q.group === 'objective' ? BANKS.objective : BANKS.written).filter(x => !x.needsCheck && x.ch === q.ch && x.id !== q.id && x.kind === q.kind);
  if (!pool.length) return '';
  const v = pool[Math.floor(Math.random() * pool.length)];
  return `<a class="btn sm" href="#/bank/${q.group === 'objective' ? 'objective' : 'written'}?id=${encodeURIComponent(v.id)}" title="同章同题型、条件和数值都换了">换一道同类题 · ${E(v.no)}</a>`;
}
function bindFeed(card, q, ok) {
  const weak = card.querySelector('[data-act="weak"]'), star = card.querySelector('[data-act="star"]');
  if (weak) weak.onclick = () => { setR(q.id, { status: 'weak', due: Date.now() + 864e5 }); weak.textContent = '已加入补练'; weak.disabled = true; };
  if (star) star.onclick = () => { const on = !R(q.id).star; setR(q.id, { star: on }); star.textContent = on ? '★ 已收藏' : '☆ 收藏'; };
  $$('[data-cause]', card).forEach(b => b.onclick = () => { setR(q.id, { cause: b.dataset.cause }); $$('[data-cause]', card).forEach(x => x.classList.toggle('on', x === b)); });
}
function recordAnswer(q, ok) {
  const r = R(q.id);
  const tries = (r.tries || 0) + 1, okc = (r.ok || 0) + (ok ? 1 : 0), bad = (r.bad || 0) + (ok ? 0 : 1);
  const streak = ok ? (r.streak || 0) + 1 : 0;
  const days = [1, 3, 7, 15, 30][Math.min(streak, 4)];
  setR(q.id, { tries, ok: okc, bad, streak, last: Date.now(), due: Date.now() + days * 864e5, status: ok ? 'ok' : 'weak' });
  store.set('last', q.id);
}

  const qs = new URLSearchParams(location.hash.split('?')[1] || '');

    const ch = +$('#fch').value, scope = $('#fscope').value, kw = $('#fq').value.trim().toLowerCase(), kd = $('#fkind') ? $('#fkind').value : '';
    bankPool = list.filter(q => (!ch || q.ch === ch) && (!kd || q.kind === kd) && (!kw || (T(q.stem) + ' ' + q.no + ' ' + q.source + ' ' + (q.tags || []).join(' ')).toLowerCase().includes(kw)) && (

    if (!bankPool.length) { $('#qhost').innerHTML = '<div class="empty">没有匹配题目，调整章节或筛选条件。</div>'; $('#jump').innerHTML = ''; return; }

    $('#jump').innerHTML = bankPool.map((q, i) => `<option value="${i}" ${i === bankIndex ? 'selected' : ''}>第 ${q.ch} 章 · ${E(q.no)}　${E(T(q.stem).slice(0, 34))}</option>`).join('');

    paintRail();
  };
  $('#fch').onchange = () => refresh();
  $('#fscope').onchange = () => refresh();
  if ($('#fkind')) $('#fkind').onchange = () => refresh();
  let tm; $('#fq').oninput = () => { clearTimeout(tm); tm = setTimeout(() => refresh(), 220); };
  $('#jump').onchange = ev => { bankIndex = +ev.target.value; drawQ(); };
  $('#prev').onclick = () => { if (bankIndex > 0) { bankIndex--; drawQ(); } };
  $('#next').onclick = () => { if (bankIndex < bankPool.length - 1) { bankIndex++; drawQ(); } };
  document.onkeydown = ev => {
    if (!CURRENT.startsWith('bank')) return;
    if (ev.target.matches('input,textarea,select')) return;
    if (ev.key === 'ArrowLeft') $('#prev').click();
    if (ev.key === 'ArrowRight') $('#next').click();
  };
  refresh(qid || qs.get('id'));
}

/* ================= 随堂练习 ================= */
function drill(a) {
  const qs = new URLSearchParams(location.hash.split('?')[1] || '');
  const ch = Number(qs.get('ch') || 0);
  const diag = qs.get('diag') === '1';
  const pool = SCORABLE.filter(q => !ch || q.ch === ch);
  const items = sample(pool, Math.min(diag ? 3 : 8, pool.length));
  if (!items.length) return ($('#main').innerHTML = '<div class="empty">本章暂无客观题，请到大题专练或换一章。</div>');
  let i = 0, right = 0, answered = false;
  const draw = () => {
    if (i >= items.length) return result();
    const q = items[i], r = R(q.id);
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 随堂练习</div>
      <div class="row" style="justify-content:space-between"><h1 class="ph">${diag ? '入门诊断' : '随堂练习'}</h1><span class="small muted">${ch ? '第 ' + ch + ' 章' : '全章混合'}</span></div>
      ${diag ? '<p class="small muted" style="margin:-6px 0 10px">3 道短题，只用来判断下一步从哪章开始；不计入考试成绩。</p>' : ''}
      <div class="drillbar"><div class="bar"><i style="width:${Math.round(i / items.length * 100)}%"></i></div><small>${i + 1} / ${items.length} · 已对 ${right}</small></div>
      ${objectiveCard(q, { pick: store.get('pick:' + q.id, '') })}
      <div class="navq"><button class="btn" id="quitD">结束练习</button><button class="btn pri" id="nextD" disabled>下一题 →</button></div>`;
    answered = false;
    bindObjective($('#main'), q, { onAnswer: ok => { if (answered) return; answered = true; if (ok) right++; $('#nextD').disabled = false; $('#nextD').textContent = i + 1 >= items.length ? '看结果 →' : '下一题 →'; } });
    $('#nextD').onclick = () => { i++; draw(); };
    $('#quitD').onclick = () => { i = items.length; result(); };
  };
  const result = () => {
    const weak = items.filter(q => R(q.id).status === 'weak');
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 随堂练习</div>
      <div class="result"><div class="big">${right}<small> / ${items.length}</small></div><p class="muted">${diag ? '诊断结果：独立答对' : '本组独立答对'}</p>
      ${weak.length ? `<p>待补练 ${weak.length} 题：${weak.map(q => E(q.no)).join('、')}</p>` : '<p>本组没有新增错题。</p>'}
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" id="again">再来一组</button><a class="btn" href="#/path">看学习路径</a><a class="btn" href="#/errors">看错题分析</a></div></div>`;
    $('#again').onclick = () => go('drill' + (diag ? '?diag=1' : (ch ? '?ch=' + ch : '')));
  };
  draw();
}

/* ================= 模拟考试 ================= */

  <div class="panel"><div class="row">
    <label class="field">范围<select id="ech"><option value="0">全章混合</option>${C.chapters.filter(c => C.bank.some(q => q.ch === c.n)).map(c => `<option value="${c.n}" ${preset === c.n ? 'selected' : ''}>第 ${c.n} 章 · ${E(c.title)}</option>`).join('')}</select></label>

    <button class="btn pri" id="estart">开始组卷</button>
  </div><p class="small muted" style="margin:10px 0 0">历史交卷 ${EXAMS.length} 次${EXAMS.length ? ' · 最近 ' + fmtTime(EXAMS[0].time) : ''}。试卷只在本机生成，不联网。</p></div>
  <div id="epaper"></div>`;
  $('#estart').onclick = () => startExam(+$('#ech').value, +$('#ecount').value, +$('#ewcount').value, +$('#etime').value);
}
function startExam(ch, oc, wc, mins) {
  const pool = SCORABLE.filter(q => !ch || q.ch === ch);
  const wp = BANKS.written.filter(q => !q.needsCheck && (!ch || q.ch === ch));
  const items = sample(pool, Math.min(oc, pool.length)).concat(sample(wp, Math.min(wc, wp.length)));
  if (!items.length) return alert('该范围没有可用题目。');
  EXAM = { items, ans: {}, ch, start: Date.now(), end: Date.now() + mins * 60000, mins, submitted: false };
  const tick = () => {
    if (!EXAM || EXAM.submitted) return;
    const left = Math.max(0, EXAM.end - Date.now());
    const el = $('#etimer'); if (el) el.textContent = `${pad(Math.floor(left / 60000))}:${pad(Math.floor(left % 60000 / 1000))}`;
    if (left <= 0) submitExam();
  };
  clearInterval(examTimer); examTimer = setInterval(tick, 500);
  $('#main').innerHTML = `<div class="row" style="justify-content:space-between;margin:16px 0 4px"><div><div class="bk small muted">${E(C.name)} · 模拟卷</div><h1 class="ph" style="font-size:22px">${ch ? '第 ' + ch + ' 章' : '全章混合'} · ${items.length} 题</h1></div><div class="row"><span class="timer" id="etimer">--:--</span><button class="btn pri" id="esubmit">交卷</button></div></div>
  <p class="small muted">客观题 ${Math.min(oc, pool.length)} 道 · 大题 ${Math.min(wc, wp.length)} 道 · 答案只在交卷后显示。</p>
  <div id="elist">${items.map((q, i) => `<section class="examq" data-qid="${q.id}">
    <div class="qn">第 ${i + 1} 题 · ${KIND[q.kind]} · 第 ${q.ch} 章 ${E(q.no)}</div>
    <div class="qstem doc">${doc(q.stem)}</div>
    ${q.group === 'written' ? `<textarea rows="5" data-w="${q.id}" placeholder="卷面答案（交卷后自评）"></textarea>` : qBody(q, {})}
  </section>`).join('')}</div>
  <div class="row" style="margin:14px 0 60px"><button class="btn pri" id="esubmit2">交卷核对</button><span class="small muted">交卷前请检查是否有漏答。</span></div>`;
  $$('#elist .opt').forEach(b => b.onclick = () => {
    const card = b.closest('.examq'), qid = card.dataset.qid;
    $$('.opt', card).forEach(x => x.classList.toggle('pick', x === b));
    EXAM.ans[qid] = b.dataset.k;
  });
  $$('#elist .judge button').forEach(b => b.onclick = () => {
    const card = b.closest('.examq'), qid = card.dataset.qid;
    $$('.judge button', card).forEach(x => x.classList.toggle('pick', x === b));
    EXAM.ans[qid] = b.dataset.k;
  });
  $$('#elist .fillrow input').forEach(inp => {
    const card = inp.closest('.examq'), qid = card.dataset.qid;
    inp.oninput = () => { const vals = $$('.fillrow input', card).map(x => x.value); EXAM.ans[qid] = vals; };
  });
  $$('#elist textarea[data-w]').forEach(t => t.oninput = () => { EXAM.ans[t.dataset.w] = t.value; });
  $('#esubmit').onclick = submitExam; $('#esubmit2').onclick = submitExam;
  tick();
}
function submitExam() {
  if (!EXAM || EXAM.submitted) return;
  if (!confirm('确认交卷？交卷后不能再修改答案。')) return;
  EXAM.submitted = true; clearInterval(examTimer);
  const obj = EXAM.items.filter(q => q.group === 'objective');
  let hits = 0, graded = [];
  obj.forEach(q => {
    let ok = false;
    if (q.kind === 'choice' || q.kind === 'judge') ok = EXAM.ans[q.id] === q.answerKey;
    else {
      const vals = EXAM.ans[q.id] || [], parts = answerParts(q);
      ok = vals.length > 0 && vals.every((v, i) => hitBlank(v, parts[i] ? [].concat(parts[i]) : parts));
    }
    if (ok) hits++;
    graded.push({ q, ok, given: EXAM.ans[q.id] });
  });
  const written = EXAM.items.filter(q => q.group === 'written');
  const rec = { time: Date.now(), ch: EXAM.ch, total: obj.length, hits, written: written.length, minutes: EXAM.mins, self: null };
  EXAMS = [rec].concat(EXAMS).slice(0, 50); store.set('exams', EXAMS);
  const score = obj.length ? Math.round(hits / obj.length * 100) : 0;
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 模拟考试 / 交卷</div>
  <div class="result"><div class="big">${score}<small> 分</small></div><p class="muted">客观题 ${hits} / ${obj.length} 自动判分；大题 ${written.length} 道需按点自评</p>
  <p class="small muted">用时 ${Math.round((Date.now() - EXAM.start) / 60000)} 分钟 · 记录已保存</p>
  <div class="row" style="justify-content:center;margin-top:12px"><a class="btn pri" href="#/report">看学习报告</a><a class="btn" href="#/errors">错题分析</a><button class="btn" id="eagain">再考一次</button></div></div>
  <h2 class="sec">逐题核对</h2>
  ${graded.map(({ q, ok, given }, i) => `<div class="review ${ok ? 'ok' : 'no'}"><b>${i + 1}. ${E(q.no)}　${ok ? '<span class="badge g">正确</span>' : '<span class="badge r">错误</span>'}</b>
    <div class="small muted">我的作答：${E(Array.isArray(given) ? given.join('；') : (given || '未答'))}</div>
    <details><summary class="small">看答案与解析</summary><div class="doc">${doc(q.answer)}${q.why ? doc(q.why) : ''}</div></details>
    ${ok ? '' : `<button class="btn sm" data-weak="${q.id}">加入补练</button>`}</div>`).join('')}
  ${written.length ? `<h2 class="sec">大题自评</h2>${written.map((q, i) => `<div class="review"><b>${E(q.no)}</b><div class="doc">${doc(q.stem)}</div>
    <p class="small muted">我的卷面：${E((EXAM.ans[q.id] || '未答').slice(0, 160))}</p>
    <details><summary class="small">参考答案与评分点</summary><div class="doc">${doc(q.answer)}</div></details>
    <label class="small">自评得分（0–10）<input type="number" min="0" max="10" data-self="${q.id}" style="width:78px;margin-left:6px"></label>
    <button class="btn sm" data-selfsave="${q.id}">保存自评</button></div>`).join('')}` : ''}`;
  $$('[data-weak]').forEach(b => b.onclick = () => { setR(b.dataset.weak, { status: 'weak', due: Date.now() + 864e5 }); b.textContent = '已加入'; b.disabled = true; });
  $$('[data-selfsave]').forEach(b => b.onclick = () => {
    const inp = $(`[data-self="${b.dataset.selfsave}"]`); const v = +inp.value;
    if (!Number.isFinite(v)) return alert('填 0–10 的分数');
    const q = QBY.get(b.dataset.selfsave); setR(q.id, { draft: (EXAM.ans[q.id] || ''), status: v >= 6 ? 'ok' : 'weak', self: v, last: Date.now(), due: Date.now() + (v >= 6 ? 3 : 1) * 864e5 });
    b.textContent = '已保存'; b.disabled = true;
  });
  $('#eagain').onclick = () => go('exam');
  paintRail();
  EXAM = null;
}

/* ================= 错题分析 ================= */
function errors() {
  const bad = C.bank.filter(q => (R(q.id).bad || 0) > 0 || R(q.id).status === 'weak')
    .sort((a, b) => (R(b.id).bad || 0) - (R(a.id).bad || 0));

  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 错题分析</div>
  <h1 class="ph">错题分析</h1><p class="psub">按“错了几次”排序；错因由你在作答后自己标记，不用关键词猜。</p>
  ${bad.length ? `<div class="panel"><div class="row"><button class="btn pri" id="redo">重练这批（最多 10 题）</button><a class="btn" href="#/bank/objective?mode=weak">只看待补练</a><a class="btn" href="#/bank/written?mode=weak">大题待补练</a></div>
    <p class="small muted" style="margin:10px 0 0">错因分布：${Object.keys(causes).length ? Object.entries(causes).map(([k, v]) => `${E(k)} ${v}`).join(' · ') : '还没有标记错因'}</p></div>
    <div class="list">${bad.map(q => { const r = R(q.id); return `<div class="li"><span class="no">${E(q.no)}</span><div class="body">
      <div class="small"><b>第 ${q.ch} 章</b> · ${KIND[q.kind]} ${r.cause ? `<span class="badge o">${E(r.cause)}</span>` : ''} ${r.status === 'weak' ? '<span class="badge r">待补练</span>' : (r.bad ? '<span class="badge g">已通过后续复测</span>' : '')}</div>
      <div style="margin-top:3px">${E(T(q.stem).slice(0, 92))}</div></div>
      <div class="act"><a class="btn sm" href="#/bank/${q.group === 'written' ? 'written' : 'objective'}?id=${encodeURIComponent(q.id)}">重做</a></div></div>`; }).join('')}</div>`
      : `<div class="empty"><p>还没有错题记录。</p><a class="btn pri" href="#/drill">做一组随堂练习</a></div>`}`;
  if ($('#redo')) $('#redo').onclick = () => {
    const ids = bad.filter(q => q.group === 'objective').slice(0, 10).map(q => q.id);

}
function drillIds(ids) {
  const items = ids.map(id => QBY.get(id)).filter(Boolean);
  let i = 0, right = 0;
  const draw = () => {
    if (i >= items.length) return $('#main').innerHTML = `<div class="result"><div class="big">${right}<small> / ${items.length}</small></div><p class="muted">错题重练完成</p><div class="row" style="justify-content:center"><a class="btn pri" href="#/errors">回到错题分析</a></div></div>`;
    const q = items[i];
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 错题重练</div>
      <div class="drillbar"><div class="bar"><i style="width:${Math.round(i / items.length * 100)}%"></i></div><small>${i + 1} / ${items.length}</small></div>
      ${objectiveCard(q, { pick: '' })}<div class="navq"><button class="btn" id="q">退出</button><button class="btn pri" id="n" disabled>下一题 →</button></div>`;
    let ans = false;
    bindObjective($('#main'), q, { onAnswer: ok => { if (ans) return; ans = true; if (ok) right++; $('#n').disabled = false; } });
    $('#n').onclick = () => { i++; draw(); };
    $('#q').onclick = () => go('errors');
  };
  draw();
}

function labSignals() {
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 交互实验室</div>
  <h1 class="ph">${E(X.lab.title)}</h1><p class="psub">${E(X.lab.desc)}</p>
  <div class="panel"><div class="tool"><div>
    <label class="field">信号频率 f<sub>m</sub>：<span class="v" id="fmv">4 Hz</span><input id="fm" type="range" min="1" max="10" step="0.5" value="4"></label>
    <label class="field">抽样频率 f<sub>s</sub>：<span class="v" id="fsv">20 Hz</span><input id="fs" type="range" min="2" max="40" step="1" value="20"></label>
    <p class="small muted">灰虚线：原信号；蓝点：抽样点；橙线：由样点唯一确定的最低频正弦（混叠后的“假信号”）。</p>
  </div><div><canvas id="cv" width="640" height="280" aria-label="抽样波形图"></canvas><div class="out" id="lout" style="margin-top:10px"></div></div></div></div>`;
  const draw = () => {
    const fm = +$('#fm').value, fs = +$('#fs').value;
    $('#fmv').textContent = fm + ' Hz'; $('#fsv').textContent = fs + ' Hz';
    const cv = $('#cv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height, mid = H / 2, A = 88;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#e2e8f2'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 10); ctx.lineTo(x, H - 10); ctx.stroke(); }
    ctx.strokeStyle = '#cfd9e8'; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
    const T0 = 1 / fm, scale = W / (2 * T0);
    ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.6; ctx.beginPath();
    for (let x = 0; x <= W; x += 2) { const t = x / scale; const y = mid - A * Math.sin(2 * Math.PI * fm * t); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); ctx.setLineDash([]);
    const n = Math.floor(2 * T0 * fs);
    ctx.fillStyle = '#2f6fdb';
    for (let k = 0; k <= n; k++) { const t = k / fs, x = t * scale, y = mid - A * Math.sin(2 * Math.PI * fm * t); ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2); ctx.fill(); }
    const alias = Math.abs(fm - Math.round(fm / fs) * fs);
    if (fs < 2 * fm && alias > 0.001) {
      ctx.strokeStyle = '#c4700f'; ctx.lineWidth = 1.8; ctx.beginPath();
      for (let x = 0; x <= W; x += 2) { const t = x / scale; const y = mid - A * Math.sin(2 * Math.PI * alias * t + Math.PI); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    const ok = fs >= 2 * fm;
    $('#lout').innerHTML = `f<sub>m</sub>=${fm} Hz，f<sub>s</sub>=${fs} Hz<br>奈奎斯特下限 2f<sub>m</sub>=${2 * fm} Hz<br><b>${ok ? '可以无失真恢复' : '发生混叠'}</b>${ok ? '' : `<br>混叠频率 ≈ ${alias.toFixed(1)} Hz`}`;
  };
  $('#fm').oninput = draw; $('#fs').oninput = draw; draw();
}

function labWidth(host) {

    <label class="field">走线位置<select id="wK"><option value="0.048">外层（k=0.048）</option><option value="0.024">内层（k=0.024）</option></select></label>
  </div><div><div class="out" id="wOut"></div>
    <div class="vbar"><i id="wBar" style="width:0"></i></div>
    <div class="vscale"><span>0</span><span>1 mm</span><span>2 mm</span></div>

    $('#wOut').innerHTML = `最小线宽 <b>${mm.toFixed(2)} mm</b><br>≈ ${mil.toFixed(1)} mil · 截面积 ${A.toFixed(1)} mil²<br>建议取 <b>${rec.toFixed(1)} mm</b>（留 20% 余量）`;
    $('#wBar').style.width = Math.min(100, mm / 2 * 100) + '%';

    <div class="doc" style="margin-top:10px"><div class="kp"><span class="t">公式</span><p>R = 0.0172·L/(w·t)（mΩ，L/w 用 mm，t 用 mm）；ΔV = I·R；P = I²·R。</p></div></div>
  </div></div></section>`;
  const calc = () => {
    const L = +$('#dL').value, w = +$('#dW').value, oz = +$('#dOz').value, I = +$('#dI').value;
    const t = oz * 0.035, R = 0.0172 * L / Math.max(w * t, 1e-6);
    const V = I * R, P = I * I * R, pct = V / 1000 / 5 * 100;
    $('#dOut').innerHTML = `走线电阻 <b>${R.toFixed(1)} mΩ</b><br>压降 <b>${V.toFixed(1)} mV</b>（5 V 的 ${pct.toFixed(2)}%）<br>功耗 <b>${P.toFixed(0)} mW</b><br>${pct > 3 ? '<span style="color:#ffd08a">超过 3%，建议加宽或缩短</span>' : '<span style="color:#9fe3bd">低于 3%，可接受</span>'}`;
    $('#dBar').style.width = Math.min(100, pct / 10 * 100) + '%';
  };
  ['dL', 'dW', 'dOz', 'dI'].forEach(id => $('#' + id).oninput = calc);
  calc();
}

/* 4. 微带阻抗 */
function labZ0(host) {
  host.innerHTML = `<section class="panel"><div class="tool"><div>
    <label class="field">线宽 w（mm）<input id="zW" type="number" value="0.2" min="0.05" max="2" step="0.01"></label>
    <label class="field">介质厚度 h（mm）<input id="zH" type="number" value="0.2" min="0.05" max="1.6" step="0.01"></label>
    <label class="field">铜厚<select id="zOz"><option value="0.5">0.5 oz</option><option value="1" selected>1 oz</option><option value="2">2 oz</option></select></label>
    <label class="field">介电常数 εr<select id="zEr"><option value="4.2">FR-4 · 4.2</option><option value="4.4" selected>FR-4 · 4.4</option><option value="4.6">FR-4 · 4.6</option><option value="3.5"> Rogers · 3.5</option></select></label>
  </div><div><div class="out" id="zOut"></div>
    <div class="vbar"><i id="zBar" style="width:0"></i></div>
    <div class="vscale"><span>0 Ω</span><span>50 Ω</span><span>120 Ω</span></div>
    <div class="labnote">近似公式未计阻焊层与铜箔粗糙度；阻抗线下方必须有完整参考平面，实际以板厂计算与测试为准。</div>
    <div class="doc" style="margin-top:10px"><div class="kp"><span class="t">公式</span><p>Z₀ ≈ 87/√(εr+1.41) · ln(5.98h/(0.8w+t))（IPC-2141 微带近似）。</p></div></div>
  </div></div></section>`;
  const zof = (w, h, t, er) => 87 / Math.sqrt(er + 1.41) * Math.log(5.98 * h / (0.8 * w + t));
  const calc = () => {
    const w = +$('#zW').value, h = +$('#zH').value, oz = +$('#zOz').value, er = +$('#zEr').value, t = oz * 0.035;
    const z = zof(w, h, t, er);
    let lo = 0.02, hi = 3;
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (zof(mid, h, t, er) > 50) lo = mid; else hi = mid; }
    const w50 = (lo + hi) / 2, dev = (z - 50) / 50 * 100;
    $('#zOut').innerHTML = `特征阻抗 <b>${z.toFixed(1)} Ω</b><br>50 Ω 目标线宽 <b>${w50.toFixed(3)} mm</b><br>当前线宽偏离 50 Ω <b>${dev > 0 ? '+' : ''}${dev.toFixed(1)}%</b><br><span style="color:#9fc0ea">t = ${t.toFixed(3)} mm，h/w = ${(h / w).toFixed(2)}</span>`;
    $('#zBar').style.width = Math.min(100, z / 120 * 100) + '%';
  };
  ['zW', 'zH', 'zOz', 'zEr'].forEach(id => $('#' + id).oninput = calc);
  calc();
}

/* 5. 拼板利用率 */
function labPanel(host) {
  host.innerHTML = `<section class="panel"><div class="tool"><div>
    <label class="field">单板长 a（mm）<input id="pA" type="number" value="100" min="5" step="1"></label>
    <label class="field">单板宽 b（mm）<input id="pB" type="number" value="80" min="5" step="1"></label>
    <label class="field">板间距 g（mm）<input id="pG" type="number" value="2" min="0" step="0.5"></label>
    <label class="field">工艺边 e（mm，四边）<input id="pE" type="number" value="5" min="0" step="1"></label>
    <label class="field">大板长 A（mm）<input id="pPA" type="number" value="300" min="20" step="5"></label>
    <label class="field">大板宽 B（mm）<input id="pPB" type="number" value="300" min="20" step="5"></label>
  </div><div><div class="out" id="pOut"></div>
    <canvas id="pCv" width="640" height="400" aria-label="拼板排版示意"></canvas>
    <div class="labnote">示意未计 V-cut / 邮票孔与夹持边；实际拼板还要留 MARK 点、定位孔和铣刀路径。</div>
  </div></div></section>`;
  const calc = () => {
    const a = +$('#pA').value, b = +$('#pB').value, g = +$('#pG').value, e = +$('#pE').value, PA = +$('#pPA').value, PB = +$('#pPB').value;
    const fit = (x, y) => [Math.floor((PA - 2 * e + g) / (x + g)), Math.floor((PB - 2 * e + g) / (y + g))];
    const [c1, r1] = fit(a, b), [c2, r2] = fit(b, a);
    const n1 = Math.max(0, c1) * Math.max(0, r1), n2 = Math.max(0, c2) * Math.max(0, r2);
    const rot = n2 > n1, n = Math.max(n1, n2);
    const cols = rot ? c2 : c1, rows = rot ? r2 : r1;
    const util = n * a * b / (PA * PB) * 100;
    $('#pOut').innerHTML = `可拼 <b>${n} 块</b><br>排列 <b>${cols} × ${rows}</b>${rot ? '（旋转 90°）' : ''}<br>面积利用率 <b>${util.toFixed(1)}%</b><br><span style="color:#9fc0ea">单板 ${a}×${b} mm，大板 ${PA}×${PB} mm</span>`;
    const cv = $('#pCv'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const sc = Math.min((W - 24) / PA, (H - 24) / PB);
    const pw = PA * sc, ph = PB * sc, ox = (W - pw) / 2, oy = (H - ph) / 2;
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(ox, oy, pw, ph);
    ctx.strokeStyle = '#0f2440'; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, pw, ph);
    const bw = rot ? b : a, bh = rot ? a : b;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const x = ox + (e + i * (bw + g)) * sc, y = oy + (e + j * (bh + g)) * sc;
      ctx.fillStyle = '#bcd7ff'; ctx.fillRect(x, y, bw * sc, bh * sc);
      ctx.strokeStyle = '#2f6fdb'; ctx.lineWidth = 1; ctx.strokeRect(x, y, bw * sc, bh * sc);
    }
    if (!n) { ctx.fillStyle = '#8a95a6'; ctx.font = '14px sans-serif'; ctx.fillText('当前大板放不下，减小单板或工艺边', ox + 8, oy + 24); }
  };
  ['pA', 'pB', 'pG', 'pE', 'pPA', 'pPB'].forEach(id => $('#' + id).oninput = calc);
  calc();
}

/* 8. 电源线与回流线压降 */
function labPower(host) {
  host.innerHTML = `<section class="panel">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">
      <h3 style="margin:0">电源线 / 回流线压降</h3>
      <div class="chips">
        <button class="chip" data-pwmode="check">校核已有线宽</button>
        <button class="chip" data-pwmode="calc">计算所需线宽</button>
        <button class="chip" id="pwDemo">载入示例</button>
      </div>
    </div>
    <div class="powergrid">
      <label class="field">电源端可提供电压（V）<input id="pwVs" type="number" value="3.30" step="0.01" min="0.1"></label>
      <label class="field">负载最低工作电压（V）<input id="pwVmin" type="number" value="3.25" step="0.01" min="0.1"></label>
      <label class="field">最大持续电流（A）<input id="pwI" type="number" value="1.00" step="0.1" min="0.01"></label>
      <label class="field">供电线长度（mm）<input id="pwLs" type="number" value="50" step="1" min="1"></label>
      <label class="field">回流线长度（mm）<input id="pwLr" type="number" value="50" step="1" min="1"></label>
      <label class="field">成品铜厚（μm）<input id="pwT" type="number" value="35" step="1" min="5"></label>
      <label class="field" id="pwWwrap">当前线宽（mm）<input id="pwW" type="number" value="0.50" step="0.05" min="0.05"></label>
    </div>
    <label class="checkline"><input type="checkbox" id="pwSame" checked> 回流线与供电线等长（勾选后回流长度跟随供电线）</label>
    <div id="pwOut" style="margin-top:12px"></div>
  </section>`;

  let mode = store.get('pwMode', 'check');
  const RHO = 1.724e-8; // Ω·m，室温铜
  const GRID = [0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.8, 1.0, 1.2, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0];

  const paint = () => {
    $$('[data-pwmode]').forEach(b => b.classList.toggle('on', b.dataset.pwmode === mode));
    $('#pwWwrap').style.display = mode === 'check' ? '' : 'none';
  };

  const read = () => ({
    Vs: +$('#pwVs').value, Vmin: +$('#pwVmin').value, I: +$('#pwI').value,
    Ls: +$('#pwLs').value, Lr: +$('#pwLr').value, t: +$('#pwT').value / 1e6,
    w0: +$('#pwW').value
  });

  const calc = () => {
    const d = read();
    if (![d.Vs, d.Vmin, d.I, d.Ls, d.Lr, d.t, d.w0].every(Number.isFinite) || d.Vs <= 0 || d.Vmin <= 0 || d.I <= 0 || d.Ls <= 0 || d.Lr <= 0 || d.t <= 0 || (mode === 'check' && d.w0 <= 0)) {
      $('#pwOut').innerHTML = '<div class="verdict warn">请填写有效的电压、电流、长度、铜厚与线宽（均为正数）。</div>';
      return;
    }
    const allowed = d.Vs - d.Vmin; // V
    if (allowed <= 0) {
      $('#pwOut').innerHTML = `<div class="verdict bad"><b>没有可分配给走线的压降余量。</b><br>电源端可保证的 ${d.Vs.toFixed(2)} V 不高于负载最低工作电压 ${d.Vmin.toFixed(2)} V。请先提高电源电压或降低负载最低工作电压，再谈线宽；此时加宽走线也无法让负载端达到要求。</div>
        <div class="labnote">判断的是铜走线直流压降，不含过孔、连接器、焊盘窄颈、温升和负载瞬态跌落。</div>`;
      return;
    }
    const L = (d.Ls + d.Lr) / 1000; // m
    const wmin = d.I * RHO * L / (allowed * d.t); // m
    const wminmm = wmin * 1000;
    const drop = w => d.I * RHO * L / ((w / 1000) * d.t); // V
    const targetDrop = allowed * 0.85;
    const wTarget = d.I * RHO * L / (targetDrop * d.t) * 1000;
    let rec = GRID.find(g => g >= wTarget);
    if (!rec) rec = Math.ceil(wTarget / 0.5) * 0.5;
    const marginAt = w => (d.Vs - drop(w) - d.Vmin) * 1000; // mV
    const thresh = Math.max(3, allowed * 1000 * 0.15);

    const set = new Set();
    if (mode === 'check' && d.w0 > 0) set.add(+d.w0.toFixed(3));
    else set.add(Math.ceil(wminmm * 100) / 100);
    const below = GRID.filter(g => g >= wminmm && g < rec - 1e-9).pop();
    if (below) set.add(below);
    set.add(rec);
    const above = GRID.find(g => g > rec + 1e-9);
    if (above) set.add(above);
    const rows = [...set].sort((a, b) => a - b);

    const judge = m => m < 0 ? ['不达标', 'bad'] : m < thresh ? ['计算达标，余量很小', 'warn'] : m < allowed * 1000 * 0.3 ? ['计算达标，余量较大', 'ok'] : ['计算达标，余量充足', 'ok'];
    const table = `<div class="tablewrap"><table class="tb pwtb">
      <thead><tr><th>两条线各自宽度</th><th>往返总压降</th><th>预计负载端电压</th><th>相对 ${d.Vmin.toFixed(2)} V 的余量</th><th>判断</th></tr></thead>
      <tbody>${rows.map(w => {
        const dd = drop(w) * 1000, vl = d.Vs - drop(w), m = marginAt(w), j = judge(m);
        return `<tr class="${Math.abs(w - d.w0) < 1e-9 && mode === 'check' ? 'cur' : ''}">
          <td data-l="线宽">${w.toFixed(2)} mm</td>
          <td data-l="往返压降">${dd.toFixed(1)} mV</td>
          <td data-l="负载端电压">${vl.toFixed(4)} V</td>
          <td data-l="余量">${m >= 0 ? '+' : ''}${m.toFixed(1)} mV</td>
          <td data-l="判断"><span class="badge ${j[1] === 'bad' ? 'r' : j[1] === 'warn' ? 'o' : 'g'}">${j[0]}</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;

    let verdict = '';
    let stat4 = '';
    if (mode === 'check') {
      const m0 = marginAt(d.w0), v0 = d.Vs - drop(d.w0);
      stat4 = `<div><small>当前线宽余量</small><b style="color:${m0 < 0 ? '#b91c1c' : m0 < thresh ? '#b45309' : '#15803d'}">${m0 >= 0 ? '+' : ''}${m0.toFixed(1)} mV</b></div>`;
      if (m0 < 0) {
        verdict = `<div class="verdict bad"><b>当前线宽不满足要求</b>，预计负载端 ${v0.toFixed(4)} V，比最低工作电压低 ${Math.abs(m0).toFixed(1)} mV。若其他条件不变，可将供电线和回流线各加宽到 <b>${rec.toFixed(2)} mm</b>，预计可留出 ${marginAt(rec).toFixed(1)} mV 余量。</div>`;
      } else if (m0 < thresh) {
        verdict = `<div class="verdict warn"><b>计算达标，但余量很小</b>：预计余量 ${m0.toFixed(1)} mV。建议把两条线各加宽到 <b>${rec.toFixed(2)} mm</b>，可留出 ${marginAt(rec).toFixed(1)} mV，给压降和温升留一点空间。</div>`;
      } else {
        verdict = `<div class="verdict ok"><b>满足压降要求</b>：预计负载端 ${v0.toFixed(4)} V，比最低工作电压高 ${m0.toFixed(1)} mV。</div>`;
      }
    } else {
      stat4 = `<div><small>建议线宽余量</small><b style="color:#15803d">+${marginAt(rec).toFixed(1)} mV</b></div>`;

/* ================= 训练场 ================= */
function code() {
  if (C.id === 'signals') return codeSignals();
  if (C.id === 'stm32') return codeStm32();
  return codeEda();
}
function conv(a, b) {
  const out = Array(a.length + b.length - 1).fill(0);
  a.forEach((x, i) => b.forEach((y, j) => out[i + j] += x * y));
  return out;
}
function codeSignals() {
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 编程训练场</div>
  <h1 class="ph">卷积训练场</h1><p class="psub">输入两个有限长序列（逗号分隔），先自己算长度与总和，再运行核对。</p>
  <div class="panel"><div class="row"><label class="field" style="flex:1">x[k]<input id="cx" value="1,2,3"></label><label class="field" style="flex:1">h[k]<input id="ch" value="1,1"></label><button class="btn pri" id="run">运行卷积</button></div>
  <div id="cout" style="margin-top:12px"></div></div>
  <div class="panel"><h3>先预测</h3><div class="row"><label class="field">结果长度<input id="plen" type="number" placeholder="N₁+N₂−1"></label><label class="field">结果总和<input id="psum" type="number" step="any" placeholder="Σx · Σh"></label><button class="btn" id="pcheck">核对预测</button></div><p class="small muted" id="pout"></p></div>`;
  const run = () => {
    const a = $('#cx').value.split(/[,，\s]+/).filter(Boolean).map(Number), b = $('#ch').value.split(/[,，\s]+/).filter(Boolean).map(Number);
    if (a.some(isNaN) || b.some(isNaN) || !a.length || !b.length) { $('#cout').innerHTML = '<p class="muted">请输入数字序列。</p>'; return; }
    const y = conv(a, b);
    $('#cout').innerHTML = `<div class="tablewrap"><table class="tb"><tr><th>k</th>${y.map((_, i) => `<th>${i}</th>`).join('')}</tr><tr><th>y[k]</th>${y.map(v => `<td>${v}</td>`).join('')}</tr></table></div>
      <p class="small">长度 <b>${y.length}</b> · 总和 <b>${y.reduce((s, v) => s + v, 0)}</b> · 首项 ${y[0]} · 末项 ${y[y.length - 1]}</p>`;

    const okL = len === y.length, okS = Math.abs(sum - y.reduce((s, v) => s + v, 0)) < 1e-9;
    $('#pout').innerHTML = `${okL ? '✓ 长度对' : '✗ 长度应为 ' + y.length}　${okS ? '✓ 总和对' : '✗ 总和应为 ' + y.reduce((s, v) => s + v, 0)}`;
  };
  run();
}

  <div class="grid2"><div class="panel"><h3>错因</h3>${Object.keys(causes).length ? Object.entries(causes).map(([k, v]) => `<div class="row"><span>${E(k)}</span><b>${v}</b></div>`).join('') : '<p class="muted small">还没有标记错因。答错后点一个错因标签即可累计。</p>'}</div>
  <div class="panel"><h3>实践与闯关</h3>
    <div class="row"><span>学习闯关三关通过</span><b>${store.get('passes', 0)} 次</b></div>
    <div class="row"><span>项目实训</span><b>${X.projects ? X.projects.filter(x => store.get('proj:' + x.id, {}).done).length + ' / ' + X.projects.length + ' 完成' : ((store.get('project', {}) || {}).done ? '已完成' : '未完成')}</b></div>
    <h3 style="margin-top:14px">最近模拟卷</h3>${EXAMS.length ? EXAMS.slice(0, 5).map(e => `<div class="row"><span>${fmtTime(e.time)} · ${e.ch ? '第 ' + e.ch + ' 章' : '全章'}</span><b>${e.hits}/${e.total}</b></div>`).join('') : '<p class="muted small">还没有交卷记录。</p>'}</div></div>
  <div class="row"><button class="btn pri" id="rexp">导出学习报告</button><button class="btn" id="rprint">打印 / 存 PDF</button><button class="btn" id="rreset">清空本科记录</button></div>`;
  $('#rexp').onclick = () => download(`${C.name}_学习报告_${new Date().toISOString().slice(0, 10)}.md`,
    `# ${C.name} 学习报告\n\n- 客观题正确率：${acc}%（${tries} 次）\n- 已独立答对：${mastered}/${obj.length}\n- 待补练：${weak}\n- 学习天数：${days}\n- 模拟考试：${EXAMS.length} 次\n\n## 分章\n` +
    C.chapters.map(c => { const qs = obj.filter(q => q.ch === c.n), ok = qs.filter(q => R(q.id).ok).length; return `- 第 ${c.n} 章 ${c.title}：${ok}/${qs.length}`; }).join('\n') +
    `\n\n## 错因\n${Object.entries(causes).map(([k, v]) => `- ${k}: ${v}`).join('\n') || '- 无'}\n`);
  $('#rprint').onclick = () => window.print();
  $('#rreset').onclick = () => { if (confirm('只清空《' + C.name + '》的作答记录与考试记录（笔记、讨论板和草稿保留），其他课程不受影响。确定？')) { REC = {}; store.set('rec', REC); EXAMS = []; store.set('exams', EXAMS); MASTER = []; store.set('master', MASTER); go('report'); } };
}

/* ================= 学习闯关 ================= */
function challengeSet() {
  if (C.id === 'signals') {
    const fm = pick([2, 3, 4, 5]), a = pick([2, 4, 5]);
    return [
      { q: `信号最高频率 ${fm} kHz，奈奎斯特抽样速率至少是多少 kHz？`, v: 2 * fm, u: 'kHz', work: 'f_s≥2f_m' },
      { q: `δ(${a}t) 与 δ(t) 的系数比是 1/${a}，写成小数是多少？`, v: 1 / a, u: '', work: 'δ(at)=δ(t)/|a|' },
      { q: '序列长度 N₁=4、N₂=3，卷积和的结果长度是多少？', v: 6, u: '', work: 'N₁+N₂−1=6' }
    ];
  }
  if (C.id === 'stm32') {
    return [
      { q: '84 MHz、PSC=83、ARR=999，定时器频率是多少 Hz？', v: 1000, u: 'Hz', work: '84e6/(84×1000)=1000' },
      { q: 'ADC 时钟 21 MHz、采样时间 480 周期、12 位，转换时间约多少 μs？（保留两位小数）', v: 23.45, u: 'μs', work: '(480+12.5)/21≈23.45' },
      { q: '4 位优先级、2 位抢占 + 2 位响应，抢占优先级有多少级？', v: 4, u: '级', work: '2²=4' }
    ];
  }
  return [
    { q: '1 oz 铜的厚度约多少 μm？', v: 35, u: 'μm', work: '1 oz≈35 μm' },
    { q: '电流 2 A、温升 10 ℃、外层 1 oz，IPC 估算线宽约多少 mm？（保留两位小数）', v: 0.78, u: 'mm', work: 'A=(2/(0.048×10^0.44))^(1/0.725)≈42.3 mil²；W≈30.7 mil≈0.78 mm' },
    { q: '四层板的内层有几层？', v: 2, u: '层', work: '顶层+2 内层+底层' }
  ];
}
function challenge() {
  const items = challengeSet(); let i = 0, pass = 0;
  const draw = () => {
    if (i >= items.length) {
      if (pass === 3) { const n = store.get('passes', 0) + 1; store.set('passes', n); }
      return $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 学习闯关</div>
        <div class="result"><div class="big">${pass}<small> / 3</small></div><p class="muted">${pass === 3 ? '三关通过，已记入学习报告。' : '未全过：错的那一步回到对应章节重看。'}</p>
        <div class="row" style="justify-content:center"><button class="btn pri" id="cagain">再来一轮</button><a class="btn" href="#/report">看报告</a></div></div>`;
    }
    const it = items[i];
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 学习闯关</div>
      <h1 class="ph">学习闯关</h1><p class="psub">三关独立计算，不借助解析；错一关就停在这一关重算。</p>
      <div class="panel"><small class="muted">第 ${i + 1} / 3 关</small><p style="font-size:16px">${E(it.q)}</p>
      <div class="row"><label class="field">答案<input id="cv" type="number" step="any"> <span class="small muted">${it.u}</span></label><button class="btn pri" id="csub">提交</button></div><p id="cout" class="small"></p></div>`;
    $('#csub').onclick = () => {
      const v = +$('#cv').value;
      if (!Number.isFinite(v)) return alert('请输入数值');
      if (Math.abs(v - it.v) <= Math.max(0.01, Math.abs(it.v) * 0.01)) { pass++; i++; draw(); }
      else { $('#cout').innerHTML = `<span class="badge r">未通过</span> ${E(it.work)}——按这个思路重算，再提交。`; }
    };
  };
  draw();
}

/* ================= 讨论板 ================= */
function community() {
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 学习讨论板</div>
  <h1 class="ph">学习讨论板</h1><p class="psub">本机记录，不会发布到网上；可导出与同学交换。</p>
  <div class="panel"><textarea id="pt" rows="3" placeholder="写下你的问题、解法或易错点"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="ppost">发表到本机</button><button class="btn" id="pexp">导出讨论稿</button></div></div>
  <div class="list">${POSTS.length ? POSTS.map((p, i) => `<div class="li"><span class="no">#${POSTS.length - i}</span><div class="body">${E(p.t)}<br><small class="muted">${fmtTime(p.time)}</small></div><div class="act"><button class="btn sm" data-pd="${i}">删除</button></div></div>`).join('') : '<div class="empty">还没有讨论记录。</div>'}</div>`;
  $('#ppost').onclick = () => { const t = $('#pt').value.trim(); if (!t) return; POSTS = [{ t, time: Date.now() }, ...POSTS]; store.set('posts', POSTS); community(); };
  $('#pexp').onclick = () => download(C.name + '_讨论稿.md', POSTS.map(p => `- ${p.t}（${fmtTime(p.time)}）`).join('\n'));
  $$('[data-pd]').forEach(b => b.onclick = () => { POSTS.splice(+b.dataset.pd, 1); store.set('posts', POSTS); community(); });
}

/* ================= 闪卡 ================= */
function flash() {
  const pool = BANKS.objective;
  if (!pool.length) return ($('#main').innerHTML = '<div class="empty">暂无闪卡</div>');
  let q = pick(pool), open = false;
  const draw = () => {
    $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 考前闪卡</div>
      <h1 class="ph">考前闪卡</h1><p class="psub">先遮住答案回忆，再翻面核对。答“记得”会记入已掌握。</p>
      <div class="flash"><div class="fl">第 ${q.ch} 章 · ${E(q.no)} · ${KIND[q.kind]}</div>
        <div class="fb doc">${doc(q.stem)}${q.options && q.options.length ? `<div class="opts">${q.options.map(o => `<div class="opt" style="cursor:default"><span class="k">${o.key}</span><span class="oh">${doc(o.html)}</span></div>`).join('')}</div>` : ''}</div>
        ${open ? `<div class="fa doc"><b>参考答案</b>${doc(q.answer)}${q.why ? '<div class="small muted" style="margin-top:6px">' + doc(q.why) + '</div>' : ''}</div>` : ''}
        <div class="acts">${open ? `<button class="btn green" id="fok">记得</button><button class="btn" id="fno">不记得</button>` : '<button class="btn pri" id="fflip">翻面核对</button>'}<button class="btn" id="fnext">换一张</button></div></div>`;
    $('#fflip') && ($('#fflip').onclick = () => { open = true; draw(); });
    $('#fnext').onclick = () => { q = pick(pool); open = false; draw(); };
    $('#fok') && ($('#fok').onclick = () => { recordAnswer(q, true); q = pick(pool); open = false; draw(); });
    $('#fno') && ($('#fno').onclick = () => { setR(q.id, { status: 'weak', due: Date.now() + 864e5 }); q = pick(pool); open = false; draw(); });
  };
  draw();
}

/* ================= 收藏夹 ================= */
function saved() {
  const xs = C.bank.filter(q => R(q.id).star);
  $('#main').innerHTML = `<div class="crumb"><a href="#/home">首页</a> / 收藏夹</div>
  <h1 class="ph">收藏夹</h1><p class="psub">${xs.length} 道收藏。收藏只标“想再做”，不等于已掌握。</p>
  ${xs.length ? `<div class="list">${xs.map(q => `<div class="li"><span class="no">${E(q.no)}</span><div class="body"><div class="small muted">第 ${q.ch} 章 · ${KIND[q.kind]}${q.group === 'written' ? ' · 大题' : ''}</div>${E(T(q.stem).slice(0, 90))}</div><div class="act"><a class="btn sm" href="#/bank/${q.group === 'written' ? 'written' : 'objective'}?id=${encodeURIComponent(q.id)}">打开</a><button class="btn sm" data-un="${q.id}">取消</button></div></div>`).join('')}</div>`
      : '<div class="empty"><p>还没有收藏。</p><a class="btn" href="#/bank/objective">去题库看看</a></div>'}`;
  $$('[data-un]').forEach(b => b.onclick = () => { setR(b.dataset.un, { star: false }); saved(); });
}
</script>
