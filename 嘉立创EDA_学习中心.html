<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="嘉立创EDA 分步备考学习中心：知识讲解、引导式教学、客观题与大题专练、模拟考试、错题重练与学习报告。离线可用。">
<title>嘉立创EDA · 完整学习中心</title>
<style>:root{
  --bg:#f4f6fb; --card:#fff; --line:#e2e8f2; --line2:#eef2f9;
  --ink:#16202f; --muted:#5d6b80; --dim:#8a95a6;
  --navy:#0f2440; --navy2:#17365e; --brand:#2f6fdb; --brand-d:#1d4ed8;
  --teal:#0f766e; --purple:#6846bd; --amber:#b45309;
  --blue-bg:#eef4ff; --green-bg:#ecfdf5; --purple-bg:#f5f3ff; --amber-bg:#fff7ed;
  --ok:#15803d; --bad:#b91c1c;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(22,32,47,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);background:#eef1f5;border:1px solid #e0e5ec;border-radius:4px;padding:1px 5px;font-size:.9em;color:#243b6b}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);height:52px;display:flex;align-items:center;gap:14px;padding:0 18px}
.top .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--navy),#2f6fdb);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.top b{font-size:13.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{color:#c8d2e2}
.top .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim)}
.top .right a{color:var(--muted)}
.top .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px}

/* ---------- 三栏 ---------- */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 296px;max-width:1380px;margin:0 auto;align-items:start}
aside.side{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:20px 14px 36px}
.side .brand{font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.35}
.side .brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:4px;letter-spacing:.4px}
.prog{background:linear-gradient(135deg,#eef4ff,#f7faff);border:1px solid #dbe7ff;border-radius:10px;padding:10px 12px;margin:14px 0 12px;font-size:12px;color:#274a8c}
.prog .pt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog .pt span{font-size:11.5px;line-height:1.4}
.prog .pt b{font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;flex:none}
.progbar{height:5px;background:#d5e2fb;border-radius:5px;margin-top:7px;overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fdb,#5b9bff);border-radius:5px;transition:width .3s}
.side .grp{margin:16px 0 5px;font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.9px;padding-left:6px;text-transform:uppercase}
.side a.toc{display:flex;gap:7px;align-items:baseline;font-size:12.8px;line-height:1.45;color:#3b4657;padding:5px 8px;border-radius:6px;border-left:2px solid transparent}
.side a.toc:hover{background:var(--blue-bg);color:var(--brand-d)}
.side a.toc.on{background:var(--blue-bg);color:var(--brand-d);border-left-color:var(--brand);font-weight:700}
.side a.toc .num{font-family:var(--mono);color:#9aa4b2;font-size:10.5px;min-width:15px}
.side .tip{margin-top:20px;font-size:11.4px;color:var(--dim);line-height:1.7;border-top:1px dashed var(--line);padding-top:12px}

main{padding:0 28px 80px;min-width:0}
main:focus{outline:none}
aside.rail{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;padding:20px 18px 40px;border-left:1px solid var(--line);background:#fbfcff}
.rail .k{font-size:9.5px;letter-spacing:1.6px;color:var(--dim);font-weight:800;text-transform:uppercase}
.rail h3{margin:4px 0 12px;font-size:17px}
.rail .big{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.rail .big small{font-size:13px;color:var(--dim);font-weight:400}
.rail .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px;color:var(--muted)}
.rail .row b{color:var(--ink);font-variant-numeric:tabular-nums}
#saveWarn{background:#fff8ec;border-bottom:1px solid #f6dfb6;color:#8a5a12;padding:7px 14px;font-size:12.5px;text-align:center;position:sticky;top:52px;z-index:35}
.rail .blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rail .q{font-size:12px;color:var(--muted);line-height:1.65}
.rail .next{display:block;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--navy);color:#fff;text-align:center;font-size:12.5px;font-weight:700}
.rail .mini{display:flex;gap:6px;flex-wrap:nowrap;margin-top:8px}
.rail .mini a{flex:1 1 0;min-width:0;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:11px;color:var(--muted);background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 首页 ---------- */
.hero{position:relative;margin:22px 0 18px;border-radius:16px;overflow:hidden;background:linear-gradient(120deg,#0d2140 0%,#123059 62%,#1b4476 100%);color:#fff;padding:28px 30px 26px;box-shadow:0 6px 24px rgba(15,36,64,.16)}
.hero .kick{font-size:10.5px;letter-spacing:2.2px;color:#9fc0ea;font-weight:700;text-transform:uppercase}
.hero h1{margin:7px 0 8px;font-size:30px;letter-spacing:.5px;line-height:1.25}
.hero p{margin:0;color:#c9d8ec;font-size:13.6px;max-width:560px}
.hero .met{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.hero .met span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:3px 11px;font-size:11.5px;color:#dce8f8}
.hero .acts{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.hero .acts a,.hero .acts button{border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.hero .acts .pri{background:#fff;color:var(--navy);border-color:#fff}
.hero .deco{position:absolute;right:0;top:0;bottom:0;width:42%;opacity:.55;pointer-events:none}

.groups{margin-top:8px}
.chead{display:flex;align-items:baseline;gap:10px;margin:22px 0 9px;border-bottom:1px solid var(--line);padding-bottom:7px}
.chead h2{margin:0;font-size:14.5px;letter-spacing:.4px}
.chead h2 .n{color:var(--dim);font-family:var(--mono);font-size:12px;margin-right:7px}
.chead small{margin-left:auto;color:var(--dim);font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:12px;padding:14px 14px 12px;color:#fff;min-height:118px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,32,47,.14)}
.tile .ic{width:22px;height:22px;margin-bottom:8px;opacity:.92}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14.5px;font-weight:800;letter-spacing:.2px}
.tile span{font-size:11.5px;opacity:.82;line-height:1.5;margin-top:2px}
.tile small{margin-top:auto;font-size:11px;opacity:.9;padding-top:8px}
.tile.navy{background:linear-gradient(150deg,#16345c,#0f2440)}
.tile.blue{background:linear-gradient(150deg,#2f6fdb,#1d4ed8)}
.tile.green{background:linear-gradient(150deg,#12876f,#0f766e)}
.tile.purple{background:linear-gradient(150deg,#7b57cf,#5b3aa8)}
.tile.orange{background:linear-gradient(150deg,#c4700f,#9a4f08)}
.tile .dot{position:absolute;right:-18px;bottom:-18px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.07)}

.entrylinks{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.entrylinks a{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.entrylinks a b{color:var(--ink)}
.entrylinks a:hover{border-color:#c9d8f2;color:var(--brand-d)}

.sec{margin:30px 0 10px;font-size:15px;display:flex;align-items:center;gap:9px}
.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand)}
.chaplist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow);display:block;color:inherit}
.chcard:hover{border-color:#c9d8f2}
.chcard .r{display:flex;align-items:center;gap:8px}
.chcard .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chcard b{font-size:13.5px}
.chcard .bar{height:4px;background:var(--line2);border-radius:4px;margin-top:9px;overflow:hidden}
.chcard .bar i{display:block;height:100%;background:var(--teal)}
.chcard small{color:var(--dim);font-size:11px;display:block;margin-top:6px}

/* ---------- 通用 ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:18px 0 8px}
.crumb a{color:var(--muted)}
.ph{margin:6px 0 4px;font-size:24px;letter-spacing:.3px}
.psub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);margin:12px 0}
.panel h3{margin:0 0 10px;font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=search],input[type=number],input[type=text],textarea{border:1px solid #cfd9e8;border-radius:8px;padding:7px 10px;background:#fff;font-size:13.5px;min-height:37px}
textarea{width:100%;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(47,111,219,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cfd9e8;background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ink);font-weight:600}
.btn:hover{border-color:#9fb6da;background:#f8faff}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:#17365e}
.btn.green{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--blue-bg);border-color:#bfd4f7;color:var(--brand-d);font-weight:700}
.badge{display:inline-block;border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:700;line-height:1.7;vertical-align:1px}
.badge.g{background:var(--green-bg);color:var(--ok)}
.badge.b{background:var(--blue-bg);color:var(--brand-d)}
.badge.o{background:var(--amber-bg);color:var(--amber)}
.badge.p{background:var(--purple-bg);color:var(--purple)}
.badge.r{background:#fef2f2;color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11.5px}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* ---------- 文档 ---------- */
.doc{font-size:15px;line-height:1.85;color:#263449;min-width:0}
.doc p{margin:9px 0}
.doc ul,.doc ol{padding-left:22px;margin:8px 0}
.doc li{margin:4px 0}
.doc b{color:#0f2a5c}
.doc h4{margin:18px 0 6px;font-size:15.5px}
.doc .eq{font-family:"Cambria Math",Cambria,"Times New Roman",Georgia,serif;font-size:17px;line-height:2.05}
.doc .formula{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 16px 12px;margin:12px 0;text-align:center;overflow-x:auto;overflow-y:hidden}
.doc .formula .eq{font-size:17.5px;line-height:2.3}
.doc .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .22em;font-size:.96em;line-height:1.15}
.doc .fr>.fn{border-bottom:1.2px solid currentColor;padding:0 .28em .06em}
.doc .fr>.fd{padding:.04em .28em 0}
.doc .intg,.doc .sum{white-space:nowrap}
.doc .intg>.lim,.doc .sum>.lim{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.56em;line-height:1.15;margin:0 .1em 0 -.05em;text-align:left}
.doc .intg>.lim>.u,.doc .sum>.lim>.u{order:1}
.doc .intg>.lim>.l,.doc .sum>.lim>.l{order:2}
.doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.8px;background:#fff}
.doc th,.doc td{border:1px solid #e3e9f3;padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:#f5f8fd;color:#0f2a5c;font-weight:800;font-size:13px}
.doc .tablewrap{overflow-x:auto;max-width:100%;margin:12px 0;border-radius:8px}
.doc .tablewrap table{margin:0;min-width:560px}
.doc td:first-child,.doc th:first-child{min-width:74px}
.doc td:last-child,.doc th:last-child{min-width:112px}
.doc .kp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:0 12px 12px 0;padding:13px 17px;margin:14px 0}
.doc .kp .t{font-weight:800;color:var(--brand-d);font-size:15.5px;display:block;margin-bottom:3px}
.doc .tip{background:#fff8ec;border:1px solid #f6dfb6;border-radius:11px;padding:11px 15px;margin:12px 0;font-size:14.4px}
.doc .tip b{color:var(--amber)}
.doc .warn{background:#fef2f2;border:1px solid #f6cdcd;border-radius:11px;padding:11px 15px;margin:12px 0;font-size:14.4px}
.doc .warn b{color:var(--bad)}
.doc .note{background:#f0f9ff;border:1px solid #cfe8fb;border-radius:11px;padding:11px 15px;margin:12px 0}
.doc .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin:10px 0;font-size:14px}
.doc .ch-intro{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 17px;margin:10px 0 16px;font-size:14.3px;color:#41506a}
.doc .ch-intro b{color:#0f2a5c}
.doc .lead{color:var(--muted);font-size:13.7px}
.doc .eg{background:#fff;border:1px solid var(--line);border-radius:13px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
.doc .eg-h{background:linear-gradient(90deg,#edf3ff,#f9fbff);padding:9px 15px;font-weight:800;color:var(--brand-d);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14.5px}
.doc .eg-h .tag{font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:1px 8px;flex:none}
.doc .eg-h .tag.g{background:var(--teal)}
.doc .eg-b{padding:11px 16px 13px}
.doc details.sol{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.doc details.sol summary{cursor:pointer;color:var(--brand);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:13.8px;user-select:none}
.doc details.sol summary::-webkit-details-marker{display:none}
.doc details.sol summary::before{content:"▸";display:inline-block;transition:transform .2s}
.doc details.sol[open] summary::before{transform:rotate(90deg)}
.doc details.sol .body{margin-top:8px;font-size:14.5px}
.doc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc .qs .q{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin:8px 0;font-size:14.3px}
.doc .qs .q::before{content:"›";color:var(--brand);font-weight:800;margin-right:7px}
.doc img{max-width:100%;height:auto}

/* ---------- 阅读器 ---------- */
.reader{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.rnav{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.rnav a{display:block;font-size:12.3px;line-height:1.45;color:#42506a;padding:6px 9px;border-radius:6px}
.rnav a:hover{background:var(--blue-bg)}
.rnav a.on{background:var(--blue-bg);color:var(--brand-d);font-weight:700}
.rnav .h{font-size:10.5px;color:var(--dim);letter-spacing:.7px;font-weight:800;padding:6px 9px 3px}
.rbody{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px 30px;box-shadow:var(--shadow)}
.rbody h2{margin:0 0 6px;font-size:21px}
.rbody .meta{font-size:12px;color:var(--dim);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.rbody .secbody{border-top:1px solid var(--line2);padding-top:16px;margin-top:18px}
.rbody .secbody:first-of-type{border-top:0;margin-top:8px;padding-top:0}
.rbody h3{font-size:17px;margin:4px 0 10px}
.rtools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding-top:14px;border-top:1px dashed var(--line)}

/* ---------- 题库 ---------- */
body.bank .rail,body.bank .side{display:none}
body.bank .menu{display:none}
body.bank .layout{grid-template-columns:minmax(0,1fr)}
body.bank main{max-width:900px;margin:0 auto;padding:0 22px 80px}
.bhead{margin:22px 0 6px}
.bhead .bk{font-size:10.5px;letter-spacing:2px;color:var(--dim);font-weight:800;text-transform:uppercase}
.bhead h1{font-size:28px;margin:5px 0 4px}
.bhead p{margin:0;color:var(--muted);font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.filters select,.filters input{width:100%;min-width:0}
.qjump{display:flex;gap:8px;align-items:center;margin:8px 0 14px}
.qjump select{flex:1;min-width:0}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 20px 15px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);margin-bottom:9px}
.qmeta .no{font-weight:800;color:var(--brand-d);font-size:13px}
.qmeta .src{margin-left:auto}
.qmeta .sp{color:#c8d2e2}
.qstem{font-size:15px;line-height:1.85;overflow-wrap:anywhere}
.qstem .ln{display:inline}
.opts{display:grid;gap:7px;margin:13px 0 4px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid #d7e0ee;background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;line-height:1.7;color:#243247;width:100%}
.opt:hover{border-color:#9fb6da;background:#f9fbff}
.opt .k{font-weight:800;color:var(--brand-d);flex:none;width:16px}
.opt .oh{min-width:0;overflow-wrap:anywhere}
.opt.pick{border-color:var(--brand);background:var(--blue-bg)}
.opt.right{border-color:#86c9a4;background:#f0fbf4}
.opt.wrong{border-color:#e6a3a3;background:#fef2f2}
.opt:disabled{cursor:default}
.opt .eq{font-family:"Cambria Math",Cambria,Georgia,serif}
.judge{display:flex;gap:9px;margin:13px 0 4px}
.judge button{min-width:88px;border:1px solid #d7e0ee;background:#fff;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700}
.judge button:hover{border-color:#9fb6da}
.judge button.right{border-color:#86c9a4;background:#f0fbf4;color:var(--ok)}
.judge button.wrong{border-color:#e6a3a3;background:#fef2f2;color:var(--bad)}
.fills{margin:12px 0 4px;display:grid;gap:8px}
.fillrow{display:flex;gap:9px;align-items:center}
.fillrow span{font-size:11.5px;color:var(--dim);min-width:34px}
.fillrow input{flex:1}
.fillrow .mark{font-weight:800;min-width:18px}
.fillrow .mark.ok{color:var(--ok)}
.fillrow .mark.no{color:var(--bad)}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:13px}
.qfoot .state{font-size:11.5px;color:var(--dim);margin-left:2px}
.feed{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
.feed .ans{background:#f0fbf4;border:1px solid #cfe9d8;border-radius:9px;padding:9px 13px;font-size:14px;margin:8px 0}
.feed .ans b{color:var(--ok)}
.feed .why{font-size:14px;color:#3b4a61}
.feed .cause{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.navq{display:flex;justify-content:space-between;gap:8px;margin:14px 0 0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- 训练/考试 ---------- */
.drillbar{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.drillbar .bar{flex:1}
.drillbar small{font-size:11.5px;color:var(--dim);white-space:nowrap}
.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.result .big{font-size:44px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.result .big small{font-size:15px;color:var(--dim);font-weight:400}
.timer{font-family:var(--mono);font-size:14px;background:#0f2440;color:#fff;border-radius:8px;padding:5px 11px}
.examq{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin:11px 0}
.examq .qn{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.review{border-left:3px solid var(--line);padding-left:12px;margin:12px 0}
.review.ok{border-color:#86c9a4}
.review.no{border-color:#e6a3a3}

/* ---------- 工具 ---------- */
.tool{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.tool .out{background:#0f2440;color:#e7f0fb;border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.8}
.tool .out b{color:#fff;font-size:22px;font-variant-numeric:tabular-nums}
.tool .out code{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.field{display:block;margin:10px 0;font-size:12px;color:var(--muted)}
.field input,.field select{display:block;width:100%;margin-top:4px}
.field input[type=range]{margin-top:8px}
.field input[type=range]{width:100%;min-height:26px}
.field .v{font-weight:800;color:var(--ink);font-size:13.5px}
.labtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.labtab{text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.labtab:hover{transform:translateY(-1px);border-color:#b9cdea}
.labtab b{display:block;font-size:13px;color:var(--ink);line-height:1.4}
.labtab span{display:block;font-size:10.8px;color:var(--muted);margin-top:2px;line-height:1.45}
.labtab.on{border-color:#9fb6da;background:var(--blue-bg);box-shadow:0 0 0 2px rgba(47,111,219,.08)}
.labtab.on b{color:var(--brand-d)}
.labnote{font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:8px}
.vbar{height:8px;background:#e6edf8;border-radius:6px;overflow:hidden;margin:9px 0 4px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6fdb,#69a6f5);border-radius:6px;transition:width .2s}
.vscale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);gap:4px}
.dfm{display:grid;gap:6px;margin-top:8px}
.dfm .r{display:flex;align-items:center;gap:8px;font-size:12.2px;border-bottom:1px dashed rgba(255,255,255,.14);padding-bottom:5px;color:#dbe7f6}
.dfm .r b{margin-left:auto;flex:none}
.powergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin:6px 0 2px}
.projgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.projcard{text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.projcard:hover{transform:translateY(-1px);border-color:#b9cdea}
.projcard .pn{font-family:var(--mono);font-size:10px;color:var(--dim)}
.projcard b{display:block;font-size:13px;line-height:1.45;margin-top:1px}
.projcard small{display:block;font-size:10.8px;color:var(--muted);margin-top:4px}
.projcard.on{border-color:#9fb6da;background:var(--blue-bg);box-shadow:0 0 0 2px rgba(47,111,219,.08)}
.projcard.on b{color:var(--brand-d)}
.projcard.done{border-left:3px solid #0f766e}
.projcard.done small{color:#0f766e}
.chip.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}

.powergrid .field{margin:0}
.checkline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:9px 0 2px;line-height:1.5}
.checkline input{width:14px;height:14px;min-height:0;margin:0}
.pwsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.pwsum div{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
.pwsum small{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}
.pwsum b{display:block;font-size:16.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.verdict{padding:11px 14px;border-radius:10px;font-size:13.4px;line-height:1.75;margin:10px 0;border:1px solid}
.verdict.bad{background:#fef2f2;border-color:#f2c9c9;color:#7f1d1d}
.verdict.warn{background:#fff8ec;border-color:#f1dab3;color:#7a4a0c}
.verdict.ok{background:#f0fbf4;border-color:#c9e7d4;color:#14532d}
table.tb tr.cur td{background:#eef4ff}
.pwtb th,.pwtb td{white-space:nowrap}
@media(max-width:700px){
  .pwtb thead{display:none}
  .pwtb,.pwtb tbody,.pwtb tr,.pwtb td{display:block;width:100%}
  .pwtb{margin:0;border:0;background:transparent}
  .pwtb tr{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:7px 11px;background:#fff}
  .pwtb tr.cur{background:#eef4ff;border-color:#bcd4f6}
  .pwtb td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:3px 0;font-size:12.5px;text-align:right;white-space:normal}
  .pwtb td::before{content:attr(data-l);color:var(--muted);font-weight:600;text-align:left;flex:none}
  .pwtb td:first-child{font-weight:800;color:var(--brand-d);font-size:13.5px;border-bottom:1px dashed var(--line);margin-bottom:5px;padding-bottom:6px}
  .pwtb td:first-child{justify-content:space-between}
}



canvas{display:block;width:100%;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.tool>*{min-width:0}
.deriv{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin:10px 0;background:#fff}
.deriv h4{margin:0 0 6px;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:8px 10px 8px 34px;border-bottom:1px dashed var(--line2);font-size:13.5px}
.steps li::before{content:counter(s);position:absolute;left:4px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--blue-bg);color:var(--brand-d);font-size:11px;font-weight:800;display:grid;place-items:center}

/* ---------- 表格/列表 ---------- */
.list{display:grid;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.li .no{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:52px}
.li .body{flex:1;min-width:0}
.li .act{display:flex;gap:5px;flex:none}
.tablewrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.tb th{background:#f5f8fd;font-weight:800;color:#0f2a5c}

/* ---------- 闪卡 ---------- */
.flash{max-width:640px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:16px;min-height:260px;padding:26px 28px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(22,32,47,.06)}
.flash .fl{font-size:11px;color:var(--dim);letter-spacing:1px;font-weight:800}
.flash .fb{flex:1;display:flex;align-items:center;font-size:16px;line-height:1.9;padding:14px 0}
.flash .fa{border-top:1px dashed var(--line);padding-top:14px;font-size:14px}
.flash .acts{display:flex;gap:8px;margin-top:14px}

/* ---------- 响应式 ---------- */
@media(max-width:1180px){
  .layout{grid-template-columns:236px minmax(0,1fr)}
  .labtabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  aside.rail{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;z-index:60;left:0;top:0;bottom:0;width:280px;height:100vh;transform:translateX(-102%);transition:transform .22s;box-shadow:0 10px 40px rgba(0,0,0,.2);padding-top:18px}
  body.nav-open aside.side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(12,22,38,.38);z-index:55}
  .top .menu{display:inline-flex}
  .top .sub,.top .sep{display:none}
  main{padding:0 14px 70px}
  .hero{padding:22px 20px 20px;border-radius:14px}
  .hero h1{font-size:23px}
  .hero .deco{opacity:.28;width:60%}
  .reader{grid-template-columns:minmax(0,1fr)}
  .rnav{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}
  .rnav .h{display:none}
  .rnav a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px}
  .rbody{padding:16px 15px 22px}
  .filters{grid-template-columns:1fr 1fr}
  .filters label:nth-child(3),.filters label:nth-child(4){grid-column:1/-1}
  .qjump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qjump select{grid-column:1/-1;grid-row:1;width:100%}
  .qjump #prev{grid-column:1;grid-row:2}
  .qjump #next{grid-column:2;grid-row:2}
  .top .right span{display:none}
  body.bank.nav-open::after{display:none}
  .grid2,.grid3,.tool{grid-template-columns:1fr}
  .labtabs{grid-template-columns:1fr 1fr}
  .projgrid{grid-template-columns:1fr 1fr}
  .powergrid{grid-template-columns:1fr 1fr}
  .pwsum{grid-template-columns:1fr 1fr}
  .labtabs .labtab:last-child:nth-child(odd){grid-column:1/-1}
  .chaplist{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{min-height:104px;padding:12px}
  .tile b{font-size:13.5px}
  .tile span{font-size:11px}
  .qcard{padding:14px 14px 13px}
  .bhead h1{font-size:23px}
  .doc{font-size:14.5px}
  .doc .eq{font-size:16px}
  body.bank main{padding:0 12px 70px}
}
@media(max-width:560px){
  .powergrid{grid-template-columns:1fr}
}
@media(max-width:380px){
  .projgrid{grid-template-columns:1fr}
}
@media(max-width:420px){
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile b{font-size:12.8px}
  .hero h1{font-size:21px}
}
@media print{
  .top,aside.side,aside.rail,.filters,.qfoot,.navq,.hero .acts{display:none!important}
  .layout{display:block}
  body{background:#fff}
  .doc details.sol .body{display:block!important}
}
</style>
</head>

<script>window.COURSE={"id":"eda","name":"嘉立创EDA","chapters":[{"n":0,"title":"知识点速查","intro":"\u003cp>把零散题目归到几条主线：先记住它们，再去做题会快很多。\u003c/p>","sections":[{"id":"kb0","title":"① 原理图 → PCB 的完整链路","html":"\u003cp style=\"margin:4px 0\">画原理图（放元件、连导线、加网络标签）→ 给每个元件指定\u003cb>封装\u003c/b>（元件属性 Footprint / 封装管理器）→ 编译 ERC 查错 → \u003cb>设计 → 更新/同步到 PCB\u003c/b> → 布局 → 布线 → 铺铜 → DRC → 导出 Gerber。\u003c/p> \u003cp style=\"margin-bottom:0\">\u003cb>关键：\u003c/b>原理图与 PCB 之间是\u003cb>网络表（Netlist）\u003c/b>在传递连接关系，不是\"看起来连上了\"就算连上。\u003c/p>"},{"id":"kb1","title":"② 电气连接的三个硬条件","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>导线端点必须落在\u003cb>引脚的电气热点\u003c/b>上，出现实心连接圆点；\u003c/li> \u003cli>网络标签必须\u003cb>精确放在导线/引脚的连接点\u003c/b>上，仅\"靠近\"不会建立连接；\u003c/li> \u003cli>\u003cb>跨图页\u003c/b>连通要用\u003cb>全局网络标签 / 网络端口 / 离图连接器\u003c/b>，普通网络标签只在同页有效。\u003c/li> \u003c/ul>"},{"id":"kb2","title":"③ 封装管理器：逻辑绑定，不是视觉叠加","html":"\u003cp style=\"margin-bottom:0\">有效做法：在元件属性 Footprint 字段从工程/系统库选封装；自定义封装先\"添加到工程\"再指定；在封装管理器确认\"已启用 + 默认\"。\u003cb>把封装图形拖到符号上叠在一起只是视觉重叠，不产生逻辑绑定。\u003c/b>位号重复用「设计 → 分配位号 / 标注」全局重编。\u003c/p>"},{"id":"kb3","title":"④ 铺铜（覆铜）four 条铁律","html":"\u003col style=\"margin-bottom:0\"> \u003cli>铺铜必须指定\u003cb>网络\u003c/b>（如 GND），与焊盘网络不一致会被当作孤岛移除；\u003c/li> \u003cli>修改布局/走线后铺铜\u003cb>不会自动重算\u003c/b>，必须手动\u003cb>重建（重新铺铜）\u003c/b>；\u003c/li> \u003cli>两块铜皮合并的前提是\u003cb>同一网络\u003c/b>，还要检查所在层、优先级/填充属性一致；\u003c/li> \u003cli>孤立铜皮、飞线、DRC 报错，往往都是\"没重建铺铜\"引起的。\u003c/li> \u003c/ol>"},{"id":"kb4","title":"⑤ 内电层（Internal Plane）= 负片","html":"\u003cp style=\"margin:4px 0\">\u003cb>负片\u003c/b>：默认整层铺满铜，\"画线\"的地方是\u003cb>把铜清除\u003c/b>做隔离带。分割内电层用\u003cb>折线（Polyline）\u003c/b>画闭合隔离带，并给每个分割区指定正确网络；分割完要\u003cb>手动重建内电层\u003c/b>再导出。\u003c/p> \u003cp style=\"margin-bottom:0\">输出 Gerber 时会转成\u003cb>正片\u003c/b>。隐藏某个层只是显示控制，\u003cb>不等于\u003c/b>该层不导出，导出内容由 Gerber 层设置决定。\u003c/p>"},{"id":"kb5","title":"⑥ 过孔家族与层管理","html":"\u003ctable style=\"margin:6px 0\">\u003ctbody> \u003ctr>\u003ctd>\u003cb>过孔 Via\u003c/b>\u003c/td>\u003ctd>贯通所有层，用于顶底层之间切换走线\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cb>盲孔 Blind Via\u003c/b>\u003c/td>\u003ctd>表层 ↔ 内层，不贯通整板\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cb>埋孔 Buried Via\u003c/b>\u003c/td>\u003ctd>内层 ↔ 内层，表底层都看不到\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table> \u003cp style=\"margin-bottom:0\">铜箔层数取\u003cb>偶数\u003c/b>，顶层和底层是默认层不能删除。多层板还要先做\u003cb>图层规划与板框设置\u003c/b>，再布线；盲埋孔除软件设置外还受\u003cb>板厂工艺能力\u003c/b>限制，不是 Gerber 里画了就一定能做。\u003c/p>"},{"id":"kb6","title":"⑦ DRC 能查什么、不能查什么","html":"\u003cp style=\"margin:4px 0\">能查：线宽、间距、孔外径、丝印压焊盘、未连接网络、短路等\u003cb>已定义网络之间\u003c/b>的冲突。\u003c/p> \u003cp style=\"margin-bottom:0\">\u003cb>不能查：\u003c/b>网络定义本身是否符合设计意图。例如把 GND 符号的网络属性错设成 +5V，DRC 会全部通过，直到调试才暴露。\u003cb>DRC 全过 ≠ 设计正确。\u003c/b>\u003c/p>"},{"id":"kb7","title":"⑧ 规则、工艺与元器件选型","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>安全间距/线宽要\u003cb>不低于板厂工艺能力并留余量\u003c/b>，不能改 0 或关 DRC 硬布通；\u003c/li> \u003cli>晶振、滤波电容尽量\u003cb>靠近主控芯片对应引脚\u003c/b>；\u003c/li> \u003cli>阻抗线的参考平面必须是\u003cb>实心铜皮\u003c/b>，被走线/过孔切割会让实际阻抗偏离计算值；\u003c/li> \u003cli>元件选\u003cb>成长期/成熟期\u003c/b>型号，避开停产（EOL）；电容耐压留 \u003cb>2 倍以上\u003c/b>余量（5V 电路用 10V/16V）。\u003c/li> \u003c/ul>"}]},{"n":1,"title":"原理图与封装","intro":"\u003cp>本章 13 题：选择 8 题、填空 1 题、判断 4 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt1","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q1\u003c/b>　报错说的是逻辑绑定缺失，应到封装管理器修正元件与封装的对应关系；手动放元件、忽略报错、删元件都不能解决网络表问题。\u003c/li>\u003cli>\u003cb>Q2\u003c/b>　用增量同步而不是重新转一次 PCB，否则已完成的布局布线会被打乱。\u003c/li>\u003cli>\u003cb>Q3\u003c/b>　网络改名后要检查飞线与走线归属，软件不会保证已布走线自动跟随新网络名。\u003c/li>\u003cli>\u003cb>Q4\u003c/b>　放置非连接标识符（X），明确告诉 ERC 这个引脚是故意不接的。\u003c/li>\u003cli>\u003cb>Q5\u003c/b>　焊盘编号要与原理图引脚号一一对应；放置时可自动递增，但复制粘贴出来的焊盘常需手工确认编号。D 也偏绝对：编号错了一般仍能转 PCB，只是引脚/网络对应错。\u003c/li>\u003cli>\u003cb>Q6\u003c/b>　普通网络标签只在同页有效；跨页要用全局网络标签、网络端口或离图连接器。电源符号虽全局，但不能拿来代替信号名。\u003c/li>\u003c/ul>"}]},{"n":2,"title":"PCB布局与布线","intro":"\u003cp>本章 18 题：简答/实验 6 题、选择 8 题、填空 3 题、简答/实验 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt2","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q14\u003c/b>　要点：先导入网络表并核对封装，再布局布线；电源线加粗、加泪滴，二维/三维图与姓名学号一并提交；最后重建铺铜 + DRC。\u003c/li>\u003cli>\u003cb>Q15\u003c/b>　要点：先导入网络表并核对封装，再布局布线；电源线加粗、加泪滴，二维/三维图与姓名学号一并提交；最后重建铺铜 + DRC。\u003c/li>\u003cli>\u003cb>Q16\u003c/b>　按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口。建议在提交前跑一次 DRC 并重建铺铜。\u003c/li>\u003cli>\u003cb>Q17\u003c/b>　原则是&quot;对象自身设置 &gt; 全局规则&quot;，但当对象在属性面板选了&quot;跟随规则&quot;，就以设计规则为准。不同版本措辞略有差异，建议软件里实测一次。\u003c/li>\u003cli>\u003cb>Q18\u003c/b>　去耦电容、晶振要尽量靠近主控芯片对应引脚，缩短回流路径、减小寄生参数。\u003c/li>\u003cli>\u003cb>Q19\u003c/b>　铺铜网络与焊盘网络不一致时，软件会把它当作孤岛（孤立铜皮）移除，看起来就是&quot;没铺上&quot;。\u003c/li>\u003c/ul>"}]},{"n":3,"title":"铺铜与铜皮","intro":"\u003cp>本章 3 题：选择 1 题、填空 1 题、简答/实验 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt3","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q32\u003c/b>　同网络是合并的必要条件；颜色、时间、大小都不是。\u003c/li>\u003cli>\u003cb>Q33\u003c/b>　同一网络之外还要在同一层，且铺铜优先级、填充样式一致，否则合并后行为不可预期。\u003c/li>\u003cli>\u003cb>Q34\u003c/b>　铺铜是&quot;算出来&quot;的静态结果，布局/走线改动后不会自动重算，必须手动重建铺铜，否则出现飞线或孤立铜皮。\u003c/li>\u003c/ul>"}]},{"n":4,"title":"DRC与规则检查","intro":"\u003cp>本章 1 题：选择 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt4","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q35\u003c/b>　线宽、间距、孔外径都是可配置 DRC 项；元件颜色只是显示属性，不属于电气/制造规则。\u003c/li>\u003c/ul>"}]},{"n":5,"title":"层管理与内电层","intro":"\u003cp>本章 11 题：选择 8 题、填空 2 题、判断 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt5","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q36\u003c/b>　工具 → 图层管理器里设置层数、叠层顺序与层属性。\u003c/li>\u003cli>\u003cb>Q37\u003c/b>　盲孔是表层到内层、埋孔是内层到内层（表底层看不到）；设置前需在规则/层叠中添加层对，单层板谈不上盲埋孔。\u003c/li>\u003cli>\u003cb>Q38\u003c/b>　内电层用负片：默认整层铺铜，画线处清除铜做隔离。\u003c/li>\u003cli>\u003cb>Q39\u003c/b>　只连表层与内层、不贯穿整板的是盲孔；只连内层之间的是埋孔。\u003c/li>\u003cli>\u003cb>Q40\u003c/b>　隐藏只是显示控制；导出哪些层由 Gerber 输出设置决定，隐藏层照样可能被导出。\u003c/li>\u003cli>\u003cb>Q41\u003c/b>　负片方式：默认铺满铜，绘制折线的地方把铜清除。\u003c/li>\u003c/ul>"}]},{"n":6,"title":"Gerber与制造输出","intro":"\u003cp>本章 5 题：选择 2 题、判断 2 题、简答/实验 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt6","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q47\u003c/b>　选型优先成长期/成熟期型号；EOL（停产）、即将停产、刚发布新品都有供货或验证风险。\u003c/li>\u003cli>\u003cb>Q48\u003c/b>　5V 电路通常选耐压 2 倍以上（10V 或 16V）的电容；&quot;刚好高于工作电压&quot;不留余量，电解电容同样要看耐压。\u003c/li>\u003cli>\u003cb>Q49\u003c/b>　编辑视图用负片方便画隔离带，制造文件必须转成正片，板厂才能按&quot;有线即有铜&quot;生产。\u003c/li>\u003cli>\u003cb>Q50\u003c/b>　分割后不手动重建内电层就导出，旧铜皮数据会被带进 Gerber，可能把本该隔离的两块网络连在一起。\u003c/li>\u003cli>\u003cb>Q51\u003c/b>　软件能画 ≠ 板厂能做。盲埋孔属于特殊工艺，下单时必须选择对应工艺并确认层对、价格与交期。\u003c/li>\u003c/ul>"}]},{"n":7,"title":"综合与其他","intro":"\u003cp>本章 1 题：简答/实验 1 题。先做客观题确认概念，再用简答/实验题练完整表述。\u003c/p>","sections":[{"id":"pt7","title":"本章要点（来自题目解析）","html":"\u003cul>\u003cli>\u003cb>Q52\u003c/b>　按要求完成：用立创 EDA 画原理图 → 指定封装 → 转 PCB 并布局布线 → 输出二维、三维图 → 图上标注姓名与学号。提交前跑 ERC/DRC。\u003c/li>\u003c/ul>"}]}],"blocks":[{"title":"① 原理图 → PCB 的完整链路","html":"\u003cp style=\"margin:4px 0\">画原理图（放元件、连导线、加网络标签）→ 给每个元件指定\u003cb>封装\u003c/b>（元件属性 Footprint / 封装管理器）→ 编译 ERC 查错 → \u003cb>设计 → 更新/同步到 PCB\u003c/b> → 布局 → 布线 → 铺铜 → DRC → 导出 Gerber。\u003c/p> \u003cp style=\"margin-bottom:0\">\u003cb>关键：\u003c/b>原理图与 PCB 之间是\u003cb>网络表（Netlist）\u003c/b>在传递连接关系，不是\"看起来连上了\"就算连上。\u003c/p>"},{"title":"② 电气连接的三个硬条件","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>导线端点必须落在\u003cb>引脚的电气热点\u003c/b>上，出现实心连接圆点；\u003c/li> \u003cli>网络标签必须\u003cb>精确放在导线/引脚的连接点\u003c/b>上，仅\"靠近\"不会建立连接；\u003c/li> \u003cli>\u003cb>跨图页\u003c/b>连通要用\u003cb>全局网络标签 / 网络端口 / 离图连接器\u003c/b>，普通网络标签只在同页有效。\u003c/li> \u003c/ul>"},{"title":"③ 封装管理器：逻辑绑定，不是视觉叠加","html":"\u003cp style=\"margin-bottom:0\">有效做法：在元件属性 Footprint 字段从工程/系统库选封装；自定义封装先\"添加到工程\"再指定；在封装管理器确认\"已启用 + 默认\"。\u003cb>把封装图形拖到符号上叠在一起只是视觉重叠，不产生逻辑绑定。\u003c/b>位号重复用「设计 → 分配位号 / 标注」全局重编。\u003c/p>"},{"title":"④ 铺铜（覆铜）four 条铁律","html":"\u003col style=\"margin-bottom:0\"> \u003cli>铺铜必须指定\u003cb>网络\u003c/b>（如 GND），与焊盘网络不一致会被当作孤岛移除；\u003c/li> \u003cli>修改布局/走线后铺铜\u003cb>不会自动重算\u003c/b>，必须手动\u003cb>重建（重新铺铜）\u003c/b>；\u003c/li> \u003cli>两块铜皮合并的前提是\u003cb>同一网络\u003c/b>，还要检查所在层、优先级/填充属性一致；\u003c/li> \u003cli>孤立铜皮、飞线、DRC 报错，往往都是\"没重建铺铜\"引起的。\u003c/li> \u003c/ol>"},{"title":"⑤ 内电层（Internal Plane）= 负片","html":"\u003cp style=\"margin:4px 0\">\u003cb>负片\u003c/b>：默认整层铺满铜，\"画线\"的地方是\u003cb>把铜清除\u003c/b>做隔离带。分割内电层用\u003cb>折线（Polyline）\u003c/b>画闭合隔离带，并给每个分割区指定正确网络；分割完要\u003cb>手动重建内电层\u003c/b>再导出。\u003c/p> \u003cp style=\"margin-bottom:0\">输出 Gerber 时会转成\u003cb>正片\u003c/b>。隐藏某个层只是显示控制，\u003cb>不等于\u003c/b>该层不导出，导出内容由 Gerber 层设置决定。\u003c/p>"},{"title":"⑥ 过孔家族与层管理","html":"\u003ctable style=\"margin:6px 0\">\u003ctbody> \u003ctr>\u003ctd>\u003cb>过孔 Via\u003c/b>\u003c/td>\u003ctd>贯通所有层，用于顶底层之间切换走线\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cb>盲孔 Blind Via\u003c/b>\u003c/td>\u003ctd>表层 ↔ 内层，不贯通整板\u003c/td>\u003c/tr> \u003ctr>\u003ctd>\u003cb>埋孔 Buried Via\u003c/b>\u003c/td>\u003ctd>内层 ↔ 内层，表底层都看不到\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table> \u003cp style=\"margin-bottom:0\">铜箔层数取\u003cb>偶数\u003c/b>，顶层和底层是默认层不能删除。多层板还要先做\u003cb>图层规划与板框设置\u003c/b>，再布线；盲埋孔除软件设置外还受\u003cb>板厂工艺能力\u003c/b>限制，不是 Gerber 里画了就一定能做。\u003c/p>"},{"title":"⑦ DRC 能查什么、不能查什么","html":"\u003cp style=\"margin:4px 0\">能查：线宽、间距、孔外径、丝印压焊盘、未连接网络、短路等\u003cb>已定义网络之间\u003c/b>的冲突。\u003c/p> \u003cp style=\"margin-bottom:0\">\u003cb>不能查：\u003c/b>网络定义本身是否符合设计意图。例如把 GND 符号的网络属性错设成 +5V，DRC 会全部通过，直到调试才暴露。\u003cb>DRC 全过 ≠ 设计正确。\u003c/b>\u003c/p>"},{"title":"⑧ 规则、工艺与元器件选型","html":"\u003cul style=\"margin-bottom:0\"> \u003cli>安全间距/线宽要\u003cb>不低于板厂工艺能力并留余量\u003c/b>，不能改 0 或关 DRC 硬布通；\u003c/li> \u003cli>晶振、滤波电容尽量\u003cb>靠近主控芯片对应引脚\u003c/b>；\u003c/li> \u003cli>阻抗线的参考平面必须是\u003cb>实心铜皮\u003c/b>，被走线/过孔切割会让实际阻抗偏离计算值；\u003c/li> \u003cli>元件选\u003cb>成长期/成熟期\u003c/b>型号，避开停产（EOL）；电容耐压留 \u003cb>2 倍以上\u003c/b>余量（5V 电路用 10V/16V）。\u003c/li> \u003c/ul>"}],"pitfalls":["把\"看起来连上了\"当成电气连接：ERC 依据网络表，网络标签必须落在连接点。","跨页仍用普通网络标签：跨页要用全局网络标签 / 网络端口 / 离图连接器。","改了布局走线忘记重建铺铜：飞线、孤立铜皮、DRC 报错多半由此而来。","以为内电层隐藏了就不导出 Gerber：导出内容由 Gerber 层设置决定。","把负片当正片：内电层画线是\"清铜\"，分割线要用折线并闭合。","认为 DRC 全过就万事大吉：网络属性定义错（如 GND 符号设成 +5V）DRC 查不出来。","为布通把安全间距改成 0 或关掉 DRC：必须不低于板厂工艺能力并留余量。","把封装图形拖到符号上就算绑定：必须在元件属性 / 封装管理器里指定 Footprint。","盲孔、埋孔、过孔三者混淆：过孔贯通、盲孔表层↔内层、埋孔内层↔内层。","盲埋孔以为画了就能做：还要板厂工艺支持，下单需选对应工艺。"],"bank":[{"id":"eda-Q1","ch":1,"no":"Q1","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA中，将原理图转换为PCB时，如果出现“封装名未通过封装管理器指定过”的报错，正确的处理方式是（ ）","options":[{"key":"A","html":"直接在PCB中手动放置元件"},{"key":"B","html":"在封装管理器中修正元件与封装的对应关系"},{"key":"C","html":"忽略该错误，强制转换"},{"key":"D","html":"删除原理图中的该元件"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">报错说的是逻辑绑定缺失，应到封装管理器修正元件与封装的对应关系；手动放元件、忽略报错、删元件都不能解决网络表问题。\u003c/p>","source":"L03 p5 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q2","ch":1,"no":"Q2","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA中，将原理图的变更同步更新到已有的PCB文件时，应点击顶部菜单“设计”下的“______”功能，而非重新转一次PCB。\u003c/span>","options":[],"answer":"设计 → 更新/同步到 PCB（Update PCB）","answerKey":"","why":"\u003cp class=\"q-why\">用增量同步而不是重新转一次 PCB，否则已完成的布局布线会被打乱。\u003c/p>","source":"L03 p5 题5","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q3","ch":1,"no":"Q3","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA中，从原理图更新网络到PCB后，原网络已经布好的走线会自动跟随新的网络名变化，无需手动修改。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">网络改名后要检查飞线与走线归属，软件不会保证已布走线自动跟随新网络名。\u003c/p>","source":"L03 p5 题6","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q4","ch":1,"no":"Q4","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA原理图中，若某个元器件引脚设计上不需连接任何网络，规范的做法是放置什么标识符？( )","options":[{"key":"A","html":"网络标签"},{"key":"B","html":"非连接标识符（X）"},{"key":"C","html":"网络端口"},{"key":"D","html":"总线分支"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">放置非连接标识符（X），明确告诉 ERC 这个引脚是故意不接的。\u003c/p>","source":"L03 p7 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q5","ch":1,"no":"Q5","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">绘制PCB封装时，关于焊盘编号的设置，以下说法错误的是？","options":[{"key":"A","html":"焊盘编号需与元件引脚编号一一对应"},{"key":"B","html":"焊盘编号可以通过鼠标放置自动递增"},{"key":"C","html":"通过复制粘贴放置的焊盘，编号会自动递增"},{"key":"D","html":"焊盘编号设置错误会导致原理图无法转为PCB"}],"answer":"C（复制粘贴通常不会自动递增）","answerKey":"C","why":"\u003cp class=\"q-why\">焊盘编号要与原理图引脚号一一对应；放置时可自动递增，但复制粘贴出来的焊盘常需手工确认编号。D 也偏绝对：编号错了一般仍能转 PCB，只是引脚/网络对应错。\u003c/p>","source":"L03 p7 题4","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q6","ch":1,"no":"Q6","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">原理图中需要将两个不同图页上的 RESET_CTRL 信号电气连通。以下做法正确的是： ( )","options":[{"key":"A","html":"在两页各放置一个普通“网络标签”，名称相同即可"},{"key":"B","html":"在两页各放置一个“全局网络标签”，名称均为 RESET_CTRL"},{"key":"C","html":"使用电源符号 +3V3 代替 RESET_CTRL，因为电源符号默认全局"},{"key":"D","html":"在两页分别放置网络标签，并在PCB中用飞线手动连接"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">普通网络标签只在同页有效；跨页要用全局网络标签、网络端口或离图连接器。电源符号虽全局，但不能拿来代替信号名。\u003c/p>","source":"L09 p2 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q7","ch":1,"no":"Q7","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">网络标签只要放在导线附近，即使没有落在导线的电气连接点上，嘉立创EDA也会自动将其电气连接到该导线。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">ERC 基于网络表做逻辑检查，标签必须精确落在导线或引脚的电气连接点上；仅\"靠近\"不建立连接。\u003c/p>","source":"L09 p3 题6","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q8","ch":1,"no":"Q8","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA原理图中，两个网络标签在视觉上紧挨着同一条导线放置，但ERC仍报“网络仅有一个连接点（Net with only one pin）”。下列解释最准确的是（ ）","options":[{"key":"A","html":"ERC是基于视觉位置判断连接的，因此这一定是软件Bug"},{"key":"B","html":"ERC基于网络表（Netlist）进行逻辑检查；网络标签必须精确放置在导线的电气连接点上，或与另一标签的热点完全重合，仅“靠近”不会在网络表中建立连接"},{"key":"C","html":"只要导线颜色高亮，就说明标签已经建立了电气连接"},{"key":"D","html":"网络标签名称区分大小写，但大小写不一致只会报警告，不会导致“仅有一个连接点”"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">ERC 依据网络表判断：标签必须精确落在电气连接点或与另一标签热点重合，\"视觉上挨着\"不算连接。\u003c/p>","source":"L09 p8 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q9","ch":1,"no":"Q9","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">某设计在原理图中将一个LDO的VSS引脚连接到“地”符号，但该“地”符号的网络属性实际上是+5V（因合并网络后残留所致）。PCB导入后，该引脚焊盘网络变为+5V，而DRC全部通过。关于这一错误，下列判断正确的是（ ）","options":[{"key":"A","html":"这类错误源于原理图引脚或电源符号的网络属性被错误定义，DRC检查的是“已定义网络之间是否冲突”，不负责校验“网络定义本身是否符合设计意图”，因此可能在DRC全过的情况下直到调试才暴露"},{"key":"B","html":"只要在PCB中重新铺铜，该错误会自动纠正"},{"key":"C","html":"DRC未报错说明设计没有问题，该焊盘实际仍连接GND"},{"key":"D","html":"封装管理器会拦截所有网络属性错误，未拦截说明封装正确"}],"answer":"A","answerKey":"A","why":"\u003cp class=\"q-why\">DRC 只检查\"已定义网络之间是否冲突\"，不校验网络定义是否符合设计意图；这类错误只能靠人工核对原理图符号属性。\u003c/p>","source":"L09 p8 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q10","ch":1,"no":"Q10","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在原理图中，网络标签只要放在导线附近，即使没有精确落在电气连接点上，ERC也能识别为有效连接。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">与上一题同源：必须落在连接点，ERC 不看\"看起来近不近\"。\u003c/p>","source":"L09 p8 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q11","ch":1,"no":"Q11","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA专业版中，原理图上两个引脚之间已经画了导线，目视“连在一起”，但编译仍报“网络仅有一个连接点（Net with only one pin）”。以下原因中最不可能的是（ ）","options":[{"key":"A","html":"导线与引脚端点之间存在微小间隙，未形成实心连接圆点"},{"key":"B","html":"两个本应同名的网络标签大小写或标点不一致（如 VCC3.3 与 VCC_3.3）"},{"key":"C","html":"跨页连接时仅使用了普通网络标签，而未使用网络端口或离图连接器"},{"key":"D","html":"原理图中的导线颜色设置成了与背景相近的颜色，导致视觉上看不清"}],"answer":"D","answerKey":"D","why":"\u003cp class=\"q-why\">导线颜色接近背景只影响肉眼观察，不会改变电气连接；其余三项（微小间隙、标签名不一致、跨页用普通标签）都会真正导致网络表不连通。\u003c/p>","source":"L15 p3 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q12","ch":1,"no":"Q12","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于元件与封装的关联，以下做法在嘉立创EDA中不能建立有效逻辑绑定的是（ ）","options":[{"key":"A","html":"在原理图元件属性的 Footprint 字段中，通过右侧“…”按钮从工程封装库中选择目标封装"},{"key":"B","html":"将封装库中的封装图形直接拖拽到原理图元件符号上，使二者叠在一起"},{"key":"C","html":"在封装管理器中确认目标封装的状态为“已启用”并标记为“默认”"},{"key":"D","html":"对于自定义封装，先将其“添加到工程”并同步，再在元件属性中指定封装名"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">把封装图形拖到符号上只是视觉叠加，没有建立 Footprint 逻辑绑定；正确做法是在元件属性或封装管理器中指定。\u003c/p>","source":"L15 p3 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q13","ch":1,"no":"Q13","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA中，复制粘贴原理图模块后，若出现位号重复，可以使用“设计 → 分配位号”或“标注”功能对位号进行全局重新编号，而不必逐个手动修改。( )\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">复制粘贴模块造成位号重复时，用「设计 → 分配位号 / 标注」全局重编号，不必逐个改。\u003c/p>","source":"L15 p3 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q14","ch":2,"no":"Q14","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给图t2.png，利用立创EDA画出对应PCB图，显示对应二维、三维图，同时标注用户名与学号\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">要点：先导入网络表并核对封装，再布局布线；电源线加粗、加泪滴，二维/三维图与姓名学号一并提交；最后重建铺铜 + DRC。\u003c/p>","source":"L02 p11 题3","tags":["需对照原图"],"needsCheck":false,"points":["要点：先导入网络表并核对封装，再布局布线","电源线加粗、加泪滴，二维/三维图与姓名学号一并提交","最后重建铺铜 + DRC"]},{"id":"eda-Q15","ch":2,"no":"Q15","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给图t3.png，利用立创EDA画出对应PCB图，显示对应二维、三维图，同时标注用户名与学号，电源线粗细、泪滴与标注显示美观\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">要点：先导入网络表并核对封装，再布局布线；电源线加粗、加泪滴，二维/三维图与姓名学号一并提交；最后重建铺铜 + DRC。\u003c/p>","source":"L03 p12 题3","tags":["需对照原图"],"needsCheck":false,"points":["要点：先导入网络表并核对封装，再布局布线","电源线加粗、加泪滴，二维/三维图与姓名学号一并提交","最后重建铺铜 + DRC"]},{"id":"eda-Q16","ch":2,"no":"Q16","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给图t4.png，利用立创EDA画出对应4层PCB板，显示对应二维、三维图，同时标注用户名与学号，电源线粗细、泪滴与标注显示美观，对外接口要标注好。\u003c/span>\u003cbr>\u003cspan class=\"ln\">所有作业均要出现自己姓名与学号\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口。建议在提交前跑一次 DRC 并重建铺铜。\u003c/p>","source":"L03 p14 题3","tags":["需对照原图"],"needsCheck":false,"points":["按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口","建议在提交前跑一次 DRC 并重建铺铜"]},{"id":"eda-Q17","ch":2,"no":"Q17","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于立创EDA中导线线宽的优先级，以下说法正确的是（ ）","options":[{"key":"A","html":"设计规则中的线宽设置优先级最高"},{"key":"B","html":"导线对象自身的线宽属性优先级最高"},{"key":"C","html":"属性面板中的“跟随规则”优先级最高"},{"key":"D","html":"所有设置的优先级相同"}],"answer":"B（对象属性优先；设为\"跟随规则\"时按规则）","answerKey":"B","why":"\u003cp class=\"q-why\">原则是\"对象自身设置 > 全局规则\"，但当对象在属性面板选了\"跟随规则\"，就以设计规则为准。不同版本措辞略有差异，建议软件里实测一次。\u003c/p>","source":"L03 p5 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q18","ch":2,"no":"Q18","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在PCB布局时，对于晶振、滤波电容这类元件，通常的布局原则是（ ）","options":[{"key":"A","html":"随意放置，不影响性能"},{"key":"B","html":"尽量靠近主控芯片的对应引脚"},{"key":"C","html":"放在板子边缘，方便更换"},{"key":"D","html":"集中放置在电源输入附近"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">去耦电容、晶振要尽量靠近主控芯片对应引脚，缩短回流路径、减小寄生参数。\u003c/p>","source":"L03 p5 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q19","ch":2,"no":"Q19","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">立创EDA的铺铜操作中，如果铺铜后没有显示填充区域，最可能的原因是（ ）","options":[{"key":"A","html":"没有设置铺铜的颜色"},{"key":"B","html":"铺铜网络与焊盘网络不一致，被判定为孤岛移除"},{"key":"C","html":"铺铜层选错了"},{"key":"D","html":"没有开启3D预览"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">铺铜网络与焊盘网络不一致时，软件会把它当作孤岛（孤立铜皮）移除，看起来就是\"没铺上\"。\u003c/p>","source":"L03 p5 题4","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q20","ch":2,"no":"Q20","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在PCB布线时，若需要在顶层和底层之间切换走线，可以使用快捷键（），系统会自动添加过孔。( )","options":[{"key":"A","html":"T 和 B"},{"key":"B","html":"+ 和 -"},{"key":"C","html":"Shift + W"},{"key":"D","html":"L"}],"answer":"A（T / B）","answerKey":"A","why":"\u003cp class=\"q-why\">按 T（顶层）或 B（底层）切换布线层时，软件会自动插入过孔连通两层。Shift+W 是快速改线宽。\u003c/p>","source":"L03 p7 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q21","ch":2,"no":"Q21","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">立创EDA布线时，若想快速切换导线宽度，可以使用快捷键______。\u003c/span>","options":[],"answer":"Shift+W","answerKey":"","why":"\u003cp class=\"q-why\">Shift+W 调出线宽选择；切换层用 T/B。两者容易混，按\"W=Width、T/B=Top/Bottom\"记。\u003c/p>","source":"L03 p7 题5","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q22","ch":2,"no":"Q22","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给图t5.png，利用立创EDA画出合理的4层PCB板，显示对应二维、三维图，同时标注用户名与学号，电源线粗细、泪滴与标注显示美观，对外接口要标注好。\u003c/span>\u003cbr>\u003cspan class=\"ln\">所有作业均要出现自己姓名与学号\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口。建议在提交前跑一次 DRC 并重建铺铜。\u003c/p>","source":"L05 p12 题4","tags":["需对照原图"],"needsCheck":false,"points":["按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口","建议在提交前跑一次 DRC 并重建铺铜"]},{"id":"eda-Q23","ch":2,"no":"Q23","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA多层板中，用于连通各层之间印制导线的公共孔称为？ ( )","options":[{"key":"A","html":"焊盘"},{"key":"B","html":"过孔"},{"key":"C","html":"定位孔"},{"key":"D","html":"安装孔"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">过孔（Via）贯通各层；定位孔、安装孔是机械孔，焊盘是元件引脚。\u003c/p>","source":"L05 p4 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q24","ch":2,"no":"Q24","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在多层板布局布线流程中，以下哪项操作应在布线之前完成？( )","options":[{"key":"A","html":"erber文件"},{"key":"B","html":"DRC检查"},{"key":"C","html":"图层规划与板框设置"},{"key":"D","html":"丝印调整"}],"answer":"C","answerKey":"C","why":"\u003cp class=\"q-why\">先做图层规划与板框设置，再布局布线；导出 Gerber、DRC、丝印调整都在后面。\u003c/p>","source":"L05 p4 题5","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q25","ch":2,"no":"Q25","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在布线过程中需要切换层时，立创EDA专业版会自动添加______，以连通不同层之间的导线。\u003c/span>","options":[],"answer":"过孔（Via）","answerKey":"","why":"\u003cp class=\"q-why\">切换布线层时软件自动插入过孔，把顶层与底层的导线在电气上连通。\u003c/p>","source":"L05 p7 题6","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q26","ch":2,"no":"Q26","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给图t6.png，利用立创EDA画出合理布局的6层PCB板，显示对应二维、三维图，同时标注用户名与学号，电源线粗细、泪滴与标注显示美观，对外接口要标注好。\u003c/span>\u003cbr>\u003cspan class=\"ln\">所有作业均要出现自己姓名与学号\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口。建议在提交前跑一次 DRC 并重建铺铜。\u003c/p>","source":"L06 p12 题4","tags":["需对照原图"],"needsCheck":false,"points":["按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口","建议在提交前跑一次 DRC 并重建铺铜"]},{"id":"eda-Q27","ch":2,"no":"Q27","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">某双层板器件布局密集，默认安全间距规则下信号线无法扇出，反复DRC报间距错误。以下处理方式中，最合理的是( )","options":[{"key":"A","html":"将设计规则中的安全间距直接改为0，先布通再改回"},{"key":"B","html":"在不低于板厂工艺能力且留有余量的前提下，适度减小安全间距与默认线宽"},{"key":"C","html":"关闭DRC检查，完成布线后直接导出Gerber"},{"key":"D","html":"将所有信号线宽度统一改为最小线宽，不调整间距规则"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">改规则不能突破工艺下限：应在不低于板厂能力且留余量的前提下，适度减小安全间距与默认线宽。改 0、关 DRC、只改线宽不调间距都是掩耳盗铃。\u003c/p>","source":"L09 p2 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q28","ch":2,"no":"Q28","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">PCB中某个GND焊盘旁有丝印字符压住焊盘，DRC报“丝印压焊盘”。关于这一错误的处理，以下判断正确的是：( )","options":[{"key":"A","html":"丝印压焊盘是致命电气错误，必须删除整个封装重新设计"},{"key":"B","html":"嘉立创在制造时会默认掏掉露铜区域上方的丝印，但设计阶段仍应尽量移动丝印以避免歧义"},{"key":"C","html":"丝印错误与电气连接无关，因此可以在所有项目中无条件忽略"},{"key":"D","html":"只要在DRC中关闭“丝印重叠”检查，丝印就会自动避让焊盘"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">丝印压焊盘不是致命电气错误；制造端通常会掏掉露铜区上方的丝印，但设计阶段仍应移动丝印避免歧义。\u003c/p>","source":"L09 p3 题4","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q29","ch":2,"no":"Q29","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA中，修改了元件布局或走线后，铺铜不会自动更新。对全部铺铜（包括内电层）执行重建的快捷键是 ________。\u003c/span>","options":[],"answer":"常用 Shift+B（以软件版本为准）","answerKey":"","why":"\u003cp class=\"q-why\">嘉立创 EDA 专业版里\"重建全部铺铜\"常用 Shift+B；也可在铺铜管理器中右键重建。记住动作名称比记快捷键更稳。\u003c/p>","source":"L09 p3 题5","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q30","ch":2,"no":"Q30","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA中为多层板设置阻抗规则时，以下关于参考平面的说法，正确的是( )","options":[{"key":"A","html":"只要在阻抗计算器中选择了某一层作为参考层，实际制造中该层就会自动保证完整参考，无需检查布线区域"},{"key":"B","html":"只有地层可以作为阻抗参考层，电源层因噪声较大不能作为参考"},{"key":"C","html":"参考层对应位置必须是实心铜皮覆盖，若该区域被走线或过孔切割，实际阻抗会偏离计算值"},{"key":"D","html":"顶层走阻抗线时，必须将顶层铺铜完全去除，否则参考平面效应会消失"}],"answer":"C","answerKey":"C","why":"\u003cp class=\"q-why\">阻抗线要求参考层对应位置是完整实心铜皮；被走线或过孔切割后回流路径断裂，实测阻抗就偏离计算值。\u003c/p>","source":"L10 p2 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q31","ch":2,"no":"Q31","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给图t10.png，利用立创EDA画出合理的4层PCB板，显示对应二维、三维图，同时标注用户名与学号，电源线粗细、泪滴与标注显示美观，对外接口要标注好。\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口。建议在提交前跑一次 DRC 并重建铺铜。\u003c/p>","source":"L13 p5 题3","tags":["需对照原图"],"needsCheck":false,"points":["按要求完成：画原理图或 PCB → 显示二维/三维图 → 标注姓名学号 → 电源线加粗、加泪滴、标注对外接口","建议在提交前跑一次 DRC 并重建铺铜"]},{"id":"eda-Q32","ch":3,"no":"Q32","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA中合并两块铜皮时，以下哪项条件是必须满足的？（ ）","options":[{"key":"A","html":"铜皮颜色相同"},{"key":"B","html":"铜皮绘制时间相近"},{"key":"C","html":"铜皮大小一致"},{"key":"D","html":"铜皮处于同一网络（Net）"}],"answer":"D","answerKey":"D","why":"\u003cp class=\"q-why\">同网络是合并的必要条件；颜色、时间、大小都不是。\u003c/p>","source":"L05 p7 题4","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q33","ch":3,"no":"Q33","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA中进行铜皮合并时，除了确保同一网络外，还需检查两块铜皮的______属性是否一致。\u003c/span>","options":[],"answer":"所在层（Layer）与优先级/填充属性","answerKey":"","why":"\u003cp class=\"q-why\">同一网络之外还要在同一层，且铺铜优先级、填充样式一致，否则合并后行为不可预期。\u003c/p>","source":"L05 p7 题5","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q34","ch":3,"no":"Q34","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA中完成GND铺铜后，拖动了一个GND焊盘的位置，发现原本“连上”的铺铜处出现飞线或DRC“孤立铜皮”报错。根本原因是：( )","options":[{"key":"A","html":"铺铜网络属性被自动改为了“No Net”"},{"key":"B","html":"嘉立创EDA的铺铜不会在布局/走线修改后自动重算，必须手动重建"},{"key":"C","html":"拖动焊盘会删除该焊盘上的所有网络信息"},{"key":"D","html":"飞线显示本身就是铺铜已断开的电气证明"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">铺铜是\"算出来\"的静态结果，布局/走线改动后不会自动重算，必须手动重建铺铜，否则出现飞线或孤立铜皮。\u003c/p>","source":"L09 p2 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q35","ch":4,"no":"Q35","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">以下哪项不属于立创EDA设计规则（DRC）中可配置的检查项？( )","options":[{"key":"A","html":"线宽"},{"key":"B","html":"间距"},{"key":"C","html":"元件颜色"},{"key":"D","html":"孔外径"}],"answer":"C","answerKey":"C","why":"\u003cp class=\"q-why\">线宽、间距、孔外径都是可配置 DRC 项；元件颜色只是显示属性，不属于电气/制造规则。\u003c/p>","source":"L03 p7 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q36","ch":5,"no":"Q36","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA中设置多层板层数与叠层参数的正确操作路径是？( )","options":[{"key":"A","html":"设计 → 规则设置"},{"key":"B","html":"工具 → 图层管理器"},{"key":"C","html":"视图 → 面板设置"},{"key":"D","html":"布线 → 层设置"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">工具 → 图层管理器里设置层数、叠层顺序与层属性。\u003c/p>","source":"L05 p4 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q37","ch":5,"no":"Q37","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于嘉立创EDA中盲埋孔的设置，下列说法正确的是？( )","options":[{"key":"A","html":"单层板即可添加盲埋孔"},{"key":"B","html":"设置盲埋孔前需在规则设置中添加"},{"key":"C","html":"盲孔是指内层之间的导通孔"},{"key":"D","html":"埋孔的表底层均可见"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">盲孔是表层到内层、埋孔是内层到内层（表底层看不到）；设置前需在规则/层叠中添加层对，单层板谈不上盲埋孔。\u003c/p>","source":"L05 p4 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q38","ch":5,"no":"Q38","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">嘉立创EDA专业版中，内电层采用哪种绘制方式？( )","options":[{"key":"A","html":"正片绘制"},{"key":"B","html":"负片绘制"},{"key":"C","html":"混合绘制"},{"key":"D","html":"自动生成"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">内电层用负片：默认整层铺铜，画线处清除铜做隔离。\u003c/p>","source":"L05 p4 题4","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q39","ch":5,"no":"Q39","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA多层板设计中，用于连接表层和内层而不贯通整板的导通孔称为___。\u003c/span>","options":[],"answer":"盲孔（Blind Via）","answerKey":"","why":"\u003cp class=\"q-why\">只连表层与内层、不贯穿整板的是盲孔；只连内层之间的是埋孔。\u003c/p>","source":"L05 p4 题6","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q40","ch":5,"no":"Q40","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">在多层板图层管理器中隐藏某个层，该层的元素在导出Gerber时也会被自动排除。（ ）\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">隐藏只是显示控制；导出哪些层由 Gerber 输出设置决定，隐藏层照样可能被导出。\u003c/p>","source":"L05 p4 题7","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q41","ch":5,"no":"Q41","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在立创EDA专业版中，内电层（Internal Plane）的绘制方式是（ ）","options":[{"key":"A","html":"正片方式，画线处保留铜"},{"key":"B","html":"负片方式，画线处清除铜"},{"key":"C","html":"与信号层完全相同"},{"key":"D","html":"只能通过导入方式生成"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">负片方式：默认铺满铜，绘制折线的地方把铜清除。\u003c/p>","source":"L05 p7 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q42","ch":5,"no":"Q42","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">分割内电层时，应使用哪种图元来绘制分割线？（ ）","options":[{"key":"A","html":"导线（Wire）"},{"key":"B","html":"填充"},{"key":"C","html":"圆弧"},{"key":"D","html":"折线（Polyline）"}],"answer":"D","answerKey":"D","why":"\u003cp class=\"q-why\">用折线（Polyline）画闭合隔离带；普通导线 Wire 带网络属性，不适合做分割线。\u003c/p>","source":"L05 p7 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q43","ch":5,"no":"Q43","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">立创EDA专业版最多支持的铜箔层数是（ ）","options":[{"key":"A","html":"16层"},{"key":"B","html":"24层"},{"key":"C","html":"32层"},{"key":"D","html":"64层"}],"answer":"C（32 层，以软件版本为准）","answerKey":"C","why":"\u003cp class=\"q-why\">专业版常见上限为 32 层；这类\"最多多少层\"的题以当前软件版本说明为准。\u003c/p>","source":"L05 p7 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q44","ch":5,"no":"Q44","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA专业版中，打开图层管理器的默认快捷键是（ ）","options":[{"key":"A","html":"Ctrl + M"},{"key":"B","html":"Ctrl + L"},{"key":"C","html":"Shift + L"},{"key":"D","html":"Alt + L"}],"answer":"B（Ctrl+L）","answerKey":"B","why":"\u003cp class=\"q-why\">Ctrl+L 打开图层管理器；Shift+W 改线宽、T/B 切换层，别混。\u003c/p>","source":"L06 p6 题1","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q45","ch":5,"no":"Q45","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于内电层的正负片属性，以下说法正确的是（ ）","options":[{"key":"A","html":"内电层以正片方式绘制，默认无铜，绘制导线即为铜线"},{"key":"B","html":"内电层以负片方式绘制，默认铺满铜，绘制折线的地方铜被清除"},{"key":"C","html":"内电层以正片方式绘制，生成Gerber时自动转为负片"},{"key":"D","html":"内电层以负片方式绘制，生成Gerber时也以负片方式输出"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">编辑时负片（画线清铜），生成 Gerber 时转成正片输出，所以选\"Gerber 也是负片\"是错的。\u003c/p>","source":"L06 p6 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q46","ch":5,"no":"Q46","kind":"fill","group":"objective","stem":"\u003cspan class=\"ln\">在嘉立创EDA中，PCB的铜箔层数必须是________数，顶层和底层是默认铜箔层，无法被________。\u003c/span>","options":[],"answer":"偶数；顶层和底层无法被删除","answerKey":"","why":"\u003cp class=\"q-why\">可增删的是中间层，铜箔层数保持偶数；顶层、底层是默认层不能删除。\u003c/p>","source":"L06 p6 题4","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q47","ch":6,"no":"Q47","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于立创商城元器件的“生命周期状态”，选型时应优先选择（ ）","options":[{"key":"A","html":"停产（EOL）的型号，因为价格便宜"},{"key":"B","html":"处于成长期或成熟期的型号"},{"key":"C","html":"刚发布的新品，性能一定最好"},{"key":"D","html":"即将停产的型号，趁还能买到"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">选型优先成长期/成熟期型号；EOL（停产）、即将停产、刚发布新品都有供货或验证风险。\u003c/p>","source":"L03 p9 题7","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q48","ch":6,"no":"Q48","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">以下关于立创商城元器件耐压值选择的说法，正确的是（ ）","options":[{"key":"A","html":"耐压值只要高于电路工作电压即可，无需留余量"},{"key":"B","html":"对于5V电路，应选择耐压值2倍以上（如10V或16V）的电容-11"},{"key":"C","html":"耐压值越高越好，不需要考虑成本"},{"key":"D","html":"电解电容不需要关注耐压值"}],"answer":"B","answerKey":"B","why":"\u003cp class=\"q-why\">5V 电路通常选耐压 2 倍以上（10V 或 16V）的电容；\"刚好高于工作电压\"不留余量，电解电容同样要看耐压。\u003c/p>","source":"L03 p9 题8","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q49","ch":6,"no":"Q49","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">嘉立创EDA的内电层在绘制时采用负片方式，但在输出制造文件Gerber时采用正片方式输出。（ ）\u003c/span>","options":[],"answer":"√","answerKey":"√","why":"\u003cp class=\"q-why\">编辑视图用负片方便画隔离带，制造文件必须转成正片，板厂才能按\"有线即有铜\"生产。\u003c/p>","source":"L06 p6 题5","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q50","ch":6,"no":"Q50","kind":"choice","group":"objective","stem":"\u003cspan class=\"ln\">关于嘉立创EDA内电层（负片层）的分割操作，以下最容易导致“设计时看起来连通、制造后却短路”的做法是( )","options":[{"key":"A","html":"使用折线（无网络特性的线条）绘制隔离带，并确保每个分割区域形成闭合回路"},{"key":"B","html":"分割线宽度设置为8 mil，以节省内层空间"},{"key":"C","html":"为每个分割区块分别指定正确的网络"},{"key":"D","html":"分割完成后不手动重建内电层，直接导出Gerber"}],"answer":"D","answerKey":"D","why":"\u003cp class=\"q-why\">分割后不手动重建内电层就导出，旧铜皮数据会被带进 Gerber，可能把本该隔离的两块网络连在一起。\u003c/p>","source":"L10 p2 题2","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q51","ch":6,"no":"Q51","kind":"judge","group":"objective","stem":"\u003cspan class=\"ln\">盲埋孔可以在嘉立创EDA专业版中设置和绘制，因此在嘉立创下单打样时，只要Gerber中包含盲埋孔层对，就一定能按盲埋孔制造。( )\u003c/span>","options":[],"answer":"×","answerKey":"×","why":"\u003cp class=\"q-why\">软件能画 ≠ 板厂能做。盲埋孔属于特殊工艺，下单时必须选择对应工艺并确认层对、价格与交期。\u003c/p>","source":"L10 p2 题3","tags":[],"needsCheck":false,"points":[]},{"id":"eda-Q52","ch":7,"no":"Q52","kind":"short","group":"written","stem":"\u003cspan class=\"ln\">根据所给T1电路图，利用立创EDA软件，画出其对应电路图，并列出其2维与3维图，电路图上必须列出自己的姓名与学号。\u003c/span>","options":[],"answer":"实验/绘图题","answerKey":"","why":"\u003cp class=\"q-why\">按要求完成：用立创 EDA 画原理图 → 指定封装 → 转 PCB 并布局布线 → 输出二维、三维图 → 图上标注姓名与学号。提交前跑 ERC/DRC。\u003c/p>","source":"L01 p13 题1","tags":[],"needsCheck":false,"points":["按要求完成：用立创 EDA 画原理图 → 指定封装 → 转 PCB 并布局布线 → 输出二维、三维图 → 图上标注姓名与学号","提交前跑 ERC/DRC"]}],"metaExtra":{"source":"《嘉立创 EDA 复习资料》52 题 · 8 个知识块"},"x":{"kicker":"JLCEDA · SCH / PCB / DRC / GERBER","tagline":"把课件里散落的 EDA 复习题整理成能直接背的主线","desc":"52 道题覆盖原理图与封装、布局布线、铺铜、DRC、层管理与内电层、Gerber 输出。每题给出“为什么”，并标注课件页码便于回查。","accent":"orange","exam":"选择 30 · 判断 7 · 填空 7 · 简答 5 · 实验/绘图 3","guide":[{"id":"e1","ch":1,"title":"原理图到 PCB：网络表在传递什么","clues":"问转换报错、更新 PCB、ERC 报“网络仅有一个连接点”","rule":"原理图与 PCB 之间靠网络表（Netlist）传递连接关系；ERC 基于网络表做逻辑检查，不看“看起来连没连”","steps":[{"ask":"从原理图到 PCB 的完整链路有哪几步？","ref":"画原理图 → 指定封装 → 编译 ERC → 设计/更新到 PCB → 布局 → 布线 → 铺铜 → DRC → Gerber。"},{"ask":"“封装名未通过封装管理器指定过”说明缺了什么？","ref":"缺 Footprint 逻辑绑定，应到封装管理器或元件属性里指定封装。"},{"ask":"ERC 报“网络仅有一个连接点”，先查哪三处？","ref":"导线与引脚是否有间隙；标签是否精确落在连接点；跨页是否用了全局标签/端口。"}],"trap":"把“视觉上挨着”当成电气连接；网络改名后不检查走线归属。","example":{"q":"两个网络标签紧挨导线，ERC 仍报只有一个连接点，为什么？","a":"ERC 依据网络表，标签没有精确落在电气连接点，网络表里就没有建立连接。"}},{"id":"e2","ch":1,"title":"封装绑定：逻辑绑定不是视觉叠加","clues":"问 Footprint 字段、封装管理器、位号重复","rule":"有效绑定=元件属性 Footprint 指定 / 封装管理器启用并设为默认；把封装图形拖到符号上只是视觉重叠","steps":[{"ask":"建立封装的两种有效入口是什么？","ref":"元件属性 Footprint 字段（从工程/系统库选）；封装管理器确认“已启用+默认”。"},{"ask":"自定义封装要先做什么？","ref":"先“添加到工程”并同步，再在元件属性中指定封装名。"},{"ask":"复制粘贴导致位号重复，怎么处理？","ref":"设计 → 分配位号/标注，全局重编号，不必逐个改。"}],"trap":"拖拽封装图形叠在符号上就以为绑定了；位号重复不重编。","example":{"q":"把封装图形拖到原理图符号上，能建立绑定吗？","a":"不能，只是视觉叠加，不产生 Footprint 逻辑绑定。"}},{"id":"e3","ch":2,"title":"布局与布线原则","clues":"问晶振/去耦电容放哪、电源线怎么走、切换层快捷键、线宽优先级","rule":"晶振与去耦电容靠近主控对应引脚；电源线加粗、加泪滴；T/B 切层自动加过孔；Shift+W 改线宽","steps":[{"ask":"布局先放谁？晶振、去耦电容应该离什么最近？","ref":"先放连接器与主控，再放外围；晶振与去耦电容紧靠主控对应引脚，缩短回流路径。"},{"ask":"布线时电源与地为什么要加粗？","ref":"载流与压降：线宽不足会发热、压降大；电源地尽量短而粗，必要时铺铜。"},{"ask":"T/B 与 Shift+W 分别做什么？","ref":"T/B 切换顶层/底层并自动加过孔；Shift+W 调线宽。"}],"trap":"去耦电容放在板边“整齐好看”；为布通把安全间距改 0。","example":{"q":"双层板信号线扇出困难，最合理的处理是？","a":"在不低于板厂工艺且留余量的前提下，适度减小间距与线宽；不能改 0 或关 DRC。"}},{"id":"e4","ch":3,"title":"铺铜的四条铁律","clues":"问铺铜不显示、铜皮不能合并、飞线/孤岛、修改后是否自动更新","rule":"必须指定网络；网络不一致会被当孤岛移除；改布局走线后要手动重建；合并需同网络、同层、同优先级","steps":[{"ask":"铺铜后没有填充，最先查什么？","ref":"铺铜网络与焊盘网络是否一致；不一致会被判为孤岛移除。"},{"ask":"改了布局或走线，铺铜会自动重算吗？","ref":"不会，必须手动“重建/重新铺铜”，否则飞线、孤岛、DRC 报错都来了。"},{"ask":"两块铜皮能合并的前提是什么？","ref":"同一网络，并检查所在层、优先级/填充属性一致。"}],"trap":"改完板子直接导 Gerber，不重建铺铜。","example":{"q":"铺铜后看不到铜皮，最可能原因？","a":"铺铜网络与焊盘网络不一致，被当作孤岛移除。"}},{"id":"e5","ch":5,"title":"内电层：负片与分割","clues":"问内电层画线是加铜还是清铜、如何分割、隐藏层是否导出","rule":"内电层是负片：默认整层铺铜，“画线”是把铜清掉做隔离；分割用折线画闭合隔离带并指定网络；导出 Gerber 转正片","steps":[{"ask":"负片是什么意思？在内电层画一条线，实际发生什么？","ref":"默认整层是铜；画线处清除铜，形成隔离带。"},{"ask":"分割内电层用什么工具？画完还要做什么？","ref":"用折线（Polyline）画闭合隔离带，给每个区指定网络，然后手动重建内电层。"},{"ask":"隐藏某个层，是否等于它不导出？","ref":"不等于。隐藏只是显示控制，导出内容由 Gerber 层设置决定。"}],"trap":"把负片当正片；分割后不重建；以为隐藏层就不导出。","example":{"q":"内电层分割后导出 Gerber 前必须做什么？","a":"手动重建内电层，确认每个分割区网络正确。"}},{"id":"e6","ch":4,"title":"DRC 能查什么、不能查什么","clues":"问 DRC 全过是否代表设计正确、网络属性错误为何查不出","rule":"DRC 查已定义网络之间的冲突（线宽、间距、孔外径、丝印压焊盘、未连接、短路）；不校验网络定义是否符合设计意图","steps":[{"ask":"DRC 检查的对象是什么？","ref":"已定义网络之间的几何/电气冲突，以及未连接、短路等规则违例。"},{"ask":"把 GND 符号的网络属性错设成 +5V，DRC 会报吗？","ref":"不会。网络定义本身错了，但网络之间没有冲突，DRC 全过，直到调试才暴露。"},{"ask":"所以“DRC 全过”能推出什么？","ref":"只能说明没有违反已设规则，不能说明网络定义、封装、极性都正确。"}],"trap":"把 DRC 当设计正确性的充分条件；为布通关 DRC。","example":{"q":"为什么 DRC 全过仍可能板子不工作？","a":"网络属性/封装/极性等设计意图错误不在 DRC 检查范围内。"}},{"id":"e7","ch":6,"title":"Gerber 与制造输出","clues":"问导出哪些层、钻孔文件、阻焊/钢网、隐藏层是否影响","rule":"Gerber 按层设置导出：铜层、阻焊、丝印、钻孔（Excellon）；内电层输出转正片；隐藏层不影响导出","steps":[{"ask":"一块双层板至少要导出哪些文件？","ref":"顶层/底层铜、顶层/底层阻焊、丝印、钻孔文件，必要时钢网与装配图。"},{"ask":"内电层在 Gerber 里是正片还是负片？","ref":"输出时转成正片，制造厂按正片加工。"},{"ask":"导出前最后两件事是什么？","ref":"重建铺铜/内电层，跑一次 DRC 并确认无未连接。"}],"trap":"只导铜层漏钻孔；隐藏层后以为不导出；不重建铺铜就导出。","example":{"q":"导出 Gerber 前必须确认哪两件事？","a":"铺铜/内电层已重建，DRC 无未连接与间距错误。"}}],"formula":[{"title":"IPC-2221 线宽估算","q":"2 A 电流、允许温升 10 ℃、1 oz 外层铜，线宽约多少？","steps":["截面积 A=(I/(k·ΔT^0.44))^(1/0.725)，外层 k=0.048。","代入 I=2、ΔT=10：A≈42.3 mil²。","1 oz 铜厚≈1.378 mil，宽度=42.3/1.378≈30.7 mil。","换算公制：30.7×0.0254≈0.78 mm。"],"final":"约 0.78 mm；工程上再留 20% 余量，取 1 mm。"},{"title":"铜线电阻","q":"长 50 mm、宽 0.5 mm、1 oz 铜的走线电阻？","steps":["1 oz 铜厚≈35 μm=0.035 mm。","截面积=0.5×0.035=0.0175 mm²。","ρ=1.72×10⁻⁸ Ω·m=0.0172 Ω·mm²/m。","R=ρL/S=0.0172×0.05/0.0175≈0.049 Ω。"],"final":"约 49 mΩ；大电流路径要加宽或并层。"},{"title":"过孔载流","q":"0.3 mm 孔径、25 μm 镀铜的过孔，能过多大电流？","steps":["镀铜环截面积≈周长×镀层厚=π×0.3×0.025≈0.0236 mm²。","按 1 A/0.1 mm² 的保守经验，约 0.24 A。","工程上常按 0.5–1 A/过孔估算并多打过孔并联。"],"final":"保守约 0.2–0.3 A/孔；大电流多打孔并联。"}],"project":{"name":"四层板叠层与层规划","desc":"给一块 1.6 mm 四层板做叠层：信号—地—电源—信号，确定铜厚与内层数。","steps":[{"ask":"四层板的内层有几层？（填整数）","unit":"","value":2,"hint":"四层=顶层+2 个内层+底层，内层 2 层。"},{"ask":"1 oz 铜对应的厚度是多少微米？（填整数）","unit":"μm","value":35,"hint":"1 oz 铜≈35 μm（更精确 34.8）。"},{"ask":"板厚 1.6 mm、四层，若铜厚合计 0.14 mm，介质总厚约多少 mm？（保留一位小数）","unit":"mm","value":1.5,"hint":"1.6−0.14≈1.46，取 1.5 mm 分配介质。"}]},"lab":{"title":"PCB 工程实验室","desc":"8 个常用估算与核对：载流线宽、过孔、走线压降、电源线压降、微带阻抗、拼板利用率、单位换算、板厂工艺核对。"},"projects":[{"id":"stack4","name":"四层板叠层与层规划","desc":"给一块 1.6 mm 四层板做叠层：信号—地—电源—信号，确定铜厚与内层数。","steps":[{"ask":"四层板的内层有几层？（填整数）","unit":"层","value":2,"tol":0.001,"hint":"四层 = 顶层 + 2 个内层 + 底层。"},{"ask":"1 oz 铜对应的厚度是多少微米？（填整数）","unit":"μm","value":35,"tol":0.001,"hint":"1 oz 铜约 35 μm（更精确 34.8）。"},{"ask":"板厚 1.6 mm、四层，铜厚合计 0.14 mm，介质总厚约多少 mm？（保留一位小数）","unit":"mm","value":1.5,"tol":0.05,"hint":"1.6 − 0.14 ≈ 1.46，工程上按 1.5 mm 分配介质。"}]},{"id":"ldo","name":"电源入口与 LDO 散热","desc":"5 V 输入、3.3 V / 0.8 A 输出，LDO 压差 1.1 V、θJA=50 ℃/W、环境 40 ℃。先算余量，再算功耗与结温。","steps":[{"ask":"压差余量 = Vin − Vout − dropout，等于多少 V？","unit":"V","value":0.6,"tol":0.01,"hint":"5 − 3.3 − 1.1 = 0.6 V；输入跌落时余量会更小。"},{"ask":"LDO 自身功耗 Pd = (Vin−Vout)×I，等于多少 W？","unit":"W","value":1.36,"tol":0.01,"hint":"(5−3.3)×0.8 = 1.36 W，已经需要认真考虑散热。"},{"ask":"结温 Tj = TA + Pd×θJA，等于多少 ℃？","unit":"℃","value":108,"tol":0.5,"hint":"40 + 1.36×50 = 108 ℃，低于 125 ℃ 但余量不大。"}]},{"id":"xtal","name":"晶振与去耦布局","desc":"8 MHz 晶振 CL=12 pF、寄生电容 3 pF；按“晶振走线≤5 mm、去耦电容≤2 mm”的课堂规则检查布局。","steps":[{"ask":"两颗负载电容各取多少 pF？公式 C=2×(CL−Cstray)。","unit":"pF","value":18,"tol":0.1,"hint":"2×(12−3)=18 pF，两颗都取 18 pF。"},{"ask":"若换成 CL=10 pF 的晶振，负载电容变为多少 pF？","unit":"pF","value":14,"tol":0.1,"hint":"2×(10−3)=14 pF。"},{"ask":"晶振走线画了 8 mm，超出 5 mm 规则多少 mm？","unit":"mm","value":3,"tol":0.01,"hint":"8−5=3 mm，应把晶振挪近 MCU 并缩短走线。"}]},{"id":"usb","name":"USB 差分对与长度匹配","desc":"USB 2.0 HS：差分阻抗 90 Ω，对内长度差控制；FR-4 上传播延迟约 7 ps/mm。","steps":[{"ask":"90 Ω 差分阻抗，单端等效目标约多少 Ω？（填整数）","unit":"Ω","value":45,"tol":0.1,"hint":"差分 90 Ω 常按单端 45 Ω 估算，最终以阻抗计算/板厂为准。"},{"ask":"对内长度差 0.5 mm，对应约多少 ps 的偏斜？","unit":"ps","value":3.5,"tol":0.05,"hint":"0.5×7=3.5 ps。"},{"ask":"若允许偏斜 ≤5 ps，最大长度差约多少 mm？（保留两位小数）","unit":"mm","value":0.71,"tol":0.01,"hint":"5÷7≈0.714 mm，取 0.71 mm。"}]},{"id":"z50","name":"50 Ω 微带线阻抗控制","desc":"介质 h=0.2 mm、1 oz 铜、εr=4.4；用 IPC-2141 估算 50 Ω 线宽，并看介质厚度变化的影响。","steps":[{"ask":"目标 50 Ω 时，线宽约多少 mm？（保留两位小数）","unit":"mm","value":0.33,"tol":0.01,"hint":"交互实验室“微带阻抗”给出的结果约 0.330 mm。"},{"ask":"若介质厚度改为 0.3 mm，50 Ω 线宽约多少 mm？","unit":"mm","value":0.52,"tol":0.01,"hint":"h 增大，线宽也要增大，约 0.52 mm。"},{"ask":"线宽 0.2 mm、其余不变时，阻抗约多少 Ω？","unit":"Ω","value":65.5,"tol":0.2,"hint":"线宽偏窄，阻抗升到约 65.5 Ω，偏离 50 Ω 约 31%。"}]},{"id":"panel","name":"拼板与工艺边","desc":"100×80 mm 单板拼 300×300 mm 大板，板间距 2 mm，四边工艺边 5 mm。算数量、利用率和排列。","steps":[{"ask":"最多可拼几块？（填整数）","unit":"块","value":6,"tol":0.001,"hint":"(300−10+2)/(100+2)=2 列，(300−10+2)/(80+2)=3 行，共 6 块。"},{"ask":"面积利用率约多少 %？（保留一位小数）","unit":"%","value":53.3,"tol":0.2,"hint":"6×100×80 ÷ (300×300) ≈ 53.3%。"},{"ask":"按不旋转排列，列数是多少？（填整数）","unit":"列","value":2,"tol":0.001,"hint":"长边 100 mm 沿大板 300 mm 方向只能放 2 列。"}]},{"id":"gerber","name":"Gerber 与钻孔输出","desc":"双层板输出前核对：铜层、阻焊、丝印各上下两层，另加钻孔文件；并检查过孔环宽。","steps":[{"ask":"顶层/底层铜、阻焊、丝印合计多少个 Gerber 层？（填整数）","unit":"层","value":6,"tol":0.001,"hint":"铜 2 + 阻焊 2 + 丝印 2 = 6 层。"},{"ask":"这批输出需要几个钻孔文件？（填整数）","unit":"个","value":1,"tol":0.001,"hint":"同一套钻孔参数合并为 1 个 Excellon 文件。"},{"ask":"焊盘 0.6 mm、成品孔 0.3 mm，单边环宽多少 mm？","unit":"mm","value":0.15,"tol":0.005,"hint":"(0.6−0.3)/2=0.15 mm，低于常见 0.13 mm 下限就会报警。"}]},{"id":"via","name":"过孔、环宽与载流","desc":"0.3 mm 孔、25 μm 镀铜、1.6 mm 板厚；核对单孔电阻、3 A 电流所需孔数与环宽。","steps":[{"ask":"单孔电阻约多少 mΩ？（保留两位小数）","unit":"mΩ","value":1.17,"tol":0.02,"hint":"镀铜截面 π×0.3×0.025≈0.0236 mm²，R≈1.17 mΩ。"},{"ask":"按 1.8 A/孔估算，3 A 至少需要几个孔？（填整数）","unit":"个","value":2,"tol":0.001,"hint":"3÷1.8=1.67，向上取整为 2 个。"},{"ask":"焊盘 0.6 mm、孔 0.3 mm，单边环宽多少 mm？","unit":"mm","value":0.15,"tol":0.005,"hint":"(0.6−0.3)/2=0.15 mm。"}]},{"id":"plane","name":"内电层分割与平面压降","desc":"四层板 L3 分割 5 V / 3.3 V；5 V 平面走 2 A、50 mm、5 mm 宽、1 oz，核对内层数、隔离带与压降。","steps":[{"ask":"四层板的内层有几层？（填整数）","unit":"层","value":2,"tol":0.001,"hint":"L2 与 L3 为内层。"},{"ask":"内电层分割隔离带建议宽度是多少 mm？（本课规则）","unit":"mm","value":0.3,"tol":0.01,"hint":"课堂建议 0.3 mm 起，空间允许时用 0.4–0.5 mm。"},{"ask":"5 V 平面 2 A 时压降约多少 mV？（保留一位小数）","unit":"mV","value":9.8,"tol":0.1,"hint":"R=0.0172×50/(5×0.035)≈4.9 mΩ，ΔV=2×4.9≈9.8 mV。"}]}]}};</script>
<script>'use strict';
/* ================= 基础 ================= */
const C = window.COURSE, X = C.x || {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = s => String(s ?? '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
const pad = n => (n < 10 ? '0' + n : '' + n);
const fmtTime = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const sample = (a, n) => shuffle(a).slice(0, n);

const NS = 'sc:' + C.id + ':';

function norm(s) {
  return T(s).normalize('NFKC').toLowerCase()
    .replace(/<[^>]+>/g, '')
    .replace(/[\s。；;、，,．.·`'"]/g, '')
    .replace(/[（(]/g, '(').replace(/[）)]/g, ')')
    .replace(/[−–—]/g, '-')
    .replace(/×/g, 'x').replace(/÷/g, '/');
}
function doc(h) {
  let s = String(h || '');
  s = s.replace(/<table/g, '<div class="tablewrap"><table').replace(/<\/table>/g, '</table></div>');
  return s;
}

function paintRail() {
  const rail = $('#rail'); if (!rail) return;
  const obj = BANKS.objective;
  const done = obj.filter(q => R(q.id).ok).length;
  const star = C.bank.filter(q => R(q.id).star).length;
  const weak = C.bank.filter(q => R(q.id).status === 'weak').length;
  const last = store.get('last', '');
  const lq = last ? QBY.get(last) : null;
  const rs = obj.map(q => R(q.id)).filter(r => r.tries);
  const t = rs.reduce((s, r) => s + r.tries, 0), o = rs.reduce((s, r) => s + (r.ok || 0), 0);
  const acc = t ? Math.round(o / t * 100) : 0;
  rail.innerHTML = `
    <div class="k">Study Desk</div><h3>我的学习概览</h3>
    <div class="blk"><div class="big">${done}<small> / ${obj.length}</small></div><div class="q">客观题已独立答对</div>
      <div class="row"><span>答题正确率</span><b>${acc}%</b></div>
      <div class="row"><span>收藏原题</span><b>${star}</b></div>
      <div class="row"><span>大题自评通过</span><b>${BANKS.written.filter(q => R(q.id).status === 'ok').length} / ${BANKS.written.length}</b></div>
      <div class="row"><span>待补练</span><b>${weak}</b></div>
      <div class="row" style="border:0"><span>已交模拟卷</span><b>${EXAMS.length}</b></div>
    </div>
    <div class="blk"><div class="k">继续学习</div>
      <div class="q" style="margin-top:6px">${lq ? E((CH.get(lq.ch) || {}).title || '') + ' · ' + E(lq.no) : '还没有开始，先做一道客观题试试。'}</div>
      <a class="next" href="${lq ? '#/bank/objective?id=' + encodeURIComponent(lq.id) : '#/bank/objective'}">${lq ? '接着这一题 →' : '开始第一道题 →'}</a>
      <div class="mini"><a href="#/errors">错题分析</a><a href="#/exam">模拟考试</a><a href="#/report">学习报告</a></div>
    </div>
    <div class="blk"><div class="k">今日建议</div><div class="q" style="margin-top:6px">${suggest()}</div></div>`;
  const pct = obj.length ? Math.round(done / obj.length * 100) : 0;
  const sp = $('#sideMaster'), sb = $('#sideBar'), st = $('#sideProg');
  if (sp) sp.textContent = pct + '%';
  if (sb) sb.style.width = pct + '%';
  if (st) st.textContent = `已掌握 ${done} / ${obj.length}`;
}
function suggest() {
  const due = BANKS.objective.filter(q => { const r = R(q.id); return r.due && r.due <= Date.now(); }).length;
  const weak = C.bank.filter(q => R(q.id).status === 'weak').length;
  if (weak) return `有 ${weak} 道题标记为待补练，建议先做错题重练，再开新章。`;
  if (due) return `有 ${due} 道题到期，按 1/3/7 天节奏复测一遍最划算。`;
  const un = C.chapters.find(c => BANKS.objective.some(q => q.ch === c.n && !R(q.id).tries));
  return un ? `下一章建议：第 ${un.n} 章《${E(un.title)}》。先读知识讲解，再做随堂练习。` : '客观题已全部做过一遍，建议转大题专练，按评分点自评。';
}

let CURRENT = 'home';
function go(path) { if (location.hash === '#/' + path) route(); else location.hash = '#/' + path; }
function route() {
  const rawFull = location.hash.replace(/^#\/?/, '') || 'home';
  const raw = rawFull.split('?')[0];
  const [view, a, b] = raw.split('/');
  CURRENT = view + (a ? '/' + a : '');
  document.body.classList.remove('nav-open');
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  document.body.classList.toggle('bank', view === 'bank');
  const main = $('#main');
  window.speechSynthesis && speechSynthesis.cancel();
  const map = { home, learn, guide, voice, overview, drill, exam, review, errors, graph, library, notes, slides, lab, code, formula, project, path, report, challenge, community, flash, saved };
  if (view === 'bank') bankPage(a || 'objective'); else (map[view] || home)(a, b);
  paintRail();
  if (view !== 'learn') main.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => { mountShell(); route(); });
